t13.briefing: "On répète partout qu'un inconnu sur le Wi-Fi du café lit tout ce que tu fais. Vérifions. Pendant la semaine de sensibilisation, Ligne Rouge a capturé dix secondes du Wi-Fi invité de la cafétéria, avec l'accord affiché de tous ceux qui s'y connectaient. La capture est dans `captures/wifi-invites.pcap`."
t13.obj.seen: "Dire ce qu'un voisin de réseau voit vraiment"
t13.obj.clear: "Trouver l'appli qui parle encore en clair"
t13.obj.fix: "Choisir la parade"
t13.ada.brief: "Treizième entraînement. Une capture, c'est exactement ce que verrait quelqu'un de mal intentionné assis à la table d'à côté. On ne capture rien nous-mêmes : on lit ce qui a déjà été pris, avec l'accord de tous."
t13.ada.list: "Liste les paquets de la capture : `tshark -r captures/wifi-invites.pcap`."
t13.ada.list.standard: "Lis la capture avec `tshark`."
t13.ada.read: "Regarde ce qui est lisible. Les noms demandés au DNS, oui. Le nom du site dans chaque « Client Hello », oui. Mais après, ce ne sont que des « Application Data » : du chiffré, dont on ne connaît que la taille. Réponds à ma question."
t13.ada.read.standard: "Fais le tri entre ce qui se lit et ce qui ne se lit pas, puis réponds à ma question."
t13.ada.seen: "Voilà le mythe qui tombe : avec HTTPS, le voisin sait que tu vas sur ta banque, pas ce que tu y fais. Pas tout à fait rien, mais loin du « il voit tout ». Sauf une ligne, qui n'est pas comme les autres."
t13.ada.filter: "Une seule conversation n'est pas chiffrée. Affiche le HTTP en détail : `tshark -r captures/wifi-invites.pcap -Y http -V`."
t13.ada.filter.standard: "Filtre la capture sur le HTTP et déplie les paquets pour lire ce qui passe en clair."
t13.ada.http: "Le formulaire est lisible en entier. Quel numéro de carte l'appli envoie-t-elle ? Envoie-le avec `submit`."
t13.ada.http.standard: "Envoie le numéro de carte que l'appli laisse passer en clair."
t13.ada.card: "L'appli de la cantine, en HTTP simple, encore aujourd'hui. Le numéro de carte et l'appareil, lisibles par n'importe qui sur le réseau. Le Wi-Fi n'y est pour rien : c'est l'appli."
t13.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t13.ada.answer.standard: "Ma question t'attend dans la messagerie."
t13.ada.done: "C'est ça. Le vrai risque n'est plus l'écoute du contenu, c'est ce qui n'a jamais été chiffré, et le faux réseau qui se fait passer pour le vrai. Débrief."
t13.q.seen: "D'après cette capture, que voit une personne sur le même Wi-Fi quand un collègue consulte sa banque en HTTPS ?"
t13.q.seen.names: "Le nom du site, l'heure et la taille des échanges, mais pas le contenu."
t13.q.seen.password: "Le mot de passe tapé, puisque le Wi-Fi invité n'a pas de chiffrement."
t13.q.seen.password.why: "Regarde la conversation avec la banque : après la poignée de main, tout est « Application Data ». HTTPS chiffre de bout en bout, quel que soit le Wi-Fi."
t13.q.seen.nothing: "Rien du tout : HTTPS cache même le nom du site visité."
t13.q.seen.nothing.why: "Le nom passe en clair deux fois : dans la question au DNS et dans le « Client Hello » (SNI). Seule l'extension ECH, encore rare, le cache."
t13.q.fix: "Quelle parade règle vraiment le problème de l'appli de la cantine ?"
t13.q.fix.https: "Faire passer l'appli en HTTPS, pour qu'elle chiffre ses échanges partout."
t13.q.fix.vpn: "Imposer un VPN à chaque employé, sur tous les réseaux, cafétéria comprise."
t13.q.fix.vpn.why: "Ça cache l'échange sur ce Wi-Fi-là, mais l'appli reste en clair partout ailleurs, et chez chaque client qui n'a pas de VPN."
t13.q.fix.ban: "Interdire le Wi-Fi invité de la cafétéria."
t13.q.fix.ban.why: "L'appli enverrait la même chose en clair sur le réseau suivant. Le défaut est dans l'appli, pas dans le Wi-Fi."
t13.hint.seen.1: "`tshark -r captures/wifi-invites.pcap` liste les paquets. Compare ce qui est écrit dans la colonne de droite pour la banque."
t13.hint.seen.2: "Un nom dans « Client Hello (SNI=…) », puis seulement « Application Data » : le nom se voit, le contenu non."
t13.hint.clear.1: "`tshark -r captures/wifi-invites.pcap -Y http -V` montre le seul échange en HTTP, déplié."
t13.hint.clear.2: "Le champ « card » du formulaire : `submit CANT-2207`."
t13.debrief.title: "Le voisin de table n'est plus celui qu'on croit"
t13.debrief.lesson: "Sur un Wi-Fi public, HTTPS protège le contenu de presque tout ce qu'on fait : Google mesure entre 95 et 99 % des pages chargées en HTTPS. Ce qui reste visible, ce sont des métadonnées (quel site, quand, combien) et tout ce qu'une appli envoie encore sans chiffrement. Le défaut se corrige dans l'appli, pas en fuyant le Wi-Fi."
t13.debrief.p1: "Une appli ou un objet connecté doit chiffrer ses échanges partout, sans compter sur le réseau. HTTP simple, c'est un formulaire lisible par tous ceux qui passent."
t13.debrief.p2: "Le nom du site part en clair dans le DNS et dans le SNI. Le DNS chiffré et ECH (norme RFC 9849, 2026) le cachent peu à peu."
t13.debrief.p3: "Un VPN ajoute une couche sur un réseau qu'on ne connaît pas. Il ne répare pas une appli mal faite."
t13.home.p1: "Avant de taper un mot de passe, vérifie le cadenas et l'adresse dans la barre : le Wi-Fi n'y change rien, l'adresse si."
t13.home.p2: "Si ton navigateur te demande l'accord pour ouvrir un site « non sécurisé », refuse sur un réseau public."
