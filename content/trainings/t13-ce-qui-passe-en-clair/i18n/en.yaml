t13.briefing: "Everyone says a stranger on the café Wi-Fi reads everything you do. Let's check. During awareness week, Ligne Rouge captured ten seconds of the cafeteria's guest Wi-Fi, with the posted consent of everyone who joined it. The capture is in `captures/wifi-invites.pcap`."
t13.obj.seen: "Say what someone on the same network really sees"
t13.obj.clear: "Find the card number an app lets through in clear (send it with `submit`)"
t13.obj.fix: "Choose the fix"
t13.ada.brief: "Thirteenth training. A capture is exactly what someone ill-intentioned at the next table would see. We capture nothing ourselves: we read what was already taken, with everyone's consent."
t13.ada.list: "List the packets of the capture: `tshark -r captures/wifi-invites.pcap`."
t13.ada.list.standard: "Read the capture with `tshark`."
t13.ada.read: "Look at what can be read. The names asked to the DNS, yes. The site's name in each \"Client Hello\", yes. After that it is only \"Application Data\": encrypted, of which we know only the size. Answer my question."
t13.ada.read.standard: "Sort out what can be read from what cannot, then answer my question."
t13.ada.seen: "There goes the myth: with HTTPS, the neighbour knows you went to your bank, not what you did there. Not quite nothing, but far from \"they see everything\". Except for one line, which is not like the others."
t13.ada.filter: "Only one conversation is not encrypted. Show the HTTP in detail: `tshark -r captures/wifi-invites.pcap -Y http -V`."
t13.ada.filter.standard: "Filter the capture on HTTP and unfold the packets to read what travels in clear."
t13.ada.http: "The whole form can be read. Which card number does the app send? Send it with `submit`."
t13.ada.http.standard: "Send the card number the app lets through in clear."
t13.ada.card: "The canteen app, in plain HTTP, still today. The card number and the device, readable by anyone on the network. The Wi-Fi has nothing to do with it: it is the app."
t13.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t13.ada.answer.standard: "My question is waiting in the messages."
t13.ada.done: "That's it. The real risk is no longer someone reading the content; it is what was never encrypted, and the fake network posing as the real one. Debrief."
t13.q.seen: "From this capture, what does someone on the same Wi-Fi see when a colleague checks their bank over HTTPS?"
t13.q.seen.names: "The site's name, the time and the size of the exchanges, not their content."
t13.q.seen.password: "The password typed, since the guest Wi-Fi has no encryption of any kind."
t13.q.seen.password.why: "Look at the conversation with the bank: after the handshake, everything is \"Application Data\". HTTPS encrypts end to end, whatever the Wi-Fi."
t13.q.seen.nothing: "Nothing at all: HTTPS even hides the name of the site visited."
t13.q.seen.nothing.why: "The name travels in clear twice: in the DNS question and in the \"Client Hello\" (SNI). Only the ECH extension, still rare, hides it."
t13.q.fix: "Which fix really solves the canteen app's problem?"
t13.q.fix.https: "Move the app to HTTPS, so it encrypts its exchanges everywhere."
t13.q.fix.vpn: "Require a VPN for every employee, on every network, cafeteria included."
t13.q.fix.vpn.why: "It hides the exchange on this Wi-Fi, but the app stays in clear everywhere else, and for every customer without a VPN."
t13.q.fix.ban: "Ban the cafeteria's guest Wi-Fi."
t13.q.fix.ban.why: "The app would send the same thing in clear on the next network. The flaw is in the app, not in the Wi-Fi."
t13.hint.seen.1: "`tshark -r captures/wifi-invites.pcap` lists the packets. Compare what the right-hand column says for the bank."
t13.hint.seen.2: "A name in \"Client Hello (SNI=…)\", then only \"Application Data\": the name shows, the content does not."
t13.hint.clear.1: "`tshark -r captures/wifi-invites.pcap -Y http -V` shows the only HTTP exchange, unfolded."
t13.hint.clear.2: "The form's \"card\" field: `submit CANT-2207`."
t13.hint.fix.1: "What would protect the exchange on any network, not only this one?"
t13.debrief.title: "The person at the next table is not who you thought"
t13.debrief.lesson: "On public Wi-Fi, HTTPS protects the content of almost everything you do: Google measures 95 to 99% of page loads over HTTPS. What stays visible is metadata (which site, when, how much) and whatever an app still sends unencrypted. The flaw is fixed in the app, not by running away from Wi-Fi."
t13.debrief.p1: "An app or a connected device must encrypt its exchanges everywhere, without relying on the network. Plain HTTP is a form anyone passing by can read."
t13.debrief.p2: "The site's name travels in clear in the DNS and in the SNI. Encrypted DNS and ECH (standard RFC 9849, 2026) are slowly hiding it."
t13.debrief.p3: "A VPN adds a layer on a network you don't know. It does not repair a badly made app."
t13.home.p1: "Before typing a password, check the padlock and the address in the bar: the Wi-Fi changes nothing, the address does."
t13.home.p2: "If your browser asks your consent to open a \"not secure\" site, say no on a public network."
