t6.briefing: "NovaMind t'a ouvert un compte de test sur son application, kestrel-test. Ton navigateur garde un cookie de session qui ressemble à une suite de caractères sans queue ni tête. C'est un JWT : un format qui se lit sans clé. Voyons ce qu'il raconte sur toi."
t6.obj.decode: "Lire ce que transporte le jeton (flag)"
t6.obj.forge: "Comprendre ce qui empêche de le modifier"
t6.obj.content: "Savoir ce qu'on peut y mettre"
t6.ada.brief: "Sixième entraînement. Le cookie est copié dans `~/training/session.txt`. C'est le tien : aucune limite de mandat, on regarde seulement."
t6.ada.read: "Lis le fichier : `cat training/session.txt`."
t6.ada.read.standard: "Ouvre `training/session.txt`."
t6.ada.shape: "Trois morceaux séparés par des points, qui commencent par `eyJ` : c'est la marque d'un JWT, du JSON encodé en Base64. Pas besoin de clé pour le lire. Copie tout ce qui suit `nm_session=` et lis-le : `jwt decode <jeton>`."
t6.ada.shape.standard: "Trois morceaux séparés par des points : un format bien connu, qui se lit sans clé. Le terminal a une commande pour ça : `explain jwt`."
t6.ada.submit: "En-tête, charge utile, signature. Tout ce qui est dans la charge utile est lisible par n'importe qui. Un développeur y a même laissé un champ de débogage : envoie-le avec `submit`."
t6.ada.submit.standard: "La charge utile contient quelque chose qui ressemble à un flag. Envoie-le."
t6.ada.decoded: "Ton rôle, ta clinique, la date d'expiration, et un reste de débogage. Le jeton n'est pas chiffré : il est signé. Toute la question est là."
t6.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t6.ada.answer.standard: "Ma question t'attend dans la messagerie."
t6.ada.signed: "Oui. Si tu changes `client` en `admin`, la signature ne correspond plus, et un serveur qui la vérifie refuse le jeton. Les vraies failles arrivent quand il ne la vérifie pas, ou accepte l'algorithme `none`."
t6.ada.done: "Exactement. Un JWT est une carte postale signée : tout le monde peut la lire, personne ne peut la réécrire. Passe au débrief."
t6.q.forge: "La charge utile dit « role: client ». Qu'est-ce qui empêche quelqu'un de la réécrire en « admin » ?"
t6.q.forge.base64: "L'encodage en Base64, qui rend la charge utile illisible pour un humain."
t6.q.forge.base64.why: "Tu viens de la lire en une commande. Le Base64 change la forme, il ne protège rien."
t6.q.forge.signature: "La signature, faite avec la clé du serveur, s'il la vérifie à chaque fois."
t6.q.forge.exp: "Le champ « exp », qui fait expirer le jeton au bout de vingt-quatre heures."
t6.q.forge.exp.why: "L'expiration limite la durée d'un jeton volé. Elle n'empêche pas de modifier son contenu."
t6.q.forge.https: "Le HTTPS, qui chiffre le cookie entre le navigateur et le serveur."
t6.q.forge.https.why: "Le HTTPS protège le trajet. Ton propre navigateur, lui, voit le cookie en clair et peut le modifier."
t6.q.content: "Qu'est-ce qui peut aller dans la charge utile d'un JWT ?"
t6.q.content.nothing: "Rien qu'on ne voudrait pas montrer à l'utilisateur qui le porte : pas de secret, pas de donnée sensible."
t6.q.content.encrypted: "Tout, y compris des mots de passe, puisque la signature protège le contenu."
t6.q.content.encrypted.why: "La signature empêche de modifier, pas de lire. Ce qui est dans un JWT signé est public pour celui qui le porte."
t6.q.content.short: "Seulement des valeurs courtes, pour que le cookie ne dépasse pas la taille permise."
t6.q.content.short.why: "La taille compte, mais ce n'est pas le vrai critère : une valeur courte peut être un secret."
t6.hint.decode.1: "Le jeton commence après `nm_session=`. La commande `jwt decode` ne fait que le lire."
t6.hint.decode.2: "`jwt decode` suivi du jeton entier, puis `submit` avec la valeur du champ `debug`."
t6.debrief.title: "Signé n'est pas chiffré"
t6.debrief.lesson: "Un JWT se compose d'un en-tête, d'une charge utile et d'une signature. Les deux premiers sont du JSON en Base64 : lisibles par tous. La signature garantit seulement que le serveur a bien émis ce contenu, et seulement si le serveur la vérifie."
t6.debrief.p1: "Le serveur vérifie la signature de chaque jeton, avec un algorithme fixé de son côté : jamais celui que le jeton annonce, jamais `none`."
t6.debrief.p2: "La charge utile ne contient rien de secret : identifiant, rôle, expiration. Pas de mot de passe, pas de donnée personnelle, pas de reste de débogage."
t6.debrief.p3: "Des jetons courts, et un moyen de les révoquer : un jeton volé reste valide jusqu'à son expiration."
