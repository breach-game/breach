t6.briefing: "NovaMind opened a test account for you on its application, kestrel-test. Your browser keeps a session cookie that looks like a meaningless string. It is a JWT: a format that can be read without any key. Let's see what it says about you."
t6.obj.decode: "Read what the token carries (flag)"
t6.obj.forge: "Understand what stops anyone from changing it"
t6.obj.content: "Know what may go in it"
t6.ada.brief: "Sixth training. The cookie is copied in `~/training/session.txt`. It is yours: no mandate limit, we only look."
t6.ada.read: "Read the file: `cat training/session.txt`."
t6.ada.read.standard: "Open `training/session.txt`."
t6.ada.shape: "Three parts separated by dots, starting with `eyJ`: the signature of a JWT, JSON encoded in Base64. No key needed to read it. Copy everything after `nm_session=` and read it: `jwt decode <token>`."
t6.ada.shape.standard: "Three parts separated by dots: a well-known format, readable without a key. The terminal has a command for it: `explain jwt`."
t6.ada.submit: "Header, payload, signature. Everything in the payload can be read by anyone. A developer even left a debug field in it: send it with `submit`."
t6.ada.submit.standard: "The payload holds something that looks like a flag. Send it."
t6.ada.decoded: "Your role, your clinic, the expiry date, and a debug leftover. The token is not encrypted: it is signed. That is the whole point."
t6.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t6.ada.answer.standard: "My question is waiting in the messenger."
t6.ada.signed: "Yes. Change `client` into `admin` and the signature no longer matches, so a server that checks it refuses the token. Real flaws come when it does not check it, or accepts the `none` algorithm."
t6.ada.done: "Exactly. A JWT is a signed postcard: anyone can read it, nobody can rewrite it. On to the debrief."
t6.q.forge: "The payload says \"role: client\". What stops someone from rewriting it as \"admin\"?"
t6.q.forge.base64: "The Base64 encoding, which makes the payload unreadable for a human eye."
t6.q.forge.base64.why: "You just read it with one command. Base64 changes the shape, it protects nothing."
t6.q.forge.signature: "The signature, made with the server's key, if the server checks it each time."
t6.q.forge.exp: "The \"exp\" field, which makes the token expire after twenty-four hours."
t6.q.forge.exp.why: "Expiry limits how long a stolen token lasts. It does not stop its content from being changed."
t6.q.forge.https: "HTTPS, which encrypts the cookie all the way between the browser and the server."
t6.q.forge.https.why: "HTTPS protects the trip. Your own browser sees the cookie in clear and can change it."
t6.q.content: "What can go in the payload of a JWT?"
t6.q.content.nothing: "Nothing you would not show the user who carries it: no secret, no sensitive data."
t6.q.content.encrypted: "Anything, passwords included, since the signature protects the content."
t6.q.content.encrypted.why: "The signature prevents changes, not reading. What is in a signed JWT is public to whoever carries it."
t6.q.content.short: "Only short values, so that the cookie stays under the allowed size."
t6.q.content.short.why: "Size matters, but it is not the real test: a short value can be a secret."
t6.hint.decode.1: "The token starts after `nm_session=`. The `jwt decode` command only reads it."
t6.hint.decode.2: "`jwt decode` followed by the whole token, then `submit` the value of the `debug` field."
t6.debrief.title: "Signed is not encrypted"
t6.debrief.lesson: "A JWT is a header, a payload and a signature. The first two are Base64 JSON: anyone can read them. The signature only guarantees that the server issued that content, and only if the server checks it."
t6.debrief.p1: "The server checks the signature of every token, with an algorithm it fixes itself: never the one the token announces, never `none`."
t6.debrief.p2: "The payload holds nothing secret: identifier, role, expiry. No password, no personal data, no debug leftover."
t6.debrief.p3: "Short-lived tokens, and a way to revoke them: a stolen token stays valid until it expires."
