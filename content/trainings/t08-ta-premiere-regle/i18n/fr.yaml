t8.briefing: "Le SOC de NovaMind reçoit les journaux de connexion de sa forge de code, mais aucune règle ne les lit. Cette nuit, quelqu'un a essayé des mots de passe. Ta mission : écrire la première règle de détection, qui l'attrape lui et personne d'autre."
t8.obj.read: "Trouver l'adresse qui essaie des mots de passe"
t8.obj.rule: "Écrire une règle qui l'attrape, sans fausse alerte"
t8.obj.next: "Dire quoi faire ensuite"
t8.ada.brief: "Huitième entraînement. Tu es côté défense : rien ne peut casser, mais tout ce que tu tapes fait avancer le temps."
t8.ada.read: "Commence par lire les connexions de la forge : `soc logs git auth`. Puis cherche les échecs : `soc search Failed`. Quand tu as l'adresse, réponds : `answer source <adresse>`."
t8.ada.read.standard: "Lis les connexions de la forge avec `soc`, repère les échecs et l'adresse qui les enchaîne. Réponds avec `answer source`."
t8.ada.rule: "Ta règle est dans `regles/essais.yml`. Une ligne par condition : `result: Failed`, `src|startswith: 10.13.`… Ajoute une condition avec `echo \"result: Failed\" >> regles/essais.yml`, puis essaie-la : `rule test regles/essais.yml`."
t8.ada.rule.standard: "Écris la règle dans `regles/essais.yml`, une condition par ligne, puis essaie-la avec `rule test`. Elle doit alerter sur chaque essai de l'attaquant, et jamais sur le bureau."
t8.ada.noisy: "Elle attrape l'attaquant, mais aussi jroux, qui se trompe de mot de passe depuis le bureau tous les matins. Une règle qui sonne pour rien finit ignorée. Ajoute ce qui distingue l'attaquant : d'où il vient. `echo \"src|startswith: 203.0.113.\" >> regles/essais.yml`."
t8.ada.noisy.standard: "Trop de bruit : un collègue du bureau déclenche ta règle. Qu'est-ce qui distingue l'attaquant de lui ?"
t8.ada.missed: "Elle ne voit pas tous les essais de l'attaquant. Retire la condition trop étroite : `edit regles/essais.yml`."
t8.ada.missed.standard: "Ta règle laisse passer des essais de l'attaquant. Elle est trop étroite."
t8.ada.passed: "Quatre alertes, quatre essais, zéro fausse alerte. C'est ce qu'on attend d'une règle : qu'on puisse la croire."
t8.ada.answer: "Une dernière question : réponds en cliquant, ou avec `answer` dans le terminal."
t8.ada.answer.standard: "Ma question t'attend dans la messagerie."
t8.ada.done: "Oui. Bloquer une adresse ne dure que jusqu'à la suivante ; ce qui a vraiment été visé, ce sont les comptes. Passe au débrief."
t8.q.source: "Quelle adresse essaie des mots de passe sur la forge ?"
t8.q.next: "La règle tient. Que fait NovaMind de son côté ?"
t8.q.next.lock: "Ferme la connexion par mot de passe sur la forge et passe tous les comptes à la clé."
t8.q.next.block: "Bloque l'adresse 203.0.113.66 au pare-feu, et garde le reste en l'état."
t8.q.next.block.why: "Utile pour cette nuit, mais l'attaquant changera d'adresse demain. La forge accepte toujours des mots de passe devinables."
t8.q.next.rename: "Demande aux quatre personnes visées de changer de nom d'utilisateur."
t8.q.next.rename.why: "Les noms d'utilisateur ne sont pas des secrets. C'est le mot de passe deviné qui pose problème, pas le nom qu'on essaie."
t8.hint.read.1: "`soc search Failed` ne garde que les échecs de connexion."
t8.hint.read.2: "Une adresse hors du réseau du bureau (10.13.) essaie quatre comptes différents. `answer source 203.0.113.66`."
t8.hint.rule.1: "Commence par les échecs : `result: Failed`. Puis regarde ce que `rule test` dit des fausses alertes."
t8.hint.rule.2: "Le collègue se trompe depuis 10.13.0.12, l'attaquant vient de 203.0.113.66. Une condition sur `src` les sépare."
t8.hint.rule.3: "`echo \"result: Failed\" >> regles/essais.yml`, `echo \"src|startswith: 203.0.113.\" >> regles/essais.yml`, puis `rule test regles/essais.yml`."
t8.debrief.title: "Une règle qu'on peut croire"
t8.debrief.lesson: "Une bonne règle de détection décrit ce qui distingue l'attaque de l'activité normale, pas seulement l'attaque. Sans cela, elle sonne pour chaque faute de frappe, et l'équipe finit par l'ignorer le jour où elle compte."
t8.debrief.p1: "Toujours essayer une règle contre l'activité ordinaire avant de la mettre en service : zéro fausse alerte sur une journée normale."
t8.debrief.p2: "Plusieurs comptes visés depuis une même adresse en peu de temps, c'est la signature de la pulvérisation de mots de passe. Un seuil (`count`) l'attrape même si l'adresse change de bloc."
t8.debrief.p3: "La détection ne remplace pas la correction : connexion par clé ou double authentification, et le mot de passe deviné ne vaut plus rien."
