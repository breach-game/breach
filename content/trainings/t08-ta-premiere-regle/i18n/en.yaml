t8.briefing: "NovaMind's SOC receives the login logs of its code forge, but no rule reads them. Tonight, somebody tried passwords. Your job: write the first detection rule, one that catches them and nobody else."
t8.obj.read: "Find the address that tries passwords (`answer source`)"
t8.obj.rule: "Write a rule that catches it, with no false alert"
t8.obj.next: "Say what to do next"
t8.ada.brief: "Eighth training. You are on the defence side: nothing can break, but everything you type moves time on."
t8.ada.read: "Start by reading the forge logins: `soc logs git auth`. Then look for failures: `soc search Failed`. Once you have the address, answer: `answer source <address>`."
t8.ada.read.standard: "Read the forge logins with `soc`, spot the failures and the address chaining them. Answer with `answer source`."
t8.ada.rule: "Your rule is in `regles/essais.yml`. One line per condition: `result: Failed`, `src|startswith: 10.13.`… Add a condition with `echo \"result: Failed\" >> regles/essais.yml`, then try it: `rule test regles/essais.yml`. Or by hand, in the editor: `edit regles/essais.yml`, then Ctrl+S."
t8.ada.rule.standard: "Write the rule in `regles/essais.yml`, one condition per line, then try it with `rule test`. It must alert on every attempt of the attacker, and never on the office. To open the file: `edit regles/essais.yml`."
t8.ada.noisy: "It catches the attacker, but also jroux, who mistypes their password from the office every morning. A rule that rings for nothing ends up ignored. Add what sets the attacker apart: where they come from. `echo \"src|startswith: 203.0.113.\" >> regles/essais.yml`. Or by hand, in the editor: `edit regles/essais.yml`, then Ctrl+S."
t8.ada.noisy.standard: "Too noisy: a colleague in the office sets your rule off. What sets the attacker apart from them?"
t8.ada.missed: "It does not see every attempt of the attacker. Remove the condition that is too narrow: `edit regles/essais.yml`."
t8.ada.missed.standard: "Your rule lets attempts of the attacker through. It is too narrow."
t8.ada.passed: "Four alerts, four attempts, zero false alert. That is what a rule is for: being believed."
t8.ada.answer: "One last question: click, or use `answer` in the terminal."
t8.ada.answer.standard: "My question is waiting in the messenger."
t8.ada.done: "Yes. Blocking an address lasts until the next one; what was really targeted are the accounts. On to the debrief."
t8.q.source: "Which address is trying passwords on the forge?"
t8.q.next: "The rule holds. What does NovaMind do on its side?"
t8.q.next.lock: "Turn off password logins on the forge and move every account to keys."
t8.q.next.block: "Block address 203.0.113.66 at the firewall, and leave everything else exactly as it is."
t8.q.next.block.why: "Useful tonight, but the attacker will use another address tomorrow. The forge still accepts guessable passwords."
t8.q.next.rename: "Ask the four targeted people to change their user names."
t8.q.next.rename.why: "User names are not secrets. The guessed password is the problem, not the name being tried."
t8.hint.read.1: "`soc search Failed` keeps only the failed logins."
t8.hint.read.2: "An address outside the office network (10.13.) tries four different accounts. `answer source 203.0.113.66`."
t8.hint.rule.1: "Start with failures: `result: Failed`. Then see what `rule test` says about false alerts."
t8.hint.rule.2: "The colleague mistypes from 10.13.0.12, the attacker comes from 203.0.113.66. A condition on `src` sets them apart."
t8.hint.rule.3: "`echo \"result: Failed\" >> regles/essais.yml`, `echo \"src|startswith: 203.0.113.\" >> regles/essais.yml`, then `rule test regles/essais.yml`. Or by hand, in the editor: `edit regles/essais.yml`, then Ctrl+S."
t8.debrief.title: "A rule you can believe"
t8.debrief.lesson: "A good detection rule describes what sets the attack apart from normal activity, not just the attack. Otherwise it rings at every typo, and the team ends up ignoring it on the day it matters."
t8.debrief.p1: "Always try a rule against ordinary activity before turning it on: zero false alert on a normal day."
t8.debrief.p2: "Several accounts targeted from one address in a short time is the signature of password spraying. A threshold (`count`) catches it even when the address moves."
t8.debrief.p3: "Detection does not replace the fix: key logins or two-factor authentication, and a guessed password is worth nothing."
