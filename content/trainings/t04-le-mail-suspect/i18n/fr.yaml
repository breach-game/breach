t4.file.mail: "Return-Path: <bounce@novamind-support.example>\nReceived: from mx.novamind-support.example (10.13.9.44)\n        by mail.novamind.test; Mon, 23 Nov 2026 08:52:11 +0100\nAuthentication-Results: mail.novamind.test;\n        spf=fail smtp.mailfrom=novamind-support.example;\n        dkim=none; dmarc=fail header.from=novamind.test\nFrom: \"Support IT NovaMind\" <it-support@novamind.test>\nReply-To: it-desk@novamind-support.example\nTo: theo.lambert@novamind.test\nSubject: [URGENT] Votre mot de passe expire dans 1 heure\nDate: Mon, 23 Nov 2026 08:52:09 +0100\n\nBonjour Théo,\n\nVotre mot de passe NovaMind expire aujourd'hui à 10 h 00. Passé ce délai,\nvotre compte sera suspendu et vos accès devront être recréés par votre manager.\n\nRenouvelez-le maintenant : https://sso.novamind-support.example/renew?u=theo.lambert\n\nMerci de ne pas transférer ce message.\n\nLe support IT\n"
t4.briefing: "Théo, le stagiaire de NovaMind, vient de transférer un mail au support : « c'est normal, ça ? ». Bon réflexe. Le mail brut est sur ton poste. Dis-nous d'où il vient vraiment, et ce que Théo doit faire."
t4.obj.origin: "Trouver le domaine qui a réellement envoyé le mail"
t4.obj.verdict: "Dire ce qui trahit ce mail"
t4.obj.action: "Conseiller Théo"
t4.ada.brief: "Quatrième entraînement. Tu as joué l'attaquant face à Théo ; cette fois tu es de son côté. Le fichier est `~/training/mail.eml` : un mail tel que le serveur l'a reçu, avec ses en-têtes."
t4.ada.read: "Lis-le en entier : `cat training/mail.eml`. Ce que le logiciel de messagerie affiche, c'est `From` et `Subject`. Tout le reste est caché à l'utilisateur, et c'est là que ça se passe."
t4.ada.read.standard: "Lis `training/mail.eml`, en-têtes compris. Ce que voit l'utilisateur n'est qu'une petite partie du mail."
t4.ada.headers: "`From` est écrit par l'expéditeur : il y met ce qu'il veut. Trois lignes sont plus dures à maquiller : `Return-Path`, `Received` et `Authentication-Results`, ajoutées par les serveurs. Isole-les : `grep -i -E \"from|reply-to|spf|return-path\" training/mail.eml`. Puis donne-moi le vrai domaine d'envoi avec `submit`."
t4.ada.headers.standard: "`From` est écrit par l'expéditeur, il y met ce qu'il veut. Cherche les en-têtes ajoutés par les serveurs, et donne-moi le vrai domaine d'envoi avec `submit`."
t4.ada.origin: "novamind-support.example. Un domaine qui ressemble, acheté pour l'occasion. Le vrai domaine de NovaMind n'a jamais vu passer ce mail."
t4.ada.ask: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t4.ada.ask.standard: "Ma question t'attend."
t4.ada.verdict: "Oui. `spf=fail` veut dire que le serveur qui a envoyé ce mail n'a pas le droit d'écrire au nom de novamind.test. Et la réponse partirait vers l'attaquant, pas vers le support."
t4.ada.ask2: "Dernière question, la plus utile au quotidien."
t4.ada.ask2.standard: "Une dernière question."
t4.ada.done: "Voilà. Un signalement, et le SOC peut bloquer le domaine et retrouver les douze autres personnes qui ont reçu le même mail. Passe au débrief."
t4.q.verdict: "Qu'est-ce qui prouve que ce mail est un hameçonnage ?"
t4.q.verdict.from: "Rien ne le prouve : le champ From indique bien it-support@novamind.test, donc il vient de chez nous."
t4.q.verdict.from.why: "Le champ `From` est rempli par l'expéditeur, comme le nom au dos d'une enveloppe. Il ne prouve rien."
t4.q.verdict.spf: "L'échec SPF, et une adresse de réponse sur un autre domaine que l'expéditeur affiché."
t4.q.verdict.tone: "Le ton urgent, la menace de suspension du compte et le délai d'une heure pour agir."
t4.q.verdict.tone.why: "C'est un très bon signal d'alerte, mais pas une preuve : un vrai service informatique écrit parfois très mal. La preuve est dans les en-têtes."
t4.q.action: "Que conseilles-tu à Théo ?"
t4.q.action.click: "Cliquer pour voir si la page a l'air vraie, sans rien saisir."
t4.q.action.click.why: "Le clic suffit à dire à l'attaquant que l'adresse est lue par quelqu'un de curieux. Et la page aura l'air vraie : c'est son seul travail."
t4.q.action.reply: "Répondre au mail pour demander si c'est bien le support."
t4.q.action.reply.why: "La réponse part vers `Reply-To`, donc vers l'attaquant. Il répondra que oui."
t4.q.action.delete: "Supprimer le mail et passer à autre chose."
t4.q.action.delete.why: "Théo est tiré d'affaire, mais ses collègues ont reçu le même mail et personne n'est prévenu."
t4.q.action.report: "Ne pas cliquer, et signaler le mail à l'équipe sécurité."
t4.hint.origin.1: "Regarde `Return-Path` et la ligne `spf=` : elles nomment le domaine qui a vraiment envoyé le mail."
t4.hint.origin.2: "`submit novamind-support.example`"
t4.debrief.title: "Lire un mail comme un serveur"
t4.debrief.lesson: "Un mail d'hameçonnage réussit quand il est jugé sur ce qu'il affiche : un nom, un logo, une urgence. Il échoue dès qu'on regarde ce qu'il ne maîtrise pas : par où il est passé, et où part la réponse. Dans la mission 2, c'est toi qui profitais de cette confiance."
t4.debrief.p1: "Publier SPF, DKIM et DMARC en mode rejet : le serveur refuse alors ce mail au lieu de le distribuer."
t4.debrief.p2: "Un bouton « signaler » dans la messagerie, et des remerciements à ceux qui s'en servent."
t4.debrief.p3: "Marquer visiblement les mails venus de l'extérieur, et surveiller les domaines qui imitent le sien."
t4.debrief.p4: "Un second facteur résistant à l'hameçonnage : un mot de passe volé ne suffit plus."
