t4.file.mail: "Return-Path: <bounce@novamind-support.example>\nReceived: from mx.novamind-support.example (10.13.9.44)\n        by mail.novamind.test; Mon, 23 Nov 2026 08:52:11 +0100\nAuthentication-Results: mail.novamind.test;\n        spf=fail smtp.mailfrom=novamind-support.example;\n        dkim=none; dmarc=fail header.from=novamind.test\nFrom: \"Support IT NovaMind\" <it-support@novamind.test>\nReply-To: it-desk@novamind-support.example\nTo: theo.lambert@novamind.test\nSubject: [URGENT] Your password expires in 1 hour\nDate: Mon, 23 Nov 2026 08:52:09 +0100\n\nHello Théo,\n\nYour NovaMind password expires today at 10:00 am. After that, your account\nwill be suspended and your manager will have to request new access for you.\n\nRenew it now: https://sso.novamind-support.example/renew?u=theo.lambert\n\nPlease do not forward this message.\n\nIT support\n"
t4.briefing: "Théo, NovaMind's intern, just forwarded an email to support: “is this normal?”. Good reflex. The raw email is on your workstation. Tell us where it really comes from, and what Théo should do."
t4.obj.origin: "Find the domain that really sent the email"
t4.obj.verdict: "Say what gives this email away"
t4.obj.action: "Advise Théo"
t4.ada.brief: "Fourth training. Here you are on Théo's side, the one who receives. The file is `~/training/mail.eml`: an email as the server received it, headers included."
t4.ada.read: "Read all of it: `cat training/mail.eml`. What the mail client shows is `From` and `Subject`. Everything else is hidden from the user, and that is where things happen."
t4.ada.read.standard: "Read `training/mail.eml`, headers included. What the user sees is only a small part of the email."
t4.ada.headers: "`From` is written by the sender: they put whatever they want in it. Three lines are harder to fake: `Return-Path`, `Received` and `Authentication-Results`, added by the servers. Isolate them: `grep -i -E \"from|reply-to|spf|return-path\" training/mail.eml`. Then give me the real sending domain with `submit`."
t4.ada.headers.standard: "`From` is written by the sender, they put whatever they want in it. Look for the headers added by the servers, and give me the real sending domain with `submit`."
t4.ada.origin: "novamind-support.example. A lookalike domain, bought for the occasion. NovaMind's real domain never saw this email go by."
t4.ada.ask: "Answer my question: with a click, or with `answer` in the terminal."
t4.ada.ask.standard: "My question is waiting."
t4.ada.verdict: "Yes. `spf=fail` means the server that sent this email is not allowed to write on behalf of novamind.test. And a reply would go to the attacker, not to support."
t4.ada.ask2: "Last question, the most useful one day to day."
t4.ada.ask2.standard: "One last question."
t4.ada.done: "There. One report, and the SOC can block the domain and find the twelve other people who got the same email. On to the debrief."
t4.q.verdict: "What proves this email is phishing?"
t4.q.verdict.from: "Nothing proves it: the From field does say it-support@novamind.test, so it comes from us."
t4.q.verdict.from.why: "The `From` field is filled in by the sender, like the name on the back of an envelope. It proves nothing."
t4.q.verdict.spf: "The SPF failure, and a reply address on another domain than the displayed sender."
t4.q.verdict.tone: "The urgent tone, the threat to suspend the account and the one-hour deadline to act."
t4.q.verdict.tone.why: "That is a very good warning sign, but not proof: a real IT department sometimes writes very badly. The proof is in the headers."
t4.q.action: "What do you advise Théo to do?"
t4.q.action.click: "Click to see whether the page looks real, without typing anything."
t4.q.action.click.why: "The click alone tells the attacker the address is read by someone curious. And the page will look real: that is its only job."
t4.q.action.reply: "Reply to the email to ask whether it really is support."
t4.q.action.reply.why: "The reply goes to `Reply-To`, so to the attacker. They will say yes."
t4.q.action.delete: "Delete the email and move on."
t4.q.action.delete.why: "Théo is safe, but his colleagues got the same email and nobody has been warned."
t4.q.action.report: "Do not click, and report the email to the security team."
t4.hint.origin.1: "Look at `Return-Path` and the `spf=` line: they name the domain that really sent the email."
t4.hint.origin.2: "`submit novamind-support.example`"
t4.debrief.title: "Reading an email like a server"
t4.debrief.lesson: "A phishing email works when it is judged on what it displays: a name, a logo, an emergency. It fails as soon as you look at what it does not control: the path it took, and where the reply goes. In mission 2, you were the one taking advantage of that trust."
t4.debrief.p1: "Publish SPF, DKIM and DMARC in reject mode: the server then refuses this email instead of delivering it."
t4.debrief.p2: "A “report” button in the mail client, and thanks for those who use it."
t4.debrief.p3: "Visibly tag emails coming from outside, and watch for domains imitating yours."
t4.debrief.p4: "A phishing-resistant second factor: a stolen password is no longer enough."
