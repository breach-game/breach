t15.briefing: "In the data team channel, Malo pasted a link to his conversation with an AI assistant, to show how he fixed the billing request. The link opens without an account. A copy of what it shows is in `partage/conversation.txt`, the channel message in `canal/equipe-data.txt`."
t15.file.channel: "#data-team\n[09:12] malo: finally fixed the billing request thanks to the assistant 🙌\n[09:12] malo: the whole conversation is here if it helps: https://partage.assistant.example/c/7f3a9e21\n[09:15] ines: great, thanks!\n[09:31] yanis: I put it in the partners team wiki too\n"
t15.file.conversation: "partage.assistant.example/c/7f3a9e21\nShared conversation · visible to anyone with the link\n\nMalo:\n  My billing request returns 401, here is my config, can you see the problem?\n\n  BILLING_API_URL=https://facturation.novamind.test/v2\n  BILLING_API_KEY=LR-BILL-5521-QX7\n  BILLING_TIMEOUT=30\n\nAssistant:\n  The address points to version 2, but your key is a version 1 key.\n  Ask for a v2 key or use /v1.\n\nMalo:\n  Thanks, it works with /v1!\n"
t15.file.search: "Results for \"novamind billing api\"\n\n1. Conversation: billing request 401 · partage.assistant.example/c/7f3a9e21\n   \"My billing request returns 401, here is my config… BILLING_API_URL=https://facturation.novamind.test/v2 …\"\n\n2. NovaMind · Billing API documentation · docs.novamind.test/facturation\n"
t15.obj.found: "Find what the link shows anyone"
t15.obj.first: "Pick the first move"
t15.obj.share: "Say what \"share\" really means"
t15.ada.brief: "Training fifteen. Nothing was attacked: someone wanted to help. Read the channel message first, then what the link shows."
t15.ada.open: "Read the channel message with `cat canal/equipe-data.txt`, then the shared page with `cat partage/conversation.txt`."
t15.ada.open.standard: "Read the channel message, then the copy of the shared conversation."
t15.ada.read: "Malo pasted his whole configuration to ask his question. Which key does the page show whoever has the link? Send it with `submit`."
t15.ada.read.standard: "Send with `submit` the key the page shows."
t15.ada.found: "A billing API key, readable by anyone with the link. And the link is already in a second wiki."
t15.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t15.ada.answer.standard: "My question is waiting in the messenger."
t15.ada.indexed: "Yes. Now look at `partage/recherche.txt`: that is what a search engine returns."
t15.ada.search: "Read `partage/recherche.txt`, then answer my question."
t15.ada.search.standard: "Look at the search results, then answer."
t15.ada.done: "That's it. A share link is a public page with a long address. Debrief."
t15.q.first: "What must be done first?"
t15.q.first.revoke: "Revoke the key and issue a new one, then delete the share."
t15.q.first.unshare: "Delete the share link in the assistant, and that's it."
t15.q.first.unshare.why: "The link was opened, copied into a wiki, maybe indexed. What was read cannot be unread: only revoking makes the key useless."
t15.q.first.hush: "Ask the channel that nobody clicks the link any more."
t15.q.first.hush.why: "Those who already have the key are not all in the channel. As long as the key works, it serves whoever holds it."
t15.q.share: "What does \"share a conversation\" mean in most assistants?"
t15.q.share.anyone: "Anyone with the address reads it, with no account, and it travels."
t15.q.share.team: "Only people signed in to my company can open it."
t15.q.share.team.why: "Read the page header again: \"visible to anyone with the link\". No access control, and the search shows it."
t15.q.share.expire: "The link expires by itself after 24 hours, like a code."
t15.q.share.expire.why: "Nothing on the page says so, and the search still shows it. A share stays online until someone deletes it."
t15.hint.found.1: "`cat partage/conversation.txt`: look at the configuration Malo pasted."
t15.hint.found.2: "The BILLING_API_KEY line: `submit LR-BILL-5521-QX7`."
t15.debrief.title: "Sharing is publishing"
t15.debrief.lesson: "What you paste into an assistant goes to its provider, and what you share becomes a page anyone can read and copy. A leaked key is revoked, not hidden."
t15.debrief.p1: "A \"share\" link has no access control: its long address is the only protection, and it gets copied."
t15.debrief.p2: "Before pasting a configuration, a log or a contract, remove what is secret or personal."
t15.debrief.p3: "Exposed key: revoke and replace first, delete the share next, then check who used it."
t15.facts.title: "What really happened: ChatGPT conversations in search engines, 2025"
t15.facts.p1: "When sharing a ChatGPT conversation, OpenAI offered a checkbox to make it discoverable by search engines. Shared conversations thus showed up in Google results."
t15.facts.p2: "On 1 August 2025, OpenAI removed the option, saying it gave too many chances to share things by accident, and asked for already indexed pages to be removed. Some could stay visible for a while because of search engine caches."
t15.home.p1: "Before clicking \"share\" in an assistant, read the whole conversation again: everything in it will be public."
t15.home.p2: "Go through your share links in your assistants' settings and delete the ones you no longer need."
