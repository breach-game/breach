t15.briefing: "Dans le canal de l'équipe data, Malo a collé un lien vers sa conversation avec un assistant IA, pour montrer comment il a débloqué la requête de facturation. Le lien s'ouvre sans compte. Une copie de ce qu'il montre est dans `partage/conversation.txt`, le message du canal dans `canal/equipe-data.txt`."
t15.file.channel: "#equipe-data\n[09:12] malo: j'ai enfin réglé la requête de facturation grâce à l'assistant 🙌\n[09:12] malo: toute la conversation ici si ça vous aide : https://partage.assistant.example/c/7f3a9e21\n[09:15] ines: top merci !\n[09:31] yanis: je l'ai mise dans le wiki de l'équipe partenaires aussi\n"
t15.file.conversation: "partage.assistant.example/c/7f3a9e21\nConversation partagée · visible par toute personne disposant du lien\n\nMalo :\n  Ma requête de facturation renvoie 401, voilà ma config, tu vois le problème ?\n\n  BILLING_API_URL=https://facturation.novamind.test/v2\n  BILLING_API_KEY=LR-BILL-5521-QX7\n  BILLING_TIMEOUT=30\n\nAssistant :\n  L'adresse pointe vers la version 2, mais ta clé est une clé de la version 1.\n  Demande une clé v2 ou utilise /v1.\n\nMalo :\n  Merci, ça marche avec /v1 !\n"
t15.file.search: "Résultats pour « novamind facturation api »\n\n1. Conversation : requête facturation 401 · partage.assistant.example/c/7f3a9e21\n   « Ma requête de facturation renvoie 401, voilà ma config… BILLING_API_URL=https://facturation.novamind.test/v2 … »\n\n2. NovaMind · Documentation de l'API de facturation · docs.novamind.test/facturation\n"
t15.obj.found: "Trouver ce que le lien montre à n'importe qui"
t15.obj.first: "Choisir le premier geste"
t15.obj.share: "Dire ce que veut vraiment dire « partager »"
t15.ada.brief: "Quinzième entraînement. Rien n'a été attaqué : quelqu'un a voulu rendre service. Lis d'abord le message du canal, puis ce que montre le lien."
t15.ada.open: "Lis le message du canal avec `cat canal/equipe-data.txt`, puis la page partagée avec `cat partage/conversation.txt`."
t15.ada.open.standard: "Lis le message du canal, puis la copie de la conversation partagée."
t15.ada.read: "Malo a collé sa configuration entière pour poser sa question. Quelle clé la page montre-t-elle à qui a le lien ? Envoie-la avec `submit`."
t15.ada.read.standard: "Envoie avec `submit` la clé que la page montre."
t15.ada.found: "Une clé d'API de facturation, lisible par toute personne qui a le lien. Et le lien est déjà dans un deuxième wiki."
t15.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t15.ada.answer.standard: "Ma question t'attend dans la messagerie."
t15.ada.indexed: "Oui. Maintenant regarde `partage/recherche.txt` : c'est ce qu'on obtient dans un moteur de recherche."
t15.ada.search: "Lis `partage/recherche.txt`, puis réponds à ma question."
t15.ada.search.standard: "Regarde les résultats de recherche, puis réponds."
t15.ada.done: "C'est ça. Un lien de partage, c'est une page publique dont l'adresse est longue. Débrief."
t15.q.first: "Que faut-il faire en premier ?"
t15.q.first.revoke: "Révoquer la clé et en émettre une nouvelle, puis supprimer le partage."
t15.q.first.unshare: "Supprimer le lien de partage dans l'assistant, et c'est réglé."
t15.q.first.unshare.why: "Le lien a été ouvert, recopié dans un wiki, peut-être indexé. Ce qui a été lu ne se dé-lit pas : seule la révocation rend la clé inutile."
t15.q.first.hush: "Demander dans le canal que personne ne clique plus sur le lien."
t15.q.first.hush.why: "Ceux qui ont déjà la clé ne sont pas forcément dans le canal. Tant que la clé marche, elle sert à qui la détient."
t15.q.share: "Que veut dire « partager une conversation » dans la plupart des assistants ?"
t15.q.share.anyone: "Toute personne qui a l'adresse la lit, sans compte, et elle peut circuler."
t15.q.share.team: "Seules les personnes de mon entreprise connectées peuvent l'ouvrir."
t15.q.share.team.why: "Relis l'en-tête de la page : « visible par toute personne disposant du lien ». Aucun contrôle d'accès, et la recherche le montre."
t15.q.share.expire: "Le lien expire tout seul au bout de 24 heures, comme un code."
t15.q.share.expire.why: "Rien dans la page ne le dit, et la recherche le montre encore. Un partage reste en ligne jusqu'à ce qu'on le supprime."
t15.hint.found.1: "`cat partage/conversation.txt` : regarde la configuration que Malo a collée."
t15.hint.found.2: "La ligne BILLING_API_KEY : `submit LR-BILL-5521-QX7`."
t15.debrief.title: "Partager, c'est publier"
t15.debrief.lesson: "Ce qu'on colle dans un assistant part chez son éditeur, et ce qu'on partage devient une page que n'importe qui peut lire et recopier. Une clé qui fuit se révoque, elle ne se cache pas."
t15.debrief.p1: "Un lien « partager » n'a pas de contrôle d'accès : son adresse longue est la seule protection, et elle se recopie."
t15.debrief.p2: "Avant de coller une configuration, un journal ou un contrat, retire ce qui est secret ou personnel."
t15.debrief.p3: "Clé exposée : révoquer et remplacer d'abord, supprimer le partage ensuite, puis vérifier qui s'en est servi."
t15.facts.title: "Ce qui s'est vraiment passé : des conversations ChatGPT dans les moteurs de recherche, 2025"
t15.facts.p1: "OpenAI proposait, quand on partageait une conversation de ChatGPT, une case à cocher pour la rendre trouvable par les moteurs de recherche. Des conversations partagées sont ainsi apparues dans les résultats de Google."
t15.facts.p2: "Le 1er août 2025, OpenAI a retiré cette option, en expliquant qu'elle donnait trop d'occasions de partager par accident, et a demandé le retrait des pages déjà indexées. Certaines pouvaient rester visibles un temps à cause des caches des moteurs."
t15.home.p1: "Avant de cliquer sur « partager » dans un assistant, relis la conversation entière : tout ce qui y est sera public."
t15.home.p2: "Fais le tour de tes liens de partage dans les réglages de tes assistants et supprime ceux qui ne servent plus."
