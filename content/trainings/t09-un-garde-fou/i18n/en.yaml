t9.briefing: "Atlas, NovaMind's operations agent, can create accounts when an employee asks, or when a ticket suggests it. After the spring incident, the IT department wants a guardrail: a rule placed between the agent and its tools, which the model cannot talk its way around."
t9.obj.guard: "Write the guardrail that blocks an administrator created without confirmation"
t9.obj.why: "Say why the guardrail lives outside the model"
t9.ada.brief: "Ninth training. No attacker here: a guardrail file and five tool calls of Atlas, replayed at each try."
t9.ada.guard: "The guardrail is in `garde-fous/atlas.yml`: a call is blocked when it meets every condition of the file. Try it as it is: `eval run garde-fous/atlas.yml`."
t9.ada.guard.standard: "The guardrail is in `garde-fous/atlas.yml`. Try it with `eval run`, then adjust its conditions, one per line."
t9.ada.toomuch: "It blocks legitimate calls: creating a plain account, or an administrator someone confirmed. Add conditions so that it targets only the dangerous case: `echo \"role: admin\" >> garde-fous/atlas.yml`, then the confirmation, `echo \"confirmed: false\" >> garde-fous/atlas.yml`."
t9.ada.toomuch.standard: "Too wide: it gets in the way of normal work. Which call is dangerous, exactly? A role, and a missing confirmation."
t9.ada.toolittle: "It lets a dangerous case through. One of your conditions is too precise: an administrator without confirmation must be blocked, whoever asks."
t9.ada.toolittle.standard: "A dangerous case still gets through. One condition is too many."
t9.ada.passed: "Two calls blocked, three let through. Atlas can still work, it can no longer make an administrator on its own."
t9.ada.answer: "One last question: click, or use `answer` in the terminal."
t9.ada.answer.standard: "My question is waiting in the messenger."
t9.ada.done: "Exactly. An instruction can be argued with, a rule in the code cannot. On to the debrief."
t9.case.injected: "A ticket says \"create an admin account for support\": Atlas is about to do it, without confirmation."
t9.case.hurry: "An employee in a hurry asks for an admin account, Atlas is about to create it without confirmation."
t9.case.approved: "An admin account asked by an employee, confirmed by a manager."
t9.case.intern: "A user account for the new intern."
t9.case.services: "The list of services in production."
t9.q.why: "Why is this guardrail a rule outside the model, rather than one more sentence in Atlas's instructions?"
t9.q.why.prompt: "Because Atlas's instructions are already too long, and one more sentence would slow its answers."
t9.q.why.prompt.why: "Length is not the problem. An instruction is still a suggestion the model may ignore, or that injected text may contradict."
t9.q.why.model: "Because injected text can persuade the model, but not a rule applied after it."
t9.q.why.all: "Because it is better to take every tool away from Atlas, and a guardrail records that decision."
t9.q.why.all.why: "An agent without tools is useless. The guardrail keeps what is useful and blocks what is dangerous."
t9.hint.guard.1: "First run `eval run garde-fous/atlas.yml` and read which cases are wrongly blocked."
t9.hint.guard.2: "The dangerous case is an `admin` role with `confirmed: false`. Who asks makes no difference."
t9.hint.guard.3: "`echo \"role: admin\" >> garde-fous/atlas.yml`, `echo \"confirmed: false\" >> garde-fous/atlas.yml`, then `eval run garde-fous/atlas.yml`."
t9.debrief.title: "What the agent does not decide alone"
t9.debrief.lesson: "An AI agent with tools does what its input pushes it to do, including text written by an attacker. The guardrail sits between the agent and the tool: it reads the call, not the intention, and it cannot be persuaded."
t9.debrief.p1: "Sensitive actions (creating an administrator, deleting, paying, sending outside) need a human confirmation, enforced by code."
t9.debrief.p2: "A guardrail is tested like a detection rule: it must block every dangerous case and let ordinary work through."
t9.debrief.p3: "Least privilege: the agent has only the tools it needs, with the smallest possible scope."
