t2.briefing: "Un développeur de NovaMind jure que son jeton d'API est « protégé » dans le fichier de configuration du dépôt. Montre-lui en une commande ce que vaut cette protection, puis répare le fichier."
t2.obj.decode: "Retrouver le jeton en clair"
t2.obj.fix: "Sortir le secret du fichier de configuration"
t2.obj.next: "Décider quoi faire du jeton qui a fuité"
t2.ada.brief: "Deuxième entraînement. Le fichier est dans `~/training/config.env`. Il a été committé tel quel dans un dépôt que quarante personnes peuvent lire."
t2.ada.read: "Commence par le lire : `cat training/config.env`."
t2.ada.read.standard: "Lis `training/config.env` et cherche ce qui ressemble à un secret."
t2.ada.spot: "`API_TOKEN_B64`, et une valeur qui finit par `=` : c'est du Base64. Ce n'est pas un chiffrement, c'est une autre façon d'écrire les mêmes octets, et il n'y a aucune clé. Copie la valeur et décode-la : `echo <valeur> | base64 -d`. Ou à la main, dans l'éditeur : `edit |`, puis Ctrl+S."
t2.ada.spot.standard: "Regarde le nom de la variable et la forme de la valeur. Aucune clé n'est nécessaire pour la lire : `explain base64`."
t2.ada.submit: "Voilà le jeton en clair. Envoie-le-moi avec `submit`."
t2.ada.decoded: "Une commande. C'est tout ce qui séparait ce jeton de n'importe quel stagiaire, prestataire ou voleur de portable ayant une copie du dépôt."
t2.ada.fix: "Maintenant on répare. Un secret ne vit pas dans le dépôt : le fichier ne doit contenir qu'une référence au coffre. Ouvre-le avec `edit training/config.env` et remplace la ligne du jeton par `API_TOKEN=vault:nova-widget/api-token`. Puis lance `verify`."
t2.ada.fix.standard: "Répare le fichier : la ligne du jeton doit devenir une référence au coffre, `API_TOKEN=vault:nova-widget/api-token`. Puis lance `verify`. Pour ouvrir le fichier : `edit training/config.env`."
t2.ada.exact: "Pas encore. La valeur encodée doit avoir disparu, et la nouvelle ligne doit être exactement `API_TOKEN=vault:nova-widget/api-token`. Ne touche pas au reste."
t2.ada.fixed: "Le fichier est propre. Mais il reste un problème, et c'est le plus important."
t2.ada.next: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t2.ada.next.standard: "À toi de trancher : ma question t'attend."
t2.ada.done: "Exactement. Corriger le fichier empêche la prochaine fuite, pas celle qui a déjà eu lieu. Passe au débrief."
t2.q.next: "Le fichier est corrigé. Que fait-on de l'ancien jeton ?"
t2.q.next.done: "Rien de plus : il n'apparaît plus dans le fichier de configuration."
t2.q.next.done.why: "Il n'est plus dans le fichier, mais il est toujours dans l'historique Git et dans chaque copie du dépôt. Souviens-toi de la mission 1."
t2.q.next.twice: "On le garde, mais encodé deux fois à partir du prochain commit."
t2.q.next.twice.why: "Deux encodages se décodent avec deux commandes. Le problème n'est pas la force de l'encodage : il n'y a pas de clé."
t2.q.next.rotate: "On le révoque et on en génère un nouveau, rangé dans le coffre."
t2.q.next.private: "On le garde, et on réserve le dépôt aux seuls développeurs."
t2.q.next.private.why: "Le dépôt est déjà interne, et quarante personnes en ont une copie. Un secret vu doit être considéré comme connu."
t2.check.gone: "L'ancien jeton n'est plus dans le fichier"
t2.check.vault: "Le jeton est une référence au coffre"
t2.check.rest: "Le reste de la configuration est intact"
t2.hint.decode.1: "La valeur après `API_TOKEN_B64=` est du Base64. `base64 -d` la décode."
t2.hint.decode.2: "`grep B64 training/config.env | cut -d = -f 2- | base64 -d`, puis `submit` avec le résultat."
t2.hint.fix.1: "Remplace toute la ligne `API_TOKEN_B64=…` par `API_TOKEN=vault:nova-widget/api-token`."
t2.hint.fix.2: "Avec l'éditeur : `edit training/config.env`, puis Ctrl+S. Avec une commande : `sed -i \"s|^API_TOKEN_B64=.*|API_TOKEN=vault:nova-widget/api-token|\" training/config.env`, puis `verify`."
t2.debrief.title: "Encoder, hacher, chiffrer"
t2.debrief.lesson: "Encoder change la forme d'une donnée, sans secret : tout le monde peut revenir en arrière. Chiffrer demande une clé pour revenir en arrière. Hacher ne permet pas de revenir en arrière du tout. Confondre les trois est l'une des erreurs les plus courantes, et les plus faciles à exploiter."
t2.debrief.p1: "Aucun secret dans le dépôt, même encodé : un coffre à secrets, et une référence dans la configuration."
t2.debrief.p2: "Un secret qui a été lisible est un secret compromis : on le révoque et on le remplace, sans attendre de preuve d'abus."
t2.debrief.p3: "Un scanner de secrets dans la chaîne d'intégration bloque le commit avant qu'il parte, y compris pour les valeurs en Base64."
