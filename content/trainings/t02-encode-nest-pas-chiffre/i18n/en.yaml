t2.briefing: "A NovaMind developer swears his API token is “protected” in the repository's configuration file. Show him with one command what that protection is worth, then repair the file."
t2.obj.decode: "Recover the token in clear text"
t2.obj.fix: "Take the secret out of the configuration file"
t2.obj.next: "Decide what to do with the leaked token"
t2.ada.brief: "Second training. The file is in `~/training/config.env`. It was committed as it is to a repository forty people can read."
t2.ada.read: "Start by reading it: `cat training/config.env`."
t2.ada.read.standard: "Read `training/config.env` and look for what resembles a secret."
t2.ada.spot: "`API_TOKEN_B64`, and a value ending with `=`: that is Base64. It is not encryption, it is another way to write the same bytes, and there is no key. Copy the value and decode it: `echo <value> | base64 -d`. Or by hand, in the editor: `edit |`, then Ctrl+S."
t2.ada.spot.standard: "Look at the variable's name and the shape of the value. No key is needed to read it: `explain base64`."
t2.ada.submit: "There is the token in clear text. Send it to me with `submit`."
t2.ada.decoded: "One command. That is all that stood between this token and any intern, contractor or laptop thief with a copy of the repository."
t2.ada.fix: "Now we repair. A secret does not live in the repository: the file should only hold a reference to the vault. Open it with `edit training/config.env` and replace the token line by `API_TOKEN=vault:nova-widget/api-token`. Then run `verify`."
t2.ada.fix.standard: "Repair the file: the token line must become a reference to the vault, `API_TOKEN=vault:nova-widget/api-token`. Then run `verify`. To open the file: `edit training/config.env`."
t2.ada.exact: "Not yet. The encoded value must be gone, and the new line must be exactly `API_TOKEN=vault:nova-widget/api-token`. Leave the rest alone."
t2.ada.fixed: "The file is clean. But one problem remains, and it is the most important one."
t2.ada.next: "Answer my question: with a click, or with `answer` in the terminal."
t2.ada.next.standard: "Your call: my question is waiting."
t2.ada.done: "Exactly. Fixing the file prevents the next leak, not the one that already happened. On to the debrief."
t2.q.next: "The file is fixed. What do we do with the old token?"
t2.q.next.done: "Nothing more: it no longer appears in the configuration file."
t2.q.next.done.why: "It is no longer in the file, but it is still in the Git history and in every copy of the repository. Remember mission 1."
t2.q.next.twice: "Keep it, but encode it twice from the next commit on."
t2.q.next.twice.why: "Two encodings are decoded with two commands. The problem is not the strength of the encoding: there is no key."
t2.q.next.rotate: "Revoke it and generate a new one, stored in the vault."
t2.q.next.private: "Keep it, and restrict the repository to developers only."
t2.q.next.private.why: "The repository is already internal, and forty people have a copy. A secret that was seen must be treated as known."
t2.check.gone: "The old token is no longer in the file"
t2.check.vault: "The token is a reference to the vault"
t2.check.rest: "The rest of the configuration is intact"
t2.hint.decode.1: "The value after `API_TOKEN_B64=` is Base64. `base64 -d` decodes it."
t2.hint.decode.2: "`grep B64 training/config.env | cut -d = -f 2- | base64 -d`, then `submit` with the result."
t2.hint.fix.1: "Replace the whole `API_TOKEN_B64=…` line by `API_TOKEN=vault:nova-widget/api-token`."
t2.hint.fix.2: "With the editor: `edit training/config.env`, then Ctrl+S. With a command: `sed -i \"s|^API_TOKEN_B64=.*|API_TOKEN=vault:nova-widget/api-token|\" training/config.env`, then `verify`."
t2.debrief.title: "Encoding, hashing, encrypting"
t2.debrief.lesson: "Encoding changes the shape of data, with no secret: anyone can go back. Encrypting needs a key to go back. Hashing does not let you go back at all. Mixing up the three is one of the most common mistakes, and one of the easiest to exploit."
t2.debrief.p1: "No secret in the repository, even encoded: a secrets vault, and a reference in the configuration."
t2.debrief.p2: "A secret that was readable is a compromised secret: revoke and replace it, without waiting for proof of abuse."
t2.debrief.p3: "A secret scanner in the integration pipeline blocks the commit before it leaves, Base64 values included."
