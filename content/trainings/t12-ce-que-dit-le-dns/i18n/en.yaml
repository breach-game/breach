t12.briefing: "A domain publishes much more than addresses in the DNS: TXT records, readable by anyone, which say who may send its mail, prove who owns the domain, and sometimes say too much. Read NovaMind's."
t12.obj.txt: "Find the internal name the DNS publishes (send it with `submit`)"
t12.obj.spf: "Understand the SPF record"
t12.obj.dmarc: "Notice what is missing to protect mail"
t12.ada.brief: "Twelfth training. Everything you are about to read is public: this is passive reconnaissance, the target sees nothing."
t12.ada.dig: "Ask for the domain's TXT records: `dig novamind.test TXT`."
t12.ada.dig.standard: "Read the TXT records of `novamind.test` with `dig`."
t12.ada.leak: "Two lines. One describes who sends the mail, the other announces a machine name nobody outside needed to know. Send that name with `submit`."
t12.ada.leak.standard: "One of the two values has no business in a public DNS. Send the name it gives."
t12.ada.found: "The code forge, announced to the whole world. For an attacker, that is the next target served on a plate. Now, the other line."
t12.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t12.ada.answer.standard: "My question is waiting in the messenger."
t12.ada.dmarc: "SPF says who may send. But what should a mail server do with a message that fails? That is DMARC's job, published under `_dmarc`: `dig _dmarc.novamind.test TXT`."
t12.ada.dmarc.standard: "SPF is not enough on its own. Look for the domain's DMARC record, under the name `_dmarc`."
t12.ada.nodmarc: "Nothing. No DMARC policy: servers that receive a fake mail \"from novamind.test\" decide alone what to do with it, and NovaMind will never hear of it."
t12.ada.done: "That's it. SPF, DKIM and DMARC together make spoofing a domain visible and refused. On to the debrief."
t12.q.spf: "What does \"v=spf1 mx -all\" say?"
t12.q.spf.mx: "Only the domain's mail servers (MX) send for it, any other sender must be refused."
t12.q.spf.all: "Every server in the world may send for the domain, provided it has an MX."
t12.q.spf.all.why: "\"-all\" means the opposite: anything not listed before fails."
t12.q.spf.crypt: "The domain's mail is encrypted between the mail servers listed in the MX."
t12.q.spf.crypt.why: "SPF encrypts nothing: it only says which servers may send for the domain."
t12.q.dmarc: "No DMARC record. What should NovaMind publish?"
t12.q.dmarc.fine: "Nothing: the SPF record with \"-all\" is enough to block fake senders."
t12.q.dmarc.fine.why: "SPF checks the sending server, not the address the recipient sees in \"From:\". DMARC links the two, and says what to do on failure."
t12.q.dmarc.policy: "A DMARC policy that asks to reject mail that fails, and to send reports."
t12.q.dmarc.hide: "Remove the SPF record as well, so as not to inform attackers."
t12.q.dmarc.hide.why: "SPF reveals nothing useful to an attacker, and without it anyone can send in the domain's name."
t12.hint.txt.1: "`dig novamind.test TXT` shows the domain's text records."
t12.hint.txt.2: "The value `forge=…` announces an internal machine. `submit git.novamind.test`."
t12.hint.dmarc.1: "`dig _dmarc.novamind.test TXT`."
t12.debrief.title: "The DNS is a shop window"
t12.debrief.lesson: "Everything in the public DNS is read by everyone, attackers included. TXT records do useful things (SPF, DMARC, proofs of ownership), but they are no place for internal notes. And what is missing matters as much as what is there: without DMARC, spoofing the domain in a mail stays easy."
t12.debrief.p1: "Review public records regularly: nothing internal, and every verification record of an old service removed."
t12.debrief.p2: "SPF says which servers send, DKIM signs the messages, DMARC links both to the \"From:\" address and says what to do on failure."
t12.debrief.p3: "Start DMARC in monitoring (`p=none` with reports), then move to `quarantine` and `reject` once the real senders are known."
