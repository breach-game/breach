t12.briefing: "Un domaine publie dans le DNS bien plus que des adresses : des enregistrements TXT, lisibles par n'importe qui, qui disent qui a le droit d'envoyer ses mails, prouvent la propriété du domaine, et parfois en disent trop. Lis ceux de NovaMind."
t12.obj.txt: "Trouver le nom interne que publie le DNS"
t12.obj.spf: "Comprendre l'enregistrement SPF"
t12.obj.dmarc: "Remarquer ce qui manque pour protéger les mails"
t12.ada.brief: "Douzième entraînement. Tout ce que tu vas lire est public : c'est de la reconnaissance passive, la cible ne voit rien."
t12.ada.dig: "Demande les enregistrements TXT du domaine : `dig novamind.test TXT`."
t12.ada.dig.standard: "Lis les enregistrements TXT de `novamind.test` avec `dig`."
t12.ada.leak: "Deux lignes. L'une décrit qui envoie les mails, l'autre annonce un nom de machine que personne n'avait besoin de connaître dehors. Envoie ce nom avec `submit`."
t12.ada.leak.standard: "Une des deux valeurs n'a rien à faire dans un DNS public. Envoie le nom qu'elle donne."
t12.ada.found: "La forge de code, annoncée au monde entier. Pour un attaquant, c'est la cible suivante toute trouvée. Maintenant, l'autre ligne."
t12.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t12.ada.answer.standard: "Ma question t'attend dans la messagerie."
t12.ada.dmarc: "SPF dit qui peut envoyer. Mais qu'est-ce qu'un serveur de mail doit faire d'un message qui échoue ? C'est le rôle de DMARC, publié sous `_dmarc` : `dig _dmarc.novamind.test TXT`."
t12.ada.dmarc.standard: "SPF ne suffit pas seul. Cherche l'enregistrement DMARC du domaine, sous le nom `_dmarc`."
t12.ada.nodmarc: "Rien. Aucune politique DMARC : les serveurs qui reçoivent un faux mail « de novamind.test » décident seuls quoi en faire, et NovaMind n'en saura jamais rien."
t12.ada.done: "C'est ça. SPF, DKIM et DMARC ensemble, c'est ce qui rend l'usurpation d'un domaine visible et refusée. Passe au débrief."
t12.q.spf: "Que dit « v=spf1 mx -all » ?"
t12.q.spf.mx: "Seuls les serveurs de mail du domaine (MX) envoient pour lui, tout autre envoi doit être refusé."
t12.q.spf.all: "Tous les serveurs du monde peuvent envoyer pour le domaine, à condition d'avoir un MX."
t12.q.spf.all.why: "« -all » veut dire l'inverse : tout ce qui n'est pas listé avant échoue."
t12.q.spf.crypt: "Les mails du domaine sont chiffrés entre les serveurs de mail listés dans le MX."
t12.q.spf.crypt.why: "SPF ne chiffre rien : il dit seulement quels serveurs ont le droit d'envoyer pour le domaine."
t12.q.dmarc: "Aucun enregistrement DMARC. Qu'est-ce que NovaMind devrait publier ?"
t12.q.dmarc.fine: "Rien : l'enregistrement SPF « -all » suffit à bloquer les faux expéditeurs."
t12.q.dmarc.fine.why: "SPF vérifie le serveur d'envoi, pas l'adresse que le destinataire voit dans « De : ». DMARC relie les deux, et dit quoi faire en cas d'échec."
t12.q.dmarc.policy: "Une politique DMARC qui demande de rejeter les mails non conformes et d'envoyer des rapports."
t12.q.dmarc.hide: "Retirer aussi l'enregistrement SPF, pour ne pas renseigner les attaquants."
t12.q.dmarc.hide.why: "SPF ne révèle rien d'utile à un attaquant, et sans lui n'importe qui peut envoyer au nom du domaine."
t12.hint.txt.1: "`dig novamind.test TXT` affiche les enregistrements texte du domaine."
t12.hint.txt.2: "La valeur `forge=…` annonce une machine interne. `submit git.novamind.test`."
t12.hint.dmarc.1: "`dig _dmarc.novamind.test TXT`."
t12.debrief.title: "Le DNS est une vitrine"
t12.debrief.lesson: "Tout ce qui est dans le DNS public est lu par tout le monde, attaquants compris. Les enregistrements TXT servent à des choses utiles (SPF, DMARC, preuves de propriété), mais ce n'est pas un endroit pour des notes internes. Et ce qui manque compte autant que ce qui y est : sans DMARC, usurper le domaine dans un mail reste facile."
t12.debrief.p1: "Relire régulièrement ses enregistrements publics : rien d'interne, et chaque enregistrement de vérification d'un ancien service est retiré."
t12.debrief.p2: "SPF dit quels serveurs envoient, DKIM signe les messages, DMARC relie les deux à l'adresse « De : » et dit quoi faire d'un échec."
t12.debrief.p3: "Commencer DMARC en observation (`p=none` avec rapports), puis passer à `quarantine` et `reject` une fois les vrais expéditeurs connus."
