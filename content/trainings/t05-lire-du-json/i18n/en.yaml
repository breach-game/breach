t5.briefing: "NovaMind's support team sent Ligne Rouge the export of its administration accounts, for the yearly access review. One JSON file, without a single line break. Read it with jq, the tool every analyst keeps at hand."
t5.file.export: "{\"export\":\"2026-11-14T08:00:00Z\",\"source\":\"admin.novamind.test/api/v2/comptes\",\"comptes\":{\"cmorel\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-13\"},\"lpetit\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-14\"},\"jroux\":{\"role\":\"admin\",\"mfa\":true,\"derniere_connexion\":\"2026-11-14\"},\"sbernard\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-12\"},\"migration\":{\"role\":\"admin\",\"mfa\":false,\"derniere_connexion\":\"2024-02-01\",\"note\":\"compte temporaire, migration de l'agenda\"},\"agarnier\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-10\"}},\"integrations\":[{\"nom\":\"agenda-sync\",\"portee\":\"admin\",\"jeton\":\"FLAG{jq-un-jeton-dans-l-export-5e1a}\",\"cree\":\"2024-02-01\"}]}\n"
t5.obj.admin: "Find the administrator account without two-factor authentication"
t5.obj.token: "Find the secret that has no business in the export"
t5.obj.next: "Tell NovaMind what to do"
t5.ada.brief: "Fifth training. The file is in `~/training/comptes.json`. An API export is often the best map of a system: it says who exists, with which rights."
t5.ada.read: "First see what it looks like: `cat training/comptes.json`."
t5.ada.read.standard: "Open `training/comptes.json` and work out its structure."
t5.ada.oneline: "All on one line: unreadable by eye. jq reads JSON for you. Start with the list of accounts: `jq '.comptes | keys' training/comptes.json`."
t5.ada.oneline.standard: "Unreadable by eye. Ask jq for the keys of `comptes`: `explain jq`."
t5.ada.keys: "Six accounts. Look at them one by one, for instance `jq '.comptes.migration' training/comptes.json`, and look for an `admin` whose `mfa` is `false`. Send its name with `submit`."
t5.ada.keys.standard: "Inspect each account. The one we want is an administrator with no two-factor authentication. Send its name."
t5.ada.found: "A temporary administrator account, unused since February 2024, without two-factor authentication. Forgotten accounts are attackers' favourites: nobody notices when they start working again."
t5.ada.integrations: "The export has a second part: `integrations`. Read the `jeton` value of each entry: `jq -r '.integrations[].jeton' training/comptes.json`."
t5.ada.integrations.standard: "There is a part of the file you have not read. A secret hides there: get it out with jq, then `submit`."
t5.ada.token: "An admin-scope token, in clear, in a file mailed to a contractor. Created on the same day as the migration account: they go together."
t5.ada.next: "Answer my question: click, or use `answer` in the terminal."
t5.ada.next.standard: "My question is waiting in the messenger."
t5.ada.done: "That's it. A forgotten access is closed entirely: the account and everything created with it. On to the debrief."
t5.q.next: "What should NovaMind do with the \"migration\" account and the \"agenda-sync\" token?"
t5.q.next.mfa: "Turn on two-factor authentication for the \"migration\" account, so it is protected like the others."
t5.q.next.mfa.why: "The account stays open while nobody needs it, and the token never goes through two-factor authentication anyway. Access nobody needs gets closed."
t5.q.next.both: "Disable the account and revoke the token, then check in the logs whether they were used since 2024."
t5.q.next.rename: "Rename the account to something less obvious, and keep the token that may still be in use."
t5.q.next.rename.why: "The name was never the protection: the account and the token are in the export, which several people received."
t5.q.next.hide: "Remove the `integrations` section from future exports, and leave the rest as it is."
t5.q.next.hide.why: "Useful for later, but the token was already sent. A secret that travelled gets revoked, and the dormant account is still a risk."
t5.hint.admin.1: "`jq '.comptes | keys' training/comptes.json` gives the names. One of them says a lot."
t5.hint.admin.2: "`jq '.comptes.migration' training/comptes.json` shows an administrator with `\"mfa\": false`. Then `submit migration`."
t5.hint.token.1: "The `integrations` key is a list. `.integrations[]` goes through each of its items."
t5.hint.token.2: "`jq -r '.integrations[].jeton' training/comptes.json`, then `submit` what it prints."
t5.debrief.title: "What an export tells"
t5.debrief.lesson: "An export of accounts is a map of the system: who exists, with which rights, and sometimes with which secrets. jq reads it in a few commands. An attacker does exactly the same with whatever they find, so read it before they do."
t5.debrief.p1: "Regular access reviews: each administrator account has an owner, a reason to exist and two-factor authentication. A temporary account has an end date."
t5.debrief.p2: "An export never holds a secret. Integration tokens live in a vault, with the smallest scope and an expiry date."
t5.debrief.p3: "A forgotten account or token that wakes up should raise an alert: first login in months, first use of an old token."
