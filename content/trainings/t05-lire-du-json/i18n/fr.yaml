t5.briefing: "L'équipe support de NovaMind a envoyé à Ligne Rouge l'export de ses comptes d'administration, pour la revue annuelle des accès. Un seul fichier JSON, sans retour à la ligne. Lis-le avec jq, l'outil que tout analyste garde sous la main."
t5.file.export: "{\"export\":\"2026-11-14T08:00:00Z\",\"source\":\"admin.novamind.test/api/v2/comptes\",\"comptes\":{\"cmorel\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-13\"},\"lpetit\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-14\"},\"jroux\":{\"role\":\"admin\",\"mfa\":true,\"derniere_connexion\":\"2026-11-14\"},\"sbernard\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-12\"},\"migration\":{\"role\":\"admin\",\"mfa\":false,\"derniere_connexion\":\"2024-02-01\",\"note\":\"compte temporaire, migration de l'agenda\"},\"agarnier\":{\"role\":\"user\",\"mfa\":true,\"derniere_connexion\":\"2026-11-10\"}},\"integrations\":[{\"nom\":\"agenda-sync\",\"portee\":\"admin\",\"jeton\":\"FLAG{jq-un-jeton-dans-l-export-5e1a}\",\"cree\":\"2024-02-01\"}]}\n"
t5.obj.admin: "Trouver le compte administrateur sans double authentification"
t5.obj.token: "Trouver le secret qui n'a rien à faire dans l'export"
t5.obj.next: "Dire à NovaMind quoi faire"
t5.ada.brief: "Cinquième entraînement. Le fichier est dans `~/training/comptes.json`. Un export d'API, c'est souvent la meilleure carte d'un système : il dit qui existe, avec quels droits."
t5.ada.read: "Regarde d'abord à quoi il ressemble : `cat training/comptes.json`."
t5.ada.read.standard: "Ouvre `training/comptes.json` et repère sa structure."
t5.ada.oneline: "Tout sur une ligne : illisible à l'œil. jq lit le JSON pour toi. Commence par la liste des comptes : `jq '.comptes | keys' training/comptes.json`."
t5.ada.oneline.standard: "Illisible à l'œil. Demande à jq la liste des clés de `comptes` : `explain jq`."
t5.ada.keys: "Six comptes. Regarde-les un par un, par exemple `jq '.comptes.migration' training/comptes.json`, et cherche un `admin` dont `mfa` vaut `false`. Envoie son identifiant avec `submit`."
t5.ada.keys.standard: "Inspecte chaque compte. Celui qui nous intéresse est administrateur et n'a pas de double authentification. Envoie son identifiant."
t5.ada.found: "Un compte administrateur temporaire, pas utilisé depuis février 2024, sans double authentification. Les comptes oubliés sont les préférés des attaquants : personne ne remarque qu'ils servent de nouveau."
t5.ada.integrations: "L'export a une deuxième partie : `integrations`. Lis la valeur `jeton` de chaque entrée : `jq -r '.integrations[].jeton' training/comptes.json`."
t5.ada.integrations.standard: "Il reste une partie du fichier que tu n'as pas lue. Un secret s'y cache : sors-le avec jq, puis `submit`."
t5.ada.token: "Un jeton de portée admin, en clair, dans un fichier envoyé par mail à un prestataire. Créé le même jour que le compte de migration : ils vont ensemble."
t5.ada.next: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t5.ada.next.standard: "Ma question t'attend dans la messagerie."
t5.ada.done: "C'est ça. Un accès oublié se ferme entièrement : le compte et tout ce qui a été créé avec lui. Passe au débrief."
t5.q.next: "Que doit faire NovaMind du compte « migration » et du jeton « agenda-sync » ?"
t5.q.next.mfa: "Activer la double authentification sur le compte « migration », pour qu'il soit protégé comme les autres."
t5.q.next.mfa.why: "Le compte reste ouvert alors que personne n'en a besoin, et le jeton, lui, ne passe jamais par la double authentification. Un accès inutile se ferme."
t5.q.next.both: "Désactiver le compte et révoquer le jeton, puis vérifier dans les journaux s'ils ont servi depuis 2024."
t5.q.next.rename: "Renommer le compte en un nom moins évident, et garder le jeton qui sert peut-être encore."
t5.q.next.rename.why: "Le nom n'a jamais été la protection : le compte et le jeton figurent dans l'export, que plusieurs personnes ont reçu."
t5.q.next.hide: "Retirer la section `integrations` des prochains exports, et laisser le reste en l'état."
t5.q.next.hide.why: "C'est utile pour la suite, mais le jeton a déjà été envoyé. Un secret qui a circulé se révoque, et le compte dormant reste un risque."
t5.hint.admin.1: "`jq '.comptes | keys' training/comptes.json` donne les identifiants. Le nom d'un des comptes en dit long."
t5.hint.admin.2: "`jq '.comptes.migration' training/comptes.json` montre un administrateur avec `\"mfa\": false`. Puis `submit migration`."
t5.hint.token.1: "La clé `integrations` est une liste. `.integrations[]` parcourt chacun de ses éléments."
t5.hint.token.2: "`jq -r '.integrations[].jeton' training/comptes.json`, puis `submit` avec ce qui s'affiche."
t5.debrief.title: "Ce qu'un export raconte"
t5.debrief.lesson: "Un export de comptes est une carte du système : qui existe, avec quels droits, et parfois avec quels secrets. jq permet de le lire en quelques commandes. Un attaquant fait exactement la même chose avec ce qu'il trouve, alors autant le lire avant lui."
t5.debrief.p1: "Revue des accès régulière : chaque compte administrateur a un propriétaire, une raison d'exister et une double authentification. Un compte temporaire a une date de fin."
t5.debrief.p2: "Un export ne contient jamais de secret. Les jetons d'intégration vivent dans un coffre, avec une portée minimale et une date d'expiration."
t5.debrief.p3: "Un compte ou un jeton oublié qui se réveille doit déclencher une alerte : première connexion depuis des mois, première utilisation d'un jeton ancien."
