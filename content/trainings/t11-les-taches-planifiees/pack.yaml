title:
  fr: Les tâches planifiées
  en: Scheduled jobs
summary:
  fr: Un intrus revient souvent par une tâche planifiée. Connecte-toi au serveur de fichiers d'une mairie, lis les tâches d'un compte avec crontab, et repère celle qui n'a rien à faire là.
  en: An intruder often comes back through a scheduled job. Log in to a town hall's file server, read an account's jobs with crontab, and spot the one that does not belong.
