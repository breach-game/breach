t11.briefing: "La mairie de Corbelle t'a ouvert un accès en lecture seule à son serveur de fichiers, le temps d'une vérification. Une question simple : est-ce qu'un des comptes a une tâche planifiée qu'il ne devrait pas avoir ? C'est la première chose qu'on regarde après une intrusion, parce que c'est souvent par là que l'intrus revient."
t11.obj.login: "Se connecter au serveur de fichiers"
t11.obj.job: "Trouver la tâche planifiée qui n'a rien à faire là (son programme, chemin complet, avec `submit`)"
t11.obj.why: "Dire ce qui la trahit"
t11.ada.brief: "Onzième entraînement. Tu as un compte `ir` en lecture seule sur `fichiers.corbelle.test`. Les tâches de chaque compte sont dans sa crontab."
t11.ada.login: "Connecte-toi : `ssh ir@fichiers.corbelle.test`."
t11.ada.login.standard: "Connecte-toi en `ssh` au serveur de fichiers avec le compte `ir`."
t11.ada.list: "Quels comptes existent ici ? `cat /etc/passwd`. Un compte de service, c'est un bon candidat : lis ses tâches avec `crontab -l -u svc-sauvegarde`."
t11.ada.list.standard: "Repère les comptes de la machine, puis lis les tâches planifiées du compte de service avec `crontab`."
t11.ada.read: "Chaque ligne : minute, heure, jour du mois, mois, jour de la semaine, puis la commande. Une tâche lance un programme rangé à un drôle d'endroit : envoie son chemin avec `submit`."
t11.ada.read.standard: "Une des commandes planifiées détonne. Envoie son chemin complet."
t11.ada.found: "Un programme dans un dossier caché de `/var/tmp`, lancé chaque lundi à 6 h 12 sur les partages. Tu retrouveras cette ligne dans la saison 4."
t11.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t11.ada.answer.standard: "Ma question t'attend dans la messagerie."
t11.ada.done: "Oui. Un vrai outil vit dans un dossier installé et surveillé, pas dans un dossier temporaire caché. Passe au débrief."
t11.q.why: "Qu'est-ce qui trahit cette tâche, plus que tout le reste ?"
t11.q.why.hour: "Son horaire : 6 h 12 le lundi, alors que la sauvegarde tourne à 2 h."
t11.q.why.hour.why: "Un horaire inhabituel peut être légitime. L'intrus choisit d'ailleurs souvent une heure banale."
t11.q.why.place: "Son programme, rangé dans un dossier caché de /var/tmp, où tout le monde peut écrire."
t11.q.why.account: "Son compte : seul l'administrateur, root, devrait avoir des tâches planifiées sur la machine."
t11.q.why.account.why: "Les comptes de service ont souvent des tâches légitimes, comme la sauvegarde de 2 h juste au-dessus."
t11.hint.login.1: "`ssh ir@fichiers.corbelle.test`."
t11.hint.job.1: "`crontab -l -u svc-sauvegarde` affiche les tâches du compte de sauvegarde."
t11.hint.job.2: "La deuxième tâche lance `/var/tmp/.cache/verrou`. `submit /var/tmp/.cache/verrou`."
t11.debrief.title: "Ce qui tourne tout seul"
t11.debrief.lesson: "Une tâche planifiée permet à un intrus de revenir sans se reconnecter : même si on change les mots de passe, son programme se relance tout seul. Lire les crontabs de chaque compte fait partie de toute réponse à incident."
t11.debrief.p1: "Inventorier les tâches planifiées de chaque machine, et alerter sur toute modification (`crontab -e` laisse une ligne dans les journaux)."
t11.debrief.p2: "Un programme lancé depuis /tmp, /var/tmp ou un dossier caché est suspect par défaut : les vrais outils sont installés ailleurs."
t11.debrief.p3: "Les comptes de service n'ont que les droits de leur travail : celui de la sauvegarde n'a pas à modifier les partages."
