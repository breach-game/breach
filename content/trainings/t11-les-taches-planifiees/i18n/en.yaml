t11.briefing: "Corbelle town hall opened read-only access to its file server for a check. A simple question: does any account have a scheduled job it should not have? It is the first thing to look at after an intrusion, because that is often how the intruder comes back."
t11.obj.login: "Log in to the file server"
t11.obj.job: "Find the scheduled job that does not belong (its program, full path, with `submit`)"
t11.obj.why: "Say what gives it away"
t11.ada.brief: "Eleventh training. You have a read-only `ir` account on `fichiers.corbelle.test`. Each account's jobs are in its crontab."
t11.ada.login: "Log in: `ssh ir@fichiers.corbelle.test`."
t11.ada.login.standard: "Log in with `ssh` to the file server, with the `ir` account."
t11.ada.list: "Which accounts exist here? `cat /etc/passwd`. A service account is a good candidate: read its jobs with `crontab -l -u svc-sauvegarde`."
t11.ada.list.standard: "Find the accounts of the machine, then read the service account's scheduled jobs with `crontab`."
t11.ada.read: "Each line: minute, hour, day of month, month, day of week, then the command. One job runs a program stored in an odd place: send its path with `submit`."
t11.ada.read.standard: "One of the scheduled commands stands out. Send its full path."
t11.ada.found: "A program in a hidden folder of `/var/tmp`, run every Monday at 6:12 on the shares. You will meet this line again in season 4."
t11.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t11.ada.answer.standard: "My question is waiting in the messenger."
t11.ada.done: "Yes. A real tool lives in an installed, watched folder, not in a hidden temporary one. On to the debrief."
t11.q.why: "What gives this job away, more than anything else?"
t11.q.why.hour: "Its time: 6:12 on Mondays, while the backup runs at 2 a.m."
t11.q.why.hour.why: "An unusual time can be legitimate. Intruders often pick an ordinary hour anyway."
t11.q.why.place: "Its program, stored in a hidden folder of /var/tmp, where anyone can write."
t11.q.why.account: "Its account: only the administrator should have scheduled jobs."
t11.q.why.account.why: "Service accounts often have legitimate jobs, like the 2 a.m. backup just above."
t11.hint.login.1: "`ssh ir@fichiers.corbelle.test`."
t11.hint.job.1: "`crontab -l -u svc-sauvegarde` shows the jobs of the backup account."
t11.hint.job.2: "The second job runs `/var/tmp/.cache/verrou`. `submit /var/tmp/.cache/verrou`."
t11.debrief.title: "What runs on its own"
t11.debrief.lesson: "A scheduled job lets an intruder come back without logging in again: even after passwords change, their program starts again on its own. Reading every account's crontab is part of any incident response."
t11.debrief.p1: "Keep an inventory of each machine's scheduled jobs, and alert on any change (`crontab -e` leaves a line in the logs)."
t11.debrief.p2: "A program run from /tmp, /var/tmp or a hidden folder is suspect by default: real tools are installed elsewhere."
t11.debrief.p3: "Service accounts only have the rights their work needs: the backup account has no business changing the shares."
