t14.briefing: "Lou, ta petite sœur, vient d'emménager. Elle t'a envoyé la photo du coucher de soleil depuis son nouveau balcon, celle qu'elle va publier ce soir sur son profil public. Elle est dans `photos/balcon.jpg`, avec son message dans `photos/message.txt`. Avant qu'elle clique, regarde ce que la photo raconte en plus du coucher de soleil."
t14.file.message: "Lou, 19:58\nTrop contente de la vue !! Je la poste ce soir sur mon profil, tout le monde doit voir ça 🌅\nTu me dis si elle est bien ?\n"
t14.obj.read: "Lire ce que le téléphone a écrit dans la photo"
t14.obj.clean: "Retirer la position de la photo, puis relire ses métadonnées"
t14.obj.habit: "Choisir l'habitude qui évite le problème la prochaine fois"
t14.ada.brief: "Quatorzième entraînement, côté vie perso. Une photo de téléphone n'est pas qu'une image : l'appareil écrit dedans des métadonnées, appelées Exif. Rien de piraté ici, on lit juste un fichier que Lou t'a envoyé."
t14.ada.look: "Affiche les métadonnées de la photo : `exiftool photos/balcon.jpg`."
t14.ada.look.standard: "Lis les métadonnées de la photo avec `exiftool`."
t14.ada.read: "Regarde les lignes qui commencent par « GPS ». Réponds à ma question."
t14.ada.read.standard: "Lis les lignes GPS, puis réponds à ma question."
t14.ada.found: "Exactement. Une latitude et une longitude au mètre près, plus la date et l'heure : n'importe qui qui télécharge l'image sait où Lou habite désormais, et à quelle heure elle rentre. On l'enlève."
t14.ada.strip: "Retire seulement la position : `exiftool -gps:all= photos/balcon.jpg`. Puis vérifie en relisant avec `exiftool photos/balcon.jpg`."
t14.ada.strip.standard: "Retire les balises GPS avec `exiftool`, puis relis la photo pour vérifier."
t14.ada.clean: "Plus de GPS. exiftool a gardé l'original à côté, dans `balcon.jpg_original` : c'est celui-là qu'il ne faut pas envoyer. La photo propre peut partir."
t14.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t14.ada.answer.standard: "Ma question t'attend dans la messagerie."
t14.ada.done: "C'est ça. Le plus simple reste de ne pas écrire la position du tout. Débrief."
t14.q.reveal: "Que révèle cette photo, en plus du coucher de soleil ?"
t14.q.reveal.address: "L'endroit exact où elle a été prise, donc le nouveau logement de Lou."
t14.q.reveal.nothing: "Rien d'utile : ce ne sont que des réglages techniques de l'appareil."
t14.q.reveal.nothing.why: "Relis les lignes « GPS Position » : une latitude et une longitude précises, c'est une adresse."
t14.q.reveal.face: "Seulement le visage de Lou, qui apparaît dans le reflet de la vitre."
t14.q.reveal.face.why: "exiftool ne montre aucune image : il lit le texte caché dans le fichier, et ce texte contient une position."
t14.q.habit: "Quelle habitude évite que ça se reproduise ?"
t14.q.habit.camera: "Couper la position pour l'appareil photo dans les réglages."
t14.q.habit.rename: "Renommer chaque photo avant de la publier."
t14.q.habit.rename.why: "Le nom du fichier ne change rien aux métadonnées écrites à l'intérieur."
t14.q.habit.private: "Ne publier que des captures d'écran prises le soir."
t14.q.habit.private.why: "L'heure ne protège de rien, et une capture d'écran peut aussi garder des métadonnées selon les téléphones."
t14.hint.read.1: "`exiftool photos/balcon.jpg` liste toutes les balises. Celles qui commencent par « GPS » disent où."
t14.hint.read.2: "La position est une adresse : réponds `answer address`."
t14.hint.clean.1: "`exiftool -gps:all= photos/balcon.jpg` retire toutes les balises GPS et garde une copie de l'original."
t14.hint.clean.2: "Puis `exiftool photos/balcon.jpg` : plus aucune ligne GPS."
t14.debrief.title: "Le coucher de soleil avait une adresse"
t14.debrief.lesson: "Un téléphone écrit dans chaque photo l'appareil, la date et souvent la position précise de la prise de vue. Certains réseaux sociaux retirent ces données à la publication, d'autres non, et un fichier envoyé par mail, dans un cloud ou sur un site perso les garde. Le plus sûr est de ne pas les écrire."
t14.debrief.p1: "exiftool lit les métadonnées sans rien changer. `-gps:all=` retire la position, `-all=` retire tout."
t14.debrief.p2: "L'outil garde un fichier « _original » à côté : c'est la version à ne pas envoyer."
t14.debrief.p3: "La date et le modèle d'appareil disent aussi des choses : à quelle heure tu es chez toi, quel téléphone tu as."
t14.home.p1: "Dans les réglages de ton téléphone, coupe l'accès à la position pour l'appareil photo, ou mets-le sur « jamais »."
t14.home.p2: "Avant d'envoyer une photo hors d'une appli de messagerie (mail, cloud, petite annonce), regarde ses propriétés et retire la position."
