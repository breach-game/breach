t14.briefing: "Lou, your little sister, has just moved in somewhere new. She sent you the sunset from her new balcony, the one she is posting tonight on her public profile. It is in `photos/balcon.jpg`, with her message in `photos/message.txt`. Before she clicks, look at what the photo says besides the sunset."
t14.file.message: "Lou, 19:58\nSo happy with the view!! Posting it tonight on my profile, everyone has to see this 🌅\nDoes it look good?\n"
t14.obj.read: "Read what the phone wrote in the photo"
t14.obj.clean: "Remove the position from the photo, then read its metadata again"
t14.obj.habit: "Pick the habit that avoids it next time"
t14.ada.brief: "Training fourteen, on the personal side. A phone photo is not just a picture: the device writes metadata into it, called Exif. Nothing is hacked here, we just read a file Lou sent you."
t14.ada.look: "Show the photo's metadata: `exiftool photos/balcon.jpg`."
t14.ada.look.standard: "Read the photo's metadata with `exiftool`."
t14.ada.read: "Look at the lines starting with \"GPS\". Answer my question."
t14.ada.read.standard: "Read the GPS lines, then answer my question."
t14.ada.found: "Exactly. A latitude and longitude to the metre, plus the date and time: anyone who downloads the picture knows where Lou lives now, and when she gets home. Let's remove it."
t14.ada.strip: "Remove only the position: `exiftool -gps:all= photos/balcon.jpg`. Then check by reading it again with `exiftool photos/balcon.jpg`."
t14.ada.strip.standard: "Remove the GPS tags with `exiftool`, then read the photo again to check."
t14.ada.clean: "No more GPS. exiftool kept the original next to it, in `balcon.jpg_original`: that is the one not to send. The clean photo can go."
t14.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t14.ada.answer.standard: "My question is waiting in the messenger."
t14.ada.done: "That's it. Simplest of all is not writing the position in the first place. Debrief."
t14.q.reveal: "What does this photo reveal, besides the sunset?"
t14.q.reveal.address: "The exact place it was taken, so Lou's new home."
t14.q.reveal.nothing: "Nothing useful: these are only technical camera settings."
t14.q.reveal.nothing.why: "Read the \"GPS Position\" line again: a precise latitude and longitude is an address."
t14.q.reveal.face: "Only Lou's face, which shows in the reflection on the window."
t14.q.reveal.face.why: "exiftool shows no picture: it reads the text hidden in the file, and that text holds a position."
t14.q.habit: "Which habit keeps this from happening again?"
t14.q.habit.camera: "Turn off location for the camera in the settings."
t14.q.habit.rename: "Rename every photo before posting it."
t14.q.habit.rename.why: "The file name changes nothing in the metadata written inside."
t14.q.habit.private: "Only post screenshots, taken in the evening."
t14.q.habit.private.why: "The time protects nothing, and depending on the phone a screenshot can keep metadata too."
t14.hint.read.1: "`exiftool photos/balcon.jpg` lists every tag. The ones starting with \"GPS\" say where."
t14.hint.read.2: "The position is an address: answer `answer address`."
t14.hint.clean.1: "`exiftool -gps:all= photos/balcon.jpg` removes every GPS tag and keeps a copy of the original."
t14.hint.clean.2: "Then `exiftool photos/balcon.jpg`: no GPS line left."
t14.debrief.title: "The sunset had an address"
t14.debrief.lesson: "A phone writes the device, the date and often the precise position into every photo. Some social networks strip this data when you post, others do not, and a file sent by mail, through a cloud or on a personal site keeps it. The safest is not to write it."
t14.debrief.p1: "exiftool reads metadata without changing anything. `-gps:all=` removes the position, `-all=` removes everything."
t14.debrief.p2: "The tool keeps an \"_original\" file next to it: that is the version not to send."
t14.debrief.p3: "The date and the device model say things too: when you are home, which phone you have."
t14.home.p1: "In your phone's settings, turn off location access for the camera, or set it to \"never\"."
t14.home.p2: "Before sending a photo outside a messaging app (mail, cloud, a classified ad), look at its properties and remove the position."
