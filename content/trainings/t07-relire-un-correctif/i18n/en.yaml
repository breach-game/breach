t7.briefing: "A NovaMind developer wants to put a small route online tonight, which serves the clinics' annual reports. They ask Ligne Rouge for a review before pushing. Seventeen lines of Python: two of them are a real problem."
t7.obj.review: "Find the two faulty lines"
t7.obj.fix: "Pick the right fix"
t7.ada.brief: "Seventh training. The file is `~/training/rapports.py`. The route is public by design: a missing password is not what we are looking for."
t7.ada.read: "Show the file with its line numbers: `review training/rapports.py`. When a line looks faulty, name it: `review training/rapports.py <line>`."
t7.ada.read.standard: "Read `training/rapports.py` with `review`, then name each faulty line. A mistake costs 10 points."
t7.ada.join: "Yes. The name comes from the user and goes straight into the path. With `../`, or an absolute path, you leave `/srv/rapports`: that is path traversal."
t7.ada.debug: "Yes. Debug mode, listening on every interface, shows the code and sometimes a console at the first error. Never in production."
t7.ada.ext: "Checking the extension is not a fault in itself, just not enough: `.pdf` at the end does not stop anyone climbing up the folders. Look at where the name is used."
t7.ada.answer: "How do we fix line 13? Answer by clicking, or with `answer` in the terminal."
t7.ada.answer.standard: "My question is waiting in the messenger."
t7.ada.done: "That's it. You cannot guess every bad name: you check that the result stays where it belongs. On to the debrief."
t7.q.fix: "Which fix really closes line 13?"
t7.q.fix.dots: "Refuse any name that contains the characters \"../\" before building the path."
t7.q.fix.dots.why: "A deny list always misses a case: absolute path, backslashes, encoding. Check the result, not the input."
t7.q.fix.resolve: "Resolve the full path, then refuse it if it is no longer under /srv/rapports."
t7.q.fix.ext: "Also check that the name starts with a letter and really ends with \".pdf\"."
t7.q.fix.ext.why: "A name can start with a letter, end in .pdf and still climb up in the middle."
t7.q.fix.hide: "Move the reports into a folder with a name that is hard to guess."
t7.q.fix.hide.why: "The problem is not finding the reports folder, it is being able to leave it."
t7.hint.review.1: "Follow the name the user gives: where is it used? And look at how the server starts."
t7.hint.review.2: "One line builds a path with a value from the request. Another starts the server in a mode meant for the developer's laptop."
t7.hint.review.3: "`review training/rapports.py 13` then `review training/rapports.py 17`."
t7.debrief.title: "A review that matters"
t7.debrief.lesson: "A security review follows outside data to the place where it is used: a path, an SQL query, a command. Where an input becomes an action, check the result, not a list of forbidden values."
t7.debrief.p1: "A path built with user input is resolved, then compared to the allowed folder. Better still: an identifier that points into a table of known files."
t7.debrief.p2: "Production settings differ from the developer's: no debug, generic errors, a limited listening address."
t7.debrief.p3: "A short review checklist helps: inputs, paths, queries, secrets, errors, start-up mode."
