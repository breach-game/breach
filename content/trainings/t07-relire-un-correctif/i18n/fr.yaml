t7.briefing: "Un développeur de NovaMind veut mettre en ligne ce soir une petite route qui sert les rapports annuels des cliniques. Il demande une relecture à Ligne Rouge avant de pousser. Dix-sept lignes de Python : deux d'entre elles posent un vrai problème."
t7.obj.review: "Trouver les deux lignes fautives"
t7.obj.fix: "Choisir la bonne correction"
t7.ada.brief: "Septième entraînement. Le fichier est `~/training/rapports.py`. La route est publique par conception : ce n'est pas l'absence de mot de passe qu'on cherche."
t7.ada.read: "Affiche le fichier avec ses numéros de ligne : `review training/rapports.py`. Quand une ligne te semble fautive, désigne-la : `review training/rapports.py <ligne>`."
t7.ada.read.standard: "Relis `training/rapports.py` avec `review`, puis désigne chaque ligne fautive. Une erreur coûte 10 points."
t7.ada.join: "Oui. Le nom vient de l'utilisateur et part tel quel dans le chemin. Avec des `../`, ou un chemin absolu, on sort de `/srv/rapports` : c'est une traversée de répertoires."
t7.ada.debug: "Oui. Le mode débogage, ouvert sur toutes les interfaces, affiche le code et parfois une console à la première erreur. Jamais en production."
t7.ada.ext: "Vérifier l'extension n'est pas une faute en soi, c'est juste insuffisant : `.pdf` à la fin n'empêche pas de remonter dans les dossiers. Cherche où le nom est utilisé."
t7.ada.answer: "Comment corriger la ligne 13 ? Réponds en cliquant, ou avec `answer` dans le terminal."
t7.ada.answer.standard: "Ma question t'attend dans la messagerie."
t7.ada.done: "C'est ça. On ne devine pas tous les mauvais noms : on vérifie que le résultat reste là où il doit être. Passe au débrief."
t7.q.fix: "Quelle correction ferme vraiment la ligne 13 ?"
t7.q.fix.dots: "Refuser tout nom qui contient « ../ » avant de construire le chemin."
t7.q.fix.dots.why: "Une liste noire oublie toujours un cas : chemin absolu, barres inverses, encodage. On vérifie le résultat, pas l'entrée."
t7.q.fix.resolve: "Résoudre le chemin complet, puis refuser s'il ne se trouve plus sous /srv/rapports."
t7.q.fix.ext: "Vérifier aussi que le nom commence par une lettre et finit bien par « .pdf »."
t7.q.fix.ext.why: "Le nom peut commencer par une lettre, finir par .pdf et remonter quand même au milieu."
t7.q.fix.hide: "Déplacer les rapports dans un dossier au nom difficile à deviner."
t7.q.fix.hide.why: "Le problème n'est pas de trouver le dossier des rapports, c'est de pouvoir en sortir."
t7.hint.review.1: "Suis le nom donné par l'utilisateur : où est-il utilisé ? Et regarde comment le serveur démarre."
t7.hint.review.2: "Une ligne construit un chemin avec une valeur qui vient de la requête. Une autre lance le serveur dans un mode réservé au poste du développeur."
t7.hint.review.3: "`review training/rapports.py 13` puis `review training/rapports.py 17`."
t7.debrief.title: "Une relecture qui sert à quelque chose"
t7.debrief.lesson: "Une relecture de sécurité suit les données qui viennent de l'extérieur jusqu'à l'endroit où elles servent : un chemin, une requête SQL, une commande. Là où une entrée devient une action, il faut une vérification sur le résultat, pas une liste de valeurs interdites."
t7.debrief.p1: "Un chemin construit avec une entrée utilisateur se résout, puis se compare au dossier autorisé. Mieux encore : un identifiant qui pointe vers une table de fichiers connus."
t7.debrief.p2: "La configuration de production se distingue de celle du poste de développement : pas de débogage, des erreurs génériques, une écoute limitée."
t7.debrief.p3: "Une liste de contrôle de relecture courte aide : entrées, chemins, requêtes, secrets, erreurs, mode de démarrage."
