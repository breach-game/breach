t3.briefing: "Un client de NovaMind a un doute : le script d'installation qu'il télécharge depuis hier « ne fait pas la même taille ». NovaMind nous transmet le script distribué, celui de son dépôt et les empreintes publiées. Dis-nous si quelqu'un y a touché."
t3.obj.prove: "Prouver que le script distribué a été modifié"
t3.obj.where: "Trouver l'adresse à laquelle le script envoie des données"
t3.obj.what: "Dire ce que la ligne ajoutée emporte"
t3.obj.clean: "Retirer la ligne du script distribué, puis vérifier"
t3.ada.brief: "Troisième entraînement, et celui-ci ressemble à de vraies affaires. Tout est dans `~/training` : `download/` contient ce que les clients reçoivent, `repo/` ce que les développeurs ont écrit."
t3.ada.hash: "NovaMind publie l'empreinte de son script dans `training/download/SHA256SUMS`. Lis-la avec `cat`, puis calcule celle du fichier distribué : `sha256sum training/download/install.sh`. Si un seul caractère a changé, les deux n'ont plus rien à voir."
t3.ada.hash.standard: "L'empreinte publiée est dans `training/download/SHA256SUMS`. Compare-la à celle du script distribué."
t3.ada.mismatch: "Les deux empreintes ne correspondent pas. Voilà la preuve : ce que les clients téléchargent n'est pas ce que NovaMind a publié."
t3.ada.diff: "Reste à savoir ce qui a changé. `diff training/repo/install.sh training/download/install.sh` montre les lignes qui diffèrent : `>` marque celles qui ne sont que dans le second fichier."
t3.ada.diff.standard: "Reste à savoir ce qui a changé entre le script du dépôt et celui qui est distribué."
t3.ada.line: "Une seule ligne ajoutée, avec un commentaire rassurant. Lis-la bien : elle envoie quelque chose vers une adresse. Donne-moi cette adresse avec `submit`."
t3.ada.line.standard: "Une seule ligne ajoutée. Où part ce qu'elle envoie ? Donne-moi l'adresse avec `submit`."
t3.ada.mute: "10.13.0.99. Note-la : cette adresse n'a rien à faire dans un installateur."
t3.ada.what: "Dis-moi ce que cette ligne emporte : ma question t'attend, réponds en cliquant ou avec `answer`."
t3.ada.what.standard: "Qu'est-ce que cette ligne emporte, au juste ? Réponds à ma question."
t3.ada.env: "Oui. `env` affiche toutes les variables d'environnement, et sur un serveur d'intégration ce sont les clés du royaume : jetons de dépôt, clés cloud, mots de passe de base. Chaque client qui a lancé ce script hier a tout donné."
t3.ada.clean: "On nettoie le script distribué. Supprime la ligne avec l'éditeur (`edit training/download/install.sh`) ou d'un coup : `sed -i /nm-report/d training/download/install.sh`. Puis `verify`."
t3.ada.clean.standard: "Retire la ligne du script distribué sans toucher au reste, puis lance `verify`. Pour ouvrir le fichier : `edit training/download/install.sh`."
t3.ada.done: "Le script est sain. Mais le vrai travail commence pour NovaMind : prévenir chaque client pour qu'il change tous ses secrets. Passe au débrief."
t3.q.what: "Que transmet la ligne ajoutée à 10.13.0.99 ?"
t3.q.what.stats: "Des statistiques d'usage anonymes, comme le dit le commentaire."
t3.q.what.stats.why: "C'est ce que dit le commentaire, et un commentaire ne s'exécute pas. Regarde la commande à gauche du tube `|`."
t3.q.what.env: "Toutes les variables d'environnement de la machine qui lance le script."
t3.q.what.files: "L'archive nova-cli elle-même."
t3.q.what.files.why: "L'archive est extraite à la ligne suivante, elle ne part nulle part. C'est la sortie de la commande à gauche du tube `|` qui est envoyée."
t3.check.line: "La ligne ajoutée a disparu du script distribué"
t3.check.works: "Le script installe toujours nova-cli"
t3.hint.prove.1: "Compare l'empreinte de `SHA256SUMS` à celle que calcule `sha256sum` sur le script distribué."
t3.hint.prove.2: "`sha256sum training/download/install.sh`"
t3.hint.where.1: "`diff` entre le script du dépôt et le script distribué montre la ligne ajoutée."
t3.hint.where.2: "`diff training/repo/install.sh training/download/install.sh`, puis `submit 10.13.0.99`."
t3.hint.clean.1: "Supprime la ligne qui contient `nm-report`, et seulement elle."
t3.hint.clean.2: "Avec l'éditeur : `edit training/download/install.sh`, puis Ctrl+S. Avec une commande : `sed -i /nm-report/d training/download/install.sh`, puis `verify`."
t3.debrief.title: "Faire confiance, mais vérifier"
t3.debrief.lesson: "L'attaquant n'a touché ni au code ni au dépôt : il a modifié le fichier là où il est distribué. Tous ceux qui l'ont lancé sans le vérifier ont exécuté sa ligne avec leurs propres droits. C'est le principe d'une attaque de la chaîne logicielle : compromettre un fournisseur pour atteindre tous ses clients."
t3.debrief.p1: "Vérifier l'empreinte avant d'exécuter, avec une empreinte obtenue par un autre canal que le fichier."
t3.debrief.p2: "Ne jamais lancer un script téléchargé directement dans un tube vers le shell : on exécute alors ce qu'on n'a pas lu."
t3.debrief.p3: "Donner le moins de secrets possible à l'intégration continue, et des secrets à courte durée de vie."
t3.debrief.p4: "Côté éditeur : surveiller ce qui est réellement distribué, signer les versions, et prévenir les clients vite et clairement."
