t3.briefing: "A NovaMind customer has a doubt: the installer he has been downloading since yesterday “is not the same size”. NovaMind passes us the distributed script, the one in its repository and the published fingerprints. Tell us whether someone touched it."
t3.obj.prove: "Prove the distributed script was altered"
t3.obj.where: "Find the address the script sends data to"
t3.obj.what: "Say what the added line takes away"
t3.obj.clean: "Remove the line from the distributed script, then verify"
t3.ada.brief: "Third training, and this one looks like real cases. Everything is in `~/training`: `download/` holds what customers get, `repo/` what the developers wrote."
t3.ada.hash: "NovaMind publishes its script's fingerprint in `training/download/SHA256SUMS`. Read it with `cat`, then compute the one of the distributed file: `sha256sum training/download/install.sh`. If a single character changed, the two have nothing in common."
t3.ada.hash.standard: "The published fingerprint is in `training/download/SHA256SUMS`. Compare it with the distributed script's."
t3.ada.mismatch: "The two fingerprints do not match. There is the proof: what customers download is not what NovaMind published."
t3.ada.diff: "Now to find what changed. `diff training/repo/install.sh training/download/install.sh` shows the lines that differ: `>` marks those only in the second file."
t3.ada.diff.standard: "Now to find what changed between the repository's script and the distributed one."
t3.ada.line: "A single added line, with a reassuring comment. Read it closely: it sends something to an address. Give me that address with `submit`."
t3.ada.line.standard: "A single added line. Where does what it sends go? Give me the address with `submit`."
t3.ada.mute: "10.13.0.99. Write it down: that address has no business in an installer."
t3.ada.what: "Tell me what this line takes away: my question is waiting, answer with a click or with `answer`."
t3.ada.what.standard: "What exactly does this line take away? Answer my question."
t3.ada.env: "Yes. `env` prints every environment variable, and on an integration server those are the keys to the kingdom: repository tokens, cloud keys, database passwords. Every customer who ran this script yesterday gave everything away."
t3.ada.clean: "We clean the distributed script. Delete the line with the editor (`edit training/download/install.sh`) or in one go: `sed -i /nm-report/d training/download/install.sh`. Then `verify`."
t3.ada.clean.standard: "Remove the line from the distributed script without touching the rest, then run `verify`. To open the file: `edit training/download/install.sh`."
t3.ada.done: "The script is sound. But the real work starts for NovaMind: warning every customer so they change all their secrets. On to the debrief."
t3.q.what: "What does the added line send to 10.13.0.99?"
t3.q.what.stats: "Anonymous usage statistics, as the comment says."
t3.q.what.stats.why: "That is what the comment says, and a comment does not run. Look at the command on the left of the `|` pipe."
t3.q.what.env: "Every environment variable of the machine running the script."
t3.q.what.files: "The nova-cli archive itself."
t3.q.what.files.why: "The archive is extracted on the next line, it goes nowhere. What is sent is the output of the command on the left of the `|` pipe."
t3.check.line: "The added line is gone from the distributed script"
t3.check.works: "The script still installs nova-cli"
t3.hint.prove.1: "Compare the fingerprint in `SHA256SUMS` with the one `sha256sum` computes on the distributed script."
t3.hint.prove.2: "`sha256sum training/download/install.sh`"
t3.hint.where.1: "`diff` between the repository's script and the distributed one shows the added line."
t3.hint.where.2: "`diff training/repo/install.sh training/download/install.sh`, then `submit 10.13.0.99`."
t3.hint.clean.1: "Delete the line that contains `nm-report`, and only that one."
t3.hint.clean.2: "With the editor: `edit training/download/install.sh`, then Ctrl+S. With a command: `sed -i /nm-report/d training/download/install.sh`, then `verify`."
t3.debrief.title: "Trust, but verify"
t3.debrief.lesson: "The attacker touched neither the code nor the repository: they changed the file where it is distributed. Everyone who ran it without checking executed their line with their own rights. That is the principle of a supply-chain attack: compromise one supplier to reach all its customers."
t3.debrief.p1: "Check the fingerprint before running, with a fingerprint obtained through another channel than the file."
t3.debrief.p2: "Never pipe a downloaded script straight into the shell: you then run what you have not read."
t3.debrief.p3: "Give continuous integration as few secrets as possible, and short-lived ones."
t3.debrief.p4: "On the vendor side: watch what is really distributed, sign releases, and warn customers quickly and clearly."
