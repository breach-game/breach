t1.briefing: "NovaMind sent us last night's access log of its public website. Someone tried passwords on the login page. Find out who, tell me whether it worked, then block the address."
t1.obj.who: "Identify the address forcing the login page"
t1.obj.account: "Find the account that gave in"
t1.obj.block: "Block the address in the deny list, then verify"
t1.ada.brief: "Quick training. Two files are waiting in `~/training`: the access log and the server's deny list. You do not read a log, you question it."
t1.ada.who: "First look at what a line is made of: `head -3 training/access.log`. The first column is the visitor's address. My question is right below: answer with a click, or with `answer` in the terminal."
t1.ada.who.standard: "The log is in `~/training/access.log`. Find the address hammering `/login`, then answer my question."
t1.ada.count: "To count, chain four small tools: `cut -d \" \" -f 1 training/access.log | sort | uniq -c | sort -rn | head -3`. `cut` keeps the first column, `sort` groups, `uniq -c` counts, `sort -rn` ranks."
t1.ada.count.standard: "Counting lines per address is a good start. `cut`, `sort` and `uniq -c` do that well together."
t1.ada.filter: "Volume is not the whole story. Keep only the login attempts before you count: `grep \"POST /login\" training/access.log | cut -d \" \" -f 1 | sort | uniq -c`."
t1.ada.filter.standard: "The most talkative address is not always the attacker. Look at what each one asks for."
t1.ada.found: "That is the one. Thirty-eight refusals in two minutes, five logins tried in turn: a bot, not a distracted employee."
t1.ada.success: "Now the real question: did it work? A refusal is code 401. Show its lines that are not refusals: `grep 203.0.113.57 training/access.log | grep -v \" 401 \"`. The login is at the end of the line. Send it to me with `submit`."
t1.ada.success.standard: "Did it work? Look for an answer that is not a refusal for this address, and send me the login with `submit`."
t1.ada.account: "Account compromised, and right after it an 88 kB data export. That detail goes first in the report: not “someone tried”, but “someone got in”."
t1.ada.block: "Last step, on the defence side. Add the address to the deny list: `edit training/blocklist.conf` opens the editor, or `echo \"deny 203.0.113.57;\" >> training/blocklist.conf`. Then run `verify`."
t1.ada.block.standard: "Defence now: add the address to `training/blocklist.conf`, in the same format as the existing line, then run `verify`. To open the file: `edit training/blocklist.conf`."
t1.ada.syntax: "Almost. One line per address, in the exact format `deny 203.0.113.57;`, semicolon included. And nothing that was already blocked gets removed."
t1.ada.done: "Clean. In ten minutes you did a SOC analyst's job: count, filter, conclude, block. On to the debrief."
t1.q.who: "Which address is forcing the login page?"
t1.q.who.monitor: "10.13.0.5"
t1.q.who.monitor.why: "It is the most talkative address, but look at what it asks for: `/health`, every 75 seconds. That is NovaMind's monitoring probe. Blocking it would blind their monitoring."
t1.q.who.attacker: "203.0.113.57"
t1.q.who.visitor: "198.51.100.14"
t1.q.who.visitor.why: "This one mistypes a password once and then logs in, from a real browser. That is an employee on a Monday morning."
t1.q.who.self: "10.13.0.66"
t1.q.who.self.why: "That one is us: the Ligne Rouge workstation during reconnaissance. A good reminder that your own traces are in this log."
t1.check.denied: "203.0.113.57 is denied"
t1.check.kept: "The earlier deny rule is still there"
t1.check.monitor: "The monitoring probe is not blocked"
t1.hint.who.1: "Count the lines per address, but only those aimed at `/login`."
t1.hint.who.2: "`grep \"POST /login\" training/access.log | cut -d \" \" -f 1 | sort | uniq -c`"
t1.hint.who.3: "The address is 203.0.113.57. Answer with `answer b`."
t1.hint.account.1: "A refused login returns 401. Look for a line from this address with another code."
t1.hint.account.2: "`grep 203.0.113.57 training/access.log | grep -v \" 401 \"`, then `submit c.morel`."
t1.hint.block.1: "Add a `deny <address>;` line at the end of `training/blocklist.conf`."
t1.hint.block.2: "`echo \"deny 203.0.113.57;\" >> training/blocklist.conf`, then `verify`. Or by hand, in the editor: `edit training/blocklist.conf`, then Ctrl+S."
t1.debrief.title: "What a log tells you"
t1.debrief.lesson: "A brute-force attack does not hide: it leaves dozens of refusals in the same place, from the same address, at a pace no human keeps. Someone still has to look, and look at the right column."
t1.debrief.p1: "Limit attempts: after five failures, logging in slows down or locks for that account and that address."
t1.debrief.p2: "Alert on the pattern, not the volume: many 401s then a success from the same address is the signal that matters."
t1.debrief.p3: "Blocking the address is not enough: the attacker knows c.morel's password. It must be changed and the sessions closed."
t1.debrief.p4: "A second factor would have made this guessed password useless."
