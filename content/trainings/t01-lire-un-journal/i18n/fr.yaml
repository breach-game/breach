t1.briefing: "NovaMind nous envoie le journal d'accès de sa vitrine pour la nuit dernière. Quelqu'un a essayé des mots de passe sur la page de connexion. Trouve qui, dis-moi si ça a marché, puis bloque l'adresse."
t1.obj.who: "Identifier l'adresse qui force la page de connexion"
t1.obj.account: "Trouver le compte qui a cédé"
t1.obj.block: "Bloquer l'adresse dans la liste de refus, puis vérifier"
t1.ada.brief: "Entraînement express. Deux fichiers t'attendent dans `~/training` : le journal d'accès et la liste de refus du serveur. Un journal, ça ne se lit pas, ça s'interroge."
t1.ada.who: "Regarde d'abord à quoi ressemble une ligne : `head -3 training/access.log`. La première colonne est l'adresse du visiteur. Ma question est juste en dessous : réponds en cliquant, ou avec `answer` dans le terminal."
t1.ada.who.standard: "Le journal est dans `~/training/access.log`. Trouve l'adresse qui s'acharne sur `/login`, puis réponds à ma question."
t1.ada.count: "Pour compter, on enchaîne quatre petits outils : `cut -d \" \" -f 1 training/access.log | sort | uniq -c | sort -rn | head -3`. `cut` garde la première colonne, `sort` regroupe, `uniq -c` compte, `sort -rn` classe."
t1.ada.count.standard: "Compter les lignes par adresse est un bon début. `cut`, `sort` et `uniq -c` font ça très bien ensemble."
t1.ada.filter: "Le volume ne dit pas tout. Garde seulement les tentatives de connexion avant de compter : `grep \"POST /login\" training/access.log | cut -d \" \" -f 1 | sort | uniq -c`."
t1.ada.filter.standard: "Le plus bavard n'est pas forcément l'attaquant. Regarde ce que chaque adresse demande."
t1.ada.found: "C'est elle. Trente-huit refus en deux minutes, cinq identifiants essayés à tour de rôle : un robot, pas un employé distrait."
t1.ada.success: "Maintenant la vraie question : est-ce que ça a marché ? Un refus, c'est le code 401. Montre ses lignes qui ne sont pas des refus : `grep 203.0.113.57 training/access.log | grep -v \" 401 \"`. L'identifiant est en fin de ligne. Envoie-le-moi avec `submit`."
t1.ada.success.standard: "Est-ce que ça a marché ? Cherche une réponse qui ne soit pas un refus pour cette adresse, et envoie-moi l'identifiant avec `submit`."
t1.ada.account: "Compte compromis, et juste après un export de données de 88 ko. C'est ce détail-là qu'on écrit en premier dans le rapport : pas « quelqu'un a essayé », mais « quelqu'un est entré »."
t1.ada.block: "Dernière étape, côté défense. Ajoute l'adresse à la liste de refus : `edit training/blocklist.conf` ouvre l'éditeur, ou bien `echo \"deny 203.0.113.57;\" >> training/blocklist.conf`. Puis lance `verify`."
t1.ada.block.standard: "Côté défense maintenant : ajoute l'adresse à `training/blocklist.conf`, dans le même format que la ligne existante, puis lance `verify`. Pour ouvrir le fichier : `edit training/blocklist.conf`."
t1.ada.syntax: "Presque. Une ligne par adresse, au format exact `deny 203.0.113.57;`, avec le point-virgule. Et on ne retire rien de ce qui était déjà bloqué."
t1.ada.done: "Propre. Tu as fait en dix minutes le travail d'un analyste SOC : compter, filtrer, conclure, bloquer. Passe au débrief."
t1.q.who: "Quelle adresse force la page de connexion ?"
t1.q.who.monitor: "10.13.0.5"
t1.q.who.monitor.why: "C'est l'adresse la plus bavarde, mais regarde ce qu'elle demande : `/health`, toutes les 75 secondes. C'est la sonde de supervision de NovaMind. La bloquer couperait leur surveillance."
t1.q.who.attacker: "203.0.113.57"
t1.q.who.visitor: "198.51.100.14"
t1.q.who.visitor.why: "Celle-ci se trompe une fois de mot de passe puis se connecte, depuis un vrai navigateur. C'est un employé un lundi matin."
t1.q.who.self: "10.13.0.66"
t1.q.who.self.why: "Celle-là, c'est nous : le poste de Ligne Rouge pendant la reconnaissance. Un bon rappel que tes propres traces sont dans ce journal."
t1.check.denied: "203.0.113.57 est refusée"
t1.check.kept: "L'ancienne règle de refus est toujours là"
t1.check.monitor: "La sonde de supervision n'est pas bloquée"
t1.hint.who.1: "Compte les lignes par adresse, mais seulement celles qui visent `/login`."
t1.hint.who.2: "`grep \"POST /login\" training/access.log | cut -d \" \" -f 1 | sort | uniq -c`"
t1.hint.who.3: "L'adresse est 203.0.113.57. Réponds avec `answer b`."
t1.hint.account.1: "Un refus de connexion renvoie 401. Cherche une ligne de cette adresse avec un autre code."
t1.hint.account.2: "`grep 203.0.113.57 training/access.log | grep -v \" 401 \"`, puis `submit c.morel`."
t1.hint.block.1: "Ajoute une ligne `deny <adresse>;` à la fin de `training/blocklist.conf`."
t1.hint.block.2: "`echo \"deny 203.0.113.57;\" >> training/blocklist.conf`, puis `verify`. Ou à la main, dans l'éditeur : `edit training/blocklist.conf`, puis Ctrl+S."
t1.debrief.title: "Ce qu'un journal raconte"
t1.debrief.lesson: "Une attaque par force brute ne se cache pas : elle laisse des dizaines de refus au même endroit, depuis la même adresse, à un rythme qu'aucun humain ne tient. Encore faut-il que quelqu'un regarde, et regarde la bonne colonne."
t1.debrief.p1: "Limiter les essais : après cinq échecs, la connexion ralentit ou se bloque pour ce compte et cette adresse."
t1.debrief.p2: "Alerter sur le motif, pas sur le volume : beaucoup de 401 puis un succès depuis la même adresse, c'est le signal qui compte."
t1.debrief.p3: "Bloquer l'adresse ne suffit pas : le mot de passe de c.morel est connu de l'attaquant. Il faut le changer et fermer ses sessions."
t1.debrief.p4: "Un second facteur aurait rendu ce mot de passe deviné inutile."
