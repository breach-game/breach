t10.briefing: "Verdure, une ferme verticale, fait parler ses capteurs, ses lampes et son automate à travers un courtier de messages. Avant la saison 8, un petit tour de main : écouter un courtier, et comprendre pourquoi un courtier ouvert à tous est un interrupteur ouvert à tous."
t10.obj.listen: "Trouver le capteur qui mesure l'humidité la plus haute"
t10.obj.order: "Allumer la lampe du banc d'essai, et seulement elle"
t10.obj.fix: "Dire ce qui ferme le courtier"
t10.ada.brief: "Dixième entraînement. Le mandat t'autorise à écouter tout le courtier, mais à n'envoyer d'ordre qu'au banc d'essai de l'atelier, la serre 0. Les serres 1 à 3 sont en production : on n'y touche pas."
t10.ada.listen: "Un courtier se lit par sujets, et `#` veut dire « tout ce qui suit ». Écoute les serres : `mqtt sub -h broker.verdure.test -t \"verdure/serre/#\"`."
t10.ada.listen.standard: "Abonne-toi aux sujets des serres avec `mqtt sub`. Le joker `#` prend tout ce qui suit."
t10.ada.read: "Aucun compte demandé, et chaque message retenu s'affiche. Les mesures sont en JSON : `hum`, c'est l'humidité. Envoie le nom du capteur qui a la plus haute avec `submit`."
t10.ada.read.standard: "Compare les mesures `hum` de chaque capteur, puis envoie le nom du plus humide."
t10.ada.order: "Si tout le monde peut lire, tout le monde peut-il écrire ? Sur le banc seulement : `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
t10.ada.order.standard: "Essaie d'écrire, sur le seul sujet du banc d'essai. Les sujets qui finissent par `/set` reçoivent des ordres."
t10.ada.rooms: "Stop. Ce sujet est une serre en production : le mandat l'interdit, et l'équipe de nuit vient de le voir passer."
t10.ada.ordered: "La lampe obéit à n'importe qui. Sur une vraie serre, c'est l'éclairage, la brume ou la température de toute une récolte."
t10.ada.answer: "Réponds à ma question : en cliquant, ou avec `answer` dans le terminal."
t10.ada.answer.standard: "Ma question t'attend dans la messagerie."
t10.ada.done: "Oui : un compte par appareil, et des droits par sujet. Tu retrouveras ce courtier dans la saison 8. Passe au débrief."
t10.noise.rooms: "Ordre envoyé à une serre en production"
t10.q.fix: "Qu'est-ce qui ferme vraiment ce courtier ?"
t10.q.fix.accounts: "Un compte par appareil, et une liste de droits qui dit qui lit et qui écrit chaque sujet."
t10.q.fix.port: "Changer le port 1883 pour un port moins connu, que les scanners ne testent pas."
t10.q.fix.port.why: "Un scan complet trouve n'importe quel port. Le courtier resterait ouvert à qui le trouve."
t10.q.fix.names: "Renommer chaque sujet avec un long nom aléatoire, impossible à deviner."
t10.q.fix.names.why: "Le joker `#` liste tous les sujets d'un coup : leur nom ne protège rien."
t10.hint.listen.1: "`mqtt sub -h broker.verdure.test -t \"verdure/serre/#\"` affiche les dernières valeurs de chaque sujet."
t10.hint.listen.2: "Le plus humide affiche `\"hum\":74`. `submit capteur-11`."
t10.hint.order.1: "Le sujet du banc d'essai est `verdure/serre/0/lampe/set`. `mqtt pub` envoie un message avec `-m`."
t10.hint.order.2: "`mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
t10.debrief.title: "Écouter, c'est souvent pouvoir parler"
t10.debrief.lesson: "Un courtier de messages relie des objets qui ne se connaissent pas. Sans compte ni droits, n'importe qui sur le réseau lit toutes les mesures et donne tous les ordres. Le défaut n'est pas MQTT : c'est la configuration livrée par défaut, jamais refermée."
t10.debrief.p1: "Un compte par appareil, jamais un mot de passe commun à toute la flotte."
t10.debrief.p2: "Des droits par sujet : un capteur publie ses mesures, l'automate envoie les ordres, et personne d'autre."
t10.debrief.p3: "Un réseau séparé pour les objets, et une alerte sur tout client inconnu qui s'abonne à `#`."
