t10.briefing: "Verdure, a vertical farm, has its sensors, lamps and controller talk through a message broker. Before season 8, a quick hands-on: listen to a broker, and understand why a broker open to all is a switch open to all."
t10.obj.listen: "Find the sensor that measures the highest humidity (its name, with `submit`)"
t10.obj.order: "Switch on the test bench lamp, and only that one"
t10.obj.fix: "Say what closes the broker"
t10.ada.brief: "Tenth training. The mandate lets you listen to the whole broker, but send orders only to the workshop's test bench, room 0. Rooms 1 to 3 are in production: hands off."
t10.ada.listen: "A broker is read by topics, and `#` means \"everything below\". Listen to the rooms: `mqtt sub -h broker.verdure.test -t \"verdure/serre/#\"`."
t10.ada.listen.standard: "Subscribe to the rooms' topics with `mqtt sub`. The wildcard `#` takes everything below."
t10.ada.read: "No account asked, and every retained message shows. The measures are JSON: `hum` is the humidity. Send the name of the sensor with the highest one, with `submit`."
t10.ada.read.standard: "Compare the `hum` measure of each sensor, then send the name of the most humid."
t10.ada.order: "If anyone can read, can anyone write? On the bench only: `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
t10.ada.order.standard: "Try to write, on the test bench topic only. Topics ending in `/set` take orders."
t10.ada.rooms: "Stop. That topic is a room in production: the mandate forbids it, and the night team just saw it go by."
t10.ada.ordered: "The lamp obeys anyone. On a real room, that is the lighting, the mist or the temperature of a whole harvest."
t10.ada.answer: "Answer my question: click, or use `answer` in the terminal."
t10.ada.answer.standard: "My question is waiting in the messenger."
t10.ada.done: "Yes: one account per device, and rights per topic. You will meet this broker again in season 8. On to the debrief."
t10.noise.rooms: "Order sent to a room in production"
t10.q.fix: "What really closes this broker?"
t10.q.fix.accounts: "One account per device, and rights saying who reads and writes each topic."
t10.q.fix.port: "Move the broker from port 1883 to a less known port that scanners skip."
t10.q.fix.port.why: "A full scan finds any port. The broker would stay open to whoever finds it."
t10.q.fix.names: "Rename every topic with long random names that are impossible to guess."
t10.q.fix.names.why: "The `#` wildcard lists every topic at once: their names protect nothing."
t10.ada.marker: "That is the audit marker left for the Verdure audit. It proves the same flaw, but it does not count in this training: here we are looking for a sensor."
t10.hint.listen.1: "`mqtt sub -h broker.verdure.test -t \"verdure/serre/#\"` shows the last value of each topic."
t10.hint.listen.2: "The most humid shows `\"hum\":74`. `submit capteur-11`."
t10.hint.order.1: "The test bench topic is `verdure/serre/0/lampe/set`. `mqtt pub` sends a message with `-m`."
t10.hint.order.2: "`mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
t10.debrief.title: "Listening often means talking"
t10.debrief.lesson: "A message broker links devices that do not know each other. Without accounts or rights, anyone on the network reads every measure and gives every order. The flaw is not MQTT: it is the default configuration, never closed."
t10.debrief.p1: "One account per device, never one password shared by the whole fleet."
t10.debrief.p2: "Rights per topic: a sensor publishes its measures, the controller sends orders, and nobody else."
t10.debrief.p3: "A separate network for devices, and an alert on any unknown client subscribing to `#`."
