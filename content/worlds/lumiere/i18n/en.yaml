file.readme: "Ligne Rouge workstation. Season 7: Lumière Noire. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "INVITATION TO PROGRAMME LN-BB-2028\nLumière Noire festival, 8 to 10 September 2028. Private bug bounty programme, by invitation.\nScope: www.lumierenoire.test, billetterie.lumierenoire.test, api.lumierenoire.test.\nOut of scope: everything else, including pay.guichetpay.test (the payment provider) and mail.lumierenoire.test.\nYour test account: kestrel-test, ticket 7102. Its session is sent in a cookie:\n  curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte\nRules: one proof is enough, stop at the first. No data of a real festival-goer read, copied or kept. Report within 24 hours. Nothing public before the fix.\nThis programme is an authorisation for this scope and these rules, and for nothing else (article 323-1 of the French Penal Code).\n"
web.footer: "Lumière Noire - fictional festival, BREACH season 7"
web.nav.home: "The festival"
web.nav.security: "Security"
web.home.title: "Lumière Noire 2028"
web.home.h1: "Three nights in a quarry"
web.home.p1: "Lumière Noire, an electronic music festival, 8 to 10 September 2028. Three stages cut into the stone, eighteen thousand festival-goers."
web.home.p2: "Tickets are bought, transferred and refunded on `billetterie.lumierenoire.test`."
web.sec.title: "Lumière Noire - security programme"
web.sec.h1: "Found a flaw? Tell us"
web.sec.p1: "We are an association, not a bank. We would rather hear about a flaw from someone well-meaning, and we reward reports made within the rules."
web.sec.scope.h2: "What you may test"
web.sec.th.asset: "Address"
web.sec.th.status: "In the programme?"
web.sec.inscope: "Yes"
web.sec.out.pay: "No: it belongs to GuichetPay, our payment provider"
web.sec.out.mail: "No"
web.sec.rules.h2: "The rules"
web.sec.r1: "Only use the test account that came with your invitation."
web.sec.r2: "One proof is enough. Stop at the first, do not try to see how far it goes."
web.sec.r3: "Do not read, copy or keep any data of a real festival-goer or a real volunteer."
web.sec.r4: "Send your report within 24 hours, with the steps to reproduce."
web.sec.r5: "Publish nothing before we have fixed it. We commit to answering within 3 days."
web.sec.triage: "Send a report"
web.triage.title: "Lumière Noire - send a report"
web.triage.h1: "Send a report"
web.triage.p1: "Malia reads every report of the programme. Tell her what you found."
web.office.title: "Lumière Noire ticket office"
web.office.nav.home: "Ticket office"
web.office.nav.transfer: "Transfer a ticket"
web.office.nav.refund: "Get a refund"
web.office.h1: "Your ticket, in three clicks"
web.office.p1: "3-day pass: 89 €. Your account is at `/compte`, your ticket at `/billets/<number>`."
web.office.p2: "Something came up? Transfer your ticket to a friend, or get a refund until 5 September."
web.office.pay: "Payment is handled by GuichetPay, on `pay.guichetpay.test`."
web.transfer.title: "Ticket office - transfer a ticket"
web.transfer.h1: "Transfer a ticket"
web.transfer.p1: "Your friend receives a new ticket in their name. On the test account, the friend is always `amie-test`."
web.transfer.label: "Ticket number"
web.transfer.button: "Transfer"
web.refund.title: "Ticket office - refund"
web.refund.h1: "Get a refund"
web.refund.p1: "The price of the ticket goes back to your payment method, and the ticket is cancelled."
web.refund.label: "Ticket number"
web.refund.button: "Ask for a refund"
npc.transfer.role: "Ticket transfer form"
npc.transfer.unknown: "Unknown ticket on this account."
npc.transfer.done: "Transfer done.\n\nTicket 7102      transferred to amie-test\nNew ticket       7140 (amie-test, valid)\nYour ticket 7102 is no longer valid at the gate."
npc.transfer.again: "Ticket 7102 was already transferred to amie-test (new ticket 7140)."
npc.refund.role: "Refund form"
npc.refund.unknown: "Unknown ticket on this account."
npc.refund.normal: "Refund accepted.\n\nTicket 7102      89.00 EUR returned\n(test account: the ticket stays usable for the rest of the programme)"
npc.refund.double: "Refund accepted.\n\nTicket 7102      89.00 EUR returned\n\nbilletterie debug: ticket 7102 was transferred, and it has just been refunded.\n  amie-test keeps ticket 7140, valid. One entry, zero euro.\n  marker of the test account: FLAG{lumiere-two-for-none-93c7}"
npc.refund.refused: "Refund refused: ticket 7102 was transferred. Only its current holder can ask for a refund."
npc.malia.role: "Reads the reports of the security programme"
npc.malia.greeting: "Hello, this is Malia, for the Lumière Noire security programme. What did you find?"
npc.malia.hello: "Hello. Tell me what you found, and on which address."
npc.malia.payment: "GuichetPay is out of the programme: it is not our system, we cannot authorise you to test it. If you saw something there without touching anything, describe it to me, and we will warn them ourselves."
npc.malia.bounty: "I promise nothing before I have reproduced it. Our grid goes from €50 for a detail to €1,500 for what touches money or festival-goers' data."
npc.malia.early: "Thank you for writing. To reproduce it I need a written report: a title, the steps, the proof, and no data of a real person. Come back when it is ready."
npc.malia.report: "Thank you. I reproduced the three points with your steps, in ten minutes, on a test account. Ticket readable by its number, refund after transfer, public volunteer export: high severity for all three. The export is already closed. The other two will be fixed within ten days, before the gates open. The reward will be €1,200. One request: do not talk about it publicly before 4 October. After that, write what you like, we will gladly read it."
npc.malia.report.again: "I do have your report LN-2028-014. Nothing new since: the fix is planned before the gates open."
npc.malia.fallback: "I am not sure I understand. Do you want to report a flaw, or ask a question about the programme?"
ada.outOfScope: "Stop. This target is outside programme LN-BB-2028. A bug bounty only authorises what it lists: outside it, this is no longer research, it is an offence (article 323-1 of the French Penal Code). Come back into scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
