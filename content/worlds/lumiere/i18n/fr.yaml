file.readme: "Poste Ligne Rouge. Saison 7 : Lumière Noire. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "INVITATION AU PROGRAMME LN-BB-2028\nFestival Lumière Noire, du 23 au 25 septembre 2028. Programme de bug bounty privé, sur invitation.\nPérimètre : www.lumierenoire.test, billetterie.lumierenoire.test, api.lumierenoire.test.\nHors périmètre : tout le reste, dont pay.guichetpay.test (le prestataire de paiement) et mail.lumierenoire.test.\nTon compte de test : kestrel-test, billet 7102. Un second compte de test, billet 7101, est posé pour prouver un accès. Tous les autres billets sont de vrais festivaliers.\nLa session de ton compte s'envoie dans un cookie :\n  curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte\nRègles : une preuve suffit, on s'arrête à la première. Aucune donnée d'un vrai festivalier lue, copiée ou gardée. Rapport sous 24 heures. Rien de public avant la correction.\nCe programme vaut autorisation pour ce périmètre et ces règles, et pour rien d'autre (article 323-1 du Code pénal).\n"
web.footer: "Lumière Noire - festival fictif, BREACH saison 7"
web.nav.home: "Le festival"
web.nav.security: "Sécurité"
web.home.title: "Lumière Noire 2028"
web.home.h1: "Trois nuits dans une carrière"
web.home.p1: "Lumière Noire, festival de musiques électroniques, du 23 au 25 septembre 2028. Trois scènes taillées dans la pierre, dix-huit mille festivaliers."
web.home.p2: "Les billets se prennent, se transfèrent et se remboursent sur `billetterie.lumierenoire.test`."
web.sec.title: "Lumière Noire - programme de sécurité"
web.sec.h1: "Vous avez trouvé une faille ? Dites-le-nous"
web.sec.p1: "Nous sommes une association, pas une banque. Nous préférons qu'une faille nous soit signalée par quelqu'un de bienveillant, et nous récompensons les signalements faits dans les règles."
web.sec.scope.h2: "Ce que vous pouvez tester"
web.sec.th.asset: "Adresse"
web.sec.th.status: "Dans le programme ?"
web.sec.inscope: "Oui"
web.sec.out.pay: "Non : appartient à GuichetPay, notre prestataire de paiement"
web.sec.out.mail: "Non"
web.sec.rules.h2: "Les règles"
web.sec.r1: "Utilisez uniquement le compte de test fourni avec votre invitation."
web.sec.r2: "Une preuve suffit. Arrêtez-vous à la première, ne cherchez pas à voir jusqu'où cela va."
web.sec.r3: "Ne lisez, ne copiez et ne gardez aucune donnée d'un vrai festivalier ou d'un vrai bénévole."
web.sec.r4: "Envoyez votre rapport sous 24 heures, avec les étapes pour reproduire."
web.sec.r5: "Ne publiez rien avant que nous ayons corrigé. Nous nous engageons à répondre sous 3 jours."
web.sec.triage: "Envoyer un rapport"
web.triage.title: "Lumière Noire - envoyer un rapport"
web.triage.h1: "Envoyer un rapport"
web.triage.p1: "Malia lit tous les rapports du programme. Dites-lui ce que vous avez trouvé."
web.office.title: "Billetterie Lumière Noire"
web.office.nav.home: "Billetterie"
web.office.nav.transfer: "Transférer un billet"
web.office.nav.refund: "Se faire rembourser"
web.office.h1: "Votre billet, en trois clics"
web.office.p1: "Pass 3 jours : 89 €. Votre compte est sur `/compte`, votre billet sur `/billets/<numéro>`."
web.office.p2: "Un empêchement ? Transférez votre billet à un ami, ou faites-vous rembourser jusqu'au 5 septembre."
web.office.pay: "Le paiement est assuré par GuichetPay, sur `pay.guichetpay.test`."
web.transfer.title: "Billetterie - transférer un billet"
web.transfer.h1: "Transférer un billet"
web.transfer.p1: "Votre ami reçoit un nouveau billet à son nom. Sur le compte de test, l'ami est toujours `amie-test`."
web.transfer.label: "Numéro du billet"
web.transfer.button: "Transférer"
web.refund.title: "Billetterie - remboursement"
web.refund.h1: "Se faire rembourser"
web.refund.p1: "Le prix du billet est rendu sur votre moyen de paiement, et le billet est annulé."
web.refund.label: "Numéro du billet"
web.refund.button: "Demander le remboursement"
npc.transfer.role: "Formulaire de transfert de billet"
npc.transfer.unknown: "Billet inconnu sur ce compte."
npc.transfer.done: "Transfert effectué.\n\nBillet 7102      transféré à amie-test\nNouveau billet   7140 (amie-test, valide)\nVotre billet 7102 n'est plus valable à l'entrée."
npc.transfer.again: "Le billet 7102 a déjà été transféré à amie-test (nouveau billet 7140)."
npc.refund.role: "Formulaire de remboursement"
npc.refund.unknown: "Billet inconnu sur ce compte."
npc.refund.normal: "Remboursement accepté.\n\nBillet 7102      89,00 EUR (simulé)\n(compte de test : simulation, rien n'a été rendu et le billet reste valable pour la suite du programme)"
npc.refund.double: "Remboursement accepté.\n\nBillet 7102      89,00 EUR rendus\n\nbilletterie debug: le billet 7102 a été transféré, et il vient d'être remboursé.\n  amie-test garde le billet 7140, valide. Une entrée, zéro euro.\n  témoin du compte de test : FLAG{lumiere-two-for-none-93c7}"
npc.refund.refused: "Remboursement refusé : le billet 7102 a été transféré. Seul son détenteur actuel peut demander un remboursement."
npc.malia.role: "Lit les rapports du programme de sécurité"
npc.malia.greeting: "Bonjour, ici Malia, pour le programme de sécurité de Lumière Noire. Qu'avez-vous trouvé ?"
npc.malia.hello: "Bonjour. Dites-moi ce que vous avez trouvé, et sur quelle adresse."
npc.malia.payment: "GuichetPay est hors programme : ce n'est pas notre système, nous ne pouvons pas vous autoriser à le tester. Si vous y avez vu quelque chose sans rien toucher, décrivez-le-moi, et c'est nous qui les prévenons."
npc.malia.bounty: "Je ne promets rien avant d'avoir reproduit. Notre grille va de 50 € pour un détail à 1 500 € pour ce qui touche l'argent ou les données des festivaliers."
npc.malia.early: "Merci de nous écrire. Pour que je puisse reproduire, il me faut un rapport écrit : un titre, les étapes, la preuve, et aucune donnée d'une vraie personne. Revenez me voir quand il est prêt."
npc.malia.report: "Merci. J'ai reproduit les trois points avec vos étapes, en dix minutes, sur un compte de test. Billet lisible par son numéro, remboursement après transfert, export des bénévoles public : gravité haute pour les trois. L'export est déjà fermé. Les deux autres seront corrigés d'ici dix jours, avant l'ouverture des portes. La prime sera de 1 200 €. Une demande : n'en parlez pas publiquement avant le 4 octobre. Ensuite, écrivez ce que vous voulez, nous relirons avec plaisir."
npc.malia.report.again: "J'ai bien votre rapport LN-2028-014. Rien de nouveau depuis : correction prévue avant l'ouverture des portes."
npc.malia.fallback: "Je ne suis pas sûre de comprendre. Vous voulez signaler une faille, ou poser une question sur le programme ?"
ada.outOfScope: "Stop. Cette cible est hors du programme LN-BB-2028. Un bug bounty n'autorise que ce qu'il liste : en dehors, ce n'est plus de la recherche, c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
