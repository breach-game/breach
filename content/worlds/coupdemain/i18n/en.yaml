web.share.h2: "A help app for our neighbourhood"
web.share.m1: "Team: We would like an app where neighbours post requests for help. It has to be online on Monday."
web.share.r1: "Bricole: Let's go. I use Socle for the database: the app talks to it straight from the browser, with the project's public key. I create the tables profils, demandes, groupes, membres and coffre."
web.share.m2: "Team: Signing up does not work, it says \"permission denied\". Here is our configuration file:"
web.share.r2: "Bricole: Thanks. The problem is the row rules. To move on, I set rules that let everything through, we will tighten them later. Your file:"
web.share.env: "SOCLE_URL=https://base.coupdemain.test\nSOCLE_ANON_KEY=sk_anon_cdm_7d21e0\nSOCLE_SERVICE_KEY=sk_service_cdm_e19b44"
web.share.r3: "Bricole: Careful, the service key ignores every rule. It must never leave the server. Remember to change it, since it is in this conversation."
web.share.m3: "Team: OK, we will see to that after the launch. Can you also create a demo account for the presentation?"
web.share.r4: "Bricole: Done: demo@coupdemain.test, password demo1234, with administrator rights. To be removed before going live."
