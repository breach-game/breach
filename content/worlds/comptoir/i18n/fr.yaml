file.readme: "Poste Ligne Rouge. Saison 11 : Comptoir. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT CP-2029-09\nClient : Comptoir SA, néobanque. Périmètre : *.comptoir.test, 10.26.0.0/24.\nObjet : audit de l'API qui sert l'appli mobile et les partenaires (OWASP API Security Top 10).\n\nRègles :\n- Toute preuve se fait sur les deux comptes de test (1042 et 1043). Lire le compte d'un vrai client est une faute.\n- Aucun virement réel, aucune inscription en masse.\n- Les serveurs internes (noms en .int.comptoir.test) ne sont pas joignables de l'extérieur et ne sont pas à attaquer directement.\n- Signé : Inès Carrel, responsable sécurité de Comptoir.\n"
file.accounts: "COMPTES DE TEST - mandat CP-2029-09\n\nCompte 1042, KESTREL TEST : le tien.\n  jeton : cpt_test_4f1a9c\n  usage : curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me\n\nCompte 1043, ADA TEST : celui d'Ada. Tu n'as pas son jeton, et c'est voulu :\n  si tu arrives à le lire avec le tien, c'est une faille.\n\nClient OAuth de test : lignerouge-lab, retour https://lab.lignerouge.test/cb\n"
