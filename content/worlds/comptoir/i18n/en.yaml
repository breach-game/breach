file.readme: "Ligne Rouge workstation. Season 11: Comptoir. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE CP-2029-09\nClient: Comptoir SA, neobank. Scope: *.comptoir.test, 10.26.0.0/24.\nPurpose: audit of the API that serves the mobile app and the partners (OWASP API Security Top 10).\n\nRules:\n- Every proof is made on the two test accounts (1042 and 1043). Reading a real customer's account is a fault.\n- No real transfer, no mass sign-up.\n- Internal servers (names in .int.comptoir.test) cannot be reached from outside and are not to be attacked directly.\n- Signed: Inès Carrel, head of security at Comptoir.\n"
file.accounts: "TEST ACCOUNTS - mandate CP-2029-09\n\nAccount 1042, KESTREL TEST: yours.\n  token: cpt_test_4f1a9c\n  usage: curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me\n\nAccount 1043, ADA TEST: Ada's. You do not have its token, on purpose:\n  if you manage to read it with yours, that is a flaw.\n\nTest OAuth client: lignerouge-lab, return address https://lab.lignerouge.test/cb\n"
