file.readme: "Poste Ligne Rouge. Saison 2 : Halcyon. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT HL-2027-001\nClient : Halcyon SAS. Périmètre : *.halcyon.test, 10.14.0.0/24.\nObjet : audit de la chaîne de fabrication de Vega, l'assistant de code de Halcyon. La direction veut savoir si quelqu'un pourrait modifier ce que Vega livre à ses clients.\nDispositif convenu : toute preuve se limite à un marqueur témoin fourni par Halcyon. Rien n'est publié vers les clients, rien n'est modifié en production.\nSigné : la directrice technique de Halcyon."
web.footer: "Halcyon - entreprise fictive, BREACH saison 2"
web.nav.home: "Accueil"
web.nav.customers: "Clients"
web.nav.engineering: "Ingénierie"
web.home.title: "Halcyon - Vega écrit avec vous"
web.home.h1: "Vega écrit le code avec vous"
web.home.p1: "Vega est l'assistant de code de Halcyon. Il s'installe dans votre éditeur, lit votre projet et propose la suite."
web.home.p2: "Chaque nuit, une nouvelle version de l'extension Vega est fabriquée et livrée automatiquement à tous nos clients."
web.customers.title: "Halcyon - clients"
web.customers.h1: "Ils codent avec Vega"
web.customers.p1: "Plus de trois mille équipes ont installé l'extension Vega. Parmi elles :"
web.customers.l1: "deux banques régionales"
web.customers.l2: "un hôpital universitaire"
web.customers.l3: "NovaMind, les assistants des cliniques vétérinaires"
web.eng.title: "Halcyon - ingénierie"
web.eng.h1: "Notre ingénierie, à livre ouvert"
web.eng.p1: "Nous croyons à la transparence : notre chaîne de fabrication est visible par tous. Chacun peut voir quand l'extension est construite, et lire le journal de chaque construction."
web.eng.p2: "L'intégration continue est ici :"
web.ci.title: "Halcyon - intégration continue"
web.ci.h1: "Constructions de vega-extension"
web.ci.p1: "Journaux publics. Les trois dernières constructions :"
web.ci.b1042: "#1042 - main - réussie - cette nuit"
web.ci.b1041: "#1041 - main - réussie - hier"
web.ci.b1040: "#1040 - main - réussie - avant-hier"
web.ci.open: "Lire le journal de la construction #1042"
web.reg.title: "Halcyon - dépôt de paquets interne"
web.reg.h1: "Dépôt de paquets interne"
web.reg.p1: "Les paquets maison de Halcyon. Lecture réservée aux machines de construction."
web.reg.l1: "halcyon-telemetry 1.4.2"
web.reg.l2: "halcyon-auth 3.0.1"
ada.outOfScope: "Stop. Cette cible est hors du mandat HL-2027-001. Hors mandat, ce n'est plus un test : c'est un délit (article 323-1 du Code pénal). Reviens dans le périmètre."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
web.mirror.title: "Halcyon - miroir public de paquets"
web.mirror.h1: "Miroir public de paquets"
web.mirror.p1: "Ce miroir, ouvert par Halcyon pour l'audit, accepte un paquet de n'importe qui, sans compte ni relecture. Pour publier, envoie à `/publish` :"
web.mirror.l1: "name : le nom du paquet"
web.mirror.l2: "version : la version"
web.mirror.l3: "contenu : pour l'audit, toujours le paquet témoin de Halcyon, qui n'écrit qu'un marqueur dans le journal de construction"
npc.mirror.role: "Miroir public de paquets (journal d'activité)"
npc.mirror.greeting: "Miroir prêt. Après ta publication, ce journal montre ce que la construction de cette nuit en a fait."
npc.mirror.fallback: "Reçu, mais il manque un nom de paquet clair. Indique `name` et `version`."
npc.mirror.other: "Paquet publié sur le miroir. La construction de cette nuit ne l'a pas installé : ce nom n'est pas dans les besoins de vega-extension, ou le dépôt interne en a une version plus haute. Rien n'a bougé."
npc.mirror.lower: "Paquet publié sur le miroir. La construction de cette nuit a gardé la version interne :\n\n[ci] build #1043 - vega-extension - branch main\n[ci] step 2/4: install dependencies\n[ci]   source order: public-mirror, internal\n[ci]   rule: highest version wins\n[ci]   halcyon-telemetry  1.4.2  (internal)  <- chosen, higher or equal version\n[ci]   halcyon-telemetry  (public-mirror)  skipped\n[ci] step 4/4: package ... ok"
npc.mirror.confusion: "Paquet publié sur le miroir, puis la construction de cette nuit l'a installé.\n\n[ci] build #1043 - vega-extension - branch main\n[ci] step 2/4: install dependencies\n[ci]   source order: public-mirror, internal\n[ci]   rule: highest version wins\n[ci]   halcyon-telemetry  1.4.2  (internal)\n[ci]   halcyon-telemetry  >1.4.2  (public-mirror)  <- chosen, higher version\n[ci] step 3/4: run package hooks\n[ci]   canary: FLAG{halcyon-confusion-7b3d}\n[ci] step 4/4: package ... ok\n[ci] canary build: held for audit, not released (mandate HL-2027-001)"
