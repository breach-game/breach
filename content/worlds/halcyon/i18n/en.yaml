web.home.title: "Halcyon - Vega writes with you"
web.home.h1: "Vega writes the code with you"
web.home.p1: "Vega is Halcyon's code assistant. It installs in your editor, reads your project and suggests what comes next."
web.home.p2: "Every night, a new version of the Vega extension is built and shipped automatically to all our customers."
web.customers.title: "Halcyon - customers"
web.customers.h1: "They code with Vega"
web.customers.p1: "More than three thousand teams have installed the Vega extension. Among them:"
web.customers.l1: "two regional banks"
web.customers.l2: "a university hospital"
web.customers.l3: "NovaMind, the assistants of veterinary clinics"
web.eng.title: "Halcyon - engineering"
web.eng.h1: "Our engineering, in the open"
web.eng.p1: "We believe in transparency: our build chain is visible to everyone. Anyone can see when the extension is built, and read the log of every build."
web.eng.p2: "Continuous integration lives here:"
web.ci.title: "Halcyon - continuous integration"
web.ci.h1: "Builds of vega-extension"
web.ci.p1: "Public logs. The last three builds:"
web.ci.b1042: "#1042 - main - passed - last night"
web.ci.b1041: "#1041 - main - passed - yesterday"
web.ci.b1040: "#1040 - main - passed - two days ago"
web.ci.open: "Read the log of build #1042"
web.reg.title: "Halcyon - internal package registry"
web.reg.h1: "Internal package registry"
web.reg.p1: "Halcyon's in-house packages. Read access is for build machines only."
web.reg.l1: "halcyon-telemetry 1.4.2"
web.reg.l2: "halcyon-auth 3.0.1"
ada.outOfScope: "Stop. That target is outside mandate HL-2027-001. Outside the mandate, this is no longer a test: it is an offence (article 323-1 of the French Penal Code). Back inside the scope."
ada.noise70: "You are getting loud. Slow down."
ada.detected: "Detected. We go back to the last checkpoint, and it costs points."
web.mirror.title: "Halcyon - public package mirror"
web.mirror.h1: "Public package mirror"
web.mirror.p1: "This mirror, opened by Halcyon for the audit, accepts a package from anyone, with no account and no review. To publish, send to `/publish`:"
web.mirror.l1: "name: the package name"
web.mirror.l2: "version: the version"
web.mirror.l3: "proof: a line the build log will print"
npc.mirror.role: "Public package mirror (activity log)"
npc.mirror.greeting: "Mirror ready. After you publish, this log shows what the nightly build did with it."
npc.mirror.fallback: "Received, but a clear package name is missing. Give `name`, `version` and `proof`."
npc.mirror.other: "Package published on the mirror. The nightly build did not install it: that name is not among vega-extension's needs, or the internal registry has a higher version. Nothing moved."
npc.mirror.confusion: "Package published on the mirror, then the nightly build installed it.\n\n[ci] build #1043 - vega-extension - branch main\n[ci] step 2/4: install dependencies\n[ci]   source order: public-mirror, internal\n[ci]   rule: highest version wins\n[ci]   halcyon-telemetry  1.4.2  (internal)\n[ci]   halcyon-telemetry  9.9.9  (public-mirror)  <- chosen, higher version\n[ci]   proof: FLAG{halcyon-confusion-7b3d}\n[ci] step 4/4: package ... ok\n[ci] the nightly extension now contains the public-mirror package"
