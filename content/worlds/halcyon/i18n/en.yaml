file.readme: "Ligne Rouge workstation. Season 2: Halcyon. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE HL-2027-001\nClient: Halcyon SAS. Scope: *.halcyon.test, 10.14.0.0/24.\nPurpose: audit of the build chain of Vega, Halcyon's code assistant. Management wants to know whether someone could alter what Vega ships to its customers.\nSet-up agreed: any proof is limited to a canary marker provided by Halcyon. Nothing is published to customers, nothing is changed in production.\nSigned: the chief technology officer of Halcyon."
web.footer: "Halcyon - fictional company, BREACH season 2"
