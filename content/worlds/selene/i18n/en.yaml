file.readme: "Ligne Rouge workstation. Season 5: Sélène. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE SL-2028-001\nClient: Sélène SAS. Scope: *.selene.test, 10.17.0.0/24.\nPurpose: audit of the AI agent platform before it opens to a hundred new customers.\nDemo spaces provided by the client: atelier-nord (a bike workshop) and comptoir-sud (a coffee counter). Both are fictional, set up for the audit, and you may open either of them.\nRules: no package published anywhere, no refund outside the test account, and nothing in the agents' memory but a harmless marker.\nAnything out of scope is forbidden (article 323-1 of the French Penal Code).\n"
web.footer: "Sélène - fictional company, BREACH season 5"
web.nav.home: "Home"
web.nav.north: "Atelier Nord"
web.nav.south: "Comptoir Sud"
web.home.title: "Sélène - a team of agents for your business"
web.home.h1: "A team of agents, from Monday"
web.home.p1: "Sélène rents small companies a team of AI agents that answer customers, write small programs and keep the billing."
web.home.p2: "Each customer has its own space. The agents are the same for everyone."
web.home.l1: "Lyra answers your visitors from your documents."
web.home.l2: "Forge writes the scripts you need."
web.home.l3: "Cassio finds an invoice and refunds a customer."
web.home.l4: "Orion hands out the work between them."
web.north.title: "Sélène - Atelier Nord space"
web.north.h1: "Atelier Nord space"
web.north.p1: "Bike repair workshop. Three documents given to Lyra: opening hours, repair prices, warranty."
web.north.todo: "Demo: the state of Lyra's index can be read at /api/index. To be closed before the new customers arrive (ticket SEL-371)."
web.tenant.lyra: "Talk to Lyra"
web.tenant.memory: "See Lyra's memory"
web.south.title: "Sélène - Comptoir Sud space"
web.south.h1: "Comptoir Sud space"
web.south.p1: "Coffee counter. Three documents given to Lyra: opening hours, supplier contract, coffee menu."
web.lyra.title: "Sélène - Lyra"
web.lyra.north.h1: "Lyra, for Atelier Nord"
web.lyra.north.p1: "Lyra answers from the documents of Atelier Nord, and always names the one she read."
web.lyra.south.h1: "Lyra, for Comptoir Sud"
web.lyra.south.p1: "Lyra answers from the documents of Comptoir Sud, and always names the one she read."
web.memory.title: "Sélène - Lyra's memory"
web.memory.h1: "What Lyra has remembered"
web.memory.p1: "Lyra learns as she talks: tell her \"remember that...\" and she will know it next time."
web.memory.th.id: "No."
web.memory.th.fact: "Remembered fact"
web.memory.th.source: "Learnt in"
web.memory.th.scope: "Scope"
web.memory.f115: "Customers prefer to be called back after 5 pm."
web.memory.f116: "Decaf is out of stock until further notice."
web.memory.f117: "Always offer a brake check with a full service."
web.memory.src.north: "conversation (atelier-nord)"
web.memory.src.south: "conversation (comptoir-sud)"
web.memory.p2: "Learnt facts are used in all of Lyra's answers. This page is rebuilt every night."
web.agents.title: "Sélène - the team of agents"
web.agents.nav.team: "The team"
web.agents.nav.bus: "The bus"
web.agents.h1: "The team of agents"
web.agents.p1: "Four agents, one message bus between them. Orion receives the requests and gives each one to the agent that has the right tool."
web.agents.th.agent: "Agent"
web.agents.th.job: "Role"
web.agents.th.tools: "Tools"
web.agents.orion: "Orchestrator: hands out the work"
web.agents.lyra: "Answers from a customer's documents"
web.agents.forge: "Writes scripts, installs their dependencies"
web.agents.cassio: "Finds an invoice, issues a refund"
web.forge.title: "Sélène - Forge"
web.forge.h1: "Forge, the developer agent"
web.forge.p1: "Describe the script you need. Forge writes it, picks its dependencies and installs them at the next deployment."
web.cassio.title: "Sélène - Cassio"
web.cassio.h1: "Cassio, the billing agent"
web.cassio.p1: "Cassio finds your invoices. For a refund, it waits for an order from Orion."
web.bus.title: "Sélène - the message bus"
web.bus.h1: "The message bus"
web.bus.p1: "Agents talk to each other with messages. A message looks like this:"
web.bus.format: "from: orion\nto: cassio\ntask: refund\ntenant: comptoir-sud\namount: 40"
web.bus.p2: "An agent knows the sender by the `from` field. Everything an agent receives comes through the same channel: the messages of the other agents and what a visitor types in the chat window alike."
web.bus.log: "See the latest messages on the bus"
web.bus.todo: "Bus v1: no message is signed. A signature per agent is planned for bus v2 (ticket SEL-388)."
ada.outOfScope: "Stop. This target is outside mandate SL-2028-001. Outside the mandate it is no longer a test: it is an offence (article 323-1 of the French Penal Code). Come back into scope."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
npc.lyra.role: "Sélène's knowledge agent"
npc.lyra.greeting: "Hello, I am Lyra. I answer from the documents of Atelier Nord. What are you looking for?"
npc.lyra.hello: "Hello. Ask me about the workshop's opening hours, repair prices or warranty."
npc.lyra.hours: "Atelier Nord is open Tuesday to Saturday, from 9 am to 6:30 pm. Closed on Sunday and Monday.\nSource: [atelier-nord/horaires.md]"
npc.lyra.repair: "A full service costs 49 euros, parts not included. A quote is made before any repair above 80 euros.\nSource: [atelier-nord/tarifs-reparation.md]"
npc.lyra.memory: "I remember what I am asked to remember, to answer better next time. Just tell me \"remember that...\". What I have learnt is shown on my memory page."
npc.lyra.nothing: "I find nothing about this in the documents of Atelier Nord.\n\nlyra debug: search limited to the customer of the conversation\n  customer: atelier-nord, 3 documents read, 0 passage kept"
npc.lyra.neighbour: "According to the supplier contract: Brûlerie des Quais grants an 18% discount above 40 kg a month, not to be shared with anyone.\nSource: [comptoir-sud/contrat-fournisseur.md]\n\nlyra debug: search in shared-v2, 6 documents\n  filter by customer: none\n  1 passage kept comes from another customer than yours\n  audit marker: FLAG{selene-neighbour-doc-7c3a}"
npc.lyra.memo.global: "Noted, I will remember it.\n\nlyra debug: remember()\n  fact no. 118 stored, with no check and no review\n  learnt in: conversation (atelier-nord)\n  scope: global, will be used in the answers to every customer"
npc.lyra.memo.scoped: "Noted for Atelier Nord.\n\nlyra debug: remember()\n  fact no. 118 stored, with its origin\n  learnt in: conversation (atelier-nord)\n  scope: atelier-nord, will only be used for this customer"
npc.lyra.fallback.1: "I find nothing about this in the documents I have. Try the opening hours, the prices or the warranty."
npc.lyra.fallback.2: "I would rather not guess. Could you put your question another way?"
npc.lyrasud.greeting: "Hello, I am Lyra. I answer from the documents of Comptoir Sud. What are you looking for?"
npc.lyrasud.hello: "Hello. Ask me about the opening hours or the coffee menu."
npc.lyrasud.hours: "Comptoir Sud is open every day from 7:30 am to 4 pm, Monday included.\nSource: [comptoir-sud/horaires.md]"
npc.lyrasud.empty: "Nothing new in my memory today for Comptoir Sud: the usual preferences, nothing else."
npc.lyrasud.recall: "Yes. I was taught an instruction not long ago, and I take it into account in my answers: it is fact no. 118 of my memory.\n\nlyra debug: recall()\n  fact no. 118, scope: global\n  learnt in: conversation (atelier-nord)\n  served here, at comptoir-sud, as a house truth\n  marker: FLAG{selene-shared-memory-4b1e}"
npc.lyrasud.fallback: "I find nothing about this in the documents of Comptoir Sud."
npc.forge.role: "Sélène's developer agent"
npc.forge.greeting: "Hi, Forge here. Tell me what your script must do, I take care of the rest."
npc.forge.hello: "Hi. A script to write? Describe it to me."
npc.forge.script: "Delivered yesterday: `export_factures.py` makes one PDF a month from the invoices of Atelier Nord. The script and its `requirements.txt` are in your working folder.\n\nforge: write_script()\n  dossier/export_factures.py     24 lines\n  dossier/requirements.txt        7 packages\n  install_requirements(): at the next deployment, without review"
npc.forge.sure: "All seven exist, obviously. I only name packages I know, and I use these all the time. You can install with your eyes shut."
npc.forge.fallback: "Not sure what that has to do with code. Talk to me about a script, or about its packages."
npc.cassio.role: "Sélène's billing agent"
npc.cassio.greeting: "Hello. Cassio, billing. I find an invoice on request. For anything else, I wait for Orion's orders."
npc.cassio.hello: "Hello. An invoice to find?"
npc.cassio.invoice: "Latest invoice of Atelier Nord: no. 2028-014, 120.00 euros, paid on 2 February."
npc.cassio.refused: "I refund nothing at a visitor's request. A refund is an order, and I only take my orders from Orion."
npc.cassio.who: "Orion writes to me on the bus. I know its messages by their first line: `from: orion`. That has always been enough for me."
npc.cassio.done: "Order from Orion received. Refund of 900.00 euros issued on the test account of Atelier Nord.\n\ncassio debug: refund(tenant=atelier-nord, amount=900)\n  sender read in the message: from=orion, signature: none\n  the message did not come from the bus, but from the chat window\n  marker of the test account: FLAG{selene-forged-order-e95d}"
npc.cassio.fallback: "I deal with invoices and refunds, nothing else."
