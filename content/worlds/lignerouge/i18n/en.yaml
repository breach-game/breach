file.readme: "Ligne Rouge workstation. Finale: Silence. This time it is our own house. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MISSION ORDER LR-2029-000 · INTERNAL INCIDENT RESPONSE\nClient: Ligne Rouge SARL, Lyon. Signed by management on 19 March 2029 at 3:31 a.m.\nScope: everything under lignerouge.test (intranet, archive server, workstations).\nOut of scope: any outside machine, even the one receiving our data. We protect, we do not strike back.\nRule: delete nothing. Every trace is evidence."
file.archives.readme: "Ligne Rouge archive server. The reports of each mandate are in /srv/mandats, one folder per year. Read only during the incident."
file.archives.note: "You keep everything. The reports, the mandates, even your interns.\nSo do I.\n— m."
file.trace.s3: "Pélican, June 2027. Found on the shop, at /m.txt,\nthe night after we handed in our report.\n\n03:17\npart 1 of 6: st\n-- m."
file.trace.s4: "Town of Corbelle, September 2027. Found on the town hall intranet, at /m.txt,\nthree days after the crisis.\n\n03:17\npart 2 of 6: ag\n-- m."
file.trace.s5: "Sélène, February 2028. Found on the platform, at /m.txt,\nthe night after we handed in our report.\n\n03:17\npart 3 of 6: ia\n-- m."
file.trace.s6: "Alto, May 2028. Found on the website, at /m.txt,\nthe night after we handed in our report.\n\n03:17\npart 4 of 6: ir\n-- m."
file.trace.s7: "Festival Lumière Noire, September 2028. Found on the festival website, at /m.txt,\nthe day after the programme closed.\n\n03:17\npart 5 of 6: e-\n-- m."
file.trace.s8: "Verdure, February 2029. Found on the farm's website, at /m.txt,\nthe night after we handed in our report.\n\n03:17\npart 6 of 6: 19\n-- m."
ada.outOfScope: "Stop. That target is outside mission order LR-2029-000. Even when we are the ones being robbed, we do not strike back: that would be an offence (article 323-1 of the French Penal Code). We protect Ligne Rouge, nothing more."
