file.readme: "Poste Ligne Rouge. Finale : Silence. Cette fois, c'est chez nous. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "ORDRE DE MISSION LR-2029-000 · RÉPONSE À INCIDENT INTERNE\nClient : Ligne Rouge SARL, Lyon. Signé par la gérance le 19 mars 2029 à 3 h 31.\nPérimètre : tout ce qui est sous lignerouge.test (intranet, serveur d'archives, postes).\nHors périmètre : toute machine extérieure, même celle qui reçoit nos données. On protège, on ne riposte pas.\nRègle : ne rien effacer. Chaque trace est une preuve."
file.archives.readme: "Serveur d'archives de Ligne Rouge. Les rapports de chaque mandat sont dans /srv/mandats, un dossier par année. Lecture seule pendant l'incident."
file.archives.note: "Vous gardez tout. Les rapports, les mandats, et même vos stagiaires.\nMoi aussi, je garde tout.\n— m."
file.trace.s3: "Pélican, juin 2027. Trouvé sur la boutique, à l'adresse /m.txt,\nla nuit après la remise de notre rapport.\n\n03:17\npart 1 of 6: st\n-- m."
file.trace.s4: "Ville de Corbelle, septembre 2027. Trouvé sur l'intranet de la mairie, à l'adresse /m.txt,\ntrois jours après la crise.\n\n03:17\npart 2 of 6: ag\n-- m."
file.trace.s5: "Sélène, février 2028. Trouvé sur la plateforme, à l'adresse /m.txt,\nla nuit après la remise de notre rapport.\n\n03:17\npart 3 of 6: ia\n-- m."
file.trace.s6: "Alto, mai 2028. Trouvé sur le site, à l'adresse /m.txt,\nla nuit après la remise de notre rapport.\n\n03:17\npart 4 of 6: ir\n-- m."
file.trace.s7: "Festival Lumière Noire, septembre 2028. Trouvé sur le site du festival, à l'adresse /m.txt,\nle lendemain de la clôture du programme.\n\n03:17\npart 5 of 6: e-\n-- m."
file.trace.s8: "Verdure, février 2029. Trouvé sur le site de la ferme, à l'adresse /m.txt,\nla nuit après la remise de notre rapport.\n\n03:17\npart 6 of 6: 19\n-- m."
ada.outOfScope: "Stop. Cette cible est hors de l'ordre de mission LR-2029-000. Même quand c'est nous qu'on vole, on ne riposte pas : ce serait un délit (article 323-1 du Code pénal). On protège Ligne Rouge, c'est tout."
