web.last.p1: "03:17. Morceau 7 sur 6."
web.last.p2: "Huit saisons. Tu as pris ton temps, Kestrel."
web.last.p3: "Tu as fermé la porte que je préférais. Garde-la fermée."
web.last.p4: "Cette fois, je ne dis pas à bientôt. — m."
