web.home.h1: "La seconde vie des beaux vêtements"
web.home.p1: "Pélican remet en état des vestes, des pulls et des manteaux de bonne facture, et les revend à prix doux."
web.home.p2: "Première commande ? Le code `BIENVENUE10` vous offre 10 %. Les soldes d'été commencent lundi."
web.home.todo: "TODO (Sam) : l'appli mobile lit encore /api/products.json, champs internes compris. À nettoyer avant les soldes."
