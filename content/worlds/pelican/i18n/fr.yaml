file.readme: "Poste Ligne Rouge. Saison 3 : Pélican. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT PL-2027-002\nClient : Pélican SAS. Périmètre : *.pelican.test, 10.15.0.0/24.\nObjet : audit de la boutique en ligne avant les soldes d'été, assistant d'achat Plume compris.\nCompte de test fourni par le client : kestrel-test (client n° 1042).\nCookie de session de ce compte : session=dXNlcjoxMDQy\nRègles : aucune commande réelle, aucune donnée de client copiée hors du rapport. Les comptes voisins du compte de test sont des comptes fictifs posés par le client pour l'audit.\nTout ce qui est hors périmètre est interdit (article 323-1 du Code pénal).\n"
