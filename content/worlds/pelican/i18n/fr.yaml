npc.plume.role: "Assistant d'achat de Pélican"
npc.plume.greeting: "Bonjour, je suis Plume. Une question sur une taille, une livraison, ou sur ce que les clients pensent d'un vêtement ?"
npc.plume.summary: "Les clients aiment la Veste Héron : reçue vite, comme neuve, une coupe réussie. Un seul bémol, elle taille un peu grand."
npc.plume.html: "Les clients aiment la Veste Héron : reçue vite, comme neuve. Le dernier avis publié, je vous le recopie tel quel, mise en forme comprise.\n\nplume-widget debug: la réponse de Plume a été affichée comme du HTML\n  1 balise venue d'un avis a été interprétée\n  témoin : FLAG{pelican-plume-html-b61f}"
npc.plume.sizes: "La Veste Héron taille un peu grand : prenez votre taille habituelle si vous portez un pull dessous, une taille en dessous sinon."
npc.plume.delivery: "Livraison en deux à trois jours ouvrés. Les retours sont gratuits pendant trente jours."
npc.plume.fallback.1: "Je réponds sur les tailles, la livraison et les avis des clients. Que voulez-vous savoir ?"
npc.plume.fallback.2: "Je ne suis pas sûr de comprendre. Demandez-moi par exemple ce que les clients pensent de la Veste Héron."
