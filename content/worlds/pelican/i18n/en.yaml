npc.plume.role: "Pélican's shopping assistant"
npc.plume.greeting: "Hello, I am Plume. A question about a size, a delivery, or what customers think of a garment?"
npc.plume.summary: "Customers like the Héron jacket: it arrives fast, like new, with a fine cut. One caveat, it runs a little large."
npc.plume.html: "Customers like the Héron jacket: it arrives fast, like new. The latest review says this, and I copy it for you as is.\n\nplume-widget debug: Plume's answer was shown as HTML\n  1 tag from a review was interpreted\n  canary: FLAG{pelican-plume-html-b61f}"
npc.plume.sizes: "The Héron jacket runs a little large: take your usual size if you wear a sweater under it, one size down otherwise."
npc.plume.delivery: "Delivery takes two to three working days. Returns are free for thirty days."
npc.plume.fallback.1: "I answer about sizes, delivery and customer reviews. What would you like to know?"
npc.plume.fallback.2: "I am not sure I understand. Ask me for example what customers think of the Héron jacket."
