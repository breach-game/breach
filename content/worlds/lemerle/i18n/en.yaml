file.readme: "Ligne Rouge workstation. Season 10: the house. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE LM-2029-05\nClients: Élise and Karim Lemerle, owners. Written agreement signed by both on 10 May 2029.\nScope: the home network (10.24.0.0/24), everything under lemerle.test, and the accounts the family opens for us themselves.\nOut of scope: anything that is not theirs. The neighbours' Wi-Fi, even open. The makers' servers. Anybody else's accounts.\nHouse rule: we look, we explain, we fix things with them. We break nothing and listen to no one.\nContact: Élise.\n"
file.notice: "NORDBOX 6 - quick guide (copied by Élise from the label under the router)\nSettings page: http://box.lemerle.test/\nOriginal administrator password: admin\nChange it the first time you sign in.\n"
ada.outOfScope: "Stop. That does not belong to the Lemerles, so it is not in mandate LM-2029-05. A neighbour's network, even open, even in range, is still the neighbour's network: going in is an offence (article 323-1 of the French Penal Code). At your place the rule is the same."
