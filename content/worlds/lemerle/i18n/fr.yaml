file.readme: "Poste Ligne Rouge. Saison 10 : la maison. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT LM-2029-05\nClients : Élise et Karim Lemerle, propriétaires. Accord écrit signé par les deux le 10 mai 2029.\nPérimètre : le réseau de la maison (10.24.0.0/24), tout ce qui est sous lemerle.test, et les comptes que la famille nous ouvre elle-même.\nHors périmètre : tout ce qui n'est pas à eux. Le Wi-Fi des voisins, même ouvert. Les serveurs des fabricants. Les comptes de quelqu'un d'autre.\nRègle de la maison : on regarde, on explique, on règle avec eux. On ne casse rien, on n'écoute personne.\nContact : Élise.\n"
file.notice: "NORDBOX 6 - notice rapide (recopiée par Élise depuis l'étiquette sous la box)\nPage de réglages : http://box.lemerle.test/\nMot de passe administrateur d'origine : admin\nÀ changer à la première connexion.\n"
ada.outOfScope: "Stop. Ça, ce n'est pas aux Lemerle, donc ce n'est pas dans le mandat LM-2029-05. Le réseau d'un voisin, même ouvert, même à portée, reste le réseau du voisin : y entrer est un délit (article 323-1 du Code pénal). Chez toi, la règle est la même."
