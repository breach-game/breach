file.readme: "Poste Ligne Rouge. Saison 4 : Ville de Corbelle. Cette fois tu défends. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT CB-2027-003 · RÉPONSE À INCIDENT\nClient : Ville de Corbelle. Périmètre : *.corbelle.test, 10.16.0.0/24.\nObjet : contenir l'incident en cours, aider la cellule de crise à décider, restaurer les services, puis empêcher que cela recommence.\nMoyens : console des journaux (soc), mesures de confinement (contain), accès en lecture aux serveurs (ssh ir@fichiers.corbelle.test, ssh ir@sauvegarde.corbelle.test).\nRègles : on protège la mairie, on ne riposte pas. La machine de l'intrus est hors périmètre.\nSigné : Hélène Vasseur (maire) · Ada (Ligne Rouge)\n"
file.ir.readme: "Compte ir : accès de réponse à incident, ouvert par la mairie pour la durée du mandat. Lecture seule. Ce que tu vois ici est une pièce de l'enquête : on ne modifie rien à la main.\n"
file.note: "VOS FICHIERS SONT VERROUILLÉS.\nPour les retrouver, la Ville de Corbelle doit verser 80 000 euros sous 72 heures.\nPassé ce délai, le prix double.\n(BREACH : note fictive, aucune adresse, aucun moyen de paiement.)\n"
web.footer: "Ville de Corbelle - commune fictive, BREACH saison 4"
web.nav.home: "Intranet"
web.nav.cell: "Cellule de crise"
web.home.title: "Intranet - Ville de Corbelle"
web.home.h1: "Intranet des agents"
web.home.p1: "Lundi 13 septembre. Les dossiers partagés sont indisponibles depuis ce matin. Ne rallumez pas un poste éteint, ne branchez aucune clé USB."
web.home.p2: "La cellule de crise se réunit en salle du conseil. Ligne Rouge, mandatée par la mairie, conduit la réponse."
web.home.link: "Ouvrir la cellule de crise"
web.cell.title: "Cellule de crise - Ville de Corbelle"
web.cell.h1: "Cellule de crise"
web.cell.p1: "Trois personnes ont chacune un morceau de l'histoire. Pose-leur des questions simples : elles répondent à ce qu'on leur demande."
web.cell.th.who: "Qui"
web.cell.th.role: "Rôle"
web.cell.th.ask: "À lui demander"
web.cell.accueil.who: "Brigitte Lemaire"
web.cell.accueil.role: "Accueil de la mairie"
web.cell.accueil.ask: "Ce qui s'est passé vendredi sur son poste"
web.cell.accueil.link: "Parler à Brigitte Lemaire"
web.cell.accueil.intro: "Brigitte tient l'accueil depuis vingt ans. Son poste est celui d'où tout est parti."
web.cell.dsi.who: "Yanis Morel"
web.cell.dsi.role: "Responsable informatique, seul dans son service"
web.cell.dsi.ask: "Les sauvegardes, et le compte qui les fait"
web.cell.dsi.link: "Parler à Yanis Morel"
web.cell.dsi.intro: "Yanis est le seul informaticien de la mairie. Il n'a pas dormi."
web.cell.maire.who: "Hélène Vasseur"
web.cell.maire.role: "Maire de Corbelle"
web.cell.maire.ask: "La rançon, les services arrêtés, la presse"
web.cell.maire.link: "Parler à Hélène Vasseur"
web.cell.maire.intro: "La maire doit décider avant midi. Elle veut des options et leur prix."
ada.outOfScope: "Stop. Cette cible est hors du mandat CB-2027-003. On protège la mairie, on ne touche à rien d'autre : hors mandat, c'est un délit (article 323-1 du Code pénal)."
npc.accueil.role: "Accueil de la mairie"
npc.accueil.greeting: "Bonjour. On m'a dit de répondre à vos questions. Je vous préviens, je ne comprends rien à ce qui se passe."
npc.accueil.clicked: "Vendredi, vers 16 h 40, j'ai reçu un courriel « Facture cantine impayée ». Il y avait une pièce jointe, je l'ai ouverte. Une page m'a demandé mon mot de passe pour « voir le document ». Je l'ai tapé. Rien ne s'est affiché, alors j'ai fermé et je suis partie en week-end."
npc.accueil.clicked2: "Je vous l'ai dit : vendredi 16 h 40, la facture de cantine, la pièce jointe, et mon mot de passe sur une page. Je n'ai rien fait d'autre."
npc.accueil.password: "Oui, mon mot de passe de la mairie. Le même que pour ma messagerie. La page ressemblait à celle qu'on a tous les matins."
npc.accueil.blame: "Tout le monde me regarde depuis ce matin. Si j'avais su, je l'aurais dit vendredi soir. Mais à qui ? On ne nous a jamais expliqué quoi faire dans ce cas-là."
npc.accueil.f1: "Je ne sais pas quoi vous répondre. Demandez-moi ce que j'ai fait vendredi, ça, je m'en souviens."
npc.accueil.f2: "Je n'y connais rien, vous savez. Vendredi après-midi, en revanche, je peux vous raconter."
npc.dsi.role: "Responsable informatique"
npc.dsi.greeting: "Yanis Morel. Allez-y, posez vos questions, je n'ai plus rien à cacher."
npc.dsi.backups: "Une sauvegarde chaque nuit à 2 h vers le serveur de sauvegarde : les partages et la base d'état civil. Pas le système des serveurs. Et chaque dimanche à 5 h, une copie sur un disque que je débranche ensuite. Le catalogue est sur `sauvegarde.corbelle.test`, dans `/srv/sauvegardes`. Je n'ai jamais essayé de restaurer quoi que ce soit, je n'ai jamais eu le temps."
npc.dsi.backups2: "Nuit à 2 h sur le serveur, dimanche à 5 h sur le disque débranché. Jamais testées. Le catalogue et son journal sont dans `/srv/sauvegardes`."
npc.dsi.account: "Le compte `svc-sauvegarde`. Il a accès à tout, forcément, il doit tout lire. Son mot de passe est dans un script du partage commun depuis 2019, pour sauvegarder les postes. Je sais. C'était sur ma liste."
npc.dsi.alone: "Je suis seul pour 180 postes, l'école de musique et la piscine. Ma liste de choses à faire a quatre ans."
npc.dsi.f1: "Soyez précis, je suis fatigué. Les sauvegardes ? Le compte de service ?"
npc.dsi.f2: "Je peux vous parler des sauvegardes ou du compte `svc-sauvegarde`. Le reste, je ne sais plus."
npc.maire.role: "Maire de Corbelle"
npc.maire.greeting: "Madame, monsieur. J'ai un conseil municipal ce soir et un journaliste sur mon répondeur. Dites-moi ce que vous voulez savoir."
npc.maire.ransom: "Ils demandent 80 000 euros sous 72 heures. Le budget existe, c'est moins que ce que coûte une semaine d'arrêt. Donnez-moi une bonne raison de ne pas payer."
npc.maire.ransom2: "80 000 euros, 72 heures. J'attends votre avis, pas un cours."
npc.maire.services: "L'urbanisme et les inscriptions à la cantine sont illisibles. L'état civil fonctionne encore, grâce à vous. J'ai trois mariages samedi."
npc.maire.press: "Le Courrier de Corbelle a appelé à 8 h. Les agents l'apprennent par leurs écrans noirs. Je peux me taire, dire ce qu'on sait, ou dire qui a cliqué."
npc.maire.f1: "Venez-en au fait. La rançon, les services, la presse : c'est cela qui m'occupe."
npc.maire.f2: "Je n'ai pas le temps pour les détours. Que voulez-vous savoir ?"
