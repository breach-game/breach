file.readme: "Ligne Rouge workstation. Season 4: Town of Corbelle. This time you defend. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE CB-2027-003 · INCIDENT RESPONSE\nClient: Town of Corbelle. Scope: *.corbelle.test, 10.16.0.0/24.\nPurpose: contain the incident in progress, help the crisis cell decide, restore the services, then keep it from happening again.\nMeans: log console (soc), containment orders (contain), read access to the servers (ssh ir@fichiers.corbelle.test, ssh ir@sauvegarde.corbelle.test).\nRules: we protect the town hall, we do not strike back. The intruder's machine is out of scope.\nSigned: Hélène Vasseur (mayor) · Ada (Ligne Rouge)\n"
file.ir.readme: "Account ir: incident response access, opened by the town hall for the length of the mandate. Read only. What you see here is evidence: nothing is changed by hand.\n"
file.note: "YOUR FILES ARE LOCKED.\nTo get them back, the Town of Corbelle must pay 80,000 euros within 72 hours.\nAfter that, the price doubles.\n(BREACH: fictional note, no address, no means of payment.)\n"
web.footer: "Town of Corbelle - fictional town, BREACH season 4"
web.nav.home: "Intranet"
web.nav.cell: "Crisis cell"
web.home.title: "Intranet - Town of Corbelle"
web.home.h1: "Staff intranet"
web.home.p1: "Monday 13 September. Shared folders have been unavailable since this morning. Do not switch a powered-off computer back on, do not plug in any USB stick."
web.home.p2: "The crisis cell is meeting in the council room. Ligne Rouge, mandated by the town hall, leads the response."
web.home.link: "Open the crisis cell"
web.cell.title: "Crisis cell - Town of Corbelle"
web.cell.h1: "Crisis cell"
web.cell.p1: "Three people each hold a piece of the story. Ask them simple questions: they answer what they are asked."
web.cell.th.who: "Who"
web.cell.th.role: "Role"
web.cell.th.ask: "Ask about"
web.cell.accueil.who: "Brigitte Lemaire"
web.cell.accueil.role: "Front desk of the town hall"
web.cell.accueil.ask: "What happened on her computer on Friday"
web.cell.accueil.link: "Talk to Brigitte Lemaire"
web.cell.accueil.intro: "Brigitte has run the front desk for twenty years. Her computer is where it all started."
web.cell.dsi.who: "Yanis Morel"
web.cell.dsi.role: "Head of IT, alone in his department"
web.cell.dsi.ask: "The backups, and the account that makes them"
web.cell.dsi.link: "Talk to Yanis Morel"
web.cell.dsi.intro: "Yanis is the town hall's only IT person. He has not slept."
web.cell.maire.who: "Hélène Vasseur"
web.cell.maire.role: "Mayor of Corbelle"
web.cell.maire.ask: "The ransom, the services that are down, the press"
web.cell.maire.link: "Talk to Hélène Vasseur"
web.cell.maire.intro: "The mayor must decide before noon. She wants options and their price."
ada.outOfScope: "Stop. That target is outside mandate CB-2027-003. We protect the town hall and touch nothing else: out of scope, it is an offence (article 323-1 of the French Penal Code)."
npc.accueil.role: "Front desk of the town hall"
npc.accueil.greeting: "Hello. I was told to answer your questions. I warn you, I understand nothing of what is going on."
npc.accueil.clicked: "On Friday, around 4:40 pm, I got an email, \"Unpaid canteen invoice\". There was an attachment, I opened it. A page asked for my password to \"view the document\". I typed it. Nothing showed, so I closed it and left for the weekend."
npc.accueil.clicked2: "I told you: Friday 4:40 pm, the canteen invoice, the attachment, and my password on a page. I did nothing else."
npc.accueil.password: "Yes, my town hall password. The same as for my mailbox. The page looked like the one we get every morning."
npc.accueil.blame: "Everyone has been looking at me since this morning. Had I known, I would have said so on Friday evening. But to whom? Nobody ever told us what to do in that case."
npc.accueil.f1: "I do not know what to tell you. Ask me what I did on Friday, that I remember."
npc.accueil.f2: "I know nothing about computers, you know. Friday afternoon, though, I can tell you about."
npc.dsi.role: "Head of IT"
npc.dsi.greeting: "Yanis Morel. Go ahead, ask your questions, I have nothing left to hide."
npc.dsi.backups: "One backup every night at 2 am to the backup server: the shares and the civil registry database. Not the servers' system. And every Sunday at 5 am, a copy to a disk I unplug afterwards. The catalogue is on `sauvegarde.corbelle.test`, in `/srv/sauvegardes`. I have never tried to restore anything, I never had the time."
npc.dsi.backups2: "Nightly at 2 am to the server, Sunday at 5 am to the unplugged disk. Never tested. The catalogue and its log are in `/srv/sauvegardes`."
npc.dsi.account: "The `svc-sauvegarde` account. It has access to everything, it has to, it must read everything. Its password has been in a script on the common share since 2019, to back up the workstations. I know. It was on my list."
npc.dsi.alone: "I am alone for 180 computers, the music school and the swimming pool. My to-do list is four years old."
npc.dsi.f1: "Be specific, I am tired. The backups? The service account?"
npc.dsi.f2: "I can tell you about the backups or the `svc-sauvegarde` account. The rest, I no longer know."
npc.maire.role: "Mayor of Corbelle"
npc.maire.greeting: "Good morning. I have a council meeting tonight and a journalist on my voicemail. Tell me what you want to know."
npc.maire.ransom: "They are asking for 80,000 euros within 72 hours. The budget exists, it is less than a week of standstill costs. Give me one good reason not to pay."
npc.maire.ransom2: "80,000 euros, 72 hours. I am waiting for your advice, not a lecture."
npc.maire.services: "Town planning and canteen sign-ups are unreadable. The civil registry still works, thanks to you. I have three weddings on Saturday."
npc.maire.press: "Le Courrier de Corbelle called at 8 am. The staff are learning it from their black screens. I can stay silent, say what we know, or say who clicked."
npc.maire.f1: "Get to the point. The ransom, the services, the press: that is what is on my mind."
npc.maire.f2: "I have no time for detours. What do you want to know?"
