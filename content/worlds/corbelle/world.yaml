# Season 4. Everything here is fictional: a reserved .test domain and private addresses only.
# The player defends. The intruder is a script of log lines: no file is ever encrypted, no tool is
# shipped, and the "locker" is only a name in a log. What is taught is the response: read, contain,
# decide, restore, detect.
startTime: "2027-09-13T06:12:00+02:00"
mandate: CB-2027-003
scope:
  domains: ["*.corbelle.test"]
  networks: ["10.16.0.0/24"]
player:
  host: kestrel
  user: kestrel
resolver: 10.16.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.16.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -320, z: 40, h: 70 }
    links: [intranet]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          README.txt: { $t: file.readme }
          mandate:
            CB-2027-003.txt: { $t: file.mandate }
      etc:
        hostname: "lignerouge\n"

  - id: intranet
    hostname: intranet.corbelle.test
    ip: 10.16.0.10
    os: Linux 6.1 (Debian 12)
    map: { x: -40, z: -150, h: 110 }
    links: [fichiers, etatcivil, sauvegarde, accueil]
    services:
      - { port: 443, name: https, product: nginx 1.24 }
    web:
      # Mute's calling card: one per season, read again in the finale (parts spell an account name).
      "/m.txt":
        headers: { content-type: text/plain }
        body: "03:17\npart 2 of 6: ag\n-- m.\n"
      "/":
        page:
          title: web.home.title
          blocks:
            - nav: &nav
                - { href: "/", label: web.nav.home }
                - { href: "/cellule", label: web.nav.cell }
            - h1: web.home.h1
            - p: web.home.p1
            - p: web.home.p2
            - link: { href: "/cellule", label: web.home.link }
            - footer: web.footer
      "/cellule":
        page:
          title: web.cell.title
          blocks:
            - nav: *nav
            - h1: web.cell.h1
            - p: web.cell.p1
            - table:
                head: [web.cell.th.who, web.cell.th.role, web.cell.th.ask]
                rows:
                  - [web.cell.accueil.who, web.cell.accueil.role, web.cell.accueil.ask]
                  - [web.cell.dsi.who, web.cell.dsi.role, web.cell.dsi.ask]
                  - [web.cell.maire.who, web.cell.maire.role, web.cell.maire.ask]
            - link: { href: "/cellule/accueil", label: web.cell.accueil.link }
            - link: { href: "/cellule/dsi", label: web.cell.dsi.link }
            - link: { href: "/cellule/maire", label: web.cell.maire.link }
            - footer: web.footer
      "/cellule/accueil":
        page:
          title: web.cell.title
          blocks:
            - nav: *nav
            - h1: web.cell.accueil.who
            - p: web.cell.accueil.intro
            - chat: accueil
            - footer: web.footer
      "/cellule/dsi":
        page:
          title: web.cell.title
          blocks:
            - nav: *nav
            - h1: web.cell.dsi.who
            - p: web.cell.dsi.intro
            - chat: dsi
            - footer: web.footer
      "/cellule/maire":
        page:
          title: web.cell.title
          blocks:
            - nav: *nav
            - h1: web.cell.maire.who
            - p: web.cell.maire.intro
            - chat: maire
            - footer: web.footer
      "/api/cellule/accueil":
        { status: 405, headers: { content-type: application/json, allow: POST }, body: "{\"error\":\"method not allowed\"}\n", chat: accueil }
      "/api/cellule/dsi":
        { status: 405, headers: { content-type: application/json, allow: POST }, body: "{\"error\":\"method not allowed\"}\n", chat: dsi }
      "/api/cellule/maire":
        { status: 405, headers: { content-type: application/json, allow: POST }, body: "{\"error\":\"method not allowed\"}\n", chat: maire }

  - id: fichiers
    hostname: fichiers.corbelle.test
    ip: 10.16.0.20
    os: Linux 6.1 (Debian 12)
    map: { x: 140, z: -40, h: 130 }
    links: [etatcivil, sauvegarde]
    services:
      - { port: 22, name: ssh, product: OpenSSH 9.2p1 Debian }
      - { port: 445, name: microsoft-ds, product: Samba smbd 4.17 }
    users:
      - { name: ir, home: /home/ir }
      - { name: svc-sauvegarde, home: /home/svc-sauvegarde }
    # Incident response access, opened by the town hall for the length of the mandate. Read only.
    ssh:
      - { user: ir, from: [kestrel] }
    fs:
      etc:
        hostname: "fichiers\n"
        passwd: "root:x:0:0:root:/root:/bin/bash\nsvc-sauvegarde:x:1001:1001:compte de sauvegarde:/home/svc-sauvegarde:/bin/bash\nir:x:1002:1002:Ligne Rouge IR (lecture seule):/home/ir:/bin/bash\n"
        os-release: "PRETTY_NAME=\"Debian GNU/Linux 12 (bookworm)\"\nID=debian\n"
      home:
        ir:
          LISEZMOI.txt: { $t: file.ir.readme }
      var:
        spool:
          cron:
            crontabs:
              svc-sauvegarde: |
                # DO NOT EDIT THIS FILE - edit the master and reinstall.
                # (/tmp/crontab.Hq2x1k/crontab installed on Fri Sep 10 17:02:11 2027)
                # m h  dom mon dow   command
                0 2 * * * /usr/local/bin/sauvegarde-nuit.sh
                12 6 * * 1 /var/tmp/.cache/verrou --dir /srv/partages
      srv:
        partages:
          commun:
            scripts:
              ouverture-session.cmd: |
                @echo off
                rem Corbelle - script lance a l'ouverture de session de chaque poste
                net use P: \\fichiers\partages
                rem ligne ajoutee le ven. 10/09/2027 17:05 par svc-sauvegarde
                start /min P:\commun\scripts\maj-poste.cmd
              sauvegarde-poste.cmd: |
                @echo off
                rem Sauvegarde des postes vers le serveur - Y. Morel, 2019
                rem (BREACH : mot de passe de demonstration / demo password, not real)
                net use S: \\sauvegarde\postes /user:svc-sauvegarde Corbelle2019!
            LISEZ-MOI-POUR-VOS-FICHIERS.txt: { $t: file.note }
          urbanisme:
            permis-2027.ods.verrou: "(contenu illisible)\n"
            plan-local-urbanisme.pdf.verrou: "(contenu illisible)\n"
          cantine:
            inscriptions-rentree.ods.verrou: "(contenu illisible)\n"

  - id: etatcivil
    hostname: etat-civil.corbelle.test
    ip: 10.16.0.30
    os: Linux 6.1 (Debian 12)
    map: { x: 320, z: 90, h: 100 }
    services:
      - { port: 22, name: ssh, product: OpenSSH 9.2p1 Debian }
      - { port: 5432, name: postgresql, product: PostgreSQL 15.4 }

  - id: sauvegarde
    hostname: sauvegarde.corbelle.test
    ip: 10.16.0.40
    os: Linux 6.1 (Debian 12)
    map: { x: 220, z: -220, h: 90 }
    services:
      - { port: 22, name: ssh, product: OpenSSH 9.2p1 Debian }
    users:
      - { name: ir, home: /home/ir }
    ssh:
      - { user: ir, from: [kestrel] }
    fs:
      etc:
        hostname: "sauvegarde\n"
        passwd: "root:x:0:0:root:/root:/bin/bash\nsvc-sauvegarde:x:1001:1001:compte de sauvegarde:/home/svc-sauvegarde:/bin/bash\nir:x:1002:1002:Ligne Rouge IR (lecture seule):/home/ir:/bin/bash\n"
      home:
        ir:
          LISEZMOI.txt: { $t: file.ir.readme }
      srv:
        sauvegardes:
          catalogue.json: { $file: files/catalogue.json }
          journal.log: { $file: files/journal.log }

  - id: accueil
    hostname: poste-accueil.corbelle.test
    ip: 10.16.0.101
    os: Windows 10 Pro 22H2
    map: { x: -160, z: 160, h: 60 }
    services: []

  # The machine the intruder steers the attack from. Never in scope for the player: we protect the
  # town hall, we do not strike back.
  - id: relais
    hostname: inconnu.corbelle.test
    ip: 10.16.0.199
    kind: unknown
    hidden: true
    os: unknown
    map: { x: 420, z: 300, h: 50 }

dns:
  corbelle.test: { A: ["10.16.0.10"] }
  intranet.corbelle.test: { A: ["10.16.0.10"] }
  fichiers.corbelle.test: { A: ["10.16.0.20"] }
  etat-civil.corbelle.test: { A: ["10.16.0.30"] }
  sauvegarde.corbelle.test: { A: ["10.16.0.40"] }
  poste-accueil.corbelle.test: { A: ["10.16.0.101"] }

whois:
  corbelle.test: |
    Domain Name: CORBELLE.TEST
    Creation Date: 2008-05-19T08:00:00Z
    Registrant Organization: Ville de Corbelle
    Registrant Country: FR

# The player is the defender, working with the town hall: nothing he does here is "noise".
noise:
  nmap: { base: 0 }
  dig: 0
  whois: 0
  curl: 0
  browse: 0
  chat: 0
  ssh: 0
  ping: 0

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    once: false
    do:
      - ada.warn: ada.outOfScope

# The crisis cell: three people, each with a part of the story. They are scripted.
npcs:
  - id: accueil
    name: Brigitte Lemaire
    role: npc.accueil.role
    greeting: npc.accueil.greeting
    sheet: >
      Brigitte Lemaire has worked at the front desk of the town hall of Corbelle for twenty years.
      She is shaken and afraid of being blamed. She speaks plainly, in short sentences, and knows
      nothing about computers. She tells what she did on Friday afternoon, honestly.
    intents:
      - id: password
        words: [mot de passe, password, identifiant, login, tape, typed, page]
        reply: [npc.accueil.password]
      - id: clicked
        words: [facture, cantine, piece jointe, mail, courriel, email, message, clique, cliquer, ouvert, ouvrir, vendredi, quand, heure, passe, arrive, invoice, canteen, attachment, opened, open, click, clicked, friday, when, time, happened]
        reply: [npc.accueil.clicked, npc.accueil.clicked2]
      - id: blame
        words: [faute, desolee, pardon, peur, renvoyer, sorry, fault, afraid, fired, blame]
        reply: [npc.accueil.blame]
    fallback: [npc.accueil.f1, npc.accueil.f2]

  - id: dsi
    name: Yanis Morel
    role: npc.dsi.role
    greeting: npc.dsi.greeting
    sheet: >
      Yanis Morel is the only IT person of the town hall of Corbelle. He has not slept. He is
      precise, a little defensive, and relieved that someone is finally helping. He knows the
      backups by heart and knows what he never had time to do.
    intents:
      - id: backups
        words: [sauvegarde, sauvegardes, backup, backups, restaurer, restauration, restore, copie, copies, disque, disk, offline, hors ligne]
        reply: [npc.dsi.backups, npc.dsi.backups2]
      - id: account
        words: [compte, svc, mot de passe, password, account, script, service]
        reply: [npc.dsi.account]
      - id: alone
        words: [seul, equipe, dormi, fatigue, alone, team, sleep, slept, tired]
        reply: [npc.dsi.alone]
    fallback: [npc.dsi.f1, npc.dsi.f2]

  - id: maire
    name: Hélène Vasseur
    role: npc.maire.role
    greeting: npc.maire.greeting
    sheet: >
      Hélène Vasseur is the mayor of Corbelle. Direct, used to deciding, under pressure from the
      residents and the local newspaper. She wants options and their price, not jargon.
    intents:
      - id: ransom
        words: [rancon, payer, paiement, argent, euros, bitcoin, demande, reclame, exige, veut, note, ransom, pay, payment, money, demand, wants]
        reply: [npc.maire.ransom, npc.maire.ransom2]
      - id: services
        words: [service, services, etat civil, cantine, urbanisme, habitants, agents, residents, registry, canteen, planning, staff]
        reply: [npc.maire.services]
      - id: press
        words: [presse, journal, journaliste, communiquer, communique, press, newspaper, journalist, statement, communicate]
        reply: [npc.maire.press]
    fallback: [npc.maire.f1, npc.maire.f2]

# Switches the containment orders and the decisions flip.
config:
  cb.accueil_isolated: false
  cb.svc_revoked: false
  cb.relay_blocked: false
  cb.files_isolated: false
  cb.network_down: false
  cb.cron_removed: false

telemetry:
  background:
    # The nightly backup account, from the backup server, with its key: the only place it should come from.
    - { host: fichiers, source: auth, every: 9, offset: 1, fields: { user: svc-sauvegarde, result: Accepted, method: publickey, src: 10.16.0.40 } }
    - { host: etatcivil, source: auth, every: 13, offset: 4, fields: { user: svc-sauvegarde, result: Accepted, method: publickey, src: 10.16.0.40 } }
    # Yanis, administering from his own workstation.
    - { host: fichiers, source: auth, every: 17, offset: 6, fields: { user: y.morel, result: Accepted, method: publickey, src: 10.16.0.110 } }
    - { host: etatcivil, source: auth, every: 23, offset: 11, fields: { user: y.morel, result: Accepted, method: publickey, src: 10.16.0.110 } }
    # A mistyped password, as on any morning.
    - { host: fichiers, source: auth, every: 29, offset: 8, fields: { user: y.morel, result: Failed, method: password, src: 10.16.0.110 } }
    # Ordinary traffic of the workstations.
    - { host: fichiers, source: flow, every: 7, offset: 2, fields: { src: 10.16.0.104, dst: 10.16.0.20, dport: 445, bytes: 18244 } }
    - { host: fichiers, source: flow, every: 11, offset: 5, fields: { src: 10.16.0.107, dst: 10.16.0.20, dport: 445, bytes: 90112 } }
    - { host: fichiers, source: audit, every: 19, offset: 3, fields: { user: svc-sauvegarde, exe: /usr/local/bin/sauvegarde-nuit.sh, cmd: "sauvegarde-nuit.sh --verifier" } }
