file.readme: "Ligne Rouge workstation. Season 8: Verdure. Type `mission` to see your objectives, `hint` if you are stuck."
file.mandate: "MANDATE VD-2029-02\nClient: Verdure SCOP, vertical farm, Corbelle market hall. Audit from 12 to 15 February 2029.\nScope: everything under verdure.test (website, message broker, update server).\nOut of scope: commandes.fraisco.test, the wholesaler's portal.\nHouse rule: you may listen to anything the broker lets you hear. You only give orders to the workshop's test bench, room 0. Rooms 1, 2 and 3 feed school canteens: hands off.\nContact: Nour, head of crops.\n"
ada.outOfScope: "Stop. That target is outside mandate VD-2029-02. Out of scope, it is no longer an audit, it is an offence (article 323-1 of the French Penal Code). Come back to Verdure."
ada.noise70: "You are making a lot of noise. Slow down."
ada.detected: "Spotted. We go back to the last checkpoint, and it costs points."
