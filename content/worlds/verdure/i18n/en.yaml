web.home.title: "Verdure - lettuce grown in town"
web.home.h1: "Lettuce grown in town"
web.home.p1: "Under the old market hall of Corbelle, we grow lettuce, basil and baby leaves on six levels, without pesticides, eight hundred metres from the canteens that serve them."
web.home.p2: "Forty sensors watch over temperature and humidity, day and night. We sleep."
web.farm.title: "Verdure - the farm"
web.farm.h1: "The farm, room by room"
web.farm.p1: "Three growing rooms in production, and a test bench in the workshop to try our settings without risking a harvest."
