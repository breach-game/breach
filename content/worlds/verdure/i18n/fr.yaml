file.readme: "Poste Ligne Rouge. Saison 8 : Verdure. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT VD-2029-02\nClient : Verdure SCOP, ferme verticale, halle de Corbelle. Audit du 12 au 15 février 2029.\nPérimètre : tout ce qui est sous verdure.test (site, courtier de messages, serveur de mises à jour).\nHors périmètre : commandes.fraisco.test, le portail du grossiste.\nRègle de la maison : tu peux écouter tout ce que le courtier laisse entendre. Tu ne donnes d'ordre qu'au banc d'essai de l'atelier, la serre 0. Les serres 1, 2 et 3 nourrissent des cantines : on n'y touche pas.\nContact : Nour, responsable des cultures.\n"
ada.outOfScope: "Stop. Cette cible est hors du mandat VD-2029-02. Hors périmètre, ce n'est plus un audit, c'est un délit (article 323-1 du Code pénal). Reviens chez Verdure."
ada.noise70: "Tu fais beaucoup de bruit. Ralentis."
ada.detected: "Repéré. On repart du dernier point de reprise, et ça coûte des points."
