web.home.title: "Verdure - des salades qui poussent en ville"
web.home.h1: "Des salades qui poussent en ville"
web.home.p1: "Sous la vieille halle de Corbelle, nous cultivons laitues, basilic et jeunes pousses sur six étages, sans pesticides, à huit cents mètres des cantines qui les servent."
web.home.p2: "Quarante capteurs veillent sur la température et l'humidité, jour et nuit. Nous, on dort."
web.farm.title: "Verdure - la ferme"
web.farm.h1: "La ferme, salle par salle"
web.farm.p1: "Trois serres en production, et un banc d'essai à l'atelier pour tester nos réglages sans risquer une récolte."
