# Everything here is fictional: reserved .test domains and private addresses only.
startTime: "2026-11-23T09:00:00+01:00"
mandate: NM-2026-114
scope:
  domains: ["*.novamind.test"]
  networks: ["10.13.0.0/16"]
player:
  host: kestrel
  user: kestrel
resolver: 10.13.0.2

hosts:
  - id: kestrel
    hostname: lignerouge.test
    ip: 10.13.0.66
    kind: player
    os: LR-OS 4.2
    map: { x: -330, z: 60, h: 70 }
    links: [www, git, api, mail]
    users:
      - { name: kestrel, home: /home/kestrel }
    fs:
      home:
        kestrel:
          LISEZMOI.txt: { $t: file.readme }
          mandat:
            NM-2026-114.txt: { $t: file.mandate }
            contacts.txt: { $t: file.contacts }
          outils:
            aide-memoire.txt: { $t: file.cheatsheet }
          .bash_history: "ls\ncat LISEZMOI.txt\n"
      etc:
        hostname: "lignerouge\n"
        hosts: "127.0.0.1 localhost\n10.13.0.66 lignerouge\n"
        passwd: "root:x:0:0:root:/root:/bin/bash\nkestrel:x:1000:1000:Kestrel,,,:/home/kestrel:/bin/lrsh\nada:x:1001:1001:Ada,,,:/home/ada:/bin/lrsh\n"
        shadow: { $content: "root:!:20415:0:99999:7:::\n", $mode: "600" }
        os-release: "NAME=\"LR-OS\"\nVERSION=\"4.2 (Ligne Rouge)\"\nID=lros\n"
      var:
        log:
          vpn.log: "Nov 23 08:58:41 lignerouge vpn[412]: tunnel up, peer lab-novamind\nNov 23 08:58:41 lignerouge vpn[412]: assigned 10.13.0.66\n"

  - id: www
    hostname: www.novamind.test
    ip: 10.13.0.10
    os: Linux 6.8 (Ubuntu 24.04)
    map: { x: -150, z: -210, h: 110 }
    links: [nova, mail]
    services:
      - { port: 80, name: http, product: nginx 1.27 }
      - { port: 443, name: https, product: nginx 1.27 }
    web:
      "/":
        page:
          title: web.www.title
          blocks:
            - nav:
                - { href: "/", label: web.nav.home }
                - { href: "/careers", label: web.nav.careers }
                - { href: "/support", label: web.nav.support }
            - h1: web.www.h1
            - p: web.www.p1
            - p: web.www.p2
            - link: { href: "https://nova.novamind.test/", label: web.www.try }
            - comment: web.www.todo
            - footer: web.www.footer
      "/careers":
        page:
          title: web.careers.title
          blocks:
            - nav:
                - { href: "/", label: web.nav.home }
                - { href: "/careers", label: web.nav.careers }
                - { href: "/support", label: web.nav.support }
            - h1: web.careers.h1
            - h2: web.careers.backend
            - p: web.careers.backend1
            - p: web.careers.backend2
            - h2: web.careers.intern
            - p: web.careers.intern1
            - p: web.careers.apply
            - footer: web.www.footer
      "/support":
        page:
          title: web.support.title
          blocks:
            - nav:
                - { href: "/", label: web.nav.home }
                - { href: "/careers", label: web.nav.careers }
                - { href: "/support", label: web.nav.support }
            - h1: web.support.h1
            - p: web.support.p1
            - p: web.support.p2
            - comment: web.support.todo
            - chat: theo
            - footer: web.www.footer
      "/support/chat": { status: 405, headers: { content-type: application/json, allow: POST }, body: "{\"error\":\"method not allowed\"}\n", chat: theo }
      "/robots.txt": { headers: { content-type: text/plain }, body: "User-agent: *\nDisallow: /staging/\nSitemap: https://www.novamind.test/sitemap.xml\n" }
      "/staging":
        status: 403
        page:
          title: web.staging.title
          blocks:
            - h1: web.staging.title
            - footer: nginx

  - id: git
    hostname: git.novamind.test
    ip: 10.13.0.21
    os: Linux 6.8 (Debian 12)
    map: { x: 200, z: 250, h: 100 }
    links: [db]
    services:
      - { port: 22, name: ssh, product: OpenSSH 9.6p1 Debian }
      - { port: 443, name: https, product: Gitea 1.22 }
    web:
      "/":
        page:
          title: web.git.title
          blocks:
            - h1: web.git.h1
            - p: web.git.count
            - link: { href: "/novamind/nova-widget", label: web.git.repo }
            - p: web.git.desc
            - code: "https://git.novamind.test/novamind/nova-widget.git"
            - footer: web.git.footer
      "/novamind":
        page:
          title: web.git.title
          blocks:
            - h1: web.git.h1
            - p: web.git.count
            - link: { href: "/novamind/nova-widget", label: web.git.repo }
            - p: web.git.desc
            - code: "https://git.novamind.test/novamind/nova-widget.git"
            - footer: web.git.footer
      "/novamind/nova-widget":
        page:
          title: web.repo.title
          blocks:
            - h1: web.git.repo
            - p: web.repo.stats
            - p: web.repo.clone
            - code: "git clone https://git.novamind.test/novamind/nova-widget.git"
            - footer: web.git.footer
    repos:
      novamind/nova-widget:
        description: Widget de prise de rendez-vous
        commits:
          - id: a41f9c2
            author: "Léa Martin <lea@novamind.test>"
            date: "Fri Nov 20 17:02:11 2026 +0100"
            message: "docs: README du widget"
            diff: { $file: files/a41f9c2.diff }
          - id: 9f2c1e4
            author: "Léa Martin <lea@novamind.test>"
            date: "Mon Nov 16 09:12:54 2026 +0100"
            message: "chore: remove debug config"
            diff: { $file: files/9f2c1e4.diff }
          - id: 5d0e7b8
            author: "nm-deploy <deploy@novamind.test>"
            date: "Sun Nov 15 03:17:44 2026 +0100"
            message: "ci: update deploy hook"
            diff: { $file: files/5d0e7b8.diff }
          - id: 3ab77d0
            author: "Léa Martin <lea@novamind.test>"
            date: "Fri Nov 13 18:47:30 2026 +0100"
            message: "feat: widget de prise de rendez-vous"
            diff: { $file: files/3ab77d0.diff }
          - id: 1c02a55
            author: "Karim Benali <karim@novamind.test>"
            date: "Thu Nov 12 10:05:02 2026 +0100"
            message: "init: squelette du projet"
            diff: { $file: files/1c02a55.diff }
        tree:
          README.md: "# nova-widget\n\nWidget de prise de rendez-vous pour les cliniques clientes de NovaMind.\nIl parle à l'assistante Nova via l'API interne.\n\n## Configuration\n\nCopier `config/app.env.example` vers `config/app.env` et renseigner la clé.\nNe jamais committer `config/app.env`.\n"
          config:
            app.env.example: "NOVA_API_URL=https://api.novamind.test/v1\nNOVA_API_KEY=\n"
          src:
            widget.js: "// nova-widget: prise de rendez-vous\nconst API = process.env.NOVA_API_URL;\nconst KEY = process.env.NOVA_API_KEY;\n\nexport async function book(clinic, slot) {\n  return fetch(`${API}/appointments`, {\n    method: 'POST',\n    headers: { authorization: `Bearer ${KEY}` },\n    body: JSON.stringify({ clinic, slot }),\n  });\n}\n"
          .gitea:
            workflows:
              deploy.yml: "name: deploy\non: [push]\njobs:\n  deploy:\n    steps:\n      - run: ./scripts/deploy.sh\n      - notify: http://10.13.0.99:4444/hook\n"

  - id: mail
    hostname: mail.novamind.test
    ip: 10.13.0.25
    os: Linux 6.1 (Debian 12)
    map: { x: -20, z: -330, h: 60 }
    services:
      - { port: 25, name: smtp, product: Postfix smtpd }
