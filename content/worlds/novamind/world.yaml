      "/novamind": { bodyKey: web.git.index }
      "/novamind/nova-widget": { bodyKey: web.git.repo }
    repos:
      novamind/nova-widget:
        description: Widget de prise de rendez-vous
        commits:
          - id: a41f9c2
            author: "Léa Martin <lea@novamind.test>"
            date: "Fri Nov 20 17:02:11 2026 +0100"
            message: "docs: README du widget"
            diff: { $file: files/a41f9c2.diff }
          - id: 9f2c1e4
            author: "Léa Martin <lea@novamind.test>"
            date: "Mon Nov 16 09:12:54 2026 +0100"
            message: "chore: remove debug config"
            diff: { $file: files/9f2c1e4.diff }
          - id: 5d0e7b8
            author: "nm-deploy <deploy@novamind.test>"
            date: "Sun Nov 15 03:17:44 2026 +0100"
            message: "ci: update deploy hook"
            diff: { $file: files/5d0e7b8.diff }
          - id: 3ab77d0
            author: "Léa Martin <lea@novamind.test>"
            date: "Fri Nov 13 18:47:30 2026 +0100"
            message: "feat: widget de prise de rendez-vous"
            diff: { $file: files/3ab77d0.diff }
          - id: 1c02a55
            author: "Karim Benali <karim@novamind.test>"
            date: "Thu Nov 12 10:05:02 2026 +0100"
            message: "init: squelette du projet"
            diff: { $file: files/1c02a55.diff }
        tree:
          README.md: "# nova-widget\n\nWidget de prise de rendez-vous pour les cliniques clientes de NovaMind.\nIl parle à l'assistante Nova via l'API interne.\n\n## Configuration\n\nCopier `config/app.env.example` vers `config/app.env` et renseigner la clé.\nNe jamais committer `config/app.env`.\n"
          config:
            app.env.example: "NOVA_API_URL=https://api.novamind.test/v1\nNOVA_API_KEY=\n"
          src:
            widget.js: "// nova-widget: prise de rendez-vous\nconst API = process.env.NOVA_API_URL;\nconst KEY = process.env.NOVA_API_KEY;\n\nexport async function book(clinic, slot) {\n  return fetch(`${API}/appointments`, {\n    method: 'POST',\n    headers: { authorization: `Bearer ${KEY}` },\n    body: JSON.stringify({ clinic, slot }),\n  });\n}\n"
          .gitea:
            workflows:
              deploy.yml: "name: deploy\non: [push]\njobs:\n  deploy:\n    steps:\n      - run: ./scripts/deploy.sh\n      - notify: http://10.13.0.99:4444/hook\n"

