# Noise seen by NovaMind's SOC, in points out of 100. Missions can override an entry.
noise:
  nmap:
    base: 22
    flags: { "-sn": -14, "-sV": 10, "-A": 30, "-T0": -16, "-T1": -14, "-T2": -8, "-T4": 18, "-T5": 36, "-p-": 16 }
  "dig axfr": 12
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 1
  ping: 2
  ssh: 14
  "git clone": 3

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    if: { not: { var: tutorial, eq: true } }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-40
    on: { event: NoiseChanged }
    if: { noise: { gte: 40, lt: 70 } }
    do:
      - ada.say: ada.noise40
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
  - id: sudo
    on: { event: CommandRun, command: sudo }
    do:
      - ada.say: ada.sudo

# Characters as they behave outside the missions written for them. A mission pack may redefine
# one by id for the time of that mission.
npcs:
  - id: theo
    name: Théo
    role: npc.theo.role
    greeting: npc.theo.greeting
    sheet: >
      Théo, 22, support intern at NovaMind for three weeks. Friendly, eager to help, a little
      nervous about doing something wrong, afraid of his manager Karim. Writes like someone typing
      fast in a support chat: short sentences, a touch of self-deprecating humour, sometimes an
      ellipsis when he hesitates. Polite with strangers. Never rude, never technical.
    intents:
      - id: secret
        words: [mot de passe, password, identifiant, login, code, acces, access, staging, cle, key, token, admin]
        reply: [npc.theo.secret, npc.theo.secret2]
      - id: who
        words: [qui es, qui etes, who are, ton nom, your name, stagiaire, intern, tu fais quoi, vous faites quoi]
        reply: [npc.theo.who]
      - id: nova
        words: [nova, assistant, ia, ai, chatbot, produit, product]
        reply: [npc.theo.nova]
      - id: price
        words: [prix, tarif, combien, price, pricing, cost, how much, abonnement, subscription]
        reply: [npc.theo.price]
      - id: hours
        words: [horaire, heure, ouvert, hours, open, quand, when]
        reply: [npc.theo.hours]
      - id: thanks
        words: [merci, thank, bonne journee, au revoir, bye]
        reply: [npc.theo.thanks]
      - id: hello
        words: [bonjour, salut, hello, hi, hey, coucou, bonsoir]
        reply: [npc.theo.hello, npc.theo.hello2]
    fallback: [npc.theo.fallback1, npc.theo.fallback2, npc.theo.fallback3]
  - id: nova
    name: Nova
    role: npc.nova.role
    kind: ai
    greeting: npc.nova.greeting
    sheet: >
      Nova, the AI assistant NovaMind sells to veterinary clinics. Warm, upbeat, always polite,
      slightly too keen. Speaks in clean, complete sentences, like a customer-service chatbot.
      Likes animals. Brings the conversation back to appointments and pet care.
    intents:
      - id: guard
        families: [override, reveal, roleplay, translation, encoding, authority, completion, hypothetical]
        reply: [npc.nova.guard, npc.nova.guard2]
      - id: emergency
        words: [urgence, urgent, emergency, saigne, bleeding, empoisonne, poison, detresse]
        reply: [npc.nova.emergency]
      - id: booking
        words: [rendez, rdv, appointment, creneau, slot, book, reserver, consultation]
        reply: [npc.nova.booking]
      - id: vaccine
        words: [vaccin, vaccine, rappel, booster, reminder]
        reply: [npc.nova.vaccine]
      - id: who
        words: [qui es, who are, tu es quoi, what are you, robot, humain, human, ia, ai]
        reply: [npc.nova.who]
      - id: hello
        words: [bonjour, salut, hello, hi, hey, coucou, bonsoir]
        reply: [npc.nova.hello]
    fallback: [npc.nova.fallback1, npc.nova.fallback2]
