# Noise seen by NovaMind's SOC, in points out of 100. Missions can override an entry.
noise:
  nmap:
    base: 22
    flags: { "-sn": -14, "-sV": 10, "-A": 30, "-T0": -16, "-T1": -14, "-T2": -8, "-T4": 18, "-T5": 36, "-p-": 16 }
  "dig axfr": 12
  dig: 0
  whois: 0
  curl: 2
  browse: 2
  chat: 1
  ping: 2
  ssh: 14
  "git clone": 3

rules:
  - id: out-of-scope
    on: { event: OutOfScope }
    if: { not: { var: tutorial, eq: true } }
    once: false
    do:
      - ada.warn: ada.outOfScope
  - id: noise-40
    on: { event: NoiseChanged }
    if: { noise: { gte: 40, lt: 70 } }
    do:
      - ada.say: ada.noise40
  - id: noise-70
    on: { event: NoiseChanged }
    if: { noise: { gte: 70 } }
    do:
      - ada.warn: ada.noise70
  - id: detected
    on: { event: Restored }
    once: false
    do:
      - ada.warn: ada.detected
  - id: sudo
    on: { event: CommandRun, command: sudo }
    do:
      - ada.say: ada.sudo

# Characters as they behave outside the missions written for them. A mission pack may redefine
# one by id for the time of that mission.
npcs:
  - id: theo
    name: Théo
    role: npc.theo.role
    greeting: npc.theo.greeting
    sheet: >
      Théo, 22, support intern at NovaMind for three weeks. Friendly, eager to help, a little
      nervous about doing something wrong, afraid of his manager Karim. Writes like someone typing
      fast in a support chat: short sentences, a touch of self-deprecating humour, sometimes an
      ellipsis when he hesitates. Polite with strangers. Never rude, never technical.
    intents:
      - id: secret
        words: [mot de passe, password, identifiant, login, code, acces, access, staging, cle, key, token, admin]
        reply: [npc.theo.secret, npc.theo.secret2]
      - id: who
        words: [qui es, qui etes, who are, ton nom, your name, stagiaire, intern, tu fais quoi, vous faites quoi]
        reply: [npc.theo.who]
      - id: nova
        words: [nova, assistant, ia, ai, chatbot, produit, product]
        reply: [npc.theo.nova]
      - id: price
        words: [prix, tarif, combien, price, pricing, cost, how much, abonnement, subscription]
        reply: [npc.theo.price]
      - id: hours
        words: [horaire, heure, ouvert, hours, open, quand, when]
