file.readme: |
  Bienvenue sur LR-OS, le poste de travail de Ligne Rouge.

  Ce poste est relié par VPN au réseau de test de notre client.
  Tout ce que tu tapes ici ne touche que ce réseau.

    help              la liste des commandes
    explain <outil>   à quoi sert un outil, et comment la défense le voit
    mission           le briefing et les objectifs en cours
    hint              un indice d'Ada, si tu bloques

  Commence par lire le mandat :  cat mandat/NM-2026-114.txt

  Ada
file.mandate: |
  ==============================================================
   LIGNE ROUGE  ·  cabinet de tests d'intrusion  ·  Lyon
   MANDAT DE TEST D'INTRUSION  N° NM-2026-114
  ==============================================================

  CLIENT          NovaMind SAS, Lyon
  SIGNATAIRE      Inès Carron, directrice technique (CTO)
  PRESTATAIRE     Ligne Rouge
  AUDITEURS       Ada (responsable), {user} (junior)

  1. OBJET
     NovaMind autorise Ligne Rouge à rechercher et à démontrer des
     vulnérabilités dans son système d'information, afin de les
     corriger.

  2. PÉRIMÈTRE AUTORISÉ
     - Domaines   : *.novamind.test
     - Réseau     : 10.13.0.0/16
     Toute autre cible est INTERDITE, y compris les prestataires,
     les clients et les comptes personnels des salariés.

  3. PÉRIODE
     Du 23 novembre au 4 décembre 2026, de 8 h à 20 h.

  4. RÈGLES D'ENGAGEMENT
     - Aucune destruction ni modification de données.
     - Aucun déni de service.
     - L'ingénierie sociale est autorisée sur les canaux
       professionnels de NovaMind (support en ligne, assistante
       Nova), sans menace ni usurpation d'une autorité publique.
     - Toute donnée personnelle rencontrée reste confidentielle.
     - Tout signe d'une intrusion réelle par un tiers est signalé
       immédiatement au client.

  5. RAPPEL DE LA LOI
     Sans cette autorisation écrite, accéder ou se maintenir dans un
     système d'information est un délit : article 323-1 du Code
     pénal, jusqu'à trois ans d'emprisonnement et 100 000 euros
     d'amende. Le mandat est ce qui sépare un auditeur d'un pirate.

  6. ACCUSÉ DE LECTURE
     L'auditeur confirme avoir lu le périmètre en transmettant le
     code suivant à sa responsable :

         FLAG{perimetre-novamind-test}

  Signé : I. Carron (NovaMind)  ·  Ada (Ligne Rouge)
