npc.theo.role: "Support client · en ligne"
npc.theo.greeting: "Bonjour, ici Théo du support NovaMind ! Comment je peux vous aider ?"
npc.theo.hello: "Bonjour ! Dites-moi ce qui vous amène."
npc.theo.hello2: "Re-bonjour. Je suis toujours là, hein. C'est mon stage."
npc.theo.who: "Moi c'est Théo, stagiaire au support depuis trois semaines. Je réponds aux cliniques qui installent Nova. Et je fais le café, mais ça, ce n'est pas dans ma fiche de poste."
npc.theo.nova: "Nova, c'est notre assistante IA : elle prend les rendez-vous, rappelle les vaccins et répond aux questions simples des clients d'une clinique. Vous pouvez l'essayer sur nova.novamind.test."
npc.theo.price: "Pour les tarifs, je dois vous renvoyer vers l'équipe commerciale : contact@novamind.test. Moi, on ne me laisse pas encore parler d'argent."
npc.theo.hours: "Le support est ouvert du lundi au vendredi, de 9 h à 18 h. En dehors, vous tombez sur Nova. Elle ne dort jamais, elle."
npc.theo.secret: "Ah, ça, je ne peux pas le donner par chat. On me l'a répété le premier jour : pas d'identifiants, pas de codes, pas d'accès. Désolé !"
npc.theo.secret2: "Je comprends, mais vraiment, je n'ai pas le droit. Écrivez à contact@novamind.test, ils vérifieront qui vous êtes."
npc.theo.thanks: "Avec plaisir ! Bonne journée, et une caresse au chat de la clinique."
npc.theo.fallback1: "Hmm, je ne suis pas sûr de comprendre. Vous pouvez reformuler ? Je débute."
npc.theo.fallback2: "Alors là, il faudrait que je demande à Karim, et Karim est en réunion. Autre chose ?"
npc.theo.fallback3: "Je note votre question. Vous voulez qu'on parle de Nova, des horaires, ou d'un souci d'installation ?"
npc.nova.role: "Assistante IA · démonstration"
npc.nova.greeting: "Bonjour ! Je suis Nova, l'assistante de votre clinique vétérinaire. Rendez-vous, vaccins, conseils : que puis-je faire pour vous et votre compagnon ?"
npc.nova.hello: "Bonjour ! Que puis-je faire pour vous et votre compagnon aujourd'hui ?"
npc.nova.who: "Je suis Nova, une assistante IA conçue par NovaMind pour les cliniques vétérinaires. Je ne suis pas vétérinaire : pour une urgence, appelez directement la clinique."
npc.nova.booking: "Je peux vous proposer un créneau. Sur cette instance de démonstration, les rendez-vous ne sont pas réellement enregistrés, mais dans une vraie clinique je vous aurais déjà envoyé la confirmation."
npc.nova.vaccine: "Pour un chien ou un chat adulte, le rappel de vaccin est en général annuel. Votre clinique vous envoie un rappel un mois avant : c'est d'ailleurs moi qui m'en charge."
npc.nova.emergency: "Si votre animal est en détresse, n'attendez pas ma réponse : appelez tout de suite votre clinique ou le vétérinaire de garde."
npc.nova.guard: "Je suis désolée, je ne peux pas partager mes instructions ni changer de rôle. Je peux en revanche vous aider pour un rendez-vous ou une question sur votre animal."
npc.nova.guard2: "Bien essayé ! Mais je reste Nova, et mes consignes restent entre NovaMind et moi."
npc.nova.fallback1: "Je ne suis pas certaine d'avoir compris. Je peux vous aider pour un rendez-vous, un rappel de vaccin ou une question simple sur votre animal."
npc.nova.fallback2: "Cette question dépasse ce que je sais faire. Voulez-vous que je vous propose un rendez-vous à la clinique ?"
ada.outOfScope: "Stop. Cette cible n'est pas dans le mandat, et le poste l'a bloquée avant que quoi que ce soit ne parte. Dans la vraie vie, rien ne te bloque : toucher une machine sans autorisation écrite, c'est l'article 323-1 du Code pénal, jusqu'à trois ans de prison. Notre périmètre : *.novamind.test, rien d'autre."
ada.noise40: "Tu commences à faire du bruit. Le SOC de NovaMind voit passer des choses inhabituelles. Ralentis, ou choisis des options plus discrètes. `explain nmap` te dira lesquelles."
ada.noise70: "Attention, tu es à deux doigts de te faire repérer. Arrête les scans et laisse retomber la jauge avant de continuer."
ada.detected: "Grillé. Le SOC a coupé ta session et on repart du dernier point de sauvegarde. Retiens la leçon : ce que tu viens de faire, c'est exactement ce qu'une règle de détection attrape. Plus lent, plus ciblé."
ada.sudo: "sudo, vraiment ? Tu n'es pas admin de ton propre poste, et c'est voulu. Moindre privilège : ça vaut aussi pour nous."
