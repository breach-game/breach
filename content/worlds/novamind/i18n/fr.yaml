file.cheatsheet: |
  Aide-mémoire du junior

  Se repérer     pwd · ls -la · cd dossier · cd .. · cat fichier
  Chercher       grep -rn motif dossier · find . -name "*.env"
  Enchaîner      commande | grep motif | head -5
  Garder         commande > fichier.txt · notes add <texte>

  Reconnaissance, du plus discret au plus bruyant
    whois domaine        fiche publique, invisible pour la cible
    dig domaine ANY      DNS, invisible pour la cible
    curl -I url          une ligne dans les logs du serveur web
    nmap -sn plage       repère les machines, déjà visible
    nmap -sV cible       interroge chaque service, bruyant

  Règle d'or : regarde la jauge de bruit avant d'appuyer sur Entrée.
