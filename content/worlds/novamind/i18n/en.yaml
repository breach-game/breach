file.readme: |
  Welcome to LR-OS, the Ligne Rouge workstation.

  This machine is linked by VPN to our client's test network.
  Whatever you type here only reaches that network.

    help              the list of commands
    explain <tool>    what a tool does, and how defenders see it
    mission           the briefing and current objectives
    hint              a hint from Ada, if you get stuck

  Start by reading the mandate:  cat mandat/NM-2026-114.txt

  Ada
file.mandate: |
  ==============================================================
   LIGNE ROUGE  ·  penetration testing firm  ·  Lyon
   PENETRATION TEST MANDATE  No. NM-2026-114
  ==============================================================

  CLIENT          NovaMind SAS, Lyon
  SIGNED BY       Inès Carron, chief technology officer (CTO)
  CONTRACTOR      Ligne Rouge
  TESTERS         Ada (lead), {user} (junior)

  1. PURPOSE
     NovaMind authorises Ligne Rouge to look for and demonstrate
     vulnerabilities in its information system, in order to fix
     them.

  2. AUTHORISED SCOPE
     - Domains    : *.novamind.test
     - Network    : 10.13.0.0/16
     Any other target is FORBIDDEN, including suppliers, customers
     and employees' personal accounts.

  3. PERIOD
     From 23 November to 4 December 2026, 8 am to 8 pm.

  4. RULES OF ENGAGEMENT
     - No destruction or modification of data.
     - No denial of service.
     - Any personal data encountered stays confidential.
     - Any sign of a real intrusion by a third party is reported
       to the client at once.

  5. THE LAW
     Without this written authorisation, accessing or remaining in
     an information system is a criminal offence: article 323-1 of
     the French Penal Code, up to three years in prison and a
     100,000 euro fine. The mandate is what separates a tester
     from an intruder.

  6. ACKNOWLEDGEMENT
     The tester confirms having read the scope by sending the
     following code to their lead:

         FLAG{perimetre-novamind-test}

  Signed: I. Carron (NovaMind)  ·  Ada (Ligne Rouge)
