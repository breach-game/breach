file.cheatsheet: |
  Junior's cheat sheet

  Find your way  pwd · ls -la · cd folder · cd .. · cat file
  Search         grep -rn pattern folder · find . -name "*.env"
  Chain          command | grep pattern | head -5
  Keep           command > file.txt · notes add <text>

  Reconnaissance, from quietest to loudest
    whois domain         public record, invisible to the target
    dig domain ANY       DNS, invisible to the target
    curl -I url          one line in the web server logs
    open url             the same page, in the browser
    nmap -sn range       finds machines, already visible
    nmap -sV target      probes every service, loud

  Golden rule: look at the noise gauge before you press Enter.
