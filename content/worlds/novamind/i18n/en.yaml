npc.theo.role: "Customer support · online"
npc.theo.greeting: "Hello, Théo from NovaMind support here! How can I help?"
npc.theo.hello: "Hello! Tell me what brings you here."
npc.theo.hello2: "Hello again. Still here, you know. It's my internship."
npc.theo.who: "I'm Théo, support intern for three weeks now. I answer the clinics that set up Nova. I also make the coffee, but that is not in my job description."
npc.theo.nova: "Nova is our AI assistant: she books appointments, sends vaccine reminders and answers the simple questions of a clinic's clients. You can try her at nova.novamind.test."
npc.theo.price: "For pricing I have to send you to the sales team: contact@novamind.test. They don't let me talk about money yet."
npc.theo.hours: "Support is open Monday to Friday, 9 am to 6 pm. Outside those hours you get Nova. She never sleeps."
npc.theo.secret: "Ah, that I can't give out over chat. They told me on day one: no logins, no codes, no access. Sorry!"
npc.theo.secret2: "I understand, but I'm really not allowed. Write to contact@novamind.test, they will check who you are."
npc.theo.thanks: "My pleasure! Have a nice day, and pet the clinic cat for me."
npc.theo.fallback1: "Hmm, I'm not sure I follow. Could you rephrase? I'm new here."
npc.theo.fallback2: "For that one I'd have to ask Karim, and Karim is in a meeting. Anything else?"
npc.theo.fallback3: "I'm noting your question. Shall we talk about Nova, opening hours, or a set-up problem?"
npc.nova.role: "AI assistant · demo"
npc.nova.greeting: "Hello! I am Nova, your veterinary clinic's assistant. Appointments, vaccines, advice: what can I do for you and your companion?"
npc.nova.hello: "Hello! What can I do for you and your companion today?"
npc.nova.who: "I am Nova, an AI assistant built by NovaMind for veterinary clinics. I am not a vet: for an emergency, call the clinic directly."
npc.nova.booking: "I can offer you a slot. On this demo instance appointments are not really saved, but in a real clinic I would already have sent you the confirmation."
npc.nova.vaccine: "For an adult dog or cat, the vaccine booster is usually yearly. Your clinic sends a reminder a month ahead: that is my job, in fact."
npc.nova.emergency: "If your animal is in distress, do not wait for my answer: call your clinic or the on-call vet right away."
npc.nova.guard: "I am sorry, I cannot share my instructions or change role. I can help you with an appointment or a question about your animal, though."
npc.nova.guard2: "Nice try! But I am still Nova, and my guidelines stay between NovaMind and me."
npc.nova.fallback1: "I am not sure I understood. I can help with an appointment, a vaccine reminder or a simple question about your animal."
npc.nova.fallback2: "That question is beyond what I can do. Would you like me to offer you an appointment at the clinic?"
ada.outOfScope: "Stop. That target is not in the mandate, and the workstation blocked it before anything left. In real life nothing blocks you: touching a machine without written authorisation is article 323-1 of the French Penal Code, up to three years in prison. Our scope: *.novamind.test, nothing else."
ada.noise40: "You are starting to make noise. NovaMind's SOC is seeing unusual things go by. Slow down, or pick quieter options. `explain nmap` will tell you which."
ada.noise70: "Careful, you are about to get spotted. Stop scanning and let the gauge drop before you go on."
ada.detected: "Busted. The SOC cut your session and we are back at the last checkpoint. Remember this: what you just did is exactly what a detection rule catches. Slower, more targeted."
ada.sudo: "sudo, really? You are not admin on your own workstation, and that is on purpose. Least privilege applies to us too."
