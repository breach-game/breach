file.readme: "Poste Ligne Rouge. Saison 6 : Alto. Tape `mission` pour voir tes objectifs, `hint` si tu bloques."
file.mandate: "MANDAT AL-2028-003\nClient : Alto SAS. Périmètre : *.alto.test, 10.18.0.0/24.\nObjet : audit du compte cloud d'Alto chez Nimbus (stockage, identités, chaîne de déploiement, applications autorisées) avant une levée de fonds.\nJeton d'audit, en lecture seule sur les identités, valable jusqu'au vendredi 19 mai :\n  nmb_audit_91d0\n  à envoyer ainsi : curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/whoami\nRègles : aucune donnée de client copiée hors du poste, aucun fichier modifié ni supprimé chez Alto, aucun secret réutilisé ailleurs que pour prouver qu'il fonctionne.\nNimbus a donné son accord écrit pour cet audit, limité au compte alto-prod.\nTout ce qui est hors périmètre est interdit (article 323-1 du Code pénal).\n"
