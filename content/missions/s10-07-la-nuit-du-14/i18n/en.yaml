h7.briefing: "Monday 14 May, 3.02 am. Your machine stayed plugged in at the Lemerles', and Ada has just woken you. The smart plug in the study, the one nobody recognised on Saturday, is not asleep. You read the router's log from your machine: `soc sources` for what the router records, `soc alerts` for what is ringing, `flows` for who talks to whom. The family is asleep, and the goal is to keep it that way."
h7.obj.cut: "Cut the plug off from the rest of the house"
h7.obj.stop: "Check that it no longer gets through"
h7.obj.night: "Find the address it had never called before"
h7.obj.rule: "Write the rule that would have rung"
h7.obj.fate: "Decide what happens to the plug"
h7.file.rule: "# Detection rule, try it with: rule test regles/prise.yml\n# One line per condition. Fields of the flow log: src, dst, dport, bytes.\n# Modifiers: |contains, |startswith, |endswith, |gte (at least).\ntitle: The plug is doing something other than its job\nsource: flow\nsrc: 10.24.0.52\n"
h7.file.order: "ORDER no. 77-204-1193 - Grand Bazar marketplace\nDate: 2 March 2029\nSeller: Maison-Futee-Direct (shop opened in February 2029)\n\n1 x Pack of 2 Wi-Fi smart plugs \"SmartPlug\", unbranded     EUR 6.90\n    App: \"Plug Home Easy\"\n    Updates: not specified\n    Manual: one sheet, no maker's name or address\n    Reviews: 4.8 / 5 (212 reviews, all from the same month)\n\nFree delivery.\n\n-- note from Karim: the second one is still in its box, in the garage.\n"
h7.contain.plug: "Block the plug in the router: it stays on, but it no longer talks to anyone"
h7.contain.address: "Block the address 198.51.100.94 in the router"
h7.contain.wifi: "Switch the home Wi-Fi off until morning (camera, hub, lock and phones included)"
h7.alert.inside: "A device opens a connection to another device in the house"
h7.alert.inside.why: "A plug takes orders from the hub. It has no reason to go and talk to the camera or the printer itself."
h7.alert.outside: "The plug calls outside on an unusual port"
h7.alert.outside.why: "It normally only calls its maker's service, on port 443."
h7.q.night: "Which outside address has the plug been calling since 3.02 am, for the first time?"
h7.q.fate: "Karim, woken by the coffee: \"So what do we do with the plug?\""
h7.q.fate.return: "Send it back to the seller with the second one, and report the listing."
h7.q.fate.return.why: "Both plugs leave the house, and the report may get the listing removed for the next buyers. The study lamp gets its switch back."
h7.q.fate.recycle: "Take it to the recycling centre and buy one from a maker that supports it."
h7.q.fate.recycle.why: "It will not come back. The new one will cost three times as much, with a maker's name, an address and updates promised until a given date."
h7.q.fate.guest: "Keep it, but alone on the guest network."
h7.q.fate.guest.why: "On the guest network it no longer sees the camera or the hub, and the lamp still works. It still calls whoever it likes outside, though, and nobody will ever fix its software."
h7.ada.brief: "Sorry about the hour. I have been watching their router since last night, and at 3.02 am the plug `ESP-7C41` (10.24.0.52) called an address I had never seen. Look with me at what the router records: `soc sources`."
h7.ada.g.cut: "Start with `soc sources`. Then see what is ringing: `soc alerts`, and what the plug is doing: `flows --src 10.24.0.52`. Then `contain` lists what you can cut, and `contain isolate prise-bureau` cuts as close as possible."
h7.ada.g.cut.standard: "Look at the alerts and at the plug's flows (10.24.0.52), then cut as close as possible with `contain`."
h7.ada.look: "It has just opened a connection to the camera, then to the hub. Normally the hub talks to it, never the other way round. It is doing the rounds of the house."
h7.ada.tablet: "The printer, the tablet. It is noting who answers and on which door. Cut it off now: `contain` shows you the measures."
h7.ada.second: "You blocked one address, and it knows a second one: 198.51.100.95. A list of addresses grows faster than anyone can block it. The plug is what needs cutting, not the people it talks to."
h7.ada.pull: "It is reading the video stream of the living-room camera. Two megabytes and rising. Cut it off."
h7.ada.talk: "It is talking to the hub now, the one that controls the lock. Good thing you gave it a password on Saturday. Cut the plug off, quickly."
h7.ada.fail: "Nine megabytes of living-room video left the house. We start again at 3.02 am: the plug first, the questions afterwards."
h7.ada.address: "The address 198.51.100.94 is blocked. It is clean, it costs the family nothing, and it will not hold: whoever drives thousands of plugs has more than one address. Keep watching."
h7.ada.plug: "The router lets nothing through for the plug any more. It is still on and so is the study lamp, but it is talking into the void. Nobody woke up."
h7.ada.wifi: "It works, and it works for everyone: the camera, the hub, the lock and Léa's alarm clock have just lost the network too. At 3 am that is defensible, but remember the difference: you cut what is sick, not the house."
h7.ada.g.stop: "Look at the router's log: `soc logs box flow`. The `deny` lines are the plug's attempts."
h7.ada.g.stop.standard: "Check in the router's flow log that the plug is refused."
h7.ada.stopped: "Look at `soc logs box flow`: `deny`. It keeps trying, the router refuses. It is over for tonight, and it is 3.09 am. Seven minutes, and the only machine that saw anything is yours: a home router warns nobody."
h7.ada.g.night: "Compare its usual calls with tonight's: `flows --src 10.24.0.52`. It normally calls 198.51.100.20 on port 443. Answer with `answer night <address>`."
h7.ada.g.night.standard: "In the plug's flows, find the outside address that only appears from 3.02 am, and answer with `answer night`."
h7.ada.night: "198.51.100.94, port 8443. Normally the plug calls its maker, as it should. Tonight it calls someone else, who tells it what to do. The Lemerles are not the target: the same plug is doing the same thing tonight in thousands of homes. It is looking for cameras."
h7.ada.g.rule: "Read the rule: `cat regles/prise.yml`, try it: `rule test regles/prise.yml`. It also rings on the ordinary calls to the maker. Add what sets tonight apart: `echo \"dst|startswith: 10.24.0.\" >> regles/prise.yml`, then test again."
h7.ada.g.rule.standard: "The rule `regles/prise.yml` rings too often. What does a plug never do in a house? Add that condition and run `rule test`."
h7.ada.rule: "That is the rule: a plug never starts a conversation with another device in the house. No need to know the driver's address or the software's name, you only need to know what a plug's normal job is. The same goes for a bulb, a television or a vacuum cleaner. It is 6.40 am and I can hear the coffee machine. Read `maison/commande.txt`, Karim found it."
h7.ada.g.fate: "Read `maison/commande.txt`, then answer Karim's question: the family decides, and no answer is wrong."
h7.ada.fate: "Noted in the report. Look at the order once more: no brand, no address, not a word about updates, EUR 6.90 for two. Nobody built this plug to spy on the Lemerles. Someone built it as cheaply as possible, and someone else found the door left open."
h7.ada.done: "One weekend. A router with its password written underneath, a camera opened by a password from 2027, one bulb too many, three scams on Odile's phone, a forwarding rule, and a plug at EUR 3.45. None of it took a genius, neither the attack nor the fix. Élise left you a note on the table: \"Thank you. I understood more in two days than in ten years of manuals.\" She copied out the list of devices neatly and stuck it on the fridge. And your own house: when do you look at it?"
h7.hint.cut.1: "`soc alerts` shows what is ringing. `flows --src 10.24.0.52` shows who the plug talks to."
h7.hint.cut.2: "`contain` lists three measures. Blocking one address does not hold, switching the Wi-Fi off cuts the whole house."
h7.hint.cut.3: "Type `contain isolate prise-bureau`."
h7.hint.stop.1: "Type `soc logs box flow` and look at the `deny` lines."
h7.hint.night.1: "`flows --src 10.24.0.52`: one address in 198.51.100 on port 443 (the usual one), another on port 8443 (since 3.02 am)."
h7.hint.night.2: "Type `answer night 198.51.100.94`."
h7.hint.rule.1: "`rule test regles/prise.yml` says which ordinary lines the rule wrongly rings on: the calls to the maker."
h7.hint.rule.2: "What sets tonight apart: the destination is inside the house, so it starts with `10.24.0.`."
h7.hint.rule.3: "Type `echo \"dst|startswith: 10.24.0.\" >> regles/prise.yml`, then `rule test regles/prise.yml`."
h7.hint.fate.1: "No answer is wrong. Type `answer return`, `answer recycle` or `answer guest`."
h7.debrief.title: "The cheapest link"
h7.debrief.lesson: "The cheapest plug in the house sat on the same network as the camera, the hub and the lock, and nothing stopped it talking to them. It was not hacked tonight: it had been waiting since March for an order from elsewhere. You stopped it without knowing its software, because you knew what a plug has no business doing."
h7.debrief.p1: "Judge a connected device before buying it: a maker with a name, an address, and a date until which updates are promised."
h7.debrief.p2: "Devices go on a separate network (guest or IoT), where they see neither the computers nor each other."
h7.debrief.p3: "Detect by normal behaviour: a plug never starts a conversation with the camera. That is sturdier than a list of addresses."
h7.debrief.p4: "Cut as close as possible. Blocking one device in the router beats switching the house off, and holds better than blocking an address."
h7.home.p1: "Before buying a connected device, look for the maker's name and its update promise. If there is neither, do not buy."
h7.home.p2: "Turn on your router's guest network and put the plugs, bulbs, televisions and vacuum cleaners on it."
h7.home.p3: "Once a season, list again the devices connected to your router. What you do not recognise, you block, then you look into it."
h7.home.p4: "Update your devices from their app, and unplug for good the ones their maker no longer supports."
h7.home.p5: "A device you no longer use gets reset and removed from your account before it leaves the house."
