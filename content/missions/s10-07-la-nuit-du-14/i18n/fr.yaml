h7.briefing: "Lundi 14 mai, 3 h 02. Ton poste est resté branché chez les Lemerle, et Ada vient de te réveiller. La prise connectée du bureau, celle que personne n'avait reconnue samedi, ne dort pas. Tu lis le journal de la box depuis ton poste : `soc sources` pour ce que la box enregistre, `soc alerts` pour ce qui sonne, `flows` pour qui parle à qui. La famille dort, et le but est qu'elle continue."
h7.obj.cut: "Couper la prise du reste de la maison"
h7.obj.stop: "Vérifier qu'elle ne passe plus"
h7.obj.night: "Trouver l'adresse qu'elle n'avait jamais appelée"
h7.obj.rule: "Écrire la règle qui aurait sonné"
h7.obj.fate: "Décider du sort de la prise"
h7.file.rule: "# Règle de détection, à essayer avec : rule test regles/prise.yml\n# Une ligne par condition. Champs du journal flow : src, dst, dport, bytes.\n# Modificateurs : |contains, |startswith, |endswith, |gte (au moins).\ntitle: La prise fait autre chose que son travail\nsource: flow\nsrc: 10.24.0.52\n"
h7.file.order: "COMMANDE n° 77-204-1193 - place de marché Grand Bazar\nDate : 2 mars 2029\nVendeur : Maison-Futee-Direct (boutique ouverte en février 2029)\n\n1 x Lot de 2 prises connectées Wi-Fi « SmartPlug », sans marque     6,90 EUR\n    Appli : « Plug Home Easy »\n    Mises à jour : non précisé\n    Notice : une feuille, sans nom de fabricant ni adresse\n    Avis : 4,8 / 5 (212 avis, tous du même mois)\n\nLivraison offerte.\n\n-- note de Karim : la deuxième est encore dans son carton, dans le garage.\n"
h7.contain.plug: "Bloquer la prise dans la box : elle reste allumée, mais elle ne parle plus à personne"
h7.contain.address: "Bloquer dans la box l'adresse 198.51.100.94"
h7.contain.wifi: "Éteindre le Wi-Fi de la maison jusqu'au matin (caméra, hub, serrure et téléphones compris)"
h7.alert.inside: "Un objet ouvre une connexion vers un autre appareil de la maison"
h7.alert.inside.why: "Une prise reçoit des ordres du hub. Elle n'a aucune raison d'aller parler elle-même à la caméra ou à l'imprimante."
h7.alert.outside: "La prise appelle dehors sur un port inhabituel"
h7.alert.outside.why: "D'habitude, elle n'appelle que le service de son fabricant, sur le port 443."
h7.q.night: "Quelle adresse extérieure la prise appelle-t-elle depuis 3 h 02, pour la première fois ?"
h7.q.fate: "Karim, réveillé par le café : « Et la prise, on en fait quoi ? »"
h7.q.fate.return: "La renvoyer au vendeur avec la seconde, et signaler l'annonce."
h7.q.fate.return.why: "Les deux prises quittent la maison, et le signalement peut faire retirer l'annonce pour les acheteurs suivants. La lampe du bureau retrouve son interrupteur."
h7.q.fate.recycle: "La déposer en déchetterie et en acheter une d'une marque suivie."
h7.q.fate.recycle.why: "Elle ne reviendra pas. La nouvelle coûtera trois fois plus cher, avec un nom de fabricant, une adresse et des mises à jour annoncées jusqu'à une date précise."
h7.q.fate.guest: "La garder, mais seule sur le réseau des invités."
h7.q.fate.guest.why: "Sur le réseau des invités, elle ne voit plus ni la caméra ni le hub, et la lampe marche encore. Elle continue pourtant d'appeler qui elle veut dehors, et personne ne corrigera jamais son logiciel."
h7.ada.brief: "Désolée pour l'heure. Je regarde leur box depuis hier soir, et à 3 h 02 la prise `ESP-7C41` (10.24.0.52) a appelé une adresse que je n'avais jamais vue. Regarde avec moi ce que la box enregistre : `soc sources`."
h7.ada.g.cut: "Commence par `soc sources`. Puis regarde ce qui sonne : `soc alerts`, et ce que fait la prise : `flows --src 10.24.0.52`. Ensuite `contain` liste ce que tu peux couper, et `contain isolate prise-bureau` coupe au plus près."
h7.ada.g.cut.standard: "Regarde les alertes et les flux de la prise (10.24.0.52), puis coupe au plus près avec `contain`."
h7.ada.look: "Elle vient d'ouvrir une connexion vers la caméra, puis vers le hub. D'habitude, c'est le hub qui lui parle, jamais l'inverse. Elle fait le tour de la maison."
h7.ada.tablet: "L'imprimante, la tablette. Elle note qui répond et sur quelle porte. Coupe-la maintenant : `contain` te montre les mesures."
h7.ada.second: "Tu as bloqué une adresse, elle en connaît une deuxième : 198.51.100.95. Une liste d'adresses se rallonge plus vite qu'on ne la bloque. C'est la prise qu'il faut couper, pas ses correspondants."
h7.ada.pull: "Elle lit le flux vidéo de la caméra du salon. Deux mégaoctets, et ça monte. Coupe-la."
h7.ada.talk: "Elle parle au hub maintenant, celui qui commande la serrure. Heureusement que tu lui as mis un mot de passe dimanche matin. Coupe la prise, vite."
h7.ada.fail: "Neuf mégaoctets de vidéo du salon sont sortis de la maison. On reprend à 3 h 02 : la prise d'abord, les questions ensuite."
h7.ada.address: "L'adresse 198.51.100.94 est bloquée. C'est propre, ça ne coûte rien à la famille, et ça ne tiendra pas : celui qui pilote des milliers de prises a plus d'une adresse. Continue de regarder."
h7.ada.plug: "La box ne laisse plus rien passer pour la prise. Elle est toujours allumée et la lampe du bureau aussi, mais elle parle dans le vide. Personne ne s'est réveillé."
h7.ada.wifi: "Ça marche, et ça marche pour tout le monde : la caméra, le hub, la serrure et le réveil de Léa viennent de perdre le réseau aussi. À 3 heures du matin ça se défend, mais retiens la différence : on coupe ce qui est malade, pas la maison."
h7.ada.g.stop: "Regarde le journal de la box : `soc logs box flow`. Les lignes `deny` sont les essais de la prise."
h7.ada.g.stop.standard: "Vérifie dans le journal de flux de la box que la prise est refusée."
h7.ada.stopped: "Les lignes `deny` le disent : elle essaie encore, la box refuse. C'est fini pour cette nuit, et il est 3 h 09. Sept minutes, et la seule machine qui a vu quelque chose est la tienne : une box ne prévient personne."
h7.ada.g.night: "Compare ses appels habituels et ceux de cette nuit : `flows --src 10.24.0.52`. D'habitude, elle appelle 198.51.100.20 sur le port 443. Réponds avec `answer night <adresse>`."
h7.ada.g.night.standard: "Dans les flux de la prise, cherche l'adresse extérieure qui n'apparaît qu'à partir de 3 h 02, et réponds avec `answer night`."
h7.ada.night: "198.51.100.94, port 8443. D'habitude, la prise appelle son fabricant, sagement. Cette nuit, elle appelle quelqu'un d'autre, qui lui dit quoi faire. Ce n'est pas la famille Lemerle qui est visée : la même prise fait la même chose cette nuit dans des milliers de maisons. Elle cherche des caméras."
h7.ada.g.rule: "Lis la règle : `cat regles/prise.yml`, essaie-la : `rule test regles/prise.yml`. Elle sonne aussi sur les appels ordinaires au fabricant. Ajoute ce qui distingue cette nuit : `echo \"dst|startswith: 10.24.0.\" >> regles/prise.yml`, puis teste à nouveau. Ou à la main, dans l'éditeur : `edit regles/prise.yml`, puis Ctrl+S."
h7.ada.g.rule.standard: "La règle `regles/prise.yml` sonne trop. Qu'est-ce qu'une prise ne fait jamais dans une maison ? Ajoute cette condition et lance `rule test`. Pour ouvrir le fichier : `edit regles/prise.yml`."
h7.ada.rule: "Voilà la règle : une prise ne commence jamais une conversation avec un autre appareil de la maison. Pas besoin de connaître l'adresse du pilote ni le nom du logiciel, il suffit de savoir ce qu'est le travail normal d'une prise. Ça vaut pour une ampoule, une télévision ou un aspirateur. Il est 6 h 40 et j'entends la cafetière. Lis `maison/commande.txt`, Karim l'a retrouvée."
h7.ada.g.fate: "Lis `maison/commande.txt`, puis réponds à la question de Karim : c'est la famille qui décide, aucune réponse n'est fausse."
h7.ada.fate: "C'est noté au rapport. Regarde le bon de commande encore une fois : pas de marque, pas d'adresse, pas un mot sur les mises à jour, 6,90 euros les deux. Personne n'a fabriqué cette prise pour espionner les Lemerle. Quelqu'un l'a fabriquée le moins cher possible, et quelqu'un d'autre a trouvé la porte restée ouverte."
h7.ada.done: "Un week-end. Une box dont le mot de passe était écrit dessous, une caméra ouverte par un mot de passe de 2027, une ampoule de trop, trois arnaques sur le téléphone d'Odile, une règle de transfert, et une prise à 3,45 euros. Rien de tout ça ne demandait un génie, ni pour l'attaque ni pour la parade. Élise t'a laissé un mot sur la table : « Merci. J'ai compris plus de choses en deux jours qu'en dix ans de notices. » Elle a recopié la liste des appareils au propre et l'a collée sur le frigo. La tienne, de maison, tu la regardes quand ?"
h7.hint.cut.1: "`soc alerts` montre ce qui sonne. `flows --src 10.24.0.52` montre à qui la prise parle."
h7.hint.cut.2: "`contain` liste trois mesures. Bloquer une adresse ne tient pas, éteindre le Wi-Fi coupe toute la maison."
h7.hint.cut.3: "Tape `contain isolate prise-bureau`."
h7.hint.stop.1: "Tape `soc logs box flow` et regarde les lignes `deny`."
h7.hint.night.1: "`flows --src 10.24.0.52` : une adresse en 198.51.100 sur le port 443 (l'habitude), une autre sur le port 8443 (depuis 3 h 02)."
h7.hint.night.2: "Tape `answer night 198.51.100.94`."
h7.hint.rule.1: "`rule test regles/prise.yml` dit sur quelles lignes ordinaires la règle sonne à tort : les appels au fabricant."
h7.hint.rule.2: "Ce qui distingue cette nuit : la destination est dans la maison, donc commence par `10.24.0.`."
h7.hint.rule.3: "Avec l'éditeur : `edit regles/prise.yml`, puis Ctrl+S. Avec une commande : tape `echo \"dst|startswith: 10.24.0.\" >> regles/prise.yml`, puis `rule test regles/prise.yml`."
h7.hint.fate.1: "Aucune réponse n'est fausse. Tape `answer return`, `answer recycle` ou `answer guest`."
h7.debrief.title: "Le maillon le moins cher"
h7.debrief.lesson: "La prise la moins chère de la maison était sur le même réseau que la caméra, le hub et la serrure, et rien ne l'empêchait de leur parler. Elle n'a pas été piratée cette nuit : elle attendait depuis mars un ordre venu d'ailleurs. Tu l'as arrêtée sans connaître son logiciel, parce que tu savais ce qu'une prise n'a pas à faire."
h7.debrief.p1: "Un objet connecté se juge avant l'achat : un fabricant qui a un nom, une adresse, et une date jusqu'à laquelle il promet des mises à jour."
h7.debrief.p2: "Les objets vont sur un réseau à part (invités ou objets), où ils ne voient ni les ordinateurs ni les autres appareils."
h7.debrief.p3: "On détecte par le comportement normal : une prise ne commence jamais une conversation avec la caméra. C'est plus solide qu'une liste d'adresses."
h7.debrief.p4: "On coupe au plus près. Bloquer un appareil dans la box vaut mieux qu'éteindre la maison, et tient mieux que bloquer une adresse."
h7.home.p1: "Avant d'acheter un objet connecté, cherche le nom du fabricant et sa promesse de mises à jour. S'il n'y a ni l'un ni l'autre, n'achète pas."
h7.home.p2: "Active le réseau invités de ta box et mets-y les prises, ampoules, télévisions et aspirateurs."
h7.home.p3: "Refais une fois par saison la liste des appareils connectés à ta box. Ce que tu ne reconnais pas, tu le bloques, puis tu cherches."
h7.home.p4: "Mets à jour les objets depuis leur appli, et débranche pour de bon ceux que le fabricant ne suit plus."
h7.home.p5: "Un objet dont tu ne te sers plus se réinitialise et se retire du compte avant de quitter la maison."
