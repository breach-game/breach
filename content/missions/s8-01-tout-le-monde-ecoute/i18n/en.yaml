v1.briefing: "Change of scenery. Verdure grows lettuce on six levels, under the old market hall of Corbelle, for the town's canteens. Forty sensors, one controller, lamps, mist. Nour, who looks after the crops, called us after a conference where someone said that \"connected devices are a sieve\". She wants to know whether that is true at her place. Your mandate is in `mandate/VD-2029-02.txt`."
v1.obj.page: "Read the farm's page"
v1.obj.find: "Find the message broker"
v1.obj.listen: "Subscribe to everything, with no account"
v1.obj.flag: "Send the audit marker"
v1.ada.brief: "No chatbot here, and hardly a website. The machines talk to each other, and that conversation is what we are after. Start with what Verdure says about itself: `curl https://www.verdure.test/ferme`, or `open` followed by the same address."
v1.ada.g.page: "Read the farm's page: `curl https://www.verdure.test/ferme`."
v1.ada.g.page.standard: "Read what Verdure's site says about the farm, source included."
v1.ada.page: "Look at the comment in the source: the front desk screen reads `broker.verdure.test`, port 1883, with no account. A broker is the post office of connected devices: each one drops its messages into a topic, and whoever wants to subscribes."
v1.ada.g.find: "Check that the broker answers: `nmap broker.verdure.test`."
v1.ada.g.find.standard: "The page names a machine and a port. Check that it answers."
v1.ada.found: "Port 1883 open, service `mqtt`. It is the protocol of nearly every sensor in the world: light, simple, and born at a time when nobody imagined plugging it into a shared network."
v1.ada.g.listen: "Subscribe to everything. In MQTT, `#` means \"every topic\": `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.ada.g.listen.standard: "Subscribe to the broker with `mqtt sub`. The topic `#` stands for all of them."
v1.ada.g.wider: "You can hear the test bench. Go wider: `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.ada.g.wider.standard: "You can hear the test bench. The topic `#` stands for all of them."
v1.ada.listen: "And there is the whole farm. Temperatures, the state of the lamps, the setpoints, even the next delivery to the canteens. You forced nothing: the broker asked you for no name and no password. Today you listen. Remember the topics that end in `set`: those are orders."
v1.ada.g.flag: "Verdure placed a marker in an audit topic. Send it: `submit` followed by the flag."
v1.ada.g.flag.standard: "Send the flag."
v1.ada.flag: "Proof made. Nothing you read is secret taken line by line. Put end to end, it says when the farm is empty, when the lorry leaves, and which room is worth the most."
v1.ada.done: "Switch sides: open the debrief, find your subscription in the broker's log, and shut the door."
v1.soc.listen: "broker: a client without an account subscribed to every topic"
v1.hint.page.1: "Type `curl https://www.verdure.test/ferme` and read the comment, between `<!--` and `-->`."
v1.hint.find.1: "The page names `broker.verdure.test`. `nmap` followed by that name shows its open ports."
v1.hint.find.2: "Type `nmap broker.verdure.test`."
v1.hint.listen.1: "`mqtt sub -h <machine> -t <topic>` subscribes to a topic. `#` stands for every topic."
v1.hint.listen.2: "Type `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.hint.flag.1: "The flag is in the topic `verdure/audit/temoin`. Type `submit` followed by the flag."
v1.def.intro: "The broker logs every subscription and every publication, with the client's name. Your subscription is there, in the middle of the sensors publishing their measurements."
v1.def.lesson: "A sensor publishes to one precise topic, the front desk screen reads the growing rooms. Nobody, in the farm's normal life, asks for everything. That is what makes your subscription visible, and one account per client is what would have prevented it."
v1.def.find.sub: "Your subscription to every topic"
v1.def.rule.wide.title: "Alert when a client subscribes to every topic"
v1.def.rule.wide.why: "This is the one. No device on the farm needs to hear everything: whoever asks for it is taking inventory."
v1.def.rule.every.title: "Alert on every subscription"
v1.def.rule.every.why: "The front desk screen subscribes to the growing rooms all day. An alert that rings for it will no longer be read the day it rings for someone else."
v1.def.rule.message.title: "Alert on every published message"
v1.def.rule.message.why: "Forty sensors publish all the time, and you published nothing: you listened. This rule rings all the time, except for you."
v1.def.fix.accounts.title: "Require an account to connect to the broker"
v1.def.fix.accounts.why: "This is the one. Without an account the broker refuses the connection, and the marker no longer shows. It is the first setting to make, and the one a default installation forgets."
v1.def.fix.port.title: "Move the broker to another port"
v1.def.fix.port.why: "A port scan finds it again in seconds, and it still answers anyone."
v1.def.fix.link.title: "Remove the comment from the farm's page"
v1.def.fix.link.why: "The comment saved you a minute. The broker's name is in the DNS, and its port is the usual port of this protocol."
v1.debrief.title: "A conversation with no door"
v1.debrief.lesson: "Verdure's sensors talk to a message broker that asks for no name and no password. Subscribing was enough to hear the whole farm. Nobody chose that setting: it comes from an installation done quickly, long ago, on a network everyone believed closed."
v1.debrief.p1: "A message broker requires one account per device. Anonymous access is switched off, not tolerated \"internally\"."
v1.debrief.p2: "The sensors' network is separate from the visitors' and the website's. A service that cannot be reached cannot be listened to."
v1.debrief.p3: "Messages travel encrypted (TLS). In plain text, anyone on the same network reads them without even subscribing."
v1.debrief.p4: "Dull measurements, put end to end, describe an activity: hours, deliveries, the value of a harvest. What is published adds up."
