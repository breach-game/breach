v1.briefing: "Changement de décor. Verdure fait pousser des salades sur six étages, sous la vieille halle de Corbelle, pour les cantines de la ville. Quarante capteurs, un automate, des lampes, de la brume. Nour, qui s'occupe des cultures, nous a appelés après une conférence où quelqu'un a dit que « les objets connectés, c'est une passoire ». Elle veut savoir si c'est vrai chez elle. Ton mandat est dans `mandate/VD-2029-02.txt`."
v1.obj.page: "Lire la page de la ferme"
v1.obj.find: "Trouver le courtier de messages"
v1.obj.listen: "S'abonner à tout, sans compte"
v1.obj.flag: "Envoyer le témoin d'audit"
v1.ada.brief: "Ici, pas de chatbot et presque pas de site. Les machines se parlent entre elles, et c'est cette conversation qu'on va chercher. Commence par ce que Verdure dit d'elle-même : `curl https://www.verdure.test/ferme`, ou `open` suivi de la même adresse."
v1.ada.g.page: "Lis la page de la ferme : `curl https://www.verdure.test/ferme`."
v1.ada.g.page.standard: "Lis ce que le site de Verdure dit de la ferme, source comprise."
v1.ada.page: "Regarde le commentaire dans la source : l'écran de l'accueil lit `broker.verdure.test`, port 1883, sans compte. Un courtier, « broker », c'est le bureau de poste des objets connectés : chacun y dépose ses messages dans un sujet, et qui veut s'y abonne."
v1.ada.g.find: "Vérifie que le courtier répond : `nmap broker.verdure.test`."
v1.ada.g.find.standard: "La page nomme une machine et un port. Vérifie qu'elle répond."
v1.ada.found: "Port 1883 ouvert, service `mqtt`. C'est le protocole de presque tous les capteurs du monde : léger, simple, et né à une époque où personne n'imaginait le brancher sur un réseau partagé."
v1.ada.g.listen: "Abonne-toi à tout. Dans MQTT, `#` veut dire « tous les sujets » : `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.ada.g.listen.standard: "Abonne-toi au courtier avec `mqtt sub`. Le sujet `#` vaut pour tous."
v1.ada.g.wider: "Tu entends le banc d'essai. Élargis : `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.ada.g.wider.standard: "Tu entends le banc d'essai. Le sujet `#` vaut pour tous."
v1.ada.g.wider2: "Tu entends les serres, comme l'écran de l'accueil. Le témoin n'y est pas : élargis à tous les sujets, `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.ada.g.wider2.standard: "Tu entends les serres, comme l'écran de l'accueil. Le témoin n'y est pas : élargis à tous les sujets."
v1.ada.listen: "Et voilà toute la ferme. Les températures, l'état des lampes, les consignes, et même la prochaine livraison aux cantines. Tu n'as rien forcé : le courtier ne t'a demandé ni nom ni mot de passe. Aujourd'hui tu écoutes. Les sujets en `state` disent l'état ; leurs jumeaux en `set` donnent les ordres."
v1.ada.g.flag: "Verdure a posé un témoin dans un sujet d'audit. Envoie-le : `submit` suivi du flag."
v1.ada.g.flag.standard: "Envoie le flag."
v1.ada.flag: "Preuve faite. Ce que tu as lu n'a rien de secret pris ligne par ligne. Mis bout à bout, ça dit quand la ferme est vide, quand le camion part, et quelle serre vaut le plus cher."
v1.ada.done: "Passe de l'autre côté : ouvre le débrief, retrouve ton abonnement dans le journal du courtier, et ferme la porte."
v1.soc.listen: "broker: a client without an account subscribed to every topic"
v1.hint.page.1: "Tape `curl https://www.verdure.test/ferme` et lis le commentaire, entre `<!--` et `-->`."
v1.hint.find.1: "La page nomme `broker.verdure.test`. `nmap` suivi de ce nom montre ses ports ouverts."
v1.hint.find.2: "Tape `nmap broker.verdure.test`."
v1.hint.listen.1: "`mqtt sub -h <machine> -t <sujet>` s'abonne à un sujet. `#` vaut pour tous les sujets."
v1.hint.listen.2: "Tape `mqtt sub -h broker.verdure.test -t \"#\"`."
v1.hint.flag.1: "Le flag est dans le sujet `verdure/audit/temoin`. Tape `submit` suivi du flag."
v1.def.intro: "Le courtier journalise chaque abonnement et chaque publication, avec le nom du client. Ton abonnement y est, au milieu des capteurs qui publient leurs mesures."
v1.def.lesson: "Un capteur publie sur un sujet précis, l'écran de l'accueil lit les serres. Personne, dans la vie normale de la ferme, ne demande tout. C'est ce qui rend ton abonnement visible, et c'est un compte par client qui l'aurait empêché."
v1.def.find.sub: "Ton abonnement à tous les sujets"
v1.def.rule.wide.title: "Alerter quand un client s'abonne à tous les sujets"
v1.def.rule.wide.why: "C'est la bonne. Aucun appareil de la ferme n'a besoin de tout entendre : celui qui le demande est en train de faire l'inventaire."
v1.def.rule.every.title: "Alerter sur chaque abonnement"
v1.def.rule.every.why: "L'écran de l'accueil s'abonne aux serres toute la journée. Une alerte qui sonne pour lui ne sera plus lue le jour où elle sonnera pour un autre."
v1.def.rule.message.title: "Alerter sur chaque message publié"
v1.def.rule.message.why: "Quarante capteurs publient en continu, et toi, tu n'as rien publié : tu as écouté. Cette règle sonne tout le temps, sauf pour toi."
v1.def.fix.accounts.title: "Exiger un compte pour se connecter au courtier"
v1.def.fix.accounts.why: "C'est la bonne. Sans compte, le courtier refuse la connexion, et le témoin n'apparaît plus. C'est le premier réglage à faire, et celui que l'installation par défaut oublie."
v1.def.fix.port.title: "Déplacer le courtier sur un autre port"
v1.def.fix.port.why: "Un balayage de ports le retrouve en quelques secondes, et il répond toujours à qui veut."
v1.def.fix.link.title: "Retirer le commentaire de la page de la ferme"
v1.def.fix.link.why: "Le commentaire t'a fait gagner une minute. Le nom du courtier est dans le DNS, et son port est le port habituel de ce protocole."
v1.debrief.title: "Une conversation sans porte"
v1.debrief.lesson: "Les capteurs de Verdure parlent à un courtier de messages qui ne demande ni nom ni mot de passe. Il a suffi de s'y abonner pour entendre toute la ferme. Personne n'a choisi ce réglage : c'est celui d'une installation faite vite, il y a longtemps, sur un réseau qu'on croyait fermé."
v1.debrief.p1: "Un courtier de messages exige un compte par appareil. L'accès anonyme se désactive, il ne se tolère pas « en interne »."
v1.debrief.p2: "Le réseau des capteurs est séparé de celui des visiteurs et du site. Un service qu'on ne peut pas joindre ne peut pas être écouté."
v1.debrief.p3: "Les messages circulent chiffrés (TLS). En clair, quiconque est sur le même réseau les lit sans même s'abonner."
v1.debrief.p4: "Des mesures banales, mises bout à bout, décrivent une activité : horaires, livraisons, valeur des récoltes. Ce qui est publié s'additionne."
