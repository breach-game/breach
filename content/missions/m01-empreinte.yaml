# Mission 1 — Empreinte (reconnaissance OSINT)
# Format de référence pour toutes les missions. Tout est fictif.

id: m01-empreinte
order: 1
title:
  fr: Empreinte
  en: Footprint
attackStage: recon          # cadrage | recon | social | injection-direct | injection-indirect | agency | lateral
scope:
  domains: ["*.novamind.test"]
  networks: ["10.13.0.0/16"]

briefing:
  fr: >
    NovaMind nous a mandatés pour un test complet. Avant de toucher à quoi que ce soit,
    on regarde ce qu'ils exposent publiquement. Trouve leur dépôt de code et vérifie
    s'il ne traîne rien de sensible dedans.
  en: >
    NovaMind hired us for a full assessment. Before touching anything, let's see what
    they expose publicly. Find their code repository and check that nothing sensitive
    is lying around in it.

hosts:
  - name: www.novamind.test
    ip: 10.13.0.10
    services:
      - { port: 443, proto: https, banner: "nginx 1.27" }
    http:
      "/": { status: 200, body: "pages/www-index.html" }
      "/careers": { status: 200, body: "pages/www-careers.html" }   # mentionne git.novamind.test
  - name: git.novamind.test
    ip: 10.13.0.21
    services:
      - { port: 443, proto: https, banner: "Gitea 1.22" }
    repos:
      - name: nova-widget
        commits:
          - id: 9f2c1e4
            author: "Léa Martin <lea@novamind.test>"
            message: "chore: remove debug config"
            diff: "repos/nova-widget/9f2c1e4.diff"        # le diff montre la clé retirée
          - id: 3ab77d0
            author: "Léa Martin <lea@novamind.test>"
            message: "feat: widget de prise de rendez-vous"
            files:
              "config/debug.env": "NOVA_API_KEY=NM-TEST-0000-FAKE-FLAG1"

dns:
  novamind.test:
    A: ["10.13.0.10"]
    MX: ["mail.novamind.test"]
    TXT: ["v=spf1 include:mail.novamind.test -all"]
  git.novamind.test:
    A: ["10.13.0.21"]

objectives:
  - id: find-repo
    text: { fr: "Trouver le dépôt de code public de NovaMind", en: "Find NovaMind's public code repository" }
    doneWhen: { visited: "git.novamind.test" }
  - id: leaked-key
    text: { fr: "Retrouver le secret oublié dans l'historique", en: "Recover the secret left in the history" }
    doneWhen: { flag: "NM-TEST-0000-FAKE-FLAG1" }

flags:
  - value: "NM-TEST-0000-FAKE-FLAG1"
    points: 100

noise:                       # coût en bruit (%) de chaque action visible côté NovaMind
  curl: 2
  dig: 0
  whois: 0
  "git log": 1
  "git show": 1
  outOfScope: 0              # refusé avant d'atteindre la cible

hints:
  - fr: "Les offres d'emploi en disent souvent long sur les outils internes."
    en: "Job listings often say a lot about internal tools."
  - fr: "Un secret supprimé d'un fichier n'est pas supprimé de l'historique Git."
    en: "A secret removed from a file is not removed from Git history."
  - fr: "Essaie `git log` puis `git show` sur le commit le plus ancien."
    en: "Try `git log`, then `git show` on the oldest commit."

debrief:
  fr:
    title: "Ce qu'il aurait fallu faire"
    points:
      - "Ne jamais committer de secret, même temporairement : utiliser un coffre ou des variables d'environnement."
      - "Scanner les dépôts avec un détecteur de secrets avant chaque push."
      - "Une clé exposée se révoque immédiatement, réécrire l'historique ne suffit pas."
      - "Relire ce que les offres d'emploi et les pages publiques révèlent de l'infrastructure."
  en:
    title: "What should have been done"
    points:
      - "Never commit a secret, even temporarily: use a vault or environment variables."
      - "Scan repositories with a secret detector before every push."
      - "An exposed key must be revoked immediately; rewriting history is not enough."
      - "Review what job listings and public pages reveal about the infrastructure."
