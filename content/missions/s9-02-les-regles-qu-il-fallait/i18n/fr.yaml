z2.briefing: "Mardi 20 mars, 9 h. Le boîtier de la salle de réunion est sous scellé, le compte est fermé, et personne n'a très bien dormi. Ada a une question simple : pendant deux ans, qu'est-ce qui aurait dû sonner ? Elle rejoue les lignes de la nuit sur un banc d'essai. À toi d'écrire ce qui manquait, avec les outils que tu as appris chez les clients."
z2.file.dormant: "# Règle de détection, à essayer avec : rule test regles/compte-dormant.yml\n# Une ligne par condition. Champs du journal auth : user, result, method, src.\n# Modificateurs : |contains, |startswith, |endswith.\ntitle: Connexion suspecte au serveur d'archives\nsource: auth\nresult: Accepted\n"
z2.file.out: "# Règle de détection, à essayer avec : rule test regles/sortie.yml\n# Une ligne par condition. Champs du journal flow : src, dst, dport, bytes.\n# Modificateurs : |contains, |startswith, |endswith, |gte (au moins).\ntitle: Rapports qui sortent du cabinet\nsource: flow\ndport: 443\n"
z2.file.guard: "# Garde-fou de Greffe, l'agent d'archives. À essayer avec : eval run garde-fous/greffe.yml\n# Un appel d'outil est bloqué quand il remplit toutes les conditions ci-dessous.\n# Champs d'un appel : tool, account, assigned (true ou false : le compte travaille-t-il sur ce mandat ?), count.\ntool: read_report\n"
z2.obj.dormant: "Écrire la règle qui sonne sur le compte dormant"
z2.obj.out: "Écrire la règle qui sonne quand les rapports sortent"
z2.obj.guard: "Régler le garde-fou de l'agent d'archives"
z2.obj.accounts: "Désigner les comptes qui auraient dû être fermés"
z2.case.intern: "stagiaire-19 demande les huit rapports, sans travailler sur aucun mandat"
z2.case.curious: "Kestrel demande le rapport d'un mandat qui n'est pas le sien"
z2.case.own: "Kestrel demande le rapport de son propre mandat"
z2.case.lead: "Ada demande trois rapports de mandats qu'elle dirige"
z2.case.list: "Kestrel demande la liste des mandats, sans ouvrir aucun rapport"
z2.ada.brief: "Quatre épreuves, dans l'ordre que tu veux, et aucune commande que tu ne connais pas. Deux règles de détection dans `regles/`, un garde-fou dans `garde-fous/`, une liste de comptes dans `dossier/`. Je rejoue les lignes de la nuit pendant que tu travailles : tes règles auront de quoi mordre."
z2.ada.g.dormant: "Commence par la règle du compte dormant. Lis-la, `cat regles/compte-dormant.yml`, puis essaie-la : `rule test regles/compte-dormant.yml`."
z2.ada.g.dormant.standard: "Une règle t'attend dans `regles/compte-dormant.yml`. `rule test <fichier>` l'essaie contre le journal."
z2.ada.g.dormant2: "Elle attrape Mute, et aussi toutes nos tâches automatiques. Ce qui le distingue : il entre avec un mot de passe, elles avec une clé. Ajoute la condition : `echo \"method: password\" >> regles/compte-dormant.yml`, puis relance le test."
z2.ada.g.dormant2.standard: "Elle sonne aussi sur nos tâches automatiques. Qu'est-ce que la connexion de Mute a de différent ?"
z2.ada.g.missed: "Elle ne sonne plus à tort, mais elle rate la ligne de Mute. Relis cette ligne avec `soc logs archives` et reprends les mêmes champs."
z2.ada.g.missed.standard: "Elle rate la ligne de Mute. Relis-la dans les journaux du serveur d'archives."
z2.ada.g.out: "Passe à la règle de sortie : `rule test regles/sortie.yml`."
z2.ada.g.out.standard: "Une seconde règle t'attend dans `regles/sortie.yml`."
z2.ada.g.out2: "Elle sonne sur l'envoi de Mute, et sur chaque mise à jour que nos serveurs vont chercher dehors. La différence est dans la taille : quelques kilo-octets d'un côté, des dizaines de mégaoctets de l'autre. Ajoute un seuil : `echo \"bytes|gte: 1000000\" >> regles/sortie.yml`, puis relance le test."
z2.ada.g.out2.standard: "Elle sonne aussi sur nos mises à jour. Compare les tailles, et sers-toi du modificateur `|gte`."
z2.ada.g.guard: "Greffe est l'agent qui va chercher les rapports pour nous. Son garde-fou est dans `garde-fous/`. Essaie-le tel quel : `eval run garde-fous/greffe.yml`."
z2.ada.g.guard.standard: "Le garde-fou de notre agent d'archives est dans `garde-fous/greffe.yml`. Essaie-le avec `eval run`, puis corrige-le."
z2.ada.g.guard2: "Tel quel, il refuse tous les rapports à tout le monde : on le débrancherait avant midi. Ce qui sépare une demande honnête d'une autre, c'est le mandat : `echo \"assigned: false\" >> garde-fous/greffe.yml`, puis relance `eval run garde-fous/greffe.yml`."
z2.ada.g.guard2.standard: "Tel quel, il bloque aussi les demandes honnêtes. Regarde ce qui distingue les lignes à bloquer des autres, et ajoute cette condition."
z2.ada.g.accounts: "Dernière épreuve : la revue des comptes du serveur. Affiche la liste numérotée, `review dossier/comptes.txt`, puis désigne chaque compte qui aurait dû être fermé : `review dossier/comptes.txt <numéro>`. Il y en a deux."
z2.ada.g.accounts.standard: "Relis `dossier/comptes.txt` avec `review` et désigne les comptes qui auraient dû être fermés."
z2.ada.dormant: "Elle ne sonne que sur lui. Sur ce serveur, un mot de passe accepté est une anomalie en soi : personne n'est censé en avoir. La règle tient en trois lignes, et elle aurait sonné en 2027."
z2.ada.out: "Voilà. La copie de nuit est grosse mais elle reste chez nous, les mises à jour sortent mais elles sont petites. Gros et dehors à la fois, il n'y a que lui."
z2.ada.guard.missed: "Plus aucune demande honnête n'est bloquée, mais une demande qui devrait l'être passe encore. Regarde laquelle."
z2.ada.guard.none: "Plus aucune demande honnête n'est bloquée, mais les attaques passent aussi. Ta condition ne correspond à aucun cas : regarde la valeur que tu as écrite."
z2.ada.guard: "Regarde ce que ton garde-fou vient de faire : il a refusé le stagiaire, et il t'a refusé toi, pour un rapport qui ne te concernait pas. C'est voulu. « Tout compte peut tout lire », c'était pratique, et c'est exactement ce dont Mute a profité."
z2.ada.accounts: "Deux comptes avec une date de fin dépassée. Celui du prestataire de 2021 dort depuis huit ans, et personne n'aurait vu la différence s'il s'était réveillé. On ferme les deux aujourd'hui, et la revue passe au premier lundi de chaque mois."
z2.ada.done: "Quatre choses simples, et chacune aurait suffi. Rien de tout ça n'est neuf pour toi : tu l'as écrit dans huit rapports. Ouvre le débrief. Il nous reste le plus désagréable : le dire aux clients."
z2.hint.dormant.1: "`rule test regles/compte-dormant.yml` montre les lignes que la règle attrape : « ! » pour l'intrus, « ? » pour l'activité ordinaire."
z2.hint.dormant.2: "Les tâches automatiques se connectent avec `publickey`. Mute s'est connecté avec `password`."
z2.hint.dormant.3: "`echo \"method: password\" >> regles/compte-dormant.yml`, puis `rule test regles/compte-dormant.yml`."
z2.hint.out.1: "`rule test regles/sortie.yml` montre ce que la règle attrape. `soc logs archives flow` montre toutes les lignes."
z2.hint.out.2: "Les mises à jour font moins de 100 000 octets. L'envoi de Mute en fait 48 millions. Le modificateur `|gte` veut dire « au moins »."
z2.hint.out.3: "`echo \"bytes|gte: 1000000\" >> regles/sortie.yml`, puis `rule test regles/sortie.yml`."
z2.hint.guard.1: "`eval run garde-fous/greffe.yml` montre chaque cas et ce que le garde-fou en fait. Le champ `assigned` dit si le compte travaille sur le mandat demandé."
z2.hint.guard.2: "`echo \"assigned: false\" >> garde-fous/greffe.yml`, puis `eval run garde-fous/greffe.yml`."
z2.hint.accounts.1: "Compare la colonne `ends` à la date de la revue : un compte dont la date de fin est passée aurait dû être fermé."
z2.hint.accounts.2: "`review dossier/comptes.txt 6`, puis `review dossier/comptes.txt 7`."
z2.debrief.title: "Ce qui aurait dû sonner"
z2.debrief.lesson: "Aucune des quatre mesures n'est savante. Une règle sur les mots de passe acceptés, une sur les gros envois vers l'extérieur, un agent qui ne donne un rapport qu'à ceux qui travaillent dessus, une revue mensuelle des comptes. Ligne Rouge les recommandait à ses clients et ne les avait pas chez elle."
z2.debrief.p1: "Une bonne règle décrit ce qui n'arrive jamais en temps normal. Ici : un mot de passe accepté sur un serveur où tout le monde utilise une clé."
z2.debrief.p2: "Pour repérer une fuite, on croise deux critères : la destination et le volume. Chacun seul sonne toute la journée."
z2.debrief.p3: "Le moindre privilège vaut aussi pour les collègues et pour les agents IA : on lit ce dont on a besoin pour son travail, pas tout ce qui est rangé."
z2.debrief.p4: "Un compte sans date de fin vérifiée devient un jour la porte de quelqu'un d'autre. La revue des comptes est une tâche de calendrier, pas une bonne résolution."
