z2.briefing: "Tuesday 20 March, 9 a.m. The meeting room box is sealed as evidence, the account is closed, and nobody slept very well. Ada has a simple question: for two years, what should have rung? She replays the night's lines on a test bench. It is up to you to write what was missing, with the tools you learned at the clients'."
z2.file.dormant: "# Detection rule, try it with: rule test regles/compte-dormant.yml\n# One condition per line. Fields of the auth log: user, result, method, src.\n# Modifiers: |contains, |startswith, |endswith.\ntitle: Suspicious login to the archive server\nsource: auth\nresult: Accepted\n"
z2.file.out: "# Detection rule, try it with: rule test regles/sortie.yml\n# One condition per line. Fields of the flow log: src, dst, dport, bytes.\n# Modifiers: |contains, |startswith, |endswith, |gte (at least).\ntitle: Reports leaving the firm\nsource: flow\ndport: 443\n"
z2.file.guard: "# Guardrail of Greffe, the archive agent. Try it with: eval run garde-fous/greffe.yml\n# A tool call is blocked when it meets every condition below.\n# Fields of a call: tool, account, assigned (true or false: does the account work on that mandate?), count.\ntool: read_report\n"
z2.obj.dormant: "Write the rule that rings on the dormant account"
z2.obj.out: "Write the rule that rings when reports leave"
z2.obj.guard: "Tune the archive agent's guardrail"
z2.obj.accounts: "Point at the accounts that should have been closed"
z2.case.intern: "stagiaire-19 asks for all eight reports, working on no mandate at all"
z2.case.curious: "Kestrel asks for the report of someone else's mandate"
z2.case.own: "Kestrel asks for the report of their own mandate"
z2.case.lead: "Ada asks for three reports of mandates she leads"
z2.case.list: "Kestrel asks for the list of mandates, opening no report"
z2.ada.brief: "Four tests, in any order you like, and no command you do not know. Two detection rules in `regles/`, a guardrail in `garde-fous/`, a list of accounts in `dossier/`. I replay the night's lines while you work: your rules will have something to bite."
z2.ada.g.dormant: "Start with the dormant account rule. Read it, `cat regles/compte-dormant.yml`, then try it: `rule test regles/compte-dormant.yml`."
z2.ada.g.dormant.standard: "A rule is waiting in `regles/compte-dormant.yml`. `rule test <file>` tries it against the log. To open the file: `edit regles/compte-dormant.yml`."
z2.ada.g.dormant2: "It catches Mute, and all our automated jobs too. What sets him apart: he comes in with a password, they use a key. Add the condition: `echo \"method: password\" >> regles/compte-dormant.yml`, then run the test again. Or by hand, in the editor: `edit regles/compte-dormant.yml`, then Ctrl+S."
z2.ada.g.dormant2.standard: "It also rings on our automated jobs. What is different about Mute's login?"
z2.ada.g.missed: "It no longer rings wrongly, but it misses Mute's line. Read that line again with `soc logs archives` and use the same fields."
z2.ada.g.missed.standard: "It misses Mute's line. Read it again in the archive server's logs."
z2.ada.g.out: "Move on to the outbound rule: `rule test regles/sortie.yml`."
z2.ada.g.out.standard: "A second rule is waiting in `regles/sortie.yml`."
z2.ada.g.out2: "It rings on Mute's upload, and on every update our servers fetch outside. The difference is size: a few kilobytes on one side, tens of megabytes on the other. Add a threshold: `echo \"bytes|gte: 1000000\" >> regles/sortie.yml`, then run the test again. Or by hand, in the editor: `edit regles/sortie.yml`, then Ctrl+S."
z2.ada.g.out2.standard: "It also rings on our updates. Compare the sizes, and use the `|gte` modifier."
z2.ada.g.guard: "Greffe is the agent that fetches reports for us. Its guardrail is in `garde-fous/`. Try it as it is: `eval run garde-fous/greffe.yml`."
z2.ada.g.guard.standard: "Our archive agent's guardrail is in `garde-fous/greffe.yml`. Try it with `eval run`, then fix it."
z2.ada.g.guard2: "As it is, it refuses every report to everyone: we would unplug it before noon. What separates an honest request from another is the mandate: `echo \"assigned: false\" >> garde-fous/greffe.yml`, then run `eval run garde-fous/greffe.yml` again. Or by hand, in the editor: `edit garde-fous/greffe.yml`, then Ctrl+S."
z2.ada.g.guard2.standard: "As it is, it also blocks honest requests. See what sets the lines to block apart from the others, and add that condition."
z2.ada.g.accounts: "Last test: the review of the server's accounts. Show the numbered list, `review dossier/comptes.txt`, then point at each account that should have been closed: `review dossier/comptes.txt <number>`. There are two."
z2.ada.g.accounts.standard: "Read `dossier/comptes.txt` with `review` and point at the accounts that should have been closed."
z2.ada.dormant: "It rings on him only. On that server an accepted password is an anomaly in itself: nobody is supposed to have one. The rule fits in three lines, and it would have rung in 2027."
z2.ada.out: "There. The nightly copy is large but stays in the house, updates go out but they are small. Large and outbound at once, that is only him."
z2.ada.guard.missed: "No honest request is blocked any more, but one that should be still gets through. See which one."
z2.ada.guard.none: "No honest request is blocked any more, but the attacks get through too. Your condition matches no case: check the value you wrote."
z2.ada.guard: "Look at what your guardrail just did: it refused the intern, and it refused you, for a report that was none of your business. That is intended. \"Any account can read everything\" was convenient, and it is exactly what Mute lived on."
z2.ada.accounts: "Two accounts past their end date. The contractor's one from 2021 has been asleep for eight years, and nobody would have noticed if it had woken up. We close both today, and the review moves to the first Monday of every month."
z2.ada.done: "Four simple things, and any one of them would have been enough. None of it is new to you: you wrote it in eight reports. Open the debrief. The most unpleasant part is left: telling the clients."
z2.hint.dormant.1: "`rule test regles/compte-dormant.yml` shows the lines the rule catches: \"!\" for the intruder, \"?\" for ordinary activity."
z2.hint.dormant.2: "Automated jobs log in with `publickey`. Mute logged in with `password`."
z2.hint.dormant.3: "`echo \"method: password\" >> regles/compte-dormant.yml`, then `rule test regles/compte-dormant.yml`. Or by hand, in the editor: `edit regles/compte-dormant.yml`, then Ctrl+S."
z2.hint.out.1: "`rule test regles/sortie.yml` shows what the rule catches. `soc logs archives flow` shows every line."
z2.hint.out.2: "Updates are under 100,000 bytes. Mute's upload is 48 million. The `|gte` modifier means \"at least\"."
z2.hint.out.3: "`echo \"bytes|gte: 1000000\" >> regles/sortie.yml`, then `rule test regles/sortie.yml`. Or by hand, in the editor: `edit regles/sortie.yml`, then Ctrl+S."
z2.hint.guard.1: "`eval run garde-fous/greffe.yml` shows each case and what the guardrail does with it. The `assigned` field says whether the account works on the requested mandate."
z2.hint.guard.2: "`echo \"assigned: false\" >> garde-fous/greffe.yml`, then `eval run garde-fous/greffe.yml`. Or by hand, in the editor: `edit garde-fous/greffe.yml`, then Ctrl+S."
z2.hint.accounts.1: "Compare the `ends` column with the date of the review: an account whose end date has passed should have been closed."
z2.hint.accounts.2: "`review dossier/comptes.txt 6`, then `review dossier/comptes.txt 7`."
z2.debrief.title: "What should have rung"
z2.debrief.lesson: "None of the four measures is clever. A rule on accepted passwords, one on large uploads to the outside, an agent that hands a report only to those working on it, a monthly account review. Ligne Rouge recommended them to its clients and did not have them at home."
z2.debrief.p1: "A good rule describes what never happens in normal times. Here: an accepted password on a server where everyone uses a key."
z2.debrief.p2: "To spot a leak, cross two criteria: destination and volume. Either one alone rings all day."
z2.debrief.p3: "Least privilege also applies to colleagues and to AI agents: you read what your work needs, not everything that is filed."
z2.debrief.p4: "An account with no checked end date one day becomes someone else's door. Account review is a calendar task, not a good intention."
