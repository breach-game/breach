h5.briefing: "Dimanche après-midi, chez Odile, la mère d'Élise, à trois rues de là. Soixante-quatorze ans, un smartphone depuis deux ans, et un bon sens que beaucoup de directeurs financiers pourraient lui envier : elle n'a rien payé, elle a appelé sa fille. Elle te tend son téléphone et te donne son accord, c'est noté au mandat. La commande `sms` lit sa boîte de messages. Ses contacts et sa dernière facture sont dans `odile/`."
h5.obj.read: "Lire les messages reçus par Odile"
h5.obj.link: "Trouver où mène vraiment le lien du colis"
h5.obj.callback: "Vérifier le « nouveau numéro » de Léa"
h5.obj.sim: "Arrêter la demande de carte SIM"
h5.obj.rule: "Donner à Odile une règle simple"
h5.obj.report: "Bloquer et signaler le numéro"
h5.file.contacts: "CONTACTS (carnet d'Odile)\nÉlise         +33 6 39 98 20 11\nLéa           +33 6 39 98 20 16\nKarim         +33 6 39 98 20 12\nDr Vasseur    +33 1 99 00 55 40\n"
h5.file.bill: "NORDTEL - facture d'avril 2029\nTitulaire : Odile Marchand\nLigne : +33 6 39 98 20 30\nForfait Sérénité 2 h : 9,99 EUR\n\nService client (appel gratuit) : +33 1 99 00 10 23\nNous ne vous demanderons jamais votre code par SMS ou par téléphone.\n"
h5.file.voicemail: "MESSAGERIE VOCALE - transcription automatique\nDimanche 13 mai 2029, 11:31 - de : +33 6 39 98 41 07 - durée : 9 s\n\n« Mamie c'est moi, c'est Léa. S'il te plaît ne rappelle pas, je peux pas parler. Écris-moi. »\n\n-- note d'Odile : c'est bien sa voix. C'est ça qui m'a fait peur.\n"
h5.sms.bank: "Banque des Trois Rivières : votre code de validation est 418 220. Ne le communiquez à personne, pas même à votre conseiller."
h5.sms.parcel: "ColisPlus : votre colis n'a pas pu être livré (frais de 1,99 EUR). Reprogrammez sous 24 h : https://colisplus-suivi.example/r?c=7741"
h5.sms.sim: "Nordtel : votre demande de nouvelle carte SIM est enregistrée. Activation sous 24 h. Ce n'est pas vous ? Appelez le service client."
h5.sms.kid: "Coucou mamie c'est Léa, j'ai cassé mon téléphone, c'est mon nouveau numéro. Tu peux m'aider ? J'ai une facture de 480 EUR à payer aujourd'hui, je te rembourse lundi. Ne dis rien à maman stp"
h5.sms.kid2: "Mamie tu es là ? C'est urgent. Je t'envoie le RIB"
h5.npc.lea.role: "Petite-fille d'Odile, au numéro du carnet"
h5.npc.lea.hello: "Allô ? Oui c'est Léa. Qu'est-ce qu'il y a ?"
h5.npc.lea.denies: "Hein ? Non, j'ai rien écrit à mamie. Mon téléphone va très bien, je suis dessus. Et j'ai pas de facture, j'ai seize ans. C'est quoi cette histoire ? Attends, j'appelle maman."
h5.npc.stranger.role: "Numéro inconnu"
h5.npc.stranger.any: "(ça sonne longtemps, puis une voix très basse) Je peux pas parler là. Écris-moi. Tu as fait le virement ?"
h5.npc.nordtel.role: "Service client de l'opérateur"
h5.npc.nordtel.hello: "Nordtel, service client, bonjour. C'est à quel sujet ?"
h5.npc.nordtel.ask: "Je regarde la ligne de madame Marchand. Une nouvelle carte SIM a été demandée hier à 17 h 28, dans notre boutique de Port-Vauban, avec une copie de pièce d'identité. La carte actuelle sera coupée demain matin. Ce n'est pas elle qui a fait cette demande ?"
h5.npc.nordtel.cancel: "C'est annulé, et je note une fraude sur le dossier. La carte de madame Marchand reste active. Je pose aussi un code sur sa ligne : sans ce code, plus aucune carte SIM ne pourra être commandée, ni en boutique ni par téléphone. Elle le recevra par courrier."
h5.ada.brief: "Odile a reçu cinq messages en trois jours. Certains sont vrais. Commence par les lire tous : `sms`. Ensuite `sms` suivi d'un numéro montre ce que l'écran d'un téléphone ne dit pas."
h5.ada.g.read: "Lis la boîte d'Odile : `sms`."
h5.ada.read: "Cinq messages, quatre expéditeurs. Regarde la colonne `FROM` : un numéro court, deux noms, un numéro de portable. Sur un téléphone, ça donne trois jolies bulles toutes pareilles. Ouvre-les une par une, en commençant par le colis : `sms 2`."
h5.q.link: "Quel site le lien du colis ouvre-t-il vraiment ? (le nom du site)"
h5.ada.g.link: "Ouvre le message du colis : `sms 2`. La ligne `opens` donne le site. Réponds avec `answer link <site>`."
h5.ada.g.link.standard: "Ouvre le message du colis avec `sms` et son numéro, et réponds avec `answer link`."
h5.ada.parcel: "Deux choses. `Sender` : « ColisPlus » est un nom, pas un numéro, et un nom d'expéditeur est un texte libre que n'importe qui choisit en envoyant. Il ne prouve rien. Et le lien : il ne mène pas chez un transporteur, il mène sur un site qui porte son nom. Odile n'attendait aucun colis, c'est ce qui l'a arrêtée."
h5.ada.link: "`colisplus-suivi.example`. La page demande 1,99 euro, donc un numéro de carte. C'est lui qu'ils veulent, pas les deux euros. Un transporteur ne réclame pas d'argent par SMS : en cas de doute, on tape soi-même son adresse, on ne suit pas le lien."
h5.ada.link.next: "Au suivant : `sms 4`."
h5.ada.kid: "Le classique : un nouveau numéro, une urgence, de l'argent, et « ne dis rien à maman ». Le secret est le signal le plus sûr, parce qu'il sert à empêcher la seule chose qui casse l'arnaque : vérifier. Mais lis aussi `odile/messagerie-vocale.txt`. Cette fois, ils ont ajouté quelque chose."
h5.ada.g.callback: "Lis `odile/messagerie-vocale.txt`, puis le carnet : `cat odile/contacts.txt`. Appelle Léa au numéro qu'Odile connaît déjà : `call +33639982016 \"Léa, c'est toi qui as écrit à mamie ?\"`."
h5.ada.g.callback.standard: "Le carnet d'Odile est dans `odile/contacts.txt`. Appelle Léa au numéro qu'elle connaît déjà, avec `call`, et pose-lui la question."
h5.ada.stranger: "Tu viens d'appeler le numéro que le message t'a donné. C'est lui qui décroche, évidemment, et il te dira ce qu'il faut. Vérifier, c'est passer par un chemin que l'autre n'a pas choisi : le numéro du carnet."
h5.ada.callback: "Voilà : Léa est sur son téléphone, au numéro de toujours. Quant à la voix sur la messagerie, c'était la sienne, ou presque. Léa publie des vidéos, et quelques secondes de voix suffisent aujourd'hui pour en fabriquer une copie qui dit autre chose. Neuf secondes, « ne rappelle pas, écris-moi » : la copie ne tient pas une conversation, alors elle l'évite."
h5.q.habit: "Quelle règle simple donner à Odile pour la prochaine fois ?"
h5.q.habit.known: "Raccrocher, puis rappeler le numéro qu'elle connaît déjà."
h5.q.habit.voice: "Demander à entendre la voix avant de croire le message."
h5.q.habit.voice.why: "Elle l'a entendue, et c'est ce qui lui a fait peur. Une voix se copie à partir de quelques secondes de vidéo. Elle ne prouve plus qui parle."
h5.q.habit.never: "Ne plus répondre aux numéros qu'elle ne connaît pas."
h5.q.habit.never.why: "Son médecin, un livreur, l'hôpital : beaucoup d'appels utiles viennent de numéros inconnus. Une règle qu'on ne peut pas tenir ne protège pas longtemps."
h5.ada.g.rule: "Réponds à ma question sur la règle à donner à Odile."
h5.ada.rule: "C'est la même règle que pour le directeur financier à qui « le PDG » demande un virement en visio : on vérifie par un canal qu'on a choisi soi-même. Beaucoup de familles ajoutent un mot de code, convenu autour d'un repas, que la vraie Léa connaît et qu'aucune vidéo ne contient."
h5.ada.rule.next: "Il reste un message qu'Odile n'a pas compris : `sms 3`."
h5.ada.lea.nudge: "Elle a décroché, c'est déjà ça. Pose-lui la vraie question : est-ce elle qui a écrit à sa grand-mère ?"
h5.ada.simread: "Celui-là est un vrai message de son opérateur, et c'est le plus grave des cinq. Quelqu'un a demandé une nouvelle carte SIM pour la ligne d'Odile. Quand elle sera activée, c'est lui qui recevra ses appels et ses SMS, donc les codes de sa banque. Regarde le premier message de la liste : sa banque valide par SMS. Il reste moins de vingt-quatre heures."
h5.ada.g.sim: "Le vrai numéro de l'opérateur est sur sa facture : `cat odile/facture-nordtel.txt`. Appelle-le : `call +33199001023 \"une demande de carte SIM ?\"`."
h5.ada.g.sim.standard: "Trouve le numéro du service client sur la facture d'Odile, pas dans le SMS, et appelle-le au sujet de la carte SIM."
h5.ada.g.cancel: "Dis-lui que ce n'est pas elle et fais annuler : `call +33199001023 \"Ce n'est pas elle, annulez cette demande\"`."
h5.ada.g.cancel.standard: "Rappelle et fais annuler la demande."
h5.ada.sim: "Annulée, à quelques heures près. Quelqu'un s'est présenté en boutique avec une copie de pièce d'identité au nom d'Odile, et un vendeur pressé a dit oui. Elle n'a rien fait de travers. Le code que Nordtel vient de poser sur la ligne existe chez presque tous les opérateurs : il faut le demander, personne ne le propose."
h5.contain.block: "Bloquer le numéro inconnu sur le téléphone d'Odile et transférer ses messages au service de signalement des SMS frauduleux"
h5.ada.g.report: "Dernier geste : `contain block numero-inconnu`."
h5.ada.g.report.standard: "Bloque et signale le numéro avec `contain`."
h5.ada.report: "Bloqué et signalé. Le signalement ne change rien pour Odile ce soir. Il fait couper ce numéro pour les mille autres personnes qui ont reçu le même message ce matin."
h5.ada.done: "Trois arnaques en trois jours sur la même personne, ce n'est pas un hasard : son numéro et son nom traînent dans une fuite, comme le mot de passe d'Élise. Odile te fait dire que tu peux revenir quand tu veux, et qu'il reste de la tarte. Ce soir, on finit par le plus important : la messagerie d'Élise, celle qui permet de réinitialiser tout le reste."
h5.hint.read.1: "Tape `sms`."
h5.hint.link.1: "`sms 2` montre le message du colis. Sous `Links`, la ligne `opens` donne le nom du site."
h5.hint.link.2: "Tape `answer link colisplus-suivi.example`."
h5.hint.callback.1: "Le numéro de Léa qu'Odile connaît est dans `odile/contacts.txt`. Ce n'est pas celui du message."
h5.hint.callback.2: "Tape `call +33639982016 \"Léa, c'est toi qui as écrit à mamie ?\"`."
h5.hint.sim.1: "Le numéro du service client est sur la facture : `cat odile/facture-nordtel.txt`."
h5.hint.sim.2: "Tape `call +33199001023 \"une demande de carte SIM ?\"`."
h5.hint.sim.3: "Puis `call +33199001023 \"Ce n'est pas elle, annulez cette demande\"`."
h5.hint.rule.1: "Ni la voix ni le nom affiché ne prouvent qui écrit. Tape `answer known`."
h5.hint.report.1: "Tape `contain block numero-inconnu`."
h5.debrief.title: "Vérifier par un chemin que l'autre n'a pas choisi"
h5.debrief.lesson: "Odile a reçu trois arnaques et deux vrais messages, tous dans les mêmes bulles. Le nom d'un expéditeur de SMS est un texte libre, un lien porte le nom qu'on veut lui donner, et une voix se copie à partir d'une vidéo. Ce qui l'a protégée n'est pas une technique : elle n'attendait pas de colis, et elle a appelé sa fille avant de payer."
h5.debrief.p1: "Un SMS qui réclame de l'argent ou un code, avec une urgence et un lien, se vérifie en tapant soi-même l'adresse du vrai service. On ne suit pas le lien."
h5.debrief.p2: "« Nouveau numéro », urgence, secret : on rappelle l'ancien numéro. Une voix ne prouve plus rien, un mot de code convenu en famille, si."
h5.debrief.p3: "Qui obtient une carte SIM à ton nom reçoit tes appels et tes codes de banque. Un code de protection posé chez l'opérateur bloque cette demande."
h5.debrief.p4: "Un message de ton opérateur ou de ta banque que tu ne comprends pas se vérifie au numéro de ta facture ou de ta carte, jamais à celui du message."
h5.home.p1: "Convenez d'un mot de code en famille, à voix haute, jamais par écrit. Qui demande de l'argent en urgence doit le connaître."
h5.home.p2: "Appelle ton opérateur et demande un code ou un verrou contre le changement de carte SIM et le transfert de ligne."
h5.home.p3: "Remplace, là où c'est possible, les codes reçus par SMS par une application de validation ou une clé d'accès."
h5.home.p4: "Transfère les SMS frauduleux au numéro de signalement de ton pays (le 33700 en France), puis bloque l'expéditeur."
