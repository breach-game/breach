h5.briefing: "Sunday afternoon, at Odile's, Élise's mother, three streets away. Seventy-four, a smartphone for two years, and a good sense many finance directors could envy: she paid nothing, she phoned her daughter. She hands you her phone and gives her agreement, it is written into the mandate. The `sms` command reads her message inbox. Her contacts and her last bill are in `odile/`."
h5.obj.read: "Read the messages Odile received"
h5.obj.link: "Find where the parcel link really leads"
h5.obj.callback: "Check Léa's \"new number\""
h5.obj.sim: "Stop the SIM card request"
h5.obj.rule: "Give Odile one simple rule"
h5.obj.report: "Block and report the number"
h5.file.contacts: "CONTACTS (Odile's address book)\nÉlise         +33 6 39 98 20 11\nLéa           +33 6 39 98 20 16\nKarim         +33 6 39 98 20 12\nDr Vasseur    +33 1 99 00 55 40\n"
h5.file.bill: "NORDTEL - bill for April 2029\nAccount holder: Odile Marchand\nLine: +33 6 39 98 20 30\nSérénité plan, 2 h: EUR 9.99\n\nCustomer service (free call): +33 1 99 00 10 23\nWe will never ask for your code by text message or by phone.\n"
h5.file.voicemail: "VOICEMAIL - automatic transcript\nSunday 13 May 2029, 11:31 - from: +33 6 39 98 41 07 - length: 9 s\n\n\"Granny it's me, it's Léa. Please don't call back, I can't talk. Text me.\"\n\n-- Odile's note: it really is her voice. That is what frightened me.\n"
h5.sms.bank: "Banque des Trois Rivières: your validation code is 418 220. Never give it to anyone, not even your adviser."
h5.sms.parcel: "ColisPlus: your parcel could not be delivered (EUR 1.99 fee). Reschedule within 24 h: https://colisplus-suivi.example/r?c=7741"
h5.sms.sim: "Nordtel: your request for a new SIM card is registered. Activation within 24 h. Not you? Call customer service."
h5.sms.kid: "Hi granny it's Léa, I broke my phone, this is my new number. Can you help me? I have a EUR 480 bill to pay today, I'll pay you back Monday. Don't tell mum pls"
h5.sms.kid2: "Granny are you there? It's urgent. I'm sending the bank details"
h5.npc.lea.role: "Odile's granddaughter, at the address-book number"
h5.npc.lea.hello: "Hello? Yes it's Léa. What's up?"
h5.npc.lea.denies: "What? No, I never wrote to granny. My phone is fine, I'm on it. And I have no bill, I'm sixteen. What is this about? Hang on, I'm calling mum."
h5.npc.stranger.role: "Unknown number"
h5.npc.stranger.any: "(it rings for a long time, then a very low voice) I can't talk now. Text me. Did you make the transfer?"
h5.npc.nordtel.role: "The operator's customer service"
h5.npc.nordtel.hello: "Nordtel customer service, hello. What is it about?"
h5.npc.nordtel.ask: "I am looking at Mrs Marchand's line. A new SIM card was requested yesterday at 17:28, in our Port-Vauban shop, with a copy of an identity document. The current card will be cut off tomorrow morning. She did not make that request?"
h5.npc.nordtel.cancel: "It is cancelled, and I am noting fraud on the file. Mrs Marchand's card stays active. I am also putting a code on her line: without that code no SIM card can be ordered any more, in a shop or by phone. She will get it by post."
h5.ada.brief: "Odile got five messages in three days. Some are real. Start by reading them all: `sms`. Then `sms` followed by a number shows what a phone's screen does not say."
h5.ada.g.read: "Read Odile's inbox: `sms`."
h5.ada.read: "Five messages, four senders. Look at the `FROM` column: a short code, two names, a mobile number. On a phone that makes pretty bubbles that all look alike. Open them one by one, starting with the parcel: `sms 2`."
h5.q.link: "Which site does the parcel link really open? (the site's name)"
h5.ada.g.link: "Open the parcel message: `sms 2`. The `opens` line gives the site. Answer with `answer link <site>`."
h5.ada.g.link.standard: "Open the parcel message with `sms` and its number, and answer with `answer link`."
h5.ada.parcel: "Two things. `Sender`: \"ColisPlus\" is a name, not a number, and a sender name is free text that anyone picks when sending. It proves nothing. And the link: it does not lead to a carrier, it leads to a site that carries its name. Odile was expecting no parcel, and that is what stopped her."
h5.ada.link: "`colisplus-suivi.example`. The page asks for EUR 1.99, so for a card number. That is what they want, not the two euros. A carrier does not ask for money by text: when in doubt, type its address yourself, do not follow the link."
h5.ada.link.next: "Next: `sms 4`."
h5.ada.kid: "The classic: a new number, an emergency, money, and \"don't tell mum\". Secrecy is the surest sign, because it is there to prevent the one thing that breaks the scam: checking. But read `odile/messagerie-vocale.txt` too. This time they added something."
h5.ada.g.callback: "Read `odile/messagerie-vocale.txt`, then the address book: `cat odile/contacts.txt`. Call Léa on the number Odile already knows: `call +33639982016 \"Léa, did you text granny?\"`."
h5.ada.g.callback.standard: "Odile's address book is in `odile/contacts.txt`. Call Léa on the number she already knows, with `call`, and ask her."
h5.ada.stranger: "You just called the number the message gave you. He picks up, of course, and will tell you whatever it takes. Checking means going through a path the other side did not choose: the number in the address book."
h5.ada.callback: "There: Léa is on her phone, on the same number as ever. As for the voice on the voicemail, it was hers, or nearly. Léa posts videos, and a few seconds of voice are enough today to make a copy that says something else. Nine seconds, \"don't call back, text me\": the copy cannot hold a conversation, so it avoids one."
h5.q.habit: "Which simple rule should Odile have for next time?"
h5.q.habit.known: "Hang up, then call back the number she already knows."
h5.q.habit.voice: "Ask to hear the voice before believing the message."
h5.q.habit.voice.why: "She heard it, and that is what frightened her. A voice can be copied from a few seconds of video. It no longer proves who is speaking."
h5.q.habit.never: "Never again answer a number she does not know."
h5.q.habit.never.why: "Her doctor, a delivery driver, the hospital: many useful calls come from unknown numbers. A rule that cannot be kept does not protect for long."
h5.ada.g.rule: "Answer my question about the rule to give Odile."
h5.ada.rule: "It is the same rule as for the finance director whom \"the CEO\" asks for a transfer on a video call: you check through a channel you chose yourself. Many families add a code word, agreed over a meal, that the real Léa knows and no video contains."
h5.ada.rule.next: "One message is left that Odile did not understand: `sms 3`."
h5.ada.lea.nudge: "She picked up, that is a start. Ask her the real question: did she write to her grandmother?"
h5.ada.simread: "That one is a real message from her operator, and it is the most serious of the five. Someone asked for a new SIM card for Odile's line. Once it is activated, they get her calls and her texts, so her bank's codes. Look at the first message of the list: her bank validates by text. Less than twenty-four hours are left."
h5.ada.g.sim: "The operator's real number is on her bill: `cat odile/facture-nordtel.txt`. Call it: `call +33199001023 \"a SIM card request?\"`."
h5.ada.g.sim.standard: "Find the customer-service number on Odile's bill, not in the text message, and call about the SIM card."
h5.ada.g.cancel: "Tell them it is not her and have it cancelled: `call +33199001023 \"It is not her, cancel this request\"`."
h5.ada.g.cancel.standard: "Call back and have the request cancelled."
h5.ada.sim: "Cancelled, with a few hours to spare. Someone walked into a shop with a copy of an identity document in Odile's name, and a salesperson in a hurry said yes. She did nothing wrong. The code Nordtel just put on the line exists at almost every operator: you have to ask for it, nobody offers."
h5.contain.block: "Block the unknown number on Odile's phone and forward its messages to the fraudulent-text reporting service"
h5.ada.g.report: "Last move: `contain block numero-inconnu`."
h5.ada.g.report.standard: "Block and report the number with `contain`."
h5.ada.report: "Blocked and reported. The report changes nothing for Odile tonight. It gets that number cut off for the thousand other people who received the same message this morning."
h5.ada.done: "Three scams in three days on the same person is no coincidence: her number and her name are lying in a leak, like Élise's password. Odile says you can come back whenever you like, and that there is tart left. Tonight we finish with what matters most: Élise's mailbox, the one that can reset everything else."
h5.hint.read.1: "Type `sms`."
h5.hint.link.1: "`sms 2` shows the parcel message. Under `Links`, the `opens` line gives the site's name."
h5.hint.link.2: "Type `answer link colisplus-suivi.example`."
h5.hint.callback.1: "The number of Léa that Odile knows is in `odile/contacts.txt`. It is not the one in the message."
h5.hint.callback.2: "Type `call +33639982016 \"Léa, did you text granny?\"`."
h5.hint.sim.1: "The customer-service number is on the bill: `cat odile/facture-nordtel.txt`."
h5.hint.sim.2: "Type `call +33199001023 \"a SIM card request?\"`."
h5.hint.sim.3: "Then `call +33199001023 \"It is not her, cancel this request\"`."
h5.hint.rule.1: "Neither the voice nor the name on the screen proves who is writing. Type `answer known`."
h5.hint.report.1: "Type `contain block numero-inconnu`."
h5.debrief.title: "Check through a path the other side did not choose"
h5.debrief.lesson: "Odile got three scams and two real messages, all in the same bubbles. The sender name of a text is free text, a link carries whatever name it is given, and a voice can be copied from a video. What protected her was no technique: she was expecting no parcel, and she phoned her daughter before paying."
h5.debrief.p1: "A text that asks for money or a code, with urgency and a link, is checked by typing the real service's address yourself. Do not follow the link."
h5.debrief.p2: "\"New number\", urgency, secrecy: call the old number back. A voice proves nothing any more; a code word agreed in the family does."
h5.debrief.p3: "Whoever gets a SIM card in your name gets your calls and your bank codes. A protection code set at the operator's blocks that request."
h5.debrief.p4: "A message from your operator or bank that you do not understand is checked at the number on your bill or card, never the one in the message."
h5.home.p1: "Agree on a family code word, out loud, never in writing. Whoever asks for money in a hurry must know it."
h5.home.p2: "Call your operator and ask for a code or a lock against SIM card changes and number transfers."
h5.home.p3: "Wherever you can, replace codes received by text with an authenticator app or a passkey."
h5.home.p4: "Forward fraudulent texts to your country's reporting number (7726 in the UK and the US, 33700 in France), then block the sender."
