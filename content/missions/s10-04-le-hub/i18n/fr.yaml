h4.briefing: "Dimanche matin. Dans l'entrée des Lemerle, un petit boîtier blanc : le hub Domia. Les ampoules, les capteurs de porte et le détecteur de fumée lui parlent en Zigbee, la serrure et le volet en Z-Wave. Ce sont deux radios à part, qui ne passent pas par le Wi-Fi : la box ne les voit pas, et ton inventaire de samedi non plus. Le hub, lui, raconte tout ce qu'il sait sur un courtier de messages, comme la ferme Verdure. On l'écoute. On n'écoute pas les ondes : seulement ce que le hub publie."
h4.obj.listen: "Écouter ce que le hub publie"
h4.obj.bulb: "Trouver l'appareil Zigbee qui n'est pas à la famille"
h4.obj.zigbee: "Fermer l'appairage et retirer l'intrus"
h4.obj.lockq: "Dire ce qui ne va pas avec la serrure"
h4.obj.lock: "Refaire l'inclusion de la serrure"
h4.obj.broker: "Exiger un compte sur le courtier du hub"
h4.obj.after: "Vérifier que le courtier refuse un inconnu"
h4.ada.brief: "Le hub répond sur le port 1883, celui des courtiers de messages. Abonne-toi à tout : `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.ada.g.listen: "Abonne-toi à tous les sujets du hub : `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.ada.g.listen.standard: "Abonne-toi à tous les sujets du courtier du hub, avec `mqtt sub`."
h4.ada.listen: "Aucun compte demandé : n'importe quel appareil du Wi-Fi peut lire ça, et la prise à douze euros aussi. Tu y vois l'état de la serrure de l'entrée et celui du volet, donc qui est là et qui ne l'est pas. On fermera ça en dernier, parce qu'on a besoin de lire. Regarde la première ligne : `permit_join: true`, depuis le 2 novembre 2028."
h4.q.bulb: "Quel appareil Zigbee n'est dans aucune pièce de la maison ? (son nom)"
h4.ada.g.bulb: "Lis la liste Zigbee : `mqtt sub -h hub.lemerle.test -t \"maison/zigbee/#\"`. Un appareil n'a pas de pièce et est arrivé bien après les autres. Réponds avec `answer bulb <nom>`."
h4.ada.g.bulb.standard: "Écoute les sujets `maison/zigbee/#` et trouve l'appareil arrivé après tous les autres. Réponds avec `answer bulb`."
h4.ada.bulb: "`ampoule-9f2c`, arrivée le 21 avril à 22 h 41, sans pièce. J'ai demandé à Élise : ce soir-là, les Dupré installaient une ampoule neuve de l'autre côté du mur. Une ampoule neuve cherche un réseau, et celui des Lemerle disait « entrez » depuis six mois, parce que l'installateur n'a jamais refermé l'appairage. Elle est entrée. Par accident, cette fois."
h4.contain.join: "Fermer l'appairage Zigbee (plus aucun nouvel appareil ne peut rejoindre le réseau)"
h4.contain.bulb: "Retirer ampoule-9f2c du réseau Zigbee"
h4.contain.lock: "Exclure la serrure puis la ré-inclure en S2, avec le code imprimé dessus (dix minutes, porte ouverte)"
h4.contain.hub: "Éteindre le hub (plus de lumières automatiques, plus d'alerte fumée sur les téléphones)"
h4.ada.g.zigbee: "Deux gestes, tous deux dans `contain` : `contain disable appairage`, puis `contain remove ampoule-9f2c`."
h4.ada.g.zigbee.standard: "`contain` liste les mesures. Il faut fermer la porte et sortir celui qui est entré."
h4.ada.bulb.first: "Elle est sortie. Mais la porte est toujours ouverte : la prochaine ampoule en appairage dans le quartier entrera pareil. Ferme l'appairage."
h4.ada.join.first: "La porte est fermée. L'ampoule des Dupré, elle, est déjà à l'intérieur : elle a reçu la clé du réseau en entrant. Retire-la."
h4.ada.zigbee: "Cinq appareils, tous dans une pièce, et l'appairage fermé. Ce qui est gênant dans cette histoire, ce n'est pas l'ampoule des voisins. C'est qu'un appareil choisi exprès serait entré de la même façon, aurait reçu la clé du réseau, et verrait la porte d'entrée s'ouvrir et se fermer. L'appairage, on l'ouvre deux minutes, pour un appareil, et on le referme. Maintenant, la serrure : `mqtt sub -h hub.lemerle.test -t \"maison/zwave/#\"`."
h4.q.class: "La serrure de l'entrée est incluse en `S0`, le volet en `S2`. Que faut-il faire ?"
h4.q.class.s2: "Ré-inclure la serrure en S2, avec le code imprimé dessus."
h4.q.class.fine: "Rien : S0 chiffre déjà, c'est suffisant pour une porte."
h4.q.class.fine.why: "S0 chiffre, mais donne la clé du réseau à l'appareil sous une protection connue de tous : qui écoute au moment de l'inclusion peut la lire. S2 la protège avec un code propre à chaque appareil."
h4.q.class.wifi: "Changer le mot de passe du Wi-Fi, la serrure passe par lui."
h4.q.class.wifi.why: "La serrure ne connaît pas le Wi-Fi. Elle parle Z-Wave, une radio à part, avec sa propre clé. Changer le Wi-Fi ne change rien pour elle."
h4.ada.g.lockq: "Lis les sujets Z-Wave : `mqtt sub -h hub.lemerle.test -t \"maison/zwave/#\"`, compare `security` pour la serrure et le volet, puis réponds à ma question."
h4.ada.g.lockq.standard: "Compare la classe de sécurité de la serrure et celle du volet, puis réponds à ma question."
h4.ada.lockq: "Le volet, posé en dernier, a été inclus en S2 avec son code. La serrure, posée en premier, est passée en S0 : l'installateur a sauté l'étape du code, et le hub a pris ce qui marchait. Le seul appareil qui ouvre la maison a la moins bonne des deux protections."
h4.ada.g.lock: "Refais l'inclusion : `contain reset serrure-entree`."
h4.ada.g.lock.standard: "Une mesure de `contain` refait l'inclusion de la serrure."
h4.ada.lock: "Karim a tapé les cinq chiffres imprimés sous le capot de la serrure, et elle est revenue en S2. Dix minutes, porte ouverte, un dimanche matin. C'est le bon moment pour le faire : pas le jour où on part en vacances."
h4.ada.off: "Le hub est éteint : plus de lumière automatique dans le couloir, et surtout plus d'alerte du détecteur de fumée sur les téléphones. Aucun des trois problèmes n'est réglé pour autant, ils attendent qu'on le rallume. Rallume-le dans ta tête, et corrige les réglages."
h4.ada.g.broker: "Dernière porte : le courtier. Ses réglages sont dans `hub/mosquitto.conf`. Passe `allow_anonymous` à `false`, retire le `#` devant `password_file`, puis `verify`."
h4.ada.g.broker.standard: "Corrige `hub/mosquitto.conf` pour que le courtier exige un compte, puis `verify`."
h4.check.anonymous: "Le courtier n'accepte plus de client sans compte"
h4.check.passwords: "Le courtier lit ses comptes dans un fichier de mots de passe"
h4.ada.broker: "Le hub et l'application des Lemerle ont chacun leur compte. Tout le reste est refusé."
h4.ada.g.after: "Vérifie : `mqtt sub -h hub.lemerle.test -t \"#\"`, sans compte."
h4.ada.g.after.standard: "Réessaie de t'abonner sans compte."
h4.ada.after: "Refusé. Ce que tu lisais ce matin sans rien demander, plus personne ne le lit sans y être invité."
h4.ada.done: "Trois réglages laissés tels que l'installateur les a trouvés, il y a six mois, un après-midi où il avait quatre maisons à faire. Personne n'a rien « piraté » ici non plus. Pendant qu'on rangeait, la mère d'Élise a appelé : elle a reçu des messages bizarres sur son téléphone. On y va."
h4.hint.listen.1: "`nmap hub.lemerle.test` montre le port 1883. `mqtt sub -h <machine> -t <sujet>` s'abonne, et `#` vaut pour tous les sujets."
h4.hint.listen.2: "Tape `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.hint.bulb.1: "Dans `maison/zigbee/pont/appareils/…`, regarde les champs `room` et `joined`. Un seul appareil a une pièce vide."
h4.hint.bulb.2: "Tape `answer bulb ampoule-9f2c`."
h4.hint.zigbee.1: "Tape `contain` pour lire les mesures. Deux concernent le Zigbee."
h4.hint.zigbee.2: "Tape `contain disable appairage`, puis `contain remove ampoule-9f2c`."
h4.hint.lockq.1: "S0 est l'ancienne classe de sécurité de Z-Wave, S2 la nouvelle. Tape `answer s2`."
h4.hint.lock.1: "Tape `contain reset serrure-entree`."
h4.hint.broker.1: "`edit hub/mosquitto.conf`, ou deux `sed -i`. `verify` dit ce qui manque."
h4.hint.broker.2: "Tape `sed -i \"s/allow_anonymous true/allow_anonymous false/\" hub/mosquitto.conf`, puis `sed -i \"s/# password_file/password_file/\" hub/mosquitto.conf`, puis `verify`."
h4.hint.after.1: "Tape `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.debrief.title: "Une porte d'appairage ouverte depuis six mois"
h4.debrief.lesson: "Le Zigbee et le Z-Wave de la maison n'avaient aucune faille. Ils avaient les réglages du jour de l'installation : un appairage jamais refermé, par lequel l'ampoule des voisins est entrée toute seule, une serrure incluse avec l'ancienne protection parce que c'était plus rapide, et un hub qui racontait l'état de la porte d'entrée à tout le Wi-Fi."
h4.debrief.p1: "L'appairage s'ouvre pour un appareil et se referme aussitôt. Ouvert en permanence, il accepte tout ce qui passe à portée de radio, et lui donne la clé du réseau."
h4.debrief.p2: "En Z-Wave, une serrure s'inclut en S2, avec le code imprimé sur l'appareil. En S0, la clé du réseau voyage sous une protection que tout le monde connaît."
h4.debrief.p3: "La liste des appareils d'un hub se relit comme celle de la box. Un appareil sans pièce ni nom n'a rien à y faire."
h4.debrief.p4: "Le courtier d'un hub dit qui est à la maison. Il exige un compte, même sur le réseau « de confiance » du salon."
h4.home.p1: "Dans l'appli de ton hub ou de ton pont, cherche « appairage », « ajout d'appareils » ou « permit join » : il doit être fermé quand tu n'ajoutes rien."
h4.home.p2: "Relis la liste des appareils du hub. Retire ceux que tu ne reconnais pas, et donne une pièce aux autres."
h4.home.p3: "Pour une serrure ou une alarme Z-Wave, vérifie qu'elle est en « S2 ». Sinon, exclus-la et refais l'inclusion avec le code ou le QR code de l'appareil."
h4.home.p4: "Quand tu ajoutes un appareil : ouvre l'appairage deux minutes, ajoute-le, vérifie qu'il s'est refermé."
