h4.briefing: "Sunday morning. In the Lemerles' hallway, a small white box: the Domia hub. The bulbs, the door sensors and the smoke detector talk to it in Zigbee, the lock and the shutter in Z-Wave. Those are two radios of their own, which do not use the Wi-Fi: the router does not see them, and neither did your Saturday inventory. The hub, though, tells everything it knows on a message broker, like the Verdure farm. We listen to it. We do not listen to the air: only to what the hub publishes."
h4.obj.listen: "Listen to what the hub publishes"
h4.obj.bulb: "Find the Zigbee device that is not the family's"
h4.obj.zigbee: "Close the pairing and remove the intruder"
h4.obj.lockq: "Say what is wrong with the lock"
h4.obj.lock: "Include the lock again"
h4.obj.broker: "Require an account on the hub's broker"
h4.obj.after: "Check that the broker turns a stranger away"
h4.ada.brief: "The hub answers on port 1883, the message brokers' port. Subscribe to everything: `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.ada.g.listen: "Subscribe to every topic of the hub: `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.ada.g.listen.standard: "Subscribe to every topic of the hub's broker, with `mqtt sub`."
h4.ada.listen: "No account asked for: any device on the Wi-Fi can read this, the three-euro plug included. You can see the state of the front-door lock and of the shutter, so who is in and who is not. We will close that last, because we need to read. Look at the first line: `permit_join: true`, since 2 November 2028."
h4.q.bulb: "Which Zigbee device is in no room of the house? (its name)"
h4.ada.listen.audit: "With the audit account, this time. Until this morning any device on the Wi-Fi read this without an account: the state of the front-door lock and of the shutter, so who is in and who is not. Look at the first line: `permit_join: true`, since 2 November 2028."
h4.ada.g.bulb: "Read the Zigbee list: `mqtt sub -h hub.lemerle.test -t \"maison/zigbee/#\"`. One device has no room and arrived long after the others. Answer with `answer bulb <name>`."
h4.ada.g.bulb.standard: "Listen to the `maison/zigbee/#` topics and find the device that arrived after all the others. Answer with `answer bulb`."
h4.ada.bulb: "`ampoule-9f2c`, arrived on 21 April at 22:41, with no room. I asked Élise: that evening the Duprés were fitting a new bulb on the other side of the wall. A new bulb looks for a network, and the Lemerles' had been saying \"come in\" for six months, because the installer never closed the pairing. It came in. By accident, this time."
h4.contain.join: "Close Zigbee pairing (no new device can join the network)"
h4.contain.bulb: "Remove ampoule-9f2c from the Zigbee network"
h4.contain.lock: "Redo the inclusion of the lock (ten minutes, door open)"
h4.contain.hub: "Switch the hub off (no automatic lights, no smoke alert on the phones)"
h4.ada.g.zigbee: "Two moves, both in `contain`: `contain disable appairage`, then `contain remove ampoule-9f2c`."
h4.ada.g.zigbee.standard: "`contain` lists the measures. Close the door and put out the one who came in."
h4.ada.bulb.first: "It is out. But the door is still open: the next bulb in pairing mode in the neighbourhood will come in the same way. Close the pairing."
h4.ada.join.first: "The door is closed. The Duprés' bulb is already inside, though: it was given the network key on the way in. Remove it."
h4.ada.zigbee: "Five devices, each in a room, and pairing closed. The awkward part of this story is not the neighbours' bulb. It is that a device chosen on purpose would have come in the same way, been given the network key, and would see the front door open and close. Pairing is opened for two minutes, for one device, and closed again. Now the lock: `mqtt sub -h hub.lemerle.test -t \"maison/zwave/#\"`."
h4.q.class: "The front-door lock is included in `S0`, the shutter in `S2`. What should be done?"
h4.q.class.s2: "Include the lock again in S2, with the code printed on it."
h4.q.class.fine: "Nothing: S0 already encrypts, that is enough for a door."
h4.q.class.fine.why: "S0 encrypts, but hands the network key to the device under a protection everybody knows: whoever listens at the moment of inclusion can read it. S2 protects it with a code that belongs to each device."
h4.q.class.wifi: "Change the Wi-Fi password, since the lock uses it."
h4.q.class.wifi.why: "The lock knows nothing of the Wi-Fi. It talks Z-Wave, a radio of its own, with its own key. Changing the Wi-Fi changes nothing for it."
h4.ada.g.lockq: "Read the Z-Wave topics: `mqtt sub -h hub.lemerle.test -t \"maison/zwave/#\"`, compare `security` for the lock and the shutter, then answer my question."
h4.ada.g.lockq.standard: "Compare the security class of the lock with the shutter's, then answer my question."
h4.ada.lockq: "The shutter, fitted last, was included in S2 with its code. The lock, fitted first, went in as S0: the installer skipped the code step, and the hub took what worked. The one device that opens the house has the weaker of the two protections."
h4.ada.g.lock: "Do the inclusion again: `contain reset serrure-entree`."
h4.ada.g.lock.standard: "One `contain` measure includes the lock again."
h4.ada.lock: "Karim typed the five digits printed under the lock's cover, and it came back in S2. Ten minutes, door open, on a Sunday morning. That is the right time for it: not the day you leave on holiday."
h4.ada.off: "The hub is off: no automatic light in the corridor, and above all no smoke-detector alert on the phones. None of the three problems is fixed for all that, they wait for it to be switched back on. Switch it back on in your head, and correct the settings."
h4.ada.g.broker: "Last door: the broker. Its settings are in `hub/mosquitto.conf`: open it with `edit hub/mosquitto.conf`, set `allow_anonymous` to `false`, remove the `#` before `password_file`, then `verify`."
h4.ada.g.broker.standard: "Correct `hub/mosquitto.conf` so that the broker requires an account, then `verify`."
h4.check.anonymous: "The broker no longer accepts a client without an account"
h4.check.passwords: "The broker reads its accounts from a password file"
h4.ada.broker: "The hub and the Lemerles' app each have their own account. Everything else is refused."
h4.ada.g.after: "Check: `mqtt sub -h hub.lemerle.test -t \"#\"`, with no account."
h4.ada.g.after.standard: "Try again to subscribe without an account."
h4.ada.after: "Refused. What you read this morning without asking, nobody reads any more without being invited."
h4.ada.done: "Three settings left as the installer found them, six months ago, on an afternoon when he had four houses to do. Nobody \"hacked\" anything here either. While we were tidying up, Élise's mother phoned: she got odd messages on her phone. Off we go."
h4.ada.audit: "The broker asks for an account now. Karim created one for the audit: it is written at the top of `hub/mosquitto.conf`, to pass with `-u` and `-P`."
h4.hint.listen.1: "`nmap hub.lemerle.test` shows port 1883. `mqtt sub -h <host> -t <topic>` subscribes, and `#` stands for every topic. If the broker refuses, the audit account is at the top of `hub/mosquitto.conf`."
h4.hint.listen.2: "Type `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.hint.bulb.1: "In `maison/zigbee/pont/appareils/…`, look at the `room` and `joined` fields. One device only has an empty room."
h4.hint.bulb.2: "Type `answer bulb ampoule-9f2c`."
h4.hint.zigbee.1: "Type `contain` to read the measures. Two are about Zigbee."
h4.hint.zigbee.2: "Type `contain disable appairage`, then `contain remove ampoule-9f2c`."
h4.hint.lockq.1: "S0 is Z-Wave's old security class, S2 the new one. Type `answer s2`."
h4.hint.lock.1: "Type `contain reset serrure-entree`."
h4.hint.broker.1: "`edit hub/mosquitto.conf`, or two `sed -i`. `verify` says what is missing."
h4.hint.broker.2: "Type `sed -i \"s/allow_anonymous true/allow_anonymous false/\" hub/mosquitto.conf`, then `sed -i \"s/# password_file/password_file/\" hub/mosquitto.conf`, then `verify`."
h4.hint.after.1: "Type `mqtt sub -h hub.lemerle.test -t \"#\"`."
h4.debrief.title: "A pairing door open for six months"
h4.debrief.lesson: "The home's Zigbee and Z-Wave had no flaw. They had the settings of installation day: a pairing never closed, through which the neighbours' bulb walked in by itself, a lock included with the old protection because it was quicker, and a hub that told the state of the front door to the whole Wi-Fi."
h4.debrief.p1: "Pairing is opened for one device and closed at once. Left open, it accepts whatever comes within radio range, and hands it the network key."
h4.debrief.p2: "In Z-Wave, a lock is included in S2, with the code printed on the device. In S0, the network key travels under a protection everybody knows."
h4.debrief.p3: "A hub's device list is read again like the router's. A device with no room and no name has no business there."
h4.debrief.p4: "A hub's broker tells who is home. It requires an account, even on the \"trusted\" network of the living room."
h4.home.p1: "In the app of your hub or bridge, look for \"pairing\", \"add devices\" or \"permit join\": it must be closed when you are adding nothing."
h4.home.p2: "Read the hub's device list again. Remove the ones you do not recognise, and give the others a room."
h4.home.p3: "For a Z-Wave lock or alarm, check that it is in \"S2\". If not, exclude it and include it again with the device's code or QR code."
h4.home.p4: "When you add a device: open pairing for two minutes, add it, and check that it closed again."
