a1.briefing: "Nouveau client : Alto, qui imprime des albums photo pour dix-huit mille familles. Alto n'a aucun serveur : tout est loué chez Nimbus, un fournisseur de cloud, dans un seul compte. Avant une levée de fonds, ses investisseurs veulent un audit de ce compte. Quatre jours, quatre sujets. Aujourd'hui lundi : le stockage."
a1.obj.source: "Lire la source du site d'Alto"
a1.obj.listing: "Lister les seaux du compte de stockage"
a1.obj.backups: "Regarder ce que contient le seau des sauvegardes"
a1.obj.leak: "Ouvrir l'export des clients et envoyer son flag"
a1.obj.why: "Dire ce qui a rendu la sauvegarde lisible"
a1.q.why: "Tu n'as volé aucun mot de passe et contourné aucune protection. Qu'est-ce qui a rendu la sauvegarde lisible ?"
a1.q.why.nimbus: "Une faille chez Nimbus : le fournisseur a laissé fuir les fichiers de son client, sans jamais le prévenir"
a1.q.why.nimbus.why: "Nimbus a fait exactement ce qu'Alto lui a demandé : servir ce seau à tout le monde. Le fournisseur protège ses machines, le client règle qui lit ses données. C'est le partage des responsabilités."
a1.q.why.setting: "Un réglage du seau : « lecture publique », posé un jour pour dépanner et jamais retiré"
a1.q.why.listing: "La liste des seaux : sans elle, personne n'aurait pu lire le moindre fichier"
a1.q.why.listing.why: "La liste t'a fait gagner du temps, rien de plus. Le fichier se lit par son adresse directe, et un nom comme `alto-backups` se devine en trois essais."
a1.ada.brief: "On commence comme un visiteur. Le site est sur `https://www.alto.test/`. Lis sa source avec `curl` : les développeurs y laissent souvent l'adresse de ce qui se trouve derrière."
a1.ada.g.source: "Lis la source du site : `curl https://www.alto.test/`."
a1.ada.g.source.standard: "Lis la source de la page d'accueil d'Alto."
a1.ada.g.listing: "Le commentaire donne l'adresse du stockage. Demande-lui ce qu'il contient, sans rien d'autre : `curl https://storage.alto.test/`."
a1.ada.g.listing.standard: "Un commentaire de la page donne l'adresse du stockage. Interroge sa racine."
a1.ada.g.backups: "Le seau `alto-backups` est en `public-read`. Liste-le : `curl https://storage.alto.test/alto-backups/`."
a1.ada.g.backups.standard: "Un des seaux ne devrait pas être en `public-read`. Regarde ce qu'il contient."
a1.ada.g.leak: "Ouvre le petit fichier, pas la base entière : `curl https://storage.alto.test/alto-backups/export-clients.csv`."
a1.ada.g.leak.standard: "Ouvre le plus petit des deux fichiers du seau. Le mandat interdit de copier la base."
a1.ada.g.submit: "Alto a posé un témoin dans l'export pour l'audit. Envoie-le : `submit` suivi du flag."
a1.ada.g.submit.standard: "Envoie le flag de l'export."
a1.ada.source: "Les images viennent de `https://storage.alto.test/alto-site/`. C'est normal qu'un seau d'images soit public : un site sert ses images à tout le monde. La question est de savoir ce que ce stockage sert d'autre."
a1.ada.listing: "Quatre seaux, et le compte te les énumère sans te demander qui tu es. Regarde le champ `access`. `alto-site` en lecture publique, c'est voulu. `alto-backups` en lecture publique, ça ne peut pas l'être."
a1.ada.backups: "Une base complète et un export des clients. Et la note raconte tout : ouvert le 2 mars pour envoyer un fichier à l'imprimeur, ticket ALT-117. Le fichier est parti, le réglage est resté."
a1.ada.dump: "Tu as demandé la base, et tu t'es arrêté à sa description. C'est la règle du mandat : on prouve qu'elle est lisible, on ne l'emporte pas."
a1.ada.leak: "Noms, adresses, villes. Trois lignes suffisent pour le rapport : il y en a dix-huit mille derrière, lisibles par n'importe qui depuis deux mois et demi."
a1.ada.flag: "Preuve faite. Remarque ce que tu n'as pas fait : aucun scan, aucun mot de passe, aucune ruse. Quelques adresses tapées dans l'ordre."
a1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
a1.ada.answer.standard: "Réponds à ma question."
a1.ada.why: "Oui. Dans le cloud, la porte n'est pas une serrure qu'on force : c'est une case cochée. Et une case cochée « pour cinq minutes » ne se décoche jamais toute seule."
a1.ada.done: "Le rapport dira « seau de sauvegardes en lecture publique ». Maintenant passe de l'autre côté : ouvre le débrief, retrouve ta lecture dans les journaux du stockage, et choisis la correction."
a1.soc.leak: "storage: a backup object was read without any sign-in"
a1.hint.source.1: "Tape `curl https://www.alto.test/`."
a1.hint.listing.1: "La source de la page contient un commentaire avec une adresse en `storage.alto.test`."
a1.hint.listing.2: "Tape `curl https://storage.alto.test/`."
a1.hint.backups.1: "Dans la liste, deux seaux sont en `public-read`. L'un sert des images. L'autre ?"
a1.hint.backups.2: "Tape `curl https://storage.alto.test/alto-backups/`."
a1.hint.leak.1: "L'adresse d'un fichier, c'est l'adresse du seau suivie de sa clé (`key`)."
a1.hint.leak.2: "Tape `curl https://storage.alto.test/alto-backups/export-clients.csv`, puis `submit` suivi du flag."
a1.def.intro: "Le stockage de Nimbus journalise chaque lecture : qui, quel fichier, quelle réponse. Ta lecture y est, entre les visiteurs du site et le robot de sauvegarde."
a1.def.lesson: "Un seau public n'attend pas un attaquant doué : il attend le premier qui tape son adresse. La correction est un réglage, et la détection regarde les lectures réussies d'un seau que personne ne devrait lire."
a1.def.find.leak: "La lecture de l'export des clients, sans aucune identité"
a1.def.rule.read.title: "Alerter sur toute lecture réussie dans le seau des sauvegardes"
a1.def.rule.read.why: "C'est la bonne. Le robot de sauvegarde écrit dans ce seau, il ne le lit jamais. Une lecture réussie est donc toujours anormale, et il y en a très peu."
a1.def.rule.every.title: "Alerter sur chaque lecture dans le stockage"
a1.def.rule.every.why: "Chaque visiteur du site charge trois images depuis ce stockage. Ta lecture est dedans, noyée sous des milliers d'autres."
a1.def.rule.denied.title: "Alerter sur chaque lecture refusée par le stockage"
a1.def.rule.denied.why: "On ne t'a rien refusé : toutes tes lectures ont réussi. Cette règle voit les curieux qui échouent, pas celui qui entre par la porte ouverte."
a1.def.fix.private.title: "Passer le seau alto-backups en privé"
a1.def.fix.private.why: "C'est la bonne. La liste comme l'adresse directe répondent désormais « accès refusé ». L'imprimeur recevra son prochain fichier par un lien signé, valable une heure."
a1.def.fix.listing.title: "Interdire de lister les seaux du compte sans s'identifier"
a1.def.fix.listing.why: "La liste disparaît, mais le fichier se lit toujours par son adresse. Tu as caché la carte, pas fermé la porte."
a1.def.fix.note.title: "Retirer du site le commentaire qui donne l'adresse du stockage"
a1.def.fix.note.why: "L'adresse reste visible dans chaque image que le site charge. Et le seau est toujours public."
a1.debrief.title: "Une case cochée en mars"
a1.debrief.lesson: "Alto n'a pas été piratée : elle a publié elle-même ses sauvegardes, par un réglage posé pour dépanner un partenaire. Dans le cloud, la plupart des fuites ressemblent à celle-ci. Personne ne force rien, quelqu'un lit ce qui est en libre accès."
a1.debrief.p1: "Le fournisseur protège ses machines, le client règle qui lit ses données. Ce partage des responsabilités est écrit dans tous les contrats de cloud."
a1.debrief.p2: "Bloquer l'accès public au niveau du compte entier, et n'ouvrir que le seau du site, par exception écrite."
a1.debrief.p3: "Pour partager un fichier, un lien signé qui expire, jamais un changement de réglage du seau."
a1.debrief.p4: "Passer en revue chaque semaine la liste de ce qui est public. Elle doit tenir en une ligne."
