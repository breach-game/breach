a1.briefing: "New client: Alto, which prints photo albums for eighteen thousand families. Alto owns no server: everything is rented from Nimbus, a cloud provider, in a single account. Before a funding round, its investors want that account audited. Four days, four subjects. Today, Monday: storage."
a1.obj.source: "Read the source of Alto's website"
a1.obj.listing: "List the buckets of the storage account"
a1.obj.backups: "Look at what the backup bucket holds"
a1.obj.leak: "Open the customer export and submit its flag"
a1.obj.why: "Say what made the backup readable"
a1.q.why: "You stole no password and got around no protection. What made the backup readable?"
a1.q.why.nimbus: "A flaw at Nimbus: the provider let its customer's files leak, without ever telling them"
a1.q.why.nimbus.why: "Nimbus did exactly what Alto asked: serve this bucket to everyone. The provider protects its machines, the customer sets who reads its data. That is shared responsibility."
a1.q.why.setting: "A bucket setting: \"public read\", switched on one day to help out and never removed"
a1.q.why.listing: "The list of buckets: without it, nobody could have read a single file"
a1.q.why.listing.why: "The list saved you time, nothing more. The file is read by its direct address, and a name like `alto-backups` is guessed in three tries."
a1.ada.brief: "We start as a visitor. The website is at `https://www.alto.test/`. Read its source with `curl`: developers often leave the address of what sits behind."
a1.ada.g.source: "Read the source of the website: `curl https://www.alto.test/`."
a1.ada.g.source.standard: "Read the source of Alto's home page."
a1.ada.g.listing: "The comment gives the address of the storage. Ask it what it holds, with nothing else: `curl https://storage.alto.test/`."
a1.ada.g.listing.standard: "A comment in the page gives the address of the storage. Query its root."
a1.ada.g.backups: "The `alto-backups` bucket is `public-read`. List it: `curl https://storage.alto.test/alto-backups/`."
a1.ada.g.backups.standard: "One of the buckets should not be `public-read`. Look at what it holds."
a1.ada.g.leak: "Open the small file, not the whole database: `curl https://storage.alto.test/alto-backups/export-clients.csv`."
a1.ada.g.leak.standard: "Open the smaller of the two files in the bucket. The mandate forbids copying the database."
a1.ada.g.submit: "Alto placed a marker in the export for the audit. Send it: `submit` followed by the flag."
a1.ada.g.submit.standard: "Submit the flag of the export."
a1.ada.source: "The images come from `https://storage.alto.test/alto-site/`. A public bucket of images is normal: a website serves its images to everyone. The question is what else this storage serves."
a1.ada.listing: "Four buckets, and the account lists them without asking who you are. Look at the `access` field. `alto-site` in public read is intended. `alto-backups` in public read cannot be."
a1.ada.backups: "A full database and a customer export. And the note tells the whole story: opened on 2 March to send one file to the printer, ticket ALT-117. The file left, the setting stayed."
a1.ada.dump: "You asked for the database and stopped at its description. That is the rule of the mandate: we prove it can be read, we do not take it."
a1.ada.leak: "Names, addresses, cities. Three rows are enough for the report: there are eighteen thousand behind them, readable by anyone for two and a half months."
a1.ada.flag: "Proof made. Notice what you did not do: no scan, no password, no trick. A few addresses typed in order."
a1.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
a1.ada.answer.standard: "Answer my question."
a1.ada.why: "Yes. In the cloud, the door is not a lock to force: it is a ticked box. And a box ticked \"for five minutes\" never unticks itself."
a1.ada.done: "The report will say \"backup bucket in public read\". Now switch sides: open the debrief, find your read in the storage logs, and choose the fix."
a1.soc.leak: "storage: a backup object was read without any sign-in"
a1.hint.source.1: "Type `curl https://www.alto.test/`."
a1.hint.listing.1: "The source of the page holds a comment with an address in `storage.alto.test`."
a1.hint.listing.2: "Type `curl https://storage.alto.test/`."
a1.hint.backups.1: "In the list, two buckets are `public-read`. One serves images. The other?"
a1.hint.backups.2: "Type `curl https://storage.alto.test/alto-backups/`."
a1.hint.leak.1: "The address of a file is the address of the bucket followed by its `key`."
a1.hint.leak.2: "Type `curl https://storage.alto.test/alto-backups/export-clients.csv`, then `submit` followed by the flag."
a1.def.intro: "Nimbus storage logs every read: who, which file, which answer. Your read is in there, between the website's visitors and the backup robot."
a1.def.lesson: "A public bucket does not wait for a gifted attacker: it waits for the first person who types its address. The fix is a setting, and detection watches successful reads of a bucket nobody should read."
a1.def.find.leak: "The read of the customer export, with no identity at all"
a1.def.rule.read.title: "Alert on any successful read in the backup bucket"
a1.def.rule.read.why: "This is the one. The backup robot writes to this bucket, it never reads it. A successful read is therefore always abnormal, and there are very few."
a1.def.rule.every.title: "Alert on every read in the storage"
a1.def.rule.every.why: "Every visitor of the website loads three images from this storage. Your read is in there, drowned under thousands of others."
a1.def.rule.denied.title: "Alert on every read the storage refuses"
a1.def.rule.denied.why: "Nothing was refused to you: all your reads succeeded. This rule sees the curious who fail, not the one who walks through the open door."
a1.def.fix.private.title: "Make the alto-backups bucket private"
a1.def.fix.private.why: "This is the one. The list and the direct address now both answer \"access denied\". The printer will get its next file through a signed link, valid for one hour."
a1.def.fix.listing.title: "Forbid listing the account's buckets without signing in"
a1.def.fix.listing.why: "The list is gone, but the file is still read by its address. You hid the map, you did not close the door."
a1.def.fix.note.title: "Remove from the website the comment that gives the storage address"
a1.def.fix.note.why: "The address stays visible in every image the website loads. And the bucket is still public."
a1.debrief.title: "A box ticked in March"
a1.debrief.lesson: "Alto was not hacked: it published its own backups, through a setting switched on to help a partner. In the cloud, most leaks look like this one. Nobody forces anything, someone reads what is freely available."
a1.debrief.p1: "The provider protects its machines, the customer sets who reads its data. This shared responsibility is written in every cloud contract."
a1.debrief.p2: "Block public access for the whole account, and open only the website's bucket, as a written exception."
a1.debrief.p3: "To share a file, a signed link that expires, never a change to the bucket's setting."
a1.debrief.p4: "Review every week the list of what is public. It should fit on one line."
