# Season 6, mission 1: a storage bucket left readable by everyone.
order: 0
stage: cloud
briefing: a1.briefing

objectives:
  - { id: source, text: a1.obj.source }
  - { id: listing, text: a1.obj.listing }
  - { id: backups, text: a1.obj.backups }
  - { id: leak, text: a1.obj.leak }
  - { id: why, text: a1.obj.why }

flags:
  - { id: leak, value: "FLAG{alto-open-bucket-52c8}", points: 200, objective: leak }

questions:
  - id: why
    text: a1.q.why
    objective: why
    correct: setting
    options:
      - { id: nimbus, text: a1.q.why.nimbus, why: a1.q.why.nimbus.why }
      - { id: setting, text: a1.q.why.setting }
      - { id: listing, text: a1.q.why.listing, why: a1.q.why.listing.why }

reveal: [www]

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: a1.ada.brief
  - on: { event: HttpRequest, host: www, path: / }
    do:
      - ada.say: a1.ada.source
      - objective.complete: source
  - on: { event: HttpRequest, host: storage, path: / }
    do:
      - ada.say: a1.ada.listing
      - objective.complete: listing
  - on: { event: HttpRequest, host: storage, path: { in: [/alto-backups, /alto-backups/] } }
    do:
      - ada.say: a1.ada.backups
      - objective.complete: backups
  - on: { event: HttpRequest, host: storage, path: /alto-backups/db-2028-05-12.sql.gz }
    do:
      - ada.say: a1.ada.dump
  - on: { event: HttpRequest, host: storage, path: /alto-backups/export-clients.csv }
    do:
      - noise.add: { points: 6, as: a1.soc.leak }
      - ada.say: a1.ada.leak
      - ada.guide: { key: a1.ada.g.submit, for: leak, step: 1 }
  - on: { event: FlagSubmitted, correct: true }
    do:
      - ada.say: a1.ada.flag
      - ada.ask: why
  - on: { event: ObjectiveCompleted, objective: why }
    do:
      - ada.say: a1.ada.why
  - on: { event: MissionCompleted }
    do:
      - ada.say: a1.ada.done

guide:
  source: a1.ada.g.source
  listing: a1.ada.g.listing
  backups: a1.ada.g.backups
  leak: a1.ada.g.leak
  why: a1.ada.answer

hints:
  source: [a1.hint.source.1]
  listing: [a1.hint.listing.1, a1.hint.listing.2]
  backups: [a1.hint.backups.1, a1.hint.backups.2]
  leak: [a1.hint.leak.1, a1.hint.leak.2]

defense:
  intro: a1.def.intro
  lesson: a1.def.lesson
  find:
    - { source: access, where: { path: /alto-backups/export-clients.csv }, text: a1.def.find.leak }
  rules:
    - id: backup-read
      title: a1.def.rule.read.title
      why: a1.def.rule.read.why
      source: access
      where: { path: { glob: "/alto-backups/*" }, method: GET, status: 200 }
      correct: true
    - id: every-request
      title: a1.def.rule.every.title
      why: a1.def.rule.every.why
      source: access
      where: { method: GET }
    - id: denied
      title: a1.def.rule.denied.title
      why: a1.def.rule.denied.why
      source: access
      where: { status: 403 }
  fixes:
    - id: private
      title: a1.def.fix.private.title
      why: a1.def.fix.private.why
      sets: { storage.backups_private: true }
      correct: true
    - id: listing
      title: a1.def.fix.listing.title
      why: a1.def.fix.listing.why
      sets: { storage.listing_off: true }
    - id: note
      title: a1.def.fix.note.title
      why: a1.def.fix.note.why
      sets: { www.note_removed: true }

debrief:
  title: a1.debrief.title
  lesson: a1.debrief.lesson
  points: [a1.debrief.p1, a1.debrief.p2, a1.debrief.p3, a1.debrief.p4]
  reference: "OWASP Top 10 · A05 Security Misconfiguration · CWE-732"
