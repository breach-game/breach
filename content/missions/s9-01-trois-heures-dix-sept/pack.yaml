summary:
  fr: "Côté défense, et cette fois chez toi. À 3 h 17, quelqu'un se connecte au serveur où Ligne Rouge garde les rapports de tous ses clients. Tu lis les journaux, tu coupes le bon fil avant que les rapports sortent, puis tu relis les six cartes de visite laissées chez tes clients. Elles disaient quelque chose."
  en: "Defence side, and this time at home. At 3:17 a.m. someone logs in to the server where Ligne Rouge keeps every client's report. You read the logs, cut the right wire before the reports leave, then read again the six calling cards left at your clients'. They were saying something."
