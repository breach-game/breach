z1.briefing: "Lundi 19 mars 2029, 3 h 17. Ton téléphone sonne : c'est Ada, et elle ne dort pas non plus. Le serveur d'archives de Ligne Rouge, celui qui garde les rapports de tous vos clients depuis 2026, vient d'accepter une connexion. Personne ne travaille à cette heure-là. Cette fois, le client, c'est vous."
z1.obj.cut: "Fermer la porte par laquelle il est entré"
z1.obj.stop: "Voir l'intrus s'arrêter"
z1.obj.since: "Dire de quand date ce compte (`answer since`)"
z1.obj.word: "Assembler les six morceaux (`answer word`)"
z1.obj.meaning: "Dire ce que ce mot change"
z1.obj.ip: "Nommer l'adresse d'où il vient (`answer ip`)"
z1.q.since: "En quelle année ce compte a-t-il été créé ?"
z1.q.word: "Quel mot forment les six morceaux, mis bout à bout ?"
z1.q.ip: "De quelle adresse vient la connexion de cette nuit ?"
z1.q.meaning: "Six cartes laissées chez six clients, de 2027 à 2029, épellent le nom du compte de cette nuit. Qu'est-ce que ça prouve ?"
z1.q.meaning.tonight: "Que quelqu'un a deviné le nom de ce compte cette nuit, par hasard"
z1.q.meaning.tonight.why: "La première carte date de juin 2027. On ne devine pas en 2029 un nom qu'on épelait déjà deux ans plus tôt."
z1.q.meaning.before: "Qu'il tenait ce compte avant Pélican, et lisait nos rapports depuis"
z1.q.meaning.intern: "Que Mute est le stagiaire de l'été 2019, et qu'on peut le nommer"
z1.q.meaning.intern.why: "Un nom de compte désigne un compte, pas une personne. N'importe qui ayant trouvé ce mot de passe a pu s'en servir. Accuser quelqu'un sur cette seule base serait une faute."
z1.contain.account: "Compte stagiaire-19 désactivé, ses sessions fermées"
z1.contain.block: "Adresse 10.30.0.199 bloquée sur le réseau du cabinet"
z1.contain.isolate: "Serveur d'archives isolé : plus aucun rapport accessible, pour personne"
z1.alert.intern: "Connexion d'un compte de stagiaire"
z1.alert.intern.why: "Ligne Rouge n'a plus de stagiaire depuis des années, et tout le monde ici se connecte avec une clé."
z1.alert.pack: "Rapports de mandats mis en archive"
z1.alert.pack.why: "Personne n'a de raison d'empaqueter une année entière de rapports."
z1.alert.out: "Gros envoi vers une adresse inconnue"
z1.alert.out.why: "Le serveur d'archives n'envoie rien dehors, sauf ses mises à jour."
z1.ada.brief: "Je suis au bureau dans vingt minutes, toi tu es déjà devant ton poste. On fait comme chez les clients : on regarde avant de couper. `soc sources` te dit quels journaux tu as, `soc alerts` ce qui a sonné, `contain` ce que tu peux couper. Et on n'efface rien."
z1.ada.g.start: "Commence par voir quels journaux tu as : `soc sources`."
z1.ada.g.start.standard: "Regarde quels journaux tu as, puis les alertes du SOC."
z1.ada.g.alerts: "Une alerte vient de tomber. Lis-la : `soc alerts`."
z1.ada.g.alerts.standard: "Une alerte vient de tomber dans le SOC."
z1.ada.g.logs: "Ça se passe sur le serveur d'archives. Regarde qui s'y connecte : `soc logs archives auth`."
z1.ada.g.logs.standard: "Ça se passe sur le serveur d'archives. Regarde qui s'y connecte."
z1.ada.g.cut: "Il est entré avec un compte et son mot de passe. Ferme ce compte : `contain disable stagiaire-19`."
z1.ada.g.cut.standard: "Il est entré avec un compte et son mot de passe. `contain` liste les mesures possibles : choisis la plus étroite qui lui retire sa porte."
z1.ada.g.again: "Ça ne règle pas le fond : le compte marche toujours. Ferme-le : `contain disable stagiaire-19`."
z1.ada.g.again.standard: "Le compte marche toujours. Il reste une mesure à prendre."
z1.ada.g.watch: "Sa prochaine commande doit échouer. Tu peux le vérifier avec `soc logs archives flow`."
z1.ada.g.watch.standard: "Vérifie dans les journaux que sa prochaine tentative est refusée."
z1.ada.g.since: "Maintenant, comprendre. Va lire la fiche de ce compte sur le serveur : `ssh kestrel@archives.lignerouge.test`."
z1.ada.g.since.standard: "Maintenant, comprendre. D'où sort ce compte ? Le serveur d'archives le sait, et tu y as un accès."
z1.ada.g.passwd: "Les comptes d'une machine sont décrits dans `/etc/passwd`. Cherche le sien : `grep stagiaire /etc/passwd`."
z1.ada.g.passwd.standard: "Les comptes d'une machine sont décrits dans un fichier de `/etc`."
z1.ada.g.year: "« Stage été 2019, fin le 30 août 2019. » Note l'année : `answer since 2019`. Et jette un œil à son dossier personnel : `cat /home/stagiaire-19/m.txt`."
z1.ada.g.year.standard: "La fiche donne l'année. Réponds avec `answer since`."
z1.ada.g.word: "Reviens sur ton poste avec `exit`. J'ai posé dans `dossier/traces` les six cartes « m. » ramassées chez nos clients depuis Pélican. Sors leurs morceaux d'un coup : `grep -r part dossier/traces`, puis réponds avec `answer word`."
z1.ada.g.word.standard: "Reviens sur ton poste. Les six cartes « m. » ramassées chez nos clients sont dans `dossier/traces`. Chacune porte un morceau."
z1.ada.g.meaning: "Réponds à ma question dans la messagerie, ou avec `answer`."
z1.ada.log: "Regarde la ligne de `stagiaire-19`. La nuit, seules nos tâches automatiques se connectent, chacune avec sa clé. Lui entre avec un mot de passe, depuis `10.30.0.199` : le boîtier de l'écran de la salle de réunion, celui qui est « en panne » depuis des semaines. Et on n'a plus de stagiaire depuis des années."
z1.ada.pack29: "Il empaquette les rapports de 2029. Verdure est dedans, avec tout ce que tu y as trouvé."
z1.ada.pack27: "2028 est empaqueté, il attaque 2027. Pélican, Corbelle, Halcyon. Coupe."
z1.ada.pack26: "Il en est à 2026. Il a tout, il ne lui reste qu'à l'envoyer. Coupe maintenant."
z1.ada.out1: "Le premier envoi vient de partir vers une adresse qui n'est pas à nous. Encore un et tout est dehors."
z1.ada.fail: "Tout est sorti : huit rapports, avec les failles de huit clients et la manière de s'en servir. On reprend. Il est entré avec un compte : c'est ce compte qu'il faut fermer, et vite."
z1.ada.block: "Ça l'arrête, pour l'instant. Mais le compte et son mot de passe marchent toujours : il lui suffit d'une autre prise, ou d'un autre boîtier."
z1.ada.isolate: "Ça l'arrête, et nous avec : plus personne ici ne peut ouvrir un rapport, et on a trois restitutions cette semaine. Seule la console des analystes y entre encore. Et le compte marche toujours."
z1.ada.account: "C'est le bon fil. Le compte est fermé, sa session est tombée."
z1.ada.account.kept: "Tu n'as rien coupé d'autre : demain matin, tout le monde travaille."
z1.ada.account.isolated: "Rends l'accès aux archives dès que possible : sans elles, personne ne prépare les restitutions."
z1.ada.stopped: "Sa commande suivante a échoué, et il a lâché prise. On ne touche pas à la machine d'où il venait : on la débranche, on la met sous scellé, c'est une preuve."
z1.ada.note: "« Vous gardez tout. » Il a raison, et c'est bien le problème. La même signature que chez NovaMind il y a trois ans."
z1.ada.since: "2019. Un stage d'été, une date de fin écrite en toutes lettres dans la fiche, et personne pour fermer le compte. On répète ça à tous nos clients depuis des années."
z1.ada.word: "st, ag, ia, ir, e-, 19. Il nous l'épelait. Une carte par mandat, la nuit après chaque rapport, et on les a rangées une par une sans jamais les poser côte à côte."
z1.ada.meaning: "Oui. Il n'a jamais eu besoin de nous suivre : il lisait nos rapports dès qu'on les rangeait. Chaque faille qu'on trouvait chez un client, il la connaissait le soir même. Et retiens l'autre moitié : on tient un compte, pas un visage."
z1.ada.done: "Cette nuit, on l'a sorti à temps. Pour les trois années d'avant, il n'y a rien à rattraper : ce qu'il a lu, il l'a lu. Ouvre le débrief, puis on écrit les règles qui auraient dû sonner."
z1.hint.cut.1: "`soc alerts` montre ce qui a sonné, `soc logs archives auth` montre qui se connecte au serveur d'archives."
z1.hint.cut.2: "Bloquer une adresse ne retire pas le mot de passe qu'il connaît. `contain` liste les mesures : l'une d'elles ferme le compte."
z1.hint.cut.3: "Tape `contain disable stagiaire-19`."
z1.hint.stop.1: "Une fois le compte fermé, tape `soc logs archives flow` : sa tentative suivante y apparaît en `deny`."
z1.hint.since.1: "Connecte-toi au serveur : `ssh kestrel@archives.lignerouge.test`, puis `grep stagiaire /etc/passwd`."
z1.hint.since.2: "Tape `answer since 2019`."
z1.hint.word.1: "Sur ton poste (tape `exit` si tu es encore sur le serveur), les cartes sont dans `dossier/traces`."
z1.hint.word.2: "`grep -r part dossier/traces` affiche les six morceaux dans l'ordre : st, ag, ia, ir, e-, 19."
z1.hint.word.3: "Tape `answer word stagiaire-19`."
z1.hint.meaning.1: "La première carte date de 2027, et un nom de compte n'est pas un nom de personne."
z1.debrief.title: "Le compte que personne n'avait fermé"
z1.debrief.lesson: "Mute n'a forcé aucune porte. Il s'est servi d'un compte de stagiaire ouvert en 2019 et jamais fermé, sur le serveur où un cabinet de sécurité range les failles de tous ses clients. Et il vous le disait depuis deux ans, un morceau à la fois."
z1.debrief.p1: "Un compte a une date de fin. Quand la personne part, le compte ferme le jour même, pas « un de ces jours »."
z1.debrief.p2: "On coupe au plus près : fermer un compte arrête l'intrus sans arrêter le cabinet. Bloquer son adresse lui laisse la clé, isoler le serveur punit tout le monde."
z1.debrief.p3: "Des indices rangés chacun dans son dossier ne disent rien. C'est en les posant côte à côte qu'on voit le motif."
z1.debrief.p4: "Attribuer, c'est relier des traces à une même main. Ce n'est pas nommer une personne : un compte utilisé ne dit pas qui tenait le clavier."
