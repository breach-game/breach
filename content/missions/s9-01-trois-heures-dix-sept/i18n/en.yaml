z1.briefing: "Monday 19 March 2029, 3:17 a.m. Your phone rings: it is Ada, and she is not asleep either. Ligne Rouge's archive server, the one keeping every client's report since 2026, has just accepted a login. Nobody works at this hour. This time, the client is you."
z1.obj.cut: "Close the door he came in through"
z1.obj.stop: "See the intruder stop"
z1.obj.since: "Say how old that account is (`answer since`)"
z1.obj.word: "Put the six parts together (`answer word`)"
z1.obj.meaning: "Say what that word changes"
z1.obj.ip: "Name the address he comes from (`answer ip`)"
z1.q.since: "In which year was that account created?"
z1.q.word: "Which word do the six parts spell, put end to end?"
z1.q.ip: "Which address does tonight's login come from?"
z1.q.meaning: "Six cards left at six clients, from 2027 to 2029, spell the name of tonight's account. What does that prove?"
z1.q.meaning.tonight: "That someone guessed the name of that account tonight, just by chance"
z1.q.meaning.tonight.why: "The first card dates from June 2027. Nobody guesses in 2029 a name they were already spelling two years earlier."
z1.q.meaning.before: "That he held that account before Pélican, and has read our reports since"
z1.q.meaning.intern: "That Mute is the intern of summer 2019, and can be named"
z1.q.meaning.intern.why: "An account name points to an account, not to a person. Anyone who found that password could have used it. Accusing someone on that alone would be a fault."
z1.contain.account: "Account stagiaire-19 disabled, its sessions closed"
z1.contain.block: "Address 10.30.0.199 blocked on the firm's network"
z1.contain.isolate: "Archive server isolated: no report can be opened, by anyone"
z1.alert.intern: "Login by an intern account"
z1.alert.intern.why: "Ligne Rouge has had no intern for years, and everyone here logs in with a key."
z1.alert.pack: "Mandate reports packed into an archive"
z1.alert.pack.why: "Nobody has a reason to pack a whole year of reports."
z1.alert.out: "Large upload to an unknown address"
z1.alert.out.why: "The archive server sends nothing outside, except to fetch its updates."
z1.ada.brief: "I will be at the office in twenty minutes, you are already at your desk. We do what we do at the clients': look before cutting. `soc sources` tells you which logs you have, `soc alerts` what rang, `contain` what you can cut. And we delete nothing."
z1.ada.g.start: "Start by seeing which logs you have: `soc sources`."
z1.ada.g.start.standard: "See which logs you have, then the SOC alerts."
z1.ada.g.alerts: "An alert just came in. Read it: `soc alerts`."
z1.ada.g.alerts.standard: "An alert just came in to the SOC."
z1.ada.g.logs: "It is happening on the archive server. See who logs in there: `soc logs archives auth`."
z1.ada.g.logs.standard: "It is happening on the archive server. See who logs in there."
z1.ada.g.cut: "He came in with an account and its password. Close that account: `contain disable stagiaire-19`."
z1.ada.g.cut.standard: "He came in with an account and its password. `contain` lists the possible measures: pick the narrowest one that takes his door away."
z1.ada.g.again: "That does not fix the root: the account still works. Close it: `contain disable stagiaire-19`."
z1.ada.g.again.standard: "The account still works. One measure is left to take."
z1.ada.g.watch: "His next command must fail. You can check with `soc logs archives flow`."
z1.ada.g.watch.standard: "Check in the logs that his next attempt is refused."
z1.ada.g.since: "Now, understanding. Go and read that account's record on the server: `ssh kestrel@archives.lignerouge.test`."
z1.ada.g.since.standard: "Now, understanding. Where does that account come from? The archive server knows, and you have access to it."
z1.ada.g.passwd: "A machine's accounts are described in `/etc/passwd`. Look for his: `grep stagiaire /etc/passwd`."
z1.ada.g.passwd.standard: "A machine's accounts are described in a file under `/etc`."
z1.ada.g.year: "\"Stage été 2019\": a summer internship, ending on 30 August 2019. Note the year: `answer since 2019`. And have a look at its home folder: `cat /home/stagiaire-19/m.txt`."
z1.ada.g.year.standard: "The record gives the year. Answer with `answer since`."
z1.ada.g.word: "Come back to your workstation with `exit`. I put in `dossier/traces` the six \"m.\" cards picked up at our clients' since Pélican. Pull their parts out in one go: `grep -r part dossier/traces`, then answer with `answer word`."
z1.ada.g.word.standard: "Come back to your workstation. The six \"m.\" cards picked up at our clients' are in `dossier/traces`. Each one carries a part."
z1.ada.g.meaning: "Answer my question in the messenger, or with `answer`."
z1.ada.log: "Look at the `stagiaire-19` line. At night only our automated jobs log in, each with its key. He comes in with a password, from `10.30.0.199`: the box behind the meeting room screen, the one that has been \"down\" for weeks. And we have had no intern for years."
z1.ada.pack29: "He is packing the 2029 reports. Verdure is in there, with everything you found."
z1.ada.pack27: "2028 is packed, he is on 2027. Pélican, Corbelle, Halcyon. Cut."
z1.ada.pack26: "He is down to 2026. He has everything, all that is left is sending it. Cut now."
z1.ada.out1: "The first upload just left for an address that is not ours. One more and everything is out."
z1.ada.fail: "Everything is out: eight reports, with the flaws of eight clients and how to use them. We start again. He came in with an account: that account is what must be closed, and fast."
z1.ada.block: "That stops him, for now. But the account and its password still work: all he needs is another socket, or another box."
z1.ada.isolate: "That stops him, and us with him: nobody here can open a report, and we have three debriefs this week. Only the analysts' console still gets in. And the account still works."
z1.ada.account: "That is the right wire. The account is closed, his session dropped."
z1.ada.account.kept: "You cut nothing else: tomorrow morning, everyone works."
z1.ada.account.isolated: "Give the archives back as soon as you can: without them, nobody can prepare the debriefs."
z1.ada.stopped: "His next command failed, and he let go. We do not touch the machine he came from: we unplug it, seal it, it is evidence."
z1.ada.note: "\"You keep everything.\" He is right, and that is the problem. The same signature as at NovaMind three years ago."
z1.ada.since: "2019. A summer internship, an end date written in full in the record, and nobody to close the account. We have been telling our clients this for years."
z1.ada.word: "st, ag, ia, ir, e-, 19. He was spelling it out for us. One card per mandate, the night after each report, and we filed them one by one without ever laying them side by side."
z1.ada.meaning: "Yes. He never needed to follow us: he read our reports as soon as we filed them. Every flaw we found at a client's, he knew that same evening. And keep the other half in mind: we hold an account, not a face."
z1.ada.done: "Tonight we got him out in time. For the three years before, there is nothing to take back: what he read, he read. Open the debrief, then we write the rules that should have rung."
z1.hint.cut.1: "`soc alerts` shows what rang, `soc logs archives auth` shows who logs in to the archive server."
z1.hint.cut.2: "Blocking an address does not take away the password he knows. `contain` lists the measures: one of them closes the account."
z1.hint.cut.3: "Type `contain disable stagiaire-19`."
z1.hint.stop.1: "Once the account is closed, type `soc logs archives flow`: his next attempt shows there as `deny`."
z1.hint.since.1: "Log in to the server: `ssh kestrel@archives.lignerouge.test`, then `grep stagiaire /etc/passwd`."
z1.hint.since.2: "Type `answer since 2019`."
z1.hint.word.1: "On your workstation (type `exit` if you are still on the server), the cards are in `dossier/traces`."
z1.hint.word.2: "`grep -r part dossier/traces` prints the six parts in order: st, ag, ia, ir, e-, 19."
z1.hint.word.3: "Type `answer word stagiaire-19`."
z1.hint.meaning.1: "The first card dates from 2027, and an account name is not a person's name."
z1.debrief.title: "The account nobody closed"
z1.debrief.lesson: "Mute forced no door. He used an intern account opened in 2019 and never closed, on the server where a security firm files the flaws of all its clients. And he had been telling you for two years, one part at a time."
z1.debrief.p1: "An account has an end date. When the person leaves, the account closes that same day, not \"one of these days\"."
z1.debrief.p2: "Cut as close as possible: closing an account stops the intruder without stopping the firm. Blocking his address leaves him the key, isolating the server punishes everyone."
z1.debrief.p3: "Clues filed each in its own folder say nothing. Laying them side by side is what shows the pattern."
z1.debrief.p4: "Attributing means tying traces to one hand. It does not mean naming a person: a used account does not say who was at the keyboard."
