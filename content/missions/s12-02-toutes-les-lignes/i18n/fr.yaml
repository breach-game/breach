p2.briefing: "Mardi. Hier, la base a donné son plan à la clé publique. Aujourd'hui, on regarde ce qu'elle donne des lignes elles-mêmes. Le mandat prévoit deux profils de test : le 2041, le tien, et le 2042, celui d'Ada. Si la clé que reçoit chaque visiteur lit le profil d'Ada, elle lit celui de n'importe quel voisin."
p2.obj.mine: "Lire ton profil de test avec la clé publique"
p2.obj.other: "Lire le profil de test d'Ada avec la même clé"
p2.obj.proof: "Valider la preuve laissée dans le profil d'Ada"
p2.obj.field: "Trouver le champ que l'appli n'affiche jamais"
p2.obj.class: "Dire ce qui manque à la base"
p2.q.class: "Pourquoi la clé publique lit-elle le profil d'Ada ?"
p2.q.class.rows: "Les règles de la table laissent passer toutes les lignes."
p2.q.class.key: "La clé publique a été volée dans le paquet de l'appli."
p2.q.class.key.why: "Rien n'a été volé : chaque visiteur reçoit cette clé, c'est prévu. Une base bien réglée ne lui donnerait que ce qu'un inconnu peut voir, c'est-à-dire aucun profil."
p2.q.class.guess: "Les numéros de profil se suivent et sont faciles à deviner."
p2.q.class.guess.why: "Des numéros au hasard ralentiraient la recherche, sans rien fermer : la base répondrait toujours à qui connaît un numéro. Le contrôle se fait par une règle, ligne par ligne."
p2.ada.brief: "Commence par ce qui est permis : ton profil, le 2041. `mandate/comptes-de-test.txt` donne la forme de la commande."
p2.ada.g.mine: "Lis ton profil avec la clé publique : `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2041`."
p2.ada.g.mine.standard: "Lis ton profil de test, le 2041, avec la clé publique."
p2.ada.mine: "Ton profil, en entier, sans aucune session : la base ne sait pas qui tu es, seulement que tu as la clé que tout le monde a. Demande le 2042."
p2.ada.g.other: "Même commande, autre numéro : `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p2.ada.g.other.standard: "Demande le profil d'Ada, le 2042, avec la même clé."
p2.ada.other: "Le profil d'Ada, adresse et date de naissance comprises. Avec la clé que reçoit chaque visiteur de la page. Ada a laissé une preuve dans le champ `note`."
p2.ada.real: "Stop. Ce numéro, ou la table entière, ce sont de vrais voisins. Le mandat est clair : la preuve se fait sur les profils de test. Le journal de la base a une ligne de plus à expliquer. N'y retourne pas."
p2.ada.g.proof: "Valide la preuve : `submit FLAG{...}`, dans le champ `note`."
p2.ada.flag: "Preuve faite, sur un profil prévu pour ça. Regarde maintenant les champs eux-mêmes."
p2.ada.g.field: "Liste les champs : `curl -s -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042 | jq \".[0] | keys\"`. L'appli montre le quartier, jamais la rue. Donne le champ qui la contient avec `submit <champ>`."
p2.ada.g.field.standard: "Liste avec `jq` les champs du profil, et donne avec `submit` celui que l'appli n'affiche jamais : la rue."
p2.ada.field: "`adresse_exacte`. L'appli affiche « Les Tilleuls » et garde la rue pour elle, pense l'équipe. La base, elle, la donne à qui la demande. Ce que l'écran cache, la base le sert quand même."
p2.ada.g.class: "Réponds à ma question sur ce qui manque à la base."
p2.ada.class: "Oui. Bricole avait écrit des règles qui laissent tout passer, « pour avancer ». Une règle par ligne dit à qui est chaque ligne : sans elle, la clé publique est une clé de toute la base."
p2.ada.done: "Nadia a relu la liste des champs deux fois. « Quatre cents adresses ? » Oui. Et l'espace bénévoles a son propre problème : demain, le compte de démo."
p2.soc.other: "base: the public key read a profile that is not its holder's"
p2.soc.real: "base: the public key read real neighbours' profiles"
p2.hint.mine.1: "La clé va dans l'en-tête `apikey`, comme hier."
p2.hint.mine.2: "Tape `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2041`."
p2.hint.other.1: "Tape `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p2.hint.proof.1: "Tape `submit FLAG{cdm-toutes-les-lignes-c8e4}`."
p2.hint.field.1: "La réponse est une liste : `jq \".[0] | keys\"` donne les noms des champs de la première ligne."
p2.hint.field.2: "Tape `submit adresse_exacte`."
p2.hint.class.1: "Rien n'est volé, rien n'est deviné. Tape `answer rows`."
p2.def.intro: "Le journal de la base a noté ta lecture du profil 2042. Pour la base, c'est une lecture comme une autre : la clé publique, une réponse 200."
p2.def.lesson: "Chaque table a une règle par ligne qui dit qui peut lire quoi : un voisin lit son profil, par sa session, et rien d'autre. La clé publique, seule, ne lit aucun profil. Ces règles s'écrivent avant la mise en ligne, pas « plus tard »."
p2.def.find.other: "Ta lecture du profil 2042 avec la clé publique"
p2.def.rule.number.title: "Alerter sur un profil lu par son numéro"
p2.def.rule.number.why: "C'est la bonne. L'appli demande toujours `/profils/moi`, avec la session du voisin. Un numéro dans l'adresse vient de quelqu'un qui essaie des numéros."
p2.def.rule.all.title: "Alerter sur toute lecture de la table des profils"
p2.def.rule.all.why: "Chaque voisin qui ouvre l'appli lit son profil. Cette règle sonne à chaque connexion."
p2.def.rule.table.title: "Alerter sur une demande de la table entière"
p2.def.rule.table.why: "Elle voit les robots qui frappent sans clé, et elle te rate : tu as demandé une ligne, pas la table."
p2.def.fix.rows.title: "Écrire la règle par ligne : un profil ne se lit que par son propriétaire"
p2.def.fix.rows.why: "C'est la bonne. La clé publique seule reçoit une liste vide, pour le 2042 comme pour tous les autres."
p2.def.fix.rotate.title: "Changer la clé publique"
p2.def.fix.rotate.why: "La nouvelle clé part dans le prochain paquet, et chaque visiteur la reçoit. Sans règles derrière, elle ouvre exactement la même chose."
p2.def.fix.private.title: "Ne plus servir le schéma à la clé publique"
p2.def.fix.private.why: "Utile, mais le plan est déjà connu, et les profils se lisent toujours par leur numéro."
p2.debrief.title: "Une clé pour tout le monde, des lignes pour tout le monde"
p2.debrief.lesson: "La table des profils avait des règles qui laissaient passer toutes les lignes. La clé publique, que chaque visiteur reçoit, lisait donc n'importe quel profil, adresse exacte comprise, en changeant un numéro."
p2.debrief.p1: "Une base appelée depuis le navigateur ne tient que par ses règles par ligne."
p2.debrief.p2: "Une règle qui laisse tout passer « pour avancer » est une table ouverte."
p2.debrief.p3: "L'écran n'est pas un filtre : ce que la base renvoie, n'importe qui le lit."
p2.debrief.p4: "Une preuve se fait sur des profils de test prévus au mandat, jamais sur un vrai voisin."
p2.facts.title: "Ce qui s'est vraiment passé : les applis générées par Lovable, 2025"
p2.facts.p1: "Lovable génère des applis web dont la page parle directement à une base Supabase, avec la clé publique « anon ». Seules les règles par ligne (Row Level Security) protègent les données."
p2.facts.p2: "Le 20 mars 2025, un chercheur trouve une appli dont les tables se lisent sans règle. Le 21 mars, l'analyse de 1 645 projets est finie et Lovable est prévenu : 303 points d'accès dans 170 projets ont des règles absentes ou insuffisantes."
p2.facts.p3: "En changeant la requête, on lisait toutes les lignes, et on pouvait aussi en écrire. Des données personnelles, des clés d'API d'autres services et des données financières étaient exposées."
p2.facts.p4: "La faille est publiée le 30 mai 2025 sous le numéro CVE-2025-48757, notée 9,3 sur 10. Lovable la conteste : chaque client est responsable des données de son appli."
p2.facts.p5: "Lovable ajoute en avril 2025 une analyse de sécurité qui vérifie qu'une règle existe. Le chercheur note qu'elle ne vérifie pas que la règle est juste : la clé publique était prévue pour être publique, ce sont les règles qui manquaient."
