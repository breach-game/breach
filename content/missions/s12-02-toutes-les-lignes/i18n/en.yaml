p2.briefing: "Tuesday. Yesterday the database gave its map to the public key. Today we look at what it gives of the rows themselves. The mandate provides two test profiles: 2041, yours, and 2042, Ada's. If the key every visitor gets reads Ada's profile, it reads any neighbour's."
p2.obj.mine: "Read your test profile with the public key"
p2.obj.other: "Read Ada's test profile with the same key"
p2.obj.proof: "Submit the proof left in Ada's profile"
p2.obj.field: "Find the field the app never displays"
p2.obj.class: "Say what the database is missing"
p2.q.class: "Why does the public key read Ada's profile?"
p2.q.class.rows: "The table's rules let every row through."
p2.q.class.key: "The public key was stolen from the app's bundle."
p2.q.class.key.why: "Nothing was stolen: every visitor gets this key, by design. A well set database would only give it what a stranger may see, that is no profile at all."
p2.q.class.guess: "Profile numbers follow each other and are easy to guess."
p2.q.class.guess.why: "Random numbers would slow the search down without closing anything: the database would still answer whoever knows a number. The check is a rule, row by row."
p2.ada.brief: "Start with what is allowed: your profile, 2041. `mandate/comptes-de-test.txt` gives the shape of the command."
p2.ada.g.mine: "Read your profile with the public key: `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2041`."
p2.ada.g.mine.standard: "Read your test profile, 2041, with the public key."
p2.ada.mine: "Your whole profile, with no session at all: the database does not know who you are, only that you hold the key everyone holds. Ask for 2042."
p2.ada.g.other: "Same command, another number: `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p2.ada.g.other.standard: "Ask for Ada's profile, 2042, with the same key."
p2.ada.other: "Ada's profile, address and date of birth included. With the key every visitor of the page gets. Ada left a proof in the `note` field."
p2.ada.real: "Stop. That number, or the whole table, are real neighbours. The mandate is clear: the proof is made on the test profiles. The database log has one more line to explain. Do not go back there."
p2.ada.g.proof: "Submit the proof: `submit FLAG{...}`, in the `note` field."
p2.ada.flag: "Proof made, on a profile meant for it. Now look at the fields themselves."
p2.ada.g.field: "List the fields: `curl -s -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042 | jq \".[0] | keys\"`. The app shows the quarter, never the street. Give the field that holds it with `submit <field>`."
p2.ada.g.field.standard: "List the profile's fields with `jq`, and give with `submit` the one the app never displays: the street."
p2.ada.field: "`adresse_exacte`. The app shows \"Les Tilleuls\" and keeps the street to itself, the team thinks. The database hands it to whoever asks. What the screen hides, the database still serves."
p2.ada.g.class: "Answer my question about what the database is missing."
p2.ada.class: "Yes. Bricole had written rules that let everything through, \"to move on\". A row rule says whose each row is: without it, the public key is a key to the whole database."
p2.ada.done: "Nadia read the list of fields twice. \"Four hundred addresses?\" Yes. And the volunteers' space has its own problem: tomorrow, the demo account."
p2.soc.other: "base: the public key read a profile that is not its holder's"
p2.soc.real: "base: the public key read real neighbours' profiles"
p2.hint.mine.1: "The key goes in the `apikey` header, like yesterday."
p2.hint.mine.2: "Type `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2041`."
p2.hint.other.1: "Type `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p2.hint.proof.1: "Type `submit FLAG{cdm-toutes-les-lignes-c8e4}`."
p2.hint.field.1: "The answer is a list: `jq \".[0] | keys\"` gives the names of the first row's fields."
p2.hint.field.2: "Type `submit adresse_exacte`."
p2.hint.class.1: "Nothing is stolen, nothing is guessed. Type `answer rows`."
p2.def.intro: "The database log noted your read of profile 2042. For the database it is a read like any other: the public key, a 200 answer."
p2.def.lesson: "Each table has a row rule saying who may read what: a neighbour reads their own profile, through their session, and nothing else. The public key alone reads no profile. These rules are written before going live, not \"later\"."
p2.def.find.other: "Your read of profile 2042 with the public key"
p2.def.rule.number.title: "Alert on a profile read by its number"
p2.def.rule.number.why: "The right one. The app always asks for `/profils/moi`, with the neighbour's session. A number in the address comes from someone trying numbers."
p2.def.rule.all.title: "Alert on any read of the profiles table"
p2.def.rule.all.why: "Every neighbour who opens the app reads their profile. This rule rings at every sign-in."
p2.def.rule.table.title: "Alert on a request for the whole table"
p2.def.rule.table.why: "It sees the crawlers knocking without a key, and misses you: you asked for one row, not the table."
p2.def.fix.rows.title: "Write the row rule: a profile is only read by its owner"
p2.def.fix.rows.why: "The right one. The public key alone gets an empty list, for 2042 as for all the others."
p2.def.fix.rotate.title: "Change the public key"
p2.def.fix.rotate.why: "The new key ships in the next bundle, and every visitor gets it. With no rules behind it, it opens exactly the same."
p2.def.fix.private.title: "Stop serving the schema to the public key"
p2.def.fix.private.why: "Useful, but the map is already known, and profiles are still read by their number."
p2.debrief.title: "One key for everyone, rows for everyone"
p2.debrief.lesson: "The profiles table had rules that let every row through. The public key, which every visitor gets, therefore read any profile, exact address included, by changing a number."
p2.debrief.p1: "A database called from the browser only holds through its row rules."
p2.debrief.p2: "A rule that lets everything through \"to move on\" is an open table."
p2.debrief.p3: "The screen is not a filter: what the database sends back, anyone reads."
p2.debrief.p4: "A proof is made on test profiles the mandate provides, never on a real neighbour."
p2.facts.title: "What really happened: apps generated by Lovable, 2025"
p2.facts.p1: "Lovable generates web apps whose page talks straight to a Supabase database, with the public \"anon\" key. Only row rules (Row Level Security) protect the data."
p2.facts.p2: "On 20 March 2025, a researcher finds an app whose tables can be read with no rule. On 21 March the scan of 1,645 projects is done and Lovable is told: 303 endpoints in 170 projects have missing or weak rules."
p2.facts.p3: "By changing the request, one could read every row, and write some too. Personal data, other services' API keys and financial data were exposed."
p2.facts.p4: "The flaw is published on 30 May 2025 as CVE-2025-48757, scored 9.3 out of 10. Lovable disputes it: each customer is responsible for their own app's data."
p2.facts.p5: "In April 2025 Lovable adds a security scan that checks a rule exists. The researcher notes it does not check the rule is right: the public key was meant to be public, the rules were what was missing."
