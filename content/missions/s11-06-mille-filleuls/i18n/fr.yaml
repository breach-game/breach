c6.briefing: "Samedi, 2 h 32. Inès t'a gardé pour le week-end et elle a bien fait. Le programme de parrainage de Comptoir donne dix euros au parrain et dix euros au filleul à chaque compte ouvert. Cette nuit, l'équipe marketing a reçu une alerte de budget : plus de deux mille euros de primes en une heure. Tu es côté défense. `soc` lit les journaux de la passerelle, `flag` montre les réglages du programme."
c6.obj.code: "Trouver le code de parrainage utilisé"
c6.obj.cut: "Arrêter la série sans éteindre le parrainage"
c6.obj.class: "Dire ce qui n'est pas normal"
c6.obj.story: "Remettre l'histoire dans l'ordre"
c6.obj.money: "Décider du sort des primes versées"
c6.alert.claims: "Un même code de parrainage réclamé en série"
c6.alert.claims.why: "Un client parraine un ami de temps en temps. Pas un par minute."
c6.q.code: "Quel code de parrainage reçoit tous ces filleuls ?"
c6.q.class: "Chaque requête de cette nuit est valide. Qu'est-ce qui ne l'est pas ?"
c6.q.class.flow: "Le rythme et le volume du parcours entier."
c6.q.class.request: "Une requête mal formée, cachée parmi les autres."
c6.q.class.request.why: "Relis le journal : inscription, code 201, réclamation, code 200. Rien de mal formé, rien de refusé. Si tu cherches la requête fautive, tu ne trouveras jamais."
c6.q.class.password: "Le mot de passe du compte parrain, volé."
c6.q.class.password.why: "Le parrain utilise son propre compte, ouvert avec sa pièce d'identité. Personne n'a rien volé à personne. C'est le règlement du programme qui est exploité, pas un compte."
c6.q.money: "Inès : « Il a 2 120 euros de primes, et un virement de 2 100 programmé à 6 h. On fait quoi ? »"
c6.q.money.hold: "Geler le compte parrain et son virement, puis déclarer la fraude."
c6.q.money.hold.why: "L'argent reste chez Comptoir, et le parrain a ouvert son compte avec une pièce d'identité : il y a quelqu'un à qui poser des questions. Les 212 comptes filleuls restent ouverts le temps de l'enquête."
c6.q.money.sweep: "Geler, et fermer cette nuit les 212 comptes filleuls."
c6.q.money.sweep.why: "C'est net. Mais ces comptes ont été ouverts avec 212 pièces d'identité différentes : certaines sont sûrement volées à de vraies personnes, qu'il faudra prévenir. Fermer à 3 heures du matin sans relecture efface aussi des preuves."
c6.q.money.absorb: "Laisser partir le virement, et corriger pour la suite."
c6.q.money.absorb.why: "Pas de vague cette nuit. 2 100 euros sont perdus, et quelqu'un vient d'apprendre que ça paie : il reviendra, chez Comptoir ou ailleurs, avec la même méthode."
c6.tl.text: "Remets dans l'ordre l'histoire du code LUNE42"
c6.tl.opened: "Le compte parrain est ouvert, identité vérifiée"
c6.tl.tested: "Deux filleuls par jour, à la main, aux heures de bureau"
c6.tl.run: "Un filleul par minute, en pleine nuit"
c6.tl.transfer: "Un virement des primes vers l'extérieur est programmé"
c6.ada.brief: "Bonsoir. Regarde ce que la passerelle enregistre : `soc sources`, puis `soc alerts`."
c6.ada.g.code: "Commence par `soc sources`, puis `soc alerts`, puis lis le journal : `soc logs api access`. Le code de parrainage est dans le chemin des lignes `claim`. Réponds avec `answer code <code>`."
c6.ada.g.code.standard: "Lis les alertes et le journal `access` de l'API. Un code de parrainage revient sans cesse. Réponds avec `answer code`."
c6.ada.code: "LUNE42. Regarde le motif : une inscription, une réclamation, une autre adresse, une inscription, une réclamation. Tout répond 201 et 200. Aucune de ces lignes ne ferait lever un sourcil. Les règles de la semaine cherchaient une requête anormale, et ici il n'y en a pas."
c6.ada.c3: "Trois filleuls de plus pendant que tu lis. Chacun rapporte vingt euros : dix au nouveau compte, dix au parrain. `flag list` te montre les réglages du programme."
c6.ada.s6: "Ça continue, et le virement vers l'extérieur approche. Arrête la série : `flag set parrainage.plafond-jour on`."
c6.ada.fail: "Le virement est parti : 2 100 euros de primes sont sortis de la banque. On reprend à 2 h 32."
c6.ada.captcha: "Les inscriptions demandent maintenant de recopier une image. Regarde le journal : elles continuent. Ceux qui font ça paient quelques centimes par image à des gens qui les recopient. Et tous les vrais clients vont devoir le faire aussi."
c6.ada.off: "Plus de parrainage pour personne. La série s'arrête, et les milliers de clients honnêtes qui comptaient sur leurs dix euros aussi. Le marketing t'appellera lundi."
c6.ada.cap: "Cinq filleuls par parrain et par jour. Personne de réel n'en parraine davantage, et LUNE42 a dépassé le plafond depuis longtemps. Les vrais parrains ne s'apercevront de rien."
c6.ada.g.cut: "Regarde les réglages : `flag list`. Le plus juste : `flag set parrainage.plafond-jour on`."
c6.ada.g.cut.standard: "`flag list` montre trois réglages. Choisis celui qui arrête la série sans gêner les vrais clients."
c6.ada.stopped.off: "La série s'arrête, mais tout le parrainage avec elle, et l'objectif était de le garder ouvert. Rallume-le, avec un réglage qui n'arrête que la série : `flag list`."
c6.ada.reopened: "Le parrainage est rouvert, et le réglage tient : la série ne reprend pas. Une question avant la suite."
c6.ada.stopped: "La passerelle refuse la réclamation suivante. La série est arrêtée. Une question avant la suite."
c6.ada.g.class: "Réponds à ma question : qu'est-ce qui n'est pas normal cette nuit ?"
c6.ada.class: "Oui. Aucune requête n'est fausse, c'est le parcours entier qui n'a rien d'humain : personne n'a 212 amis qui ouvrent un compte la même nuit avec le même téléphone. Ça ne se détecte pas en regardant une ligne. Ça se détecte en connaissant son métier : combien de filleuls a un vrai parrain ? L'équipe d'Inès a exporté l'histoire du compte : `dossier/parrain.txt`."
c6.ada.g.story: "Lis `cat dossier/parrain.txt`, puis `timeline nuit` pour voir les événements à ordonner. Réponds avec `timeline nuit opened tested run transfer`."
c6.ada.g.story.standard: "Lis `dossier/parrain.txt`, puis remets les événements dans l'ordre avec `timeline nuit`."
c6.ada.story: "Trois semaines. Il a ouvert un vrai compte, essayé à la main pendant huit jours pour voir si quelqu'un regardait, et personne ne regardait. Alors il a branché un programme. Les deux filleuls par jour étaient déjà le signal : l'attaque a commencé le 10, pas cette nuit."
c6.ada.g.money: "Réponds à Inès : c'est une décision, aucune option n'est fausse et chacune a un prix."
c6.ada.money: "C'est noté au rapport, avec le reste : le plafond était prévu dans le cahier des charges du programme, et retiré avant le lancement « pour ne pas brider la croissance »."
c6.ada.done: "Une semaine chez Comptoir. Une vieille version que tout le monde croyait éteinte, un contrôle oublié, un compteur éteint, un outil trop serviable, une comparaison trop souple, et un programme sans plafond. Personne n'a cassé de chiffrement, et aucune de ces failles n'était nouvelle : elles sont dans la même liste depuis des années. Inès t'a écrit : « Lundi, je fais afficher cette liste dans l'open space. » La prochaine fois que ton appli de banque te demandera une mise à jour, tu sauras pourquoi elle insiste."
c6.hint.code.1: "`soc logs api access` : cherche les lignes `POST /v2/referrals/.../claim` qui se répètent."
c6.hint.code.2: "Tape `answer code LUNE42`."
c6.hint.cut.1: "`flag list` montre trois réglages. Le captcha ne les arrête pas, éteindre le programme punit tout le monde."
c6.hint.cut.2: "Tape `flag set parrainage.plafond-jour on`."
c6.hint.class.1: "Toutes les lignes répondent 200 ou 201. Ce qui cloche, c'est l'ensemble. Tape `answer flow`."
c6.hint.story.1: "`cat dossier/parrain.txt` donne les dates. `timeline nuit` liste les événements."
c6.hint.story.2: "Tape `timeline nuit opened tested run transfer`."
c6.hint.money.1: "Aucune réponse n'est fausse. Tape `answer hold`, `answer sweep` ou `answer absorb`."
c6.debrief.title: "Quand chaque requête est valide"
c6.debrief.lesson: "Personne n'a rien forcé. Quelqu'un a lu le règlement du parrainage, a compris qu'il n'avait pas de plafond, a essayé doucement pendant huit jours, puis a automatisé. La parade ne se trouve pas dans un pare-feu : elle se trouve dans une règle du métier, cinq filleuls par jour."
c6.debrief.p1: "Tout parcours qui donne de l'argent ou de la valeur a une limite fixée par le métier : par compte, par jour, par appareil."
c6.debrief.p2: "On surveille le parcours entier (inscription, prime, virement), pas seulement chaque requête."
c6.debrief.p3: "Les essais timides des jours précédents sont le vrai début de l'attaque : un compteur par code les aurait montrés."
c6.debrief.p4: "Un captcha gêne les clients plus que les fraudeurs. Il ne remplace pas une limite."
