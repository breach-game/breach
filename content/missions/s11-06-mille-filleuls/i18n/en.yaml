c6.briefing: "Saturday, 2.32 am. Inès kept you for the weekend, and she was right to. Comptoir's referral programme gives ten euros to the sponsor and ten to the friend for each account opened. Tonight the marketing team got a budget alert: more than two thousand euros of bonuses in one hour. You are on the defence side. `soc` reads the gateway's logs, `flag` shows the programme's settings."
c6.obj.code: "Find the referral code being used"
c6.obj.cut: "Stop the run without switching referrals off"
c6.obj.class: "Say what is not normal"
c6.obj.story: "Put the story back in order"
c6.obj.money: "Decide what happens to the bonuses paid"
c6.alert.claims: "One referral code claimed in a run"
c6.alert.claims.why: "A customer refers a friend now and then. Not one a minute."
c6.q.code: "Which referral code is getting all these friends?"
c6.q.class: "Every request tonight is valid. What is not?"
c6.q.class.flow: "The pace and volume of the whole journey."
c6.q.class.request: "One malformed request, hidden among the others."
c6.q.class.request.why: "Read the log again: sign-up, code 201, claim, code 200. Nothing malformed, nothing refused. If you look for the faulty request, you will never find it."
c6.q.class.password: "The sponsor account's password, stolen."
c6.q.class.password.why: "The sponsor uses their own account, opened with their identity document. Nobody stole anything from anyone. The programme's rules are being exploited, not an account."
c6.q.money: "Inès: \"They have 2,120 euros of bonuses, and a transfer of 2,100 scheduled for 6 am. What do we do?\""
c6.q.money.hold: "Freeze the sponsor account and its transfer, then report the fraud."
c6.q.money.hold.why: "The money stays at Comptoir, and the sponsor opened their account with an identity document: there is someone to ask questions. The 212 friend accounts stay open for the investigation."
c6.q.money.sweep: "Freeze, and close the 212 friend accounts tonight."
c6.q.money.sweep.why: "It is clean. But those accounts were opened with 212 different identity documents: some are surely stolen from real people, who will have to be told. Closing at 3 am with no review also erases evidence."
c6.q.money.absorb: "Let the transfer go, and fix things for next time."
c6.q.money.absorb.why: "No waves tonight. 2,100 euros are lost, and someone has just learnt that it pays: they will be back, at Comptoir or elsewhere, with the same method."
c6.tl.text: "Put the story of code LUNE42 back in order"
c6.tl.opened: "The sponsor account is opened, identity checked"
c6.tl.tested: "Two friends a day, by hand, at office hours"
c6.tl.run: "One friend a minute, in the middle of the night"
c6.tl.transfer: "A transfer of the bonuses to the outside is scheduled"
c6.ada.brief: "Good evening. Look at what the gateway records: `soc sources`, then `soc alerts`."
c6.ada.g.code: "Start with `soc sources`, then `soc alerts`, then read the log: `soc logs api access`. The referral code is in the path of the `claim` lines. Answer with `answer code <code>`."
c6.ada.g.code.standard: "Read the alerts and the API's `access` log. One referral code keeps coming back. Answer with `answer code`."
c6.ada.code: "LUNE42. Look at the pattern: a sign-up, a claim, another address, a sign-up, a claim. Everything answers 201 and 200. None of these lines would raise an eyebrow. This week's rules looked for an abnormal request, and here there is none."
c6.ada.c3: "Three more friends while you were reading. Each is worth twenty euros: ten to the new account, ten to the sponsor. `flag list` shows you the programme's settings."
c6.ada.s6: "It goes on, and the transfer to the outside is getting close. Stop the run: `flag set parrainage.plafond-jour on`."
c6.ada.fail: "The transfer has gone: 2,100 euros of bonuses left the bank. We start again at 2.32 am."
c6.ada.captcha: "Sign-ups now ask you to copy an image. Look at the log: they carry on. The people doing this pay a few cents per image to people who copy them. And every real customer will have to do it too."
c6.ada.off: "No more referrals for anyone. The run stops, and so do the thousands of honest customers who were counting on their ten euros. Marketing will call you on Monday."
c6.ada.cap: "Five friends per sponsor per day. Nobody real refers more than that, and LUNE42 went past the cap long ago. Real sponsors will notice nothing."
c6.ada.g.cut: "Look at the settings: `flag list`. The most accurate: `flag set parrainage.plafond-jour on`."
c6.ada.g.cut.standard: "`flag list` shows three settings. Choose the one that stops the run without bothering real customers."
c6.ada.stopped.off: "The run stops, but so does the whole referral programme, and the objective was to keep it open. Switch it back on, with a setting that stops only the run: `flag list`."
c6.ada.reopened: "The programme is open again, and the setting holds: the run does not resume. One question before what comes next."
c6.ada.stopped: "The gateway refuses the next claim. The run is stopped. One question before we go on."
c6.ada.g.class: "Answer my question: what is not normal tonight?"
c6.ada.class: "Yes. No request is wrong; the whole journey is simply not human: nobody has 212 friends opening an account the same night with the same phone. You do not detect that by looking at one line. You detect it by knowing the business: how many friends does a real sponsor have? Inès's team exported the account's history: `dossier/parrain.txt`."
c6.ada.g.story: "Read `cat dossier/parrain.txt`, then `timeline nuit` to see the events to put in order. Answer with `timeline nuit opened tested run transfer`."
c6.ada.g.story.standard: "Read `dossier/parrain.txt`, then put the events in order with `timeline nuit`."
c6.ada.story: "Three weeks. They opened a real account, tried by hand for eight days to see whether anyone was watching, and nobody was. So they plugged in a program. The two friends a day were already the signal: the attack began on the 10th, not tonight."
c6.ada.g.money: "Answer Inès: it is a decision, no option is wrong and each has a price."
c6.ada.money: "Noted in the report, with the rest: the cap was in the programme's original specification, and removed before launch \"so as not to hold growth back\"."
c6.ada.done: "One week at Comptoir. An old version everyone believed was off, a forgotten check, a counter switched off, a tool too eager to help, a comparison too loose, and a programme with no cap. Nobody broke any encryption, and none of these flaws was new: they have been on the same list for years. Inès wrote to you: \"On Monday I am having that list put up in the open-plan office.\" Next time your banking app asks you to update, you will know why it insists."
c6.hint.code.1: "`soc logs api access`: look for the `POST /v2/referrals/.../claim` lines that repeat."
c6.hint.code.2: "Type `answer code LUNE42`."
c6.hint.cut.1: "`flag list` shows three settings. The captcha does not stop them, switching the programme off punishes everyone."
c6.hint.cut.2: "Type `flag set parrainage.plafond-jour on`."
c6.hint.class.1: "Every line answers 200 or 201. What is wrong is the whole. Type `answer flow`."
c6.hint.story.1: "`cat dossier/parrain.txt` gives the dates. `timeline nuit` lists the events."
c6.hint.story.2: "Type `timeline nuit opened tested run transfer`."
c6.hint.money.1: "No answer is wrong. Type `answer hold`, `answer sweep` or `answer absorb`."
c6.debrief.title: "When every request is valid"
c6.debrief.lesson: "Nobody forced anything. Someone read the referral rules, understood there was no cap, tried gently for eight days, then automated. The defence is not in a firewall: it is in a business rule, five friends a day."
c6.debrief.p1: "Any journey that gives out money or value has a limit set by the business: per account, per day, per device."
c6.debrief.p2: "Watch the whole journey (sign-up, bonus, transfer), not only each request."
c6.debrief.p3: "The timid tries of the days before are the real start of the attack: a counter per code would have shown them."
c6.debrief.p4: "A captcha bothers customers more than fraudsters. It does not replace a limit."
