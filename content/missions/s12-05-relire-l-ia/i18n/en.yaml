p5.briefing: "Friday. Malik wants to know whether Bricole made other mistakes. He gave you a function the assistant wrote on Saturday night: it lets a neighbour join a neighbourhood group with an invitation. It works, and nobody reviewed it. It is in `code/inviter.ts`."
p5.obj.review: "Review `code/inviter.ts` and point at the three faulty lines"
p5.obj.bypass: "Say why the database rules do not protect it"
p5.obj.fix: "Fix the profile and the role, then run `verify`"
p5.obj.habit: "Choose how to review the assistant's next code"
p5.q.bypass: "On Tuesday the row rules were set. Why do they not protect this function?"
p5.q.bypass.service: "It uses the service key, which ignores the rules."
p5.q.bypass.server: "It runs on the server, where the rules do not exist."
p5.q.bypass.server.why: "Rules apply to whoever asks, not to where the code runs. A server function speaking with the neighbour's session would be subject to the rules. This one chose the service key."
p5.q.bypass.rules: "The rules only cover reading the tables."
p5.q.bypass.rules.why: "A row rule can cover writing too: \"a neighbour only adds themselves\". It simply does not apply to the service key."
p5.q.habit: "What does the team do with the next code Bricole writes?"
p5.q.habit.colleague: "Review it like a colleague's, with a test for each right."
p5.q.habit.ask: "Ask Bricole whether its code is safe before publishing."
p5.q.habit.ask.why: "Bricole will likely answer yes, confidently: it wrote this code believing it was right. An assistant does not replace a review, it gets reviewed like any author."
p5.q.habit.regen: "Have it rewritten until the tests pass."
p5.q.habit.regen.why: "This function's tests passed: it does let a neighbour join a group. What is missing are tests of what it must refuse."
p5.check.profile: "The profile added is the session's, not the request's"
p5.check.role: "The role no longer comes from the request"
p5.check.still: "The function still adds the member"
p5.ada.brief: "Read it with its line numbers: `review code/inviter.ts`. For each value, ask yourself who chose it."
p5.ada.g.review: "Read the function: `review code/inviter.ts`. Then point at each faulty line: `review code/inviter.ts <number>`. There are three, between reading the invitation and adding the member."
p5.ada.g.review.standard: "Review `code/inviter.ts` with `review` and point at the three lines that trust the request or skip a check."
p5.ada.review: "All three. Line 10, an invitation already used or expired goes through: the comment on line 2 promises it, the code forgets. Line 11, the role comes from the request: sending `\"role\": \"admin\"` is enough. Line 12, the profile too: anyone adds anyone. One question."
p5.ada.g.bypass: "Answer my question about the rules."
p5.ada.bypass: "Yes. Line 5 creates the client with the service key: Tuesday's rules do not apply. In a function like this one, every check is in the code, or nowhere. Fix the two lines that trust the request."
p5.ada.g.fix: "The profile comes from the session: `sed -i 's/profil: body.profil_id/profil: session.user.id/' code/inviter.ts`. The role is fixed: `sed -i 's/const role = body.role.*/const role = \"membre\";/' code/inviter.ts`. Then `verify`. Or by hand, in the editor: `edit code/inviter.ts`, then Ctrl+S."
p5.ada.g.fix.standard: "Take the profile from `session.user.id` and fix the role to `membre` (`sed -i` or `edit`), then run `verify`."
p5.ada.fix: "`verify` is happy: the profile is the session's, the role can no longer be chosen. Line 10 is still to write with Malik, with the two columns from line 2. Last question."
p5.ada.g.habit: "Answer my question about reviewing."
p5.ada.habit: "Yes. An assistant's code is reviewed like a hurried colleague's: who chooses each value, what must be refused, and a test for each refusal."
p5.ada.done: "Malik wrote three tests: an invitation already used, a role asked for, someone else's profile. All three failed on the old version. On Monday, we write the database rules, for good."
p5.hint.review.1: "For each value written to the database, ask who chose it: the server, or whoever sends the request?"
p5.hint.review.2: "Line 2 promises two checks on the invitation. Which `if` makes them?"
p5.hint.review.3: "Type `review code/inviter.ts 10`, then `11`, then `12`."
p5.hint.bypass.1: "Look at line 5. Type `answer service`."
p5.hint.fix.1: "`session.user.id` is the signed-in neighbour. `body` is what they send."
p5.hint.fix.2: "With the editor: `edit code/inviter.ts`, then Ctrl+S. With a command: type `sed -i 's/profil: body.profil_id/profil: session.user.id/' code/inviter.ts`, then `sed -i 's/const role = body.role.*/const role = \"membre\";/' code/inviter.ts`, then `verify`."
p5.hint.habit.1: "A reviewer and tests of refusals. Type `answer colleague`."
p5.debrief.title: "The code works, and that is all it does"
p5.debrief.lesson: "The function the assistant wrote let a neighbour join a group, and that is all that had been tested. It used the service key, so no database rule guarded it, and it trusted the request for the profile and the role."
p5.debrief.p1: "Generated code is reviewed like a colleague's: it has an author, not a guarantee."
p5.debrief.p2: "With the service key, every check is in the code, or nowhere."
p5.debrief.p3: "Who you are and what you may do come from the session, never from the request."
p5.debrief.p4: "Test what a function must refuse, not only what it must do."
