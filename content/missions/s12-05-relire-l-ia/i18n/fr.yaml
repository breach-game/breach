p5.briefing: "Vendredi. Malik veut savoir si Bricole a fait d'autres erreurs. Il t'a donné une fonction que l'assistant a écrite samedi soir : elle fait entrer un voisin dans un groupe de quartier avec une invitation. Elle marche, et personne ne l'a relue. Elle est dans `code/inviter.ts`."
p5.obj.review: "Relire `code/inviter.ts` et désigner les trois lignes fautives"
p5.obj.bypass: "Dire pourquoi les règles de la base ne protègent pas ici"
p5.obj.fix: "Corriger le profil et le rôle, puis lancer `verify`"
p5.obj.habit: "Choisir comment relire le prochain code de l'assistant"
p5.q.bypass: "Mardi, les règles par ligne ont été réglées. Pourquoi ne protègent-elles pas cette fonction ?"
p5.q.bypass.service: "Elle utilise la clé de service, qui ignore les règles."
p5.q.bypass.server: "Elle tourne sur le serveur, où les règles n'existent pas."
p5.q.bypass.server.why: "Les règles s'appliquent à qui demande, pas à l'endroit où tourne le code. Une fonction serveur qui parlerait avec la session du voisin serait soumise aux règles. Celle-ci a choisi la clé de service."
p5.q.bypass.rules: "Les règles ne portent que sur la lecture des tables."
p5.q.bypass.rules.why: "Une règle par ligne peut porter sur l'écriture aussi : « un voisin n'ajoute que lui-même ». Elle ne joue simplement pas pour la clé de service."
p5.q.habit: "Que fait l'équipe du prochain code que Bricole écrit ?"
p5.q.habit.colleague: "Le relire comme celui d'un collègue, avec un test par droit."
p5.q.habit.ask: "Demander à Bricole si son code est sûr avant de le publier."
p5.q.habit.ask.why: "Bricole répondra probablement oui, avec assurance : il avait écrit ce code en croyant bien faire. Un assistant ne remplace pas une relecture, il se relit comme n'importe quel auteur."
p5.q.habit.regen: "Le faire réécrire jusqu'à ce que les tests passent."
p5.q.habit.regen.why: "Les tests de cette fonction passaient : elle fait bien entrer un voisin dans un groupe. Ce qui manque, ce sont les tests de ce qu'elle doit refuser."
p5.check.profile: "Le profil ajouté est celui de la session, pas celui de la requête"
p5.check.role: "Le rôle ne vient plus de la requête"
p5.check.still: "La fonction ajoute toujours le membre"
p5.ada.brief: "Lis-la avec ses numéros de ligne : `review code/inviter.ts`. Pour chaque valeur, demande-toi qui l'a choisie."
p5.ada.g.review: "Lis la fonction : `review code/inviter.ts`. Puis désigne chaque ligne fautive : `review code/inviter.ts <numéro>`. Il y en a trois, entre la lecture de l'invitation et l'ajout du membre."
p5.ada.g.review.standard: "Relis `code/inviter.ts` avec `review` et désigne les trois lignes qui croient la requête ou oublient un contrôle."
p5.ada.review: "Les trois. Ligne 10, une invitation déjà utilisée ou expirée passe : le commentaire de la ligne 2 le promet, le code l'oublie. Ligne 11, le rôle vient de la requête : il suffit d'envoyer `\"role\": \"admin\"`. Ligne 12, le profil aussi : n'importe qui fait entrer n'importe qui. Une question."
p5.ada.g.bypass: "Réponds à ma question sur les règles."
p5.ada.bypass: "Oui. La ligne 5 crée le client avec la clé de service : les règles de mardi ne s'appliquent pas. Dans une fonction comme celle-là, chaque contrôle est dans le code, ou nulle part. Corrige les deux lignes qui croient la requête."
p5.ada.g.fix: "Le profil vient de la session : `sed -i 's/profil: body.profil_id/profil: session.user.id/' code/inviter.ts`. Le rôle est fixé : `sed -i 's/const role = body.role.*/const role = \"membre\";/' code/inviter.ts`. Puis `verify`."
p5.ada.g.fix.standard: "Fais venir le profil de `session.user.id` et fixe le rôle à `membre` (`sed -i` ou `edit`), puis lance `verify`."
p5.ada.fix: "`verify` est content : le profil est celui de la session, le rôle ne se choisit plus. La ligne 10 reste à écrire avec Malik, avec les deux colonnes de la ligne 2. Dernière question."
p5.ada.g.habit: "Réponds à ma question sur la relecture."
p5.ada.habit: "Oui. Le code d'un assistant se relit comme celui d'un collègue pressé : qui choisit chaque valeur, qu'est-ce qui doit être refusé, et un test pour chaque refus."
p5.ada.done: "Malik a écrit trois tests : une invitation déjà utilisée, un rôle demandé, le profil d'un autre. Les trois échouaient sur l'ancienne version. Lundi, on écrit les règles de la base, pour de bon."
p5.hint.review.1: "Pour chaque valeur écrite dans la base, demande-toi qui l'a choisie : le serveur, ou celui qui envoie la requête ?"
p5.hint.review.2: "La ligne 2 promet deux contrôles sur l'invitation. Lequel des `if` les fait ?"
p5.hint.review.3: "Tape `review code/inviter.ts 10`, puis `11`, puis `12`."
p5.hint.bypass.1: "Regarde la ligne 5. Tape `answer service`."
p5.hint.fix.1: "`session.user.id` est le voisin connecté. `body` est ce qu'il envoie."
p5.hint.fix.2: "Tape `sed -i 's/profil: body.profil_id/profil: session.user.id/' code/inviter.ts`, puis `sed -i 's/const role = body.role.*/const role = \"membre\";/' code/inviter.ts`, puis `verify`."
p5.hint.habit.1: "Un relecteur et des tests de refus. Tape `answer colleague`."
p5.debrief.title: "Le code marche, c'est tout ce qu'il fait"
p5.debrief.lesson: "La fonction écrite par l'assistant faisait entrer un voisin dans un groupe, et c'est tout ce qui avait été testé. Elle utilisait la clé de service, donc aucune règle de la base ne la gardait, et elle croyait la requête sur le profil et sur le rôle."
p5.debrief.p1: "Du code généré se relit comme le code d'un collègue : il a un auteur, pas une garantie."
p5.debrief.p2: "Avec la clé de service, chaque contrôle est dans le code, ou nulle part."
p5.debrief.p3: "Qui on est et ce qu'on a le droit de faire viennent de la session, jamais de la requête."
p5.debrief.p4: "On teste ce qu'une fonction doit refuser, pas seulement ce qu'elle doit faire."
