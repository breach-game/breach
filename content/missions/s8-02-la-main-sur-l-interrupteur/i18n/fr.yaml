v2.briefing: "Mardi. Hier tu as écouté. Nour a lu ton compte rendu et a posé la seule question qui compte : « D'accord, on nous entend. Est-ce qu'on peut aussi nous parler ? » Dans MQTT, un ordre est un message comme un autre, publié dans un sujet qui finit par `set`. Le mandat est clair : tu n'en donnes qu'au banc d'essai de l'atelier, la serre 0. Les serres 1, 2 et 3 nourrissent des enfants."
v2.obj.bench: "Écouter le banc d'essai (serre 0)"
v2.obj.order: "Allumer la lampe du banc, sans compte"
v2.obj.flag: "Envoyer le témoin d'audit"
v2.obj.review: "Trouver la ligne fautive de `dossier/acl.conf`"
v2.obj.fix: "Dire quelle correction ferme la faille"
v2.q.fix: "N'importe qui peut donner un ordre aux lampes. Quelle correction règle le problème ?"
v2.q.fix.tls: "Chiffrer tous les échanges avec le courtier (TLS), capteurs et lampes compris"
v2.q.fix.tls.why: "Le chiffrement empêche d'écouter et de modifier en route. Il ne dit rien sur qui a le droit de donner un ordre : un ordre chiffré envoyé par n'importe qui reste un ordre obéi."
v2.q.fix.rights: "Donner à chaque client le droit d'écrire sur ses seuls sujets"
v2.q.fix.night.why: "Les lampes s'allument et s'éteignent la nuit, c'est leur métier. Et celui qui veut nuire attendra le matin."
v2.q.fix.night: "Refuser tous les ordres envoyés pendant la nuit"
v2.ada.brief: "Commence par regarder ce que tu vas toucher. Écoute le banc d'essai, et seulement lui : `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.ada.g.bench: "Écoute le banc d'essai : `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.ada.g.bench.standard: "Écoute les sujets du banc d'essai, la serre 0."
v2.ada.bench: "La lampe du banc est éteinte. Son état est dans `lampe/state`. Juste à côté, il y a forcément un sujet `lampe/set` : c'est là que l'automate écrit pour l'allumer."
v2.ada.g.order: "Publie l'ordre, comme le ferait l'automate : `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.ada.g.order.standard: "Publie un ordre sur le sujet `set` de la lampe du banc, avec `mqtt pub`."
v2.ada.g.on: "Elle était déjà éteinte. Allume-la : `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.ada.g.on.standard: "Elle était déjà éteinte. Envoie l'ordre inverse."
v2.ada.order: "La lampe du banc est allumée. Tu n'es ni l'automate, ni un capteur, ni personne : le courtier a transmis ton message parce qu'il était bien formé. Remplace 0 par 2 dans le sujet et tu éteins le basilic. On ne le fera pas."
v2.ada.rooms: "Stop. Ça, c'était une serre en production. La copie d'audit n'a rien changé, heureusement, mais ton ordre est dans le journal du courtier et le mandat l'interdit noir sur blanc. La preuve se fait sur le banc, nulle part ailleurs."
v2.ada.g.flag: "Le banc a répondu avec un témoin d'audit. Envoie-le : `submit` suivi du flag."
v2.ada.g.flag.standard: "Envoie le flag."
v2.ada.flag: "Preuve faite, sur une lampe qui n'éclaire rien. Nour t'a remis le fichier de droits du courtier : regarde pourquoi il t'a laissé faire."
v2.ada.g.review: "Lis le fichier de droits avec ses numéros de ligne : `review dossier/acl.conf`. Puis désigne la ligne fautive : `review dossier/acl.conf <numéro>`. Il n'y en a qu'une."
v2.ada.g.review.standard: "Relis `dossier/acl.conf` avec `review` et désigne la ligne qui a tout ouvert."
v2.ada.review: "C'est elle. Tout le fichier est soigné : chaque capteur écrit ses mesures, seul l'automate donne des ordres, l'écran ne fait que lire. Mais tout en haut, avant le premier compte, une ligne « en attendant » vaut pour tous les clients, anonymes compris, et donne tout à tout le monde. Elle date de 2019. Le provisoire est ce qui dure le plus longtemps."
v2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
v2.ada.answer.standard: "Réponds à ma question."
v2.ada.fix: "Oui. Un capteur n'écrit que ses mesures, l'automate est le seul à écrire dans les sujets `set`. Si quelqu'un vole le compte d'un capteur, il peut mentir sur une température, pas éteindre une serre."
v2.ada.done: "Deux trouvailles en deux jours, et la ferme ne s'en est pas aperçue. Ouvre le débrief. Demain, on regarde comment les capteurs se mettent à jour."
v2.soc.order: "broker: an unknown client published an order to the test bench"
v2.soc.rooms: "broker: an unknown client published an order to a growing room"
v2.hint.bench.1: "Tape `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.hint.order.1: "`mqtt pub -h <machine> -t <sujet> -m <message>` publie un message. Le sujet de l'ordre est `verdure/serre/0/lampe/set`."
v2.hint.order.2: "Tape `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.hint.flag.1: "Le flag est dans la réponse du banc d'essai. Tape `submit` suivi du flag."
v2.hint.review.1: "`review dossier/acl.conf` affiche le fichier avec ses numéros de ligne."
v2.hint.review.2: "Cherche la ligne qui ne nomme aucun client et qui couvre tous les sujets."
v2.hint.review.3: "Tape `review dossier/acl.conf 3`."
v2.debrief.title: "Un message bien formé suffit"
v2.debrief.lesson: "Le courtier transmet un ordre à qui que ce soit qui le publie. Les droits par sujet existaient, bien écrits, et une dernière ligne « provisoire » les annulait tous. La preuve a été faite sur le banc d'essai : dans une serre, le même message aurait éteint une récolte."
v2.debrief.p1: "Chaque client a des droits par sujet : un capteur écrit ses mesures, l'automate seul écrit les ordres, les écrans lisent."
v2.debrief.p2: "Une règle qui donne tout à tout le monde annule celles qui la précèdent. On relit un fichier de droits par sa ligne la plus large."
v2.debrief.p3: "Un automate ne devrait pas obéir à une consigne absurde, d'où qu'elle vienne : des bornes sur la température ou la durée d'extinction limitent les dégâts."
v2.debrief.p4: "Quand un essai peut toucher au monde physique, on le fait sur un banc. Une preuve n'a pas besoin d'une vraie récolte."
