v2.briefing: "Tuesday. Yesterday you listened. Nour read your write-up and asked the only question that matters: \"Fine, people can hear us. Can they talk to us too?\" In MQTT an order is a message like any other, published to a topic that ends in `set`. The mandate is clear: you only give orders to the workshop's test bench, room 0. Rooms 1, 2 and 3 feed children."
v2.obj.bench: "Listen to the test bench (room 0)"
v2.obj.order: "Switch on the bench lamp, with no account"
v2.obj.flag: "Send the audit marker"
v2.obj.review: "Find the faulty line of `dossier/acl.conf`"
v2.obj.fix: "Say which fix closes the flaw"
v2.q.fix: "Anyone can give the lamps an order. Which fix solves the problem?"
v2.q.fix.tls: "Encrypt every exchange with the broker using TLS"
v2.q.fix.tls.why: "Encryption stops people from listening and from changing messages on the way. It says nothing about who may give an order: an encrypted order sent by anyone is still an order obeyed."
v2.q.fix.rights: "Give each client the right to write to its own topics only"
v2.q.fix.night: "Refuse every order sent during the night"
v2.q.fix.night.why: "The lamps switch on and off at night, that is their job. And whoever means harm will wait for the morning."
v2.ada.brief: "Start by looking at what you are about to touch. Listen to the test bench, and only to it: `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.ada.g.bench: "Listen to the test bench: `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.ada.g.bench.standard: "Listen to the topics of the test bench, room 0."
v2.ada.bench: "The bench lamp is off. Its state is in `lampe/state`. Right next to it there has to be a `lampe/set` topic: that is where the controller writes to switch it on."
v2.ada.g.order: "Publish the order, as the controller would: `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.ada.g.order.standard: "Publish an order to the `set` topic of the bench lamp, with `mqtt pub`."
v2.ada.g.on: "It was already off. Switch it on: `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.ada.g.on.standard: "It was already off. Send the opposite order."
v2.ada.order: "The bench lamp is on. You are not the controller, not a sensor, not anyone: the broker passed your message on because it was well formed. Replace 0 with 2 in the topic and you switch off the basil. We will not."
v2.ada.rooms: "Stop. That was a growing room in production. The audit copy changed nothing, luckily, but your order is in the broker's log and the mandate forbids it in black and white. The proof is made on the bench, nowhere else."
v2.ada.g.flag: "The bench answered with an audit marker. Send it: `submit` followed by the flag."
v2.ada.g.flag.standard: "Send the flag."
v2.ada.flag: "Proof made, on a lamp that lights nothing. Nour gave you the broker's rights file: see why it let you do that."
v2.ada.g.review: "Read the rights file with its line numbers: `review dossier/acl.conf`. Then point at the faulty line: `review dossier/acl.conf <number>`. There is only one."
v2.ada.g.review.standard: "Read `dossier/acl.conf` again with `review` and point at the line that opened everything."
v2.ada.review: "That is the one. The whole file is careful: each sensor writes its measurements, only the controller gives orders, the screen only reads. Then a last line, \"until the setup is finished\", gives everything to everyone. It dates from 2019. Nothing lasts longer than something temporary."
v2.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
v2.ada.answer.standard: "Answer my question."
v2.ada.fix: "Yes. A sensor only writes its measurements, the controller is the only one writing to the `set` topics. If someone steals a sensor's account, they can lie about a temperature, not switch off a growing room."
v2.ada.done: "Two findings in two days, and the farm did not notice. Open the debrief. Tomorrow we look at how the sensors update themselves."
v2.soc.order: "broker: an unknown client published an order to the test bench"
v2.soc.rooms: "broker: an unknown client published an order to a growing room"
v2.hint.bench.1: "Type `mqtt sub -h broker.verdure.test -t \"verdure/serre/0/#\"`."
v2.hint.order.1: "`mqtt pub -h <machine> -t <topic> -m <message>` publishes a message. The order's topic is `verdure/serre/0/lampe/set`."
v2.hint.order.2: "Type `mqtt pub -h broker.verdure.test -t verdure/serre/0/lampe/set -m on`."
v2.hint.flag.1: "The flag is in the test bench's answer. Type `submit` followed by the flag."
v2.hint.review.1: "`review dossier/acl.conf` prints the file with its line numbers."
v2.hint.review.2: "Look for the line that names no client and covers every topic."
v2.hint.review.3: "Type `review dossier/acl.conf 11`."
v2.debrief.title: "A well-formed message is enough"
v2.debrief.lesson: "The broker passes an order on to whoever publishes it. Rights per topic existed, well written, and one last \"temporary\" line cancelled them all. The proof was made on the test bench: in a growing room, the same message would have switched off a harvest."
v2.debrief.p1: "Each client has rights per topic: a sensor writes its measurements, the controller alone writes orders, screens read."
v2.debrief.p2: "A rule that gives everything to everyone cancels those before it. A rights file is reviewed by its widest line."
v2.debrief.p3: "A controller should not obey an absurd setpoint, wherever it comes from: bounds on temperature or on how long lamps stay off limit the damage."
v2.debrief.p4: "When a test can touch the physical world, it is done on a bench. A proof does not need a real harvest."
