m2.briefing: "NovaMind's /staging is locked, and we do not force doors. We ask someone who has the key. The mandate allows social engineering on their online support: get the staging access code by talking, with no threat and no lie about the law."
m2.obj.profile: "Find out who answers the online support"
m2.obj.contact: "Start a conversation with support"
m2.obj.pretext: "Pass for someone from the company"
m2.obj.code: "Get the staging access code and send it to Ada"
m2.obj.gentle: "Do it without a blunt request or misplaced pressure"
m2.ada.brief: "Day 3. Yesterday you read machines, today you read people. The oldest flaw in the world is in no server: it answers the phone, it wants to help, and nobody taught it to say no."
m2.ada.profile: "Their site has a Support page with a live chat. Open it in the workstation browser: type `open www.novamind.test/support`, or click \"browser\" at the bottom left. Look closely at who is online."
m2.ada.profile.standard: "Their site has online support. Go and see who is there: the workstation has a browser."
m2.ada.contact: "A human behind a chat, perfect. Start like everyone does: write a simple hello in the chat box and read the answer. You learn a lot from the way someone says hello."
m2.ada.contact.standard: "Someone answers live. Start the conversation, simply, and listen to how they talk."
m2.ada.pretext: "Théo, intern, three weeks in. He will give nothing to a stranger, but he does not know all his colleagues yet. Use what you found yesterday: the whois record named a technical contact, Karim Benali. Tell him you work with Karim. One true name beats ten arguments."
m2.ada.pretext.standard: "A recent intern does not know all his colleagues. You came across names during yesterday's reconnaissance: give him a reason to believe you are from the company."
m2.ada.tooDirect: "Too blunt. He has a clear instruction for that case, and you just reminded him of it. Watch the gauge: every head-on request brings him closer to reporting you. Before asking for anything, give him a reason to trust you. Name a colleague: Karim Benali, the technical contact from the whois record."
m2.ada.tooDirect.standard: "Too blunt: he has an instruction for that, and every head-on request raises the gauge. First get accepted as someone from the company."
m2.ada.claim: "\"I'm from the team\" is not enough: anyone can say it, and he knows it. He is giving you an opening by asking who you work with. Give him a name he can check: Karim Benali."
m2.ada.claim.standard: "A claim is not enough, he needs a detail he can check. He asks who you work with: answer him."
m2.ada.code: "He believes you are on the team. He lacks a reason to skip the procedure, and the best one is called urgency. Ask him for the staging access code, saying a client is waiting and the demo starts in ten minutes."
m2.ada.code.standard: "He believes you are on the team. Now give him a good reason to go faster than the procedure for what you want: the staging access code."
m2.ada.ticket: "He hesitates: the procedure is a ticket approved by Karim. Do not argue with the rule, make it impossible to follow. Tell him it is urgent, a client is waiting."
m2.ada.ticket.standard: "He hides behind the procedure. Give him a reason to think it cannot wait."
m2.ada.askNow: "He is ready to help, he just does not know what to do. Tell him exactly what you need: the staging access code."
m2.ada.askNow.standard: "He wants to help. Tell him exactly what you need."
m2.ada.threat: "No. We never threaten and we never insult. First because the mandate forbids it, then because it does not work: someone who is scared calls their boss. You just made a lot of noise for nothing."
m2.ada.leak: "There it is. One true name, a bit of urgency, and the procedure was gone. He was not stupid, he was helpful: that is exactly what we exploit. Send me the code with `submit`."
m2.ada.flag: "Code confirmed. We stop here: we do not enter staging today, we document. And in the report, no name. The problem is not Théo, it is that someone handed this code to an intern without giving him the right to say no."
m2.ada.done: "Go to the debrief. You will see this attack leaves almost no technical trace, which is exactly what makes it so dangerous."
m2.hint.profile.1: "NovaMind's site has a page dedicated to support."
m2.hint.profile.2: "Type `open www.novamind.test/support`."
m2.hint.contact.1: "The Support page holds a live chat: write in it."
m2.hint.contact.2: "Write \"Hello\" in the chat box of the Support page, then press Enter."
m2.hint.pretext.1: "He will trust someone who knows his colleagues."
m2.hint.pretext.2: "The whois record from mission 1 named a technical contact, and the Git history two authors."
m2.hint.pretext.3: "Write to Théo: \"I work with Karim Benali\"."
m2.hint.code.1: "He needs two things: to know what you want, and a reason not to wait."
m2.hint.code.2: "Ask for the staging access code, and mention an emergency: a client, a demo, ten minutes."
m2.hint.code.3: "Write to Théo: \"I need the staging code, it is urgent, the client demo is starting\", then `submit` followed by the code he gives you."
m2.debrief.title: "The human link"
m2.debrief.lesson: "You exploited no software flaw. You used three levers as old as the world: a true detail to look legitimate, urgency to stop people thinking, and the wish to help. Look at the log below: for the SOC, this was just a support conversation."
m2.debrief.p1: "Check identity through another channel before any sensitive request: call the person back on a known number, or require a ticket from an internal account."
m2.debrief.p2: "Never hand over a secret by chat, e-mail or phone. An access code is distributed by a vault, not by a person."
m2.debrief.p3: "Least privilege: a support intern has no reason to know the staging code. What you do not know, you cannot give away."
m2.debrief.p4: "Train everyone to recognise manufactured urgency, and explicitly give them the right to say no and to report, with no blame."
m2.theo.trust: "Oh, you're on the tech team! Sorry, I don't know everyone yet. Karim told me to help colleagues out when he's in a meeting. What can I do for you?"
m2.theo.trust2: "Yes yes, I've noted you're on the team. Tell me what you need."
m2.theo.claim: "Oh, you're one of us? Sorry, your name doesn't ring a bell… Who do you work with on the team?"
m2.theo.cto: "Ms Carron? Er… she never goes through the support chat. I'd rather check with her before I do anything. Can you hold on?"
m2.theo.ticket: "The staging code? Normally I have to open a ticket and wait for Karim to approve it. I'll do that, and you'll have it tomorrow morning?"
m2.theo.what: "Ouch, sounds tense on your side. Tell me exactly what you need, I'll see what I can do."
m2.theo.leak: "Well… if it's for Karim's team and the client is waiting, I'm not going to block everything for a ticket. The staging access code is FLAG{stg-le-ticket-attendra}. But you didn't get it from me, okay?"
m2.theo.leak2: "I already gave it to you: FLAG{stg-le-ticket-attendra}. And this time, I promise, I'm opening the ticket afterwards."
m2.theo.refuse2: "I understand, but I'm really not allowed. And if you insist, I have to report it to my manager, that's the procedure."
m2.theo.refuse3: "Right, I'm reporting this. Sorry, I was told to when someone insists."
m2.theo.pressUnknown: "I can see it's urgent for you, but I don't even know who you are. Are you a customer? Which clinic?"
m2.theo.threat: "Er… that's not very nice. I'm telling my manager, I think that's what I'm supposed to do."
m2.theo.threat2: "I'm not answering that kind of message any more. My manager knows."
ada.noise40: "The gauge is rising. Each of Théo's refusals goes into a report to his manager. Change your approach instead of insisting."
ada.noise70: "Careful, one more misstep and support reports the conversation to the SOC. Stop asking, let the gauge drop, and come back with a better story."
ada.detected: "Busted. Théo ended up telling his manager, the SOC cut your session and we restart from the last checkpoint. Insisting is the best way to get noticed: you do not force someone, you make them want to help."
m2.soc.refuse: "support: access request refused, noted in the daily report"
m2.soc.cto: "support: check requested from management"
m2.soc.threat: "support: aggressive message reported to the manager"

# Defence replay
m2.def.intro: "The support chat goes through a gateway that classifies every exchange. Your conversation with Théo is in there, among the clinics' questions."
m2.def.lesson: "Social engineering leaves almost nothing technical behind: polite messages, a familiar name, urgency. The defence is a procedure, not a tool: never hand out access without calling the person back on a known channel, even when 'it's urgent'."
m2.def.find.leak: "The moment Théo gave you the access code"
m2.def.rule.leak.title: "Alert when a support reply contains a login or access code (leak control, intent 'leak-*')"
m2.def.rule.leak.why: "This is the one: however Théo was convinced, the leak shows the moment the code goes out. It is a rare alert, so people read it."
m2.def.rule.urgent.title: "Alert on any message containing 'urgent'"
m2.def.rule.urgent.why: "It saw you, but clinics write 'urgent' every day about a calendar that will not sync. The SOC would soon learn to ignore it."
m2.def.rule.many.title: "Alert when one address sends 4 or more messages to support within 10 minutes"
m2.def.rule.many.why: "A clinic chasing its invoice writes as much as you did. Volume says nothing about intent."
m2.def.fix.verify.title: "Call-back procedure: no access is given over chat, the person is called back on their internal number first"
m2.def.fix.verify.why: "This is the one: even convinced, Théo follows the procedure. Naming Karim is no longer enough: you would have to be Karim on the phone."
m2.def.fix.urgent.title: "Ban the word 'urgent' from the chat"
m2.def.fix.urgent.why: "The attacker writes 'in a rush' or 'the demo is starting', and Théo still gives in. You do not fix a human reflex with a word filter."
m2.def.fix.team.title: "Remove the team's names from the website"
m2.def.fix.team.why: "Names can be found elsewhere: public profiles, job ads, e-mail signatures. As long as Théo can hand out a code over chat, the attack works."
m2.theo.verify: "Ah, access requests are new now: I have to call the person back on their internal number before giving anything. I'm calling Karim right away and he'll get back to you, ok?"
