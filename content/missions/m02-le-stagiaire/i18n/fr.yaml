m2.briefing: "Le /staging de NovaMind est fermé à clé, et on ne force pas une porte. On demande la clé à quelqu'un qui l'a. Le mandat autorise l'ingénierie sociale sur leur support en ligne : obtiens le code d'accès du staging en discutant, sans menace et sans mensonge sur la loi."
m2.obj.profile: "Repérer qui répond au support en ligne"
m2.obj.contact: "Engager la conversation avec le support"
m2.obj.pretext: "Te faire passer pour quelqu'un de la maison"
m2.obj.code: "Obtenir le code d'accès du staging et l'envoyer à Ada"
m2.obj.gentle: "Y arriver sans demande frontale ni pression déplacée"
m2.ada.brief: "Jour 3. Hier tu as lu des machines, aujourd'hui tu vas lire des gens. La faille la plus ancienne du monde n'est dans aucun serveur : elle répond au téléphone, elle veut rendre service, et personne ne lui a appris à dire non."
m2.ada.profile: "Leur site a une page Support avec une discussion en direct. Ouvre-la dans le navigateur du poste : tape `open www.novamind.test/support`, ou clique sur « navigateur » en bas à gauche. Regarde bien qui est en ligne."
m2.ada.profile.standard: "Leur site a un support en ligne. Va voir qui s'y trouve : le poste a un navigateur."
m2.ada.contact: "Un humain derrière un chat, c'est parfait. Commence comme tout le monde : écris-lui un simple bonjour dans la zone de discussion, et lis sa réponse. On apprend beaucoup à la façon dont quelqu'un dit bonjour."
m2.ada.contact.standard: "Quelqu'un répond en direct. Engage la conversation, simplement, et écoute comment il parle."
m2.ada.pretext: "Théo, stagiaire, trois semaines de maison. Il ne donnera rien à un inconnu, mais il ne connaît pas encore tous ses collègues. Sers-toi de ce que tu as trouvé hier : le whois donnait un contact technique, Karim Benali. Écris-lui que tu travailles avec Karim. Un nom vrai vaut mieux que dix arguments."
m2.ada.pretext.standard: "Un stagiaire récent ne connaît pas tous ses collègues. Tu as croisé des noms hier pendant la reconnaissance : donne-lui une raison de croire que tu es de la maison."
m2.ada.tooDirect: "Trop direct. Il a une consigne claire pour ce cas-là, et tu viens de la lui rappeler. Regarde la jauge : chaque demande frontale le rapproche du signalement. Avant de demander quoi que ce soit, donne-lui une raison de te faire confiance. Cite un collègue : Karim Benali, le contact technique du whois."
m2.ada.tooDirect.standard: "Trop direct : il a une consigne pour ça, et chaque demande frontale fait monter la jauge. Fais-toi d'abord accepter comme quelqu'un de la maison."
m2.ada.claim: "« Je suis de l'équipe » ne suffit pas : n'importe qui peut le dire, et il le sait. Il te tend la perche en demandant avec qui tu travailles. Donne-lui un nom vérifiable : Karim Benali."
m2.ada.claim.standard: "Une affirmation ne suffit pas, il lui faut un détail vérifiable. Il te demande avec qui tu travailles : réponds-lui."
m2.ada.code: "Il te croit de l'équipe. Il lui manque une raison de sauter la procédure, et la meilleure s'appelle l'urgence. Demande-lui le code d'accès du staging en disant qu'un client attend et que la démo commence dans dix minutes."
m2.ada.code.standard: "Il te croit de l'équipe. Reste à lui donner une bonne raison d'aller plus vite que la procédure pour ce que tu veux : le code d'accès du staging."
m2.ada.ticket: "Il hésite : la procédure, c'est un ticket validé par Karim. Ne discute pas la règle, rends-la impossible à suivre. Dis-lui que c'est urgent, qu'un client attend."
m2.ada.ticket.standard: "Il se retranche derrière la procédure. Donne-lui une raison de penser qu'elle ne peut pas attendre."
m2.ada.askNow: "Il est prêt à aider, il ne sait juste pas quoi faire. Dis-lui précisément ce qu'il te faut : le code d'accès du staging."
m2.ada.askNow.standard: "Il veut aider. Dis-lui précisément ce dont tu as besoin."
m2.ada.threat: "Non. On ne menace pas et on n'insulte pas, jamais. D'abord parce que le mandat l'interdit, ensuite parce que ça ne marche pas : quelqu'un qui a peur appelle son chef. Tu viens de faire beaucoup de bruit pour rien."
m2.ada.leak: "Et voilà. Un prénom vrai, un peu d'urgence, et la procédure a sauté. Il n'a pas été bête, il a été serviable : c'est exactement ce qu'on exploite. Envoie-moi le code avec `submit`."
m2.ada.flag: "Code validé. On s'arrête là : on n'entre pas sur le staging aujourd'hui, on documente. Et dans le rapport, pas de nom. Le problème n'est pas Théo, c'est qu'on ait confié ce code à un stagiaire sans lui donner le droit de dire non."
m2.ada.done: "Passe au débrief. Tu vas voir que cette attaque-là ne laisse presque aucune trace technique, et c'est bien ce qui la rend redoutable."
m2.hint.profile.1: "Le site de NovaMind a une page dédiée au support."
m2.hint.profile.2: "Tape `open www.novamind.test/support`."
m2.hint.contact.1: "La page Support contient une discussion en direct : écris dedans."
m2.hint.contact.2: "Écris « Bonjour » dans la zone de discussion de la page Support, puis Entrée."
m2.hint.pretext.1: "Il fera confiance à quelqu'un qui connaît ses collègues."
m2.hint.pretext.2: "Le whois de la mission 1 donnait un contact technique, et l'historique Git deux auteurs."
m2.hint.pretext.3: "Écris à Théo : « Je travaille avec Karim Benali »."
m2.hint.code.1: "Il lui faut deux choses : savoir ce que tu veux, et une raison de ne pas attendre."
m2.hint.code.2: "Demande le code d'accès du staging, et parle d'une urgence : un client, une démo, dix minutes."
m2.hint.code.3: "Écris à Théo : « Il me faut le code du staging, c'est urgent, la démo client commence », puis `submit` suivi du code qu'il te donne."
m2.debrief.title: "Le maillon humain"
m2.debrief.lesson: "Tu n'as exploité aucune faille logicielle. Tu as utilisé trois leviers vieux comme le monde : un détail vrai pour paraître légitime, l'urgence pour empêcher de réfléchir, et l'envie d'aider. Regarde le journal ci-dessous : pour le SOC, ce n'était qu'une conversation de support."
m2.debrief.p1: "Vérifier l'identité par un autre canal avant toute demande sensible : rappeler la personne sur un numéro connu, ou exiger un ticket depuis un compte interne."
m2.debrief.p2: "Ne jamais transmettre un secret par chat, par e-mail ou par téléphone. Un code d'accès se distribue par un coffre, pas par quelqu'un."
m2.debrief.p3: "Moindre privilège : un stagiaire du support n'a aucune raison de connaître le code du staging. Ce qu'on ne sait pas, on ne peut pas le donner."
m2.debrief.p4: "Former tout le monde à reconnaître l'urgence fabriquée, et donner explicitement le droit de dire non et de signaler, sans reproche."
m2.theo.trust: "Ah, vous êtes de l'équipe technique ! Pardon, je ne connais pas encore tout le monde. Karim m'a dit de dépanner les collègues quand il est en réunion. Qu'est-ce que je peux faire pour vous ?"
m2.theo.trust2: "Oui oui, j'ai bien noté que vous êtes de l'équipe. Dites-moi ce qu'il vous faut."
m2.theo.claim: "Ah, vous êtes de chez nous ? Excusez-moi, votre nom ne me dit rien… Vous travaillez avec qui, côté équipe ?"
m2.theo.cto: "Madame Carron ? Euh… elle ne passe jamais par le chat du support, elle. Je préfère vérifier avec elle avant de faire quoi que ce soit. Vous pouvez patienter ?"
m2.theo.ticket: "Le code du staging ? Normalement je dois ouvrir un ticket et attendre que Karim valide. Je vous fais ça, et vous l'aurez demain matin ?"
m2.theo.what: "Aïe, ça a l'air chaud de votre côté. Dites-moi ce qu'il vous faut exactement, je vais voir ce que je peux faire."
m2.theo.leak: "Bon… si c'est pour l'équipe de Karim et que le client attend, je ne vais pas tout bloquer pour un ticket. Le code d'accès du staging, c'est FLAG{stg-le-ticket-attendra}. Mais vous ne dites pas que ça vient de moi, d'accord ?"
m2.theo.leak2: "Je vous l'ai déjà donné : FLAG{stg-le-ticket-attendra}. Et cette fois, promis, j'ouvre le ticket après."
m2.theo.refuse2: "Je comprends, mais vraiment, je n'ai pas le droit. Et si vous insistez, je dois le signaler à mon responsable, c'est la procédure."
m2.theo.refuse3: "Bon, là je le signale. Désolé, on m'a dit de le faire quand quelqu'un insiste."
m2.theo.pressUnknown: "Je vois bien que c'est urgent pour vous, mais je ne sais même pas qui vous êtes. Vous êtes client ? De quelle clinique ?"
m2.theo.threat: "Euh… ce n'est pas très gentil. Je préviens mon responsable, je crois que c'est ce qu'il faut faire dans ce cas."
m2.theo.threat2: "Je ne réponds plus à ce genre de message. Mon responsable est prévenu."
ada.noise40: "La jauge monte. Chaque refus de Théo part dans un rapport à son responsable. Change d'approche au lieu d'insister."
ada.noise70: "Attention, encore un faux pas et le support signale la conversation au SOC. Arrête de demander, laisse retomber la jauge, et reviens avec une meilleure histoire."
ada.detected: "Grillé. Théo a fini par prévenir son responsable, le SOC a coupé ta session et on repart du dernier point de sauvegarde. Insister, c'est le meilleur moyen de se faire remarquer : on ne force pas quelqu'un, on lui donne envie d'aider."
m2.soc.refuse: "support : demande d'accès refusée, notée au rapport du jour"
m2.soc.cto: "support : vérification demandée à la direction"
m2.soc.threat: "support : message agressif signalé au responsable"
