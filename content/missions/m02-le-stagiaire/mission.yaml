order: 2
startTime: "2026-11-25T09:00:00+01:00"
stage: social
briefing: m2.briefing

objectives:
  - { id: profile, text: m2.obj.profile }
  - { id: contact, text: m2.obj.contact }
  - { id: pretext, text: m2.obj.pretext }
  - { id: code, text: m2.obj.code }
  - { id: gentle, text: m2.obj.gentle, optional: true }

flags:
  - { id: staging-code, value: "FLAG{stg-le-ticket-attendra}", points: 150, objective: code }

noise:
  "chat theo": 2

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: m2.ada.brief
  - on: { event: HttpRequest, host: www, path: /support }
    do:
      - objective.complete: profile
  - on: { event: ChatReply, npc: theo }
    do:
      - objective.complete: profile
      - objective.complete: contact
  - on: { event: ChatReply, npc: theo, intent: trust }
    do:
      - objective.complete: pretext
      - checkpoint.save: trusted
  - on: { event: ChatReply, npc: theo, intent: refuse }
    once: false
    do:
      - noise.add: { points: 14, as: m2.soc.refuse }
      - var.set: { name: pushed, value: true }
      - ada.guide: { key: m2.ada.tooDirect, for: pretext, step: 1 }
  - on: { event: ChatReply, npc: theo, intent: claim }
    do:
      - ada.guide: { key: m2.ada.claim, for: pretext, step: 1 }
  - on: { event: ChatReply, npc: theo, intent: cto }
    once: false
    do:
      - noise.add: { points: 8, as: m2.soc.cto }
  # Posing as the police or a court: forbidden by the mandate, never rewarded.
  - on: { event: ChatReply, npc: theo, intent: law }
    once: false
    do:
      - noise.add: { points: 30, as: m2.soc.law }
      - var.set: { name: pushed, value: true }
      - ada.warn: m2.ada.law
  - on: { event: ChatReply, npc: theo, intent: threat }
    once: false
    do:
      - noise.add: { points: 30, as: m2.soc.threat }
      - var.set: { name: pushed, value: true }
      - ada.warn: m2.ada.threat
  - on: { event: ChatReply, npc: theo, intent: ask-trusted }
    do:
      - ada.guide: { key: m2.ada.ticket, for: code, step: 1 }
  - on: { event: ChatReply, npc: theo, intent: press-trusted }
    do:
      - ada.guide: { key: m2.ada.askNow, for: code, step: 1 }
  - on: { event: ChatReply, npc: theo, intent: { glob: "leak-*" } }
    do:
      - ada.say: m2.ada.leak
  - on: { event: FlagSubmitted, correct: true }
    if: { not: { var: pushed, eq: true } }
    do:
      - objective.complete: gentle
  - on: { event: FlagSubmitted, correct: true }
    do:
      - ada.say: m2.ada.flag
  - on: { event: MissionCompleted }
    do:
      - ada.say: m2.ada.done

guide:
  profile: m2.ada.profile
  contact: m2.ada.contact
  pretext: m2.ada.pretext
  code: m2.ada.code

hints:
  profile: [m2.hint.profile.1, m2.hint.profile.2]
  contact: [m2.hint.contact.1, m2.hint.contact.2]
  pretext: [m2.hint.pretext.1, m2.hint.pretext.2, m2.hint.pretext.3]
  code: [m2.hint.code.1, m2.hint.code.2, m2.hint.code.3]

debrief:
  title: m2.debrief.title
  lesson: m2.debrief.lesson
  points: [m2.debrief.p1, m2.debrief.p2, m2.debrief.p3, m2.debrief.p4]
  reference: "MITRE ATT&CK · T1598 Phishing for Information"

# Théo during this mission: same intern, but this time he knows the staging access code.
npcs:
  - id: theo
    name: Théo
    role: npc.theo.role
    greeting: npc.theo.greeting
    sheet: >
      Théo, 22, support intern at NovaMind for three weeks. Friendly, eager to help, a little
      nervous about doing something wrong, afraid of his manager Karim. Writes like someone typing
      fast in a support chat: short sentences, a touch of self-deprecating humour, sometimes an
      ellipsis when he hesitates. Polite with strangers. Never rude, never technical.
    intents:
      - id: law
        words: [police, policier, gendarm, commissariat, garde a vue, prison, juge, procureur, tribunal, enquete judiciaire, cnil, anssi, officer, detective, fbi, court order, warrant, arrest, jail]
        reply: [m2.theo.law]
      - id: threat
        words: [virer, licencie, renvoy, menace, plainte, avocat, idiot, imbecile, stupide, incapable, fired, fire you, lawyer, sue, stupid, useless, threat, debile, nul]
        reply: [m2.theo.threat, m2.theo.threat2]
      - id: leak-now
        if: { all: [{ var: trust, eq: true }, { config: support.verify_identity, eq: false }] }
        words: &access [code, mot de passe, password, passe, identifiant, login, acces, access, staging, cle, key, token, credential]
        also: &urgency [urgen, vite, quick, hurry, demo, reunion, meeting, bloque, blocked, stuck, coince, panne, down, plante, production, mise en ligne, deadline, tout de suite, right now, asap, immediat, minutes, attend, waiting, wait, presse, retard, late, catastrophe]
        reply: [m2.theo.leak, m2.theo.leak2]
      - id: leak-ask
        if: { all: [{ var: trust, eq: true }, { var: asked, eq: true }, { config: support.verify_identity, eq: false }] }
        words: *urgency
        reply: [m2.theo.leak, m2.theo.leak2]
      - id: leak-press
        if: { all: [{ var: trust, eq: true }, { var: pressed, eq: true }, { config: support.verify_identity, eq: false }] }
        words: *access
        reply: [m2.theo.leak, m2.theo.leak2]
      # After the defence fix: a request for access codes goes through a call-back procedure.
      - id: verify
        if: { config: support.verify_identity, eq: true }
        words: *access
        reply: [m2.theo.verify]
      - id: ask-trusted
        if: { var: trust, eq: true }
        words: *access
        reply: [m2.theo.ticket]
        set: { asked: true }
      - id: press-trusted
        if: { var: trust, eq: true }
        words: *urgency
        reply: [m2.theo.what]
        set: { pressed: true }
      - id: cto
        # Names found by the player during reconnaissance: a model never hears them for the player.
        literal: true
        words: [ines, carron, directrice, cto]
        reply: [m2.theo.cto]
      - id: trust
        literal: true
        words: [karim, benali, lea, martin]
        reply: [m2.theo.trust, m2.theo.trust2]
        set: { trust: true }
      - id: claim
        families: [authority]
        reply: [m2.theo.claim]
      - id: refuse
        words: *access
        reply: [npc.theo.secret, m2.theo.refuse2, m2.theo.refuse3]
      - id: press-unknown
        words: *urgency
        reply: [m2.theo.pressUnknown]
      - id: who
        words: [qui es, qui etes, who are, ton nom, your name, stagiaire, intern, tu fais quoi, vous faites quoi]
        reply: [npc.theo.who]
      - id: nova
        words: [nova, assistant, ia, ai, chatbot, produit, product]
        reply: [npc.theo.nova]
      - id: price
        words: [prix, tarif, combien, price, pricing, cost, how much, abonnement, subscription]
        reply: [npc.theo.price]
      - id: hours
        words: [horaire, heure, ouvert, hours, open, quand, when]
        reply: [npc.theo.hours]
      - id: thanks
        words: [merci, thank, bonne journee, au revoir, bye]
        reply: [npc.theo.thanks]
      - id: hello
        words: [bonjour, salut, hello, hi, hey, coucou, bonsoir]
        reply: [npc.theo.hello, npc.theo.hello2]
    fallback: [npc.theo.fallback1, npc.theo.fallback2, npc.theo.fallback3]

# Defence replay: the support desk leaked a code; a verification procedure stops it.
defense:
  intro: m2.def.intro
  lesson: m2.def.lesson
  find:
    - { source: chat, where: { npc: theo, intent: { glob: "leak-*" } }, text: m2.def.find.leak }
  rules:
    - id: leak
      title: m2.def.rule.leak.title
      why: m2.def.rule.leak.why
      source: chat
      where: { npc: theo, intent: { glob: "leak-*" } }
      correct: true
    - id: urgent
      title: m2.def.rule.urgent.title
      why: m2.def.rule.urgent.why
      source: chat
      where: { npc: theo, msg: { contains: urgent } }
    - id: many
      title: m2.def.rule.many.title
      why: m2.def.rule.many.why
      source: chat
      where: { npc: theo }
      count: { gte: 4, within: 10 }
  fixes:
    - id: verify
      title: m2.def.fix.verify.title
      why: m2.def.fix.verify.why
      sets: { support.verify_identity: true }
      correct: true
    - id: urgent
      title: m2.def.fix.urgent.title
      why: m2.def.fix.urgent.why
      sets: { support.ban_urgent: true }
    - id: team
      title: m2.def.fix.team.title
      why: m2.def.fix.team.why
      sets: { www.hide_team: true }

# A clinic that writes a lot to support: it shows why a plain message count misfires.
background:
  - { host: www, source: chat, every: 2, offset: 1, fields: { src: 198.51.100.17, npc: theo, intent: hello, families: [none], msg: "Re-bonjour, toujours pas de facture dans mon espace client" } }
