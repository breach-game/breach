p1.briefing: "Lundi. Coup de main ouvre à toute la ville dans dix jours. Nadia, la présidente, a signé le mandat CDM-2029-11 : trois bénévoles, aucun développeur, une appli écrite en un week-end avec Bricole, un assistant de code. Quatre cent douze voisins y ont déjà mis leur téléphone et leur adresse. On commence par ce que tout le monde voit : la page."
p1.obj.source: "Lire la source de la page d'accueil"
p1.obj.bundle: "Ouvrir le paquet que l'assistant a généré"
p1.obj.key: "Donner la clé que l'appli envoie à sa base"
p1.obj.schema: "Demander à la base ce qu'elle contient, avec cette clé"
p1.obj.proof: "Valider le marqueur d'audit du schéma"
p1.obj.class: "Dire où est vraiment le problème"
p1.q.class: "La clé de la base est écrite en clair dans le paquet. Où est le problème ?"
p1.q.class.rules: "Elle est faite pour être vue. Tout dépend des règles de la base."
p1.q.class.secret: "La clé aurait dû rester secrète, gardée côté serveur."
p1.q.class.secret.why: "Cette appli n'a pas de serveur : le navigateur parle directement à la base, donc il lui faut une clé, et tout ce qu'un navigateur a, un visiteur l'a. La clé publique est prévue pour ça. Ce sont les règles derrière qui décident de ce qu'elle ouvre."
p1.q.class.hide: "Le domaine de la base n'aurait jamais dû apparaître dans la page."
p1.q.class.hide.why: "Le navigateur doit bien savoir où envoyer ses requêtes : l'adresse de la base se lit dans n'importe quel outil de développement. Cacher une adresse ne protège rien."
p1.ada.brief: "Regarde la page comme le ferait un curieux : sa source, pas seulement ce qu'elle affiche."
p1.ada.g.source: "Lis la source : `curl -s https://app.coupdemain.test/`. Un commentaire dit où est le code de l'appli."
p1.ada.g.source.standard: "Lis la source de la page d'accueil."
p1.ada.source: "Une page presque vide et un commentaire : le code de l'appli est dans `/assets/app-4f2c.js`, généré par Bricole. Tout le travail se fait dans le navigateur."
p1.ada.g.bundle: "Ouvre le paquet : `curl -s https://app.coupdemain.test/assets/app-4f2c.js`."
p1.ada.g.bundle.standard: "Ouvre le paquet que nomme le commentaire."
p1.ada.bundle: "L'adresse de la base, `base.coupdemain.test`, et une clé. Il y a aussi un compte de démo, on y reviendra mercredi. Donne la clé."
p1.ada.g.key: "La clé est la valeur de `SOCLE_ANON_KEY`. Donne-la : `submit sk_anon_cdm_7d21e0`."
p1.ada.g.key.standard: "Donne avec `submit` la clé que l'appli envoie à sa base."
p1.ada.key: "Une clé « anonyme » : elle est faite pour être publique, chaque visiteur la reçoit. La vraie question est ce que la base accepte de lui servir."
p1.ada.g.schema: "Demande à la base ce qu'elle contient, avec cette clé dans l'en-tête `apikey` : `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/`."
p1.ada.g.schema.standard: "Demande la racine de l'API de la base, `/rest/v1/`, en envoyant la clé dans l'en-tête `apikey`."
p1.ada.schema: "La base donne son plan entier à un visiteur anonyme : cinq tables, leurs colonnes, `adresse_exacte`, `date_naissance`, et une table `coffre`. Tu sais maintenant où chercher, comme n'importe qui. Le marqueur d'audit est dans `info`."
p1.ada.g.proof: "Valide le marqueur : `submit FLAG{...}`, la valeur de `x-audit-marker`."
p1.ada.flag: "Validé. Une question avant de continuer."
p1.ada.g.class: "Réponds à ma question sur la clé."
p1.ada.class: "Oui. Retirer la clé du paquet est impossible, l'appli en a besoin. Ce qui compte, c'est ce qu'elle ouvre. Demain, on regarde ce qu'elle ouvre dans la table des profils."
p1.ada.done: "Nadia a demandé : « Donc la clé, c'est normal ? » Oui. Ce qui ne l'est pas, on le verra demain."
p1.soc.schema: "base: the whole schema served to the public key"
p1.hint.source.1: "Tape `curl -s https://app.coupdemain.test/`."
p1.hint.bundle.1: "Le commentaire de la page donne le chemin du paquet."
p1.hint.bundle.2: "Tape `curl -s https://app.coupdemain.test/assets/app-4f2c.js`."
p1.hint.key.1: "Cherche `SOCLE_ANON_KEY` dans le paquet."
p1.hint.key.2: "Tape `submit sk_anon_cdm_7d21e0`."
p1.hint.schema.1: "La base lit sa clé dans l'en-tête `apikey`. `curl -H` ajoute un en-tête."
p1.hint.schema.2: "Tape `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/`."
p1.hint.proof.1: "Tape `submit FLAG{cdm-la-cle-dans-le-paquet-5a31}`."
p1.hint.class.1: "La clé est faite pour être vue. Tape `answer rules`."
p1.def.intro: "Le journal de la base a noté ta demande du schéma. Les vrais visiteurs ne la font jamais : l'appli demande des lignes, pas le plan."
p1.def.lesson: "Une clé publique se donne à tout le monde, donc elle n'ouvre que ce qu'un inconnu a le droit de voir. Le plan de la base n'en fait pas partie : il ne se sert qu'au rôle de service. Et chaque table a des règles écrites avant la mise en ligne."
p1.def.find.schema: "Ta demande du schéma avec la clé publique"
p1.def.rule.schema.title: "Alerter sur une lecture réussie du schéma"
p1.def.rule.schema.why: "C'est la bonne. L'appli ne demande jamais `/rest/v1/` : celui qui le fait cherche ce qu'il y a dans la base."
p1.def.rule.bundle.title: "Alerter sur chaque téléchargement du paquet"
p1.def.rule.bundle.why: "Chaque visiteur télécharge le paquet, c'est comme ça qu'une page marche. Cette règle sonne toute la journée."
p1.def.rule.denied.title: "Alerter sur les refus 401 de la base"
p1.def.rule.denied.why: "Elle voit les robots qui frappent sans clé, et pas toi : avec la clé, la base t'a répondu 200."
p1.def.fix.private.title: "Ne servir le schéma qu'au rôle de service"
p1.def.fix.private.why: "C'est la bonne. Avec la clé publique, `/rest/v1/` répond 401. L'appli n'en a jamais eu besoin."
p1.def.fix.minify.title: "Minifier le paquet pour rendre la clé moins lisible"
p1.def.fix.minify.why: "La clé est toujours dans le paquet, sur une seule ligne. `grep` la trouve aussi bien, et la base sert toujours son plan."
p1.def.fix.env.title: "Mettre la clé dans une variable d'environnement de la construction"
p1.def.fix.env.why: "La variable est remplacée par sa valeur au moment de construire le paquet : la clé finit au même endroit. Une appli sans serveur ne peut rien cacher au navigateur."
p1.debrief.title: "Une clé publique, et rien derrière"
p1.debrief.lesson: "L'appli parle à sa base depuis le navigateur, donc elle donne sa clé à chaque visiteur. C'est prévu. Ce qui ne l'est pas, c'est une base qui sert son plan entier à cette clé, et des tables sans règles."
p1.debrief.p1: "Tout ce que reçoit un navigateur, un visiteur le lit : paquet, adresses, clés publiques."
p1.debrief.p2: "Une clé publique n'ouvre que ce qu'un inconnu peut voir. Les règles de chaque table le décident."
p1.debrief.p3: "Le plan de la base et les tables internes ne se servent pas à la clé publique."
p1.debrief.p4: "Ce qu'un assistant de code a remis « à plus tard » se relit avant la mise en ligne."
