p1.briefing: "Monday. Coup de main opens to the whole town in ten days. Nadia, the chair, signed mandate CDM-2029-11: three volunteers, no developer, an app written in a weekend with Bricole, a coding assistant. Four hundred and twelve neighbours have already put their phone number and address in it. We start with what everyone sees: the page."
p1.obj.source: "Read the source of the home page"
p1.obj.bundle: "Open the bundle the assistant generated"
p1.obj.key: "Give the key the app sends to its database"
p1.obj.schema: "Ask the database what it holds, with that key"
p1.obj.proof: "Submit the audit marker of the schema"
p1.obj.class: "Say where the problem really is"
p1.q.class: "The database key is written in clear in the bundle. Where is the problem?"
p1.q.class.rules: "It is meant to be seen. It all depends on the database rules."
p1.q.class.secret: "The key should have stayed secret, kept on the server side."
p1.q.class.secret.why: "This app has no server: the browser talks straight to the database, so it needs a key, and whatever a browser has, a visitor has. The public key is made for this. The rules behind it decide what it opens."
p1.q.class.hide: "The database domain should never have shown in the page."
p1.q.class.hide.why: "The browser has to know where to send its requests: the database address shows in any developer tool. Hiding an address protects nothing."
p1.ada.brief: "Look at the page the way a curious visitor would: its source, not only what it displays."
p1.ada.g.source: "Read the source: `curl -s https://app.coupdemain.test/`. A comment says where the app's code is."
p1.ada.g.source.standard: "Read the source of the home page."
p1.ada.source: "An almost empty page and a comment: the app's code is in `/assets/app-4f2c.js`, generated by Bricole. All the work happens in the browser."
p1.ada.g.bundle: "Open the bundle: `curl -s https://app.coupdemain.test/assets/app-4f2c.js`."
p1.ada.g.bundle.standard: "Open the bundle the comment names."
p1.ada.bundle: "The database address, `base.coupdemain.test`, and a key. There is a demo account too, we will come back to it on Wednesday. Give the key."
p1.ada.g.key: "The key is the value of `SOCLE_ANON_KEY`. Give it: `submit sk_anon_cdm_7d21e0`."
p1.ada.g.key.standard: "Give with `submit` the key the app sends to its database."
p1.ada.key: "An \"anonymous\" key: it is meant to be public, every visitor gets it. The real question is what the database agrees to serve it."
p1.ada.g.schema: "Ask the database what it holds, with that key in the `apikey` header: `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/`."
p1.ada.g.schema.standard: "Ask for the root of the database API, `/rest/v1/`, sending the key in the `apikey` header."
p1.ada.schema: "The database hands its whole map to an anonymous visitor: five tables, their columns, `adresse_exacte`, `date_naissance`, and a table called `coffre`. You now know where to look, like anyone else. The audit marker is in `info`."
p1.ada.g.proof: "Submit the marker: `submit FLAG{...}`, the value of `x-audit-marker`."
p1.ada.flag: "Accepted. One question before we go on."
p1.ada.g.class: "Answer my question about the key."
p1.ada.class: "Yes. Taking the key out of the bundle is impossible, the app needs it. What matters is what it opens. Tomorrow we look at what it opens in the profiles table."
p1.ada.done: "Nadia asked: \"So the key is normal?\" Yes. What is not, we will see tomorrow."
p1.soc.schema: "base: the whole schema served to the public key"
p1.hint.source.1: "Type `curl -s https://app.coupdemain.test/`."
p1.hint.bundle.1: "The page comment gives the bundle's path."
p1.hint.bundle.2: "Type `curl -s https://app.coupdemain.test/assets/app-4f2c.js`."
p1.hint.key.1: "Look for `SOCLE_ANON_KEY` in the bundle."
p1.hint.key.2: "Type `submit sk_anon_cdm_7d21e0`."
p1.hint.schema.1: "The database reads its key in the `apikey` header. `curl -H` adds a header."
p1.hint.schema.2: "Type `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/`."
p1.hint.proof.1: "Type `submit FLAG{cdm-la-cle-dans-le-paquet-5a31}`."
p1.hint.class.1: "The key is meant to be seen. Type `answer rules`."
p1.def.intro: "The database log noted your request for the schema. Real visitors never make it: the app asks for rows, not for the map."
p1.def.lesson: "A public key is given to everyone, so it only opens what a stranger may see. The database map is not part of that: it is served to the service role only. And every table has rules written before going live."
p1.def.find.schema: "Your request for the schema with the public key"
p1.def.rule.schema.title: "Alert on a successful read of the schema"
p1.def.rule.schema.why: "The right one. The app never asks for `/rest/v1/`: whoever does is looking for what the database holds."
p1.def.rule.bundle.title: "Alert on every download of the bundle"
p1.def.rule.bundle.why: "Every visitor downloads the bundle, that is how a page works. This rule rings all day."
p1.def.rule.denied.title: "Alert on the database's 401 refusals"
p1.def.rule.denied.why: "It sees the crawlers knocking without a key, and not you: with the key, the database answered you 200."
p1.def.fix.private.title: "Serve the schema to the service role only"
p1.def.fix.private.why: "The right one. With the public key, `/rest/v1/` answers 401. The app never needed it."
p1.def.fix.minify.title: "Minify the bundle so the key is harder to read"
p1.def.fix.minify.why: "The key is still in the bundle, on a single line. `grep` finds it just as well, and the database still serves its map."
p1.def.fix.env.title: "Put the key in a build environment variable"
p1.def.fix.env.why: "The variable is replaced by its value when the bundle is built: the key ends up in the same place. An app with no server can hide nothing from the browser."
p1.debrief.title: "A public key, and nothing behind it"
p1.debrief.lesson: "The app talks to its database from the browser, so it gives its key to every visitor. That is by design. What is not is a database serving its whole map to that key, and tables with no rules."
p1.debrief.p1: "Whatever a browser receives, a visitor reads: bundle, addresses, public keys."
p1.debrief.p2: "A public key only opens what a stranger may see. Each table's rules decide that."
p1.debrief.p3: "The database map and internal tables are not served to the public key."
p1.debrief.p4: "What a coding assistant put off \"for later\" gets reviewed before going live."
