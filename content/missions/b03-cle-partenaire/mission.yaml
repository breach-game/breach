# Third defence mission: broken object-level authorisation, enumeration, and an attacker who
# changes address when blocked. Only the credential is constant.
side: defense
order: 9
stage: response
briefing: b3.briefing
reveal: [api]

objectives:
  - { id: contain, text: b3.obj.contain }
  - { id: key, text: b3.obj.key }
  - { id: path, text: b3.obj.path }
  - { id: second, text: b3.obj.second, optional: true }

flags: []

config:
  b3.ip45_blocked: false
  b3.range_blocked: false
  b3.key_revoked: false
  b3.api_down: false

adversary:
  id: scraper
  name: Scraper
  from: unk
  pace: 1
  delay: 1
  steps:
    - id: probe
      host: api
      source: access
      fields: &first
        src: 203.0.113.45
        path: "/v1/clinics/1001?key=nm-partner-7f3a"
        ua: python-requests/2.31
        bytes: 2214
      blockedIf: &firstBlocked
        any:
          - { config: b3.ip45_blocked, eq: true }
          - { config: b3.range_blocked, eq: true }
          - { config: b3.key_revoked, eq: true }
          - { config: b3.api_down, eq: true }
      # Blocked by address only, the scraper moves to another one.
      continueIfBlocked: true
    - id: enum1
      host: api
      source: access
      fields: { src: 203.0.113.45, path: "/v1/clinics/1002?key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 2187 }
      blockedIf: *firstBlocked
      continueIfBlocked: true
    - id: enum2
      host: api
      source: access
      fields: { src: 203.0.113.45, path: "/v1/clinics/1003?key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 2240 }
      blockedIf: *firstBlocked
      continueIfBlocked: true
    - id: rotate
      host: api
      source: access
      fields: { src: 203.0.113.46, path: "/v1/clinics/1004?key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 2198 }
      blockedIf: &keyBlocked
        any:
          - { config: b3.range_blocked, eq: true }
          - { config: b3.key_revoked, eq: true }
          - { config: b3.api_down, eq: true }
    - id: enum3
      host: api
      source: access
      fields: { src: 203.0.113.46, path: "/v1/clinics/1005?key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 2231 }
      blockedIf: *keyBlocked
    - id: enum4
      host: api
      source: access
      fields: { src: 203.0.113.46, path: "/v1/clinics/1006?key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 2205 }
      blockedIf: *keyBlocked
    - id: export
      host: api
      source: access
      fields: { src: 203.0.113.46, path: "/v1/clinics?all=1&key=nm-partner-7f3a", ua: python-requests/2.31, bytes: 3104577 }
      blockedIf: *keyBlocked

# The API's ordinary traffic: a partner that also puts its key in the URL, and the clinics' app.
background:
  - { host: api, source: access, every: 9, offset: 1, fields: { src: 203.0.113.12, path: "/v1/clinics/2210?key=nm-partner-c91e", ua: "partner-sync/1.4", bytes: 2302 } }
  - { host: api, source: access, every: 3, fields: { src: 198.51.100.23, path: "/v1/appointments?clinic=1188", ua: "NovaClinic/3.2 (iPad)", bytes: 5120 } }
  - { host: api, source: access, every: 5, offset: 2, fields: { src: 198.51.100.61, path: "/v1/appointments?clinic=1042", ua: "NovaClinic/3.2 (Android)", bytes: 4876 } }

containment:
  - id: block-45
    action: block
    target: 203.0.113.45
    text: b3.contain.block
    sets: { b3.ip45_blocked: true }
    impact: 0
  - id: block-range
    action: block
    target: 203.0.113.0/24
    text: b3.contain.range
    sets: { b3.range_blocked: true }
    impact: 15
  - id: revoke-key
    action: revoke
    target: nm-partner-7f3a
    text: b3.contain.revoke
    sets: { b3.key_revoked: true }
    impact: 10
  - id: api-down
    action: disable
    target: api.novamind.test
    text: b3.contain.api
    sets: { b3.api_down: true }
    impact: 70

alerts:
  - id: enumeration
    title: b3.alert.enum
    why: b3.alert.enum.why
    source: access
    where: { path: { glob: "/v1/clinics/*" } }
    count: { gte: 3, within: 10 }
  - id: key-in-url
    title: b3.alert.key
    why: b3.alert.key.why
    source: access
    where: { path: { contains: "key=" } }

questions:
  - { id: key, text: b3.q.key, value: nm-partner-7f3a, points: 100, objective: key }
  - { id: path, text: b3.q.path, value: /v1/clinics, points: 100, objective: path }
  - { id: second, text: b3.q.second, value: 203.0.113.46, points: 100, objective: second }

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: b3.ada.brief
  - on: { event: AdversaryStep, step: enum2, blocked: false }
    do:
      - ada.guide: { key: b3.ada.enum, for: contain, step: 1 }
  - on: { event: AdversaryStep, step: rotate, blocked: false }
    if: { var: b3-blocked45, eq: true }
    do:
      - ada.warn: b3.ada.rotated
  - on: { event: Contained, containment: block-45 }
    do:
      - var.set: { name: b3-blocked45, value: true }
  - on: { event: AdversaryStep, step: enum4, blocked: false }
    do:
      - ada.warn: b3.ada.last
  - on: { event: AdversaryStep, step: export, blocked: false }
    do:
      - mission.fail: b3.ada.fail
  - on: { event: AdversaryStep, stop: true }
    do:
      - ada.say: b3.ada.stopped
      - objective.complete: contain
  - on: { event: Contained, containment: api-down }
    do:
      - ada.say: b3.ada.costly
  - on: { event: Contained, containment: block-range }
    do:
      - ada.say: b3.ada.range
  - on: { event: MissionCompleted }
    do:
      - ada.say: b3.ada.done

guide:
  contain: b3.ada.start
  key: b3.ada.key
  path: b3.ada.path

hints:
  contain: [b3.hint.contain.1, b3.hint.contain.2, b3.hint.contain.3]
  key: [b3.hint.key.1, b3.hint.key.2]
  path: [b3.hint.path.1, b3.hint.path.2]

debrief:
  title: b3.debrief.title
  lesson: b3.debrief.lesson
  points: [b3.debrief.p1, b3.debrief.p2, b3.debrief.p3, b3.debrief.p4]
  reference: "OWASP API Security Top 10 · API1 BOLA, API2 Broken Authentication"
