b3.briefing: "Day 15. NovaMind is opening its API to partners: each partner has its key, and the API returns any clinic's record to anyone with a valid key. The SOC hands you the console for the morning. If something is vacuuming up the records, stop it while doing as little damage as possible."
b3.obj.contain: "Stop the scraping before the full export"
b3.obj.key: "Name the key the attacker uses"
b3.obj.path: "Name the API path being walked"
b3.obj.second: "Name the address they fell back to"
b3.contain.block: "Firewall: 203.0.113.45 can no longer reach the API."
b3.contain.range: "Firewall: the whole 203.0.113.0/24 block is cut. A network of partner clinics lives there too."
b3.contain.revoke: "Key nm-partner-7f3a revoked. The partner's app will wait for its new key."
b3.contain.api: "Public API shut down. No more partners, no more clinic apps."
b3.alert.enum: "Clinic records read one after another by the same address"
b3.alert.enum.why: "Three records or more in ten minutes, with consecutive numbers: someone is enumerating."
b3.alert.key: "API key passed in the URL"
b3.alert.key.why: "A key in the URL ends up in every log, every proxy and browser history. It's already half public."
b3.q.key: "Which API key does the attacker use?"
b3.q.path: "Which API path are they walking? (without the number)"
b3.q.second: "Which address did they fall back to?"
b3.ada.brief: "Third morning at the SOC. This time the attacker doesn't need to hack anything: the API answers anyone with a key, for any clinic. Keep an eye on the API's logs."
b3.ada.start: "Start with the alerts: `soc alerts`. Run it again, a pattern sometimes takes a few minutes to show."
b3.ada.start.standard: "Watch the alerts and the API's logs."
b3.ada.enum: "1001, 1002, 1003: someone is walking through the records in order, from 203.0.113.45. Look at the lines: `soc logs api access`. Block the address? They'll switch. What doesn't change is the key in the URL: `contain revoke nm-partner-7f3a`."
b3.ada.enum.standard: "An enumeration is running. Before you cut, ask yourself what stays the same if the attacker changes address."
b3.ada.rotated: "The address is blocked, and they carry on from 203.0.113.46. Same key, new address."
b3.ada.last: "1006. The pattern is clear: the next request will take everything at once."
b3.ada.fail: "Too late: the full list of clinics is gone. We start again from the first request."
b3.ada.stopped: "The key is dead, the next request got a 401. The scraping has stopped."
b3.ada.costly: "The API is down for everyone. It works, but the impact gauge shoots up."
b3.ada.range: "The whole block is cut, and a network of partner clinics with it. Effective, but not free."
b3.ada.key: "For the report: which key? `answer key <key>`."
b3.ada.key.standard: "Answer the investigation's questions with `answer`."
b3.ada.path: "And which API path? Without the clinic number: `answer path /v1/clinics`."
b3.ada.path.standard: "Last required question: the API path, without the number."
b3.ada.done: "Key revoked, partner warned, one record per minute from now on. Head to the debrief."
b3.hint.contain.1: "`soc logs api access` shows every request, with the address and the full URL."
b3.hint.contain.2: "The address can change. The key can't."
b3.hint.contain.3: "`contain revoke nm-partner-7f3a`"
b3.hint.key.1: "It's in the URL, after key=."
b3.hint.key.2: "`answer key nm-partner-7f3a`"
b3.hint.path.1: "The requests look like /v1/clinics/1001."
b3.hint.path.2: "`answer path /v1/clinics`"
b3.debrief.title: "Cut the credential, not the address"
b3.debrief.lesson: "An IP address costs almost nothing to change. A credential doesn't: it's what grants access, it's what you revoke. And the API had a deeper flaw: a valid key opened any record, not only the partner's own."
b3.debrief.p1: "Every request checks that the object asked for belongs to the caller: a partner key only reads that partner's clinics."
b3.debrief.p2: "Never a key in the URL: a header, and short-lived keys that can be revoked without breaking everything."
b3.debrief.p3: "Rate-limit per key, not only per address, and alert on consecutive numbers."
b3.debrief.p4: "During the incident, warn the partner: the key leaked on their side, not NovaMind's."
