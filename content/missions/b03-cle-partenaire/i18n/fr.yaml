b3.briefing: "Jour 15. NovaMind ouvre son API à des partenaires : chaque partenaire a sa clé, et l'API rend la fiche de n'importe quelle clinique à qui présente une clé valide. Le SOC te confie la console pour la matinée. Si quelque chose aspire les fiches, arrête-le en faisant le moins de dégâts possible."
b3.obj.contain: "Arrêter l'aspiration avant l'export complet"
b3.obj.key: "Dire quelle clé l'attaquant utilise"
b3.obj.path: "Dire quel chemin de l'API il parcourt"
b3.obj.second: "Dire vers quelle adresse il se replie, si tu le laisses faire"
b3.contain.block: "Pare-feu : l'adresse 203.0.113.45 ne joint plus l'API."
b3.contain.range: "Pare-feu : tout le bloc 203.0.113.0/24 est coupé. Un réseau de cliniques partenaires s'y trouve aussi."
b3.contain.revoke: "Clé nm-partner-7f3a révoquée. L'application du partenaire attendra sa nouvelle clé."
b3.contain.api: "API publique arrêtée. Plus aucun partenaire, plus aucune application de clinique."
b3.alert.enum: "Fiches de cliniques lues à la suite par la même adresse"
b3.alert.enum.why: "Trois fiches ou plus en dix minutes, avec des numéros qui se suivent : quelqu'un énumère."
b3.alert.key: "Clé d'API passée dans l'URL"
b3.alert.key.why: "Une clé dans l'URL finit dans tous les journaux, tous les proxys et l'historique des navigateurs. Elle est déjà à moitié publique."
b3.q.key: "Quelle clé d'API l'attaquant utilise-t-il ?"
b3.q.path: "Quel chemin de l'API parcourt-il ? (sans le numéro ni « / » final)"
b3.q.second: "Vers quelle adresse s'est-il replié ?"
b3.ada.brief: "Troisième matinée au SOC. Cette fois l'attaquant n'a pas besoin de pirater quoi que ce soit : l'API répond à quiconque a une clé, pour n'importe quelle clinique. Ouvre l'œil sur les journaux de l'API."
b3.ada.start: "Commence par les alertes : `soc alerts`. Relance-la, il faut parfois quelques minutes pour qu'un motif apparaisse."
b3.ada.start.standard: "Surveille les alertes et les journaux de l'API."
b3.ada.enum: "1001, 1002, 1003 : quelqu'un parcourt les fiches dans l'ordre, depuis 203.0.113.45. Regarde les lignes : `soc logs api access`. Bloquer son adresse ? Il en changera. Ce qui ne change pas, c'est la clé dans l'URL : `contain revoke nm-partner-7f3a`."
b3.ada.enum.standard: "Une énumération est en cours. Avant de couper, demande-toi ce qui restera identique si l'attaquant change d'adresse."
b3.ada.rotated: "L'adresse est bloquée, et il continue depuis 203.0.113.46. Même clé, nouvelle adresse."
b3.ada.last: "1006. Le motif est clair : la prochaine requête prendra tout d'un coup."
b3.ada.fail: "Trop tard : la liste complète des cliniques est partie. On reprend depuis la première requête."
b3.ada.stopped: "La clé est morte, la requête suivante a reçu un 401. L'aspiration est arrêtée."
b3.ada.stopped.other: "Plus rien ne passe : ses requêtes tombent dans le vide. Mais la clé, elle, est toujours valide."
b3.ada.costly: "L'API est arrêtée pour tout le monde. Ça marche, mais la jauge d'impact s'envole."
b3.ada.range: "Tout le bloc est coupé, et avec lui un réseau de cliniques partenaires. Efficace, mais pas gratuit."
b3.ada.key: "Pour le rapport : quelle clé ? `answer key <clé>`."
b3.ada.key.standard: "Réponds aux questions de l'enquête avec `answer`."
b3.ada.path: "Et quel chemin de l'API ? Sans le numéro de clinique : `answer path /v1/clinics`."
b3.ada.path.standard: "Dernière question obligatoire : le chemin de l'API, sans le numéro."
b3.ada.done: "Clé révoquée, partenaire prévenu, une seule fiche par minute désormais. Passe au débrief."
b3.ada.done.other: "L'aspiration est arrêtée, mais la clé nm-partner-7f3a n'a pas été révoquée : elle reste valide pour la prochaine requête qui passera. Karim la révoque cet après-midi. Passe au débrief."
b3.hint.contain.1: "`soc logs api access` montre chaque requête, avec l'adresse et l'URL complète."
b3.hint.contain.2: "L'adresse peut changer. La clé, non."
b3.hint.contain.3: "`contain revoke nm-partner-7f3a`"
b3.hint.key.1: "Elle est dans l'URL, après key=."
b3.hint.key.2: "`answer key nm-partner-7f3a`"
b3.hint.path.1: "Les requêtes ressemblent à /v1/clinics/1001."
b3.hint.path.2: "`answer path /v1/clinics`"
b3.debrief.title: "Couper l'identifiant, pas l'adresse"
b3.debrief.lesson: "Une adresse IP ne coûte presque rien à changer. Un identifiant, si : c'est lui qui donne l'accès, c'est lui qu'il faut révoquer. Et l'API avait un défaut plus profond : une clé valide ouvrait n'importe quelle fiche, pas seulement celles du partenaire."
b3.debrief.p1: "Chaque requête vérifie que l'objet demandé appartient bien à l'appelant : une clé de partenaire ne lit que les cliniques de ce partenaire."
b3.debrief.p2: "Jamais de clé dans l'URL : un en-tête, et des clés courtes durées que l'on peut révoquer sans tout casser."
b3.debrief.p3: "Limiter le débit par clé, pas seulement par adresse, et alerter sur les numéros qui se suivent."
b3.debrief.p4: "Pendant l'incident, prévenir le partenaire : sa clé a fuité chez lui, pas chez NovaMind."
