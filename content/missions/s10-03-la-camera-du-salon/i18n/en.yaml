h3.briefing: "Yesterday Élise got an email from Vigicam, the maker of the living-room camera: \"new sign-in to your account\". She took it for a scam and nearly deleted it. Being wary is a good reflex, except that this one is real. She exported, from her own account, the sign-in history and the list of shares: it is all in `vigicam/`. We do not touch Vigicam's servers, they are not ours. We read what her account tells."
h3.obj.ip: "Find the address that is not the family's"
h3.obj.since: "Date its first sign-in"
h3.obj.how: "Understand how it got in"
h3.obj.evict: "Get it out of the account for good"
h3.obj.who: "Find who else still sees the camera"
h3.obj.share: "Remove the forgotten share"
h3.obj.factor: "Choose the account's second check"
h3.file.mail: "From: securite@vigicam.test\nTo: elise@lemerle.test\nSubject: New sign-in to your Vigicam account\n\nHello,\nYour account was signed in to from a device we do not know:\n  web browser, Linux, on 11 May 2029 at 02:49.\nIf it was you, ignore this message.\nIf not, open the app (we never send a link), under Account > Security.\n"
h3.file.leak: "From: info@pelican.test\nTo: elise@lemerle.test\nSubject: Information about your data\nDate: 14 June 2028\n\nHello,\nFollowing a security incident on our shop, customer account data was copied:\nemail address and password.\nIf you use this password elsewhere, change it everywhere.\n\n-- Élise's note, in pencil: \"no time. it's the one I use everywhere.\"\n"
h3.ada.brief: "Start by counting. Each line of `vigicam/connexions.json` has an address: `jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c` tells you how often each one comes back."
h3.ada.g.ip: "Count the sign-ins per address: `jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c`. Two addresses are the house and Élise's phone. Answer with `answer ip <the third one>`."
h3.ada.g.ip.standard: "Count the sign-ins per address in `vigicam/connexions.json` (`jq`, `sort`, `uniq -c`), and answer with `answer ip`."
h3.q.ip: "Which address comes neither from the house nor from a family phone? (an IP address)"
h3.ada.ip: "`203.0.113.77`, six lines, always between two and four in the morning, always the same session. Look at what it did, and since when: `grep 203.0.113.77 vigicam/connexions.json`."
h3.q.since: "On which day did it open its session? (YYYY-MM-DD)"
h3.ada.g.since: "Read its lines: `grep 203.0.113.77 vigicam/connexions.json`. The oldest one gives the date. Answer with `answer since YYYY-MM-DD`."
h3.ada.g.since.standard: "Isolate that address's lines and answer with `answer since`, as YYYY-MM-DD."
h3.ada.since: "30 April. Password right at the first try, then five visits in eleven days, at night, on the live picture of the living room. Someone is watching their home. Before closing the door we need to know how they got the key, or they will be back. Read `fuites/avis-pelican.txt` and `vigicam/compte.json`."
h3.q.entry: "How did they get into the account?"
h3.q.entry.reuse: "With a reused password that came out of an old leak."
h3.q.entry.hack: "By hacking the camera itself, through a flaw in its software."
h3.q.entry.hack.why: "They never touched the camera: they signed in to the account, at the maker's, with the right password at the first try. A flaw does not know your password."
h3.q.entry.wifi: "By cracking the password of the home Wi-Fi."
h3.q.entry.wifi.why: "They never came onto the Wi-Fi. They arrive from the Internet, through a relay, and knock at the maker's door, not at the house's."
h3.ada.g.how: "Read the leak notice, `cat fuites/avis-pelican.txt`, then the account, `cat vigicam/compte.json`, and answer my question."
h3.ada.g.how.standard: "Two files explain where the password comes from. Read them and answer my question."
h3.ada.how: "Pélican, the clothes shop: we audited their site two years ago, you remember. Their 2028 leak held Élise's address and her \"everywhere\" password. Someone tried that pair on dozens of services, and the camera's said yes. Nobody aimed at Élise: a program tried a list."
h3.ada.how.next: "Now we get them out. `contain` lists what she can do from her account."
h3.contain.session: "Close session s-9c2 (the stranger is signed out at once)"
h3.contain.password: "Change the Vigicam account password (a new one, used nowhere else)"
h3.contain.share: "Remove the forgotten share"
h3.contain.camera: "Unplug the camera (no picture for anyone, the family included)"
h3.ada.g.evict: "It takes two moves: `contain revoke session-9c2` to close their session, and `contain reset mot-de-passe` so that the stolen password is worth nothing."
h3.ada.g.evict.standard: "`contain` lists the measures. It takes two of them to get them out and keep them out."
h3.ada.reset.first: "The password is changed. But look at `vigicam/compte.json`: sessions never expire. Theirs is already open, and a new password does not close it. Revoke it too."
h3.ada.session.first: "They are out. For ten seconds: they still have the password and only need to sign in again. Change it."
h3.ada.unplug: "No picture for anyone, and the account stays open to the stranger: they will see again the day it is plugged back in. Unplugging calms things down and settles nothing. The real measures are on the account."
h3.ada.evict: "Session closed and password changed: nothing they hold works any more. The order mattered little, both were needed. Now to stop the next one, because that password still sits in the leak, and Élise uses it elsewhere."
h3.q.second: "Which second check for the camera's account?"
h3.q.second.code: "A code given by an app on Élise's phone."
h3.q.second.code.why: "The right setting: without her phone in hand, a stolen password is no longer enough. Cost: installing the app, and keeping the backup codes for the day she changes phones."
h3.q.second.text: "A code received by text message."
h3.q.second.text.why: "Far better than nothing, and everybody knows how to use it. More fragile: a number can be hijacked at the operator's, and a text can be read on a locked screen."
h3.q.second.none: "Nothing more: the new password is enough."
h3.q.second.none.why: "That is exactly the setting from before. The day this password leaks in its turn, or if she reuses it, the living-room camera belongs to someone else again."
h3.ada.g.factor: "Answer my question about the second check. No answer is wrong, each has a price."
h3.ada.factor: "Noted. What matters: the camera looks inside their home, so its account deserves more than a password alone."
h3.q.who: "Which address, outside the family, still has access to the camera? (the full address)"
h3.ada.g.who: "Read the shares: `cat vigicam/partages.json`. One address is not the family's. Answer with `answer who <address>`."
h3.ada.g.who.standard: "Read `vigicam/partages.json` and answer with `answer who`."
h3.ada.who: "Manon, the babysitter of winter 2027. Élise shared the camera with her for one evening. She has not looked since June 2028, and she has nothing to do with our story. But an access nobody remembers is an access nobody watches: if Manon's account falls one day, the Lemerles' living room falls with it."
h3.ada.g.share: "Remove the share: `contain revoke partage-oublie`."
h3.ada.g.share.standard: "Remove the share nobody needs any more."
h3.ada.share: "Removed. Élise will send her a note, out of courtesy. Access is given for a time, and read again now and then."
h3.ada.done: "The living room is theirs again. Élise wants to know whether to file a complaint: yes, with the history you just read, it is evidence. And tonight she changes her other passwords. Tomorrow we look at what does not go through the Wi-Fi: the smart-home hub and its radios."
h3.hint.ip.1: "`jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c` counts sign-ins per address. `192.0.2.44` is the house, `198.51.100.130` Élise's phone on mobile data."
h3.hint.ip.2: "Type `answer ip 203.0.113.77`."
h3.hint.since.1: "`grep 203.0.113.77 vigicam/connexions.json`: the first line carries the oldest date, in the `when` field."
h3.hint.since.2: "Type `answer since 2029-04-30`."
h3.hint.how.1: "The history says \"password right at first try\". Pélican's notice says Élise's password leaked in 2028, and her note says she uses it everywhere."
h3.hint.how.2: "Type `answer reuse`."
h3.hint.evict.1: "`contain` lists the measures. Closing the session is not enough if they keep the password, and the reverse is not either."
h3.hint.evict.2: "Type `contain revoke session-9c2`, then `contain reset mot-de-passe`."
h3.hint.who.1: "`cat vigicam/partages.json`: two addresses end with `lemerle.test`, the third does not."
h3.hint.who.2: "Type `answer who manon.b@courriel.example`."
h3.hint.share.1: "Type `contain revoke partage-oublie`."
h3.hint.factor.1: "Type `answer code`, `answer text` or `answer none`. Read the price of each."
h3.debrief.title: "Nobody hacked the camera"
h3.debrief.lesson: "Someone was watching the Lemerles' living room at night, and forced neither the camera, nor the Wi-Fi, nor the router. They had the password: the same one Élise used at an online shop that leaked in 2028. The account had no second check, and its sessions never closed. It is the most common story behind \"my camera was hacked\"."
h3.debrief.p1: "A reused password is worth what the least protected site using it is worth. Programs try every leak on dozens of services."
h3.debrief.p2: "To get someone out of an account, close their sessions and change the password. One without the other lets them come back, or stay."
h3.debrief.p3: "A second check makes a stolen password insufficient. Put it first on whatever sees or opens the house."
h3.debrief.p4: "A share given for an evening stays open for years. The list of accesses is read again like the list of devices."
h3.home.p1: "Open the app of your camera, doorbell or alarm: look for \"connected devices\" or \"sessions\", and close the ones you do not recognise."
h3.home.p2: "Give that account a password used nowhere else, and switch on two-step verification."
h3.home.p3: "Read the list of people the camera is shared with. Remove those who no longer need it."
h3.home.p4: "If a site warned you of a leak, change that password wherever you used it, starting with your mailbox."
