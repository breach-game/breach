h3.briefing: "Élise a reçu hier un courriel de Vigicam, le fabricant de la caméra du salon : « nouvelle connexion à votre compte ». Elle a cru à une arnaque et a failli le supprimer. Bon réflexe de se méfier, sauf que celui-là est vrai. Elle a exporté elle-même, depuis son compte, l'historique des connexions et la liste des partages : tout est dans `vigicam/`. On ne touche pas aux serveurs de Vigicam, ils ne sont pas à nous. On lit ce que son compte raconte."
h3.obj.ip: "Trouver l'adresse qui n'est pas de la famille"
h3.obj.since: "Dater sa première connexion"
h3.obj.how: "Comprendre comment elle est entrée"
h3.obj.evict: "La sortir du compte pour de bon"
h3.obj.who: "Trouver qui d'autre voit encore la caméra"
h3.obj.share: "Retirer le partage oublié"
h3.obj.factor: "Choisir la seconde vérification du compte"
h3.file.mail: "De : securite@vigicam.test\nÀ : elise@lemerle.test\nObjet : Nouvelle connexion à votre compte Vigicam\n\nBonjour,\nUne connexion à votre compte a eu lieu depuis un appareil que nous ne connaissons pas :\n  navigateur web, Linux, le 11 mai 2029 à 02 h 49.\nSi c'était vous, ignorez ce message.\nSinon, ouvrez l'application (nous n'envoyons jamais de lien), rubrique Compte > Sécurité.\n"
h3.file.leak: "De : info@pelican.test\nÀ : elise@lemerle.test\nObjet : Information sur vos données\nDate : 14 juin 2028\n\nBonjour,\nÀ la suite d'un incident de sécurité sur notre boutique, des données de comptes clients ont été copiées :\nadresse électronique et mot de passe.\nSi vous utilisez ce mot de passe ailleurs, changez-le partout.\n\n-- note d'Élise, au crayon : « pas eu le temps. c'est celui que je mets partout. »\n"
h3.ada.brief: "Commence par compter. Chaque ligne de `vigicam/connexions.json` a une adresse : `jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c` te dit combien de fois chacune revient."
h3.ada.g.ip: "Compte les connexions par adresse : `jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c`. Deux adresses sont la maison et le téléphone d'Élise. Réponds avec `answer ip <la troisième>`."
h3.ada.g.ip.standard: "Compte les connexions par adresse dans `vigicam/connexions.json` (`jq`, `sort`, `uniq -c`), et réponds avec `answer ip`."
h3.q.ip: "Quelle adresse ne vient ni de la maison ni d'un téléphone de la famille ? (une adresse IP)"
h3.ada.ip: "`203.0.113.77`, six lignes, toujours entre deux et quatre heures du matin, toujours la même session. Regarde ce qu'elle a fait, et depuis quand : `grep 203.0.113.77 vigicam/connexions.json`."
h3.q.since: "Quel jour a-t-elle ouvert sa session ? (AAAA-MM-JJ)"
h3.ada.g.since: "Lis ses lignes : `grep 203.0.113.77 vigicam/connexions.json`. La plus ancienne donne la date. Réponds avec `answer since AAAA-MM-JJ`."
h3.ada.g.since.standard: "Isole les lignes de cette adresse et réponds avec `answer since`, au format AAAA-MM-JJ."
h3.ada.since: "Le 30 avril. Mot de passe juste au premier essai, puis cinq visites en douze jours, la nuit, sur l'image en direct du salon. Quelqu'un regarde chez eux. Avant de fermer, il faut savoir comment il a eu la clé, sinon il reviendra. Lis `fuites/avis-pelican.txt` et `vigicam/compte.json`."
h3.q.entry: "Comment est-il entré dans le compte ?"
h3.q.entry.reuse: "Avec un mot de passe réutilisé, sorti d'une vieille fuite."
h3.q.entry.hack: "En piratant la caméra elle-même, par une faille."
h3.q.entry.hack.why: "Il n'a pas touché à la caméra : il s'est connecté au compte, chez le fabricant, avec le bon mot de passe du premier coup. Une faille ne connaît pas ton mot de passe."
h3.q.entry.wifi: "En cassant le mot de passe du Wi-Fi de la maison."
h3.q.entry.wifi.why: "Il n'est jamais venu sur le Wi-Fi. Il arrive d'Internet, par un relais, et frappe à la porte du fabricant, pas à celle de la maison."
h3.ada.g.how: "Lis `fuites/avis-pelican.txt` puis `vigicam/compte.json`, et réponds à ma question."
h3.ada.g.how.standard: "Deux fichiers expliquent d'où vient le mot de passe. Lis-les et réponds à ma question."
h3.ada.how: "Pélican, la boutique de vêtements : on a audité leur site il y a deux ans, tu t'en souviens. Leur fuite de 2028 contenait l'adresse d'Élise et son mot de passe « de partout ». Quelqu'un a essayé ce couple sur des dizaines de services, et celui de la caméra a dit oui. Personne n'a visé Élise : un programme a essayé une liste. Maintenant on le sort. `contain` liste ce qu'elle peut faire depuis son compte."
h3.contain.session: "Fermer la session s-9c2 (l'inconnu est déconnecté sur-le-champ)"
h3.contain.password: "Changer le mot de passe du compte Vigicam (un nouveau, qui ne sert nulle part ailleurs)"
h3.contain.share: "Retirer le partage avec manon.b@courriel.example"
h3.contain.camera: "Débrancher la caméra (plus d'image pour personne, la famille comprise)"
h3.ada.g.evict: "Il faut deux gestes : `contain revoke session-9c2` pour fermer sa session, et `contain reset mot-de-passe` pour que le mot de passe volé ne serve plus."
h3.ada.g.evict.standard: "`contain` liste les mesures. Il en faut deux pour qu'il sorte et ne revienne pas."
h3.ada.reset.first: "Le mot de passe est changé. Mais regarde `vigicam/compte.json` : les sessions n'expirent jamais. La sienne est déjà ouverte, et un nouveau mot de passe ne la ferme pas. Révoque-la aussi."
h3.ada.session.first: "Il est dehors. Pour dix secondes : il a toujours le mot de passe, il n'a qu'à se reconnecter. Change-le."
h3.ada.unplug: "Plus d'image pour personne, et le compte reste ouvert à l'inconnu : il verra de nouveau le jour où on la rebranche. Débrancher calme, ça ne règle rien. Les vraies mesures sont sur le compte."
h3.ada.evict: "Session fermée et mot de passe changé : il n'a plus rien qui marche. L'ordre comptait peu, il fallait les deux. Reste à empêcher le prochain, parce que ce mot de passe traîne encore dans la fuite, et qu'Élise l'utilise ailleurs."
h3.q.second: "Quelle seconde vérification pour le compte de la caméra ?"
h3.q.second.code: "Un code donné par une application sur le téléphone d'Élise."
h3.q.second.code.why: "Le bon réglage : sans son téléphone en main, un mot de passe volé ne suffit plus. Coût : installer l'application, et garder les codes de secours pour le jour où elle change de téléphone."
h3.q.second.text: "Un code reçu par SMS."
h3.q.second.text.why: "Bien mieux que rien, et tout le monde sait s'en servir. Plus fragile : un numéro peut être détourné chez l'opérateur, et un SMS se lit sur un écran verrouillé."
h3.q.second.none: "Rien de plus : le nouveau mot de passe suffit."
h3.q.second.none.why: "C'est exactement le réglage d'avant. Le jour où ce mot de passe fuit à son tour, ou si elle le réutilise, la caméra du salon est de nouveau à quelqu'un d'autre."
h3.ada.g.factor: "Réponds à ma question sur la seconde vérification. Aucune réponse n'est fausse, chacune a un prix."
h3.ada.factor: "Noté. Ce qui compte : la caméra regarde l'intérieur de leur maison, son compte mérite mieux qu'un mot de passe seul."
h3.q.who: "Quelle adresse, hors de la famille, a encore un accès à la caméra ? (l'adresse complète)"
h3.ada.g.who: "Lis les partages : `cat vigicam/partages.json`. Une adresse n'est pas de la famille. Réponds avec `answer who <adresse>`."
h3.ada.g.who.standard: "Lis `vigicam/partages.json` et réponds avec `answer who`."
h3.ada.who: "Manon, la baby-sitter de l'hiver 2027. Élise lui avait partagé la caméra pour une soirée. Elle n'a rien regardé depuis juin 2028, et elle n'y est pour rien dans notre histoire. Mais un accès dont personne ne se souvient, c'est un accès que personne ne surveille : si le compte de Manon tombe un jour, le salon des Lemerle tombe avec."
h3.ada.g.share: "Retire le partage : `contain revoke partage-manon`."
h3.ada.g.share.standard: "Retire le partage dont plus personne n'a besoin."
h3.ada.share: "Retiré. Élise lui enverra un mot, par politesse. Les accès, ça se donne pour une durée, et ça se relit de temps en temps."
h3.ada.done: "Le salon est de nouveau à eux. Élise veut savoir si elle doit porter plainte : oui, avec l'historique que tu viens de lire, c'est une preuve. Et ce soir elle change ses autres mots de passe. Demain, on regarde ce qui ne passe pas par le Wi-Fi : le hub domotique et ses radios."
h3.hint.ip.1: "`jq -r \".[].ip\" vigicam/connexions.json | sort | uniq -c` compte les connexions par adresse. `192.0.2.44` est la maison, `198.51.100.130` le téléphone d'Élise en 4G."
h3.hint.ip.2: "Tape `answer ip 203.0.113.77`."
h3.hint.since.1: "`grep 203.0.113.77 vigicam/connexions.json` : la première ligne porte la date la plus ancienne, dans le champ `when`."
h3.hint.since.2: "Tape `answer since 2029-04-30`."
h3.hint.how.1: "L'historique dit « password right at first try ». L'avis de Pélican dit que le mot de passe d'Élise a fuité en 2028, et sa note dit qu'elle le met partout."
h3.hint.how.2: "Tape `answer reuse`."
h3.hint.evict.1: "`contain` liste les mesures. Fermer la session ne suffit pas s'il garde le mot de passe, et l'inverse non plus."
h3.hint.evict.2: "Tape `contain revoke session-9c2`, puis `contain reset mot-de-passe`."
h3.hint.who.1: "`cat vigicam/partages.json` : deux adresses finissent par `lemerle.test`, pas la troisième."
h3.hint.who.2: "Tape `answer who manon.b@courriel.example`."
h3.hint.share.1: "Tape `contain revoke partage-manon`."
h3.hint.factor.1: "Tape `answer code`, `answer text` ou `answer none`. Lis le prix de chacune."
h3.debrief.title: "Personne n'a piraté la caméra"
h3.debrief.lesson: "Quelqu'un regardait le salon des Lemerle la nuit, et il n'a forcé ni la caméra, ni le Wi-Fi, ni la box. Il avait le mot de passe : le même qu'Élise utilisait dans une boutique en ligne qui a fuité en 2028. Le compte n'avait pas de seconde vérification, et ses sessions ne se fermaient jamais. C'est l'histoire la plus fréquente derrière « ma caméra a été piratée »."
h3.debrief.p1: "Un mot de passe réutilisé vaut ce que vaut le site le moins protégé où il sert. Des programmes essaient chaque fuite sur des dizaines de services."
h3.debrief.p2: "Pour sortir quelqu'un d'un compte, il faut fermer ses sessions et changer le mot de passe. L'un sans l'autre le laisse revenir, ou rester."
h3.debrief.p3: "Une seconde vérification rend un mot de passe volé insuffisant. Elle se met d'abord sur ce qui voit ou ouvre la maison."
h3.debrief.p4: "Un partage donné pour une soirée reste ouvert des années. La liste des accès se relit comme celle des appareils."
h3.home.p1: "Ouvre l'appli de ta caméra, de ta sonnette ou de ton alarme : cherche « appareils connectés » ou « sessions », et ferme celles que tu ne reconnais pas."
h3.home.p2: "Donne à ce compte un mot de passe qui ne sert nulle part ailleurs, et active la validation en deux étapes."
h3.home.p3: "Relis la liste des personnes avec qui la caméra est partagée. Retire celles qui n'en ont plus besoin."
h3.home.p4: "Si un site t'a prévenu d'une fuite, change ce mot de passe partout où tu l'utilisais, en commençant par ta messagerie."
