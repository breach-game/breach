a2.briefing: "Tuesday. Yesterday the backup bucket, closed since. One bucket is left that really is private: `alto-secrets`. Today you look at the deployment pipeline, the robot that builds the website and publishes it on every change. To publish, it needs an identity at Nimbus. Where does it keep it?"
a2.obj.builds: "Open the deployments page"
a2.obj.log: "Read the log of the last successful deployment"
a2.obj.whoami: "Ask Nimbus who the token belongs to"
a2.obj.secret: "Read the file in the private bucket and submit its flag"
a2.obj.review: "Review `dossier/pipeline.yml` and point at the two faulty lines"
a2.ada.brief: "The \"Our infrastructure\" page of the website gives the address of the deployment pipeline: `https://ci.alto.test/`. Start there."
a2.ada.g.builds: "Open the deployments page: `curl https://ci.alto.test/`."
a2.ada.g.builds.standard: "Open the page of Alto's deployment pipeline."
a2.ada.g.log: "The logs are public. Read the one of the last successful deployment: `curl https://ci.alto.test/builds/412/log`."
a2.ada.g.log.standard: "Deployment logs are public. Read the one that went all the way."
a2.ada.g.whoami: "A token is sent in a header. Ask Nimbus who you are with this one: `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://iam.alto.test/whoami`."
a2.ada.g.whoami.standard: "Present this token to the identity service, `https://iam.alto.test/whoami`, in an `Authorization: Bearer` header."
a2.ada.g.secret: "Try with this token what a stranger is refused. List the private bucket: `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/`."
a2.ada.g.secret.standard: "With this token, go and see the account's private bucket."
a2.ada.g.read: "A single file. Read it with the same header: `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/deploy.env`."
a2.ada.g.read.standard: "Read the file in the bucket, with the same header."
a2.ada.g.submit: "Send the marker of the file: `submit` followed by the flag."
a2.ada.g.submit.standard: "Submit the flag of the file."
a2.ada.g.review: "Alto handed you the pipeline file. Read it with its line numbers: `review dossier/pipeline.yml`. Then point at each faulty line: `review dossier/pipeline.yml <number>`. There are two."
a2.ada.g.review.standard: "Review `dossier/pipeline.yml` with `review` and point at the lines that led the token into the log."
a2.ada.builds: "Two deployments, and a comment in the source: logs are public so that the printer can follow releases. A deployment log tells everything the robot did. Sometimes more."
a2.ada.other: "This one failed its tests, and its debugging step was skipped: nothing to see. Look at the other one."
a2.ada.log: "Step 3, \"debug\": someone wanted to understand a failing deployment, and printed every variable. Two are masked with stars. `NIMBUS_TOKEN` is not: the last line says why."
a2.ada.whoami: "You are `ci-deployer`. Read the dates: token created in January 2026, never rotated, no end date. A token that never expires stays valid for as long as the log stays online."
a2.ada.secret: "To a stranger, this bucket answers \"access denied\". To you it answers, because you are no longer a stranger: you are the deployment robot. The real keys were removed for the audit, the marker is left."
a2.ada.flag: "Proof made. You stop here: the mandate says a secret is only used to prove that it works. One question is left for tomorrow: why can a robot that publishes images read the secrets? Move on to the pipeline review."
a2.ada.review: "Both. Line 10 keeps the token among the ordinary variables, so nothing masks it. Line 14 prints every variable. Each one alone went unnoticed, together they publish a key."
a2.ada.done: "The report will say \"deployment token published in a log\". Switch sides: open the debrief, find your read, and choose what Alto must do first."
a2.soc.secret: "storage: the deployment token read a secret from an unusual address"
a2.hint.builds.1: "Type `curl https://ci.alto.test/`."
a2.hint.log.1: "The table gives the path of each log. Deployment 412 succeeded."
a2.hint.log.2: "Type `curl https://ci.alto.test/builds/412/log`."
a2.hint.whoami.1: "In the log, one variable has a token's name and is not masked with `***`."
a2.hint.whoami.2: "Type `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://iam.alto.test/whoami`."
a2.hint.secret.1: "Without a token, `https://storage.alto.test/alto-secrets/` answers \"access denied\". Try with the token's header."
a2.hint.secret.2: "Type `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/`."
a2.hint.secret.3: "Type `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/deploy.env`, then `submit` followed by the flag."
a2.hint.review.1: "Look for the line that prints, and the line that explains why what is printed is not masked."
a2.hint.review.2: "Variables listed under `secrets:` are masked in logs. The token is not there: where is it declared?"
a2.hint.review.3: "Type `review dossier/pipeline.yml 10`, then `review dossier/pipeline.yml 14`."
a2.def.intro: "The storage also logs reads made with a token. Yours is in there: the right token, the right role, but not the right address."
a2.def.lesson: "A secret that appeared in a log is a published secret. Hiding it afterwards takes it back from nobody: it must be revoked and replaced. Only then do you repair what made it leak."
a2.def.find.secret: "The successful read of the secrets file"
a2.def.rule.read.title: "Alert on any successful read in the secrets bucket"
a2.def.rule.read.why: "This is the one. The deployment publishes images, it never reads this bucket. A successful read there is rare, and this one came from an address that is not the robot's."
a2.def.rule.log.title: "Alert on every read of a deployment log"
a2.def.rule.log.why: "The logs are public on purpose, for the printer. Reading a log is nothing abnormal. What matters is what the token opens next."
a2.def.rule.denied.title: "Alert on every refused read in the secrets bucket"
a2.def.rule.denied.why: "With the token, nothing was refused to you. This rule rings for the curious without a token, and stays silent for the one who picked one up."
a2.def.fix.revoke.title: "Revoke the token and create a new one, stored among the secrets"
a2.def.fix.revoke.why: "This is the one, and it is the first thing to do. The token that was picked up is worth nothing, wherever it was copied. The new one is masked in logs."
a2.def.fix.logs.title: "Make deployment logs private"
a2.def.fix.logs.why: "Useful for later, useless for this token: it has already been read, and it never expires. Whoever copied it still uses it."
a2.def.fix.debug.title: "Remove the debugging step from the pipeline"
a2.def.fix.debug.why: "The next logs will be clean. Log 412 is still online, and the token it holds is still valid."
a2.debrief.title: "A debugging step"
a2.debrief.lesson: "Someone wanted to understand a broken deployment, printed the variables, then moved on. The robot's token, typed by hand and never declared as a secret, went into a public log. A deployment robot is an account like any other, with more rights than most."
a2.debrief.p1: "A leaked secret is revoked first. Cleaning the log comes after, and never replaces the revocation."
a2.debrief.p2: "Every token is declared as a secret, so that the pipeline masks it. Better: tokens of a few minutes, issued at each deployment, which have no time to leak."
a2.debrief.p3: "Deployment logs are not public. A partner who must follow releases gets an access in their own name."
a2.debrief.p4: "Never print every variable, even \"for five minutes\". Print the one you need, then remove the line."
