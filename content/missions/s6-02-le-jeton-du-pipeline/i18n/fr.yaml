a2.briefing: "Mardi. Hier le seau des sauvegardes, refermé depuis. Il reste un seau qui, lui, est privé pour de bon : `alto-secrets`. Aujourd'hui tu regardes la chaîne de déploiement, le robot qui construit le site et le publie à chaque changement. Pour publier, il lui faut une identité chez Nimbus. Où la range-t-il ?"
a2.obj.builds: "Ouvrir la page des déploiements"
a2.obj.log: "Lire le journal du dernier déploiement réussi"
a2.obj.whoami: "Demander à Nimbus à qui appartient le jeton"
a2.obj.secret: "Lire le fichier du seau privé et envoyer son flag"
a2.obj.review: "Relire `dossier/pipeline.yml` et désigner les deux lignes fautives"
a2.ada.brief: "La page « Notre infrastructure » du site donne l'adresse de la chaîne de déploiement : `https://ci.alto.test/`. Commence par là."
a2.ada.g.builds: "Ouvre la page des déploiements : `curl https://ci.alto.test/`."
a2.ada.g.builds.standard: "Ouvre la page de la chaîne de déploiement d'Alto."
a2.ada.g.log: "Les journaux sont publics. Lis celui du dernier déploiement réussi : `curl https://ci.alto.test/builds/412/log`."
a2.ada.g.log.standard: "Les journaux des déploiements sont publics. Lis celui qui est allé jusqu'au bout."
a2.ada.g.whoami: "Un jeton s'envoie dans un en-tête. Demande à Nimbus qui tu es avec celui-ci : `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://iam.alto.test/whoami`."
a2.ada.g.whoami.standard: "Présente ce jeton au service d'identités, `https://iam.alto.test/whoami`, dans un en-tête `Authorization: Bearer`."
a2.ada.g.secret: "Essaie avec ce jeton ce qu'un inconnu se voit refuser. Liste le seau privé : `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/`."
a2.ada.g.secret.standard: "Avec ce jeton, va voir le seau privé du compte."
a2.ada.g.read: "Un seul fichier. Lis-le avec le même en-tête : `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/deploy.env`."
a2.ada.g.read.standard: "Lis le fichier du seau, avec le même en-tête."
a2.ada.g.submit: "Envoie le témoin du fichier : `submit` suivi du flag."
a2.ada.g.submit.standard: "Envoie le flag du fichier."
a2.ada.g.review: "Alto t'a remis le fichier du pipeline. Lis-le avec ses numéros de ligne : `review dossier/pipeline.yml`. Puis désigne chaque ligne fautive : `review dossier/pipeline.yml <numéro>`. Il y en a deux."
a2.ada.g.review.standard: "Relis `dossier/pipeline.yml` avec `review` et désigne les lignes qui ont mené le jeton dans le journal."
a2.ada.builds: "Deux déploiements, et un commentaire dans la source : les journaux sont publics pour que l'imprimeur suive les mises en ligne. Un journal de déploiement raconte tout ce que le robot a fait. Parfois plus."
a2.ada.other: "Celui-ci a échoué aux tests, et son étape de débogage a été sautée : rien à voir. Regarde l'autre."
a2.ada.log: "Étape 3, « debug » : quelqu'un a voulu comprendre un déploiement qui échouait, et a fait afficher toutes les variables. Deux sont masquées par des étoiles. `NIMBUS_TOKEN` ne l'est pas : la dernière ligne dit pourquoi."
a2.ada.whoami: "Tu es `ci-deployer`. Lis les dates : jeton créé en janvier 2026, jamais renouvelé, sans date de fin. Un jeton qui n'expire pas reste valable aussi longtemps que le journal reste en ligne."
a2.ada.secret: "À un inconnu, ce seau répond « accès refusé ». À toi il répond, parce que tu n'es plus un inconnu : tu es le robot de déploiement. Les vraies clés ont été retirées pour l'audit, il reste le témoin."
a2.ada.flag: "Preuve faite. Tu t'arrêtes là : le mandat dit qu'un secret ne sert qu'à prouver qu'il fonctionne. Une question reste pour demain : pourquoi un robot qui publie des images peut-il lire les secrets ? Passe à la relecture du pipeline."
a2.ada.review: "Les deux. La ligne 10 range le jeton parmi les variables ordinaires, donc rien ne le masque. La ligne 14 affiche toutes les variables. Chacune seule passait inaperçue, ensemble elles publient une clé."
a2.ada.done: "Le rapport dira « jeton de déploiement publié dans un journal ». Passe de l'autre côté : ouvre le débrief, retrouve ta lecture, et choisis ce qu'Alto doit faire en premier."
a2.soc.secret: "storage: the deployment token read a secret from an unusual address"
a2.hint.builds.1: "Tape `curl https://ci.alto.test/`."
a2.hint.log.1: "Le tableau donne le chemin de chaque journal. Celui du déploiement 412 a réussi."
a2.hint.log.2: "Tape `curl https://ci.alto.test/builds/412/log`."
a2.hint.whoami.1: "Dans le journal, une variable porte un nom de jeton et n'est pas masquée par `***`."
a2.hint.whoami.2: "Tape `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://iam.alto.test/whoami`."
a2.hint.secret.1: "Sans jeton, `https://storage.alto.test/alto-secrets/` répond « accès refusé ». Essaie avec l'en-tête du jeton."
a2.hint.secret.2: "Tape `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/`."
a2.hint.secret.3: "Tape `curl -H \"Authorization: Bearer nmb_ci_4c81e7\" https://storage.alto.test/alto-secrets/deploy.env`, puis `submit` suivi du flag."
a2.hint.review.1: "Cherche la ligne qui affiche, et la ligne qui explique pourquoi ce qui est affiché n'est pas masqué."
a2.hint.review.2: "Les variables listées sous `secrets:` sont masquées dans les journaux. Le jeton n'y est pas : où est-il déclaré ?"
a2.hint.review.3: "Tape `review dossier/pipeline.yml 10`, puis `review dossier/pipeline.yml 14`."
a2.def.intro: "Le stockage journalise aussi les lectures faites avec un jeton. La tienne y est : le bon jeton, le bon rôle, mais pas la bonne adresse."
a2.def.lesson: "Un secret qui a paru dans un journal est un secret publié. Le cacher après coup ne le reprend à personne : il faut le révoquer et en créer un autre. Ensuite seulement on répare ce qui l'a fait fuir."
a2.def.find.secret: "La lecture réussie du fichier de secrets"
a2.def.rule.read.title: "Alerter sur toute lecture réussie dans le seau des secrets"
a2.def.rule.read.why: "C'est la bonne. Le déploiement publie des images, il ne lit jamais ce seau. Une lecture réussie y est rare, et celle-ci venait d'une adresse qui n'est pas celle du robot."
a2.def.rule.log.title: "Alerter sur chaque lecture d'un journal de déploiement"
a2.def.rule.log.why: "Les journaux sont publics exprès, pour l'imprimeur. Lire un journal n'a rien d'anormal. Ce qui compte, c'est ce que le jeton ouvre ensuite."
a2.def.rule.denied.title: "Alerter sur chaque lecture refusée dans le seau des secrets"
a2.def.rule.denied.why: "Avec le jeton, rien ne t'a été refusé. Cette règle sonne pour le curieux sans jeton, et se tait pour celui qui en a ramassé un."
a2.def.fix.revoke.title: "Révoquer le jeton et en créer un nouveau, rangé parmi les secrets"
a2.def.fix.revoke.why: "C'est la bonne, et c'est la première chose à faire. Le jeton ramassé ne vaut plus rien, où qu'il ait été copié. Le nouveau est masqué dans les journaux."
a2.def.fix.logs.title: "Rendre les journaux de déploiement privés"
a2.def.fix.logs.why: "Utile pour la suite, inutile pour ce jeton : il a déjà été lu, et il n'expire jamais. Celui qui l'a copié s'en sert toujours."
a2.def.fix.debug.title: "Retirer l'étape de débogage du pipeline"
a2.def.fix.debug.why: "Les prochains journaux seront propres. Le journal 412 est toujours en ligne, et le jeton qu'il contient est toujours valable."
a2.debrief.title: "Une étape de débogage"
a2.debrief.lesson: "Quelqu'un a voulu comprendre un déploiement en panne, a fait afficher les variables, puis est passé à autre chose. Le jeton du robot, tapé à la main et jamais déclaré comme secret, est parti dans un journal public. Un robot de déploiement est un compte comme un autre, avec plus de droits que la plupart."
a2.debrief.p1: "Un secret qui a fui se révoque d'abord. Nettoyer le journal vient après, et ne remplace jamais la révocation."
a2.debrief.p2: "Tout jeton est déclaré comme secret, pour que la chaîne le masque. Mieux : des jetons de quelques minutes, émis à chaque déploiement, qui n'ont pas le temps de fuir."
a2.debrief.p3: "Les journaux de déploiement ne sont pas publics. Un partenaire qui doit suivre les mises en ligne reçoit un accès à son nom."
a2.debrief.p4: "Jamais d'affichage de toutes les variables, même « pour cinq minutes ». On affiche celle dont on a besoin, et on retire la ligne."
