n4.briefing: "Friday 22 September, 6 pm. The gates open tomorrow. Malia writes to you, and not about a bounty this time: three festival-goers have just called the front desk, they received a message from the ticket office asking them to \"confirm a transfer\" they never made. The ticket office sent no such thing. The festival asks Ada and you to switch to the defence side for the evening, with the SOC console."
n4.file.rule: "# Detection rule, try it with: rule test regles/faux-billets.yml\n# One condition per line. Fields of the mail log: from, to, subject, link, verdict.\n# Modifiers: |contains, |startswith, |endswith.\ntitle: Fake message from the ticket office\nsource: mail\nsubject|contains: billet\n"
n4.obj.reset: "Make the stolen passwords useless"
n4.obj.stop: "See the ticket thefts stop"
n4.obj.sender: "Shut the door on the fake sender"
n4.obj.domain: "Name the fake domain (`answer domain`)"
n4.obj.detect: "Write the rule that recognises these messages"
n4.obj.lesson: "Choose what would have protected the tickets"
n4.obj.ip: "Name the address that signs in (`answer ip`)"
n4.q.domain: "Which domain do the fake messages come from?"
n4.q.ip: "Which address do the sign-ins to the stolen accounts come from?"
n4.q.lesson: "The passwords were given by their owners, on a well-imitated page. What would have kept the tickets safe anyway?"
n4.q.lesson.train: "Train festival-goers to recognise a fake message"
n4.q.lesson.train.why: "Useful, and never enough. Out of tens of thousands of people, the day before a festival, someone will always click. A defence that needs nobody to make a mistake is not a defence."
n4.q.lesson.confirm: "Have every transfer confirmed on the holder's phone"
n4.q.lesson.filter: "Block every message that talks about tickets"
n4.q.lesson.filter.why: "The ticket office itself sends messages about tickets, all day long. You have just blocked those too, and the fake sender only has to change one word."
n4.contain.reset: "Passwords reset for the accounts that received the fake message, sessions closed"
n4.contain.sender: "Domain lumiere-noire-billets.test refused by the mail gateway"
n4.contain.address: "Address 10.21.0.50 blocked at the ticket office's door"
n4.contain.transfers: "Ticket transfers suspended for everyone"
n4.alert.lookalike: "Message from a domain that imitates the festival's"
n4.alert.lookalike.why: "The sender looks like the ticket office's, but its domain does not belong to the festival."
n4.alert.script: "Sign-ins to the ticket office by a program"
n4.alert.script.why: "Festival-goers sign in with a browser or the application. This client is a script."
n4.ada.brief: "I'm with you. We look before we cut: `soc sources` tells you which logs you have, `soc alerts` what has rung, `contain` what you can cut. Every measure has a price for the festival, the day before the gates open."
n4.ada.echo.early: "A word before we start. Your article of 6 September travelled far, and the fake message quotes it: \"following the flaw revealed this month, confirm your ticket\". They did not need you to go phishing, but you wrote their opening line."
n4.ada.echo.wait: "A word before we start. Nothing was published about the ticket office this month, so the fake message has no news to quote: it talks about a transfer, nothing more. That is one thing less to make it believable."
n4.ada.echo.never: "A word before we start. Nobody read anything about the ticket office this month, so the fake message has no news to quote. Your silence did not stop them either: this kind of wave happens to every festival."
n4.ada.g.start: "Start by seeing which logs you have: `soc sources`."
n4.ada.g.start.standard: "Look at which logs you have, then at the SOC alerts."
n4.ada.g.alerts: "An alert has just come in. Read it: `soc alerts`."
n4.ada.g.alerts.standard: "An alert has just come in on the SOC."
n4.ada.g.logs: "The alert comes from the mail gateway. Read its lines: `soc logs mail mail`."
n4.ada.g.logs.standard: "The alert comes from the mail gateway. Read its log."
n4.ada.g.cut: "The messages already received have done their job: passwords are gone. Make them useless: `contain reset destinataires`."
n4.ada.g.cut.standard: "Passwords are already gone. `contain` lists the possible measures: choose the one that makes them useless."
n4.ada.g.again: "That does not fix the root of it: the stolen passwords still work. Reset them: `contain reset destinataires`."
n4.ada.g.again.standard: "The stolen passwords still work. One measure is left to take."
n4.ada.g.watch: "Its next sign-in must be refused. You can check with `soc logs tickets flow`."
n4.ada.g.watch.standard: "Check in the ticket office's logs that its next sign-in is refused."
n4.ada.g.sender: "Now stop the next messages from arriving: `contain block lumiere-noire-billets.test`."
n4.ada.g.sender.standard: "More messages can still be sent. Shut the door on the fake sender."
n4.ada.g.domain: "Note the fake domain for the write-up: `answer domain lumiere-noire-billets.test`."
n4.ada.g.domain.standard: "Give the fake domain with `answer domain`."
n4.ada.g.detect: "Malia started a rule. Read it, `cat regles/faux-billets.yml`, then try it against the logs: `rule test regles/faux-billets.yml`."
n4.ada.g.detect.standard: "A detection rule is waiting for you in `regles/`. `rule test <file>` tries it against the logs."
n4.ada.g.false: "It catches the fake messages, and the real ones too: the ticket office talks about tickets all day. What sets them apart is the sender. Add a condition: `echo \"from|endswith: lumiere-noire-billets.test\" >> regles/faux-billets.yml`."
n4.ada.g.false.standard: "It also rings on the ticket office's real messages. What do the fake ones have that is different?"
n4.ada.g.missed: "It no longer rings wrongly, but it misses fake messages. Read their lines again with `soc logs mail mail` and use the same fields."
n4.ada.g.missed.standard: "It misses fake messages. Read their lines again in the mail log."
n4.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
n4.ada.answer.standard: "Answer my question."
n4.ada.mails: "Look at the sender: `billets@lumiere-noire-billets.test`. The real one is `billets@lumierenoire.test`. Two hyphens and one extra word, and the link leads to their place. On a phone, the day before the festival, nobody reads that letter by letter. The page behind the link asks for the ticket office password, and the rest happens on our side."
n4.ada.login: "There it is: a sign-in to the ticket office, by a script. A password given on the fake page has just been used on the real one."
n4.ada.first: "A first ticket has just been transferred to an account we do not know. Its owner does not know yet."
n4.ada.second: "Second ticket gone. One phished account is left, with one ticket in it. Cut now."
n4.ada.fail: "Three tickets have changed hands, and three people will be left at the gate tomorrow. We start again: the messages have already been read, it is the stolen passwords that must become useless, and fast."
n4.ada.sender.early: "The next messages will be refused, good. But the ones that arrived have already been read, and the passwords given on the fake page are still valid. You turned off the tap, the water is already in the house."
n4.ada.sender: "No more messages from that domain will get past the gateway. They will buy another one, a hyphen away, but not tonight."
n4.ada.address: "That stops it, for now. An address can be changed in a minute, and the stolen passwords will work from the next one."
n4.ada.transfers: "That stops them, and it stops everyone else too: the day before the gates open, hundreds of people resell or give away their ticket. The front desk will spend the evening on the phone. And the stolen passwords are still valid."
n4.ada.reset: "That is the right wire. The three accounts that received the message have a new password, their sessions are closed, and their owners get a real message from Malia. What was typed on the fake page is worth nothing now."
n4.ada.stopped: "Done: its next attempt was refused, and the script stopped. Now we tidy up: the mail door, the name of the fake domain, and a rule for the next wave."
n4.ada.detect: "It only rings on the fake ones. The gateway can set those messages aside before they arrive, instead of counting on the front desk to hear the news by phone. Last question, and it is the one that matters most."
n4.ada.lesson: "There. A stolen password must not be enough to make a ticket leave. If the holder has to confirm from their phone or their inbox, the thief is left with a password and nothing to do with it. Malia is putting it at the top of the fix list."
n4.ada.done: "The gates open tomorrow. Malia cancels the transfers the script made, and everyone gets their ticket back. Open the debrief."
n4.ada.end.early: "End of the Lumière Noire programme. You read a set of rules before touching anything, found a logic flaw no scanner sees, wrote a report without one piece of real data, and spent an evening on the side of those who get the bad news. Malia did not keep you any seats this time."
n4.ada.end: "End of the Lumière Noire programme. You read a set of rules before touching anything, found a logic flaw no scanner sees, wrote a report without one piece of real data, and spent an evening on the side of those who get the bad news. Malia put two tickets aside for you. Real ticket, real domain."
n4.hint.reset.1: "`soc alerts` shows what has rung, `soc logs mail mail` shows the messages, `soc logs tickets access` the sign-ins."
n4.hint.reset.2: "Blocking the sender does not undo the messages already received. `contain` lists the measures: one of them changes the passwords of the targeted accounts."
n4.hint.reset.3: "Type `contain reset destinataires`."
n4.hint.stop.1: "Once the passwords are changed, type `soc logs tickets flow`: the next attempt shows there as `deny`."
n4.hint.sender.1: "`contain` lists the possible measures. One of them refuses the fake domain at the mail gateway."
n4.hint.sender.2: "Type `contain block lumiere-noire-billets.test`."
n4.hint.domain.1: "The domain is what follows the at sign in the `from` field of the fake messages: `soc logs mail mail`."
n4.hint.domain.2: "Type `answer domain lumiere-noire-billets.test`."
n4.hint.detect.1: "`rule test regles/faux-billets.yml` shows the lines the rule catches: \"!\" for the intruder, \"?\" for ordinary activity."
n4.hint.detect.2: "The real messages come from `lumierenoire.test`. The fake ones come from `lumiere-noire-billets.test`."
n4.hint.detect.3: "`echo \"from|endswith: lumiere-noire-billets.test\" >> regles/faux-billets.yml`, then `rule test regles/faux-billets.yml`."
n4.hint.lesson.1: "Look for the measure that still holds once someone has clicked and given their password."
n4.debrief.title: "A hyphen away"
n4.debrief.lesson: "No flaw in the ticket office was used tonight. People received a well-imitated message, typed their password on a page that looked like the real one, and that password opened their account. Blocking the sender was not enough: what had already been given had to become useless."
n4.debrief.p1: "When phishing has worked, the first measure is about the accounts: new password, sessions closed. Filtering the messages comes next."
n4.debrief.p2: "A sensitive action, such as handing over a ticket, needs a confirmation from the holder through a second channel. A stolen password is no longer enough."
n4.debrief.p3: "The festival declares its legitimate senders (SPF, DKIM, DMARC) and watches for domains that look like its own. A rule on the sender's domain is worth more than a rule on the words of the message."
n4.debrief.p4: "The festival-goers who called the front desk raised the alarm. We thank them, and we blame nobody who clicked: the page was made for that."
