n4.briefing: "Vendredi 22 septembre, 18 heures. Les portes ouvrent demain. Malia t'écrit, et pas pour une prime cette fois : trois festivaliers viennent d'appeler l'accueil, ils ont reçu un message de la billetterie qui leur demande de « confirmer un transfert » qu'ils n'ont jamais fait. La billetterie n'a rien envoyé de tel. Le festival vous demande, à Ada et à toi, de passer côté défense pour la soirée, avec la console du SOC."
n4.file.rule: "# Règle de détection, à essayer avec : rule test regles/faux-billets.yml\n# Une ligne par condition. Champs du journal mail : from, to, subject, link, verdict.\n# Modificateurs : |contains, |startswith, |endswith.\ntitle: Faux message de la billetterie\nsource: mail\nsubject|contains: billet\n"
n4.obj.reset: "Rendre inutiles les mots de passe volés"
n4.obj.stop: "Voir les vols de billets s'arrêter"
n4.obj.sender: "Fermer la porte au faux expéditeur"
n4.obj.domain: "Nommer le faux domaine (`answer domain`)"
n4.obj.detect: "Écrire la règle qui reconnaît ces messages"
n4.obj.lesson: "Choisir ce qui aurait protégé les billets"
n4.obj.ip: "Nommer l'adresse qui se connecte (`answer ip`)"
n4.q.domain: "De quel domaine partent les faux messages ?"
n4.q.ip: "De quelle adresse viennent les connexions aux comptes volés ?"
n4.q.lesson: "Les mots de passe ont été donnés par leurs propriétaires, sur une page bien imitée. Qu'est-ce qui aurait gardé les billets à l'abri quand même ?"
n4.q.lesson.train: "Former les festivaliers à reconnaître un faux message avant de cliquer"
n4.q.lesson.train.why: "Utile, et jamais suffisant. Sur des dizaines de milliers de personnes, la veille d'un festival, quelqu'un cliquera toujours. Une défense qui exige que personne ne se trompe n'en est pas une."
n4.q.lesson.confirm: "Faire confirmer chaque transfert sur le téléphone du titulaire"
n4.q.lesson.filter: "Bloquer tous les messages qui parlent de billets"
n4.q.lesson.filter.why: "La billetterie envoie elle-même des messages qui parlent de billets, toute la journée. Tu viens de les bloquer aussi, et le faux expéditeur n'a qu'à changer un mot."
n4.contain.reset: "Mots de passe réinitialisés pour les comptes qui ont reçu le faux message, sessions fermées"
n4.contain.sender: "Domaine lumiere-noire-billets.test refusé par la passerelle de messagerie"
n4.contain.address: "Adresse 10.21.0.50 bloquée à l'entrée de la billetterie"
n4.contain.transfers: "Transferts de billets suspendus pour tout le monde"
n4.alert.lookalike: "Message d'un domaine qui imite celui du festival"
n4.alert.lookalike.why: "L'expéditeur ressemble à celui de la billetterie, mais son domaine n'appartient pas au festival."
n4.alert.script: "Connexions à la billetterie par un programme"
n4.alert.script.why: "Les festivaliers se connectent avec un navigateur ou l'application. Ce client-là est un script."
n4.ada.brief: "Je suis avec toi. On regarde avant de couper : `soc sources` te dit quels journaux tu as, `soc alerts` ce qui a sonné, `contain` ce que tu peux couper. Chaque mesure a un prix pour le festival, la veille de l'ouverture."
n4.ada.echo.early: "Un mot avant de commencer. Ton article du 6 septembre a beaucoup circulé, et le faux message le cite : « suite à la faille révélée ce mois-ci, confirmez votre billet ». Ils n'avaient pas besoin de toi pour hameçonner, mais tu leur as écrit l'accroche."
n4.ada.echo.wait: "Un mot avant de commencer. Rien n'a été publié sur la billetterie ce mois-ci, donc le faux message n'a aucune actualité à citer : il parle d'un transfert, sans plus. C'est déjà ça de moins de crédible."
n4.ada.echo.never: "Un mot avant de commencer. Personne n'a rien lu sur la billetterie ce mois-ci, donc le faux message n'a aucune actualité à citer. Ton silence ne les a pas arrêtés non plus : ce genre de vague arrive à tous les festivals."
n4.ada.g.start: "Commence par voir quels journaux tu as : `soc sources`."
n4.ada.g.start.standard: "Regarde quels journaux tu as, puis les alertes du SOC."
n4.ada.g.alerts: "Une alerte vient de tomber. Lis-la : `soc alerts`."
n4.ada.g.alerts.standard: "Une alerte vient de tomber dans le SOC."
n4.ada.g.logs: "L'alerte vient de la passerelle de messagerie. Lis ses lignes : `soc logs mail mail`."
n4.ada.g.logs.standard: "L'alerte vient de la passerelle de messagerie. Lis son journal."
n4.ada.g.cut: "Les messages déjà reçus ont fait leur travail : des mots de passe sont partis. Rends-les inutiles : `contain reset destinataires`."
n4.ada.g.cut.standard: "Des mots de passe sont déjà partis. `contain` liste les mesures possibles : choisis celle qui les rend inutiles."
n4.ada.g.again: "Ça ne règle pas le fond : les mots de passe volés marchent toujours. Réinitialise-les : `contain reset destinataires`."
n4.ada.g.again.standard: "Les mots de passe volés marchent toujours. Il reste une mesure à prendre."
n4.ada.g.watch: "Sa prochaine connexion doit être refusée. Tu pourras le vérifier avec `soc logs tickets flow`."
n4.ada.g.watch.standard: "Vérifie dans les journaux de la billetterie que sa prochaine connexion est refusée."
n4.ada.g.sender: "Maintenant, empêche les prochains messages d'arriver : `contain block lumiere-noire-billets.test`."
n4.ada.g.sender.standard: "D'autres messages peuvent encore partir. Ferme la porte au faux expéditeur."
n4.ada.g.domain: "Note le faux domaine pour le compte rendu : `answer domain lumiere-noire-billets.test`."
n4.ada.g.domain.standard: "Donne le faux domaine avec `answer domain`."
n4.ada.g.detect: "Malia a commencé une règle. Lis-la, `cat regles/faux-billets.yml`, puis essaie-la contre les journaux : `rule test regles/faux-billets.yml`."
n4.ada.g.detect.standard: "Une règle de détection t'attend dans `regles/`. `rule test <fichier>` l'essaie contre les journaux. Pour ouvrir le fichier : `edit regles/faux-billets.yml`."
n4.ada.g.false: "Elle attrape les faux messages, et aussi les vrais : la billetterie parle de billets toute la journée. Ce qui les distingue, c'est l'expéditeur. Ajoute une condition : `echo \"from|endswith: lumiere-noire-billets.test\" >> regles/faux-billets.yml`. Ou à la main, dans l'éditeur : `edit regles/faux-billets.yml`, puis Ctrl+S."
n4.ada.g.false.standard: "Elle sonne aussi sur les vrais messages de la billetterie. Qu'est-ce que les faux ont de différent ?"
n4.ada.g.missed: "Elle ne sonne plus à tort, mais elle rate des faux messages. Relis leurs lignes avec `soc logs mail mail` et reprends les mêmes champs."
n4.ada.g.missed.standard: "Elle rate des faux messages. Relis leurs lignes dans le journal de la messagerie."
n4.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
n4.ada.answer.standard: "Réponds à ma question."
n4.ada.mails: "Regarde l'expéditeur : `billets@lumiere-noire-billets.test`. Le vrai, c'est `billets@lumierenoire.test`. Deux tirets et un mot de plus, et le lien mène chez eux. Sur un téléphone, la veille du festival, personne ne lit ça lettre à lettre. La page au bout du lien demande le mot de passe de la billetterie, et la suite se passe chez nous."
n4.ada.login: "Ça y est : une connexion à la billetterie, par un script. C'est un mot de passe donné sur la fausse page qui vient de servir sur la vraie."
n4.ada.first: "Un premier billet vient d'être transféré vers un compte qu'on ne connaît pas. Son propriétaire ne le sait pas encore."
n4.ada.second: "Deuxième billet parti. Il reste un compte hameçonné, et un billet dedans. Coupe maintenant."
n4.ada.fail: "Trois billets ont changé de main, et trois personnes resteront à la grille demain. On reprend : les messages sont déjà lus, ce sont les mots de passe volés qu'il faut rendre inutiles, et vite."
n4.ada.sender.early: "Les prochains messages seront refusés, c'est bien. Mais ceux qui sont arrivés ont déjà été lus, et les mots de passe donnés sur la fausse page sont toujours bons. Tu as fermé le robinet, l'eau est déjà dans la maison."
n4.ada.sender: "Plus aucun message de ce domaine ne passera la passerelle. Ils en achèteront un autre, à un tiret près, mais pas ce soir."
n4.ada.address: "Ça l'arrête, pour l'instant. Une adresse, ça se change en une minute, et les mots de passe volés marcheront depuis la suivante."
n4.ada.transfers: "Ça les arrête, et ça arrête aussi tout le monde : la veille de l'ouverture, des centaines de gens revendent ou offrent leur place. L'accueil va passer la soirée au téléphone. Et les mots de passe volés sont toujours bons."
n4.ada.reset: "C'est le bon fil. Les trois comptes qui ont reçu le message ont un nouveau mot de passe, leurs sessions sont fermées, et leurs propriétaires reçoivent un vrai message de Malia. Ce qui a été tapé sur la fausse page ne vaut plus rien."
n4.ada.stopped: "C'est fait : sa tentative suivante a été refusée, et le script s'est arrêté. Maintenant on met de l'ordre : la porte de la messagerie, le nom du faux domaine, et une règle pour la prochaine vague."
n4.ada.detect: "Elle ne sonne que sur les faux. La passerelle pourra mettre ces messages de côté avant qu'ils arrivent, au lieu de compter sur l'accueil pour apprendre la nouvelle par téléphone. Dernière question, et c'est la plus importante."
n4.ada.lesson: "Voilà. Un mot de passe volé ne doit pas suffire à faire partir un billet. Si le titulaire doit confirmer depuis son téléphone ou sa boîte, le voleur se retrouve avec un mot de passe et rien à en faire. Malia l'ajoute en haut de la liste des corrections."
n4.ada.done: "Les portes ouvrent demain. Malia annule les transferts faits par le script, et chacun retrouve son billet. Ouvre le débrief."
n4.ada.end.early: "Fin du programme Lumière Noire. Tu as lu un règlement avant de toucher à quoi que ce soit, trouvé une faille de logique qu'aucun scanner ne voit, écrit un rapport sans une donnée réelle, et passé une soirée du côté de ceux qui reçoivent les mauvaises nouvelles. Malia ne t'a pas gardé de places, cette fois."
n4.ada.end: "Fin du programme Lumière Noire. Tu as lu un règlement avant de toucher à quoi que ce soit, trouvé une faille de logique qu'aucun scanner ne voit, écrit un rapport sans une donnée réelle, et passé une soirée du côté de ceux qui reçoivent les mauvaises nouvelles. Malia t'a mis deux places de côté. Vrai billet, vrai domaine."
n4.hint.reset.1: "`soc alerts` montre ce qui a sonné, `soc logs mail mail` montre les messages, `soc logs tickets access` les connexions."
n4.hint.reset.2: "Bloquer l'expéditeur n'annule pas les messages déjà reçus. `contain` liste les mesures : l'une d'elles change les mots de passe des comptes visés."
n4.hint.reset.3: "Tape `contain reset destinataires`."
n4.hint.stop.1: "Une fois les mots de passe changés, tape `soc logs tickets flow` : la tentative suivante y apparaît en `deny`."
n4.hint.sender.1: "`contain` liste les mesures possibles. L'une d'elles refuse le faux domaine à la passerelle de messagerie."
n4.hint.sender.2: "Tape `contain block lumiere-noire-billets.test`."
n4.hint.domain.1: "Le domaine est ce qui suit l'arobase dans le champ `from` des faux messages : `soc logs mail mail`."
n4.hint.domain.2: "Tape `answer domain lumiere-noire-billets.test`."
n4.hint.detect.1: "`rule test regles/faux-billets.yml` montre les lignes que la règle attrape : « ! » pour l'intrus, « ? » pour l'activité ordinaire."
n4.hint.detect.2: "Les vrais messages viennent de `lumierenoire.test`. Les faux viennent de `lumiere-noire-billets.test`."
n4.hint.detect.3: "`echo \"from|endswith: lumiere-noire-billets.test\" >> regles/faux-billets.yml`, puis `rule test regles/faux-billets.yml`. Ou à la main, dans l'éditeur : `edit regles/faux-billets.yml`, puis Ctrl+S."
n4.hint.lesson.1: "Cherche la mesure qui tient encore quand quelqu'un a cliqué et donné son mot de passe."
n4.debrief.title: "À un tiret près"
n4.debrief.lesson: "Aucune faille de la billetterie n'a servi ce soir. Des gens ont reçu un message bien imité, ont tapé leur mot de passe sur une page qui ressemblait à la vraie, et ce mot de passe a ouvert leur compte. Bloquer l'expéditeur ne suffisait pas : il fallait rendre inutile ce qui avait déjà été donné."
n4.debrief.p1: "Quand un hameçonnage a réussi, la première mesure porte sur les comptes : nouveau mot de passe, sessions fermées. Le filtrage des messages vient ensuite."
n4.debrief.p2: "Une action sensible, comme céder un billet, demande une confirmation du titulaire par un second canal. Un mot de passe volé ne suffit plus."
n4.debrief.p3: "Le festival déclare ses expéditeurs légitimes (SPF, DKIM, DMARC) et surveille les domaines qui ressemblent au sien. Une règle sur le domaine de l'expéditeur vaut mieux qu'une règle sur les mots du message."
n4.debrief.p4: "Les festivaliers qui ont appelé l'accueil ont donné l'alerte. On les remercie, et on ne reproche rien à ceux qui ont cliqué : la page était faite pour ça."
