summary:
  fr: "Côté défense. La veille de l'ouverture, des festivaliers reçoivent un message qui ressemble à ceux de la billetterie, à un tiret près. Certains ont déjà donné leur mot de passe, et leurs billets commencent à changer de main. Tu coupes le bon fil, tu nommes le faux domaine, et tu écris la règle qui le reconnaît."
  en: "Defence side. The day before the gates open, festival-goers receive a message that looks like the ticket office's, give or take a hyphen. Some have already given their password, and their tickets are starting to change hands. You cut the right wire, name the fake domain, and write the rule that recognises it."
