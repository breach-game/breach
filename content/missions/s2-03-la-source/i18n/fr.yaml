h3.briefing: "La direction de Halcyon a vu ton paquet témoin dans la construction. Elle veut garder son miroir ouvert, qui rend service, mais que plus jamais un paquet public ne remplace un paquet maison. Tu as le fichier de résolution et une matinée."
h3.obj.idea: "Répondre à la première idée de l'équipe de construction"
h3.obj.reserve: "Déclarer les noms de paquets qui appartiennent à Halcyon"
h3.obj.close: "Interdire qu'un nom interne soit pris sur une source publique"
h3.q.idea: "L'équipe propose : « On inverse l'ordre : d'abord l'interne, ensuite le public. » Est-ce suffisant ?"
h3.q.idea.trust: "Oui : si la source interne est interrogée en premier, son paquet gagnera toujours contre le public"
h3.q.idea.trust.why: "Non : la règle reste « la version la plus haute gagne ». Un paquet public en version 9.9.9 repasse devant l'interne, quel que soit l'ordre des sources. Il faut nommer ce qui est à nous."
h3.q.idea.own: "Non : il faut dire à la chaîne quels noms sont à Halcyon, et lui interdire de les chercher dehors"
h3.q.idea.scan: "Non : il faut surtout analyser le contenu de chaque paquet avant de l'installer, quels que soient son nom et sa source"
h3.q.idea.scan.why: "Analyser aide, mais le paquet malveillant porte le nom d'un paquet de confiance : il passe les contrôles qui regardent le nom. Le problème est la provenance, pas le contenu."
h3.check.reserve: "Les deux paquets maison sont déclarés comme internes"
h3.check.close: "Un nom interne ne peut plus venir d'une source publique"
h3.ada.brief: "Dernière matinée chez Halcyon. Le fichier est `dossier/resolve.yml`. L'équipe de construction a une idée, écoute-la d'abord."
h3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h3.ada.answer.standard: "Réponds d'abord à la question de l'équipe."
h3.ada.idea: "Oui. Inverser l'ordre ne suffit pas tant que la version la plus haute l'emporte. La vraie réponse est de nommer ce qui t'appartient."
h3.ada.g.reserve: "Ouvre le fichier : `edit dossier/resolve.yml`. La liste `internal_names` est vide. Mets-y les deux paquets maison, `halcyon-telemetry` et `halcyon-auth`, puis `verify`."
h3.ada.g.reserve.standard: "Déclare les deux paquets maison dans `internal_names` : le dépôt interne les liste. Puis `verify`. Pour ouvrir le fichier : `edit dossier/resolve.yml`."
h3.ada.g.close: "Ensuite, le verrou : tant que `allow_public_for_internal` vaut `true`, un nom interne peut encore venir du miroir public. Passe-le à `false`, puis `verify`."
h3.ada.g.close.standard: "Interdis qu'un nom interne soit pris sur une source publique. Puis `verify`."
h3.ada.almost: "Tout ne passe pas encore. Lis les lignes marquées FAIL, corrige le fichier, et relance `verify`."
h3.ada.done: "Maintenant, pour ces deux noms, la chaîne pose la question manquante : « ce nom est-il à nous ? » Si oui, elle n'ira plus le chercher dehors. Ouvre le débrief : à la fin, la recherche d'où vient cette saison."
h3.hint.idea.1: "Demande-toi ce que fait une version publique 9.9.9 face à une interne 1.4.2, quel que soit l'ordre des sources."
h3.hint.reserve.1: "La ligne à changer est `internal_names`. Mets les deux noms entre crochets."
h3.hint.reserve.2: "Avec l'éditeur : `edit dossier/resolve.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/internal_names: \\[\\]/internal_names: [halcyon-telemetry, halcyon-auth]/\" dossier/resolve.yml`."
h3.hint.close.1: "La ligne à changer est `allow_public_for_internal`. La valeur sûre est `false`."
h3.hint.close.2: "Avec l'éditeur : `edit dossier/resolve.yml`, puis Ctrl+S. Avec une commande : tape `sed -i \"s/allow_public_for_internal: true/allow_public_for_internal: false/\" dossier/resolve.yml`, puis `verify`."
h3.debrief.title: "Nommer ce qui est à soi"
h3.debrief.lesson: "Tu n'as pas fermé le miroir public, qui rend service. Tu as appris à la chaîne quels noms appartiennent à Halcyon, et tu lui as interdit d'aller les chercher ailleurs. La confusion ne repose plus sur une question que personne ne posait."
h3.debrief.p1: "Déclare les noms de tes paquets internes et réserve-les : un inconnu ne doit pas pouvoir les publier sur un dépôt public."
h3.debrief.p2: "Chaque dépendance interne vient d'une source connue. Une même dépendance ne doit pas pouvoir basculer vers une source publique sur un simple numéro de version."
h3.debrief.p3: "« La version la plus haute gagne » est pratique, mais dangereux quand les sources ne sont pas de confiance égale."
h3.debrief.p4: "Un éditeur qui livre à des milliers de clients doit traiter sa chaîne de fabrication comme de la production : accès restreint, sources vérifiées, journaux surveillés."
h3.facts.title: "Ce qui s'est vraiment passé : la confusion de dépendances, 2021"
h3.facts.p1: "Halcyon et Vega n'existent pas. La saison s'inspire de la recherche publiée le 9 février 2021 par Alex Birsan, qui a décrit et nommé la « confusion de dépendances »."
h3.facts.p2: "L'idée : quand un outil de construction cherche un paquet au nom interne qui n'existe pas sur un dépôt public, un inconnu peut publier là un paquet du même nom, en version plus haute. L'outil installe alors la version publique, car il préfère la plus haute."
h3.facts.p3: "Le chercheur précise que toutes les organisations testées lui avaient donné l'autorisation, par un programme public de prime aux bogues ou un accord privé, et il met en garde : ne pas tenter ce test sans autorisation."
h3.facts.p4: "Son paquet de preuve se contentait de « téléphoner » en renvoyant le nom de machine, le nom d'utilisateur et le chemin courant, volontairement limités pour ne pas collecter d'information sensible ni être pris pour une vraie attaque."
h3.facts.p5: "Le problème a été trouvé dans plus de trente-cinq organisations, souvent de plus de mille personnes, à travers trois écosystèmes de paquets : npm, PyPI et RubyGems. Des entreprises comme Apple, Microsoft, PayPal et Shopify sont citées, et plusieurs primes ont atteint le maximum de leur programme."
h3.facts.p6: "Parmi les parades citées par l'article : pour pip, préférer `--index-url` à `--extra-index-url`, et suivre le livre blanc de Microsoft sur les dépôts de paquets privés. Réserver les noms internes et vérifier la provenance sont des mesures reconnues plus largement par la suite."
h3.check.works: "La chaîne construit toujours, et prévient l'équipe"
