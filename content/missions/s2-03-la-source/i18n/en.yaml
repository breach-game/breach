h3.briefing: "Halcyon's management has seen your canary package in the build. They want to keep their mirror open, which is useful, but never again let a public package replace an in-house one. You have the resolution file and one morning."
h3.obj.idea: "Answer the build team's first idea"
h3.obj.reserve: "Declare the package names that belong to Halcyon"
h3.obj.close: "Forbid an internal name from being taken from a public source"
h3.q.idea: "The team suggests: \"We reverse the order: internal first, public second.\" Is that enough?"
h3.q.idea.trust: "Yes: if the internal source is asked first, its package will always win against the public one"
h3.q.idea.trust.why: "No: the rule is still \"highest version wins\". A public package at 9.9.9 gets ahead of the internal one again, whatever the source order. You have to name what is ours."
h3.q.idea.own: "No: you must tell the chain which names belong to Halcyon, and forbid it from looking for them outside"
h3.q.idea.scan: "No: what matters is scanning the content of every package before installing it, whatever its name"
h3.q.idea.scan.why: "Scanning helps, but the malicious package carries the name of a trusted one: it passes checks that look at the name. The problem is provenance, not content."
h3.check.reserve: "The two in-house packages are declared as internal"
h3.check.close: "An internal name can no longer come from a public source"
h3.ada.brief: "Last morning at Halcyon. The file is `dossier/resolve.yml`. The build team has an idea, hear it first."
h3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h3.ada.answer.standard: "Answer the team's question first."
h3.ada.idea: "Yes. Reversing the order is not enough as long as the highest version wins. The real answer is to name what belongs to you."
h3.ada.g.reserve: "Open the file: `edit dossier/resolve.yml`. The `internal_names` list is empty. Put the two in-house packages in it, `halcyon-telemetry` and `halcyon-auth`, then `verify`."
h3.ada.g.reserve.standard: "Declare the two in-house packages in `internal_names`. Then `verify`."
h3.ada.g.close: "Next, the lock: as long as `allow_public_for_internal` is `true`, an internal name can still come from the public mirror. Set it to `false`, then `verify`."
h3.ada.g.close.standard: "Forbid an internal name from being taken from a public source. Then `verify`."
h3.ada.almost: "Not everything passes yet. Read the lines marked FAIL, fix the file, and run `verify` again."
h3.ada.done: "Now, for those two names, the chain asks the missing question: \"is this name ours?\" If so, it will no longer look for it outside. Open the debrief: at the end, the research this season comes from."
h3.hint.idea.1: "Ask yourself what a public 9.9.9 does against an internal 1.4.2, whatever the order of the sources."
h3.hint.reserve.1: "The line to change is `internal_names`. Put the two names in brackets."
h3.hint.reserve.2: "Type `sed -i \"s/internal_names: \\[\\]/internal_names: [halcyon-telemetry, halcyon-auth]/\" dossier/resolve.yml`."
h3.hint.close.1: "The line to change is `allow_public_for_internal`. The safe value is `false`."
h3.hint.close.2: "Type `sed -i \"s/allow_public_for_internal: true/allow_public_for_internal: false/\" dossier/resolve.yml`, then `verify`."
h3.debrief.title: "Naming what is yours"
h3.debrief.lesson: "You did not close the public mirror, which is useful. You taught the chain which names belong to Halcyon, and forbade it from looking for them elsewhere. Confusion no longer rests on a question nobody was asking."
h3.debrief.p1: "Declare the names of your internal packages and reserve them: a stranger must not be able to publish them on a public registry."
h3.debrief.p2: "Each internal dependency comes from a known source. The same dependency must not be able to switch to a public source on a mere version number."
h3.debrief.p3: "\"Highest version wins\" is convenient, but dangerous when the sources are not of equal trust."
h3.debrief.p4: "A vendor that ships to thousands of customers must treat its build chain as production: restricted access, verified sources, watched logs."
h3.facts.title: "What really happened: dependency confusion, 2021"
h3.facts.p1: "Halcyon and Vega do not exist. The season is inspired by the research published on 9 February 2021 by Alex Birsan, who described and named \"dependency confusion\"."
h3.facts.p2: "The idea: when a build tool looks for a package with an internal name that does not exist on a public registry, a stranger can publish a package of the same name there, at a higher version. The tool then installs the public version, because it prefers the highest."
h3.facts.p3: "The researcher states that every organisation tested had given permission, through a public bug bounty program or a private agreement, and warns: do not attempt this test without authorisation."
h3.facts.p4: "His proof-of-concept package only \"phoned home\", sending back the hostname, the username and the current path, deliberately limited so as not to collect sensitive information or be mistaken for a real attack."
h3.facts.p5: "The problem was found in more than thirty-five organisations, often of over a thousand people, across three package ecosystems: npm, PyPI and RubyGems. Companies such as Apple, Microsoft, PayPal and Shopify are named, and several bounties reached the maximum of their program."
h3.facts.p6: "Among the defences the article cites: for pip, prefer `--index-url` to `--extra-index-url`, and follow Microsoft's white paper on private package feeds. Reserving internal names and verifying provenance became more widely recognised measures afterwards."
h3.check.works: "The chain still builds, and notifies the team"
