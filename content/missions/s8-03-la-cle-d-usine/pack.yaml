summary:
  fr: "Les capteurs se mettent à jour seuls, la nuit, depuis un serveur en clair. À côté du micrologiciel, le script de fabrication a laissé un fichier bavard : le même mot de passe pour les quarante capteurs. Tu montres ce qu'il ouvre, puis tu réécris la politique de mise à jour."
  en: "The sensors update themselves at night, from a server in plain text. Next to the firmware, the build script left a talkative file: the same password for all forty sensors. You show what it opens, then rewrite the update policy."
