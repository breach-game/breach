v3.briefing: "Mercredi. Nour a une question de jardinière : « Mes capteurs, qui les arrose ? » Elle veut dire : qui les met à jour. Réponse de l'installateur, retrouvée dans un vieux mail : ils vont chercher leur micrologiciel tout seuls, chaque nuit, sur `maj.verdure.test`. Le micrologiciel, « firmware », c'est le programme gravé dans l'objet. Va voir ce que ce serveur distribue."
v3.file.policy: "# Politique de mise à jour des capteurs. Corrige chaque ligne, puis tape : verify\ndevice: capteur\ncheck_every: night\ntransport: http          # http | https\nsignature: none          # none | required\ndevice_key: shared       # shared | per-device\ndebug_files: published   # published | removed\n"
v3.obj.index: "Regarder ce que distribue le serveur de mises à jour"
v3.obj.strings: "Lire le fichier laissé à côté du micrologiciel"
v3.obj.account: "Ouvrir les sujets de maintenance avec le compte d'usine"
v3.obj.flag: "Envoyer le témoin d'audit"
v3.obj.policy: "Corriger `dossier/maj.yml`, puis `verify`"
v3.check.transport: "Les mises à jour voyagent chiffrées"
v3.check.signature: "Un capteur n'installe qu'un micrologiciel signé"
v3.check.key: "Chaque capteur a sa propre clé"
v3.check.debug: "Les fichiers de débogage ne sont plus publiés"
v3.check.kept: "Les capteurs vérifient toujours les mises à jour chaque nuit"
v3.ada.brief: "Un serveur de fichiers dit souvent tout de lui-même. Demande-lui sa liste : `curl http://maj.verdure.test/firmware/`. Remarque le `http` : pas de `s`."
v3.ada.g.index: "Liste ce que le serveur distribue : `curl http://maj.verdure.test/firmware/`."
v3.ada.g.index.standard: "Regarde ce que le serveur de mises à jour distribue."
v3.ada.index: "Deux versions du micrologiciel, un manifeste, et un fichier `strings.txt` qui n'a rien à faire là. `strings` est un outil qui sort tout le texte lisible d'un programme : le script de fabrication s'en est servi pour vérifier quelque chose, et a laissé le résultat sur le serveur."
v3.ada.g.strings: "Lis ce fichier : `curl http://maj.verdure.test/firmware/capteur-2.4.1.strings.txt`."
v3.ada.g.strings.standard: "Un des fichiers n'est pas un micrologiciel. Lis-le."
v3.ada.manifest: "Regarde `signature: none`. Chaque nuit, les capteurs téléchargent ce fichier en clair et installent ce qu'il désigne, sans vérifier qui l'a écrit. Quelqu'un qui se placerait entre eux et le serveur pourrait leur faire installer autre chose. On le note pour le rapport, et on ne le fait pas."
v3.ada.bin: "Le micrologiciel lui-même n'est pas dans la copie d'audit, et on n'en a pas besoin. Ce qui nous intéresse est à côté."
v3.ada.strings: "Tout est là. `mqtt_user=capteur`, `mqtt_pass=vd-factory-2019` : un compte écrit en dur dans le programme, donc le même dans les quarante capteurs, et dans tous ceux que ce fabricant a vendus cette année-là. Et `update_verify_signature=0`, qui confirme le manifeste."
v3.ada.g.account: "Le courtier garde des sujets de maintenance, fermés à qui n'a pas de compte d'appareil. Tu en as un maintenant : `mqtt sub -h broker.verdure.test -t \"verdure/maintenance/#\" -u capteur -P vd-factory-2019`."
v3.ada.g.account.standard: "Le courtier garde des sujets de maintenance pour les comptes d'appareils. Tu viens d'en trouver un : sers-t'en avec `-u` et `-P`."
v3.ada.g.denied: "Refusé : ces sujets demandent un compte d'appareil. Celui du micrologiciel fera l'affaire : ajoute `-u capteur -P vd-factory-2019`."
v3.ada.g.denied.standard: "Refusé : ces sujets demandent un compte d'appareil. Tu en connais un."
v3.ada.account: "Tu es un capteur, aux yeux du courtier. N'importe lequel, puisqu'ils ont tous le même compte. Le jour où Verdure exigera enfin un compte pour se connecter, celui-ci passera quand même, et il est téléchargeable."
v3.ada.g.flag: "Envoie le témoin des sujets de maintenance : `submit` suivi du flag."
v3.ada.g.flag.standard: "Envoie le flag."
v3.ada.flag: "Preuve faite. Un secret identique dans chaque objet n'est pas un secret : il suffit d'en ouvrir un seul, ou ici, de lire un fichier oublié. Reste à écrire ce que Verdure doit exiger de son installateur."
v3.ada.g.policy: "Ouvre la politique de mise à jour : `edit dossier/maj.yml`. Transport `https`, signature `required`, clé `per-device`, fichiers de débogage `removed`. Enregistre, puis `verify`."
v3.ada.g.policy.standard: "Corrige `dossier/maj.yml` : un canal chiffré, des mises à jour signées, une clé par capteur, rien de bavard sur le serveur. Puis `verify`."
v3.ada.almost: "Pas encore. `verify` te dit quelles lignes restent à corriger."
v3.ada.policy: "Voilà une politique qui tient. Le chiffrement protège le trajet, la signature prouve qui a écrit la mise à jour, et une clé par capteur fait qu'un capteur volé ne livre que lui-même. Et les mises à jour continuent chaque nuit : un objet qu'on ne met plus à jour est pire qu'un objet mal mis à jour."
v3.ada.done: "Trois jours, trois trouvailles, toutes vieilles de dix ans dans leur principe. Ouvre le débrief. Nour installe les corrections la semaine prochaine. D'ici là, garde ton téléphone allumé la nuit."
v3.soc.strings: "maj: the debug file left beside the firmware was downloaded"
v3.soc.account: "broker: the factory account was used from an unknown address"
v3.hint.index.1: "Tape `curl http://maj.verdure.test/firmware/`."
v3.hint.strings.1: "Le fichier qui finit par `.strings.txt` n'est pas un micrologiciel."
v3.hint.strings.2: "Tape `curl http://maj.verdure.test/firmware/capteur-2.4.1.strings.txt`."
v3.hint.account.1: "Le fichier donne un compte : les lignes `mqtt_user` et `mqtt_pass`."
v3.hint.account.2: "`mqtt sub` accepte un compte avec `-u <nom> -P <mot de passe>`. Le sujet est `verdure/maintenance/#`."
v3.hint.account.3: "Tape `mqtt sub -h broker.verdure.test -t \"verdure/maintenance/#\" -u capteur -P vd-factory-2019`."
v3.hint.flag.1: "Le flag est dans le sujet `verdure/maintenance/temoin`. Tape `submit` suivi du flag."
v3.hint.policy.1: "`cat dossier/maj.yml` montre, sur chaque ligne, les valeurs possibles après le `#`."
v3.hint.policy.2: "Il faut `transport: https`, `signature: required`, `device_key: per-device` et `debug_files: removed`."
v3.hint.policy.3: "Modifie le fichier avec `edit dossier/maj.yml`, enregistre, puis tape `verify`."
v3.debrief.title: "Quarante capteurs, une seule clé"
v3.debrief.lesson: "Le mot de passe des capteurs était écrit dans leur programme, identique pour tous, et le script de fabrication l'avait laissé lisible sur le serveur de mises à jour. Ce serveur parle en clair et ne signe rien : les capteurs installent chaque nuit ce qu'on leur désigne."
v3.debrief.p1: "Chaque appareil reçoit sa propre clé à l'installation. Un secret commun à toute une série se retrouve tôt ou tard, dans un appareil démonté ou un fichier oublié."
v3.debrief.p2: "Une mise à jour est signée par le fabricant, et l'appareil refuse ce qui ne l'est pas. Le chiffrement du trajet ne suffit pas : il ne dit pas qui a écrit le fichier."
v3.debrief.p3: "Ce que la chaîne de fabrication produit pour déboguer ne part pas en production : symboles, journaux, sorties d'outils."
v3.debrief.p4: "Avant d'acheter un objet connecté, on demande comment il se met à jour, pendant combien d'années, et si son mot de passe d'usine se change."
