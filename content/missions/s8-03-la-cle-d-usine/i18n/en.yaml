v3.hint.account.2: "`mqtt sub` takes an account with `-u <name> -P <password>`. The topic is `verdure/maintenance/#`."
v3.hint.account.3: "Type `mqtt sub -h broker.verdure.test -t \"verdure/maintenance/#\" -u capteur -P vd-factory-2019`."
