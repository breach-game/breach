v3.briefing: "Wednesday. Nour has a gardener's question: \"My sensors, who waters them?\" She means: who updates them. The installer's answer, found in an old mail: they fetch their firmware on their own, every night, from `maj.verdure.test`. Firmware is the program built into the device. Go and see what that server hands out."
v3.file.policy: "# Update policy of the sensors. Fix each line, then type: verify\ndevice: capteur\ncheck_every: night\ntransport: http          # http | https\nsignature: none          # none | required\ndevice_key: shared       # shared | per-device\ndebug_files: published   # published | removed\n"
v3.obj.index: "See what the update server hands out"
v3.obj.strings: "Read the file left beside the firmware"
v3.obj.account: "Open the maintenance topics with the factory account"
v3.obj.flag: "Send the audit marker"
v3.obj.policy: "Fix `dossier/maj.yml`, then `verify`"
v3.check.transport: "Updates travel encrypted"
v3.check.signature: "A sensor only installs signed firmware"
v3.check.key: "Each sensor has its own key"
v3.check.debug: "Debug files are no longer published"
v3.check.kept: "Sensors still check for updates every night"
v3.ada.brief: "A file server often says everything about itself. Ask for its list: `curl http://maj.verdure.test/firmware/`. Note the `http`: no `s`."
v3.ada.g.index: "List what the server hands out: `curl http://maj.verdure.test/firmware/`."
v3.ada.g.index.standard: "See what the update server hands out."
v3.ada.index: "Two versions of the firmware, a manifest, and a `strings.txt` file that has no business being there. `strings` is a tool that pulls every readable piece of text out of a program: the build script used it to check something, and left the result on the server."
v3.ada.g.strings: "Read that file: `curl http://maj.verdure.test/firmware/capteur-2.4.1.strings.txt`."
v3.ada.g.strings.standard: "One of the files is not firmware. Read it."
v3.ada.manifest: "Look at `signature: none`. Every night the sensors download this file in plain text and install what it names, without checking who wrote it. Someone standing between them and the server could make them install something else. We note it for the report, and we do not do it."
v3.ada.bin: "The firmware itself is not in the audit copy, and we do not need it. What matters is next to it."
v3.ada.strings: "It is all there. `mqtt_user=capteur`, `mqtt_pass=vd-factory-2019`: an account written into the program, so the same one in all forty sensors, and in every one this maker sold that year. And `update_verify_signature=0`: the sensor never checked who wrote its update."
v3.ada.g.account: "The broker keeps maintenance topics, closed to anyone without a device account. You have one now: `mqtt sub -h broker.verdure.test -t \"verdure/maintenance/#\" -u capteur -P vd-factory-2019`."
v3.ada.g.account.standard: "The broker keeps maintenance topics for device accounts. You have just found one: use it with `-u` and `-P`."
v3.ada.g.denied: "Refused: these topics ask for a device account. The one from the firmware will do: add `-u capteur -P vd-factory-2019`."
v3.ada.g.denied.standard: "Refused: these topics ask for a device account. You know one."
v3.ada.account: "You are a sensor, as far as the broker can tell. Any of them, since they all share the same account. The day Verdure finally requires an account to connect, this one will still get in, and it can be downloaded."
v3.ada.g.flag: "Send the marker from the maintenance topics: `submit` followed by the flag."
v3.ada.g.flag.standard: "Send the flag."
v3.ada.flag: "Proof made. A secret that is identical in every device is not a secret: opening one is enough, or here, reading a forgotten file. What is left is to write what Verdure must require from its installer."
v3.ada.g.policy: "Open the update policy: `edit dossier/maj.yml`. Transport `https`, signature `required`, key `per-device`, debug files `removed`. Save, then `verify`."
v3.ada.g.policy.standard: "Fix `dossier/maj.yml`: an encrypted channel, signed updates, one key per sensor, nothing talkative on the server. Then `verify`."
v3.ada.almost: "Not yet. `verify` tells you which lines are still to fix."
v3.ada.policy: "That is a policy that holds. Encryption protects the journey, the signature proves who wrote the update, and one key per sensor means a stolen sensor gives away only itself. And updates still run every night: a device that is no longer updated is worse than a device updated badly."
v3.ada.done: "Three days, three findings, all ten years old in principle. Open the debrief. Nour installs the fixes next week. Until then, keep your phone on at night."
v3.soc.strings: "maj: the debug file left beside the firmware was downloaded"
v3.soc.account: "broker: the factory account was used from an unknown address"
