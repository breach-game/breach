v3.hint.policy.2: "You need `transport: https`, `signature: required`, `device_key: per-device` and `debug_files: removed`."
v3.hint.policy.3: "Change the file with `edit dossier/maj.yml`, save, then type `verify`."
v3.debrief.title: "Forty sensors, one key"
v3.debrief.lesson: "The sensors' password was written into their program, identical for all of them, and the build script had left it readable on the update server. That server speaks in plain text and signs nothing: every night the sensors install whatever they are pointed to."
v3.debrief.p1: "Each device gets its own key at installation. A secret shared by a whole series is found sooner or later, in a dismantled device or a forgotten file."
v3.debrief.p2: "An update is signed by the maker, and the device refuses what is not. Encrypting the journey is not enough: it does not say who wrote the file."
v3.debrief.p3: "What the build chain produces for debugging does not go to production: symbols, logs, tool output."
v3.debrief.p4: "Before buying a connected device, ask how it updates, for how many years, and whether its factory password can be changed."
