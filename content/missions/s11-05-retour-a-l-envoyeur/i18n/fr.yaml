c5.briefing: "Vendredi, dernier jour d'audit. Budgeto est un assistant de budget : pour lire tes comptes Comptoir, il t'envoie sur le serveur d'accord de Comptoir, tu dis oui, et Comptoir te renvoie chez Budgeto avec un code à usage unique. Celui qui reçoit ce code lit le compte. Toute la sécurité tient donc à une question : à quelle adresse Comptoir accepte-t-il de renvoyer ? Inès t'a aussi confié la configuration du serveur, dans `dossier/`."
c5.obj.clients: "Lire la liste des partenaires enregistrés"
c5.obj.normal: "Faire une demande d'accord normale"
c5.obj.foreign: "Demander un retour vers une adresse du labo"
c5.obj.proof: "Faire accepter une adresse qui n'est pas celle du partenaire"
c5.obj.review: "Désigner les lignes fautives de la configuration"
c5.ada.brief: "Commence par voir qui est enregistré, et avec quelle adresse de retour."
c5.ada.g.clients: "Lis la liste des partenaires : `curl https://auth.comptoir.test/clients`."
c5.ada.clients: "Deux partenaires. Budgeto, avec une seule adresse de retour : `https://app.budgeto.example/callback`. Et `lignerouge-lab`, notre client de test, prévu au mandat. Fais d'abord une demande comme Budgeto la ferait."
c5.ada.g.normal: "Demande un accord au nom de Budgeto, avec son adresse : `curl -d \"client_id=budgeto&redirect_uri=https://app.budgeto.example/callback\" https://auth.comptoir.test/authorize`."
c5.ada.g.normal.standard: "Envoie à `/authorize` une demande avec `client_id=budgeto` et l'adresse de retour enregistrée pour Budgeto."
c5.ada.normal: "302 : le client repart chez Budgeto avec son code. C'est le fonctionnement prévu. Maintenant change l'adresse de retour pour une adresse à nous, en gardant `client_id=budgeto`."
c5.ada.g.foreign: "Même demande, retour vers notre labo : `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb\" https://auth.comptoir.test/authorize`."
c5.ada.g.foreign.standard: "Refais la demande au nom de Budgeto, avec une adresse de retour du labo Ligne Rouge."
c5.ada.foreign: "400, « adresse non enregistrée pour ce client ». Il y a donc bien un contrôle. Reste à savoir comment il compare. Un contrôle peut dire « c'est exactement cette adresse », ou « ça commence comme », ou « ça contient ». Les deux derniers se trompent facilement."
c5.ada.g.proof: "Essaie une adresse à nous qui contient celle de Budgeto : `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb/app.budgeto.example\" https://auth.comptoir.test/authorize`."
c5.ada.g.proof.standard: "Construis une adresse du labo qui contient le nom enregistré de Budgeto, et vois si le serveur l'accepte."
c5.ada.loose: "Accepté. Le serveur a cherché l'adresse de Budgeto quelque part dans la tienne, il l'a trouvée, et il envoie le code chez nous. Dans la vraie vie, l'attaquant envoie ce lien à un client de Comptoir : la page d'accord est la vraie, le client dit oui en confiance, et le code part ailleurs."
c5.ada.g.submit: "Le code de test est dans la réponse. Valide-le : `submit FLAG{...}`."
c5.ada.flag: "Preuve faite, avec notre client de test et aucun vrai client. Maintenant on regarde pourquoi : `review dossier/auth-config.yml`."
c5.ada.g.review: "Affiche la configuration : `review dossier/auth-config.yml`. Deux lignes sont fautives. Désigne chacune avec `review dossier/auth-config.yml <numéro>`."
c5.ada.g.review.standard: "Relis `dossier/auth-config.yml` avec `review` et désigne les deux lignes fautives."
c5.ada.review: "La ligne 6 : `contains`. Une adresse de retour se compare caractère pour caractère, rien d'autre. Et la ligne 7 : sans `state`, le partenaire ne peut pas vérifier que la réponse qu'il reçoit répond bien à une demande qu'il a faite lui-même. Deux réglages, une ligne chacun."
c5.ada.done: "Cinq jours, cinq constats, et aucun n'a demandé d'outil plus savant que `curl`. Inès m'a dit : « Je croyais qu'il me fallait un pare-feu plus cher. » Il lui fallait un inventaire, un contrôle au bon endroit et trois réglages. Ne range pas tes affaires : elle nous garde ce week-end. Le programme de parrainage fait des siennes."
c5.soc.loose: "auth: a code was sent to a return address that is not the registered one"
c5.hint.clients.1: "Tape `curl https://auth.comptoir.test/clients`."
c5.hint.normal.1: "Tape `curl -d \"client_id=budgeto&redirect_uri=https://app.budgeto.example/callback\" https://auth.comptoir.test/authorize`."
c5.hint.foreign.1: "Tape `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb\" https://auth.comptoir.test/authorize`."
c5.hint.proof.1: "Le serveur refuse une adresse étrangère. Et une adresse étrangère qui contient l'adresse enregistrée ?"
c5.hint.proof.2: "Tape `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb/app.budgeto.example\" https://auth.comptoir.test/authorize`."
c5.hint.proof.3: "Puis `submit FLAG{comptoir-retour-a-l-envoyeur-51c4}`."
c5.hint.review.1: "`review dossier/auth-config.yml` affiche le fichier numéroté. Cherche comment l'adresse de retour est comparée."
c5.hint.review.2: "La ligne 6 compare par `contains`. Tape `review dossier/auth-config.yml 6`."
c5.hint.review.3: "La ligne 7 n'exige pas `state`. Tape `review dossier/auth-config.yml 7`."
c5.def.intro: "Le serveur d'accord journalise chaque demande, avec le partenaire et l'adresse de retour. Les tiennes y sont, au milieu des accords donnés à Budgeto."
c5.def.lesson: "Une adresse de retour se compare exactement à celle que le partenaire a enregistrée : ni « commence par », ni « contient », ni joker. C'est une ligne de configuration, et c'est elle qui décide chez qui partent les codes d'accès aux comptes."
c5.def.find.loose: "Ta demande acceptée avec une adresse de retour du labo"
c5.def.rule.unlisted.title: "Alerter sur toute adresse de retour différente de l'adresse enregistrée"
c5.def.rule.unlisted.why: "C'est la bonne. Un partenaire honnête envoie toujours la même adresse. Une autre, acceptée ou refusée, vient de quelqu'un qui tâte le contrôle."
c5.def.rule.every.title: "Alerter sur chaque demande d'accord"
c5.def.rule.every.why: "Des milliers de clients donnent leur accord chaque jour. La tienne serait noyée."
c5.def.rule.burst.title: "Alerter au-delà de huit demandes en dix minutes"
c5.def.rule.burst.why: "Il t'en a fallu trois. Et dans la vraie attaque, il n'y en a qu'une par victime, envoyée par la victime elle-même."
c5.def.fix.exact.title: "Comparer l'adresse de retour exactement"
c5.def.fix.exact.why: "C'est la bonne. Ton adresse du labo est refusée, qu'elle contienne ou non celle de Budgeto, et Budgeto ne voit aucune différence."
c5.def.fix.state.title: "Exiger la valeur `state` dans chaque demande"
c5.def.fix.state.why: "À faire aussi : elle protège le partenaire contre une réponse qu'il n'a pas demandée. Elle n'empêche pas le serveur d'envoyer le code à ton adresse."
c5.def.fix.short.title: "Réduire la durée de vie du code à dix secondes"
c5.def.fix.short.why: "Le labo reçoit le code à l'instant où il est émis. Dix secondes suffisent largement à un programme."
c5.debrief.title: "Un code d'accès part à l'adresse qu'on a bien voulu accepter"
c5.debrief.lesson: "La page d'accord était la vraie, le partenaire était le vrai, et le client aurait dit oui en confiance. Seule l'adresse de retour était fausse, et le serveur l'a acceptée parce qu'elle contenait la bonne. Une comparaison trop souple, sur une seule ligne."
c5.debrief.p1: "Les adresses de retour se comparent exactement à celles que le partenaire a enregistrées."
c5.debrief.p2: "Le partenaire envoie une valeur `state` et la vérifie au retour ; les applis utilisent PKCE."
c5.debrief.p3: "Un code d'accord est à usage unique, vit quelques dizaines de secondes, et ne vaut que pour le partenaire qui l'a demandé."
c5.debrief.p4: "Côté client : un lien d'accord reçu par message se refuse. On part de l'appli du partenaire, pas d'un lien."
