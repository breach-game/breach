c5.briefing: "Friday, last day of the audit. Budgeto is a budget assistant: to read your Comptoir accounts it sends you to Comptoir's consent server, you say yes, and Comptoir sends you back to Budgeto with a one-time code. Whoever receives that code reads the account. So all the security rests on one question: which address does Comptoir agree to send people back to? Inès also gave you the server's configuration, in `dossier/`."
c5.obj.clients: "Read the list of registered partners"
c5.obj.normal: "Make a normal consent request"
c5.obj.foreign: "Ask for a return to a lab address"
c5.obj.proof: "Get an address accepted that is not the partner's"
c5.obj.review: "Point at the faulty lines of the configuration"
c5.ada.brief: "Start by seeing who is registered, and with which return address."
c5.ada.g.clients: "Read the list of partners: `curl https://auth.comptoir.test/clients`."
c5.ada.clients: "Two partners. Budgeto, with a single return address: `https://app.budgeto.example/callback`. And `lignerouge-lab`, our test client, named in the mandate. First make a request the way Budgeto would."
c5.ada.g.normal: "Ask for consent in Budgeto's name, with its address: `curl -d \"client_id=budgeto&redirect_uri=https://app.budgeto.example/callback\" https://auth.comptoir.test/authorize`."
c5.ada.g.normal.standard: "Send `/authorize` a request with `client_id=budgeto` and the return address registered for Budgeto."
c5.ada.normal: "302: the customer goes back to Budgeto with their code. That is how it is meant to work. Now change the return address to one of ours, keeping `client_id=budgeto`."
c5.ada.g.foreign: "Same request, return to our lab: `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb\" https://auth.comptoir.test/authorize`."
c5.ada.g.foreign.standard: "Make the request again in Budgeto's name, with a return address of the Ligne Rouge lab."
c5.ada.foreign: "400, \"address not registered for this client\". So there is a check. The question is how it compares. A check can say \"it is exactly this address\", or \"it starts like\", or \"it contains\". The last two are easily fooled."
c5.ada.g.proof: "Try an address of ours that contains Budgeto's: `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb/app.budgeto.example\" https://auth.comptoir.test/authorize`."
c5.ada.g.proof.standard: "Build a lab address that contains Budgeto's registered name, and see whether the server accepts it."
c5.ada.loose: "Accepted. The server looked for Budgeto's address somewhere in yours, found it, and sends the code to us. In real life the attacker sends this link to a Comptoir customer: the consent page is the real one, the customer says yes in good faith, and the code goes elsewhere."
c5.ada.g.submit: "The test code is in the answer. Submit it: `submit FLAG{...}`."
c5.ada.flag: "Proof made, with our test client and no real customer. Now let's see why: `review dossier/auth-config.yml`."
c5.ada.g.review: "Display the configuration: `review dossier/auth-config.yml`. Two lines are faulty. Point at each with `review dossier/auth-config.yml <number>`."
c5.ada.g.review.standard: "Read `dossier/auth-config.yml` with `review` and point at the two faulty lines."
c5.ada.review: "Line 6: `contains`. A return address is compared character for character, nothing else. And line 7: without `state`, the partner cannot check that the answer it receives matches a request it made itself. Two settings, one line each."
c5.ada.done: "Five days, five findings, and none needed a cleverer tool than `curl`. Inès told me: \"I thought I needed a more expensive firewall.\" She needed an inventory, a check in the right place and three settings. Do not pack up: she is keeping us this weekend. The referral programme is acting up."
c5.soc.loose: "auth: a code was sent to a return address that is not the registered one"
c5.hint.clients.1: "Type `curl https://auth.comptoir.test/clients`."
c5.hint.normal.1: "Type `curl -d \"client_id=budgeto&redirect_uri=https://app.budgeto.example/callback\" https://auth.comptoir.test/authorize`."
c5.hint.foreign.1: "Type `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb\" https://auth.comptoir.test/authorize`."
c5.hint.proof.1: "The server refuses a foreign address. What about a foreign address that contains the registered one?"
c5.hint.proof.2: "Type `curl -d \"client_id=budgeto&redirect_uri=https://lab.lignerouge.test/cb/app.budgeto.example\" https://auth.comptoir.test/authorize`."
c5.hint.proof.3: "Then `submit FLAG{comptoir-retour-a-l-envoyeur-51c4}`."
c5.hint.review.1: "`review dossier/auth-config.yml` displays the numbered file. Look for how the return address is compared."
c5.hint.review.2: "Line 6 compares by `contains`. Type `review dossier/auth-config.yml 6`."
c5.hint.review.3: "Line 7 does not require `state`. Type `review dossier/auth-config.yml 7`."
c5.def.intro: "The consent server logs every request, with the partner and the return address. Yours are in there, among the consents given to Budgeto."
c5.def.lesson: "A return address is compared exactly with the one the partner registered: not \"starts with\", not \"contains\", no wildcard. It is one line of configuration, and it decides who the account access codes go to."
c5.def.find.loose: "Your request accepted with a lab return address"
c5.def.rule.unlisted.title: "Alert on any return address that differs from the registered one"
c5.def.rule.unlisted.why: "This is the one. An honest partner always sends the same address. Another one, accepted or refused, comes from someone probing the check."
c5.def.rule.every.title: "Alert on every consent request"
c5.def.rule.every.why: "Thousands of customers give their consent every day. Yours would be drowned."
c5.def.rule.burst.title: "Alert above eight requests in ten minutes"
c5.def.rule.burst.why: "You needed three. And in the real attack there is only one per victim, sent by the victim themselves."
c5.def.fix.exact.title: "Compare the return address exactly"
c5.def.fix.exact.why: "This is the one. Your lab address is refused, whether or not it contains Budgeto's, and Budgeto sees no difference."
c5.def.fix.state.title: "Require the `state` value in every request"
c5.def.fix.state.why: "Worth doing too: it protects the partner from an answer it did not ask for. It does not stop the server sending the code to your address."
c5.def.fix.short.title: "Cut the code's lifetime to ten seconds"
c5.def.fix.short.why: "The lab receives the code the instant it is issued. Ten seconds is plenty for a program."
c5.debrief.title: "An access code goes to whatever address was accepted"
c5.debrief.lesson: "The consent page was the real one, the partner was the real one, and the customer would have said yes in good faith. Only the return address was wrong, and the server accepted it because it contained the right one. One comparison too loose, on a single line."
c5.debrief.p1: "Return addresses are compared exactly with those the partner registered."
c5.debrief.p2: "The partner sends a `state` value and checks it on return; apps use PKCE."
c5.debrief.p3: "A consent code is single-use, lives a few dozen seconds, and is only good for the partner that asked for it."
c5.debrief.p4: "On the customer side: refuse a consent link received in a message. Start from the partner's app, not from a link."
