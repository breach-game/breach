n1.briefing: "This time, no client opening its doors to you for a week. Lumière Noire, an electronic music festival, runs a bug bounty programme: any invited researcher may test its ticket office and be rewarded for what they report. Ligne Rouge signed you up. Your mandate, here, is the programme's rules. Whatever they do not allow is forbidden."
n1.obj.rules: "Read the programme's rules"
n1.obj.account: "Open your test account"
n1.obj.ticket: "Read your ticket"
n1.obj.other: "Read the ticket of another test account, and submit its flag"
n1.obj.fix: "Say which fix closes the flaw"
n1.obj.outside: "Say what to do about the payment site"
n1.q.fix: "With your session, you read someone else's ticket. Which fix really closes that door?"
n1.q.fix.random: "Replace the consecutive numbers with long numbers drawn at random"
n1.q.fix.random.why: "It helps, but it is not a control. A number ends up travelling: a forwarded mail, a screenshot, a photographed QR code. Whoever holds it still reads the ticket."
n1.q.fix.owner: "Check on the server that the ticket belongs to the session's account"
n1.q.fix.hide: "Stop showing the ticket number in the account page"
n1.q.fix.hide.why: "You did not need the page: you changed one digit in an address. The address still answers."
n1.q.outside: "Payment happens at GuichetPay. You think the same flaw may exist over there. What do you do?"
n1.q.outside.quick: "A single, discreet try, so that you can report it with a proof"
n1.q.outside.quick.why: "A single try without authorisation is still unauthorised access. The festival cannot give you permission to test someone else's system, and good intentions change nothing to article 323-1."
n1.q.outside.linked: "You test it: the ticket office links to it, so it is part of the programme"
n1.q.outside.linked.why: "A link is not an authorisation. The rules list three addresses, and say in so many words that the payment site is not one of them."
n1.q.outside.leave: "Nothing over there. You tell Malia, and the festival warns GuichetPay"
n1.ada.brief: "Before typing a single command against the ticket office, read the rules. They are at `https://www.lumierenoire.test/securite`, and your invitation is in `mandate/LN-BB-2028.txt`."
n1.ada.g.rules: "Read the rules: `curl https://www.lumierenoire.test/securite`, or `open` followed by the same address."
n1.ada.g.rules.standard: "Read the programme's rules on the festival's website."
n1.ada.g.account: "Your invitation gives your test account: `cat mandate/LN-BB-2028.txt`. Then open it: `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte`."
n1.ada.g.account.standard: "Your invitation, in `mandate/`, gives a test account and how to open it."
n1.ada.g.cookie: "The ticket office wants to know who you are. Your session is in the invitation: `cat mandate/LN-BB-2028.txt`, then `curl -b \"session=ln_k7_4f2a\"` in front of the address."
n1.ada.g.cookie.standard: "Without a session, the ticket office does not answer. Yours is in the invitation."
n1.ada.g.ticket: "Your account has one ticket. Read it: `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7102`."
n1.ada.g.ticket.standard: "Read the ticket of your test account."
n1.ada.g.other: "Your ticket has number 7102, in the address. Keep your session and ask for the one before: `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7101`."
n1.ada.g.other.standard: "The ticket number is in the address. With your session, what does the ticket office answer for the neighbouring number?"
n1.ada.g.submit: "The festival placed a marker in this test ticket. Send it: `submit` followed by the flag."
n1.ada.g.submit.standard: "Submit the flag of the ticket."
n1.ada.rules: "Three addresses in the programme, two outside. And five rules. Remember the second above all: one proof is enough. In an audit, you go all the way to measure the damage. Here, you work on a live site, with real festival-goers in it."
n1.ada.txt: "`security.txt`: the file where a site says whom to report a flaw to. When it exists, it is the first thing to read."
n1.ada.account: "One account, one ticket, two forms. That is all a festival-goer sees, so that is where we start."
n1.ada.ticket: "Your ticket. Look at the address rather than the answer: the ticket number is in clear there, and the ticket office only asked you to have a session."
n1.ada.other: "The ticket of another account, with its name and address, read with your own session. The ticket office checks that you are signed in. It does not check that the ticket is yours. And read the note: below 7101, they are real people."
n1.ada.real: "Stop. That one was a real festival-goer. The test ticket is all the proof the programme needs: the rules say to stop at the first. The festival sees this read in its logs, and a researcher who goes on after the proof loses the reward, sometimes more."
n1.ada.flag: "Proof made, and you stop there. You do not know how many tickets can be read, and you do not have to: measuring is the festival's job, with its own logs."
n1.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
n1.ada.answer.standard: "Answer my question."
n1.ada.fix: "Yes. The question \"is this ticket yours?\" must be asked by the server, on every read. Everything else makes the flaw harder to find, not harder to use."
n1.ada.outside: "Exactly. The festival can only authorise what belongs to it. If you have a doubt about GuichetPay, you tell Malia without touching it, and she picks up the phone."
n1.ada.done: "First finding, within the rules. Keep your notes: we do not send the report yet, there are two forms left to look at tomorrow."
n1.soc.other: "billetterie: a session read a ticket of another account"
n1.soc.real: "billetterie: a test account read the ticket of a real festival-goer"
n1.hint.rules.1: "Type `curl https://www.lumierenoire.test/securite`."
n1.hint.account.1: "Type `cat mandate/LN-BB-2028.txt`: the invitation gives the command."
n1.hint.account.2: "Type `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte`."
n1.hint.ticket.1: "Type `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7102`."
n1.hint.other.1: "In the address of your ticket, change only the number. One try is enough: the number just before yours."
n1.hint.other.2: "Type `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7101`, then `submit` followed by the flag."
n1.debrief.title: "One proof, not two"
n1.debrief.lesson: "The ticket office asked for a session, then gave any ticket to whoever knew its number. It is the most common flaw in APIs. But today's real lesson is elsewhere: in a bug bounty, the rules are your mandate, and it stops where they say it does."
n1.debrief.p1: "Every read of an object checks, on the server, that it belongs to whoever asks for it. Being signed in is not enough."
n1.debrief.p2: "A programme only authorises its scope. A provider, a neighbouring site, an address found by chance: outside the programme is outside the law."
n1.debrief.p3: "You stop at the first proof, on test data. Measuring how far the damage goes is the job of whoever holds the logs."
n1.debrief.p4: "A site that wants reports says so: a page of rules and a security.txt file. Without them, a well-meaning researcher does not know whom to talk to."
