n1.briefing: "Cette fois, pas de client qui t'ouvre ses portes pour une semaine. Lumière Noire, un festival de musiques électroniques, a un programme de bug bounty : n'importe quel chercheur invité peut tester sa billetterie et être récompensé pour ce qu'il signale. Ligne Rouge t'a inscrit. Ton mandat, ici, c'est le règlement du programme. Tout ce qu'il n'autorise pas est interdit."
n1.obj.rules: "Lire le règlement du programme"
n1.obj.account: "Ouvrir ton compte de test"
n1.obj.ticket: "Lire ton billet"
n1.obj.other: "Lire le billet d'un autre compte de test, et envoyer son flag"
n1.obj.fix: "Dire quelle correction ferme la faille"
n1.obj.outside: "Dire quoi faire du site de paiement"
n1.q.fix: "Avec ta session, tu lis le billet d'un autre. Quelle correction ferme vraiment cette porte ?"
n1.q.fix.random: "Remplacer les numéros qui se suivent par de longs numéros tirés au hasard, impossibles à deviner"
n1.q.fix.random.why: "C'est utile, mais ce n'est pas un contrôle. Un numéro finit par circuler : un mail transféré, une capture d'écran, un QR code photographié. Celui qui le tient lit toujours le billet."
n1.q.fix.owner: "Vérifier sur le serveur que le billet appartient au compte de la session"
n1.q.fix.hide: "Ne plus afficher le numéro du billet dans la page du compte"
n1.q.fix.hide.why: "Tu n'as pas eu besoin de la page : tu as changé un chiffre dans une adresse. L'adresse répond toujours."
n1.q.outside: "Le paiement se fait chez GuichetPay. Tu te dis que la même faille existe peut-être là-bas. Que fais-tu ?"
n1.q.outside.quick: "Un seul essai, discret, pour pouvoir le signaler avec une preuve"
n1.q.outside.quick.why: "Un seul essai sans autorisation reste un accès non autorisé. Le festival ne peut pas te donner la permission de tester le système de quelqu'un d'autre, et la bonne intention ne change rien à l'article 323-1."
n1.q.outside.linked: "Tu testes : la billetterie y renvoie, donc cela fait partie du programme"
n1.q.outside.linked.why: "Un lien n'est pas une autorisation. Le règlement liste trois adresses, et dit noir sur blanc que le site de paiement n'en fait pas partie."
n1.q.outside.leave: "Rien là-bas. Tu le signales au programme du festival, qui prévient GuichetPay"
n1.ada.brief: "Avant de taper une seule commande contre la billetterie, lis les règles. Elles sont sur `https://www.lumierenoire.test/securite`, et ton invitation est dans `mandate/LN-BB-2028.txt`."
n1.ada.g.rules: "Lis le règlement : `curl https://www.lumierenoire.test/securite`, ou `open` suivi de la même adresse."
n1.ada.g.rules.standard: "Lis le règlement du programme sur le site du festival."
n1.ada.g.account: "Ton invitation donne ton compte de test : `cat mandate/LN-BB-2028.txt`. Puis ouvre-le : `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte`."
n1.ada.g.account.standard: "Ton invitation, dans `mandate/`, donne un compte de test et la façon de l'ouvrir."
n1.ada.g.cookie: "La billetterie veut savoir qui tu es. Ta session est dans l'invitation : `cat mandate/LN-BB-2028.txt`, puis `curl -b \"session=ln_k7_4f2a\"` devant l'adresse."
n1.ada.g.cookie.standard: "Sans session, la billetterie ne répond pas. La tienne est dans l'invitation."
n1.ada.g.ticket: "Ton compte a un billet. Lis-le : `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7102`."
n1.ada.g.ticket.standard: "Lis le billet de ton compte de test."
n1.ada.g.other: "Ton billet porte le numéro 7102, dans l'adresse. Garde ta session et demande celui d'avant : `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7101`."
n1.ada.g.other.standard: "Le numéro du billet est dans l'adresse. Avec ta session, que répond la billetterie pour le numéro juste avant le tien ?"
n1.ada.g.submit: "Le festival a posé un témoin dans ce billet de test. Envoie-le : `submit` suivi du flag."
n1.ada.g.submit.standard: "Envoie le flag du billet."
n1.ada.rules: "Trois adresses dans le programme, deux en dehors. Et cinq règles. Retiens surtout la deuxième : une preuve suffit. Dans un audit, on va au bout pour mesurer les dégâts. Ici, tu travailles sur un site ouvert, avec de vrais festivaliers dedans."
n1.ada.txt: "`security.txt` : le fichier où un site dit à qui signaler une faille. Quand il existe, c'est la première chose à lire."
n1.ada.account: "Un compte, un billet, deux formulaires. C'est tout ce qu'un festivalier voit, donc c'est par là qu'on commence."
n1.ada.ticket: "Ton billet. Regarde l'adresse plutôt que la réponse : le numéro du billet y est en clair, et la billetterie t'a seulement demandé d'avoir une session."
n1.ada.other: "Le billet d'un autre compte, avec son nom et son adresse, lu avec ta session à toi. La billetterie vérifie que tu es connecté. Elle ne vérifie pas que le billet est le tien. Et lis la note : tous les autres numéros sont de vraies personnes."
n1.ada.real: "Stop. Ça, c'était un vrai festivalier. Le billet de test suffit comme preuve : le règlement dit de s'arrêter à la première. Le festival voit cette lecture dans ses journaux, et un chercheur qui continue après la preuve perd sa prime, parfois plus."
n1.ada.flag: "Preuve faite, et tu t'arrêtes là. Tu ne sais pas combien de billets sont lisibles, et tu n'as pas à le savoir : c'est au festival de mesurer, avec ses propres journaux."
n1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
n1.ada.answer.standard: "Réponds à ma question."
n1.ada.fix: "Oui. La question « ce billet est-il à toi ? » doit être posée par le serveur, à chaque lecture. Tout le reste rend la faille plus difficile à trouver, pas plus difficile à utiliser."
n1.ada.outside: "Exactement. Le festival ne peut autoriser que ce qui est à lui. Si tu as un doute sur GuichetPay, tu le dis au programme sans y toucher, et c'est le festival qui décroche son téléphone."
n1.ada.done: "Première trouvaille, dans les règles. Garde tes notes : on n'envoie pas encore le rapport, il reste deux formulaires à regarder demain."
n1.soc.other: "billetterie: a session read a ticket of another account"
n1.soc.real: "billetterie: a test account read the ticket of a real festival-goer"
n1.hint.rules.1: "Tape `curl https://www.lumierenoire.test/securite`."
n1.hint.account.1: "Tape `cat mandate/LN-BB-2028.txt` : l'invitation donne la commande."
n1.hint.account.2: "Tape `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/compte`."
n1.hint.ticket.1: "Tape `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7102`."
n1.hint.other.1: "Dans l'adresse de ton billet, change seulement le numéro. Un seul essai suffit : le numéro juste avant le tien."
n1.hint.other.2: "Tape `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7101`, puis `submit` suivi du flag."
n1.debrief.title: "Une preuve, pas deux"
n1.debrief.lesson: "La billetterie demandait une session, puis donnait n'importe quel billet à qui connaissait son numéro. C'est la faille la plus fréquente des API. Mais la vraie leçon du jour est ailleurs : dans un bug bounty, le règlement est ton mandat, et il s'arrête là où il le dit."
n1.debrief.p1: "Chaque lecture d'un objet vérifie, sur le serveur, qu'il appartient à celui qui le demande. Être connecté ne suffit pas."
n1.debrief.p2: "Un programme n'autorise que son périmètre. Un prestataire, un site voisin, une adresse trouvée par hasard : hors programme, c'est hors la loi."
n1.debrief.p3: "On s'arrête à la première preuve, sur des données de test. Mesurer l'étendue des dégâts est le travail de celui qui a les journaux."
n1.debrief.p4: "Un site qui veut des signalements le dit : une page de règles et un fichier security.txt. Sans eux, le chercheur de bonne foi ne sait pas à qui parler."
