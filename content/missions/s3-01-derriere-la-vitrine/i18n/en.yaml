p1.briefing: "Third client: Pélican, an online shop of refurbished clothes. The summer sales start on Monday and management wants an audit before the rush. Today you touch nothing: you look at what the shop sends to any visitor. A web application always says more than it displays."
p1.obj.home: "Read the home page as the server sends it"
p1.obj.headers: "Read the server's response headers"
p1.obj.robots: "Read the file meant for search engines"
p1.obj.preview: "Open the page that file wanted to hide"
p1.obj.api: "Find the field the API sends but the page does not show, and submit its flag"
p1.obj.why: "Say what is wrong"
p1.q.why: "Item 44 appears on no page. Why could you read it?"
p1.q.why.robots: "Because the robots.txt file gave the list of addresses not to visit"
p1.q.why.robots.why: "That file led you to the sales page, and that is a real problem. But item 44 came from elsewhere: from the API the home page mentioned."
p1.q.why.sent: "Because the server sends it to everyone: the page only chooses not to show it"
p1.q.why.jq: "Because `jq` can decrypt the fields the server protects in its response"
p1.q.why.jq.why: "`jq` decrypts nothing: it formats text you had already received in the clear. The field was in the response, readable by anyone."
p1.ada.brief: "Welcome to Pélican. The shop is at `https://shop.pelican.test`. Start as a curious visitor: ask for the home page, but read it with `curl`, not with a customer's eyes."
p1.ada.g.home: "Ask for the home page: `curl https://shop.pelican.test/`. Read everything, including what sits between `<!--` and `-->`."
p1.ada.g.home.standard: "Read the home page as the server sends it."
p1.ada.g.headers: "The server also talks in its headers. Ask for them alone: `curl -I https://shop.pelican.test/`."
p1.ada.g.headers.standard: "Look at the headers of the response, not only the page."
p1.ada.g.robots: "Sites tell search engines what not to index. Read that file: `curl https://shop.pelican.test/robots.txt`."
p1.ada.g.robots.standard: "A file tells search engines where not to go. Read it."
p1.ada.g.preview: "One of the \"forbidden\" addresses looks like a page. Open it: `curl https://shop.pelican.test/staff-preview`."
p1.ada.g.preview.standard: "Go and see one of the addresses the file wanted to keep away."
p1.ada.g.api: "The comment on the home page mentioned an API. Ask for it and format it: `curl https://shop.pelican.test/api/products.json | jq '.'`."
p1.ada.g.api.standard: "The home page mentioned an address the mobile app uses. Go and see what it returns."
p1.ada.home: "Did you see the comment? A developer left himself a reminder, and it went out to every visitor. Keep the address it quotes, we will come back to it."
p1.ada.headers: "`x-powered-by: Kiosk/2.3 (debug)`. The server announces its engine, its version, and a debug mode left on. No flaw in there, but an attacker now knows what to look for."
p1.ada.robots: "`robots.txt` is a courtesy to search engines, not a lock. To a human it is a list of what the site would rather you did not look at."
p1.ada.preview: "The sales schedule, three days before everyone else. Nothing links to the page, and that was its only protection. An address nobody knows is still an open address."
p1.ada.json: "This is JSON. `jq` can read and filter it. The list is called `items`: try `jq '.items[].name'` to see the names, then look at each item."
p1.ada.json.standard: "This format reads better with `jq`. Look at each item of the list."
p1.ada.jq: "Four items, while the shop shows three. Look at the last one in full: `curl https://shop.pelican.test/api/products.json | jq '.items[3]'`, then send me its flag with `submit`."
p1.ada.jq.standard: "Count the items, and compare with the shop."
p1.ada.flag: "The sales price, the margin and the supplier's name. The page does not display them, but the API sends them to whoever asks."
p1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p1.ada.answer.standard: "Answer my question."
p1.ada.why: "Exactly. What the browser does not display is not hidden: it is already with the visitor. The only protected data is the data the server does not send."
p1.ada.done: "You broke nothing and you already know the shop's engine, its sales schedule and its margins. Open the debrief. Tomorrow, we talk to its search form."
p1.hint.home.1: "Type `curl https://shop.pelican.test/`."
p1.hint.headers.1: "Type `curl -I https://shop.pelican.test/`."
p1.hint.robots.1: "Type `curl https://shop.pelican.test/robots.txt`."
p1.hint.preview.1: "Type `curl https://shop.pelican.test/staff-preview`."
p1.hint.api.1: "The address is in the comment of the home page: `/api/products.json`."
p1.hint.api.2: "Type `curl https://shop.pelican.test/api/products.json | jq '.items[3]'`."
p1.hint.api.3: "Copy the `FLAG{...}` value of the `internal_note` field and type `submit` followed by that value."
p1.debrief.title: "What the shop window lets you see"
p1.debrief.lesson: "You used no flaw. You read a comment, some headers, a file for search engines and the response of an API. Each one said a little too much, and together they draw the shop: its engine, its internal pages, its management data."
p1.debrief.p1: "The browser is not a boundary. Everything the server sends can be read, displayed or not: an API should only return the fields the page needs."
p1.debrief.p2: "robots.txt protects nothing and informs everyone. An internal page is protected by authentication, not by silence."
p1.debrief.p3: "Headers that announce the engine and its version, and the debug mode, are switched off before going to production."
p1.debrief.p4: "Comments leave with the page. A developer's reminder has no place in what the visitor receives."
