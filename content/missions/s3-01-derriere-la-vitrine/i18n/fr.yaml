p1.briefing: "Troisième client : Pélican, une boutique en ligne de vêtements remis à neuf. Les soldes d'été commencent lundi et la direction veut un audit avant la ruée. Aujourd'hui tu ne touches à rien : tu regardes ce que la boutique envoie à n'importe quel visiteur. Une application web en dit toujours plus que ce qu'elle affiche."
p1.obj.home: "Lire la page d'accueil telle que le serveur l'envoie"
p1.obj.headers: "Lire les en-têtes de réponse du serveur"
p1.obj.robots: "Lire le fichier destiné aux moteurs de recherche"
p1.obj.preview: "Ouvrir la page que ce fichier voulait cacher"
p1.obj.api: "Trouver le champ que l'API envoie sans que la page l'affiche, et envoyer son flag"
p1.obj.why: "Dire ce qui ne va pas"
p1.q.why: "L'article 44 n'apparaît sur aucune page. Pourquoi as-tu pu le lire ?"
p1.q.why.robots: "Parce que le fichier robots.txt donnait la liste des adresses à ne pas visiter"
p1.q.why.robots.why: "Ce fichier t'a mené à la page des soldes, et c'est un vrai problème. Mais l'article 44 venait d'ailleurs : de l'API que la page d'accueil mentionnait."
p1.q.why.sent: "Parce que le serveur l'envoie à tout le monde : la page choisit seulement de ne pas le montrer"
p1.q.why.jq: "Parce que `jq` sait déchiffrer les champs que le serveur protège dans sa réponse"
p1.q.why.jq.why: "`jq` ne déchiffre rien : il met en forme du texte que tu avais déjà reçu en clair. Le champ était dans la réponse, lisible par n'importe qui."
p1.ada.brief: "Bienvenue chez Pélican. La boutique est sur `https://shop.pelican.test`. Commence comme un visiteur curieux : demande la page d'accueil, mais lis-la avec `curl`, pas avec les yeux d'un client."
p1.ada.g.home: "Demande la page d'accueil : `curl https://shop.pelican.test/`. Lis tout, y compris ce qui est entre `<!--` et `-->`."
p1.ada.g.home.standard: "Lis la page d'accueil telle que le serveur l'envoie."
p1.ada.g.headers: "Le serveur parle aussi dans ses en-têtes. Demande-les seuls : `curl -I https://shop.pelican.test/`."
p1.ada.g.headers.standard: "Regarde les en-têtes de la réponse, pas seulement la page."
p1.ada.g.robots: "Les sites disent aux moteurs de recherche ce qu'ils ne doivent pas indexer. Lis ce fichier : `curl https://shop.pelican.test/robots.txt`."
p1.ada.g.robots.standard: "Un fichier dit aux moteurs de recherche où ne pas aller. Lis-le."
p1.ada.g.preview: "Une des adresses « interdites » ressemble à une page. Ouvre-la : `curl https://shop.pelican.test/staff-preview`."
p1.ada.g.preview.standard: "Va voir une des adresses que le fichier voulait écarter."
p1.ada.g.api: "Le commentaire de la page d'accueil parlait d'une API. Demande-la et mets-la en forme : `curl https://shop.pelican.test/api/products.json | jq '.'`."
p1.ada.g.api.standard: "La page d'accueil mentionnait une adresse que l'appli mobile utilise. Va voir ce qu'elle renvoie."
p1.ada.home: "Tu as vu le commentaire ? Un développeur s'est laissé un pense-bête, et il est parti chez tous les visiteurs. Garde l'adresse qu'il cite, on y reviendra."
p1.ada.headers: "`x-powered-by: Kiosk/2.3 (debug)`. Le serveur annonce son moteur, sa version, et un mode de débogage resté allumé. Aucune faille là-dedans, mais un attaquant sait maintenant quoi chercher."
p1.ada.robots: "`robots.txt` est une politesse envers les moteurs de recherche, pas une serrure. Pour un humain, c'est une liste de ce que le site préférerait qu'on ne regarde pas."
p1.ada.preview: "Le programme des soldes, trois jours avant tout le monde. La page n'est liée nulle part, et c'était sa seule protection. Une adresse que personne ne connaît reste une adresse ouverte."
p1.ada.json: "C'est du JSON, sur une seule ligne ou presque. `jq` le rend lisible. La liste s'appelle `items` : essaie `jq '.items[].name'` pour voir les noms, puis regarde chaque article."
p1.ada.json.standard: "Ce format se lit mieux avec `jq`. Regarde chaque article de la liste."
p1.ada.jq: "Quatre articles, alors que la boutique en montre trois. Regarde le dernier en entier : `curl https://shop.pelican.test/api/products.json | jq '.items[3]'`, puis envoie-moi son flag avec `submit`."
p1.ada.jq.standard: "Compte les articles, et compare avec la boutique."
p1.ada.flag: "Le prix des soldes, la marge et le nom du fournisseur. La page ne les affiche pas, mais l'API les envoie à qui les demande."
p1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p1.ada.answer.standard: "Réponds à ma question."
p1.ada.why: "Exactement. Ce que le navigateur n'affiche pas n'est pas caché : c'est déjà chez le visiteur. La seule donnée protégée est celle que le serveur n'envoie pas."
p1.ada.done: "Tu n'as rien cassé et tu connais déjà le moteur de la boutique, son programme de soldes et ses marges. Ouvre le débrief. Demain, on parle à son formulaire de recherche."
p1.hint.home.1: "Tape `curl https://shop.pelican.test/`."
p1.hint.headers.1: "Tape `curl -I https://shop.pelican.test/`."
p1.hint.robots.1: "Tape `curl https://shop.pelican.test/robots.txt`."
p1.hint.preview.1: "Tape `curl https://shop.pelican.test/staff-preview`."
p1.hint.api.1: "L'adresse est dans le commentaire de la page d'accueil : `/api/products.json`."
p1.hint.api.2: "Tape `curl https://shop.pelican.test/api/products.json | jq '.items[3]'`."
p1.hint.api.3: "Copie la valeur `FLAG{...}` du champ `internal_note` et tape `submit` suivi de cette valeur."
p1.debrief.title: "Ce que la vitrine laisse voir"
p1.debrief.lesson: "Tu n'as utilisé aucune faille. Tu as lu un commentaire, des en-têtes, un fichier pour moteurs de recherche et la réponse d'une API. Chacun en disait un peu trop, et ensemble ils dessinent la boutique : son moteur, ses pages internes, ses données de gestion."
p1.debrief.p1: "Le navigateur n'est pas une frontière. Tout ce que le serveur envoie est lisible, affiché ou non : une API ne doit renvoyer que les champs dont la page a besoin."
p1.debrief.p2: "robots.txt ne protège rien et renseigne tout le monde. Une page interne se protège par une authentification, pas par le silence."
p1.debrief.p3: "Les en-têtes qui annoncent le moteur et sa version, et le mode de débogage, s'éteignent avant la mise en production."
p1.debrief.p4: "Les commentaires partent avec la page. Un pense-bête de développeur n'a rien à faire dans ce que reçoit le visiteur."
