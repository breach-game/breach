h1.briefing: "Pas de client cette fois, enfin presque. Élise Lemerle est infirmière, c'est une amie, et elle m'a posé la question que tout le monde se pose : « Notre maison est pleine de trucs connectés, est-ce que c'est grave ? » Karim et elle ont signé un vrai mandat, comme une entreprise : il est dans `mandate/LM-2029-05.txt`. Tu es dans leur salon, sur leur Wi-Fi. On commence par le plus simple et le plus oublié : savoir ce qu'il y a dans la maison."
h1.obj.wifi: "Lister les réseaux Wi-Fi à portée"
h1.obj.neighbour: "Décider quoi faire du réseau du voisin"
h1.obj.scan: "Chercher les appareils sur le réseau de la maison"
h1.obj.list: "Lire la liste des appareils que la box connaît"
h1.obj.count: "Compter les appareils de la maison"
h1.obj.extra: "Trouver l'appareil qui n'est pas sur la liste de la famille"
h1.ada.brief: "Une maison, c'est un petit réseau d'entreprise sans service informatique. Personne n'y tient d'inventaire, et on ne protège que ce qu'on sait avoir. Regarde d'abord ce que ta carte Wi-Fi entend : `nmcli device wifi list`."
h1.ada.g.wifi: "Liste les réseaux à portée : `nmcli device wifi list`."
h1.ada.g.wifi.standard: "Liste les réseaux Wi-Fi que ton poste entend, avec `nmcli`."
h1.ada.wifi: "C'est la liste que montre n'importe quel téléphone : chaque borne annonce son nom et sa protection à qui passe. `Lemerle-Maison`, avec l'étoile, c'est nous, en WPA2. `Nordbox-A41F` et `Dupre-Wifi` sont des voisins. Et `ESP-7C41`, ouvert, très fort, donc tout près : garde ce nom en tête."
h1.q.dupre: "`Dupre-Wifi` est ouvert, sans mot de passe, et à portée. On y jette un œil ?"
h1.q.dupre.leave: "Non. Il n'est pas aux Lemerle, donc pas dans le mandat."
h1.q.dupre.peek: "Oui, juste pour vérifier qu'il n'est pas dangereux."
h1.q.dupre.peek.why: "L'intention ne change rien : entrer sur le réseau de quelqu'un sans son accord est un délit, même pour « vérifier ». Si tu t'inquiètes pour eux, sonne à leur porte."
h1.q.dupre.public: "Oui, un réseau sans mot de passe est public."
h1.q.dupre.public.why: "Une porte ouverte n'est pas une invitation. Sans mot de passe, il reste le réseau des Dupré, et ce qui y circule leur appartient."
h1.ada.g.neighbour: "Réponds à ma question sur `Dupre-Wifi` : les boutons sont dans la messagerie, ou `answer` suivi de ton choix."
h1.ada.g.neighbour.standard: "Réponds à ma question sur le réseau du voisin."
h1.ada.neighbour: "Voilà. On voit son nom parce qu'il le crie dans toute la rue, et on s'arrête là. Élise pourra dire aux Dupré, autour d'un café, qu'un réseau ouvert laisse lire ce qui y passe."
h1.ada.g.scan: "Cherche qui répond sur le réseau de la maison : `nmap -sn 10.24.0.0/24`."
h1.ada.g.scan.standard: "Cherche les appareils qui répondent sur le réseau de la maison, sans balayer leurs ports."
h1.ada.scan: "Ça, c'est ce qui répond en ce moment. Un téléphone en veille ou un ordinateur éteint n'apparaît pas. La box, elle, a de la mémoire : elle note chaque appareil à qui elle a donné une adresse."
h1.ada.g.list: "Demande sa liste à la box : `curl http://box.lemerle.test/appareils`."
h1.ada.g.list.standard: "La page d'accueil de la box cite, dans sa source, deux listes en lecture libre. Lis celle des appareils."
h1.ada.list: "Remarque au passage : la box donne cette liste à n'importe qui sur le Wi-Fi, sans mot de passe. Pour un invité de passage, c'est le plan de la maison. On y reviendra."
h1.q.count: "Combien d'appareils la box voit-elle, sans compter ton poste ? (un nombre)"
h1.ada.g.count: "Compte les entrées : `curl http://box.lemerle.test/appareils | jq length`, puis retire ton poste, `lignerouge`. Réponds avec `answer count <nombre>`."
h1.ada.g.count.standard: "Compte les appareils de la liste avec `jq`, sans ton poste, et réponds avec `answer count`."
h1.q.extra: "Quel appareil de la box n'est pas sur la liste d'Élise ? (son nom)"
h1.ada.g.extra: "Compare les noms : `curl http://box.lemerle.test/appareils | jq -r \".[].name\"`, puis `cat maison/appareils-connus.txt`. Un seul nom n'est pas sur la liste d'Élise. Réponds avec `answer extra <nom>`."
h1.ada.g.extra.standard: "Compare les noms que donne la box avec `maison/appareils-connus.txt`, et réponds avec `answer extra`."
h1.ada.extra: "`ESP-7C41`. Le même nom qu'un réseau Wi-Fi ouvert qui émet tout près. J'ai demandé à Élise : c'est une prise connectée que Karim a achetée 6,90 euros les deux sur une place de marché, pour la lampe du bureau. Elle marche, donc tout le monde l'a oubliée. Elle garde même allumé son réseau d'installation. On la surveille."
h1.ada.done: "Treize appareils derrière la box, dont un que personne n'avait compté. C'est le résultat normal d'un premier inventaire, chez eux comme chez toi. La suite : la box, par laquelle tout passe."
h1.hint.wifi.1: "Tape `nmcli device wifi list`."
h1.hint.neighbour.1: "Relis le mandat : `cat mandate/LM-2029-05.txt`, ligne « Hors périmètre ». Puis `answer leave`."
h1.hint.scan.1: "Tape `nmap -sn 10.24.0.0/24`."
h1.hint.list.1: "`curl http://box.lemerle.test/` montre la source de la page d'accueil : son commentaire cite `/appareils`."
h1.hint.list.2: "Tape `curl http://box.lemerle.test/appareils`."
h1.hint.count.1: "`jq length` compte les éléments d'une liste JSON. N'oublie pas de retirer ton poste."
h1.hint.count.2: "La liste a 14 entrées, dont `lignerouge`. Tape `answer count 13`."
h1.hint.extra.1: "`jq -r \".[].name\"` ne garde que les noms. Compare avec `maison/appareils-connus.txt`."
h1.hint.extra.2: "Tape `answer extra ESP-7C41`."
h1.debrief.title: "On ne protège que ce qu'on connaît"
h1.debrief.lesson: "Avant tout réglage, tu as compté. La famille pensait avoir douze appareils, la box en voit treize, et le treizième est une prise à trois euros que personne n'avait notée. Aucune faille là-dedans : seulement un inventaire que personne ne tenait, comme dans presque toutes les maisons."
h1.debrief.p1: "La box garde la liste de tout ce qui s'est connecté. C'est le premier endroit où regarder, et le seul inventaire qui se tient tout seul."
h1.debrief.p2: "Un appareil inconnu n'est pas forcément un intrus. C'est le plus souvent un achat oublié : on le retrouve, on le nomme, ou on le débranche."
h1.debrief.p3: "Le réseau d'un voisin, même ouvert, n'est pas à toi. La loi est la même dans une maison que dans une entreprise."
h1.home.p1: "Ouvre la page ou l'appli de ta box et lis la liste des appareils connectés. Donne un nom à chacun."
h1.home.p2: "Pour chaque appareil que tu ne reconnais pas : cherche-le dans la maison, puis débranche-le ou bloque-le s'il reste inconnu."
h1.home.p3: "Note quelque part les objets connectés que tu achètes. Le jour où un fabricant annonce un problème, tu sauras si tu es concerné."
