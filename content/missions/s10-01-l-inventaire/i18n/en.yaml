h1.briefing: "No client this time, or almost. Élise Lemerle is a nurse and a friend, and she asked me what everybody wonders: \"Our house is full of connected things, is that bad?\" She and Karim signed a real mandate, as a company would: it is in `mandate/LM-2029-05.txt`. You are in their living room, on their Wi-Fi. We start with the simplest and most forgotten step: knowing what is in the house."
h1.obj.wifi: "List the Wi-Fi networks in range"
h1.obj.neighbour: "Decide what to do about the neighbour's network"
h1.obj.scan: "Look for devices on the home network"
h1.obj.list: "Read the list of devices the router knows"
h1.obj.count: "Count the devices of the house"
h1.obj.extra: "Find the device that is not on the family's list"
h1.ada.brief: "A house is a small company network with no IT department. Nobody keeps an inventory, and you can only protect what you know you have. First look at what your Wi-Fi card hears: `nmcli device wifi list`."
h1.ada.g.wifi: "List the networks in range: `nmcli device wifi list`."
h1.ada.g.wifi.standard: "List the Wi-Fi networks your workstation hears, with `nmcli`."
h1.ada.wifi: "This is the list any phone shows: every access point announces its name and its protection to whoever walks by. `Lemerle-Maison`, with the star, is us, on WPA2. `Nordbox-A41F` and `Dupre-Wifi` are neighbours. And `ESP-7C41`, open, very strong, so very close: keep that name in mind."
h1.q.dupre: "`Dupre-Wifi` is open, with no password, and in range. Do we take a look?"
h1.q.dupre.leave: "No. It is not the Lemerles', so it is not in the mandate."
h1.q.dupre.peek: "Yes, just to check that it is not dangerous."
h1.q.dupre.peek.why: "The intention changes nothing: going onto someone's network without their agreement is an offence, even \"to check\". If you worry about them, ring their doorbell."
h1.q.dupre.public: "Yes, a network with no password is public."
h1.q.dupre.public.why: "An open door is not an invitation. With no password it is still the Duprés' network, and what travels on it is theirs."
h1.ada.g.neighbour: "Answer my question about `Dupre-Wifi`: the buttons are in the messages window, or type `answer` and your choice."
h1.ada.g.neighbour.standard: "Answer my question about the neighbour's network."
h1.ada.neighbour: "Right. We see its name because it shouts it down the whole street, and we stop there. Élise can tell the Duprés over a coffee that an open network lets anyone read what goes through it."
h1.ada.g.scan: "Look for who answers on the home network: `nmap -sn 10.24.0.0/24`."
h1.ada.g.scan.standard: "Look for the devices that answer on the home network, without scanning their ports."
h1.ada.scan: "That is what answers right now. A sleeping phone or a computer that is off does not show. The router has a memory, though: it notes every device it ever gave an address to."
h1.ada.g.list: "Ask the router for its list: `curl http://box.lemerle.test/appareils`."
h1.ada.g.list.standard: "The source of the router's home page names two lists anyone can read. Read the one about devices."
h1.ada.list: "Notice, by the way: the router hands this list to anyone on the Wi-Fi, with no password. For a passing guest, it is the floor plan of the house. We will come back to it."
h1.q.count: "How many devices does the router see, not counting your workstation? (a number)"
h1.ada.g.count: "Count the entries: `curl http://box.lemerle.test/appareils | jq length`, then take away your workstation, `lignerouge`. Answer with `answer count <number>`."
h1.ada.g.count.standard: "Count the devices of the list with `jq`, without your workstation, and answer with `answer count`."
h1.q.extra: "Which device of the router is not on Élise's list? (its name)"
h1.ada.g.extra: "Compare the names: `curl http://box.lemerle.test/appareils | jq -r \".[].name\"`, then `cat maison/appareils-connus.txt`. One name only is not on Élise's list. Answer with `answer extra <name>`."
h1.ada.g.extra.standard: "Compare the names the router gives with `maison/appareils-connus.txt`, and answer with `answer extra`."
h1.ada.extra: "`ESP-7C41`. The same name as the open network from earlier. I asked Élise: it is a smart plug Karim bought for twelve euros on a marketplace, for the desk lamp. It works, so everybody forgot it. It even keeps its set-up network switched on. We will keep an eye on it."
h1.ada.done: "Thirteen devices, one of which nobody had counted. That is the normal result of a first inventory, at their place as at yours. Next: the router, which everything goes through."
h1.hint.wifi.1: "Type `nmcli device wifi list`."
h1.hint.neighbour.1: "Read the mandate again: `cat mandate/LM-2029-05.txt`, line \"Out of scope\". Then `answer leave`."
h1.hint.scan.1: "Type `nmap -sn 10.24.0.0/24`."
h1.hint.list.1: "`curl http://box.lemerle.test/` shows the source of the home page: its comment names `/appareils`."
h1.hint.list.2: "Type `curl http://box.lemerle.test/appareils`."
h1.hint.count.1: "`jq length` counts the items of a JSON list. Do not forget to take your workstation away."
h1.hint.count.2: "The list has 14 entries, `lignerouge` among them. Type `answer count 13`."
h1.hint.extra.1: "`jq -r \".[].name\"` keeps the names only. Compare with `maison/appareils-connus.txt`."
h1.hint.extra.2: "Type `answer extra ESP-7C41`."
h1.debrief.title: "You can only protect what you know"
h1.debrief.lesson: "Before any setting, you counted. The family thought they had twelve devices, the router sees thirteen, and the thirteenth is a twelve-euro plug nobody had written down. No flaw in that: only an inventory nobody kept, as in almost every home."
h1.debrief.p1: "The router keeps the list of everything that ever connected. It is the first place to look, and the only inventory that keeps itself."
h1.debrief.p2: "An unknown device is not necessarily an intruder. Most often it is a forgotten purchase: find it, name it, or unplug it."
h1.debrief.p3: "A neighbour's network, even open, is not yours. The law is the same in a house as in a company."
h1.home.p1: "Open your router's page or app and read the list of connected devices. Give each one a name."
h1.home.p2: "For each device you do not recognise: look for it in the house, then unplug it or block it if it stays unknown."
h1.home.p3: "Write down the connected things you buy. The day a maker announces a problem, you will know whether it concerns you."
