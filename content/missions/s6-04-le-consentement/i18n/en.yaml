a4.briefing: "Thursday, 2 pm, last day of the audit. You were writing the report when Inès, who handles everything technical at Alto, calls you: a colleague just told her they \"plugged their calendar\" into a new tool she has never heard of. Nobody reported a stolen password, but she does not like it. You switch to the defence side, with your audit token and the SOC console."
a4.file.rule: "# Detection rule, to try with: rule test regles/consentement.yml\n# One condition per line. Fields of the access log: src, method, path, status, ua.\n# Modifiers: path|contains, path|startswith, path|endswith.\ntitle: Access granted to an application\nsource: access\nmethod: POST\n"
a4.obj.revoke: "Take the application's access away"
a4.obj.contain: "See its reads stop in time"
a4.obj.which: "Name the application (`answer app`)"
a4.obj.user: "Name who authorised it (`answer user`)"
a4.obj.detect: "Write the rule that rings on this consent"
a4.obj.scope: "Name the right that lets it come back (`answer scope`)"
a4.obj.consent: "Prevent it from happening again"
a4.q.which: "Which application is reading the team's documents?"
a4.q.user: "Which account gave it access?"
a4.q.scope: "Which right lets it keep access while the employee is signed out?"
a4.contain.revoke: "Grant of calsync revoked, its tokens are worth nothing"
a4.contain.block: "Address 10.18.0.200 blocked at the storage's door"
a4.contain.reset: "Password of the account using 10.18.0.112 reset, their sessions closed"
a4.contain.consent: "Employees can no longer authorise an unverified application"
a4.alert.unverified: "Consent given to an unverified application"
a4.alert.unverified.why: "An employee clicked \"Accept\" in front of an application whose publisher was not verified by Nimbus."
a4.alert.agent: "Unknown program in the team's bucket"
a4.alert.agent.why: "The `alto-team` bucket is only read by browsers, from the office. This client is not one."
a4.ada.brief: "I am with you. We do not know what this is yet, so we look before we cut. `soc sources` tells you which logs you have, `soc alerts` what rang, `contain` what you can cut."
a4.ada.g.start: "Start by seeing which logs you have: `soc sources`."
a4.ada.g.start.standard: "Look at which logs you have, then at the SOC alerts."
a4.ada.g.alerts: "An alert just came in. Read it: `soc alerts`."
a4.ada.g.alerts.standard: "An alert just came into the SOC."
a4.ada.g.grants: "An unverified application received a consent. Ask Nimbus for the list of authorised applications: `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/grants`."
a4.ada.g.grants.standard: "Your audit token also reads the authorised applications: `https://iam.alto.test/grants`."
a4.ada.g.cut: "The application is called `calsync`, and it has its own token. Take it away: `contain revoke calsync`."
a4.ada.g.cut.standard: "You have the application's name. `contain` lists the possible measures: choose the one that takes its access away."
a4.ada.g.again: "The reads have stopped, but the grant still exists. Remove it: `contain revoke calsync`."
a4.ada.g.again.standard: "The address is blocked, the grant is still there. Remove it."
a4.ada.g.watch: "Its next read must be refused. You can check it with `soc logs storage flow`."
a4.ada.g.watch.standard: "Check in the storage logs that its next read is refused."
a4.ada.g.which: "Note the application's name for the report: `answer app calsync`."
a4.ada.g.which.standard: "Give the application's name with `answer app`."
a4.ada.g.user: "The list of grants says who clicked. Note it: `answer user m.durand`."
a4.ada.g.user.standard: "Give the account that authorised the application with `answer user`."
a4.ada.g.detect: "Inès started a rule. Read it, `cat regles/consentement.yml`, then try it against the logs: `rule test regles/consentement.yml`."
a4.ada.g.detect.standard: "A detection rule is waiting in `regles/`. `rule test <file>` tries it against the logs."
a4.ada.g.false: "It catches the consent, and also those of verified applications. Look at what sets calsync's line apart in its path, and add a condition: `echo \"path|contains: verified=false\" >> regles/consentement.yml`."
a4.ada.g.false.standard: "It also rings for verified applications. What is different in the path of calsync's line?"
a4.ada.g.missed: "It no longer rings wrongly, but it misses the consent. Read its line again with `soc logs login access` and use the same fields."
a4.ada.g.missed.standard: "It misses the consent. Read its line again in the sign-in service's log."
a4.ada.grants: "There it is: `calsync`, publisher \"Alto Agenda Sync\", unverified, created yesterday, authorised today by `m.durand`. Look at what it asked for: the calendar, every file, and `offline_access`. Nobody stole Durand's password. They opened the door themselves, with one click."
a4.ada.page: "This is the screen the employee saw. The name looks like an in-house tool, and \"unverified publisher\" is read in half a second when you are in a hurry. That is not foolishness, it is a page built to be accepted."
a4.ada.list: "It just listed the team's bucket, with the token Nimbus handed it. It will read the files one by one."
a4.ada.contract: "The printer's contract is gone. One file is left before the funding round file. Cut now."
a4.ada.fail: "The funding round file was read in full. We start again: the application has its own token, that is what must be taken away, and fast."
a4.ada.reset: "It is everyone's reflex, and it is useless here. The application never had the employee's password: it has a token of its own, handed over by Nimbus at the click. Changing the password does not touch that token. You just signed the employee out, not the application."
a4.ada.block: "That stops it, for now. But the grant still exists, and its token works from any other address. You closed a window, the key is still outside."
a4.ada.revoke: "That is the right wire. The grant is removed, and every token Nimbus had handed to the application is dead, including the one that let it come back without the employee."
a4.ada.consent: "From now on, an unverified application goes through Inès before it reaches an employee. It costs a little comfort, and it removes the button the employee clicked."
a4.ada.stopped: "Done: its next read was refused, and it stopped. The funding round file did not get out. Now we tidy up: the application's name, the account, and a rule for next time."
a4.ada.detect: "A single alert, the right one. Verified applications go through quietly, and the next \"Accept\" in front of an unknown publisher will ring within the minute, before the first read."
a4.ada.done: "A few minutes between the click and the cut. Durand will get a message from Inès, with no blame: the page was built for that. Open the debrief."
a4.ada.end: "End of Alto's audit. Four days, four settings: a public bucket, a token in a log, a star in a role, a click on \"Accept\". No flaw in the usual sense of the word. In the cloud, you almost never break anything: you find what was left open."
a4.hint.revoke.1: "`soc alerts` shows what rang, `soc logs login access` and `soc logs storage access` show the lines."
a4.hint.revoke.2: "The application's name is in the path of the consent line (`app=...`), and in `https://iam.alto.test/grants`."
a4.hint.revoke.3: "Type `contain revoke calsync`."
a4.hint.contain.1: "Once the access is removed, type `soc logs storage flow`: the application's next read shows there as `deny`."
a4.hint.which.1: "The name is in the list of grants: `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/grants`."
a4.hint.which.2: "Type `answer app calsync`."
a4.hint.user.1: "The list of grants is at `https://iam.alto.test/grants`, with your audit token. Look at the `user` field of calsync."
a4.hint.user.2: "Type `answer user m.durand`."
a4.hint.detect.1: "`rule test regles/consentement.yml` shows the lines the rule catches: \"!\" for the intruder, \"?\" for ordinary activity."
a4.hint.detect.2: "Ordinary consents have `verified=true` in their path. The one of calsync has `verified=false`."
a4.hint.detect.3: "`echo \"path|contains: verified=false\" >> regles/consentement.yml`, then `rule test regles/consentement.yml`."
a4.debrief.title: "A click on \"Accept\""
a4.debrief.lesson: "Nobody stole a password. An employee authorised an application with a familiar name, and Nimbus handed it a token of its own, valid without them. That is why changing the password changed nothing: the grant had to be removed."
a4.debrief.p1: "An authorised application has its own access. You cut it by revoking the grant and its tokens, not by changing the employee's password."
a4.debrief.p2: "Employees only authorise verified applications on their own. The others go through a request, read by someone."
a4.debrief.p3: "Review the list of authorised applications, like the list of public buckets. A right to \"all files\" with \"offline access\" always deserves a question."
a4.debrief.p4: "The employee who clicked is the one who can best tell what they saw. Blame will silence them next time."
