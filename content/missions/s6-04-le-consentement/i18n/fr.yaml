a4.briefing: "Jeudi, 14 heures, dernier jour de l'audit. Tu rédigeais le rapport quand Inès, qui s'occupe de tout ce qui est technique chez Alto, t'appelle : un collègue vient de lui dire qu'il a « branché son agenda » sur un nouvel outil, dont elle n'a jamais entendu parler. Personne n'a signalé de mot de passe volé, mais elle n'aime pas ça. Tu passes côté défense, avec ton jeton d'audit et la console du SOC."
a4.file.rule: "# Règle de détection, à essayer avec : rule test regles/consentement.yml\n# Une ligne par condition. Champs du journal access : src, method, path, status, ua.\n# Modificateurs : path|contains, path|startswith, path|endswith.\ntitle: Autorisation donnée à une application\nsource: access\nmethod: POST\n"
a4.obj.revoke: "Retirer son accès à l'application"
a4.obj.contain: "Voir ses lectures s'arrêter à temps"
a4.obj.which: "Nommer l'application (`answer app`)"
a4.obj.user: "Nommer qui l'a autorisée (`answer user`)"
a4.obj.detect: "Écrire la règle qui sonne sur ce consentement"
a4.obj.scope: "Nommer le droit qui la laisse revenir (`answer scope`)"
a4.obj.consent: "Empêcher que cela recommence"
a4.q.which: "Quelle application lit les documents de l'équipe ?"
a4.q.user: "Quel compte lui a donné accès ?"
a4.q.scope: "Quel droit lui permet de garder l'accès quand l'employé est déconnecté ?"
a4.contain.revoke: "Autorisation de calsync révoquée, ses jetons ne valent plus rien"
a4.contain.block: "Adresse 10.18.0.200 bloquée à l'entrée du stockage"
a4.contain.reset: "Mot de passe du compte qui utilise 10.18.0.112 réinitialisé, ses sessions fermées"
a4.contain.consent: "Les employés ne peuvent plus autoriser une application non vérifiée"
a4.alert.unverified: "Consentement donné à une application non vérifiée"
a4.alert.unverified.why: "Un employé a cliqué sur « Accepter » devant une application dont l'éditeur n'a pas été vérifié par Nimbus."
a4.alert.agent: "Programme inconnu dans le seau de l'équipe"
a4.alert.agent.why: "Le seau `alto-team` n'est lu que par des navigateurs, depuis le bureau. Ce client-là n'en est pas un."
a4.ada.brief: "Je suis avec toi. On ne sait pas encore ce que c'est, alors on regarde avant de couper. `soc sources` te dit quels journaux tu as, `soc alerts` ce qui a sonné, `contain` ce que tu peux couper."
a4.ada.g.start: "Commence par voir quels journaux tu as : `soc sources`."
a4.ada.g.start.standard: "Regarde quels journaux tu as, puis les alertes du SOC."
a4.ada.g.alerts: "Une alerte vient de tomber. Lis-la : `soc alerts`."
a4.ada.g.alerts.standard: "Une alerte vient de tomber dans le SOC."
a4.ada.g.grants: "Une application non vérifiée a reçu un consentement. Demande à Nimbus la liste des applications autorisées : `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/grants`."
a4.ada.g.grants.standard: "Ton jeton d'audit lit aussi les applications autorisées : `https://iam.alto.test/grants`."
a4.ada.g.cut: "L'application s'appelle `calsync`, et elle a son propre jeton. Retire-le-lui : `contain revoke calsync`."
a4.ada.g.cut.standard: "Tu as le nom de l'application. `contain` liste les mesures possibles : choisis celle qui lui retire son accès."
a4.ada.g.again: "Les lectures sont arrêtées, mais l'autorisation existe toujours. Retire-la : `contain revoke calsync`."
a4.ada.g.again.standard: "L'adresse est bloquée, l'autorisation est toujours là. Retire-la."
a4.ada.g.watch: "Sa prochaine lecture doit être refusée. Tu pourras le vérifier avec `soc logs storage flow`."
a4.ada.g.watch.standard: "Vérifie dans les journaux du stockage que sa prochaine lecture est refusée."
a4.ada.g.which: "Note le nom de l'application pour le rapport : `answer app calsync`."
a4.ada.g.which.standard: "Donne le nom de l'application avec `answer app`."
a4.ada.g.user: "La liste des autorisations dit qui a cliqué. Note-le : `answer user m.durand`."
a4.ada.g.user.standard: "Donne le compte qui a autorisé l'application avec `answer user`."
a4.ada.g.detect: "Inès a commencé une règle. Lis-la, `cat regles/consentement.yml`, puis essaie-la contre les journaux : `rule test regles/consentement.yml`."
a4.ada.g.detect.standard: "Une règle de détection t'attend dans `regles/`. `rule test <fichier>` l'essaie contre les journaux."
a4.ada.g.false: "Elle attrape le consentement, et aussi ceux des applications vérifiées. Regarde ce qui distingue la ligne de calsync dans son chemin, et ajoute une condition : `echo \"path|contains: verified=false\" >> regles/consentement.yml`."
a4.ada.g.false.standard: "Elle sonne aussi pour des applications vérifiées. Qu'est-ce que le chemin de la ligne de calsync a de différent ?"
a4.ada.g.missed: "Elle ne sonne plus à tort, mais elle rate le consentement. Relis sa ligne avec `soc logs login access` et reprends les mêmes champs."
a4.ada.g.missed.standard: "Elle rate le consentement. Relis sa ligne dans le journal du service de connexion."
a4.ada.grants: "La voilà : `calsync`, éditeur « Alto Agenda Sync », non vérifié, créée hier, autorisée aujourd'hui par `m.durand`. Regarde ce qu'elle a demandé : l'agenda, tous les fichiers, et `offline_access`. Personne n'a volé le mot de passe de Durand. Il a ouvert la porte lui-même, en un clic."
a4.ada.page: "C'est l'écran que l'employé a vu. Le nom ressemble à un outil de la maison, et « éditeur non vérifié » se lit en une demi-seconde quand on est pressé. Ce n'est pas de la bêtise, c'est une page faite pour qu'on accepte."
a4.ada.list: "Elle vient de lister le seau de l'équipe, avec le jeton que Nimbus lui a remis. Elle va lire les fichiers un par un."
a4.ada.contract: "Le contrat de l'imprimeur est parti. Il lui reste un fichier avant le dossier de la levée de fonds. Coupe maintenant."
a4.ada.fail: "Le dossier de la levée de fonds a été lu en entier. On reprend : l'application a son propre jeton, c'est lui qu'il faut retirer, et vite."
a4.ada.reset: "C'est le réflexe de tout le monde, et il ne sert à rien ici. L'application n'a jamais eu le mot de passe de l'employé : elle a un jeton à elle, remis par Nimbus quand il a cliqué. Changer le mot de passe ne touche pas ce jeton. Tu viens de déconnecter l'employé, pas l'application."
a4.ada.block: "Ça l'arrête, pour l'instant. Mais l'autorisation existe toujours, et son jeton marche depuis n'importe quelle autre adresse. Tu as fermé une fenêtre, la clé est toujours dehors."
a4.ada.revoke: "C'est le bon fil. L'autorisation est retirée, et tous les jetons que Nimbus avait remis à l'application sont morts, y compris celui qui lui permettait de revenir sans l'employé."
a4.ada.consent: "Désormais, une application non vérifiée passe par Inès avant d'atteindre un employé. Ça coûte un peu de confort, et ça retire le bouton sur lequel l'employé a cliqué."
a4.ada.stopped: "C'est fait : sa lecture suivante a été refusée, et elle s'est arrêtée. Le dossier de la levée de fonds n'est pas sorti. Maintenant on met de l'ordre : le nom de l'application, le compte, et une règle pour la prochaine fois."
a4.ada.detect: "Une seule alerte, la bonne. Les applications vérifiées passent sans bruit, et le prochain « Accepter » devant un éditeur inconnu sonnera à la minute, avant la première lecture."
a4.ada.done: "Quelques minutes entre le clic et la coupure. Durand recevra un message d'Inès, sans reproche : la page était faite pour ça. Ouvre le débrief."
a4.ada.end: "Fin de l'audit d'Alto. Quatre jours, quatre réglages : un seau public, un jeton dans un journal, une étoile dans un rôle, un clic sur « Accepter ». Aucune faille au sens où on l'entend d'habitude. Dans le cloud, on ne casse presque jamais rien : on trouve ce qui a été laissé ouvert."
a4.hint.revoke.1: "`soc alerts` montre ce qui a sonné, `soc logs login access` et `soc logs storage access` montrent les lignes."
a4.hint.revoke.2: "Le nom de l'application est dans le chemin de la ligne du consentement (`app=...`), et dans `https://iam.alto.test/grants`."
a4.hint.revoke.3: "Tape `contain revoke calsync`."
a4.hint.contain.1: "Une fois l'accès retiré, tape `soc logs storage flow` : la lecture suivante de l'application y apparaît en `deny`."
a4.hint.which.1: "Le nom est dans la liste des autorisations : `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/grants`."
a4.hint.which.2: "Tape `answer app calsync`."
a4.hint.user.1: "La liste des autorisations est sur `https://iam.alto.test/grants`, avec ton jeton d'audit. Regarde le champ `user` de calsync."
a4.hint.user.2: "Tape `answer user m.durand`."
a4.hint.detect.1: "`rule test regles/consentement.yml` montre les lignes que la règle attrape : « ! » pour l'intrus, « ? » pour l'activité ordinaire."
a4.hint.detect.2: "Les consentements ordinaires ont `verified=true` dans leur chemin. Celui de calsync a `verified=false`."
a4.hint.detect.3: "`echo \"path|contains: verified=false\" >> regles/consentement.yml`, puis `rule test regles/consentement.yml`."
a4.debrief.title: "Un clic sur « Accepter »"
a4.debrief.lesson: "Personne n'a volé de mot de passe. Un employé a autorisé une application qui portait un nom familier, et Nimbus lui a remis un jeton à elle, valable sans lui. C'est pour cela que changer le mot de passe ne changeait rien : il fallait retirer l'autorisation."
a4.debrief.p1: "Une application autorisée a son propre accès. On le coupe en révoquant l'autorisation et ses jetons, pas en changeant le mot de passe de l'employé."
a4.debrief.p2: "Les employés n'autorisent seuls que des applications vérifiées. Les autres passent par une demande, relue par quelqu'un."
a4.debrief.p3: "Passer en revue la liste des applications autorisées, comme celle des seaux publics. Un droit « tous les fichiers » avec « accès hors connexion » mérite toujours une question."
a4.debrief.p4: "L'employé qui a cliqué est celui qui peut le mieux raconter ce qu'il a vu. Un reproche le fera taire la prochaine fois."
