summary:
  fr: "Côté défense. Jeudi, un employé d'Alto clique sur « Accepter » devant une application d'agenda inconnue. Aucun mot de passe n'a été volé, et pourtant quelqu'un lit les documents de l'équipe. Tu trouves l'application, tu coupes le bon fil, et tu écris la règle qui aurait sonné."
  en: "Defence side. On Thursday, an Alto employee clicks \"Accept\" in front of an unknown calendar application. No password was stolen, and yet someone is reading the team's documents. You find the application, cut the right wire, and write the rule that would have rung."
