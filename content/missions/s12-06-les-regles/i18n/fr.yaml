p6.briefing: "Lundi, une semaine plus tard. La clé de service est changée, le compte de démo supprimé, la fonction d'invitation corrigée. Reste ce que Bricole avait remis « à plus tard » : les règles de la base. Elles sont dans `base/regles.sql`, et la base appliquera ce que tu y écris. Puis Malik t'a donné le journal de la base d'avant l'audit, dans `journaux/base-access.log`."
p6.obj.rules: "Écrire les trois règles par ligne, puis lancer `verify`"
p6.obj.retest: "Vérifier que la clé publique ne lit plus le profil d'Ada"
p6.obj.who: "Trouver qui a téléchargé toute la table avant l'audit"
p6.obj.tell: "Décider comment prévenir les voisins"
p6.q.who: "Quelle adresse a téléchargé la table entière des profils avant l'audit ?"
p6.q.tell: "Quelqu'un a téléchargé les 412 profils le 1er novembre. Comment Coup de main prévient-il les voisins ?"
p6.q.tell.all: "Tout le monde, cette semaine : ce qui a fui, et quoi surveiller"
p6.q.tell.all.why: "Un message difficile à écrire et quelques désinscriptions. Mais chacun sait qu'on peut l'appeler ou sonner chez lui en se faisant passer pour l'appli, et la déclaration à la CNIL part dans les 72 heures."
p6.q.tell.later: "Attendre d'être sûr que l'adresse a vraiment gardé les données"
p6.q.tell.later.why: "Personne ne saura jamais ce que cette adresse a fait des données. Pendant qu'on attend, les voisins ne sont pas sur leurs gardes, et le délai de 72 heures pour la CNIL est dépassé."
p6.q.tell.quiet: "Ne rien dire : c'est corrigé, et rien ne prouve un usage"
p6.q.tell.quiet.why: "Une fuite d'adresses et de dates de naissance se déclare, utilisée ou non. Le jour où un voisin reçoit une visite étrange et l'apprend autrement, l'association perd la confiance du quartier."
p6.check.own: "Un profil ne se lit que par son propriétaire"
p6.check.members: "Les demandes ne se lisent que par un voisin connecté"
p6.check.author: "On ne poste une demande qu'à son propre nom"
p6.check.open: "Plus aucune règle qui laisse tout passer"
p6.check.enabled: "Les règles par ligne restent actives sur les profils"
p6.ada.brief: "Lis d'abord les règles : `cat base/regles.sql`. Les trois disent `(true)` : « tout le monde, toujours »."
p6.ada.g.rules: "Remplace chaque `(true)` : `sed -i 's/on profils for select using .true./on profils for select using (auth.uid() = id)/' base/regles.sql`, puis `sed -i 's/on demandes for select using .true./on demandes for select using (auth.uid() is not null)/' base/regles.sql`, puis `sed -i 's/on demandes for insert with check .true./on demandes for insert with check (auth.uid() = auteur)/' base/regles.sql`. Puis `verify`."
p6.ada.g.rules.standard: "Dans `base/regles.sql`, un profil se lit par son propriétaire (`auth.uid() = id`), les demandes par un voisin connecté (`auth.uid() is not null`), et on poste à son nom (`auth.uid() = auteur`). Puis `verify`."
p6.ada.rules: "`verify` est d'accord : plus aucun `(true)`, et chaque règle dit à qui est la ligne. Vérifie que la base les applique."
p6.ada.g.retest: "Redemande le profil d'Ada avec la clé publique : `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p6.ada.g.retest.standard: "Refais la lecture de mardi : le profil 2042 avec la clé publique."
p6.ada.retest: "`[]`. Même clé, même demande, plus rien : la clé publique seule ne lit plus aucun profil. L'appli, elle, marche toujours, chaque voisin lit le sien avec sa session."
p6.ada.g.who: "Cherche les lectures réussies : `grep \" 200 \" journaux/base-access.log`. Une adresse a demandé `/rest/v1/profils`, la table entière. Réponds avec `answer who <adresse>`."
p6.ada.g.who.standard: "Cherche dans `journaux/base-access.log` qui a lu la table entière des profils avec succès, et réponds avec `answer who <adresse>`."
p6.ada.who: "198.51.100.23, le 1er novembre à 2 h 41, un script : le plan de la base, puis 148 220 octets de profils. Les 412. Une semaine avant nous. Ce n'était pas toi, ce n'était pas un robot qui frappe sans clé : c'était quelqu'un qui avait lu le paquet."
p6.ada.g.tell: "Choisis avec l'équipe comment prévenir les voisins."
p6.ada.tell: "Noté. Nadia écrit le message ce soir, avec Malik."
p6.ada.done: "La semaine est finie. Coup de main ouvre à toute la ville avec des règles écrites et relues, une clé de service qui ne sort plus du serveur, et une liste de ce que Bricole a fait vite. Nadia m'a dit qu'ils garderaient Bricole. Mais ils le reliront."
p6.hint.rules.1: "`auth.uid()` est le voisin connecté. `id` est le propriétaire du profil, `auteur` celui de la demande."
p6.hint.rules.2: "Dans `sed`, un `.` vaut n'importe quel caractère : `using .true.` attrape `using (true)`."
p6.hint.rules.3: "Les trois commandes `sed` sont dans le message d'Ada en mode Guidé. Puis tape `verify`."
p6.hint.retest.1: "Tape `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p6.hint.who.1: "La table entière, c'est `/rest/v1/profils` sans numéro. Une seule adresse l'a obtenue avec un 200."
p6.hint.who.2: "Tape `answer who 198.51.100.23`."
p6.hint.tell.1: "Aucune réponse n'est fausse, chacune a un prix. Tape `answer all`, `answer later` ou `answer quiet`."
p6.debrief.title: "Les règles écrites, et ce qui était déjà parti"
p6.debrief.lesson: "Trois règles d'une ligne chacune, et la clé publique ne lit plus que ce qu'elle doit. Mais pendant trois semaines la table était ouverte, et quelqu'un l'avait déjà téléchargée. Une faille corrigée ne rappelle pas ce qui a fui."
p6.debrief.p1: "Chaque table a une règle par ligne qui dit qui lit et qui écrit, avant la mise en ligne."
p6.debrief.p2: "Une règle se vérifie en refaisant la lecture qui ne devait pas marcher."
p6.debrief.p3: "Le journal d'avant l'audit dit si quelqu'un est passé avant toi."
p6.debrief.p4: "Une fuite de données personnelles se déclare et se dit aux personnes, utilisée ou non."
