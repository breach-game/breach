p6.briefing: "Monday, a week later. The service key is changed, the demo account deleted, the invitation function fixed. What is left is what Bricole had put off \"for later\": the database rules. They are in `base/regles.sql`, and the database will apply what you write there. Then Malik gave you the database log from before the audit, in `journaux/base-access.log`."
p6.obj.rules: "Write the three row rules, then run `verify`"
p6.obj.retest: "Check that the public key no longer reads Ada's profile"
p6.obj.who: "Find who downloaded the whole table before the audit"
p6.obj.tell: "Decide how to tell the neighbours"
p6.q.who: "Which address downloaded the whole profiles table before the audit?"
p6.q.tell: "Someone downloaded the 412 profiles on 1 November. How does Coup de main tell the neighbours?"
p6.q.tell.all: "Everyone, this week: what leaked, and what to watch for"
p6.q.tell.all.why: "A hard message to write and a few people leaving. But everyone knows they may get a call or a knock at the door from someone posing as the app, and the notice to the data protection authority leaves within 72 hours."
p6.q.tell.later: "Wait until sure the address really kept the data"
p6.q.tell.later.why: "Nobody will ever know what that address did with the data. While waiting, the neighbours are not on their guard, and the 72-hour deadline for the authority has passed."
p6.q.tell.quiet: "Say nothing: it is fixed, and nothing proves any use"
p6.q.tell.quiet.why: "A leak of addresses and dates of birth must be reported, used or not. The day a neighbour gets a strange visit and learns it another way, the association loses the neighbourhood's trust."
p6.check.own: "A profile is only read by its owner"
p6.check.members: "Requests are only read by a signed-in neighbour"
p6.check.author: "A request is only posted in one's own name"
p6.check.open: "No rule left that lets everything through"
p6.check.enabled: "Row rules stay switched on for profiles"
p6.ada.brief: "Read the rules first: `cat base/regles.sql`. All three say `(true)`: \"everyone, always\"."
p6.ada.g.rules: "Replace each `(true)`: `sed -i 's/on profils for select using .true./on profils for select using (auth.uid() = id)/' base/regles.sql`, then `sed -i 's/on demandes for select using .true./on demandes for select using (auth.uid() is not null)/' base/regles.sql`, then `sed -i 's/on demandes for insert with check .true./on demandes for insert with check (auth.uid() = auteur)/' base/regles.sql`. Then `verify`. Or by hand, in the editor: `edit base/regles.sql`, then Ctrl+S."
p6.ada.g.rules.standard: "In `base/regles.sql`, a profile is read by its owner (`auth.uid() = id`), requests by a signed-in neighbour (`auth.uid() is not null`), and one posts in one's own name (`auth.uid() = auteur`). Then `verify`. To open the file: `edit base/regles.sql`."
p6.ada.rules: "`verify` agrees: no `(true)` left, and each rule says whose the row is. Check the database applies them."
p6.ada.g.retest: "Ask for Ada's profile again with the public key: `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p6.ada.g.retest.standard: "Redo Tuesday's read: profile 2042 with the public key."
p6.ada.retest: "`[]`. Same key, same request, nothing: the public key alone reads no profile any more. The app still works, each neighbour reads their own with their session."
p6.ada.g.who: "Look for successful reads: `grep \" 200 \" journaux/base-access.log`. One address asked for `/rest/v1/profils`, the whole table. Answer with `answer who <address>`."
p6.ada.g.who.standard: "Look in `journaux/base-access.log` for who read the whole profiles table successfully, and answer with `answer who <address>`."
p6.ada.who: "198.51.100.23, on 1 November at 2:41, a script: the database map, then 148,220 bytes of profiles. All 412. A week before us. It was not you, nor a crawler knocking without a key: it was someone who had read the bundle."
p6.ada.g.tell: "Choose with the team how to tell the neighbours."
p6.ada.tell: "Noted. Nadia writes the message tonight, with Malik."
p6.ada.done: "The week is over. Coup de main opens to the whole town with rules written and reviewed, a service key that no longer leaves the server, and a list of what Bricole did fast. Nadia told me they would keep Bricole. But they will review it."
p6.hint.rules.1: "`auth.uid()` is the signed-in neighbour. `id` is the profile's owner, `auteur` the request's."
p6.hint.rules.2: "In `sed`, a `.` matches any character: `using .true.` catches `using (true)`."
p6.hint.rules.3: "The three `sed` commands are in Ada's message in Guided mode. Then type `verify`."
p6.hint.retest.1: "Type `curl -H \"apikey: sk_anon_cdm_7d21e0\" https://base.coupdemain.test/rest/v1/profils/2042`."
p6.hint.who.1: "The whole table is `/rest/v1/profils` with no number. Only one address got it with a 200."
p6.hint.who.2: "Type `answer who 198.51.100.23`."
p6.hint.tell.1: "No answer is wrong, each has a price. Type `answer all`, `answer later` or `answer quiet`."
p6.debrief.title: "The rules written, and what had already left"
p6.debrief.lesson: "Three one-line rules, and the public key only reads what it should. But for three weeks the table was open, and someone had already downloaded it. A fixed flaw does not call back what leaked."
p6.debrief.p1: "Each table has a row rule saying who reads and who writes, before going live."
p6.debrief.p2: "A rule is checked by redoing the read that should not work."
p6.debrief.p3: "The log from before the audit tells whether someone came before you."
p6.debrief.p4: "A personal data leak is reported and told to the people concerned, used or not."
