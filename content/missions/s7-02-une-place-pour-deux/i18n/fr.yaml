n2.briefing: "Mardi. Hier tu as cherché une faille technique : une vérification oubliée. Aujourd'hui tu cherches autre chose. La billetterie propose deux gestes à un festivalier qui a un empêchement : donner son billet à un ami, ou se faire rembourser. Chacun est correct. La question du jour : que se passe-t-il quand on fait les deux ?"
n2.obj.forms: "Regarder les formulaires de la billetterie"
n2.obj.transfer: "Transférer le billet de test à l'amie de test"
n2.obj.friend: "Vérifier que l'amie a bien un billet valide"
n2.obj.refund: "Demander le remboursement du billet transféré, et envoyer le flag"
n2.obj.review: "Relire `dossier/tickets.txt` et désigner la ligne fautive"
n2.ada.brief: "Les deux formulaires sont sur `https://billetterie.lumierenoire.test/transfert` et `/remboursement`. Tu peux les ouvrir avec `open`, ou leur parler avec `curl -d \"billet=7102\"`. Commence par les lire."
n2.ada.g.forms: "Lis le formulaire de transfert : `curl https://billetterie.lumierenoire.test/transfert`."
n2.ada.g.forms.standard: "Lis les deux formulaires de la billetterie avant de t'en servir."
n2.ada.g.transfer: "Transfère ton billet de test : `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/transfert`."
n2.ada.g.transfer.standard: "Donne ton billet de test à l'amie de test, avec le formulaire de transfert."
n2.ada.g.friend: "Le transfert a émis le billet 7140. Vérifie qu'il existe : `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7140`."
n2.ada.g.friend.standard: "Vérifie que le nouveau billet de l'amie existe et qu'il est valide."
n2.ada.g.refund: "Ton billet 7102 n'est plus à toi. Demande quand même son remboursement : `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/remboursement`."
n2.ada.g.refund.standard: "Le billet 7102 ne t'appartient plus. Que répond le formulaire de remboursement si tu le lui présentes ?"
n2.ada.g.submit: "Envoie le témoin du compte de test : `submit` suivi du flag."
n2.ada.g.submit.standard: "Envoie le flag."
n2.ada.g.review: "Le festival t'a remis le code des deux gestes. Lis-le avec ses numéros de ligne : `review dossier/tickets.txt`. Puis désigne la ligne fautive : `review dossier/tickets.txt <numéro>`. Il n'y en a qu'une."
n2.ada.g.review.standard: "Relis `dossier/tickets.txt` avec `review` et désigne la ligne qui laisse passer le remboursement."
n2.ada.forms: "Rien de bizarre : un champ, un bouton. Pas de guillemet à glisser, pas de balise. Une faille de logique ne se voit pas dans un formulaire, elle se voit dans l'ordre où on s'en sert."
n2.ada.normal: "Un remboursement normal : tu tiens le billet, la billetterie dit oui (sur le compte de test, ce n'est qu'une simulation). Rien à signaler. Maintenant pense à l'ordre : et si le billet n'était plus à toi au moment de demander ?"
n2.ada.transfer: "L'amie reçoit le billet 7140, et le tien n'est plus valable à l'entrée. Jusque-là tout est juste : une entrée payée, une entrée valide."
n2.ada.friend: "Valide, au nom de l'amie. Retiens le compte : une entrée, payée 89 €. Voyons si la billetterie fait le même compte que toi."
n2.ada.double: "Remboursé. Refais le compte : l'amie a une entrée valide, et tu as récupéré les 89 €. Personne n'a rien forcé : chaque formulaire a répondu oui à une question raisonnable. Aucun des deux n'a posé la bonne."
n2.ada.flag: "Preuve faite sur un seul billet de test, et on n'en fera pas un deuxième. Imagine la même chose dix mille fois, la semaine de l'ouverture : c'est le budget du festival. Regarde maintenant pourquoi le code a dit oui."
n2.ada.review: "Oui. Le remboursement compare le compte à l'acheteur du billet. Après un transfert, l'acheteur n'a pas changé : c'est toujours toi. Il fallait regarder le détenteur d'aujourd'hui, et l'état du billet."
n2.ada.done: "Le rapport dira « remboursement d'un billet déjà transféré ». Passe de l'autre côté : ouvre le débrief, retrouve ta demande dans les journaux de la billetterie, et choisis la correction."
n2.soc.double: "billetterie: a refund was paid for a ticket already transferred"
n2.hint.forms.1: "Tape `curl https://billetterie.lumierenoire.test/transfert`."
n2.hint.transfer.1: "Le formulaire attend un champ `billet`. Ton billet de test porte le numéro 7102."
n2.hint.transfer.2: "Tape `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/transfert`."
n2.hint.friend.1: "Tape `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7140`."
n2.hint.refund.1: "Tu as fait un transfert. Quel autre geste la billetterie propose-t-elle pour le même billet ?"
n2.hint.refund.2: "Le formulaire de remboursement attend lui aussi un champ `billet`. Donne-lui le numéro du billet que tu viens de transférer."
n2.hint.refund.3: "Tape `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/remboursement`, puis `submit` suivi du flag."
n2.hint.review.1: "Dans `refund`, cherche la ligne qui décide à qui appartient le billet."
n2.hint.review.2: "Un billet a un acheteur (`buyer`) et un détenteur (`holder`). Après un transfert, un seul des deux change."
n2.hint.review.3: "Tape `review dossier/tickets.txt 5`."
n2.def.intro: "La billetterie journalise chaque formulaire envoyé, avec ce qu'elle a répondu. Ta demande y est, parmi les transferts et les remboursements honnêtes de la semaine."
n2.def.lesson: "Une faille de logique ne laisse aucune entrée suspecte : tout ce que tu as tapé était un numéro de billet. Elle se détecte par l'état des choses, pas par la forme de ce qui est envoyé. Et elle se corrige en posant la bonne question au bon moment."
n2.def.find.double: "Le remboursement d'un billet qui avait déjà été transféré"
n2.def.rule.after.title: "Alerter quand un remboursement vise un billet déjà transféré"
n2.def.rule.after.why: "C'est la bonne. Elle regarde l'état du billet, que seule la billetterie connaît. Aucune demande honnête ne produit cela."
n2.def.rule.every.title: "Alerter sur chaque demande de remboursement"
n2.def.rule.every.why: "Des dizaines de festivaliers se font rembourser chaque jour, c'est prévu. Ta demande est dedans, identique aux autres à l'œil nu."
n2.def.rule.transfer.title: "Alerter sur chaque transfert de billet"
n2.def.rule.transfer.why: "Ton transfert était parfaitement honnête, comme tous les autres. Le problème est venu après, et cette règle ne le voit pas."
n2.def.fix.holder.title: "Ne rembourser que le détenteur actuel d'un billet encore valide"
n2.def.fix.holder.why: "C'est la bonne. Le formulaire répond maintenant que le billet a été transféré. La question posée est enfin celle qui compte : à qui est ce billet aujourd'hui ?"
n2.def.fix.daily.title: "Limiter chaque compte à un remboursement par jour"
n2.def.fix.daily.why: "Il t'a fallu un seul remboursement. Cette limite gêne les familles qui annulent quatre billets, et ne gêne pas celui qui a compris l'astuce."
n2.def.fix.button.title: "Retirer le bouton de remboursement de la page des billets transférés"
n2.def.fix.button.why: "Tu ne t'es jamais servi du bouton : tu as envoyé la demande à l'adresse du formulaire, qui répond toujours oui."
n2.debrief.title: "Deux oui qui ne s'additionnent pas"
n2.debrief.lesson: "Le transfert vérifiait le détenteur. Le remboursement vérifiait l'acheteur. Chacun avait raison de son point de vue, et ensemble ils offraient une entrée. Les failles de logique naissent entre deux fonctions correctes, là où personne n'a écrit de test."
n2.debrief.p1: "Chaque geste sur un objet vérifie son état actuel : à qui il est, et s'il est encore valide. Pas son état au moment de l'achat."
n2.debrief.p2: "On teste les enchaînements, pas seulement chaque fonction : transférer puis rembourser, rembourser puis transférer, deux fois de suite."
n2.debrief.p3: "Aucun filtre d'entrée ne voit ce genre de faille : il n'y a rien de suspect à filtrer. Seul le serveur connaît l'histoire du billet."
n2.debrief.p4: "Tout ce qui touche à l'argent mérite un rapprochement : autant de billets valides que de billets payés, vérifié chaque nuit."
