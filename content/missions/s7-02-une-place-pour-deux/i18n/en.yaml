n2.briefing: "Tuesday. Yesterday you looked for a technical flaw: a forgotten check. Today you look for something else. The ticket office offers two moves to a festival-goer who cannot come: give the ticket to a friend, or get a refund. Each one is correct. Today's question: what happens when you do both?"
n2.obj.forms: "Look at the ticket office's forms"
n2.obj.transfer: "Transfer the test ticket to the test friend"
n2.obj.friend: "Check that the friend does hold a valid ticket"
n2.obj.refund: "Ask for a refund of the transferred ticket, and submit the flag"
n2.obj.review: "Review `dossier/tickets.txt` and point at the faulty line"
n2.ada.brief: "The two forms are at `https://billetterie.lumierenoire.test/transfert` and `/remboursement`. You can open them with `open`, or talk to them with `curl -d \"billet=7102\"`. Start by reading them."
n2.ada.g.forms: "Read the transfer form: `curl https://billetterie.lumierenoire.test/transfert`."
n2.ada.g.forms.standard: "Read the two forms of the ticket office before using them."
n2.ada.g.transfer: "Transfer your test ticket: `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/transfert`."
n2.ada.g.transfer.standard: "Give your test ticket to the test friend, with the transfer form."
n2.ada.g.friend: "The transfer issued ticket 7140. Check that it exists: `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7140`."
n2.ada.g.friend.standard: "Check that the friend's new ticket exists and is valid."
n2.ada.g.refund: "Your ticket 7102 is no longer yours. Ask for its refund anyway: `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/remboursement`."
n2.ada.g.refund.standard: "Ticket 7102 no longer belongs to you. What does the refund form answer if you present it?"
n2.ada.g.submit: "Send the marker of the test account: `submit` followed by the flag."
n2.ada.g.submit.standard: "Submit the flag."
n2.ada.g.review: "The festival handed you the code of both moves. Read it with its line numbers: `review dossier/tickets.txt`. Then point at the faulty line: `review dossier/tickets.txt <number>`. There is only one."
n2.ada.g.review.standard: "Review `dossier/tickets.txt` with `review` and point at the line that lets the refund through."
n2.ada.forms: "Nothing odd: one field, one button. No quote to slip in, no tag. A logic flaw does not show in a form, it shows in the order you use them."
n2.ada.normal: "A normal refund: you hold the ticket, the ticket office says yes (on the test account, it is only a simulation). Nothing to report. Now think about the order: what if the ticket were no longer yours when you ask?"
n2.ada.transfer: "The friend receives ticket 7140, and yours is no longer valid at the gate. So far everything adds up: one entry paid, one entry valid."
n2.ada.friend: "Valid, in the friend's name. Keep the count: one entry, paid €89. Let us see whether the ticket office counts the way you do."
n2.ada.double: "Refunded. Count again: the friend holds a valid entry, and you got the €89 back. Nobody forced anything: each form said yes to a reasonable question. Neither asked the right one."
n2.ada.flag: "Proof made on a single test ticket, and we will not make a second. Imagine the same thing ten thousand times, the week the gates open: that is the festival's budget. Now look at why the code said yes."
n2.ada.review: "Yes. The refund compares the account with the buyer of the ticket. After a transfer, the buyer has not changed: it is still you. It should have looked at today's holder, and at the ticket's status."
n2.ada.done: "The report will say \"refund of a ticket already transferred\". Switch sides: open the debrief, find your request in the ticket office's logs, and choose the fix."
n2.soc.double: "billetterie: a refund was paid for a ticket already transferred"
n2.hint.forms.1: "Type `curl https://billetterie.lumierenoire.test/transfert`."
n2.hint.transfer.1: "The form expects a `billet` field. Your test ticket has number 7102."
n2.hint.transfer.2: "Type `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/transfert`."
n2.hint.friend.1: "Type `curl -b \"session=ln_k7_4f2a\" https://billetterie.lumierenoire.test/billets/7140`."
n2.hint.refund.1: "You made a transfer. What other move does the ticket office offer for the same ticket?"
n2.hint.refund.2: "The refund form expects a `billet` field too. Give it the number of the ticket you just transferred."
n2.hint.refund.3: "Type `curl -d \"billet=7102\" https://billetterie.lumierenoire.test/remboursement`, then `submit` followed by the flag."
n2.hint.review.1: "In `refund`, look for the line that decides whose ticket it is."
n2.hint.review.2: "A ticket has a `buyer` and a `holder`. After a transfer, only one of the two changes."
n2.hint.review.3: "Type `review dossier/tickets.txt 5`."
n2.def.intro: "The ticket office logs every form sent, with what it answered. Your request is in there, among the week's honest transfers and refunds."
n2.def.lesson: "A logic flaw leaves no suspicious input: everything you typed was a ticket number. It is detected through the state of things, not the shape of what is sent. And it is fixed by asking the right question at the right time."
n2.def.find.double: "The refund of a ticket that had already been transferred"
n2.def.rule.after.title: "Alert when a refund targets a ticket already transferred"
n2.def.rule.after.why: "This is the one. It looks at the ticket's state, which only the ticket office knows. No honest request produces that."
n2.def.rule.every.title: "Alert on every refund request"
n2.def.rule.every.why: "Dozens of festival-goers get a refund every day, as intended. Your request is among them, identical to the others at a glance."
n2.def.rule.transfer.title: "Alert on every ticket transfer"
n2.def.rule.transfer.why: "Your transfer was perfectly honest, like all the others. The problem came after, and this rule does not see it."
n2.def.fix.holder.title: "Only refund the current holder of a ticket that is still valid"
n2.def.fix.holder.why: "This is the one. The form now answers that the ticket was transferred. The question asked is at last the one that matters: whose ticket is this today?"
n2.def.fix.daily.title: "Limit each account to one refund a day"
n2.def.fix.daily.why: "You needed a single refund. This limit bothers families cancelling four tickets, and does not bother whoever understood the trick."
n2.def.fix.button.title: "Remove the refund button from the page of transferred tickets"
n2.def.fix.button.why: "You never used the button: you sent the request to the form's address, which still says yes."
n2.debrief.title: "Two yeses that do not add up"
n2.debrief.lesson: "The transfer checked the holder. The refund checked the buyer. Each was right from where it stood, and together they gave away an entry. Logic flaws are born between two correct functions, where nobody wrote a test."
n2.debrief.p1: "Every move on an object checks its current state: whose it is, and whether it is still valid. Not its state when it was bought."
n2.debrief.p2: "Test the sequences, not only each function: transfer then refund, refund then transfer, twice in a row."
n2.debrief.p3: "No input filter sees this kind of flaw: there is nothing suspicious to filter. Only the server knows the ticket's history."
n2.debrief.p4: "Anything that touches money deserves a reconciliation: as many valid tickets as paid tickets, checked every night."
