order: 0
stage: rag
briefing: e1.briefing

objectives:
  - { id: meet, text: e1.obj.meet }
  - { id: index, text: e1.obj.index }
  - { id: leak, text: e1.obj.leak }
  - { id: why, text: e1.obj.why }

flags:
  - { id: leak, value: "FLAG{selene-neighbour-doc-7c3a}", points: 200, objective: leak }

questions:
  - id: why
    text: e1.q.why
    objective: why
    correct: search
    options:
      - { id: model, text: e1.q.why.model, why: e1.q.why.model.why }
      - { id: search, text: e1.q.why.search }
      - { id: account, text: e1.q.why.account, why: e1.q.why.account.why }

reveal: [app]

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: e1.ada.brief
  - on: { event: ChatReply, npc: lyra, intent: { in: [hours, repair, hello, memory-ask, fallback] } }
    do:
      - objective.complete: meet
      - ada.say: e1.ada.meet
  - on: { event: HttpRequest, host: app, path: /api/index }
    do:
      - objective.complete: index
      - ada.say: e1.ada.index
  - on: { event: ChatReply, npc: lyra, intent: neighbour }
    do:
      - objective.complete: meet
      - noise.add: { points: 8, as: e1.soc.leak }
      - ada.say: e1.ada.leak
      - ada.guide: { key: e1.ada.g.submit, for: leak, step: 1 }
  - on: { event: FlagSubmitted, correct: true }
    do:
      - ada.say: e1.ada.flag
      - ada.ask: why
  - on: { event: ObjectiveCompleted, objective: why }
    do:
      - ada.say: e1.ada.why
  - on: { event: MissionCompleted }
    do:
      - ada.say: e1.ada.done

guide:
  meet: e1.ada.g.meet
  index: e1.ada.g.index
  leak: e1.ada.g.leak
  why: e1.ada.answer

hints:
  meet: [e1.hint.meet.1]
  index: [e1.hint.index.1, e1.hint.index.2]
  leak: [e1.hint.leak.1, e1.hint.leak.2, e1.hint.leak.3]

defense:
  intro: e1.def.intro
  lesson: e1.def.lesson
  find:
    - { source: chat, where: { npc: lyra, intent: neighbour }, text: e1.def.find.leak }
  rules:
    - id: foreign-source
      title: e1.def.rule.foreign.title
      why: e1.def.rule.foreign.why
      source: chat
      where: { npc: lyra, intent: neighbour }
      correct: true
    - id: every-question
      title: e1.def.rule.every.title
      why: e1.def.rule.every.why
      source: chat
      where: { npc: lyra }
    - id: burst
      title: e1.def.rule.burst.title
      why: e1.def.rule.burst.why
      source: chat
      where: { npc: lyra }
      count: { gte: 6, within: 10 }
  fixes:
    - id: filter
      title: e1.def.fix.filter.title
      why: e1.def.fix.filter.why
      sets: { rag.tenant_filter: true }
      correct: true
    - id: prompt
      title: e1.def.fix.prompt.title
      why: e1.def.fix.prompt.why
      sets: { rag.strict_prompt: true }
    - id: sources
      title: e1.def.fix.sources.title
      why: e1.def.fix.sources.why
      sets: { rag.hide_sources: true }

debrief:
  title: e1.debrief.title
  lesson: e1.debrief.lesson
  points: [e1.debrief.p1, e1.debrief.p2, e1.debrief.p3, e1.debrief.p4]
  reference: "OWASP LLM Top 10 · LLM08 Vector and Embedding Weaknesses"
