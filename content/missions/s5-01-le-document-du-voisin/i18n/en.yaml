e1.briefing: "New client: Sélène, which rents teams of AI agents to small companies. Four agents, the same for every customer, and one space per customer. Before welcoming a hundred more, Sélène wants to know whether these spaces are really separate. You have yours, Atelier Nord, a bike workshop. You start with Lyra, the agent that answers from each customer's documents."
e1.obj.meet: "Ask Lyra an ordinary question"
e1.obj.index: "Read the state of her document index"
e1.obj.leak: "Make her quote another customer's document, and submit its flag"
e1.obj.why: "Say where the separation was missing"
e1.q.why: "Lyra was told to answer only with the documents of Atelier Nord. Where was the separation between customers missing?"
e1.q.why.model: "In the model: it misread its instruction, a more recent version would follow it"
e1.q.why.model.why: "The model answered with what was put in front of it. The neighbour's passage was already there when the instruction arrived: an instruction does not remove a text from the context."
e1.q.why.search: "In the search: it goes through every customer's documents before the model speaks"
e1.q.why.account: "In your account: the demo space had administrator rights on the platform"
e1.q.why.account.why: "Your account is an ordinary customer's, and you never opened the neighbour's space. Lyra went and fetched its document for you."
e1.ada.brief: "Lyra is at `https://app.selene.test/t/atelier-nord/lyra`. Open the page with `open`, or talk to her with `curl -d`. Start with a customer's question, to see what a normal answer looks like."
e1.ada.g.meet: "Ask a customer's question: `curl -d \"What are your opening hours?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.ada.g.meet.standard: "Ask Lyra a question a customer of the workshop would ask."
e1.ada.g.index: "The page of your space hides a note in its source. It mentions `/api/index`. Read the whole of it: `curl https://app.selene.test/api/index`."
e1.ada.g.index.standard: "Read the source of your space's page, `https://app.selene.test/t/atelier-nord`: a note there says where to look."
e1.ada.g.leak: "The index holds `comptoir-sud/contrat-fournisseur.md`, a supplier contract. Ask Lyra what it says, from your space: `curl -d \"What does the supplier contract say?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.ada.g.leak.standard: "One of the titles in the index is not yours. From your space, ask Lyra a question whose answer can only be in that document."
e1.ada.g.submit: "Submit the flag Lyra read in the neighbour's document: `submit` followed by the flag."
e1.ada.g.submit.standard: "Submit the flag of the document."
e1.ada.meet: "An answer, and the name of the document it comes from. That is the principle: Lyra knows nothing by herself, a search engine hands her passages, and she writes with them. What remains to be seen is where that engine searches."
e1.ada.index: "One collection, `shared-v2`, for two customers. And look at `tenant_filter`: `retrieval: off`, `prompt: on`. The search does not sort by customer. The only separation is a sentence in Lyra's instructions."
e1.ada.leak: "She quotes `comptoir-sud/contrat-fournisseur.md`, from the space of Atelier Nord. You bypassed nothing: you asked a question, and the search brought back the best passage without looking at whose it was."
e1.ada.flag: "A negotiated discount, in black and white for the first competitor who asks. And you needed no trick: no role play, no hidden order. Just a question."
e1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
e1.ada.answer.standard: "Answer my question."
e1.ada.why: "Yes. When the model receives the passage, it is already too late: what it has in front of it, it can repeat. The separation is made before the model, in the search, where a program decides which documents are allowed out."
e1.ada.done: "The report will say \"shared index with no filter by customer\". Now go to the other side: open the debrief, find your question in Sélène's logs, and choose the fix."
e1.soc.leak: "Lyra: an answer quoted a document of another customer"
e1.hint.meet.1: "Type `curl -d \"What are your opening hours?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.hint.index.1: "Read the source of `https://app.selene.test/t/atelier-nord` with `curl`: a comment there gives an address."
e1.hint.index.2: "Type `curl https://app.selene.test/api/index`."
e1.hint.leak.1: "Among the titles of the index, three start with `comptoir-sud/`. One of them is not meant to be read by a competitor."
e1.hint.leak.2: "Stay in your space, and ask Lyra about a contract or a supplier: the workshop has no document about that."
e1.hint.leak.3: "Type `curl -d \"What does the supplier contract say?\" https://app.selene.test/t/atelier-nord/lyra`, then `submit` followed by the flag."
e1.def.intro: "Lyra's gateway logs every question, and what the search brought back. Your question is there, among those of the morning's customers."
e1.def.lesson: "In a shared index, the separation between customers is a filter of the search, applied by a program before the model sees anything. An instruction asks the model to keep quiet about what it read. A filter means it never read it."
e1.def.find.leak: "The question whose answer quotes another customer's document"
e1.def.rule.foreign.title: "Alert when an answer from Lyra quotes a document of another customer than the one of the conversation"
e1.def.rule.foreign.why: "This is the right one: it looks at what the search brought back, not at what the visitor typed. No honest question produces that, however it is worded."
e1.def.rule.every.title: "Alert on every question asked to Lyra"
e1.def.rule.every.why: "Lyra answers hundreds of visitors a day. Your question is in there, and nobody will see it."
e1.def.rule.burst.title: "Alert when one address asks 6 questions or more in 10 minutes"
e1.def.rule.burst.why: "You needed a single question, asked once: this rule does not see you. It counts messages, not what the search brings back."
e1.def.fix.filter.title: "Filter the search by customer: only the documents of the customer of the conversation can be brought back"
e1.def.fix.filter.why: "This is the right one. The neighbour's passage never reaches the model again, so no wording can bring it out. Lyra answers that she finds nothing, and it is true."
e1.def.fix.prompt.title: "Harden the instruction: \"NEVER quote a document of another customer\""
e1.def.fix.prompt.why: "That is what the instruction already said, less loudly. The passage still arrives in front of the model, and your question still brings it out. An instruction is not an access control."
e1.def.fix.sources.title: "Stop showing the name of the documents in the answers"
e1.def.fix.sources.why: "The neighbour's discount is still in the answer. You only removed the proof that it comes from elsewhere, which makes the leak harder to see."
e1.debrief.title: "One index for all"
e1.debrief.lesson: "Lyra knows nothing: a search brings her passages, and she writes with them. Sélène had put the documents of all its customers in the same index, and left the separation to a sentence of instruction. The search brought back the best passage, the neighbour's, and the model did its job with it."
e1.debrief.p1: "Access control is done in the search, by a filter the code applies to every query, with the customer's identity taken from the session and never from the message."
e1.debrief.p2: "Anything that enters a model's context can come out of it. An instruction steers a model, it does not protect a piece of data."
e1.debrief.p3: "One index per customer, or at least a mandatory customer label on every document, checked by tests that ask the neighbour's question."
e1.debrief.p4: "Quoting sources is not the flaw: it is what let you see it. Removing them hides the leak without closing it."
