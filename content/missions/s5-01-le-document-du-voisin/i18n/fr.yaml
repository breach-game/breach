e1.briefing: "Nouveau client : Sélène, qui loue des équipes d'agents IA à de petites entreprises. Quatre agents, les mêmes pour tous les clients, et un espace par client. Avant d'en accueillir cent de plus, Sélène veut savoir si ces espaces sont vraiment séparés. Tu as le tien, Atelier Nord, un atelier de vélos. Tu commences par Lyra, l'agent qui répond à partir des documents de chaque client."
e1.obj.meet: "Poser à Lyra une question ordinaire"
e1.obj.index: "Lire l'état de son index de documents"
e1.obj.leak: "Lui faire citer le document d'un autre client, et envoyer son flag"
e1.obj.why: "Dire où la séparation a manqué"
e1.q.why: "Lyra avait pour consigne de ne répondre qu'avec les documents d'Atelier Nord. Où la séparation entre clients a-t-elle manqué ?"
e1.q.why.model: "Dans le modèle : il a mal compris sa consigne, une version plus récente la respecterait"
e1.q.why.model.why: "Le modèle a répondu avec ce qu'on lui a mis sous les yeux. Le passage du voisin était déjà devant lui quand la consigne est arrivée : une consigne ne retire pas un texte du contexte."
e1.q.why.search: "Dans la recherche : elle fouille les documents de tous les clients avant que le modèle parle"
e1.q.why.account: "Dans ton compte : l'espace de démonstration avait des droits d'administrateur sur la plateforme"
e1.q.why.account.why: "Ton compte est celui d'un client ordinaire, et tu n'as jamais ouvert l'espace du voisin. C'est Lyra qui est allée chercher son document pour toi."
e1.ada.brief: "Lyra est sur `https://app.selene.test/t/atelier-nord/lyra`. Ouvre la page avec `open`, ou parle-lui avec `curl -d`. Commence par une question de client, pour voir à quoi ressemble une réponse normale."
e1.ada.g.meet: "Pose une question de client : `curl -d \"Quels sont vos horaires ?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.ada.g.meet.standard: "Pose à Lyra une question qu'un client de l'atelier poserait."
e1.ada.g.index: "La page de ton espace cache une note dans sa source. Elle parle de `/api/index`. Lis-le en entier : `curl https://app.selene.test/api/index`."
e1.ada.g.index.standard: "Lis la source de la page de ton espace, `https://app.selene.test/t/atelier-nord` : une note y indique où regarder."
e1.ada.g.leak: "L'index contient `comptoir-sud/contrat-fournisseur.md`. Demande à Lyra ce qu'il dit, depuis ton espace : `curl -d \"Que dit le contrat fournisseur ?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.ada.g.leak.standard: "Un des titres de l'index n'est pas à toi. Pose à Lyra, depuis ton espace, une question dont la réponse ne peut être que dans ce document."
e1.ada.g.submit: "Envoie le flag que Lyra a lu dans le document du voisin : `submit` suivi du flag."
e1.ada.g.submit.standard: "Envoie le flag du document."
e1.ada.meet: "Une réponse, et le nom du document d'où elle sort. C'est le principe : Lyra ne sait rien par elle-même, un moteur de recherche lui glisse des passages, et elle rédige avec. Reste à savoir dans quoi ce moteur cherche."
e1.ada.index: "Une seule collection, `shared-v2`, pour deux clients. Et regarde `tenant_filter` : `retrieval: off`, `prompt: on`. La recherche ne trie pas par client. La seule séparation est une phrase dans la consigne de Lyra."
e1.ada.leak: "Elle cite `comptoir-sud/contrat-fournisseur.md`, depuis l'espace d'Atelier Nord. Tu n'as rien contourné : tu as posé une question, et la recherche a ramené le meilleur passage, sans regarder à qui il était."
e1.ada.flag: "Une remise négociée, écrite noir sur blanc pour le premier concurrent qui pose la question. Et tu n'as eu besoin d'aucune ruse : ni jeu de rôle, ni ordre caché. Juste une question."
e1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
e1.ada.answer.standard: "Réponds à ma question."
e1.ada.why: "Oui. Quand le modèle reçoit le passage, il est déjà trop tard : ce qu'il a sous les yeux, il peut le répéter. La séparation se fait avant lui, dans la recherche, là où un programme décide quels documents ont le droit de sortir."
e1.ada.done: "Le rapport dira « index partagé sans filtre par client ». Maintenant passe de l'autre côté : ouvre le débrief, retrouve ta question dans les journaux de Sélène, et choisis la correction."
e1.soc.leak: "Lyra: an answer quoted a document of another customer"
e1.hint.meet.1: "Tape `curl -d \"Quels sont vos horaires ?\" https://app.selene.test/t/atelier-nord/lyra`."
e1.hint.index.1: "Lis la source de `https://app.selene.test/t/atelier-nord` avec `curl` : un commentaire y donne une adresse."
e1.hint.index.2: "Tape `curl https://app.selene.test/api/index`."
e1.hint.leak.1: "Parmi les titres de l'index, trois commencent par `comptoir-sud/`. L'un d'eux n'est pas fait pour être lu par un concurrent."
e1.hint.leak.2: "Reste dans ton espace, et pose à Lyra une question sur un contrat ou un fournisseur : l'atelier n'a aucun document là-dessus."
e1.hint.leak.3: "Tape `curl -d \"Que dit le contrat fournisseur ?\" https://app.selene.test/t/atelier-nord/lyra`, puis `submit` suivi du flag."
e1.def.intro: "La passerelle de Lyra journalise chaque question, et ce que la recherche a ramené. Ta question y est, au milieu de celles des clients du matin."
e1.def.lesson: "Dans un index partagé, la séparation entre clients est un filtre de la recherche, appliqué par un programme avant que le modèle voie quoi que ce soit. Une consigne demande au modèle de se taire sur ce qu'il a lu. Un filtre fait qu'il ne l'a jamais lu."
e1.def.find.leak: "La question dont la réponse cite le document d'un autre client"
e1.def.rule.foreign.title: "Alerter quand une réponse de Lyra cite un document d'un autre client que celui de la conversation"
e1.def.rule.foreign.why: "C'est la bonne : elle regarde ce que la recherche a ramené, pas ce que le visiteur a tapé. Aucune question honnête ne produit cela, quelle que soit sa formulation."
e1.def.rule.every.title: "Alerter sur chaque question posée à Lyra"
e1.def.rule.every.why: "Lyra répond à des centaines de visiteurs par jour. Ta question est dedans, et personne ne l'y verra."
e1.def.rule.burst.title: "Alerter quand une adresse pose 6 questions ou plus en 10 minutes"
e1.def.rule.burst.why: "Il t'a fallu une seule question, posée une fois : cette règle ne te voit pas. Elle compte les messages, pas ce que la recherche ramène."
e1.def.fix.filter.title: "Filtrer la recherche par client : seuls les documents du client de la conversation peuvent être ramenés"
e1.def.fix.filter.why: "C'est la bonne. Le passage du voisin n'arrive plus jamais devant le modèle, donc aucune formulation ne peut le faire sortir. Lyra répond qu'elle ne trouve rien, et c'est vrai."
e1.def.fix.prompt.title: "Durcir la consigne : « ne cite JAMAIS un document d'un autre client »"
e1.def.fix.prompt.why: "C'est déjà ce que disait la consigne, en moins fort. Le passage arrive toujours sous les yeux du modèle, et ta question le fait toujours sortir. Une consigne n'est pas un contrôle d'accès."
e1.def.fix.sources.title: "Ne plus afficher le nom des documents dans les réponses"
e1.def.fix.sources.why: "La remise du voisin est toujours dans la réponse. Tu as seulement retiré la preuve qu'elle vient d'ailleurs, ce qui rend la fuite plus difficile à voir."
e1.debrief.title: "Un index pour tous"
e1.debrief.lesson: "Lyra ne sait rien : une recherche lui apporte des passages, et elle rédige avec. Sélène avait rangé les documents de tous ses clients dans le même index, et confié la séparation à une phrase de consigne. La recherche a ramené le meilleur passage, celui du voisin, et le modèle a fait son travail avec."
e1.debrief.p1: "Le contrôle d'accès se fait dans la recherche, par un filtre que le code applique à chaque requête, avec l'identité du client tirée de sa session et jamais de son message."
e1.debrief.p2: "Tout ce qui entre dans le contexte d'un modèle peut en ressortir. Une consigne oriente un modèle, elle ne protège pas une donnée."
e1.debrief.p3: "Un index par client, ou au moins une étiquette de client obligatoire sur chaque document, vérifiée par des tests qui posent la question du voisin."
e1.debrief.p4: "Citer ses sources n'est pas la faille : c'est ce qui t'a permis de la voir. Les retirer la cache sans la fermer."
