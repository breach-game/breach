c2.briefing: "Tuesday. The old version 1 answers; what it agrees to do is the question. The mandate gives you two test accounts: 1042, yours, with its token, and 1043, Ada's, whose token you do not have. If your token opens Ada's account, it opens any customer's. Everything is in `mandate/comptes-de-test.txt`."
c2.obj.mine: "Read your own account with your token"
c2.obj.refused: "Ask version 2 for Ada's account"
c2.obj.other: "Ask version 1 for Ada's account"
c2.obj.proof: "Submit the proof left in Ada's account"
c2.obj.extra: "Find the field the bank computes about its customers (its name, with `submit`)"
c2.obj.class: "Say what version 1 forgets to check"
c2.q.class: "What does version 1 fail to check?"
c2.q.class.owner: "That the account asked for belongs to the token's holder."
c2.q.class.token: "That the token sent is valid, signed and not expired."
c2.q.class.token.why: "Your token is perfectly valid, and without a token v1 answers 401. It knows who you are. It does not ask whether this account is yours."
c2.q.class.guess: "That account numbers are hard to guess."
c2.q.class.guess.why: "Random numbers would slow the search down and close nothing: a number always ends up showing on a statement or in a transfer. The check has to be made by the server."
c2.ada.brief: "Start with what is allowed: your account, with your token. Read `mandate/comptes-de-test.txt`, the command is in it."
c2.ada.g.mine: "Read the test accounts: `cat mandate/comptes-de-test.txt`. Then your account: `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me`."
c2.ada.g.mine.standard: "Your test account's token is in `mandate/comptes-de-test.txt`. Read your account on version 2."
c2.ada.mine: "Five fields, the IBAN masked: v2 only sends what the app displays. Your account is 1042. Ada's is 1043. Ask for it with your token."
c2.ada.g.refused: "Same command, other account: `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/1043`."
c2.ada.g.refused.standard: "Ask version 2 for account 1043, with your token."
c2.ada.refused: "403, \"this account is not yours\". v2 does its job: it looks at whose token it is, then at whose account it is. Someone wrote that check one day. The question is whether they wrote it in v1 too."
c2.ada.g.other: "Replace `v2` with `v1`: `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043`."
c2.ada.g.other.standard: "Ask version 1 the same question."
c2.ada.other: "200. Ada's account, whole, with your own token. Changing one number in the address is enough. It is the most common API flaw there is, and it needs no tool. Ada left a proof in her account."
c2.ada.real: "Stop. 1001 is a real customer, and the mandate is clear: the proof is made on the test accounts. You have just read the data of someone who asked for nothing, and Comptoir's SOC has one more line to explain. Do not go back."
c2.ada.g.proof: "The proof is in the `advisor_note` field. Submit it: `submit FLAG{...}`."
c2.ada.flag: "Proof made, on a test account meant for it. Now look at the answer itself: how many fields does v1 send?"
c2.ada.g.extra: "List the fields: `curl -s -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043 | jq keys`. One of them is a score the bank computes about its customer. Give its name with `submit <field>`."
c2.ada.g.extra.standard: "Use `jq keys` to list the fields v1 returns, and give with `submit` the name of the one the bank computes about its customer."
c2.ada.extra: "`internal_risk_score`. Ten fields, when the app displays five: the full IBAN, the phone number, the date of birth, the risk score, the adviser's comment. v1 sends the whole database row and lets the app choose what to show. The app is not a filter: whatever leaves the server can be read by anyone."
c2.ada.g.class: "Answer my question about what v1 fails to check."
c2.ada.class: "Yes. Knowing who is talking (authentication) and knowing whether they are entitled to that object (authorisation) are two different checks. v1 makes the first and forgets the second, on every account of the bank."
c2.ada.done: "Inès went pale, then said: \"That one we cut this week.\" Meanwhile her team showed me something else in last night's logs, about sign-in by text-message code. Tomorrow you move to the other side."
c2.soc.other: "api: a token read an account that is not its own, on v1"
c2.soc.real: "api: a test token read the account of a real customer"
c2.hint.mine.1: "`cat mandate/comptes-de-test.txt` gives the token and the command."
c2.hint.mine.2: "Type `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me`."
c2.hint.refused.1: "Type `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/1043`."
c2.hint.other.1: "Version 1 has the same paths as version 2."
c2.hint.other.2: "Type `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043`."
c2.hint.proof.1: "Type `submit FLAG{comptoir-le-compte-d-a-cote-8b20}`."
c2.hint.extra.1: "Add `| jq keys` to the command to see only the names of the fields. The field name is checked with `submit`, like a flag."
c2.hint.extra.2: "Type `submit internal_risk_score`."
c2.hint.class.1: "The token is fine, the account is not yours. Type `answer owner`."
c2.def.intro: "The gateway logged your read of Ada's account. It looks like all the others: a valid token, a 200 answer."
c2.def.lesson: "The server checks, on every request and for every object, that whoever asks is entitled to it. That check cannot be left to the app or to the shape of the numbers. And an answer only holds the fields the client needs: what is not sent cannot leak."
c2.def.find.other: "Your read of account 1043 on v1"
c2.def.rule.number.title: "Alert on an account asked for by its number on v1"
c2.def.rule.number.why: "This is the one. The old apps only ask for `/accounts/me`. A number written in the address, on v1, comes from someone trying numbers."
c2.def.rule.refused.title: "Alert on 403 refusals from v2"
c2.def.rule.refused.why: "It sees your attempt on v2, the one that failed, and every app asking again for a closed account. It does not see the successful read on v1, the only one that matters."
c2.def.rule.me.title: "Alert on calls to `/v1/accounts/me`"
c2.def.rule.me.why: "That is exactly what the old phones do all day, each on its own account. And you never called that path."
c2.def.fix.owner.title: "Check on v1 that the account asked for is the token's own"
c2.def.fix.owner.why: "This is the one: the same check as v2, in the same place. Your token gets 403 on Ada's account, and on every other."
c2.def.fix.trim.title: "Remove from the answer the fields the app does not display"
c2.def.fix.trim.why: "Worth doing too, but it closes nothing: Ada's account can still be read with your token, with fewer fields. Her balance and her name are still someone else's."
c2.def.fix.rate.title: "Limit each token to ten calls a minute"
c2.def.fix.rate.why: "You needed a single call. At ten a minute, fourteen thousand accounts a day can be read without ever passing the limit."
c2.debrief.title: "Knowing who is talking does not say what they may see"
c2.debrief.lesson: "Your token proved you were customer 1042. v1 was content with that, and served any account whose number was written in the address. It also sent every column of the database, risk score included."
c2.debrief.p1: "On every request, the server checks that the object asked for belongs to whoever asks."
c2.debrief.p2: "That check lives in one place, shared by every version, not copied route by route."
c2.debrief.p3: "An answer only holds the fields the client needs. The app is not a filter."
c2.debrief.p4: "A proof is made on test accounts named in the mandate, never on a real customer's data."
