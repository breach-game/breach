c2.briefing: "Mardi. La vieille version 1 répond, reste à savoir ce qu'elle accepte. Le mandat te donne deux comptes de test : le 1042, le tien, avec son jeton, et le 1043, celui d'Ada, dont tu n'as pas le jeton. Si ton jeton ouvre le compte d'Ada, il ouvre celui de n'importe quel client. Tout est dans `mandate/comptes-de-test.txt`."
c2.obj.mine: "Lire ton propre compte avec ton jeton"
c2.obj.refused: "Demander le compte d'Ada à la version 2"
c2.obj.other: "Demander le compte d'Ada à la version 1"
c2.obj.proof: "Valider la preuve laissée dans le compte d'Ada"
c2.obj.extra: "Trouver le champ que la banque calcule sur ses clients (son nom, avec `submit`)"
c2.obj.class: "Dire ce que la version 1 oublie de vérifier"
c2.q.class: "Qu'est-ce que la version 1 ne vérifie pas ?"
c2.q.class.owner: "Que le compte demandé appartient au porteur du jeton."
c2.q.class.token: "Que le jeton envoyé est valable et pas expiré."
c2.q.class.token.why: "Ton jeton est tout à fait valable, et sans jeton la v1 répond 401. Elle sait qui tu es. Elle ne se demande pas si ce compte est le tien."
c2.q.class.guess: "Que les numéros de compte sont difficiles à deviner."
c2.q.class.guess.why: "Des numéros au hasard ralentiraient la recherche, sans rien fermer : un numéro finit toujours par se voir sur un relevé ou dans un virement. Le contrôle doit être fait par le serveur."
c2.ada.brief: "Commence par ce qui est permis : ton compte, avec ton jeton. Lis `mandate/comptes-de-test.txt`, la commande y est."
c2.ada.g.mine: "Lis les comptes de test : `cat mandate/comptes-de-test.txt`. Puis ton compte : `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me`."
c2.ada.g.mine.standard: "Le jeton de ton compte de test est dans `mandate/comptes-de-test.txt`. Lis ton compte sur la version 2."
c2.ada.mine: "Cinq champs, l'IBAN masqué : la v2 n'envoie que ce que l'appli affiche. Ton compte est le 1042. Celui d'Ada est le 1043. Demande-le avec ton jeton."
c2.ada.g.refused: "Même commande, autre compte : `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/1043`."
c2.ada.g.refused.standard: "Demande à la version 2 le compte 1043, avec ton jeton."
c2.ada.refused: "403, « ce compte n'est pas le vôtre ». La v2 fait son travail : elle regarde à qui est le jeton, puis à qui est le compte. Quelqu'un a écrit ce contrôle un jour. La question est de savoir s'il l'a écrit aussi dans la v1."
c2.ada.g.other: "Remplace `v2` par `v1` : `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043`."
c2.ada.g.other.standard: "Pose la même question à la version 1."
c2.ada.other: "200. Le compte d'Ada, en entier, avec ton jeton à toi. Il suffit de changer un nombre dans l'adresse. C'est la faille la plus fréquente des API, et elle ne demande aucun outil. Ada a laissé une preuve dans son compte."
c2.ada.real: "Stop. Le 1001 est un vrai client, et le mandat est clair : la preuve se fait sur les comptes de test. Tu viens de lire les données de quelqu'un qui n'a rien demandé, et le SOC de Comptoir a une ligne de plus à expliquer. N'y retourne pas."
c2.ada.g.proof: "La preuve est dans le champ `advisor_note`. Valide-la : `submit FLAG{...}`."
c2.ada.flag: "Preuve faite, sur un compte de test prévu pour ça. Regarde maintenant la réponse elle-même : combien de champs la v1 envoie-t-elle ?"
c2.ada.g.extra: "Liste les champs : `curl -s -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043 | jq keys`. L'un d'eux est une note que la banque calcule sur son client. Donne son nom avec `submit <champ>`."
c2.ada.g.extra.standard: "Liste avec `jq keys` les champs que la v1 renvoie, et donne avec `submit` le nom de celui que la banque calcule sur son client."
c2.ada.extra: "`internal_risk_score`. Dix champs, quand l'appli en affiche cinq : l'IBAN complet, le téléphone, la date de naissance, la note de risque, le commentaire du conseiller. La v1 envoie toute la ligne de la base et laisse l'appli choisir quoi montrer. L'appli n'est pas un filtre : ce qui part du serveur est lu par qui veut."
c2.ada.g.class: "Réponds à ma question sur ce que la v1 ne vérifie pas."
c2.ada.class: "Oui. Savoir qui parle (l'authentification) et savoir s'il a droit à cet objet-là (l'autorisation) sont deux contrôles différents. La v1 fait le premier et oublie le second, sur chaque compte de la banque."
c2.ada.done: "Inès a blêmi, puis elle a dit : « Ça, on coupe cette semaine. » En attendant, son équipe m'a montré autre chose dans les journaux de cette nuit, sur la connexion par code SMS. Demain, tu passes de l'autre côté."
c2.soc.other: "api: a token read an account that is not its own, on v1"
c2.soc.real: "api: a test token read the account of a real customer"
c2.hint.mine.1: "`cat mandate/comptes-de-test.txt` donne le jeton et la commande."
c2.hint.mine.2: "Tape `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/me`."
c2.hint.refused.1: "Tape `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v2/accounts/1043`."
c2.hint.other.1: "La version 1 a les mêmes chemins que la version 2."
c2.hint.other.2: "Tape `curl -H \"Authorization: Bearer cpt_test_4f1a9c\" https://api.comptoir.test/v1/accounts/1043`."
c2.hint.proof.1: "Tape `submit FLAG{comptoir-le-compte-d-a-cote-8b20}`."
c2.hint.extra.1: "Ajoute `| jq keys` à la commande pour ne voir que les noms des champs. Le nom du champ se valide avec `submit`, comme un flag."
c2.hint.extra.2: "Tape `submit internal_risk_score`."
c2.hint.class.1: "Le jeton est bon, le compte n'est pas le tien. Tape `answer owner`."
c2.def.intro: "La passerelle a journalisé ta lecture du compte d'Ada. Elle ressemble à toutes les autres : un jeton valable, une réponse 200."
c2.def.lesson: "Le serveur vérifie, à chaque requête et pour chaque objet, que celui qui demande y a droit. Ce contrôle ne se délègue ni à l'appli ni à la forme des numéros. Et une réponse ne contient que les champs dont le client a besoin : ce qui n'est pas envoyé ne peut pas fuir."
c2.def.find.other: "Ta lecture du compte 1043 sur la v1"
c2.def.rule.number.title: "Alerter sur un compte demandé par son numéro sur la v1"
c2.def.rule.number.why: "C'est la bonne. Les vieilles applis ne demandent que `/accounts/me`. Un numéro écrit dans l'adresse, sur la v1, vient de quelqu'un qui essaie des numéros."
c2.def.rule.refused.title: "Alerter sur les refus 403 de la v2"
c2.def.rule.refused.why: "Elle voit ton essai sur la v2, celui qui a échoué, et chaque appli qui redemande un compte clôturé. Elle ne voit pas la lecture réussie sur la v1, qui est la seule qui compte."
c2.def.rule.me.title: "Alerter sur les appels à `/v1/accounts/me`"
c2.def.rule.me.why: "C'est exactement ce que font les vieux téléphones, toute la journée, chacun sur son propre compte. Et toi, tu n'as jamais appelé ce chemin."
c2.def.fix.owner.title: "Vérifier sur la v1 que le compte demandé est celui du jeton"
c2.def.fix.owner.why: "C'est la bonne : le même contrôle que la v2, à la même place. Ton jeton reçoit 403 sur le compte d'Ada, et sur tous les autres."
c2.def.fix.trim.title: "Retirer de la réponse les champs que l'appli n'affiche pas"
c2.def.fix.trim.why: "À faire aussi, mais ça ne ferme rien : le compte d'Ada se lit toujours avec ton jeton, avec moins de champs. Son solde et son nom restent ceux de quelqu'un d'autre."
c2.def.fix.rate.title: "Limiter chaque jeton à dix appels par minute"
c2.def.fix.rate.why: "Il t'a fallu un seul appel. À dix par minute, on lit quatorze mille comptes par jour sans jamais dépasser la limite."
c2.debrief.title: "Savoir qui parle ne dit pas ce qu'il a le droit de voir"
c2.debrief.lesson: "Ton jeton prouvait que tu étais le client 1042. La v1 s'en contentait, et servait n'importe quel compte dont on écrivait le numéro. Elle envoyait en plus tous les champs de la base, note de risque comprise."
c2.debrief.p1: "À chaque requête, le serveur vérifie que l'objet demandé appartient à celui qui le demande."
c2.debrief.p2: "Ce contrôle vit à un seul endroit, partagé par toutes les versions, pas recopié route par route."
c2.debrief.p3: "Une réponse ne contient que les champs utiles au client. L'appli n'est pas un filtre."
c2.debrief.p4: "Une preuve se fait sur des comptes de test prévus au mandat, jamais sur les données d'un vrai client."
