c4.briefing: "Thursday. Back on the attack side, still under mandate CP-2029-09. Comptoir is opening its API to partners and offers them a tool: a page that sends a test notification to the address it is given, and displays the answer. The mandate forbids attacking the internal servers directly, and they cannot be reached from outside anyway. Let's see who can reach them."
c4.obj.tester: "Read the notification tester's page"
c4.obj.outside: "Make it call an address of yours"
c4.obj.inside: "Make it call an internal address"
c4.obj.proof: "Read what the internal server keeps"
c4.obj.class: "Say who made the request"
c4.q.class: "Who sent the request to the internal server?"
c4.q.class.server: "The tester's server, from inside the network."
c4.q.class.me: "Your machine, going through the firewall."
c4.q.class.me.why: "Your machine never spoke to the internal server: it cannot even find its name. You spoke to the tester, and the tester made the trip."
c4.q.class.partner: "A partner, with its signing key."
c4.q.class.partner.why: "No partner was involved and you had no key. The tester accepts an address from anyone."
c4.ada.brief: "The page is public. Read it, source included: internal tools that became public often keep notes from their authors."
c4.ada.g.tester: "Read the page: `curl https://hooks.comptoir.test/`."
c4.ada.tester: "\"We call it straight away and show you what it answered.\" So a Comptoir server makes a request in your place, to the address you choose, and hands you the answer. And in the source, a note: the signing keys are on `config.int.comptoir.test`. First try the tool as an honest partner would, with an address of our lab."
c4.ada.g.outside: "Give it an address of ours: `curl -d \"url=https://lab.lignerouge.test/ping\" https://hooks.comptoir.test/`."
c4.ada.g.outside.standard: "Send the tester (field `url`) an address of the Ligne Rouge lab."
c4.ada.outside: "\"pong\". It went to look and it tells you about it. Now the question: will it go and look anywhere? Your machine cannot reach `config.int.comptoir.test`, that name does not exist from outside. But your machine is not the one making the trip."
c4.ada.g.inside: "Give it the internal address read in the source: `curl -d \"url=http://config.int.comptoir.test/\" https://hooks.comptoir.test/`."
c4.ada.g.inside.standard: "Ask the tester to call the internal address the page source mentions."
c4.ada.refused: "\"connection refused\": it did try to go inside, there is simply nothing listening there. That is already information. Try the name read in the page source."
c4.ada.inside: "It went, and it reads you the home page of a server the firewall hides from you. Two paths: `/keys` and `/flags`. The mandate forbids you to attack that server directly. You are not attacking it: you are asking a public Comptoir service what it can see. That is exactly what Inès wants to know."
c4.ada.g.proof: "Ask it for the keys: `curl -d \"url=http://config.int.comptoir.test/keys\" https://hooks.comptoir.test/`."
c4.ada.g.proof.standard: "Make the tester read the `/keys` path of the internal server."
c4.ada.keys: "The key that signs the notifications sent to partners. Our lab masked the value in your output, we have no business holding it. With it, someone could send Budgeto fake \"transfer received\" notifications signed Comptoir."
c4.ada.g.submit: "The canary is in the answer. Submit it: `submit FLAG{...}`."
c4.ada.flag: "Proof made. One question, for the report."
c4.ada.g.class: "Answer my question about who made the request."
c4.ada.class: "Yes. The firewall protects the inside from the outside, and the tester is inside. A server that fetches an address chosen by a stranger lends that stranger its place in the network."
c4.ada.done: "Inès had the key changed within the hour, and the tester is closed until the fix. That leaves the partners' sign-in itself: when a Comptoir customer says yes to Budgeto, where are they sent back? We look at that tomorrow."
c4.soc.inside: "hooks: the tester was asked to call an internal name"
c4.soc.keys: "hooks: the tester returned the content of the internal configuration server"
c4.hint.tester.1: "Type `curl https://hooks.comptoir.test/` and read the comment in the source too."
c4.hint.outside.1: "Type `curl -d \"url=https://lab.lignerouge.test/ping\" https://hooks.comptoir.test/`."
c4.hint.inside.1: "The comment on the page names an internal server: `config.int.comptoir.test`."
c4.hint.inside.2: "Type `curl -d \"url=http://config.int.comptoir.test/\" https://hooks.comptoir.test/`."
c4.hint.proof.1: "Type `curl -d \"url=http://config.int.comptoir.test/keys\" https://hooks.comptoir.test/`."
c4.hint.proof.2: "Then `submit FLAG{comptoir-le-webhook-curieux-c0d9}`."
c4.hint.class.1: "Your machine only spoke to the tester. Type `answer server`."
c4.def.intro: "The tester logs every address it is asked to call. Yours are in there, among the partners'."
c4.def.lesson: "A service that fetches an address for someone else has to choose where it agrees to go: public addresses only, checked after the name is resolved, never the internal network. And it does not need to show the full answer: \"received, code 200\" is enough for a partner."
c4.def.find.keys: "Your request to read the internal keys"
c4.def.rule.internal.title: "Alert when the tester is sent to an internal address"
c4.def.rule.internal.why: "This is the one. No partner has a reason to give an address inside Comptoir's network. The rule rings on the first try, even a failed one."
c4.def.rule.every.title: "Alert on every use of the tester"
c4.def.rule.every.why: "Partners use it all day, that is what it is for. Your request would be one line among hundreds."
c4.def.rule.burst.title: "Alert above eight tries in ten minutes"
c4.def.rule.burst.why: "You needed three. Someone who knows what they are looking for makes no noise."
c4.def.fix.allow.title: "Only call public addresses, checked after the name is resolved"
c4.def.fix.allow.why: "This is the one. The tester refuses anything that leads to the internal network, whatever name is used. It stays useful to partners."
c4.def.fix.signed.title: "Sign the test notifications too"
c4.def.fix.signed.why: "The signature proves to the partner that the notification comes from Comptoir. It changes nothing about where the tester agrees to go."
c4.def.fix.timeout.title: "Cut the tester's calls after two seconds"
c4.def.fix.timeout.why: "The internal server answered in two milliseconds. A timeout protects against slow addresses, not forbidden ones."
c4.debrief.title: "A server that fetches for you lends you its place"
c4.debrief.lesson: "You never touched the internal server. You asked a public service, sitting inside the network, to go there for you and read you the answer. The firewall could do nothing about it: the request came from inside."
c4.debrief.p1: "Any service that calls an address supplied by a user limits its destinations: public only, never internal."
c4.debrief.p2: "The check is made on the address obtained after resolving the name, not on the text typed."
c4.debrief.p3: "Do not return the full answer to the user: a status code is enough."
c4.debrief.p4: "Secrets are not readable on a plain internal request: a configuration server also asks who is calling."
