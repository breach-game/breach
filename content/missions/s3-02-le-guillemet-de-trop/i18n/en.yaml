p2.briefing: "Yesterday you looked. Today you talk to the shop, through its search form. A form takes a stranger's text and hands it to a program: everything depends on what the program does with it. You are about to see the oldest flaw of the web, the one in every ranking for twenty years, and why it still exists."
p2.obj.search: "Run a normal search"
p2.obj.error: "Make the search fail with a single character"
p2.obj.query: "Read the query the shop sends to its database"
p2.obj.proof: "Bring out an unpublished item, and submit its flag"
p2.obj.why: "Say why it worked"
p2.q.why: "You stole no password and forced no door. What made this possible?"
p2.q.why.password: "The database had no password, so any visitor could query it"
p2.q.why.password.why: "You never talked to the database: only the shop's program talks to it, with its own credentials. The program passed your words on, and that is where the defect is."
p2.q.why.code: "The program pastes the visitor's text into its query, and the database read it as code"
p2.q.why.debug: "Debug mode was on: without it, the query could not have been changed"
p2.q.why.debug.why: "Debug mode showed you the query, which saved you time. But switch it off and the search is still fragile: a patient attacker moves forward blind."
p2.ada.brief: "The search is at `https://shop.pelican.test/search`. Open it in the browser with `open`, or talk to it with `curl -d`. Start with an ordinary search, to see a normal answer."
p2.ada.g.search: "Look for a garment: `curl -d \"q=veste\" https://shop.pelican.test/search`. The form on the page does exactly the same thing."
p2.ada.g.search.standard: "Run an ordinary search, to see what a normal answer holds."
p2.ada.g.error: "Now add a straight apostrophe at the end of the word: `curl -d \"q=veste'\" https://shop.pelican.test/search`."
p2.ada.g.error.standard: "In many languages, one character opens and closes a piece of text. Add it to your search."
p2.ada.g.query: "Yesterday, `robots.txt` kept a `/debug/` folder away. Read what it holds: `curl https://shop.pelican.test/debug/last-query`."
p2.ada.g.query.standard: "Yesterday, `robots.txt` kept a debug folder away. Go and see what it holds about the search."
p2.ada.g.proof: "Your quote closes the text. What follows is read as a condition. Give it one that is always true: `curl -d \"q=veste' OR '1'='1\" https://shop.pelican.test/search`."
p2.ada.g.proof.standard: "After your quote, the database reads conditions. Add one that is always true, joined by OR."
p2.ada.g.submit: "Submit the flag of the item that should never have come out: `submit` followed by the flag."
p2.ada.g.submit.standard: "Submit the flag of the item that should never have come out."
p2.ada.search: "Two results, nothing unusual. Remember the shape of a healthy answer: comparing it with the others is how you will see something break."
p2.ada.error: "A 500 error, and the server shows you its query. Look where your text lands: between two quotes. Yours closed the string too early, and the database no longer understood the end of the sentence. You just changed a query you have no access to."
p2.ada.query: "`name LIKE '%veste%'`, and just before, `published = 1`. Your text is pasted as is into the middle of a sentence the database will run. The condition `published = 1` is all that stands between you and the unpublished items."
p2.ada.rows: "Four results instead of two. The database read the end of your sentence as a condition, always true, and `published = 1` no longer counted."
p2.ada.flag: "On a real shop, the same weakness would give away the customer table. Here we stop at the proof: one unpublished item is enough for the report."
p2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p2.ada.answer.standard: "Answer my question."
p2.ada.why: "Yes. Data and code in the same sentence: the program no longer knows who wrote what. It is exactly what you saw with Nova in season 1, twenty years earlier and in another language."
p2.ada.done: "The report will say \"injection\". The most useful part is left: cross to the other side. Open the debrief, find your lines in Pélican's logs, and choose the fix."
p2.soc.error: "Search form: the database refused a query built from a visitor's text"
p2.soc.rows: "Search form: unpublished rows returned to a visitor"
p2.hint.search.1: "Type `curl -d \"q=veste\" https://shop.pelican.test/search`."
p2.hint.error.1: "The character is the straight apostrophe, the one that surrounds text in a query."
p2.hint.error.2: "Type `curl -d \"q=veste'\" https://shop.pelican.test/search`."
p2.hint.query.1: "Type `curl https://shop.pelican.test/debug/last-query`."
p2.hint.proof.1: "Your quote closes the text being searched. The rest of your input becomes a piece of the query."
p2.hint.proof.2: "A condition that is always true, joined by OR, cancels the ones before it."
p2.hint.proof.3: "Type `curl -d \"q=veste' OR '1'='1\" https://shop.pelican.test/search`, then `submit` followed by the flag."
p2.def.intro: "The shop logs every search and what the database did with it. Your attempts are in there, among the morning's customers. One of them is looking for a \"veste d'été\", apostrophe included."
p2.def.lesson: "An injection leaves traces: database errors where there never are any, answers bigger than usual. Watching for them lets you see it. A parameterized query makes it impossible: the visitor's text travels apart and can no longer become code, whatever it holds."
p2.def.find.rows: "The search that brought out the unpublished item"
p2.def.rule.error.title: "Alert when a search makes the database fail or returns unpublished items"
p2.def.rule.error.why: "This is the right one: it looks at what the database did, not at what the visitor typed. An ordinary customer never causes that, even with an apostrophe in \"veste d'été\"."
p2.def.rule.every.title: "Alert on every search of the shop"
p2.def.rule.every.why: "Hundreds of customers search every hour. Your three lines are in there, and nobody will find them."
p2.def.rule.burst.title: "Alert when one address runs 6 searches or more in 10 minutes"
p2.def.rule.burst.why: "It rings for a customer hesitating between ten jackets, and it misses you: a few attempts were enough."
p2.def.fix.param.title: "Parameterized query: send the visitor's text to the database apart from the query"
p2.def.fix.param.why: "This is the right one. The query leaves without the text, the text leaves as data: the database never reads it as code. Your quote is a character to look for again, and the search simply finds nothing."
p2.def.fix.hide.title: "Switch off debug mode so database errors are no longer displayed"
p2.def.fix.hide.why: "Worth doing anyway, but it repairs nothing: the query can still be changed. You only switched off the light, and your last command still works."
p2.def.fix.length.title: "Limit the search to 30 characters"
p2.def.fix.length.why: "Your input was under twenty. A length limit gets in the way, it does not prevent: the defect is in how the query is built."
p2.debrief.title: "Data read as code"
p2.debrief.lesson: "The form pasted your text into a query. One quote was enough to leave the role of \"text to look for\" and write a piece of the query in place of the program. This is injection, number 3 in the OWASP ranking, and its remedy has been known for as long as the flaw."
p2.debrief.p1: "Never build a query by pasting in text from outside. Parameterized queries separate the code, written by the developer, from the data, written by anyone."
p2.debrief.p2: "A filter that strips quotes or certain words can be bypassed, and breaks honest searches (\"veste d'été\"). You do not clean data: you keep it from becoming code."
p2.debrief.p3: "Detailed error messages and debug pages are switched off in production. They do not create the flaw, but they hand over its map."
p2.debrief.p4: "The account the application uses to talk to the database should only read what it needs: a forgotten flaw then does much less damage."
