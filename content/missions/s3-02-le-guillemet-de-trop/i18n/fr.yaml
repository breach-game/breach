p2.briefing: "Hier tu as regardé. Aujourd'hui tu parles à la boutique, par son formulaire de recherche. Un formulaire prend le texte d'un inconnu et le donne à un programme : tout dépend de ce que le programme en fait. Tu vas voir la faille la plus ancienne du web, celle qui figure dans tous les classements depuis vingt ans, et pourquoi elle existe encore."
p2.obj.search: "Faire une recherche normale"
p2.obj.error: "Faire échouer la recherche avec un seul caractère"
p2.obj.query: "Lire la requête que la boutique envoie à sa base"
p2.obj.proof: "Faire sortir un article non publié, et envoyer son flag"
p2.obj.why: "Dire pourquoi cela a marché"
p2.q.why: "Tu n'as volé aucun mot de passe et forcé aucune porte. Qu'est-ce qui a rendu cela possible ?"
p2.q.why.password: "La base de données n'avait pas de mot de passe, donc tout visiteur pouvait l'interroger"
p2.q.why.password.why: "Tu n'as jamais parlé à la base : seul le programme de la boutique lui parle, avec ses propres identifiants. C'est lui qui a transmis tes mots, et c'est là qu'est le défaut."
p2.q.why.code: "Le programme colle le texte du visiteur dans sa requête, et la base l'a lu comme du code"
p2.q.why.debug: "Le mode de débogage était allumé : sans lui, la requête n'aurait pas pu être modifiée"
p2.q.why.debug.why: "Le débogage t'a montré la requête, ce qui t'a fait gagner du temps. Mais éteins-le et la recherche reste fragile : un attaquant patient avance à l'aveugle."
p2.ada.brief: "La recherche est sur `https://shop.pelican.test/search`. Ouvre-la dans le navigateur avec `open`, ou parle-lui avec `curl -d`. Commence par une recherche ordinaire, pour voir une réponse normale."
p2.ada.g.search: "Cherche un vêtement : `curl -d \"q=veste\" https://shop.pelican.test/search`. Le formulaire de la page fait exactement la même chose."
p2.ada.g.search.standard: "Fais une recherche ordinaire, pour voir ce qu'une réponse normale contient."
p2.ada.g.error: "Maintenant ajoute une apostrophe droite à la fin du mot : `curl -d \"q=veste'\" https://shop.pelican.test/search`."
p2.ada.g.error.standard: "Dans beaucoup de langages, un caractère sert à ouvrir et fermer un texte. Ajoute-le à ta recherche."
p2.ada.g.query: "Hier, `robots.txt` écartait un dossier `/debug/`. Lis ce qu'il garde : `curl https://shop.pelican.test/debug/last-query`."
p2.ada.g.query.standard: "Hier, `robots.txt` écartait un dossier de débogage. Va voir ce qu'il contient sur la recherche."
p2.ada.g.proof: "Ton guillemet ferme le texte. Ce qui suit est lu comme une condition. Donne-en une toujours vraie : `curl -d \"q=veste' OR '1'='1\" https://shop.pelican.test/search`."
p2.ada.g.proof.standard: "Après ton guillemet, la base lit des conditions. Ajoute-en une qui est toujours vraie, reliée par OR."
p2.ada.g.submit: "Envoie le flag de l'article qui n'aurait jamais dû sortir : `submit` suivi du flag."
p2.ada.g.submit.standard: "Envoie le flag de l'article qui n'aurait jamais dû sortir."
p2.ada.search: "Deux résultats, rien d'anormal. Retiens la forme d'une réponse saine : c'est en la comparant aux autres que tu verras quelque chose casser."
p2.ada.error: "Une erreur 500, et le serveur te montre sa requête. Regarde où ton texte atterrit : entre deux guillemets. Le tien a fermé la chaîne trop tôt, et la base n'a plus compris la fin de la phrase. Tu viens de modifier une requête sans y avoir accès."
p2.ada.query: "`name LIKE '%veste%'`, et juste avant, `published = 1`. Ton texte est collé tel quel au milieu d'une phrase que la base va exécuter. La condition `published = 1` est tout ce qui te sépare des articles non publiés."
p2.ada.rows: "Quatre résultats au lieu de deux. La base a lu ta fin de phrase comme une condition, toujours vraie, et `published = 1` n'a plus compté."
p2.ada.flag: "Sur une vraie boutique, la même faiblesse donnerait la table des clients. Ici on s'arrête à la preuve : un article non publié suffit pour le rapport."
p2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p2.ada.answer.standard: "Réponds à ma question."
p2.ada.why: "Oui. Des données et du code dans la même phrase : le programme ne sait plus qui a écrit quoi. C'est exactement ce que tu as vu avec Nova en saison 1, vingt ans plus tôt et dans un autre langage."
p2.ada.done: "Le rapport dira « injection ». Reste le plus utile : passe de l'autre côté. Ouvre le débrief, retrouve tes lignes dans les journaux de Pélican, et choisis la correction."
p2.soc.error: "Search form: the database refused a query built from a visitor's text"
p2.soc.rows: "Search form: unpublished rows returned to a visitor"
p2.hint.search.1: "Tape `curl -d \"q=veste\" https://shop.pelican.test/search`."
p2.hint.error.1: "Le caractère est l'apostrophe droite, celle qui entoure les textes dans une requête."
p2.hint.error.2: "Tape `curl -d \"q=veste'\" https://shop.pelican.test/search`."
p2.hint.query.1: "Tape `curl https://shop.pelican.test/debug/last-query`."
p2.hint.proof.1: "Ton guillemet ferme le texte cherché. La suite de ta saisie devient un morceau de la requête."
p2.hint.proof.2: "Une condition toujours vraie, reliée par OR, annule celles qui la précèdent."
p2.hint.proof.3: "Tape `curl -d \"q=veste' OR '1'='1\" https://shop.pelican.test/search`, puis `submit` suivi du flag."
p2.def.intro: "La boutique journalise chaque recherche et ce que la base en a fait. Tes essais y sont, au milieu des clients du matin. L'un d'eux cherche une « veste d'été », apostrophe comprise."
p2.def.lesson: "Une injection laisse des traces : des erreurs de base là où il n'y en a jamais, des réponses plus grosses que d'habitude. Les surveiller permet de la voir. La requête paramétrée, elle, la rend impossible : le texte du visiteur voyage à part et ne peut plus devenir du code, quoi qu'il contienne."
p2.def.find.rows: "La recherche qui a fait sortir l'article non publié"
p2.def.rule.error.title: "Alerter quand une recherche fait échouer la base ou renvoie des articles non publiés"
p2.def.rule.error.why: "C'est la bonne : elle regarde ce que la base a fait, pas ce que le visiteur a tapé. Un client ordinaire ne provoque jamais cela, même avec une apostrophe dans « veste d'été »."
p2.def.rule.every.title: "Alerter sur chaque recherche de la boutique"
p2.def.rule.every.why: "Des centaines de clients cherchent chaque heure. Tes trois lignes sont dedans, et personne ne les y trouvera."
p2.def.rule.burst.title: "Alerter quand une adresse fait 6 recherches ou plus en 10 minutes"
p2.def.rule.burst.why: "Elle sonne sur un client qui hésite entre dix vestes, et elle te rate : il t'a suffi de quelques essais."
p2.def.fix.param.title: "Requête paramétrée : envoyer le texte du visiteur à la base à part de la requête"
p2.def.fix.param.why: "C'est la bonne. La requête part sans le texte, le texte part comme une donnée : la base ne le lit jamais comme du code. Ton guillemet redevient un caractère à chercher, et la recherche ne trouve simplement rien."
p2.def.fix.hide.title: "Éteindre le mode de débogage pour ne plus afficher les erreurs de la base"
p2.def.fix.hide.why: "À faire de toute façon, mais cela ne répare rien : la requête se laisse toujours modifier. Tu as seulement éteint la lumière, et ta dernière commande marche encore."
p2.def.fix.length.title: "Limiter la recherche à 30 caractères"
p2.def.fix.length.why: "Ta saisie en faisait moins de vingt. Une limite de longueur gêne, elle n'empêche pas : le défaut est dans la façon de construire la requête."
p2.debrief.title: "Des données lues comme du code"
p2.debrief.lesson: "Le formulaire collait ton texte dans une requête. Un guillemet a suffi pour sortir du rôle de « texte à chercher » et écrire un bout de la requête à la place du programme. C'est l'injection, numéro 3 du classement OWASP, et sa parade est connue depuis aussi longtemps qu'elle."
p2.debrief.p1: "Ne jamais construire une requête en collant du texte venu de l'extérieur. Les requêtes paramétrées séparent le code, écrit par le développeur, des données, écrites par n'importe qui."
p2.debrief.p2: "Un filtre qui retire les guillemets ou certains mots se contourne, et casse les recherches honnêtes (« veste d'été »). On ne nettoie pas les données : on les empêche de devenir du code."
p2.debrief.p3: "Les messages d'erreur détaillés et les pages de débogage s'éteignent en production. Ils ne créent pas la faille, mais ils en donnent le plan."
p2.debrief.p4: "Le compte que l'application utilise pour parler à la base ne devrait lire que ce dont elle a besoin : une faille oubliée fait alors beaucoup moins de dégâts."
