p5.briefing: "Last day at Pélican, and the hardest, because there is nothing technical to find. No quote, no tag, no cookie to guess. The cart does exactly what its code tells it to do. The question is: what happens when a customer gives it a value nobody thought of? I will let you look. There is more than one path."
p5.obj.cart: "Look at the cart of the test account"
p5.obj.proof: "Make the cart charge less than it should, and submit the flag"
p5.obj.review: "Review `dossier/cart.txt` and name the two faulty lines"
p5.obj.where: "Say where the check must happen"
p5.q.where: "You found the two lines. Where must Pélican put the missing checks?"
p5.q.where.page: "In the form on the page, with a field that refuses numbers below zero"
p5.q.where.page.why: "Useful to guide an honest customer, with no effect on the others: `curl` does not read the form, it talks straight to the server. You did it all week."
p5.q.where.server: "In the server's code, which refuses any value outside the rules of the shop"
p5.q.where.waf: "In a web application firewall, with a rule that blocks suspicious requests"
p5.q.where.waf.why: "A firewall looks for known shapes of attack. There is none here: `-3` and a valid promo code are perfectly normal requests. Only the shop knows its own rules."
p5.ada.brief: "The cart of the test account is at `https://shop.pelican.test/cart`. It holds one Héron jacket at 120 euros. Your goal: a wrong total, in your favour. First look at what the cart lets you do."
p5.ada.g.cart: "Open the cart: `open https://shop.pelican.test/cart`, or `curl https://shop.pelican.test/cart`. Two forms start from it: the promo code and the quantity."
p5.ada.g.cart.standard: "Go and see the cart and what it lets you change."
p5.ada.g.proof: "Two leads. The promo code: `curl -d \"code=BIENVENUE10\" https://shop.pelican.test/cart/promo`, and ask yourself what happens if you send it again. The quantity: `curl -d \"qty=2\" https://shop.pelican.test/cart/quantity`, and ask yourself which values it accepts."
p5.ada.g.proof.standard: "The cart has two forms. For each, look for a value the shop should never have accepted."
p5.ada.g.review: "Pélican handed you the cart's code. Read it with its line numbers: `review dossier/cart.txt`. Then name each faulty line: `review dossier/cart.txt <number>`. There are two, one per path."
p5.ada.g.review.standard: "Review `dossier/cart.txt` with `review` and name the lines that accept without checking."
p5.ada.cart: "One item, one total, and two things you can change: the promo code and the quantity. The code `BIENVENUE10` is advertised on the home page."
p5.ada.once: "Ten percent off, as promised. The page says \"one code per order\". Does the server know? Send the same code again."
p5.ada.once.standard: "As promised. The page states a rule. Check that the server enforces it."
p5.ada.qty: "Quantity updated. The form expects a number. Not every number is a quantity."
p5.ada.qty.standard: "The server accepts numbers. Which ones, exactly?"
p5.ada.shown: "There it is. Submit the flag with `submit`."
p5.ada.shown.standard: "There it is. Submit the flag."
p5.ada.flag: "The total is wrong, and you used no technique at all. Know that there were two paths: applying the same code twice, or ordering a quantity below zero. Try the other one if you are curious. Now, the most useful part for Pélican: finding the lines."
p5.ada.review: "Both. Line 5, the quantity is stored without checking that it is at least 1. Line 14, the discount is added without checking that it is not already there. The code does what was written: what is missing is what was never written."
p5.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p5.ada.answer.standard: "Answer my question."
p5.ada.where: "Yes. The browser belongs to the customer, so anything checked there is a courtesy. The rules of the shop live on the server, or they do not exist."
p5.ada.done: "Five days, five families of flaws, and each time the same lesson in other words: never believe what comes from outside. Pélican can open its sales. Open the debrief. Fine work, Kestrel."
p5.soc.negative: "Cart: a quantity below zero was accepted and a credit note issued"
p5.hint.cart.1: "Type `curl https://shop.pelican.test/cart`."
p5.hint.proof.1: "First path: the page says \"one code per order\". Second path: a quantity is a number, but not every number will do."
p5.hint.proof.2: "Send `curl -d \"code=BIENVENUE10\" https://shop.pelican.test/cart/promo` twice. Or try a quantity below zero."
p5.hint.proof.3: "Type `curl -d \"qty=-3\" https://shop.pelican.test/cart/quantity`, then `submit` followed by the flag."
p5.hint.review.1: "In each function, look for the line that stores what the customer sends. What is checked just before?"
p5.hint.review.2: "In `update_quantity`, the quantity is turned into a number then stored. In `apply_promo`, the code is looked up, its date checked, then it is added."
p5.hint.review.3: "Type `review dossier/cart.txt 5`, then `review dossier/cart.txt 14`."
p5.debrief.title: "What the code did not foresee"
p5.debrief.lesson: "No tool finds this flaw, because nothing is broken: the cart did exactly what its code said. Two sentences were missing that nobody had written, \"a quantity is at least 1\" and \"a code is used only once\". These are business logic flaws, and you find them by reading the code with the rules of the shop in mind."
p5.debrief.p1: "Write down the business rules, then check them in the server's code: bounds of a quantity, single use of a code, a total that is never negative."
p5.debrief.p2: "Whatever the browser checks is comfort. The server checks everything again, as if there were no page."
p5.debrief.p3: "Test the absurd cases: zero, negative, huge, twice in a row, out of order. An attacker starts there."
p5.debrief.p4: "Code review by a colleague remains the best detection: a scanner looks for known shapes, a person asks \"what if?\"."
