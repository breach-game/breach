p5.briefing: "Dernier jour chez Pélican, et le plus difficile, parce qu'il n'y a rien de technique à trouver. Pas de guillemet, pas de balise, pas de cookie à deviner. Le panier fait exactement ce que son code lui dit de faire. La question est : que se passe-t-il quand un client lui donne une valeur à laquelle personne n'a pensé ? Je te laisse chercher. Il y a plus d'un chemin."
p5.obj.cart: "Regarder le panier du compte de test"
p5.obj.proof: "Faire payer au panier moins que ce qu'il doit, et envoyer le flag"
p5.obj.review: "Relire `dossier/cart.txt` et désigner les deux lignes fautives"
p5.obj.where: "Dire où la vérification doit se faire"
p5.q.where: "Tu as trouvé les deux lignes. Où Pélican doit-il placer les vérifications qui manquent ?"
p5.q.where.page: "Dans le formulaire de la page, avec un champ qui refuse les nombres négatifs"
p5.q.where.page.why: "Utile pour guider un client honnête, sans effet sur les autres : `curl` ne lit pas le formulaire, il parle directement au serveur. Tu l'as fait toute la semaine."
p5.q.where.server: "Dans le code du serveur, qui refuse toute valeur hors des règles de la boutique"
p5.q.where.waf: "Dans un pare-feu applicatif, avec une règle qui bloque les requêtes suspectes"
p5.q.where.waf.why: "Un pare-feu cherche des formes d'attaque connues. Ici il n'y en a pas : `-3` et un code promo valide sont des requêtes parfaitement normales. Seule la boutique connaît ses propres règles."
p5.ada.brief: "Le panier du compte de test est sur `https://shop.pelican.test/cart`. Il contient une Veste Héron à 120 euros. Ton but : que le total soit faux, en ta faveur. Regarde d'abord ce que le panier te laisse faire."
p5.ada.g.cart: "Ouvre le panier : `open https://shop.pelican.test/cart`, ou `curl https://shop.pelican.test/cart`. Deux formulaires en partent : le code promo et la quantité."
p5.ada.g.cart.standard: "Va voir le panier et ce qu'il te laisse modifier."
p5.ada.g.proof: "Deux pistes. Le code promo : `curl -d \"code=BIENVENUE10\" https://shop.pelican.test/cart/promo`, et demande-toi ce qui se passe si tu le renvoies. La quantité : `curl -d \"qty=2\" https://shop.pelican.test/cart/quantity`, et demande-toi quelles valeurs elle accepte."
p5.ada.g.proof.standard: "Le panier a deux formulaires. Pour chacun, cherche une valeur que la boutique n'aurait jamais dû accepter."
p5.ada.g.review: "Pélican t'a remis le code du panier. Lis-le avec ses numéros de ligne : `review dossier/cart.txt`. Puis désigne chaque ligne fautive : `review dossier/cart.txt <numéro>`. Il y en a deux, une par chemin."
p5.ada.g.review.standard: "Relis `dossier/cart.txt` avec `review` et désigne les lignes qui acceptent sans vérifier."
p5.ada.cart: "Un article, un total, et deux choses que tu peux changer : le code promo et la quantité. Le code `BIENVENUE10` est annoncé sur la page d'accueil."
p5.ada.once: "Moins 10 %, comme promis. La page dit « un code par commande ». Est-ce que le serveur le sait ? Renvoie le même code."
p5.ada.once.standard: "Comme promis. La page annonce une règle. Vérifie que le serveur l'applique."
p5.ada.qty: "Quantité mise à jour. Le formulaire attend un nombre. Tous les nombres ne sont pas des quantités."
p5.ada.qty.standard: "Le serveur accepte les nombres. Lesquels, au juste ?"
p5.ada.shown: "Le voilà. Envoie le flag avec `submit`."
p5.ada.shown.standard: "Le voilà. Envoie le flag."
p5.ada.flag: "Le total est faux, et tu n'as utilisé aucune technique. Sache qu'il y avait deux chemins : appliquer deux fois le même code, ou commander une quantité négative. Essaie l'autre si tu es curieux. Maintenant, le plus utile pour Pélican : trouver les lignes."
p5.ada.review: "Les deux. Ligne 5, la quantité est rangée sans qu'on vérifie qu'elle vaut au moins 1. Ligne 14, la remise est ajoutée sans qu'on vérifie qu'elle n'y est pas déjà. Le code fait ce qu'on lui a écrit : c'est ce qu'on ne lui a pas écrit qui manque."
p5.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p5.ada.answer.standard: "Réponds à ma question."
p5.ada.where: "Oui. Le navigateur appartient au client, donc tout ce qui s'y vérifie est une politesse. Les règles de la boutique vivent sur le serveur, ou elles n'existent pas."
p5.ada.done: "Cinq jours, cinq familles de failles, et à chaque fois la même leçon dite autrement : ne jamais croire ce qui vient de l'extérieur. Pélican peut ouvrir ses soldes. Ouvre le débrief. Beau travail, Kestrel."
p5.soc.negative: "Cart: a quantity below zero was accepted and a credit note issued"
p5.hint.cart.1: "Tape `curl https://shop.pelican.test/cart`."
p5.hint.proof.1: "Premier chemin : la page dit « un code par commande ». Second chemin : une quantité est un nombre, mais tous les nombres ne conviennent pas."
p5.hint.proof.2: "Envoie deux fois `curl -d \"code=BIENVENUE10\" https://shop.pelican.test/cart/promo`. Ou essaie une quantité négative."
p5.hint.proof.3: "Tape `curl -d \"qty=-3\" https://shop.pelican.test/cart/quantity`, puis `submit` suivi du flag."
p5.hint.review.1: "Cherche, dans chaque fonction, la ligne qui enregistre ce que le client envoie. Qu'est-ce qui est vérifié juste avant ?"
p5.hint.review.2: "Dans `update_quantity`, la quantité est convertie en nombre puis rangée. Dans `apply_promo`, le code est cherché, sa date vérifiée, puis il est ajouté."
p5.hint.review.3: "Tape `review dossier/cart.txt 5`, puis `review dossier/cart.txt 14`."
p5.debrief.title: "Ce que le code n'a pas prévu"
p5.debrief.lesson: "Aucun outil ne trouve cette faille, parce que rien n'est cassé : le panier a fait exactement ce que son code disait. Il manquait deux phrases que personne n'avait écrites, « une quantité vaut au moins 1 » et « un code ne sert qu'une fois ». Ce sont des failles de logique métier, et elles se trouvent en lisant le code avec les règles de la boutique en tête."
p5.debrief.p1: "Écrire les règles du métier, puis les vérifier dans le code du serveur : bornes d'une quantité, usage unique d'un code, total jamais négatif."
p5.debrief.p2: "Tout ce que le navigateur vérifie est du confort. Le serveur revérifie tout, comme s'il n'y avait pas de page."
p5.debrief.p3: "Tester les cas absurdes : zéro, négatif, énorme, deux fois de suite, dans le désordre. Un attaquant commence par là."
p5.debrief.p4: "La relecture de code par un collègue reste la meilleure détection : un scanner cherche des formes connues, une personne demande « et si ? »."
