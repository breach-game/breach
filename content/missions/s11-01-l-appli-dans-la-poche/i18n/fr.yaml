c1.briefing: "Septembre 2029. Comptoir est une néobanque : pas d'agence, une appli, et derrière l'appli une API que des partenaires utilisent aussi. Inès Carrel, sa responsable sécurité, a signé le mandat CP-2029-09 avec une phrase en plus : « On a grandi vite. Je ne suis pas sûre de savoir tout ce qu'on expose. » Le mandat et tes comptes de test sont dans `mandate/`."
c1.obj.page: "Lire ce que Comptoir dit de son API"
c1.obj.pkg: "Ouvrir le paquet de l'appli"
c1.obj.old: "Trouver ce que l'appli connaît et que le site ne dit pas"
c1.obj.proof: "Prouver que la version retirée répond encore"
c1.obj.class: "Nommer le problème"
c1.q.class: "Comment s'appelle ce que tu viens de trouver ?"
c1.q.class.inventory: "Un inventaire incomplet : une version oubliée répond encore."
c1.q.class.crypto: "Un chiffrement trop faible entre l'appli et l'API."
c1.q.class.crypto.why: "Tout passe en HTTPS, et tu n'as rien déchiffré. Tu as lu une adresse écrite en clair dans l'appli, puis tu l'as appelée."
c1.q.class.leak: "Une fuite de données personnelles des clients."
c1.q.class.leak.why: "Pas encore : `/v1/health` ne montre aucun client. Ce que tu as trouvé, c'est une porte que personne ne surveille. On verra demain ce qu'il y a derrière."
c1.ada.brief: "On commence comme toujours : par ce que la cible dit d'elle-même. Elle a une page pour les développeurs."
c1.ada.g.page: "Lis la page des développeurs : `curl https://www.comptoir.test/developpeurs`."
c1.ada.page: "Trois services, et une phrase qui m'intéresse : « La version 1 de l'API a été retirée le 30 juin 2027. » Une phrase sur un site est une intention. Ce qui dit la vérité, c'est ce que l'appli appelle vraiment, et l'appli est en téléchargement libre."
c1.ada.g.pkg: "Télécharge le paquet : `curl -s https://www.comptoir.test/comptoir-3.2.0.apk > comptoir.apk`, puis liste son contenu : `unzip -l comptoir.apk`."
c1.ada.g.pkg.standard: "Télécharge le paquet Android proposé sur la page `/appli` et regarde ce qu'il contient."
c1.ada.g.list: "Le paquet est sur ton poste. Liste son contenu : `unzip -l comptoir.apk`."
c1.ada.pkg: "Un paquet d'appli est une archive zip : un manifeste, des fichiers de réglages, et `classes.dex`, le code compilé. On ne lit pas du code compilé, mais les textes qu'il contient s'y trouvent en clair : les adresses, par exemple."
c1.ada.g.old: "Sors les fichiers : `unzip -d appli comptoir.apk`, puis lis les textes du code : `strings appli/classes.dex`. Appelle ensuite l'adresse que le site ne mentionne plus : `curl https://api.comptoir.test/v1/`."
c1.ada.g.old.standard: "Extrais le paquet et cherche avec `strings` les adresses que le code connaît. L'une d'elles ne devrait plus exister."
c1.ada.strings: "Deux adresses d'API : `/v2/`, et `/v1/` avec une classe `LegacyClient` et un mot du développeur : « à retirer quand l'appli 1.x aura disparu ». Tout ce qui est livré dans une appli est public, mots d'excuse compris. Voyons si `/v1/` répond."
c1.ada.old: "« deprecated », date de fin 2027, et pourtant un code 200. Retirée sur le site, vivante sur le serveur."
c1.ada.old.next: "Les chemins que l'appli connaît sont dans les textes du code : essaie `/v1/health`."
c1.ada.old.direct: "La version 1, celle que le site dit retirée, répond encore. Le site n'en parle plus, l'appli connaît encore ses chemins, et le serveur les sert."
c1.ada.g.proof: "Demande son état à la vieille version : `curl https://api.comptoir.test/v1/health`."
c1.ada.g.proof.standard: "L'appli connaît un chemin `/health`. Appelle-le sur la v1."
c1.ada.g.submit: "Le témoin est dans la réponse. Valide-le : `submit FLAG{...}`."
c1.ada.flag: "Construite en novembre 2026, dernière revue de sécurité en octobre 2026. Trois ans que plus personne ne la regarde, parce que tout le monde la croit éteinte. Les correctifs de la v2 n'y sont jamais arrivés."
c1.ada.g.class: "Réponds à ma question : les boutons sont dans la messagerie, ou `answer` suivi de ton choix."
c1.ada.class: "Oui. On ne protège que ce qu'on sait avoir, et Comptoir ne savait plus qu'elle avait ça. Inès avait raison de douter."
c1.ada.done: "J'ai prévenu Inès. Sa réponse : « Quelques milliers de téléphones jamais mis à jour l'utilisent encore, on n'a pas osé couper. » Je comprends. Demain on regarde ce que cette vieille version accepte de faire, avec tes deux comptes de test."
c1.soc.health: "api: a retired version was asked for its health from an unusual address"
c1.hint.page.1: "Tape `curl https://www.comptoir.test/developpeurs`."
c1.hint.pkg.1: "Le paquet se télécharge avec `curl -s https://www.comptoir.test/comptoir-3.2.0.apk > comptoir.apk`."
c1.hint.pkg.2: "Puis `unzip -l comptoir.apk`."
c1.hint.old.1: "`unzip -d appli comptoir.apk` extrait le paquet, `strings appli/classes.dex` montre les textes du code."
c1.hint.old.2: "Le code connaît `https://api.comptoir.test/v1/`, que le site dit retirée."
c1.hint.old.3: "Tape `curl https://api.comptoir.test/v1/`."
c1.hint.proof.1: "Tape `curl https://api.comptoir.test/v1/health`."
c1.hint.proof.2: "Recopie le témoin : `submit FLAG{comptoir-v1-encore-debout-3e71}`."
c1.hint.class.1: "Rien n'a été cassé ni déchiffré : une version oubliée répondait encore. Tape `answer inventory`."
c1.def.intro: "La passerelle de l'API journalise chaque appel. Le tien y est, au milieu de ceux des vieux téléphones qui parlent encore à la v1."
c1.def.lesson: "Une version retirée sur le papier et vivante sur le serveur ne reçoit plus ni correctif ni regard. La parade a deux moitiés : savoir ce qu'on expose (un inventaire tenu par la passerelle, pas par la mémoire de l'équipe), et éteindre pour de bon, avec une date tenue."
c1.def.find.health: "Ton appel à l'état de la v1"
c1.def.rule.health.title: "Alerter sur tout appel à `/v1/health`"
c1.def.rule.health.why: "C'est la bonne. Aucune appli n'appelle ce chemin : il servait aux équipes. Quelqu'un qui le demande aujourd'hui fait un inventaire, comme toi."
c1.def.rule.all.title: "Alerter sur tout appel à la v1"
c1.def.rule.all.why: "Les vieux téléphones l'appellent toute la journée. Une règle qui sonne des milliers de fois par jour, plus personne ne la lit au bout d'une semaine."
c1.def.rule.gone.title: "Alerter sur les réponses « 410 Gone » de la v1"
c1.def.rule.gone.why: "La v1 ne répond pas 410 : elle répond 200, c'est bien le problème. Cette règle ne sonnera que le jour où elle sera enfin éteinte."
c1.def.fix.retire.title: "Éteindre la v1, après avoir forcé la mise à jour des applis 1.x"
c1.def.fix.retire.why: "C'est la bonne. Les derniers téléphones reçoivent un écran « mettez à jour », et la v1 répond 410 à tout le monde. Ce qui n'existe plus n'a plus besoin d'être surveillé."
c1.def.fix.hide.title: "Retirer du site toute mention de la v1"
c1.def.fix.hide.why: "Le site n'en parle déjà presque plus, et ce n'est pas lui qui t'a renseigné : c'est l'appli. Cacher une adresse ne l'éteint pas."
c1.def.fix.rate.title: "Limiter le nombre d'appels par minute sur la v1"
c1.def.fix.rate.why: "Tu as fait trois appels. Une limite gêne celui qui en fait des milliers, pas celui qui regarde."
c1.debrief.title: "On ne protège que ce qu'on sait avoir"
c1.debrief.lesson: "Le site disait la v1 retirée, l'appli en gardait l'adresse, et le serveur y répondait toujours. Tu n'as rien forcé : tu as ouvert un paquet public et lu ce qui y était écrit."
c1.debrief.p1: "Tout ce qui est livré dans une appli mobile est public : adresses, chemins, clés. On n'y met rien qu'on ne publierait pas."
c1.debrief.p2: "L'inventaire des versions et des routes se tient à la passerelle, à partir de ce qui répond vraiment, pas d'un document."
c1.debrief.p3: "Une version retirée a une date de fin tenue : mise à jour forcée des clients, puis extinction."
c1.debrief.p4: "Un chemin que plus aucun client légitime n'appelle est un excellent fil d'alarme."
