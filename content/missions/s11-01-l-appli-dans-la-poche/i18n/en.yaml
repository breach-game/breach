c1.briefing: "September 2029. Comptoir is a neobank: no branch, an app, and behind the app an API that partners use too. Inès Carrel, its head of security, signed mandate CP-2029-09 with one extra sentence: \"We grew fast. I am not sure I know everything we expose.\" The mandate and your test accounts are in `mandate/`."
c1.obj.page: "Read what Comptoir says about its API"
c1.obj.pkg: "Open the app package"
c1.obj.old: "Find what the app knows and the website does not say"
c1.obj.proof: "Prove that the retired version still answers"
c1.obj.class: "Name the problem"
c1.q.class: "What is the name of what you just found?"
c1.q.class.inventory: "An incomplete inventory: a forgotten version still answers."
c1.q.class.crypto: "Encryption that is too weak on the exchanges between the app and the API."
c1.q.class.crypto.why: "Everything goes over HTTPS, and you decrypted nothing. You read an address written in clear in the app, then you called it."
c1.q.class.leak: "A leak of customers' personal data."
c1.q.class.leak.why: "Not yet: `/v1/health` shows no customer. What you found is a door nobody watches. Tomorrow we see what is behind it."
c1.ada.brief: "We start as always: with what the target says about itself. It has a page for developers."
c1.ada.g.page: "Read the developers page: `curl https://www.comptoir.test/developpeurs`."
c1.ada.page: "Three services, and one sentence I like: \"Version 1 of the API was retired on 30 June 2027.\" A sentence on a website is an intention. What tells the truth is what the app really calls, and the app is a free download."
c1.ada.g.pkg: "Download the package: `curl -s https://www.comptoir.test/comptoir-3.2.0.apk > comptoir.apk`, then list its content: `unzip -l comptoir.apk`."
c1.ada.g.pkg.standard: "Download the Android package offered on the `/appli` page and look at what it contains."
c1.ada.g.list: "The package is on your machine. List its content: `unzip -l comptoir.apk`."
c1.ada.pkg: "An app package is a zip archive: a manifest, settings files, and `classes.dex`, the compiled code. Nobody reads compiled code, but the texts it holds sit there in clear: addresses, for instance."
c1.ada.g.old: "Extract the files: `unzip -d appli comptoir.apk`, then read the texts of the code: `strings appli/classes.dex`. Then call the address the website no longer mentions: `curl https://api.comptoir.test/v1/`."
c1.ada.g.old.standard: "Extract the package and use `strings` to find the addresses the code knows. One of them should no longer exist."
c1.ada.strings: "Two API addresses: `/v2/`, and `/v1/` with a class `LegacyClient` and a note from the developer: \"remove once app 1.x is gone\". Everything shipped in an app is public, apologies included. Let's see whether `/v1/` answers."
c1.ada.old: "\"deprecated\", sunset in 2027, and still a 200. Retired on the website, alive on the server."
c1.ada.old.next: "The paths the app knows are in the texts of the code: try `/v1/health`."
c1.ada.old.direct: "Version 1, the one the website calls retired, still answers. The website no longer mentions it, the app still knows its paths, and the server serves them."
c1.ada.g.proof: "Ask the old version how it is: `curl https://api.comptoir.test/v1/health`."
c1.ada.g.proof.standard: "The app knows a `/health` path. Call it on v1."
c1.ada.g.submit: "The canary is in the answer. Submit it: `submit FLAG{...}`."
c1.ada.flag: "Built in November 2026, last security review in October 2026. Three years with nobody looking at it, because everyone believes it is off. The fixes made to v2 never reached it."
c1.ada.g.class: "Answer my question: the buttons are in the messaging window, or `answer` followed by your choice."
c1.ada.class: "Yes. You can only protect what you know you have, and Comptoir no longer knew it had this. Inès was right to doubt."
c1.ada.done: "I told Inès. Her answer: \"A few thousand phones that were never updated still use it, we did not dare to cut.\" I understand. Tomorrow we look at what this old version agrees to do, with your two test accounts."
c1.soc.health: "api: a retired version was asked for its health from an unusual address"
c1.hint.page.1: "Type `curl https://www.comptoir.test/developpeurs`."
c1.hint.pkg.1: "Download the package with `curl -s https://www.comptoir.test/comptoir-3.2.0.apk > comptoir.apk`."
c1.hint.pkg.2: "Then `unzip -l comptoir.apk`."
c1.hint.old.1: "`unzip -d appli comptoir.apk` extracts the package, `strings appli/classes.dex` shows the texts of the code."
c1.hint.old.2: "The code knows `https://api.comptoir.test/v1/`, which the website says is retired."
c1.hint.old.3: "Type `curl https://api.comptoir.test/v1/`."
c1.hint.proof.1: "Type `curl https://api.comptoir.test/v1/health`."
c1.hint.proof.2: "Copy the canary: `submit FLAG{comptoir-v1-encore-debout-3e71}`."
c1.hint.class.1: "Nothing was broken or decrypted: a forgotten version still answered. Type `answer inventory`."
c1.def.intro: "The API gateway logs every call. Yours is in there, among those of the old phones that still talk to v1."
c1.def.lesson: "A version retired on paper and alive on the server gets no more fixes and no more attention. The defence has two halves: knowing what you expose (an inventory kept by the gateway, not by the team's memory), and switching off for good, on a date that is kept."
c1.def.find.health: "Your call to the health of v1"
c1.def.rule.health.title: "Alert on any call to `/v1/health`"
c1.def.rule.health.why: "This is the one. No app calls that path: it was for the teams. Whoever asks for it today is taking stock, like you."
c1.def.rule.all.title: "Alert on any call to v1"
c1.def.rule.all.why: "The old phones call it all day long. A rule that rings thousands of times a day is a rule nobody reads after a week."
c1.def.rule.gone.title: "Alert on \"410 Gone\" answers from v1"
c1.def.rule.gone.why: "v1 does not answer 410: it answers 200, which is the whole problem. This rule will only ring the day it is finally switched off."
c1.def.fix.retire.title: "Switch v1 off, after forcing the 1.x apps to update"
c1.def.fix.retire.why: "This is the one. The last phones get an \"update now\" screen, and v1 answers 410 to everyone. What no longer exists no longer needs watching."
c1.def.fix.hide.title: "Remove every mention of v1 from the website"
c1.def.fix.hide.why: "The website hardly mentions it already, and it is not what told you: the app did. Hiding an address does not switch it off."
c1.def.fix.rate.title: "Limit the number of calls per minute on v1"
c1.def.fix.rate.why: "You made three calls. A limit bothers whoever makes thousands, not whoever is looking."
c1.debrief.title: "You can only protect what you know you have"
c1.debrief.lesson: "The website said v1 was retired, the app kept its address, and the server still answered. You forced nothing: you opened a public package and read what was written in it."
c1.debrief.p1: "Everything shipped in a mobile app is public: addresses, paths, keys. Put nothing in it you would not publish."
c1.debrief.p2: "The inventory of versions and routes is kept at the gateway, from what really answers, not from a document."
c1.debrief.p3: "A retired version has an end date that is kept: forced update of the clients, then switch-off."
c1.debrief.p4: "A path no legitimate client calls any more makes an excellent tripwire."
