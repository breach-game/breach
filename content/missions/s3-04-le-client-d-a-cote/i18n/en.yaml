p4.briefing: "A shop has to know who it is talking to. After sign-in, it does not ask for the password again on every page: it gives the browser a small piece of text, the session cookie, and trusts it from then on. The whole security of the account then rests on that text. Pélican gave you a test account and its cookie. Look at what it is made of."
p4.obj.mine: "Read your test account with its session cookie"
p4.obj.decode: "Understand what the cookie is made of"
p4.obj.next: "Read the fictional account next door, and submit its flag"
p4.obj.token: "Read the account's API token with `jwt decode` and say what is wrong"
p4.obj.form: "Look at the address form and say what it lacks"
p4.obj.fix: "Fix `dossier/session.yml`, then `verify`"
p4.q.token: "You read the header and the content of the token. What is its real defect?"
p4.q.token.readable: "Its content can be read by whoever holds it, when a token should be encrypted"
p4.q.token.readable.why: "A JWT is readable by design, and that is no problem as long as it holds nothing secret. Look at the `alg` field of the header instead."
p4.q.token.unsigned: "Nothing signs it (`alg: none`): its bearer can change the role without the server noticing"
p4.q.token.long: "It does not expire fast enough: a token should change on every page the customer opens"
p4.q.token.long.why: "A short lifetime limits the damage of a theft, but the problem here is simpler: read the header again, and ask yourself what proves the server wrote this token."
p4.q.form: "The comment says it: the cookie is enough to change the address. Why is that a problem?"
p4.q.form.https: "Because the form is not encrypted, and the address travels in the clear over the network"
p4.q.form.https.why: "The page is served over HTTPS: nobody reads the address on the way. The trouble is not who listens, but who triggers the sending."
p4.q.form.origin: "Another web page can make the browser of a signed-in customer send this form"
p4.q.form.password: "Because the customer's password should be asked again before any change to the account"
p4.q.form.password.why: "Asking for the password again protects very sensitive actions, but it would be tedious for an address. There is a remedy the customer never sees: look at what the form lacks."
p4.ada.brief: "Your mandate holds the cookie of the test account. Read it again: `cat mandate/PL-2027-002.txt`. The account page is `https://shop.pelican.test/account`."
p4.ada.g.mine: "Present the mandate's cookie to the account page: `curl -b \"session=dXNlcjoxMDQy\" https://shop.pelican.test/account`."
p4.ada.g.mine.standard: "Read your test account by presenting the mandate's cookie. `curl -b` sends a cookie."
p4.ada.g.decode: "That cookie looks like Base64. Decode it: `echo dXNlcjoxMDQy | base64 -d`."
p4.ada.g.decode.standard: "The cookie's value is not random. Recognise the encoding and decode it."
p4.ada.g.next: "The cookie says `user:1042`. Make the one of the customer before: `echo -n user:1041 | base64`, then present it: `curl -b \"session=<the result>\" https://shop.pelican.test/account`."
p4.ada.g.next.standard: "The cookie holds a number. Make the one for the number before, with the same encoding, and present it."
p4.ada.g.token: "Your account held an `api_token` field. Read it: `jwt decode` followed by the token. Look closely at the header."
p4.ada.g.token.standard: "Your account held an API token. Read what is inside."
p4.ada.g.form: "Last point: the address form. Read its source: `curl https://shop.pelican.test/account/address`, comment included."
p4.ada.g.form.standard: "Your account says where the delivery address is changed. Read that form's source."
p4.ada.g.fix: "Fix the session configuration: `edit dossier/session.yml`. Identifiers to `random`, the token to `hs256`, `csrf_token` to `on`, and the cookie to `lax` or `strict`. Save, then `verify`."
p4.ada.g.fix.standard: "Fix `dossier/session.yml` to close the three weaknesses you just saw, then `verify`. To open the file: `edit dossier/session.yml`."
p4.ada.nocookie: "401: without a cookie, the shop does not know who you are. The cookie of the test account is in your mandate."
p4.ada.nocookie.standard: "401: your request lacks something for the shop to recognise you."
p4.ada.mine: "There you are, recognised without a password: the cookie was enough. Look at its value, `dXNlcjoxMDQy`. A good session identifier is a long run of randomness. This one has a look you know."
p4.ada.decode: "`user:1042`. That is no secret, it is a customer number in disguise. Encoding is not encrypting. Who is customer 1041?"
p4.ada.other: "Someone else's account, their address, their orders. Here it is a fictional account Pélican planted for the audit, and you will go no further than this one. Submit the flag it holds."
p4.ada.flag: "Session guessed. The shop saw nothing unusual: to it, a valid cookie is a customer. Go back to your own account: it held something else, an `api_token`."
p4.ada.jwt: "A JWT is three pieces separated by dots: a header, a content, a signature. The first two can be read, you just did. Look at the header, and at the third part."
p4.ada.token: "There. `alg: none`, empty signature: the token says \"I am a customer\", and nothing stops its bearer from writing \"I am an administrator\" instead. We note it in the report without trying it: the mandate does not cover the back office."
p4.ada.address: "Read the developer's comment. This form changes the delivery address on the sole word of the cookie, which the browser attaches by itself to every request to the shop."
p4.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p4.ada.answer.standard: "Answer my question."
p4.ada.form: "That is CSRF. The browser attaches the cookie to any request to the shop, even one that starts from another page. A signed-in customer opens a booby-trapped site, and their next jacket ships to someone else. Two remedies: a token in the form, which the other page cannot know, and a `SameSite` cookie."
p4.ada.almost: "Not yet. Each failing line names what is missing. The session lifetime must stay at 30 minutes."
p4.ada.done: "Random identifiers, a signed token, a form that checks where the request comes from. The shop finally knows who it is talking to. Open the debrief. Tomorrow, the last day: the cart."
p4.soc.other: "Account page: a session of another customer presented from the address of the test account"
p4.check.random: "Session identifiers are drawn at random"
p4.check.signed: "API tokens are signed"
p4.check.csrf: "The form carries an anti-CSRF token and the cookie is SameSite"
p4.check.works: "The session lifetime has not changed"
p4.hint.mine.1: "The cookie is in `mandate/PL-2027-002.txt`. `curl -b \"name=value\"` sends it."
p4.hint.mine.2: "Type `curl -b \"session=dXNlcjoxMDQy\" https://shop.pelican.test/account`."
p4.hint.decode.1: "Type `echo dXNlcjoxMDQy | base64 -d`."
p4.hint.next.1: "The decoded cookie gives `user:1042`. The customer before is `user:1041`."
p4.hint.next.2: "Type `echo -n user:1041 | base64` to get their cookie."
p4.hint.next.3: "Type `curl -b \"session=dXNlcjoxMDQx\" https://shop.pelican.test/account`, then `submit` followed by the flag."
p4.hint.token.1: "The token is the value of the `api_token` field of your account: run the command of the first objective again to see it."
p4.hint.token.2: "Type `jwt decode` followed by the whole token, dots included."
p4.hint.form.1: "Type `curl https://shop.pelican.test/account/address` and read the comment."
p4.hint.fix.1: "Type `edit dossier/session.yml`. The possible values are in a comment at the end of each line."
p4.hint.fix.2: "`session_id: random`, `api_token_alg: hs256`, `csrf_token: on`, `session_cookie_samesite: lax`. Leave the lifetime alone."
p4.debrief.title: "Knowing who is speaking"
p4.debrief.lesson: "Three defects, one question: how does the shop know who it is talking to? The cookie was an encoded customer number, so it could be guessed. The token was signed by nobody, so it could be changed. The form believed the cookie without checking where the request came from."
p4.debrief.p1: "A session identifier is a long value drawn at random, with no meaning. It holds neither a customer number nor a role, and it changes at sign-in."
p4.debrief.p2: "A token is only worth its signature, which the server checks every time. An alg: none token is a declaration on one's honour."
p4.debrief.p3: "Against CSRF: an unpredictable token in every form, and SameSite cookies the browser does not attach to requests coming from another site."
p4.debrief.p4: "Access control happens on the server, on every request: does this account belong to this session?"
