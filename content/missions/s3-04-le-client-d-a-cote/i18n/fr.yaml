p4.briefing: "Une boutique doit savoir qui lui parle. Après la connexion, elle ne redemande pas le mot de passe à chaque page : elle donne au navigateur un petit texte, le cookie de session, et lui fait confiance ensuite. Toute la sécurité du compte tient alors dans ce texte. Pélican t'a fourni un compte de test et son cookie. Regarde de quoi il est fait."
p4.obj.mine: "Lire ton compte de test avec son cookie de session"
p4.obj.decode: "Comprendre de quoi le cookie est fait"
p4.obj.next: "Lire le compte fictif voisin, et envoyer son flag"
p4.obj.token: "Lire le jeton d'API du compte avec `jwt decode` et dire ce qui ne va pas"
p4.obj.form: "Regarder le formulaire d'adresse et dire ce qui lui manque"
p4.obj.fix: "Corriger `dossier/session.yml`, puis `verify`"
p4.q.token: "Tu as lu l'en-tête et le contenu du jeton. Quel est son vrai défaut ?"
p4.q.token.readable: "Son contenu est lisible par celui qui le détient, alors qu'un jeton devrait être chiffré"
p4.q.token.readable.why: "Un JWT est lisible par construction, et ce n'est pas un problème tant qu'il ne contient rien de secret. Regarde plutôt le champ `alg` de l'en-tête."
p4.q.token.unsigned: "Rien ne le signe (`alg: none`) : son porteur peut changer le rôle sans que le serveur le voie"
p4.q.token.long: "Il n'expire pas assez vite : un jeton devrait changer à chaque page que le client ouvre"
p4.q.token.long.why: "Une durée de vie courte limite les dégâts d'un vol, mais le problème ici est plus simple : relis l'en-tête, et demande-toi ce qui prouve que le serveur a écrit ce jeton."
p4.q.form: "Le commentaire le dit : le cookie suffit pour changer l'adresse. Pourquoi est-ce un problème ?"
p4.q.form.https: "Parce que le formulaire n'est pas chiffré, et que l'adresse voyage en clair sur le réseau"
p4.q.form.https.why: "La page est en HTTPS : personne ne lit l'adresse en route. Le souci n'est pas qui écoute, mais qui déclenche l'envoi."
p4.q.form.origin: "Une autre page web peut faire envoyer ce formulaire par le navigateur d'un client connecté"
p4.q.form.password: "Parce qu'il faudrait redemander le mot de passe du client avant toute modification du compte"
p4.q.form.password.why: "Redemander le mot de passe protège les actions très sensibles, mais ce serait pénible pour une adresse. Il existe une parade invisible pour le client : regarde ce qui manque au formulaire."
p4.ada.brief: "Ton mandat contient le cookie du compte de test. Relis-le : `cat mandate/PL-2027-002.txt`. La page du compte est `https://shop.pelican.test/account`."
p4.ada.g.mine: "Présente le cookie du mandat à la page du compte : `curl -b \"session=dXNlcjoxMDQy\" https://shop.pelican.test/account`."
p4.ada.g.mine.standard: "Lis ton compte de test en présentant le cookie du mandat. `curl -b` envoie un cookie."
p4.ada.g.decode: "Ce cookie ressemble à du Base64. Décode-le : `echo dXNlcjoxMDQy | base64 -d`."
p4.ada.g.decode.standard: "La valeur du cookie n'est pas du hasard. Reconnais l'encodage et décode-le."
p4.ada.g.next: "Le cookie dit `user:1042`. Fabrique celui du client d'avant : `echo -n user:1041 | base64`, puis présente-le : `curl -b \"session=<le résultat>\" https://shop.pelican.test/account`."
p4.ada.g.next.standard: "Le cookie contient un numéro. Fabrique celui du numéro d'avant, avec le même encodage, et présente-le."
p4.ada.g.token: "Ton compte contenait un champ `api_token`. Lis-le : `jwt decode` suivi du jeton. Regarde bien l'en-tête."
p4.ada.g.token.standard: "Ton compte contenait un jeton d'API. Lis ce qu'il y a dedans."
p4.ada.g.form: "Dernier point : le formulaire d'adresse. Lis sa source : `curl https://shop.pelican.test/account/address`, commentaire compris."
p4.ada.g.form.standard: "Ton compte indique où changer l'adresse de livraison. Va lire la source de ce formulaire."
p4.ada.g.fix: "Corrige la configuration des sessions : `edit dossier/session.yml`. Identifiants en `random`, jeton en `hs256`, `csrf_token` en `on`, et le cookie en `lax` ou `strict`. Enregistre, puis `verify`."
p4.ada.g.fix.standard: "Corrige `dossier/session.yml` pour fermer les trois faiblesses que tu viens de voir, puis `verify`. Pour ouvrir le fichier : `edit dossier/session.yml`."
p4.ada.nocookie: "401 : sans cookie, la boutique ne sait pas qui tu es. Le cookie du compte de test est dans ton mandat."
p4.ada.nocookie.standard: "401 : il manque quelque chose à ta requête pour que la boutique te reconnaisse."
p4.ada.mine: "Te voilà reconnu, sans mot de passe : le cookie a suffi. Regarde sa valeur, `dXNlcjoxMDQy`. Un bon identifiant de session est une longue suite de hasard. Celui-ci a une tête que tu connais."
p4.ada.decode: "`user:1042`. Ce n'est pas un secret, c'est un numéro de client déguisé. Encoder n'est pas chiffrer. Qui est le client 1041 ?"
p4.ada.other: "Le compte d'une autre personne, son adresse, ses commandes. Ici c'est un compte fictif posé par Pélican pour l'audit, et tu n'iras pas plus loin que celui-là. Envoie le flag qu'il contient."
p4.ada.flag: "Session devinée. La boutique n'a rien vu d'anormal : pour elle, un cookie valide est un client. Reviens sur ton propre compte : il contenait autre chose, un `api_token`."
p4.ada.jwt: "Un JWT, c'est trois morceaux séparés par des points : un en-tête, un contenu, une signature. Les deux premiers se lisent, tu viens de le faire. Regarde l'en-tête, et la troisième partie."
p4.ada.token: "Voilà. `alg: none`, signature vide : le jeton dit « je suis client », et rien n'empêche son porteur d'écrire « je suis administrateur » à la place. On le note au rapport sans l'essayer : le mandat ne couvre pas l'administration."
p4.ada.address: "Lis le commentaire du développeur. Ce formulaire change l'adresse de livraison sur la seule foi du cookie, que le navigateur joint tout seul à chaque requête vers la boutique."
p4.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p4.ada.answer.standard: "Réponds à ma question."
p4.ada.form: "C'est le CSRF. Le navigateur joint le cookie à toute requête vers la boutique, même quand elle part d'une autre page. Un client connecté ouvre un site piégé, et sa prochaine veste part chez quelqu'un d'autre. Deux parades : un jeton dans le formulaire, que l'autre page ne peut pas connaître, et un cookie `SameSite`."
p4.ada.almost: "Pas encore. Chaque ligne en échec nomme ce qui manque. La durée de session doit rester à 30 minutes."
p4.ada.done: "Des identifiants au hasard, un jeton signé, un formulaire qui vérifie d'où vient la demande. La boutique sait enfin à qui elle parle. Ouvre le débrief. Demain, dernière journée : le panier."
p4.soc.other: "Account page: a session of another customer presented from the address of the test account"
p4.check.random: "Les identifiants de session sont tirés au hasard"
p4.check.signed: "Les jetons d'API sont signés"
p4.check.csrf: "Le formulaire porte un jeton anti-CSRF et le cookie est en SameSite"
p4.check.works: "La durée de session n'a pas changé"
p4.hint.mine.1: "Le cookie est dans `mandate/PL-2027-002.txt`. `curl -b \"nom=valeur\"` l'envoie."
p4.hint.mine.2: "Tape `curl -b \"session=dXNlcjoxMDQy\" https://shop.pelican.test/account`."
p4.hint.decode.1: "Tape `echo dXNlcjoxMDQy | base64 -d`."
p4.hint.next.1: "Le cookie décodé donne `user:1042`. Le client d'avant est `user:1041`."
p4.hint.next.2: "Tape `echo -n user:1041 | base64` pour obtenir son cookie."
p4.hint.next.3: "Tape `curl -b \"session=dXNlcjoxMDQx\" https://shop.pelican.test/account`, puis `submit` suivi du flag."
p4.hint.token.1: "Le jeton est la valeur du champ `api_token` de ton compte : relance la commande du premier objectif pour le revoir."
p4.hint.token.2: "Tape `jwt decode` suivi du jeton entier, points compris."
p4.hint.form.1: "Tape `curl https://shop.pelican.test/account/address` et lis le commentaire."
p4.hint.fix.1: "Tape `edit dossier/session.yml`. Les valeurs possibles sont en commentaire au bout de chaque ligne."
p4.hint.fix.2: "`session_id: random`, `api_token_alg: hs256`, `csrf_token: on`, `session_cookie_samesite: lax`. Ne touche pas à la durée."
p4.debrief.title: "Savoir qui parle"
p4.debrief.lesson: "Trois défauts, une même question : comment la boutique sait-elle qui lui parle ? Le cookie était un numéro de client encodé, donc devinable. Le jeton n'était signé par personne, donc modifiable. Le formulaire croyait le cookie sans vérifier d'où venait la demande."
p4.debrief.p1: "Un identifiant de session est une longue valeur tirée au hasard, sans aucun sens. Il ne contient ni numéro de client ni rôle, et il change à la connexion."
p4.debrief.p2: "Un jeton n'a de valeur que par sa signature, que le serveur vérifie à chaque fois. Un jeton alg: none est une déclaration sur l'honneur."
p4.debrief.p3: "Contre le CSRF : un jeton imprévisible dans chaque formulaire, et des cookies SameSite que le navigateur ne joint pas aux requêtes venues d'un autre site."
p4.debrief.p4: "Le contrôle d'accès se fait côté serveur, à chaque requête : ce compte appartient-il à cette session ?"
