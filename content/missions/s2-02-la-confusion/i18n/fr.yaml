h2.briefing: "Hier tu as lu la règle dans le journal : deux sources de paquets, publique puis interne, et la version la plus haute gagne. Le paquet `halcyon-telemetry` n'existe qu'en interne. Rien n'empêche quelqu'un de publier un paquet du même nom, en version plus haute, sur le miroir public. La chaîne de Halcyon ira le chercher toute seule."
h2.obj.mirror: "Ouvrir le miroir public de paquets"
h2.obj.publish: "Publier un paquet témoin au nom du paquet interne, en version plus haute"
h2.obj.proof: "Envoyer le marqueur apparu dans le journal de construction (`submit`)"
h2.obj.who: "Dire ce qui a été trompé"
h2.q.who: "Ton paquet est dans l'extension de cette nuit. Qu'as-tu trompé ?"
h2.q.who.break: "La machine de construction : tu es entré dessus cette nuit et tu y as déposé ton paquet toi-même"
h2.q.who.break.why: "Tu n'es entré sur aucune machine. Tu as déposé un paquet sur un miroir ouvert, et c'est la construction qui est venue le chercher, en suivant sa propre règle."
h2.q.who.trust: "La règle de résolution : elle se fie au nom et au numéro de version, et prend le plus haut d'où qu'il vienne"
h2.q.who.steal: "Un employé de Halcyon : tu as utilisé son compte pour publier le paquet à sa place"
h2.q.who.steal.why: "Aucun identifiant, aucun compte. Le miroir public n'en demande pas, et c'est justement le problème : il accepte n'importe quel nom de n'importe qui."
h2.soc.pull: "Nightly build installed a public package over an internal one of the same name"
h2.ada.brief: "Le miroir public est `https://paquets.halcyon.test/mirror`. Ouvre-le pour voir comment on y publie. Souviens-toi du mandat : on ne vise que le marqueur témoin, on ne touche à rien de ce qui part chez les clients."
h2.ada.g.mirror: "Ouvre le miroir : `curl https://paquets.halcyon.test/mirror`."
h2.ada.g.mirror.standard: "Va voir le miroir public de paquets."
h2.ada.g.publish: "Publie un paquet au nom du paquet interne, `halcyon-telemetry`, avec une version bien plus haute que 1.4.2. Poste son nom et sa version avec `curl -d` sur `/publish` : le contenu sera le paquet témoin du mandat."
h2.ada.g.publish.standard: "Publie un paquet au nom du paquet interne, en version plus haute."
h2.ada.g.proof: "Le journal de la construction #1043 affiche le marqueur du paquet témoin. Envoie-le-moi avec `submit`."
h2.ada.g.proof.standard: "Envoie-moi le marqueur affiché dans le journal."
h2.ada.mirror: "Ouvert à tous, sans compte, sans relecture. Il attend deux choses : un nom et une version. Le contenu, c'est le paquet témoin du mandat, qui n'écrit qu'un marqueur. C'est tout ce qu'il faut."
h2.ada.wrong: "Ce nom-là, la construction ne le cherche pas, ou le dépôt interne en a déjà une version plus haute. Reprends le nom exact du paquet interne lu hier, et donne-lui une version plus haute que celle du dépôt interne."
h2.ada.wrong.standard: "Mauvais nom ou version trop basse. Reprends le nom exact du paquet interne, en version plus haute."
h2.ada.pulled: "Regarde le journal. Deux paquets du même nom : le tien, en version plus haute, et l'interne, en 1.4.2. La règle prend le plus haut, donc le tien. Ton paquet témoin est maintenant dans l'extension que des milliers d'éditeurs recevront cette nuit."
h2.ada.flag: "Et on s'arrête net : le marqueur, rien d'autre. Ton paquet témoin n'a rien fait de plus qu'écrire cette ligne. Un vrai attaquant aurait mis autre chose à la place, et personne ne l'aurait vu passer."
h2.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h2.ada.answer.standard: "Réponds à ma question."
h2.ada.who: "Exactement. La chaîne a fait confiance à un nom et à un numéro. Elle n'a jamais demandé : « ce nom, est-il à nous ? » C'est toute la faille, et elle tient en une question manquante."
h2.ada.done: "Tu as livré du code à trois mille clients sans jamais entrer chez Halcyon. Ouvre le débrief. Demain, on apprend à la chaîne à poser la question manquante."
h2.hint.mirror.1: "Tape `curl https://paquets.halcyon.test/mirror`."
h2.hint.publish.1: "Le nom doit être exactement celui du paquet interne vu hier : `halcyon-telemetry`."
h2.hint.publish.2: "La version doit dépasser celle du dépôt interne (1.4.2). Prends large, par exemple 9.9.9."
h2.hint.publish.3: "Tape `curl -d \"name: halcyon-telemetry, version: 9.9.9\" https://paquets.halcyon.test/publish`."
h2.hint.proof.1: "Copie la ligne `FLAG{...}` du journal de construction et tape `submit` suivi de cette ligne."
h2.debrief.title: "Un nom, un numéro, et trop de confiance"
h2.debrief.lesson: "Tu n'as forcé aucune porte. Tu as profité d'une chaîne qui résout un nom de paquet sans vérifier à qui ce nom appartient, et qui préfère toujours la version la plus haute. Déposer un paquet public du bon nom a suffi."
h2.debrief.p1: "La confusion de dépendances exploite un nom interne publié à l'extérieur : la chaîne préfère la version la plus haute, où qu'elle soit."
h2.debrief.p2: "Les noms des paquets internes doivent être réservés, ou préfixés, pour qu'un inconnu ne puisse pas s'en emparer sur un dépôt public."
h2.debrief.p3: "Une chaîne de fabrication doit savoir d'où doit venir chaque dépendance, et refuser une source inattendue, même avec une version plus haute."
h2.def.intro: "Le registre d'Halcyon journalise chaque paquet que le miroir reçoit, et ce que le build de nuit en a fait. Ton paquet y est, au milieu de tout ce que le reste du monde a publié cette nuit-là."
h2.def.lesson: "Personne ne peut surveiller tout ce que des inconnus publient. Ce qu'on peut surveiller, c'est le choix du build lui-même : la nuit où il prend un des noms d'Halcyon ailleurs que chez Halcyon. Le détecter, c'est la moitié du travail. Le rendre impossible, c'est la mission de demain."
h2.def.find.confusion: "Le paquet que le build de nuit a installé à la place de celui d'Halcyon"
h2.def.rule.internal.title: "Alerter quand le build installe depuis le miroir public un paquet qui porte un nom interne"
h2.def.rule.internal.why: "C'est la bonne : elle surveille ce que fait le build, pas ce que des inconnus publient. Une nuit ordinaire, cela n'arrive jamais, donc elle ne sonne jamais pour rien."
h2.def.rule.any.title: "Alerter à chaque paquet publié sur le miroir public"
h2.def.rule.any.why: "Le monde entier y publie, jour et nuit. Le tien est une ligne parmi des centaines : l'alerte qui sonne tout le temps est celle que personne ne lit."
h2.def.rule.burst.title: "Alerter quand une adresse publie 2 paquets ou plus en 10 minutes"
h2.def.rule.burst.why: "Elle sonne sur un mainteneur qui corrige une version à la hâte, et elle te rate : un seul paquet a suffi."
