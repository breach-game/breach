h2.briefing: "Yesterday you read the rule in the log: two package sources, public then internal, and highest version wins. The package `halcyon-telemetry` only exists internally. Nothing stops someone from publishing a package of the same name, at a higher version, on the public mirror. Halcyon's chain will fetch it on its own."
h2.obj.mirror: "Open the public package mirror"
h2.obj.publish: "Publish a canary package under the internal package's name, at a higher version"
h2.obj.proof: "Send the marker that appeared in the build log (`submit`)"
h2.obj.who: "Say what was fooled"
h2.q.who: "Your package is in tonight's extension. What did you fool?"
h2.q.who.break: "The build machine: you broke into it"
h2.q.who.break.why: "You broke into no machine. You dropped a package on an open mirror, and the build came to fetch it, following its own rule."
h2.q.who.trust: "The resolution rule: it trusts the name and the version number, and takes the highest, wherever it comes from"
h2.q.who.steal: "A credential: you stole an employee's account"
h2.q.who.steal.why: "No credential, no account. The public mirror asks for none, and that is exactly the problem: it accepts any name from anyone."
h2.soc.pull: "Nightly build installed a public package over an internal one of the same name"
h2.ada.brief: "The public mirror is `https://paquets.halcyon.test/mirror`. Open it to see how you publish there. Remember the mandate: we only aim for the canary marker, we touch nothing that ships to customers."
h2.ada.g.mirror: "Open the mirror: `curl https://paquets.halcyon.test/mirror`."
h2.ada.g.mirror.standard: "Go and see the public package mirror."
h2.ada.g.publish: "Publish a package under the internal package's name, `halcyon-telemetry`, with a version well above 1.4.2. Post its name and version with `curl -d` to `/publish`: the content will be the mandate's canary package."
h2.ada.g.publish.standard: "Publish a package under the internal package's name, at a higher version."
h2.ada.g.proof: "The log of build #1043 prints the canary package's marker. Send it to me with `submit`."
h2.ada.g.proof.standard: "Send me the marker printed in the log."
h2.ada.mirror: "Open to everyone, no account, no review. It expects two things: a name and a version. The content is the mandate's canary package, which only prints a marker. That is all it takes."
h2.ada.wrong: "The build does not look for that name, or the internal registry already has a higher version of it. Use the exact name of the internal package you read yesterday, and give it a version higher than the internal one."
h2.ada.wrong.standard: "Wrong name or version too low. Use the exact internal package name, at a higher version."
h2.ada.pulled: "Look at the log. Two packages of the same name: yours, at a higher version, and the internal one, at 1.4.2. The rule takes the highest, so yours. Your canary package is now in the extension that thousands of editors will receive tonight."
h2.ada.flag: "And we stop right there: the marker, nothing else. Your canary package did nothing more than write that line. A real attacker would have put something else in its place, and nobody would have seen it go by."
h2.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h2.ada.answer.standard: "Answer my question."
h2.ada.who: "Exactly. The chain trusted a name and a number. It never asked: \"this name, is it ours?\" That is the whole flaw, and it fits in one missing question."
h2.ada.done: "You shipped code to three thousand customers without ever entering Halcyon. Open the debrief. Tomorrow, we teach the chain to ask the missing question."
h2.hint.mirror.1: "Type `curl https://paquets.halcyon.test/mirror`."
h2.hint.publish.1: "The name must be exactly the internal package seen yesterday: `halcyon-telemetry`."
h2.hint.publish.2: "The version must exceed the internal registry's one (1.4.2). Go high, for example 9.9.9."
h2.hint.publish.3: "Type `curl -d \"name: halcyon-telemetry, version: 9.9.9\" https://paquets.halcyon.test/publish`."
h2.hint.proof.1: "Copy the `FLAG{...}` line from the build log and type `submit` followed by that line."
h2.debrief.title: "A name, a number, and too much trust"
h2.debrief.lesson: "You forced no door. You used a chain that resolves a package name without checking whom that name belongs to, and that always prefers the highest version. Dropping a public package of the right name was enough."
h2.debrief.p1: "Dependency confusion exploits an internal name published outside: the chain prefers the highest version, wherever it is."
h2.debrief.p2: "Internal package names must be reserved, or prefixed, so a stranger cannot grab them on a public registry."
h2.debrief.p3: "A build chain must know where each dependency should come from, and refuse an unexpected source, even at a higher version."
