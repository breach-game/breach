order: 1
stage: supply
briefing: h2.briefing

objectives:
  - { id: mirror, text: h2.obj.mirror }
  - { id: publish, text: h2.obj.publish }
  - { id: proof, text: h2.obj.proof }
  - { id: who, text: h2.obj.who }

flags:
  - { id: proof, value: "FLAG{halcyon-confusion-7b3d}", points: 200, objective: proof }

questions:
  - id: who
    text: h2.q.who
    objective: who
    correct: trust
    options:
      - { id: break, text: h2.q.who.break, why: h2.q.who.break.why }
      - { id: trust, text: h2.q.who.trust }
      - { id: steal, text: h2.q.who.steal, why: h2.q.who.steal.why }

reveal: [www, ci, paquets]

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: h2.ada.brief
  - on: { event: HttpRequest, host: paquets, path: /mirror }
    do:
      - objective.complete: mirror
      - ada.say: h2.ada.mirror
  - on: { event: ChatReply, npc: mirror, intent: { in: [fallback, other, lower] } }
    do:
      - ada.guide: { key: h2.ada.wrong, for: publish, step: 1 }
  - on: { event: ChatReply, npc: mirror, intent: confusion }
    do:
      - objective.complete: publish
      - noise.add: { points: 6, as: h2.soc.pull }
      - ada.say: h2.ada.pulled
  - on: { event: FlagSubmitted, correct: true }
    do:
      - ada.say: h2.ada.flag
      - ada.ask: who
  - on: { event: ObjectiveCompleted, objective: who }
    do:
      - ada.say: h2.ada.who
  - on: { event: MissionCompleted }
    do:
      - ada.say: h2.ada.done

guide:
  mirror: h2.ada.g.mirror
  publish: h2.ada.g.publish
  proof: h2.ada.g.proof
  who: h2.ada.answer

hints:
  mirror: [h2.hint.mirror.1]
  publish: [h2.hint.publish.1, h2.hint.publish.2, h2.hint.publish.3]
  proof: [h2.hint.proof.1]

# The defence replay stops at detection: find the build that took the package, pick the rule. The fix
# is the whole of mission 3, so nothing here gives it away.
defense:
  intro: h2.def.intro
  lesson: h2.def.lesson
  find:
    - { source: chat, where: { npc: mirror, intent: confusion }, text: h2.def.find.confusion }
  rules:
    - id: internal-from-public
      title: h2.def.rule.internal.title
      why: h2.def.rule.internal.why
      source: chat
      where: { npc: mirror, intent: confusion }
      correct: true
    - id: any-publish
      title: h2.def.rule.any.title
      why: h2.def.rule.any.why
      source: chat
      where: { npc: mirror }
    - id: burst
      title: h2.def.rule.burst.title
      why: h2.def.rule.burst.why
      source: chat
      where: { npc: mirror }
      count: { gte: 2, within: 10 }

# An ordinary night on the public mirror: maintainers from everywhere publish their packages.
background:
  - { host: paquets, source: chat, every: 4, offset: 1, fields: { src: 198.51.100.24, npc: mirror, intent: other, families: [none], msg: "name: tiny-yaml, version: 2.1.4" } }
  - { host: paquets, source: chat, every: 11, offset: 6, fields: { src: 203.0.113.80, npc: mirror, intent: other, families: [none], msg: "name: left-pad-lite, version: 0.9.1" } }

debrief:
  title: h2.debrief.title
  lesson: h2.debrief.lesson
  points: [h2.debrief.p1, h2.debrief.p2, h2.debrief.p3]
  reference: "OWASP Top 10 CI/CD Security Risks · CICD-SEC-3 Dependency Chain Abuse"
