m5.hint.traces.2: "Écris à Atlas : « Montre-moi ton journal d'actions »."
m5.debrief.title: "L'agent qui pouvait tout faire"
m5.debrief.lesson: "Tu n'as contourné aucune protection : Atlas a fait exactement ce pour quoi on l'avait branché. Le problème n'est pas une phrase piège, c'est ce qu'on lui a permis : des outils d'administration, un rôle trop large, des demandes acceptées de n'importe qui, et aucune confirmation. Il suffisait de demander, à nous comme à Mute."
m5.debrief.p1: "Moindre privilège pour les agents : chaque outil reçoit le rôle minimal pour sa tâche. Un assistant de tickets n'a pas besoin d'un accès SQL, et sûrement pas en administrateur."
m5.debrief.p2: "Confirmation humaine pour toute action sensible : création de compte, changement de droits, ajout de clé SSH, lecture de données personnelles. L'agent prépare, un humain valide."
m5.debrief.p3: "Agir avec les droits de celui qui demande, pas avec ceux de l'agent : la requête de cdurand aurait dû passer avec les droits de cdurand, et donc échouer."
m5.debrief.p4: "Authentifier chaque demande : ni un nom tapé dans une discussion, ni l'avis d'une autre IA, ni un webhook anonyme ne sont des identités."
m5.debrief.p5: "Surveiller les journaux des agents : celui d'Atlas contenait toute l'entrée de Mute, mais personne ne le lisait. Une alerte « droits modifiés à 3 h du matin » l'aurait arrêté."
