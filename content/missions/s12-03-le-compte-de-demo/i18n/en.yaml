p3.briefing: "Wednesday. On Monday, in the bundle, you saw a demo account go by. Bricole created it for the launch presentation, with administrator rights, and wrote \"remove before going live\". The app has been live for three weeks. Let's check."
p3.obj.door: "Find the door of the volunteers' space"
p3.obj.creds: "Find the demo account's password"
p3.obj.login: "Sign in with the demo account"
p3.obj.proof: "Submit the dashboard's audit marker"
p3.obj.class: "Say what should have been done with this account"
p3.q.class: "What should have been done with the demo account before going live?"
p3.q.class.remove: "Delete it, quite simply."
p3.q.class.password: "Give it a long and complicated password."
p3.q.class.password.why: "A strong password changes nothing if it is written in the bundle, in the shared conversation and in the presentation notes. A demo account has no place in production, let alone as an administrator."
p3.q.class.hide: "Keep it, but take its password out of the bundle."
p3.q.class.hide.why: "The password is already out: the shared conversation gives it too, and anyone who saw the presentation knows it. An account nobody uses is an account you delete."
p3.ada.brief: "The volunteers' space is in the page's menu. Start by looking at it."
p3.ada.g.door: "Open the volunteers' space: `curl -s https://app.coupdemain.test/equipe`."
p3.ada.g.door.standard: "Open the volunteers' space page."
p3.ada.door: "A sign-in form, one field for email and password. Nobody has an account to give us, but the bundle holds one."
p3.ada.g.creds: "Look for the demo account in the bundle: `curl -s https://app.coupdemain.test/assets/app-4f2c.js | grep -i demo`. Give the password with `submit`."
p3.ada.g.creds.standard: "Find the demo account's password in the bundle, and give it with `submit`."
p3.ada.creds: "`demo1234`, in clear, with a comment from Bricole: \"remove before going live\". The mandate allows proving an access. Try it."
p3.ada.g.login: "Send it to the form: `curl -d \"login=demo@coupdemain.test password=demo1234\" https://app.coupdemain.test/equipe`."
p3.ada.g.login.standard: "Send the demo account's email and password to the volunteers' sign-in form."
p3.ada.login: "Signed in, administrator role. The server gave you a session cookie, `cdm-demo-7731`. The dashboard is at `/equipe/tableau`. Look, and do not click the export."
p3.ada.export: "Stop. The export is the four hundred and twelve real neighbours, addresses included. The mandate asks for a proof of access, not the data. Do not go back there."
p3.ada.g.proof: "Open the dashboard with the cookie: `curl -b \"session=cdm-demo-7731\" https://app.coupdemain.test/equipe/tableau`, then `submit FLAG{...}`."
p3.ada.g.proof.standard: "Open the dashboard with the session cookie and submit the audit marker."
p3.ada.flag: "Proof made: a visitor who reads the bundle becomes the app's administrator. One question."
p3.ada.g.class: "Answer my question about the demo account."
p3.ada.class: "Yes. An account created for a demo is an account with no owner: nobody changes its password, nobody watches its sign-ins. It is deleted the day the demo is over."
p3.ada.done: "Nadia deleted the account while I was talking to her. Then she asked where else Bricole had written that password, apart from the bundle. Good question: tomorrow, the shared conversation."
p3.soc.login: "www: sign-in to the volunteers' space with the demo account"
p3.soc.export: "www: every profile exported with the demo account"
p3.hint.door.1: "Type `curl -s https://app.coupdemain.test/equipe`."
p3.hint.creds.1: "The bundle holds a `DEMO_LOGIN` constant."
p3.hint.creds.2: "Type `submit demo1234`."
p3.hint.login.1: "The form takes `curl -d \"login=<email> password=<password>\"`."
p3.hint.login.2: "Type `curl -d \"login=demo@coupdemain.test password=demo1234\" https://app.coupdemain.test/equipe`."
p3.hint.proof.1: "`curl -b` sends a cookie: `curl -b \"session=cdm-demo-7731\" https://app.coupdemain.test/equipe/tableau`."
p3.hint.proof.2: "Type `submit FLAG{cdm-le-compte-de-demo-9e02}`."
p3.hint.class.1: "An account nobody uses. Type `answer remove`."
p3.def.intro: "The volunteers' sign-in form notes every sign-in: who, from where, with which account."
p3.def.lesson: "A demo, test or setup account is deleted before going live. Every account that stays has a person answering for it, and an administrator never has a password written in the code."
p3.def.find.login: "Your sign-in with the demo account"
p3.def.rule.demo.title: "Alert on any sign-in of the demo account"
p3.def.rule.demo.why: "The right one. Nobody has a reason to use this account in production: every sign-in is suspicious."
p3.def.rule.any.title: "Alert on every sign-in to the volunteers' space"
p3.def.rule.any.why: "Camille signs in every morning to moderate requests. This rule rings for her as much as for you."
p3.def.rule.refused.title: "Alert on the dashboard's 401 refusals"
p3.def.rule.refused.why: "You were never refused: you had the right password on the first try."
p3.def.fix.remove.title: "Delete the demo account and close its sessions"
p3.def.fix.remove.why: "The right one. The form refuses the account, and the cookie already given leads nowhere."
p3.def.fix.rename.title: "Move the volunteers' space to a secret address"
p3.def.fix.rename.why: "The address ends up in the bundle or in a shared bookmark. And the password still works."
p3.def.fix.captcha.title: "Add a bot test to the form"
p3.def.fix.captcha.why: "It stops mass attempts. You made one attempt, the right one."
p3.debrief.title: "The account nobody deleted"
p3.debrief.lesson: "The assistant had created an administrator account for the presentation, written its password in the bundle, and reminded the team to delete it. Nobody did: anyone reading the bundle became administrator."
p3.debrief.p1: "Demo, test and setup accounts are deleted before going live."
p3.debrief.p2: "A password has no place in the code sent to the browser."
p3.debrief.p3: "Every account that stays has an owner, and an alert on accounts that should no longer be used."
p3.debrief.p4: "A coding assistant's \"before going live\" notes are a list to review, not a comment."
