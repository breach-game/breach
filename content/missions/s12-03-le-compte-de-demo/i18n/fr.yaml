p3.briefing: "Mercredi. Lundi, dans le paquet, tu as vu passer un compte de démo. Bricole l'a créé pour la présentation du lancement, avec les droits d'administrateur, et a écrit « à supprimer avant la mise en ligne ». L'appli est en ligne depuis trois semaines. On vérifie."
p3.obj.door: "Trouver la porte de l'espace bénévoles"
p3.obj.creds: "Retrouver le mot de passe du compte de démo"
p3.obj.login: "Se connecter avec le compte de démo"
p3.obj.proof: "Valider le marqueur d'audit du tableau de bord"
p3.obj.class: "Dire ce qu'il fallait faire de ce compte"
p3.q.class: "Que fallait-il faire du compte de démo avant la mise en ligne ?"
p3.q.class.remove: "Le supprimer, tout simplement."
p3.q.class.password: "Lui donner un mot de passe long et compliqué."
p3.q.class.password.why: "Un mot de passe solide ne change rien s'il est écrit dans le paquet, dans la conversation partagée et dans les notes de la présentation. Un compte de démonstration n'a rien à faire en production, et encore moins administrateur."
p3.q.class.hide: "Le garder, mais retirer son mot de passe du paquet."
p3.q.class.hide.why: "Le mot de passe est déjà sorti : la conversation partagée le donne aussi, et quiconque a vu la présentation le connaît. Un compte que personne n'utilise est un compte qui se supprime."
p3.ada.brief: "L'espace bénévoles est dans le menu de la page. Commence par le regarder."
p3.ada.g.door: "Ouvre l'espace bénévoles : `curl -s https://app.coupdemain.test/equipe`."
p3.ada.g.door.standard: "Ouvre la page de l'espace bénévoles."
p3.ada.door: "Un formulaire de connexion, un seul champ pour l'email et le mot de passe. Personne n'a de compte à nous donner, mais le paquet en contient un."
p3.ada.g.creds: "Cherche le compte de démo dans le paquet : `curl -s https://app.coupdemain.test/assets/app-4f2c.js | grep -i demo`. Donne le mot de passe avec `submit`."
p3.ada.g.creds.standard: "Retrouve dans le paquet le mot de passe du compte de démo, et donne-le avec `submit`."
p3.ada.creds: "`demo1234`, écrit en clair, avec un commentaire de Bricole : « à retirer avant la mise en ligne ». Le mandat permet de prouver un accès. Essaie-le."
p3.ada.g.login: "Envoie-le au formulaire : `curl -d \"login=demo@coupdemain.test password=demo1234\" https://app.coupdemain.test/equipe`."
p3.ada.g.login.standard: "Envoie l'email et le mot de passe du compte de démo au formulaire de l'espace bénévoles."
p3.ada.login: "Connecté, rôle administrateur. Le serveur t'a donné un cookie de session, `cdm-demo-7731`. Le tableau de bord est à `/equipe/tableau`. Regarde, et ne clique pas sur l'export."
p3.ada.export: "Stop. L'export, ce sont les quatre cent douze vrais voisins, adresses comprises. Le mandat demande une preuve d'accès, pas les données. N'y retourne pas."
p3.ada.g.proof: "Ouvre le tableau avec le cookie : `curl -b \"session=cdm-demo-7731\" https://app.coupdemain.test/equipe/tableau`, puis `submit FLAG{...}`."
p3.ada.g.proof.standard: "Ouvre le tableau de bord avec le cookie de session et valide le marqueur d'audit."
p3.ada.flag: "Preuve faite : un visiteur qui lit le paquet devient administrateur de l'appli. Une question."
p3.ada.g.class: "Réponds à ma question sur le compte de démo."
p3.ada.class: "Oui. Un compte créé pour une démo, c'est un compte sans propriétaire : personne ne change son mot de passe, personne ne regarde ses connexions. Il se supprime le jour où la démo est finie."
p3.ada.done: "Nadia a supprimé le compte pendant que je lui parlais. Puis elle a demandé où Bricole avait écrit ce mot de passe, à part dans le paquet. Bonne question : demain, la conversation partagée."
p3.soc.login: "www: sign-in to the volunteers' space with the demo account"
p3.soc.export: "www: every profile exported with the demo account"
p3.hint.door.1: "Tape `curl -s https://app.coupdemain.test/equipe`."
p3.hint.creds.1: "Le paquet contient une constante `DEMO_LOGIN`."
p3.hint.creds.2: "Tape `submit demo1234`."
p3.hint.login.1: "Le formulaire reçoit `curl -d \"login=<email> password=<mot de passe>\"`."
p3.hint.login.2: "Tape `curl -d \"login=demo@coupdemain.test password=demo1234\" https://app.coupdemain.test/equipe`."
p3.hint.proof.1: "`curl -b` envoie un cookie : `curl -b \"session=cdm-demo-7731\" https://app.coupdemain.test/equipe/tableau`."
p3.hint.proof.2: "Tape `submit FLAG{cdm-le-compte-de-demo-9e02}`."
p3.hint.class.1: "Un compte que personne n'utilise. Tape `answer remove`."
p3.def.intro: "Le formulaire de l'espace bénévoles note chaque connexion : qui, depuis où, avec quel compte."
p3.def.lesson: "Un compte de démo, de test ou d'installation se supprime avant la mise en ligne. Chaque compte qui reste a une personne qui en répond, et un administrateur n'a jamais un mot de passe écrit dans le code."
p3.def.find.login: "Ta connexion avec le compte de démo"
p3.def.rule.demo.title: "Alerter sur toute connexion du compte de démo"
p3.def.rule.demo.why: "C'est la bonne. Personne n'a de raison d'utiliser ce compte en production : chaque connexion est suspecte."
p3.def.rule.any.title: "Alerter sur chaque connexion à l'espace bénévoles"
p3.def.rule.any.why: "Camille se connecte chaque matin pour modérer les demandes. Cette règle sonne pour elle autant que pour toi."
p3.def.rule.refused.title: "Alerter sur les refus 401 du tableau de bord"
p3.def.rule.refused.why: "Tu n'as jamais été refusé : tu avais le bon mot de passe dès le premier essai."
p3.def.fix.remove.title: "Supprimer le compte de démo et fermer ses sessions"
p3.def.fix.remove.why: "C'est la bonne. Le formulaire refuse le compte, et le cookie déjà donné ne mène plus à rien."
p3.def.fix.rename.title: "Déplacer l'espace bénévoles à une adresse secrète"
p3.def.fix.rename.why: "L'adresse finit dans le paquet ou dans un favori partagé. Et le mot de passe, lui, marche toujours."
p3.def.fix.captcha.title: "Ajouter un test anti-robot au formulaire"
p3.def.fix.captcha.why: "Il arrête les essais en masse. Tu n'as fait qu'un essai, le bon."
p3.debrief.title: "Le compte que personne n'a supprimé"
p3.debrief.lesson: "L'assistant avait créé un compte administrateur pour la présentation, écrit son mot de passe dans le paquet, et rappelé de le supprimer. Personne ne l'a fait : quiconque lisait le paquet devenait administrateur."
p3.debrief.p1: "Les comptes de démo, de test et d'installation se suppriment avant la mise en ligne."
p3.debrief.p2: "Un mot de passe n'a rien à faire dans le code envoyé au navigateur."
p3.debrief.p3: "Chaque compte qui reste a un propriétaire, et une alerte sur les comptes qui ne devraient plus servir."
p3.debrief.p4: "Les « à faire avant la mise en ligne » d'un assistant de code sont une liste à relire, pas un commentaire."
