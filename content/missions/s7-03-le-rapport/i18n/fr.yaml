n3.briefing: "Mercredi. Deux trouvailles dans tes notes : le billet lisible par son numéro, le remboursement après transfert. Elles ne valent rien tant qu'elles restent dans tes notes. Le règlement donne 24 heures pour signaler. Avant d'écrire, un dernier tour : il reste une adresse du programme que tu n'as pas regardée, l'API."
n3.file.report: "# Rapport au programme Lumière Noire. Corrige chaque ligne (une seule valeur par ligne), puis tape : verify\nreport: LN-2028-014\nfindings: 3\n# severity: low | medium | high\nseverity: unrated\n# steps: none | commands\nsteps: none\n# proof: full-export | test-marker\nproof: full-export\n# real_data: attached | none\nreal_data: attached\n"
n3.obj.export: "Regarder ce que l'API laisse lire sans compte"
n3.obj.report: "Compléter le rapport `rapports/LN-2028-014.yml`"
n3.obj.send: "Envoyer le rapport à Malia"
n3.obj.publish: "Décider quand en parler publiquement"
n3.obj.breach: "Dire ce que le festival doit faire pour les bénévoles"
n3.check.severity: "La gravité est évaluée, et elle est haute"
n3.check.steps: "Les étapes sont des commandes que Malia peut rejouer"
n3.check.proof: "La preuve est le témoin de test, pas l'export entier"
n3.check.data: "Aucune donnée d'une vraie personne n'est jointe"
n3.check.kept: "Le rapport garde son numéro et ses trois trouvailles"
n3.q.publish: "Malia te demande d'attendre le 4 octobre avant d'en parler. Ton article est presque écrit, et il ferait du bruit. Que décides-tu ?"
n3.q.publish.wait: "Attendre la correction, puis publier avec l'accord du festival"
n3.q.publish.wait.why: "Tu attends. Le 4 octobre, l'article sortira avec la date du signalement, la date de la correction, et un mot de Malia. Personne n'aura été exposé pour qu'il existe."
n3.q.publish.early: "Publier dès ce soir : le public a le droit de savoir"
n3.q.publish.early.why: "Tu publies. L'article circule vite. Le remboursement après transfert, lui, ne sera corrigé que dans dix jours : pendant dix jours, la recette est publique et la porte est ouverte. Malia te fait savoir, poliment, que le festival s'en souviendra."
n3.q.publish.never: "Ne jamais rien publier : l'affaire reste entre le festival et toi"
n3.q.publish.never.why: "Tu ne publies rien. C'est ton droit, et le festival ne s'en plaindra pas. Mais d'autres billetteries ont la même faille, et aucune n'apprendra de celle-ci. Le règlement t'autorisait à écrire après la correction."
n3.q.breach: "L'export des bénévoles est resté lisible sans compte pendant des semaines : noms, téléphones, et une note médicale. Que doit faire le festival ?"
n3.q.breach.nothing: "Rien : c'est toi qui l'as trouvé, dans les règles, donc personne n'a été lésé"
n3.q.breach.nothing.why: "Tu es le premier à l'avoir signalé, pas forcément le premier à l'avoir lu. Ce qui compte, c'est que les données ont été exposées. Le festival doit regarder ses journaux pour savoir qui d'autre est passé."
n3.q.breach.notify: "Documenter la fuite, et prévenir la CNIL sous 72 heures s'il y a un risque"
n3.q.breach.silence: "Te faire signer un accord de silence, pour que les bénévoles ne l'apprennent pas"
n3.q.breach.silence.why: "L'obligation du festival est envers les personnes et envers l'autorité, pas envers toi. Ton silence ne l'efface pas, et le cacher aggrave la faute."
n3.ada.brief: "Une API commence souvent par dire ce qu'elle sait faire. Demande à la racine : `curl https://api.lumierenoire.test/`."
n3.ada.g.export: "Demande à l'API la liste de ses adresses : `curl https://api.lumierenoire.test/`."
n3.ada.g.export.standard: "Regarde ce que l'API du festival annonce à sa racine, et ce qu'elle laisse lire sans compte."
n3.ada.g.read: "Deux adresses publiques par nature, et un export. Lis-le : `curl https://api.lumierenoire.test/v1/export/benevoles.csv`."
n3.ada.g.read.standard: "Une des adresses annoncées ne devrait pas être publique. Lis-la."
n3.ada.g.report: "Ouvre le rapport : `edit rapports/LN-2028-014.yml`. Gravité `high`, étapes en `commands`, preuve `test-marker`, et `real_data: none`. Enregistre, puis `verify`."
n3.ada.g.report.standard: "Complète `rapports/LN-2028-014.yml` : ce qu'il faut à Malia pour reproduire, et rien qui appartienne à une vraie personne. Puis `verify`. Pour ouvrir le fichier : `edit rapports/LN-2028-014.yml`."
n3.ada.g.send: "Le rapport est prêt. Envoie-le à Malia : `open https://www.lumierenoire.test/securite/triage`, ou `curl -d \"Bonjour, voici mon rapport LN-2028-014\" https://www.lumierenoire.test/securite/triage`."
n3.ada.g.send.standard: "Envoie ton rapport à la personne que le règlement désigne."
n3.ada.g.publish: "C'est une décision, pas une question à piège. Réponds dans la messagerie, ou avec `answer` et la lettre."
n3.ada.g.publish.standard: "À toi de décider."
n3.ada.early: "Elle a raison : on n'envoie pas « j'ai trouvé un truc ». Écris d'abord le rapport, `rapports/LN-2028-014.yml`, puis `verify`."
n3.ada.early.standard: "Malia attend un rapport écrit. Complète-le d'abord."
n3.ada.export: "Un export des bénévoles, lisible sans compte : nom, mail, téléphone, et une colonne `medical_note`. Trois lignes de test sur 412. Tu t'arrêtes là, et tu ne gardes rien : ce que tu viens de voir est une donnée de santé de vraies personnes, la catégorie la plus protégée qui soit."
n3.ada.almost: "Pas encore. Relis ce que `verify` refuse, et demande-toi ce dont Malia a besoin : pouvoir refaire ce que tu as fait, sans recevoir ce que tu n'aurais pas dû garder."
n3.ada.report: "Voilà un rapport qu'on peut traiter. Des commandes à rejouer plutôt qu'un récit, un témoin de test plutôt qu'un fichier de 412 personnes. Si tu avais joint l'export, tu aurais toi-même créé une deuxième fuite, dans une boîte mail."
n3.ada.sent: "Reproduit en dix minutes, export fermé dans l'heure, correction datée, prime annoncée. C'est à ça que ressemble un programme qui marche. Reste sa demande : ne rien publier avant le 4 octobre."
n3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
n3.ada.answer.standard: "Réponds à ma question."
n3.ada.publish: "C'est noté. Dans ce métier, la réputation se fait sur ce genre de décision bien plus que sur la trouvaille elle-même."
n3.ada.breach: "Oui. En France c'est la CNIL, et le délai est de 72 heures à partir du moment où le festival sait. S'il y a un risque élevé pour les bénévoles, et une note médicale en est un, il doit aussi les prévenir eux. Ton rapport vient de démarrer ce chronomètre."
n3.ada.done: "Trois trouvailles signalées, zéro donnée réelle dans ta boîte d'envoi. Ouvre le débrief. Et note le vendredi 22 : le festival nous a demandé de rester joignables la veille de l'ouverture."
n3.soc.export: "api: the volunteer export was read without any sign-in"
n3.hint.export.1: "Tape `curl https://api.lumierenoire.test/`."
n3.hint.export.2: "Tape `curl https://api.lumierenoire.test/v1/export/benevoles.csv`."
n3.hint.report.1: "Tape `edit rapports/LN-2028-014.yml`. Les valeurs possibles sont en commentaire au-dessus de chaque ligne."
n3.hint.report.2: "Une faille qui touche l'argent ou des données personnelles est haute. Malia doit pouvoir rejouer tes commandes. Et le règlement interdit de garder des données réelles."
n3.hint.report.3: "`severity: high`, `steps: commands`, `proof: test-marker`, `real_data: none`. Puis `verify`."
n3.hint.send.1: "Le règlement donne l'adresse : `https://www.lumierenoire.test/securite/triage`."
n3.hint.send.2: "Tape `curl -d \"Bonjour, voici mon rapport LN-2028-014\" https://www.lumierenoire.test/securite/triage`."
n3.debrief.title: "Ce qu'on fait d'une faille"
n3.debrief.lesson: "Trouver n'est que la moitié du travail. L'autre moitié, c'est un rapport que quelqu'un peut reproduire, sans une seule donnée réelle dedans, envoyé à la bonne personne, et une publication qui attend la correction. C'est ce qu'on appelle la divulgation coordonnée."
n3.debrief.p1: "Un bon rapport tient en quatre choses : ce qui est touché, les étapes pour reproduire, une preuve sur des données de test, et la gravité."
n3.debrief.p2: "On ne joint jamais de données réelles à un rapport. La preuve est un témoin, un compte de lignes, une capture masquée."
n3.debrief.p3: "On publie après la correction, avec un délai convenu. Publier avant met en danger les gens qu'on prétend protéger."
n3.debrief.p4: "Pour l'organisation, une fuite de données personnelles ouvre un délai légal : 72 heures pour prévenir l'autorité, et les personnes si le risque est élevé."
