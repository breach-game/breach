n3.briefing: "Wednesday. Two findings in your notes: the ticket readable by its number, the refund after a transfer. They are worth nothing as long as they stay in your notes. The rules give 24 hours to report. Before writing, one last look: there is one address of the programme you have not looked at, the API."
n3.file.report: "# Report to the Lumière Noire programme. Fix each line, then type: verify\nreport: LN-2028-014\nfindings: 3\nseverity: unrated        # low | medium | high\nsteps: none              # none | commands\nproof: full-export       # full-export | test-marker\nreal_data: attached      # attached | none\n"
n3.obj.export: "Look at what the API lets anyone read without an account"
n3.obj.report: "Complete the report `rapports/LN-2028-014.yml`"
n3.obj.send: "Send the report to Malia"
n3.obj.publish: "Decide when to talk about it publicly"
n3.obj.breach: "Say what the festival must do for the volunteers"
n3.check.severity: "The severity is rated, and it is high"
n3.check.steps: "The steps are commands Malia can replay"
n3.check.proof: "The proof is the test marker, not the whole export"
n3.check.data: "No data of a real person is attached"
n3.check.kept: "The report keeps its number and its three findings"
n3.q.publish: "Malia asks you to wait until 4 October before talking about it. Your article is almost written, and it would make noise. What do you decide?"
n3.q.publish.wait: "Wait for the fix, then publish with the festival's agreement"
n3.q.publish.wait.why: "You wait. On 4 October, the article will come out with the date of the report, the date of the fix, and a word from Malia. Nobody will have been exposed for it to exist."
n3.q.publish.early: "Publish tonight: the public has a right to know"
n3.q.publish.early.why: "You publish. The article travels fast. The refund after transfer, though, will only be fixed in ten days: for ten days, the recipe is public and the door is open. The festival removes you from the programme."
n3.q.publish.never: "Never publish anything: the matter stays between the festival and you"
n3.q.publish.never.why: "You publish nothing. That is your right, and the festival will not complain. But other ticket offices have the same flaw, and none will learn from this one. The rules allowed you to write after the fix."
n3.q.breach: "The volunteer export stayed readable without an account for weeks: names, phone numbers, and a medical note. What must the festival do?"
n3.q.breach.nothing: "Nothing: you found it, within the rules, so nobody was harmed"
n3.q.breach.nothing.why: "You are the first to have reported it, not necessarily the first to have read it. What counts is that the data was exposed. The festival must look at its logs to know who else came by."
n3.q.breach.notify: "Document the leak, and notify the data protection authority within 72 hours if there is a risk"
n3.q.breach.silence: "Have you sign a non-disclosure agreement, so that the volunteers never hear of it"
n3.q.breach.silence.why: "The festival's duty is to the people and to the authority, not to you. Your silence does not erase it, and hiding it makes the fault worse."
n3.ada.brief: "An API often starts by saying what it can do. Ask its root: `curl https://api.lumierenoire.test/`."
n3.ada.g.export: "Ask the API for the list of its addresses: `curl https://api.lumierenoire.test/`."
n3.ada.g.export.standard: "Look at what the festival's API announces at its root, and what it lets anyone read without an account."
n3.ada.g.read: "Two addresses that are public by nature, and an export. Read it: `curl https://api.lumierenoire.test/v1/export/benevoles.csv`."
n3.ada.g.read.standard: "One of the announced addresses should not be public. Read it."
n3.ada.g.report: "Open the report: `edit rapports/LN-2028-014.yml`. Severity `high`, steps as `commands`, proof `test-marker`, and `real_data: none`. Save, then `verify`."
n3.ada.g.report.standard: "Complete `rapports/LN-2028-014.yml`: what Malia needs to reproduce, and nothing that belongs to a real person. Then `verify`."
n3.ada.g.send: "The report is ready. Send it to Malia: `open https://www.lumierenoire.test/securite/triage`, or `curl -d \"Bonjour, voici mon rapport LN-2028-014\" https://www.lumierenoire.test/securite/triage`."
n3.ada.g.send.standard: "Send your report to the person the rules name."
n3.ada.g.publish: "This is a decision, not a trick question. Answer in the messaging window, or with `answer` and the letter."
n3.ada.g.publish.standard: "Your call."
n3.ada.early: "She is right: you do not send \"I found something\". Write the report first, `rapports/LN-2028-014.yml`, then `verify`."
n3.ada.early.standard: "Malia expects a written report. Complete it first."
n3.ada.export: "An export of the volunteers, readable without an account: name, mail, phone, and a `medical_note` column. Three test rows out of 412. You stop there, and you keep nothing: what you just saw is health data of real people, the most protected category there is."
n3.ada.almost: "Not yet. Read again what `verify` refuses, and ask yourself what Malia needs: to be able to redo what you did, without receiving what you should not have kept."
n3.ada.report: "Here is a report that can be handled. Commands to replay rather than a story, a test marker rather than a file of 412 people. Had you attached the export, you would have created a second leak yourself, in a mailbox."
n3.ada.sent: "Reproduced in ten minutes, export closed within the hour, a dated fix, a reward announced. That is what a working programme looks like. Her request remains: publish nothing before 4 October."
n3.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
n3.ada.answer.standard: "Answer my question."
n3.ada.publish: "Noted. In this trade, a reputation is made on this kind of decision far more than on the finding itself."
n3.ada.breach: "Yes. In France that authority is the CNIL, and the deadline is 72 hours from the moment the festival knows. If the risk for the volunteers is high, and a medical note is one, it must warn them too. Your report just started that clock."
n3.ada.done: "Three findings reported, zero real data in your outbox. Open the debrief. And mark Friday the 22nd: the festival asked us to stay reachable the day before the gates open."
n3.soc.export: "api: the volunteer export was read without any sign-in"
n3.hint.export.1: "Type `curl https://api.lumierenoire.test/`."
n3.hint.export.2: "Type `curl https://api.lumierenoire.test/v1/export/benevoles.csv`."
n3.hint.report.1: "Type `edit rapports/LN-2028-014.yml`. The possible values are in a comment at the end of each line."
n3.hint.report.2: "A flaw that touches money or personal data is high. Malia must be able to replay your commands. And the rules forbid keeping real data."
n3.hint.report.3: "`severity: high`, `steps: commands`, `proof: test-marker`, `real_data: none`. Then `verify`."
n3.hint.send.1: "The rules give the address: `https://www.lumierenoire.test/securite/triage`."
n3.hint.send.2: "Type `curl -d \"Bonjour, voici mon rapport LN-2028-014\" https://www.lumierenoire.test/securite/triage`."
n3.debrief.title: "What you do with a flaw"
n3.debrief.lesson: "Finding is only half the work. The other half is a report someone can reproduce, with not a single piece of real data in it, sent to the right person, and a publication that waits for the fix. That is what coordinated disclosure means."
n3.debrief.p1: "A good report holds four things: what is affected, the steps to reproduce, a proof on test data, and the severity."
n3.debrief.p2: "Never attach real data to a report. The proof is a marker, a count of rows, a masked screenshot."
n3.debrief.p3: "Publish after the fix, with an agreed delay. Publishing before endangers the people you claim to protect."
n3.debrief.p4: "For the organisation, a leak of personal data opens a legal deadline: 72 hours to notify the authority, and the people if the risk is high."
