c4.briefing: "Jeudi 16 septembre. La mairie a rouvert mardi. Les agents ressaisissent ce qui a été perdu, et Yanis Morel dort à nouveau. Avant de rendre le mandat, il reste deux choses à lui laisser : une alarme qui aurait sonné lundi, et un plan de sauvegarde qui ne repose plus sur la chance."
c4.file.rule: "# Règle de détection, à essayer avec : rule test regles/compte-service.yml\n# Une ligne par condition. Champs du journal auth : user, result, method, src.\ntitle: Connexion du compte de sauvegarde\nsource: auth\nuser: svc-sauvegarde\n"
c4.obj.detect: "Écrire la règle qui détecte l'usage anormal du compte de sauvegarde, sans fausse alerte"
c4.obj.harden: "Corriger le plan de sauvegarde de la mairie"
c4.obj.lesson: "Dire ce qui aurait arrêté l'intrus dès vendredi"
c4.check.key: "Le compte de service se connecte par clé, plus par mot de passe"
c4.check.origin: "Le compte de service n'est accepté que depuis le serveur de sauvegarde"
c4.check.drill: "Une restauration est testée chaque mois"
c4.check.mfa: "La messagerie des agents demande un second facteur"
c4.check.kept: "La sauvegarde de nuit et la copie hors ligne sont toujours prévues"
c4.q.lesson: "Qu'est-ce qui aurait arrêté l'intrus vendredi à 16 h 40, avant tout le reste ?"
c4.q.lesson.mfa: "Un second facteur sur les comptes des agents : le mot de passe volé n'aurait rien ouvert seul"
c4.q.lesson.antivirus: "Un antivirus plus récent sur le poste de l'accueil, qui aurait bloqué la pièce jointe"
c4.q.lesson.antivirus.why: "La pièce jointe ne contenait aucun programme : elle menait à une fausse page, où Brigitte a tapé un vrai mot de passe. Il n'y avait rien à bloquer sur le poste."
c4.q.lesson.forbid: "Une note interdisant aux agents d'ouvrir les pièces jointes des courriels"
c4.q.lesson.forbid.why: "Ouvrir des pièces jointes, c'est le travail de l'accueil. Une règle que personne ne peut suivre ne protège personne, et elle apprend surtout à ne rien dire quand on l'a enfreinte."
c4.ada.brief: "On ne refait pas lundi, on s'en sert. J'ai rejoué sur un banc d'essai les deux connexions de l'intrus, au milieu de l'activité ordinaire de la mairie. Yanis a commencé une règle de détection et m'a envoyé son plan de sauvegarde. Les deux sont dans ton dossier personnel."
c4.ada.g.detect: "Lis la règle de Yanis, `cat regles/compte-service.yml`, puis essaie-la contre les journaux : `rule test regles/compte-service.yml`."
c4.ada.g.detect.standard: "Une règle de détection t'attend dans `regles/`. `rule test <fichier>` l'essaie contre les journaux et compte ce qu'elle attrape."
c4.ada.g.false: "Elle attrape l'intrus, et aussi chaque sauvegarde de nuit : les lignes marquées « ? ». Une alarme qui sonne toutes les nuits, on finit par la couper. Qu'est-ce qui distingue l'intrus ? Il tape un mot de passe, la sauvegarde présente une clé. Ajoute la condition : `echo \"method: password\" >> regles/compte-service.yml`, puis relance le test."
c4.ada.g.false.standard: "Elle sonne aussi sur l'activité normale, les lignes marquées « ? ». Compare une ligne de l'intrus et une ligne ordinaire du même compte, et ajoute la condition qui les sépare."
c4.ada.g.missed: "Plus de fausse alerte, mais une connexion de l'intrus t'échappe. Il a rebondi : la seconde connexion ne vient pas du poste de l'accueil. Ne te fie pas à l'adresse, fie-toi à ce qui ne change pas : ce compte, avec un mot de passe."
c4.ada.g.missed.standard: "Plus de fausse alerte, mais il te manque une ligne de l'intrus. Qu'ont en commun ses deux connexions, que l'activité normale n'a jamais ?"
c4.ada.detect: "Voilà. Deux alertes, deux connexions de l'intrus, et le silence toutes les autres nuits. Avec cette règle, Yanis aurait été réveillé vendredi soir, pas lundi matin."
c4.ada.g.harden: "Maintenant le plan : `edit dossier/plan-sauvegarde.yml`. Quatre lignes ont permis lundi. Le compte de service doit se connecter par clé (`connexion: cle`), seulement depuis le serveur de sauvegarde (`origine: sauvegarde.corbelle.test`), une restauration doit être testée chaque mois (`test_restauration: mensuel`), et la messagerie doit demander un second facteur (`second_facteur: oui`). Puis `verify`."
c4.ada.g.harden.standard: "Ouvre `dossier/plan-sauvegarde.yml` et corrige ce qui a permis lundi. `verify` te dit ce qui manque encore."
c4.ada.harden: "Ce plan-là, l'intrus de lundi s'y serait cassé les dents trois fois. Une dernière question."
c4.ada.g.lesson: "Réponds dans la messagerie ou avec `answer`."
c4.ada.done: "Mandat CB-2027-003 terminé. La mairie de Corbelle repart avec une alarme, un plan, et un informaticien qui sait désormais restaurer."
c4.ada.echo: "Avant le débrief, voici ce que sont devenus tes conseils à la maire."
c4.end.ransom.pay: "La rançon. La mairie a payé. La clé est arrivée mardi soir et n'a rouvert qu'une partie des fichiers : c'est ta restauration qui a rendu les autres. Les 80 000 euros sont partis, et Corbelle figure désormais sur une liste de communes qui paient."
c4.end.ransom.refuse: "La rançon. La mairie n'a rien versé. Le délai de 72 heures est passé sans que rien n'arrive : il n'y avait plus rien à verrouiller, et tout était déjà restauré."
c4.end.ransom.stall: "La rançon. La mairie n'a jamais répondu à la note. Quand le délai a expiré, les dossiers étaient revenus depuis deux jours, et il n'y avait plus personne à qui parler."
c4.end.comms.silence: "La parole. Le Courrier de Corbelle a titré « Ce que la mairie ne dit pas ». La maire a passé le conseil municipal à démentir des rumeurs plus graves que la vérité."
c4.end.comms.plain: "La parole. Le Courrier de Corbelle a publié le communiqué presque mot pour mot, et deux communes voisines ont appelé pour demander comment vous aviez fait."
c4.end.comms.blame: "La parole. Brigitte Lemaire est en arrêt. Mercredi, un agent de l'urbanisme a cliqué sur un courriel douteux et n'en a parlé à personne. On l'a su par hasard."
c4.end.notify.now: "Les autorités. La déclaration faite lundi a été complétée hier, sans une remarque. Les enquêteurs ont récupéré l'adresse du relais dès mardi."
c4.end.notify.later: "Les autorités. La déclaration est partie avec un jour de retard, accompagnée d'une lettre d'explication que la maire a dû signer elle-même."
c4.ada.end: "Tu as passé une saison sans rien casser, et c'était peut-être la plus difficile. Attaquer, c'est trouver une porte. Défendre, c'est décider vite avec la moitié des informations, puis recommencer le lendemain. Passe au débrief."
c4.hint.detect.1: "`rule test regles/compte-service.yml` montre les lignes que la règle attrape : « ! » pour l'intrus, « ? » pour l'activité ordinaire."
c4.hint.detect.2: "Les sauvegardes de nuit se connectent avec `method: publickey`, l'intrus avec `method: password`."
c4.hint.detect.3: "`echo \"method: password\" >> regles/compte-service.yml`, puis `rule test regles/compte-service.yml`."
c4.hint.harden.1: "`verify` liste ce que le plan doit garantir. `edit dossier/plan-sauvegarde.yml` ouvre l'éditeur."
c4.hint.harden.2: "Les valeurs attendues : `connexion: cle`, `origine: sauvegarde.corbelle.test`, `test_restauration: mensuel`, `second_facteur: oui`."
c4.hint.harden.3: "Par exemple : `sed -i 's/connexion: mot-de-passe/connexion: cle/' dossier/plan-sauvegarde.yml`, et de même pour les trois autres lignes."
c4.hint.lesson.1: "Relis ce que Brigitte a fait vendredi : aucun programme ne s'est lancé sur son poste. Elle a donné un mot de passe."
c4.debrief.title: "Ce qui reste après la crise"
c4.debrief.lesson: "Une crise se termine deux fois : quand les services reviennent, puis quand la même attaque ne peut plus réussir. La seconde fin est la seule qui compte. Elle tient en peu de choses : un second facteur, un compte de service qui n'a qu'une origine et pas de mot de passe, une alarme sur ce qui ne devrait jamais arriver, et des sauvegardes qu'on a déjà vues marcher."
c4.debrief.p1: "Une bonne règle de détection décrit ce qui ne doit jamais arriver, pas ce qui arrive chaque nuit. Zéro fausse alerte, sinon personne ne la lit."
c4.debrief.p2: "Un compte de service : une clé, une seule origine, aucun mot de passe écrit dans un script."
c4.debrief.p3: "Sauvegardes : plusieurs copies, dont une hors ligne, plusieurs générations, et une restauration testée régulièrement."
c4.debrief.p4: "Le second facteur est la mesure la moins chère de toute cette histoire, et celle qui l'aurait empêchée."
