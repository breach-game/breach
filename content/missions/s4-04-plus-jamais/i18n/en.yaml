c4.briefing: "Thursday 16 September. The town hall reopened on Tuesday. The staff are typing in again what was lost, and Yanis Morel is sleeping again. Before handing back the mandate, two things are left to give him: an alarm that would have rung on Monday, and a backup plan that no longer rests on luck."
c4.file.rule: "# Detection rule, to try with: rule test regles/compte-service.yml\n# One line per condition. Fields of the auth log: user, result, method, src.\ntitle: Backup account login\nsource: auth\nuser: svc-sauvegarde\n"
c4.obj.detect: "Write the rule that detects abnormal use of the backup account, with no false alert"
c4.obj.harden: "Fix the town hall's backup plan"
c4.obj.lesson: "Say what would have stopped the intruder on Friday"
c4.check.key: "The service account logs in by key, no longer by password"
c4.check.origin: "The service account is accepted from the backup server only"
c4.check.drill: "A restore is tested every month"
c4.check.mfa: "The staff mailbox asks for a second factor"
c4.check.kept: "The nightly backup and the offline copy are still planned"
c4.q.lesson: "What would have stopped the intruder on Friday at 4:40 pm, before everything else?"
c4.q.lesson.mfa: "A second factor on staff accounts: the stolen password alone would have opened nothing"
c4.q.lesson.antivirus: "A more recent antivirus on the front desk workstation, which would have blocked the attachment"
c4.q.lesson.antivirus.why: "The attachment held no program: it led to a fake page, where Brigitte typed a real password. There was nothing to block on the workstation."
c4.q.lesson.forbid: "A memo forbidding staff to open email attachments"
c4.q.lesson.forbid.why: "Opening attachments is the front desk's job. A rule nobody can follow protects nobody, and mostly teaches people to keep quiet once they have broken it."
c4.ada.brief: "We do not redo Monday, we use it. On a test bench I replayed the intruder's two logins, in the middle of the town hall's ordinary activity. Yanis started a detection rule and sent me his backup plan. Both are in your home directory."
c4.ada.g.detect: "Read Yanis's rule, `cat regles/compte-service.yml`, then try it against the logs: `rule test regles/compte-service.yml`."
c4.ada.g.detect.standard: "A detection rule is waiting for you in `regles/`. `rule test <file>` tries it against the logs and counts what it catches."
c4.ada.g.false: "It catches the intruder, and every nightly backup too: the lines marked \"?\". An alarm that rings every night ends up switched off. What sets the intruder apart? He types a password, the backup presents a key. Add the condition: `echo \"method: password\" >> regles/compte-service.yml`, then run the test again."
c4.ada.g.false.standard: "It also rings on normal activity, the lines marked \"?\". Compare a line of the intruder with an ordinary line of the same account, and add the condition that separates them."
c4.ada.g.missed: "No more false alerts, but one of the intruder's logins escapes you. He hopped: the second login does not come from the front desk workstation. Do not trust the address, trust what does not change: this account, with a password."
c4.ada.g.missed.standard: "No more false alerts, but you are missing one of the intruder's lines. What do his two logins share, that normal activity never has?"
c4.ada.detect: "There. Two alerts, two logins of the intruder, and silence every other night. With this rule Yanis would have been woken on Friday evening, not on Monday morning."
c4.ada.g.harden: "Now the plan: `edit dossier/plan-sauvegarde.yml`. Four lines made Monday possible. The service account must log in by key (`connexion: cle`), from the backup server only (`origine: sauvegarde.corbelle.test`), a restore must be tested every month (`test_restauration: mensuel`), and the mailbox must ask for a second factor (`second_facteur: oui`). Then `verify`."
c4.ada.g.harden.standard: "Open `dossier/plan-sauvegarde.yml` and fix what made Monday possible. `verify` tells you what is still missing."
c4.ada.harden: "Against that plan, Monday's intruder would have failed three times over. One last question."
c4.ada.g.lesson: "Answer in the messenger or with `answer`."
c4.ada.done: "Mandate CB-2027-003 is over. Corbelle's town hall leaves with an alarm, a plan, and an IT man who now knows how to restore."
c4.ada.echo: "Before the debrief, here is what became of your advice to the mayor."
c4.end.ransom.pay: "The ransom. The town hall paid. The key arrived on Tuesday evening and reopened only part of the files: your restore gave back the others. The 80,000 euros are gone, and Corbelle is now on a list of towns that pay."
c4.end.ransom.refuse: "The ransom. The town hall paid nothing. The 72 hours went by and nothing happened: there was nothing left to lock, and everything was already restored."
c4.end.ransom.stall: "The ransom. The town hall never answered the note. When the deadline expired, the folders had been back for two days, and there was nobody left to talk to."
c4.end.comms.silence: "What was said. The Corbelle Courier ran the headline \"What the town hall is not saying\". The mayor spent the council meeting denying rumours worse than the truth."
c4.end.comms.plain: "What was said. The Corbelle Courier printed the statement almost word for word, and two neighbouring towns called to ask how you had done it."
c4.end.comms.blame: "What was said. Brigitte Lemaire is on sick leave. On Wednesday a planning officer clicked on a dubious email and told nobody. We found out by chance."
c4.end.notify.now: "The authorities. Monday's notification was completed yesterday, without a remark. The investigators had the relay's address by Tuesday."
c4.end.notify.later: "The authorities. The notification went out a day late, with a letter of explanation the mayor had to sign herself."
c4.ada.end: "You spent a season breaking nothing, and it may have been the hardest one. Attacking is finding a door. Defending is deciding fast with half the information, then doing it again the next day. Go to the debrief."
c4.hint.detect.1: "`rule test regles/compte-service.yml` shows the lines the rule catches: \"!\" for the intruder, \"?\" for ordinary activity."
c4.hint.detect.2: "Nightly backups log in with `method: publickey`, the intruder with `method: password`."
c4.hint.detect.3: "`echo \"method: password\" >> regles/compte-service.yml`, then `rule test regles/compte-service.yml`."
c4.hint.harden.1: "`verify` lists what the plan must guarantee. `edit dossier/plan-sauvegarde.yml` opens the editor."
c4.hint.harden.2: "The expected values: `connexion: cle`, `origine: sauvegarde.corbelle.test`, `test_restauration: mensuel`, `second_facteur: oui`."
c4.hint.harden.3: "For example: `sed -i 's/connexion: mot-de-passe/connexion: cle/' dossier/plan-sauvegarde.yml`, and the same for the other three lines."
c4.hint.lesson.1: "Read again what Brigitte did on Friday: no program ran on her workstation. She gave away a password."
c4.debrief.title: "What is left after the crisis"
c4.debrief.lesson: "A crisis ends twice: when the services come back, then when the same attack can no longer succeed. The second ending is the only one that counts. It comes down to few things: a second factor, a service account with one origin and no password, an alarm on what should never happen, and backups you have already seen work."
c4.debrief.p1: "A good detection rule describes what must never happen, not what happens every night. Zero false alerts, or nobody reads it."
c4.debrief.p2: "A service account: one key, one origin, no password written in a script."
c4.debrief.p3: "Backups: several copies, one of them offline, several generations, and a restore tested regularly."
c4.debrief.p4: "The second factor is the cheapest measure in this whole story, and the one that would have prevented it."
