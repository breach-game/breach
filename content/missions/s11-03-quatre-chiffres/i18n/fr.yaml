c3.briefing: "Mercredi, 2 h 10. Cette nuit tu es dans l'équipe d'Inès, côté défense. Chez Comptoir, on se connecte avec son numéro de client puis un code à quatre chiffres reçu par SMS. Depuis quelques minutes, la passerelle voit des codes faux arriver sur un même compte. `soc` lit ses journaux, `contain` et `flag` agissent. La banque doit rester ouverte : des clients paient leur taxi en ce moment."
c3.obj.target: "Trouver le compte visé"
c3.obj.cut: "Arrêter la série d'essais"
c3.obj.limit: "Allumer la limite d'essais"
c3.obj.rule: "Écrire la règle qui compte par compte"
c3.obj.why: "Expliquer pourquoi compter par compte"
c3.file.rule: "# Règle de détection, à essayer avec : rule test regles/otp.yml\n# Une ligne par condition. Champs du journal access : src, method, path, status.\n# Modificateurs : |contains, |startswith, |endswith.\n# Pour compter : count|gte: N, within: minutes, by: champ (par défaut src).\ntitle: Codes SMS essayés en série\nsource: access\npath|startswith: /v2/otp/\nstatus: 401\n"
c3.contain.address: "Bloquer l'adresse 203.0.113.21 à la passerelle"
c3.contain.freeze: "Geler la connexion du client 1017 jusqu'à ce qu'il rappelle le service client"
c3.contain.api: "Couper l'API du reste du monde (plus aucune appli ne fonctionne)"
c3.alert.failures: "Codes refusés en série sur un même compte"
c3.alert.failures.why: "Un client se trompe une fois, deux fois. Pas dix fois depuis dix adresses."
c3.q.customer: "Quel numéro de client est visé ?"
c3.q.why: "Pourquoi compter les essais par compte, et pas par adresse ?"
c3.q.why.account: "Chaque essai vient d'une autre adresse, seul le compte reste."
c3.q.why.privacy: "Une adresse est une donnée personnelle, on ne la compte pas."
c3.q.why.privacy.why: "La passerelle journalise déjà les adresses, légitimement, pour se défendre. Le problème est ailleurs : compter par adresse ne voit rien quand chaque essai en change."
c3.q.why.cost: "Compter par adresse coûterait trop cher en calcul."
c3.q.why.cost.why: "Les deux comptages coûtent pareil. La différence est dans ce qu'ils voient : par adresse, chaque essai est le premier."
c3.ada.brief: "Bonsoir. Regarde ce que la passerelle enregistre : `soc sources`, puis ce qui sonne : `soc alerts`."
c3.ada.g.target: "Commence par `soc sources`, puis `soc alerts`, puis lis le journal : `soc logs api access`. Le numéro du client est dans le chemin des lignes `401`. Réponds avec `answer customer <numéro>`."
c3.ada.g.target.standard: "Lis les alertes et le journal `access` de l'API. Le compte visé est dans le chemin. Réponds avec `answer customer`."
c3.ada.target: "Le 1017. Regarde la colonne des adresses : pas deux fois la même. Quelqu'un loue un réseau de machines pour que chaque essai ait l'air d'un client différent. Et regarde ce qui manque : après dix codes faux, la passerelle répond toujours 401, « réessayez ». Quatre chiffres, dix mille possibilités, et personne ne compte."
c3.ada.t5: "Cinq essais. Il n'a pas besoin de chance, seulement de temps : dix mille codes, c'est une affaire de minutes pour un programme. `contain` et `flag list` te montrent ce que tu peux faire."
c3.ada.t8: "Huit. Le suivant peut être le bon. Arrête ça : gèle la connexion du 1017 avec `contain`, ou cherche mieux dans `flag list`."
c3.ada.fail: "Code accepté. Quelqu'un est connecté au compte du client 1017 et peut ordonner des virements. On reprend à 2 h 10."
c3.ada.address: "Bloquée, et inutile : cette adresse n'a servi qu'une fois, la suivante est déjà différente. Regarde les lignes, pas une seule adresse ne revient."
c3.ada.freeze: "La connexion du 1017 est gelée : plus aucun code n'est accepté sur ce compte, bon ou mauvais. Le client devra appeler demain matin, c'est le prix. Les autres comptes, eux, n'ont toujours aucune limite."
c3.ada.api: "Plus personne n'entre, lui compris. Et plus personne ne paie son taxi. C'est la mesure de quand on ne comprend pas ce qui se passe, et tu avais compris."
c3.ada.g.cut: "`contain` liste les mesures. Au plus près : gèle la connexion du compte visé avec `contain disable connexion-1017`."
c3.ada.g.cut.standard: "Arrête la série avec `contain` ou avec un réglage de `flag list`, sans fermer la banque."
c3.ada.stopped: "Refusé, et cette fois sans « réessayez ». La série s'arrête."
c3.ada.g.limit: "Un compte est à l'abri, les autres n'ont toujours aucune limite. Regarde les réglages : `flag list`, puis allume la limite pour tous : `flag set otp.essais-max on`."
c3.ada.g.limit.standard: "Un réglage de `flag list` limite le nombre d'essais par compte. Allume-le."
c3.ada.limit: "Cinq essais par compte, puis le code est annulé et il faut en redemander un. Dix mille possibilités deviennent cinq chances sur dix mille. Le réglage existait depuis le premier jour, éteint : quelqu'un avait eu peur de gêner les clients qui se trompent."
c3.ada.g.rule: "Lis la règle : `cat regles/otp.yml`, essaie-la : `rule test regles/otp.yml`. Elle sonne pour chaque client qui se trompe une fois. Fais-la compter : `echo \"count|gte: 3\" >> regles/otp.yml`, `echo \"within: 10\" >> regles/otp.yml`, `echo \"by: path\" >> regles/otp.yml`, puis teste."
c3.ada.g.rule.standard: "La règle `regles/otp.yml` sonne à chaque code faux. Fais-la compter, et choisis bien par quoi elle regroupe. Puis `rule test`."
c3.ada.g.count: "Regarde ce que dit le test. Une faute de frappe n'est pas une attaque : il faut compter (`count|gte: 3`, `within: 10`). Et compter par adresse ne voit rien ici : regroupe par compte visé, donc par chemin (`by: path`)."
c3.ada.rule: "Des codes faux en série sur le même compte, d'où qu'ils viennent : le client distrait ne la déclenche pas, la série oui."
c3.ada.g.why: "Réponds à ma question sur le comptage."
c3.ada.why: "Oui. Une limite ou une alerte compte ce que l'attaquant ne peut pas changer. Il change d'adresse pour quelques centimes. Il ne peut pas changer de cible."
c3.ada.done.frozen: "Le client 1017 dort. Demain il appellera pour sa connexion gelée, et apprendra qu'il s'en est fallu d'un réglage. Inès veut passer le code à six chiffres et proposer une clé d'accès dans l'appli. Va dormir. Demain on retourne de l'autre côté : il y a une page pour les partenaires que j'aimerais te montrer."
c3.ada.done: "Le client 1017 dort, et ne saura jamais qu'il s'en est fallu d'un réglage. Inès veut passer le code à six chiffres et proposer une clé d'accès dans l'appli. Va dormir. Demain on retourne de l'autre côté : il y a une page pour les partenaires que j'aimerais te montrer."
c3.hint.target.1: "`soc logs api access` : cherche les lignes `POST /v2/otp/...` qui répondent 401."
c3.hint.target.2: "Tape `answer customer 1017`."
c3.hint.cut.1: "Bloquer une adresse ne sert à rien : elles changent à chaque essai. `flag list` montre un réglage éteint."
c3.hint.cut.2: "Tape `contain disable connexion-1017`. Un réglage de `flag list` fait encore mieux."
c3.hint.limit.1: "`flag list` montre `otp.essais-max`, éteint."
c3.hint.limit.2: "Tape `flag set otp.essais-max on`."
c3.hint.rule.1: "`rule test regles/otp.yml` dit sur quelles lignes ordinaires la règle sonne : les fautes de frappe."
c3.hint.rule.2: "Ajoute un seuil : `count|gte: 3` et `within: 10`. Par défaut on compte par adresse (`src`), ce qui ne voit rien ici."
c3.hint.rule.3: "Ajoute les trois lignes `count|gte: 3`, `within: 10`, `by: path` avec `echo \"...\" >> regles/otp.yml`, puis `rule test regles/otp.yml`."
c3.hint.why.1: "L'attaquant change d'adresse à chaque essai, jamais de compte. Tape `answer account`."
c3.debrief.title: "Compter ce que l'attaquant ne peut pas changer"
c3.debrief.lesson: "Un code à quatre chiffres, c'est dix mille possibilités. Sans limite d'essais, un programme les parcourt en quelques minutes, une adresse par essai pour ne pas se faire remarquer. La limite existait, éteinte. Tu as arrêté la série sans fermer la banque."
c3.debrief.p1: "Tout code à usage unique a une limite d'essais par compte, puis il est annulé."
c3.debrief.p2: "On limite et on alerte par cible (compte, numéro de client), pas seulement par adresse d'origine."
c3.debrief.p3: "Un code court envoyé par SMS est le plus faible des seconds facteurs. Une clé d'accès ou une application résistent à cette attaque."
c3.debrief.p4: "On coupe au plus près : un compte gelé vaut mieux qu'une banque fermée, une limite pour tous vaut mieux que les deux."
