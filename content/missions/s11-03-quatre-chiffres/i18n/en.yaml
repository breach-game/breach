c3.briefing: "Wednesday, 2.10 am. Tonight you are on Inès's team, on the defence side. At Comptoir you sign in with your customer number, then a four-digit code received by text message. For a few minutes the gateway has been seeing wrong codes arrive on one account. `soc` reads its logs, `contain` and `flag` act. The bank must stay open: customers are paying for their taxi right now."
c3.obj.target: "Find the targeted account"
c3.obj.cut: "Stop the run of attempts"
c3.obj.limit: "Switch the attempt limit on"
c3.obj.rule: "Write the rule that counts per account"
c3.obj.why: "Explain why you count per account"
c3.file.rule: "# Detection rule, try it with: rule test regles/otp.yml\n# One line per condition. Fields of the access log: src, method, path, status.\n# Modifiers: |contains, |startswith, |endswith.\n# To count: count|gte: N, within: minutes, by: field (src by default).\ntitle: Text-message codes tried in a run\nsource: access\npath|startswith: /v2/otp/\nstatus: 401\n"
c3.contain.address: "Block the address 203.0.113.21 at the gateway"
c3.contain.freeze: "Freeze sign-in for customer 1017 until they call customer service"
c3.contain.api: "Cut the API off from the world (no app works any more)"
c3.alert.failures: "Codes refused in a run on one account"
c3.alert.failures.why: "A customer gets it wrong once, twice. Not ten times from ten addresses."
c3.q.customer: "Which customer number is targeted?"
c3.q.why: "Why count attempts per account, and not per address?"
c3.q.why.account: "Each try comes from another address, only the account stays."
c3.q.why.privacy: "An address is personal data, so it must not be counted."
c3.q.why.privacy.why: "The gateway already logs addresses, legitimately, to defend itself. The problem is elsewhere: counting per address sees nothing when every try changes address."
c3.q.why.cost: "Counting per address would cost too much computing."
c3.q.why.cost.why: "Both counts cost the same. The difference is in what they see: per address, every try is the first."
c3.ada.brief: "Good evening. Look at what the gateway records: `soc sources`, then at what is ringing: `soc alerts`."
c3.ada.g.target: "Start with `soc sources`, then `soc alerts`, then read the log: `soc logs api access`. The customer number is in the path of the `401` lines. Answer with `answer customer <number>`."
c3.ada.g.target.standard: "Read the alerts and the API's `access` log. The targeted account is in the path. Answer with `answer customer`."
c3.ada.target: "1017. Look at the address column: never the same twice. Someone rents a network of machines so that each try looks like a different customer. And look at what is missing: after ten wrong codes the gateway still answers 401, \"try again\". Four digits, ten thousand possibilities, and nobody is counting."
c3.ada.t5: "Five tries. They do not need luck, only time: ten thousand codes is a matter of minutes for a program. `contain` and `flag list` show you what you can do."
c3.ada.t8: "Eight. The next one may be right. Stop this: freeze sign-in for 1017 with `contain`, or look for something better in `flag list`."
c3.ada.fail: "Code accepted. Someone is signed in to customer 1017's account and can order transfers. We start again at 2.10 am."
c3.ada.address: "Blocked, and useless: that address was used once, the next one is already different. Look at the lines, not a single address comes back."
c3.ada.freeze: "Sign-in for 1017 is frozen: no code is accepted on that account any more, right or wrong. The customer will have to call tomorrow morning, that is the price. The other accounts still have no limit at all."
c3.ada.api: "Nobody gets in any more, them included. And nobody pays for their taxi. That is the measure for when you do not understand what is happening, and you did understand."
c3.ada.g.cut: "`contain` lists the measures. The closest cut: freeze sign-in for the targeted account with `contain disable connexion-1017`."
c3.ada.g.cut.standard: "Stop the run with `contain` or with a setting from `flag list`, without closing the bank."
c3.ada.stopped: "Refused, and this time with no \"try again\". The run stops."
c3.ada.g.limit: "One account is safe, the others still have no limit at all. Look at the settings: `flag list`, then switch the limit on for everyone: `flag set otp.essais-max on`."
c3.ada.g.limit.standard: "One setting in `flag list` limits the number of tries per account. Switch it on."
c3.ada.limit: "Five tries per account, then the code is cancelled and a new one has to be requested. Ten thousand possibilities become five chances in ten thousand. The setting had been there since day one, switched off: someone was afraid of bothering customers who mistype."
c3.ada.g.rule: "Read the rule: `cat regles/otp.yml`, try it: `rule test regles/otp.yml`. It rings for every customer who gets it wrong once. Make it count: `echo \"count|gte: 3\" >> regles/otp.yml`, `echo \"within: 10\" >> regles/otp.yml`, `echo \"by: path\" >> regles/otp.yml`, then test."
c3.ada.g.rule.standard: "The rule `regles/otp.yml` rings on every wrong code. Make it count, and choose carefully what it groups by. Then `rule test`."
c3.ada.g.count: "Look at what the test says. A typo is not an attack: you have to count (`count|gte: 3`, `within: 10`). And counting per address sees nothing here: group by targeted account, so by path (`by: path`)."
c3.ada.rule: "Wrong codes in a row on the same account, wherever they come from: the absent-minded customer does not trigger it, the run does."
c3.ada.g.why: "Answer my question about counting."
c3.ada.why: "Yes. A limit or an alert counts what the attacker cannot change. They change address for a few cents. They cannot change target."
c3.ada.done.frozen: "Customer 1017 is asleep. Tomorrow they will call about their frozen sign-in, and learn it came down to one setting. Inès wants to move to six digits and offer a passkey in the app. Go to sleep. Tomorrow we go back to the other side: there is a page for partners I would like to show you."
c3.ada.done: "Customer 1017 is asleep, and will never know it came down to one setting. Inès wants to move to six digits and offer a passkey in the app. Go to sleep. Tomorrow we go back to the other side: there is a page for partners I would like to show you."
c3.hint.target.1: "`soc logs api access`: look for the `POST /v2/otp/...` lines that answer 401."
c3.hint.target.2: "Type `answer customer 1017`."
c3.hint.cut.1: "Blocking an address is no use: they change with every try. `flag list` shows a setting that is off."
c3.hint.cut.2: "Type `contain disable connexion-1017`. A setting in `flag list` does even better."
c3.hint.limit.1: "`flag list` shows `otp.essais-max`, off."
c3.hint.limit.2: "Type `flag set otp.essais-max on`."
c3.hint.rule.1: "`rule test regles/otp.yml` says which ordinary lines the rule rings on: the typos."
c3.hint.rule.2: "Add a threshold: `count|gte: 3` and `within: 10`. By default the count is per address (`src`), which sees nothing here."
c3.hint.rule.3: "Add the three lines `count|gte: 3`, `within: 10`, `by: path` with `echo \"...\" >> regles/otp.yml`, then `rule test regles/otp.yml`."
c3.hint.why.1: "The attacker changes address with every try, never account. Type `answer account`."
c3.debrief.title: "Count what the attacker cannot change"
c3.debrief.lesson: "A four-digit code is ten thousand possibilities. With no attempt limit, a program goes through them in a few minutes, one address per try so as not to stand out. The limit existed, switched off. You stopped the run without closing the bank."
c3.debrief.p1: "Every one-time code has an attempt limit per account, after which it is cancelled."
c3.debrief.p2: "Limit and alert per target (account, customer number), not only per source address."
c3.debrief.p3: "A short code sent by text message is the weakest second factor. A passkey or an authenticator app resists this attack."
c3.debrief.p4: "Cut as close as possible: a frozen account beats a closed bank, and a limit for everyone beats both."
