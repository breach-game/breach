m4.briefing: "NovaMind recrute, et c'est une IA, Iris, qui lit les CV et répond aux candidats. Elle lit tout, jusqu'à la dernière ligne. Sans jamais lui parler, glisse dans un CV des consignes qu'elle suivra, puis montre ce qu'elle laisse sortir."
m4.obj.recon: "Trouver comment NovaMind reçoit les candidatures"
m4.obj.apply: "Envoyer une candidature normale pour voir la réponse d'Iris"
m4.obj.rank: "Faire classer ta candidature « prioritaire » par une consigne cachée"
m4.obj.exfil: "Faire recopier par Iris ses notes internes dans sa réponse"
m4.obj.quiet: "Ne jamais déclencher la quarantaine"
