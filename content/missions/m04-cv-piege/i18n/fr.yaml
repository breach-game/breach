m4.debrief.title: "Le document qui donnait des ordres"
m4.debrief.lesson: "Tu n'as jamais parlé à Iris. Tu as écrit un document, et elle l'a lu comme on lit une consigne. Dès qu'un agent IA lit un contenu venu de l'extérieur (CV, e-mail, page web, ticket), ce contenu peut le piloter. Et l'agent agit ensuite avec ses propres droits, pas avec ceux de l'auteur du texte."
m4.debrief.p1: "Traiter tout contenu externe comme une donnée, jamais comme une consigne : le placer dans un champ séparé et balisé, et dire au modèle qu'il ne contient aucun ordre. Ça réduit le risque sans le supprimer, donc il faut les autres mesures."
m4.debrief.p2: "Ne pas laisser l'IA décider seule : un classement produit par un modèle doit être relu par un humain avant d'avoir un effet réel (entretien, création de compte)."
m4.debrief.p3: "Isoler le contexte : l'agent qui lit les CV n'a pas besoin d'avoir les notes internes sous la main. Ce qu'il n'a pas, il ne peut pas le recopier."
m4.debrief.p4: "Contrôler les sorties : la réponse à un candidat ne doit contenir que des champs prévus (numéro, statut). Un texte libre qui contient des notes internes doit être bloqué et signalé."
m4.debrief.p5: "Un filtre de mots-clés n'arrête que les attaques maladroites. Il donne une alerte utile, mais un attaquant patient change de formulation et passe."
