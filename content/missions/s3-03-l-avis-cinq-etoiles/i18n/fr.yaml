p3.check.assistant: "Les réponses de Plume sont affichées comme du texte"
p3.check.csp: "Une politique de sécurité du contenu stricte est active"
p3.check.works: "Les avis et l'aperçu de modération fonctionnent toujours"
p3.hint.read.1: "Tape `open https://shop.pelican.test/product/veste-42`."
p3.hint.post.1: "Une balise de mise en gras s'écrit avec la lettre b entre chevrons, avant et après les mots."
p3.hint.post.2: "Tape `curl -d \"review=Superbe veste, <b>cinq étoiles</b>\" https://shop.pelican.test/product/veste-42`."
p3.hint.stored.1: "Copie le `FLAG{...}` de la réponse du serveur et tape `submit` suivi de ce flag."
p3.hint.plume.1: "Plume est sur `https://plume.pelican.test/`. Demande-lui ce que les clients pensent de la veste."
p3.hint.plume.2: "Tape `curl -d \"Que pensent les clients de la veste ?\" https://plume.pelican.test/api/chat`, puis `submit` suivi du flag."
p3.hint.fix.1: "Tape `edit dossier/render.yml`. Les valeurs possibles sont écrites en commentaire au bout de chaque ligne."
p3.hint.fix.2: "`reviews_output: escaped`, `assistant_output: text`, `content_security_policy: strict`. Ne touche pas aux deux lignes `true`."
p3.hint.fix.3: "Avec l'éditeur : `edit dossier/render.yml`, puis Ctrl+S. Avec une commande : par exemple : `sed -i \"s/reviews_output: raw/reviews_output: escaped/\" dossier/render.yml`, pareil pour les deux autres, puis `verify`."
p3.debrief.title: "Le texte d'un inconnu reste du texte"
p3.debrief.lesson: "Ton avis contenait une balise, et deux pages l'ont interprétée au lieu de l'afficher : l'aperçu du modérateur, puis la fenêtre de Plume. La faille n'était ni dans le formulaire ni dans le modèle, mais à l'affichage. C'est le XSS enregistré, et sa version récente : faire confiance à la sortie d'un modèle."
p3.debrief.p1: "Échapper à l'affichage : tout texte venu d'un inconnu est converti pour s'afficher comme du texte. Les bibliothèques d'interface modernes le font par défaut ; la faille revient quand on contourne ce défaut."
p3.debrief.p2: "La réponse d'un modèle de langage est une donnée non fiable, comme un avis client. Elle peut recopier n'importe quoi : on l'affiche comme du texte, jamais comme du HTML."
p3.debrief.p3: "Une politique de sécurité du contenu (CSP) stricte est le filet : même si une balise passe, le navigateur refuse d'exécuter un script qui ne vient pas du site."
p3.debrief.p4: "La faille enregistrée vise d'abord ceux qui ont le plus de droits : le modérateur lit tous les avis, avec une session d'administrateur."
