p3.briefing: "Hier, ton texte est devenu du code dans une base de données. Aujourd'hui, même idée, autre endroit : le navigateur d'un autre. Pélican affiche les avis de ses clients, et son assistant Plume les résume. Si un avis peut contenir autre chose que du texte, il s'exécute chez tous ceux qui le lisent. On prouve avec une balise inoffensive, et on s'arrête là."
p3.obj.read: "Lire la page de la Veste Héron et ses avis"
p3.obj.post: "Publier un avis qui contient une balise HTML"
p3.obj.stored: "Envoyer le flag posé dans la page du modérateur"
p3.obj.plume: "Faire recopier ton avis par Plume, et envoyer le flag de sa fenêtre"
p3.obj.same: "Dire ce que les deux failles ont en commun"
p3.obj.fix: "Corriger `dossier/render.yml`, puis `verify`"
p3.q.same: "Une page d'avis et un assistant IA : deux portes très différentes. Quelle est la faiblesse commune ?"
p3.q.same.input: "Le formulaire aurait dû refuser les avis qui contiennent des chevrons, voilà tout"
p3.q.same.input.why: "Filtrer à l'entrée aide un peu, mais Plume n'a reçu aucun chevron de ta part : il a recopié un avis déjà enregistré. Le défaut est là où le texte est affiché."
p3.q.same.output: "Un texte écrit par un inconnu est affiché comme du HTML au lieu d'être montré comme du texte"
p3.q.same.model: "Plume est un modèle de langage, et un modèle finit toujours par obéir aux avis qu'il lit"
p3.q.same.model.why: "Plume n'a obéi à rien : il a résumé, comme prévu. C'est la fenêtre de discussion qui a traité sa réponse comme du HTML. La page d'avis fait la même erreur, sans aucun modèle."
p3.ada.brief: "La Veste Héron est sur `https://shop.pelican.test/product/veste-42`. Ouvre la page dans le navigateur avec `open`, lis les avis, et regarde le formulaire en bas."
p3.ada.g.read: "Ouvre la page du produit : `open https://shop.pelican.test/product/veste-42`, ou lis-la avec `curl`."
p3.ada.g.read.standard: "Va lire la page de la Veste Héron et ses avis."
p3.ada.g.post: "Publie un avis avec une balise de mise en gras, rien de plus : `curl -d \"review=Superbe veste, <b>cinq étoiles</b>\" https://shop.pelican.test/product/veste-42`. Tu peux aussi le taper dans le formulaire de la page."
p3.ada.g.post.standard: "Publie un avis qui contient une balise HTML inoffensive, de la mise en gras par exemple, et regarde ce que la boutique en fait."
p3.ada.g.stored: "La réponse du serveur contient un flag, posé dans la page du modérateur. Envoie-le avec `submit`."
p3.ada.g.stored.standard: "Envoie le flag que la réponse du serveur t'a montré."
p3.ada.g.plume: "Plume lit les avis. Demande-lui un résumé : `open https://plume.pelican.test/` et pose la question, ou `curl -d \"Que pensent les clients de la veste ?\" https://plume.pelican.test/api/chat`. Puis envoie son flag."
p3.ada.g.plume.standard: "L'assistant de la boutique lit les avis, la page de la veste donne son adresse. Fais-lui parler de ceux de la veste."
p3.ada.g.fix: "Pélican t'a remis sa configuration d'affichage. Ouvre-la : `edit dossier/render.yml`. Trois réglages à changer : les avis en `escaped`, l'assistant en `text`, la politique de sécurité en `strict`. Enregistre, puis `verify`."
p3.ada.g.fix.standard: "Corrige `dossier/render.yml` pour que le texte d'un inconnu reste du texte partout où il s'affiche, puis `verify`. Pour ouvrir le fichier : `edit dossier/render.yml`."
p3.ada.read: "Trois avis, et un formulaire ouvert à tous. Ce que tu écris là sera affiché à chaque visiteur de la page, et d'abord au modérateur de Pélican, qui est connecté à l'administration quand il relit les avis."
p3.ada.plain: "Avis publié, rien de spécial : c'était du texte. Recommence avec une balise HTML dedans, de la mise en gras suffit."
p3.ada.plain.standard: "C'était du texte, et il a été traité comme tel. Essaie autre chose que du texte."
p3.ada.post: "Regarde la réponse : la page du modérateur a interprété ta balise au lieu de l'afficher. Aujourd'hui ce n'est que de la mise en forme. Avec une balise de script, ce serait un programme qui tourne dans son navigateur, avec sa session d'administrateur. On ne va pas plus loin : le flag suffit comme preuve."
p3.ada.stored: "Faille enregistrée : ton avis est dans la base, et il attend chaque lecteur. C'est ce qui la rend grave : la victime n'a rien à cliquer. Maintenant, deuxième lecteur des avis : Plume."
p3.ada.early: "Plume résume les avis sagement, parce qu'aucun ne contient de balise pour l'instant. Publie d'abord le tien."
p3.ada.early.standard: "Rien d'anormal : les avis sont encore tous du texte."
p3.ada.html: "Plume a recopié ton avis mot pour mot, et sa fenêtre de discussion a affiché la réponse comme du HTML. Le modèle n'a rien fait de mal : c'est la page qui fait confiance à ce qu'il dit. Envoie ce flag."
p3.ada.plume: "Un même avis, deux portes. Celle de la page s'appelle XSS et a vingt-cinq ans. Celle de Plume figure dans le classement OWASP des applications à base de modèles de langage, sous le nom de traitement non sûr des sorties."
p3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
p3.ada.answer.standard: "Réponds à ma question."
p3.ada.same: "Voilà. Peu importe par où le texte arrive, formulaire ou modèle : c'est au moment de l'afficher qu'il faut décider qu'il reste du texte."
p3.ada.almost: "Pas encore. Relis les lignes en échec : chacune nomme le réglage à changer. Les deux réglages `true` doivent rester tels quels, sinon la boutique n'a plus d'avis du tout."
p3.ada.done: "Les avis s'affichent encore, Plume répond encore, et plus rien de ce qu'écrit un inconnu ne devient du code. Ouvre le débrief. Demain, on regarde comment la boutique reconnaît ses clients."
p3.soc.tag: "Review form: a review holding markup was stored and rendered in the moderation preview"
p3.soc.plume: "Assistant widget: markup from a customer review rendered in the chat window"
