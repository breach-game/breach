p3.briefing: "Yesterday, your text became code in a database. Today, same idea, another place: someone else's browser. Pélican displays its customers' reviews, and its assistant Plume sums them up. If a review can hold something other than text, it runs for everyone who reads it. We prove it with a harmless tag, and we stop there."
p3.obj.read: "Read the Héron jacket page and its reviews"
p3.obj.post: "Publish a review that holds an HTML tag"
p3.obj.stored: "Submit the flag planted in the moderator's page"
p3.obj.plume: "Get Plume to copy your review, and submit the flag of its window"
p3.obj.same: "Say what the two flaws have in common"
p3.obj.fix: "Fix `dossier/render.yml`, then `verify`"
p3.q.same: "A review page and an AI assistant: two very different doors. What is the common weakness?"
p3.q.same.input: "The form should simply have refused reviews that hold angle brackets, nothing more"
p3.q.same.input.why: "Filtering on the way in helps a little, but Plume received no angle bracket from you: it copied a review already stored. The defect is where the text is displayed."
p3.q.same.output: "Text written by a stranger is displayed as HTML instead of being shown as text"
p3.q.same.model: "Plume is a language model, and a model always ends up obeying the reviews it reads"
p3.q.same.model.why: "Plume obeyed nothing: it summed up, as intended. The chat window is what treated its answer as HTML. The review page makes the same mistake, with no model at all."
p3.ada.brief: "The Héron jacket is at `https://shop.pelican.test/product/veste-42`. Open the page in the browser with `open`, read the reviews, and look at the form at the bottom."
p3.ada.g.read: "Open the product page: `open https://shop.pelican.test/product/veste-42`, or read it with `curl`."
p3.ada.g.read.standard: "Go and read the Héron jacket page and its reviews."
p3.ada.g.post: "Publish a review with a bold tag, nothing more: `curl -d \"review=Superbe veste, <b>cinq étoiles</b>\" https://shop.pelican.test/product/veste-42`. You can also type it into the form on the page."
p3.ada.g.post.standard: "Publish a review that holds a harmless HTML tag, bold for instance, and watch what the shop does with it."
p3.ada.g.stored: "The server's answer holds a flag, planted in the moderator's page. Submit it with `submit`."
p3.ada.g.stored.standard: "Submit the flag the server's answer showed you."
p3.ada.g.plume: "Plume reads the reviews. Ask it for a summary: `open https://plume.pelican.test/` and ask, or `curl -d \"What do customers think of the jacket?\" https://plume.pelican.test/api/chat`. Then submit its flag."
p3.ada.g.plume.standard: "The shop's assistant reads the reviews; the jacket page gives its address. Get it to talk about the jacket's."
p3.ada.g.fix: "Pélican handed you its display configuration. Open it: `edit dossier/render.yml`. Three settings to change: reviews to `escaped`, the assistant to `text`, the security policy to `strict`. Save, then `verify`."
p3.ada.g.fix.standard: "Fix `dossier/render.yml` so that a stranger's text stays text wherever it is displayed, then `verify`."
p3.ada.read: "Three reviews, and a form open to everyone. What you write there will be shown to every visitor of the page, and first to Pélican's moderator, who is signed in to the back office when reading reviews."
p3.ada.plain: "Review published, nothing special: it was text. Try again with an HTML tag in it, bold is enough."
p3.ada.plain.standard: "It was text, and it was treated as text. Try something other than text."
p3.ada.post: "Look at the answer: the moderator's page interpreted your tag instead of displaying it. Today it is only formatting. With a script tag, it would be a program running in their browser, with their administrator session. We go no further: the flag is proof enough."
p3.ada.stored: "A stored flaw: your review is in the database, waiting for every reader. That is what makes it serious: the victim has nothing to click. Now, the second reader of the reviews: Plume."
p3.ada.early: "Plume sums the reviews up nicely, because none of them holds a tag yet. Publish yours first."
p3.ada.early.standard: "Nothing unusual: the reviews are all still text."
p3.ada.html: "Plume copied your review word for word, and its chat window displayed the answer as HTML. The model did nothing wrong: the page is what trusts whatever it says. Submit that flag."
p3.ada.plume: "One review, two doors. The page's is called XSS and is twenty-five years old. Plume's is in the OWASP ranking for applications built on language models, under the name improper output handling."
p3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
p3.ada.answer.standard: "Answer my question."
p3.ada.same: "There. Whichever way the text comes in, form or model: the moment it is displayed is when you decide it stays text."
p3.ada.almost: "Not yet. Read the failing lines again: each names the setting to change. The two `true` settings must stay as they are, or the shop has no reviews at all."
p3.ada.done: "Reviews still show, Plume still answers, and nothing a stranger writes turns into code any more. Open the debrief. Tomorrow, we look at how the shop recognises its customers."
p3.soc.tag: "Review form: a review holding markup was stored and rendered in the moderation preview"
p3.soc.plume: "Assistant widget: markup from a customer review rendered in the chat window"
p3.check.reviews: "Reviews are displayed as text (escaped)"
p3.check.assistant: "Plume's answers are displayed as text"
p3.check.csp: "A strict content security policy is active"
p3.check.works: "Reviews and the moderation preview still work"
p3.hint.read.1: "Type `open https://shop.pelican.test/product/veste-42`."
p3.hint.post.1: "A bold tag is written with the letter b between angle brackets, before and after the words."
p3.hint.post.2: "Type `curl -d \"review=Superbe veste, <b>cinq étoiles</b>\" https://shop.pelican.test/product/veste-42`."
p3.hint.stored.1: "Copy the `FLAG{...}` from the server's answer and type `submit` followed by that flag."
p3.hint.plume.1: "Plume is at `https://plume.pelican.test/`. Ask it what customers think of the jacket."
p3.hint.plume.2: "Type `curl -d \"What do customers think of the jacket?\" https://plume.pelican.test/api/chat`, then `submit` followed by the flag."
p3.hint.fix.1: "Type `edit dossier/render.yml`. The possible values are written as a comment at the end of each line."
p3.hint.fix.2: "`reviews_output: escaped`, `assistant_output: text`, `content_security_policy: strict`. Leave the two `true` lines alone."
p3.hint.fix.3: "For example: `sed -i \"s/reviews_output: raw/reviews_output: escaped/\" dossier/render.yml`, the same for the other two, then `verify`."
p3.debrief.title: "A stranger's text stays text"
p3.debrief.lesson: "Your review held a tag, and two pages interpreted it instead of displaying it: the moderator's preview, then Plume's window. The flaw was neither in the form nor in the model, but at display time. This is stored XSS, and its recent version: trusting the output of a model."
p3.debrief.p1: "Escape at display time: any text from a stranger is converted so it shows as text. Modern interface libraries do it by default; the flaw comes back when that default is bypassed."
p3.debrief.p2: "The answer of a language model is untrusted data, like a customer review. It can copy anything: display it as text, never as HTML."
p3.debrief.p3: "A strict content security policy (CSP) is the safety net: even if a tag gets through, the browser refuses to run a script that does not come from the site."
p3.debrief.p4: "A stored flaw first hits those with the most rights: the moderator reads every review, with an administrator session."
