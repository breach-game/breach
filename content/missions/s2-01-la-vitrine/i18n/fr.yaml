h1.briefing: "Nouveau client, autre échelle. Halcyon fabrique Vega, un assistant qui écrit du code chez plus de trois mille équipes. Si quelqu'un modifiait ce que Halcyon livre, il serait chez tous ses clients le lendemain matin. La direction veut savoir si c'est possible. On commence par regarder, sans rien toucher."
h1.obj.customers: "Voir qui utilise Vega"
h1.obj.chain: "Trouver la chaîne de fabrication de l'extension"
h1.obj.log: "Lire le journal de la dernière construction"
h1.obj.internal: "Envoyer le nom du paquet qui vient du dépôt interne (`submit`)"
h1.obj.why: "Dire ce qu'un journal public donne à un inconnu"
h1.q.why: "Ce journal ne contient aucun mot de passe. Que donne-t-il à quelqu'un de mal intentionné ?"
h1.q.why.nothing: "Rien d'utile : sans mot de passe ni clé, un journal de construction reste inoffensif"
h1.q.why.nothing.why: "Il n'y a pas de secret, mais il y a un plan : les étapes, les sources des paquets, leur ordre, et le nom d'un paquet qui n'existe qu'en interne. Une attaque commence par ce plan."
h1.q.why.map: "Le plan de la fabrication : ses étapes, d'où viennent les paquets, et lesquels sont internes"
h1.q.why.password: "L'accès à la machine de construction : son mot de passe se déduit des étapes affichées"
h1.q.why.password.why: "Relis-le : aucun mot de passe n'y figure. Ce qu'il donne est plus discret, et tout aussi précieux pour préparer la suite."
h1.ada.brief: "Bienvenue chez Halcyon. Leur site est `https://www.halcyon.test`. Regarde d'abord qui sont leurs clients : c'est ce qui fait la valeur de la cible."
h1.ada.g.customers: "Ouvre la page des clients : `curl https://www.halcyon.test/customers`."
h1.ada.g.customers.standard: "Regarde qui utilise Vega."
h1.ada.g.chain: "Halcyon parle volontiers de sa technique. Lis `https://www.halcyon.test/engineering` et suis l'adresse qu'elle donne."
h1.ada.g.chain.standard: "Cherche où l'extension est fabriquée. Halcyon en parle sur son site."
h1.ada.g.log: "Les journaux sont publics. Lis celui de la dernière construction : `curl https://ci.halcyon.test/builds/1042`."
h1.ada.g.log.standard: "Lis le journal de la dernière construction."
h1.ada.g.internal: "Regarde l'étape 2 du journal : trois paquets, deux sources. Un seul vient du dépôt interne. Envoie-moi son nom avec `submit`."
h1.ada.g.internal.standard: "Un des paquets installés ne vient pas du même endroit que les autres. Envoie-moi son nom."
h1.ada.customers: "Des banques, un hôpital, et tiens, NovaMind. Tu vois l'enjeu : on n'attaque pas trois mille entreprises, on en attaque une, celle qui leur livre du code chaque nuit."
h1.ada.engineering: "« À livre ouvert ». L'intention est bonne. Va voir ce que le livre raconte : l'adresse est en bas de la page."
h1.ada.engineering.standard: "Suis l'adresse en bas de la page."
h1.ada.log: "Lis l'étape 2 lentement. Deux sources de paquets, dans un ordre précis, et une règle : la version la plus haute gagne. Note aussi d'où vient chaque paquet."
h1.ada.flag: "`halcyon-telemetry`, un paquet maison, que personne en dehors de Halcyon n'est censé connaître. Son nom vient d'être lu par un inconnu : toi."
h1.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
h1.ada.answer.standard: "Réponds à ma question."
h1.ada.why: "Oui. La transparence est une qualité, mais un journal de fabrication n'est pas une page de présentation. Il décrit la machine, pièce par pièce."
h1.ada.done: "Tu n'as rien forcé et tu repars avec le plan de l'usine. Ouvre le débrief. Demain, on regarde de plus près cette règle : la version la plus haute gagne."
h1.hint.customers.1: "Tape `curl https://www.halcyon.test/customers`."
h1.hint.chain.1: "Tape `curl https://www.halcyon.test/engineering` : la page donne l'adresse de l'intégration continue."
h1.hint.chain.2: "Tape `curl https://ci.halcyon.test/`."
h1.hint.log.1: "Tape `curl https://ci.halcyon.test/builds/1042`."
h1.hint.internal.1: "Dans l'étape 2, chaque paquet est suivi de sa source entre parenthèses. Cherche celui marqué `internal`."
h1.hint.internal.2: "Tape `submit halcyon-telemetry`."
h1.debrief.title: "Le plan de l'usine"
h1.debrief.lesson: "Tu n'as trouvé aucun secret, et pourtant tu connais maintenant les étapes de fabrication de Vega, ses sources de paquets et le nom d'un composant interne. Quand une entreprise livre du code à des milliers d'autres, sa chaîne de fabrication est la vraie cible."
h1.debrief.p1: "Un éditeur de logiciel hérite du risque de tous ses clients : le compromettre, c'est les atteindre tous d'un coup."
h1.debrief.p2: "Les journaux de construction décrivent l'infrastructure. Ils se lisent entre membres de l'équipe, pas depuis Internet."
h1.debrief.p3: "Les noms des composants internes sont une information à protéger, au même titre qu'un schéma du réseau."
