h1.briefing: "New client, another scale. Halcyon makes Vega, an assistant that writes code for more than three thousand teams. If someone altered what Halcyon ships, they would be inside all its customers the next morning. Management wants to know whether that is possible. We start by looking, without touching anything."
h1.obj.customers: "See who uses Vega"
h1.obj.chain: "Find the build chain of the extension"
h1.obj.log: "Read the log of the latest build"
h1.obj.internal: "Send the name of the package that comes from the internal registry (`submit`)"
h1.obj.why: "Say what a public log gives a stranger"
h1.q.why: "This log contains no password. What does it give someone with bad intentions?"
h1.q.why.nothing: "Nothing useful: with no password and no key in it, a build log stays harmless"
h1.q.why.nothing.why: "There is no secret, but there is a map: the steps, the package sources, their order, and the name of a package that only exists internally. An attack starts with that map."
h1.q.why.map: "The map of the build: its steps, where packages come from, and which ones are internal"
h1.q.why.password: "Access to the build machine: its password can be worked out from the steps shown"
h1.q.why.password.why: "Read it again: there is no password in it. What it gives is quieter, and just as valuable to prepare what comes next."
h1.ada.brief: "Welcome to Halcyon. Their site is `https://www.halcyon.test`. First look at who their customers are: that is what makes the target valuable."
h1.ada.g.customers: "Open the customers page: `curl https://www.halcyon.test/customers`."
h1.ada.g.customers.standard: "See who uses Vega."
h1.ada.g.chain: "Halcyon likes to talk about its engineering. Read `https://www.halcyon.test/engineering` and follow the address it gives."
h1.ada.g.chain.standard: "Find where the extension is built. Halcyon talks about it on its site."
h1.ada.g.log: "The logs are public. Read the one of the latest build: `curl https://ci.halcyon.test/builds/1042`."
h1.ada.g.log.standard: "Read the log of the latest build."
h1.ada.g.internal: "Look at step 2 of the log: three packages, two sources. Only one comes from the internal registry. Send me its name with `submit`."
h1.ada.g.internal.standard: "One of the installed packages does not come from the same place as the others. Send me its name."
h1.ada.customers: "Banks, a hospital, and look, NovaMind. You see what is at stake: nobody attacks three thousand companies, they attack one, the one that ships code to them every night."
h1.ada.engineering: "\"In the open\". The intention is good. Go and see what the open book says: the address is at the bottom of the page."
h1.ada.engineering.standard: "Follow the address at the bottom of the page."
h1.ada.log: "Read step 2 slowly. Two package sources, in a precise order, and a rule: highest version wins. Note where each package comes from, too."
h1.ada.flag: "`halcyon-telemetry`, an in-house package nobody outside Halcyon is supposed to know. Its name has just been read by a stranger: you."
h1.ada.answer: "Answer in the messenger, or with `answer` and the letter."
h1.ada.answer.standard: "Answer my question."
h1.ada.why: "Yes. Transparency is a quality, but a build log is not a brochure. It describes the machine, part by part."
h1.ada.done: "You forced nothing and you leave with the map of the factory. Open the debrief. Tomorrow, we take a closer look at that rule: highest version wins."
h1.hint.customers.1: "Type `curl https://www.halcyon.test/customers`."
h1.hint.chain.1: "Type `curl https://www.halcyon.test/engineering`: the page gives the address of continuous integration."
h1.hint.chain.2: "Type `curl https://ci.halcyon.test/`."
h1.hint.log.1: "Type `curl https://ci.halcyon.test/builds/1042`."
h1.hint.internal.1: "In step 2, each package is followed by its source in brackets. Look for the one marked `internal`."
h1.hint.internal.2: "Type `submit halcyon-telemetry`."
h1.debrief.title: "The map of the factory"
h1.debrief.lesson: "You found no secret, and yet you now know the build steps of Vega, its package sources and the name of an internal component. When a company ships code to thousands of others, its build chain is the real target."
h1.debrief.p1: "A software vendor inherits the risk of all its customers: compromising it reaches them all at once."
h1.debrief.p2: "Build logs describe the infrastructure. They are for team members to read, not for the Internet."
h1.debrief.p3: "The names of internal components are information to protect, just like a network diagram."
