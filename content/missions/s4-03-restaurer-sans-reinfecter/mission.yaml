# Season 4, mission 3: restoring. No attacker on stage: the trap is in the backups themselves.
# A backup taken after the intrusion carries the booby-trapped logon script, and the scheduled job
# starts the locking again next Monday. Both mistakes send the player back to the checkpoint.
side: defense
order: 2
stage: recovery
briefing: c3.briefing
startTime: "2027-09-13T10:30:00+02:00"
reveal: [intranet, fichiers, etatcivil, sauvegarde, accueil]

config:
  cb.svc_rotated: false
  cb.restored: false

objectives:
  - { id: persist, text: c3.obj.persist }
  - { id: clean, text: c3.obj.clean }
  - { id: evidence, text: c3.obj.evidence }
  - { id: restore, text: c3.obj.restore }
  - { id: rotate, text: c3.obj.rotate }
  - { id: why, text: c3.obj.why }

flags: []

containment:
  - id: remove-job
    action: remove
    target: cron-svc-sauvegarde
    text: c3.contain.job
    sets: { cb.cron_removed: true }
    writes:
      - host: fichiers
        path: /var/spool/cron/crontabs/svc-sauvegarde
        content: |
          # DO NOT EDIT THIS FILE - edit the master and reinstall.
          # (/tmp/crontab.w8Lr2a/crontab installed on Mon Sep 13 10:41:07 2027)
          # m h  dom mon dow   command
          0 2 * * * /usr/local/bin/sauvegarde-nuit.sh
  # The three backups taken before the intrusion. Each one loses the work done since.
  - id: restore-ven-0910
    action: restore
    target: ven-0910
    text: c3.contain.ven
    sets: { cb.restored: true }
    impact: 3
    removes: &locked
      - { host: fichiers, path: /srv/partages/urbanisme/permis-2027.ods.verrou }
      - { host: fichiers, path: /srv/partages/urbanisme/plan-local-urbanisme.pdf.verrou }
      - { host: fichiers, path: /srv/partages/cantine/inscriptions-rentree.ods.verrou }
      - { host: fichiers, path: /srv/partages/commun/LISEZ-MOI-POUR-VOS-FICHIERS.txt }
    writes: &clean
      - host: fichiers
        path: /srv/partages/commun/scripts/ouverture-session.cmd
        content: |
          @echo off
          rem Corbelle - script lance a l'ouverture de session de chaque poste
          net use P: \\fichiers\partages
      - { host: fichiers, path: /srv/partages/urbanisme/permis-2027.ods, content: "(tableur) Permis de construire 2027\n" }
      - { host: fichiers, path: /srv/partages/urbanisme/plan-local-urbanisme.pdf, content: "(document) Plan local d'urbanisme\n" }
      - { host: fichiers, path: /srv/partages/cantine/inscriptions-rentree.ods, content: "(tableur) Inscriptions cantine, rentree 2027\n" }
  - id: restore-jeu-0909
    action: restore
    target: jeu-0909
    text: c3.contain.jeu
    sets: { cb.restored: true }
    impact: 8
    removes: *locked
    writes: *clean
  - id: restore-hebdo-0905
    action: restore
    target: hebdo-0905
    text: c3.contain.hebdo0905
    sets: { cb.restored: true }
    impact: 20
    removes: *locked
    writes: *clean
  # The four taken after it: complete, recent, and carrying what the intruder left.
  - { id: restore-sam-0911, action: restore, target: sam-0911, text: c3.contain.sam, sets: {} }
  - { id: restore-dim-0912, action: restore, target: dim-0912, text: c3.contain.dim, sets: {} }
  - { id: restore-hebdo-0912, action: restore, target: hebdo-0912, text: c3.contain.hebdo0912, sets: {} }
  - { id: restore-lun-0913, action: restore, target: lun-0913, text: c3.contain.lun, sets: {} }
  - id: rotate-svc
    action: rotate
    target: svc-sauvegarde
    text: c3.contain.rotate
    sets: { cb.svc_rotated: true }

questions:
  - id: why
    text: c3.q.why
    objective: why
    correct: before
    options:
      - { id: before, text: c3.q.why.before }
      - { id: recent, text: c3.q.why.recent, why: c3.q.why.recent.why }
      - { id: offline, text: c3.q.why.offline, why: c3.q.why.offline.why }

rules:
  - on: { event: MissionStarted }
    do:
      - ada.say: c3.ada.brief
  - on: { event: SessionOpened, host: fichiers }
    do:
      - ada.guide: { key: c3.ada.g.crontab, for: persist, step: 1 }
  - on: { event: FileRead, host: fichiers, path: /var/spool/cron/crontabs/svc-sauvegarde }
    if: { config: cb.cron_removed, eq: false }
    do:
      - objective.complete: persist
      - ada.say: c3.ada.persist
  # The last thing the order does: from here on, a mistake comes back to this point.
  - on: { event: FileWritten, host: fichiers, path: /var/spool/cron/crontabs/svc-sauvegarde }
    do:
      # Whoever has it removed has found it.
      - ada.say: c3.ada.clean
      - objective.complete: persist
      - objective.complete: clean
      - checkpoint.save: cleaned
  - on: { event: SessionOpened, host: sauvegarde }
    do:
      - ada.guide: { key: c3.ada.g.journal, for: evidence, step: 1 }
  - on: { event: FileRead, host: sauvegarde, path: /srv/sauvegardes/journal.log }
    do:
      - ada.say: c3.ada.evidence
      - objective.complete: evidence
      - checkpoint.save: evidence
  - on: { event: Contained, containment: { in: [restore-sam-0911, restore-dim-0912, restore-hebdo-0912, restore-lun-0913] } }
    once: false
    do:
      - mission.fail: c3.ada.fail.trapped
  - on: { event: Contained, containment: { in: [restore-ven-0910, restore-jeu-0909, restore-hebdo-0905] } }
    once: false
    if: { config: cb.cron_removed, eq: false }
    do:
      - mission.fail: c3.ada.fail.job
  - on: { event: Contained, containment: { in: [restore-ven-0910, restore-jeu-0909, restore-hebdo-0905] } }
    if: { config: cb.cron_removed, eq: true }
    do:
      - objective.complete: restore
  - on: { event: Contained, containment: restore-ven-0910 }
    if: { config: cb.cron_removed, eq: true }
    do:
      - ada.say: c3.ada.restored.ven
  - on: { event: Contained, containment: restore-jeu-0909 }
    if: { config: cb.cron_removed, eq: true }
    do:
      - ada.say: c3.ada.restored.jeu
  - on: { event: Contained, containment: restore-hebdo-0905 }
    if: { config: cb.cron_removed, eq: true }
    do:
      - ada.say: c3.ada.restored.hebdo
  - on: { event: Contained, containment: rotate-svc }
    do:
      - objective.complete: rotate
      - ada.say: c3.ada.rotated
  - on: { event: ObjectiveCompleted, objective: { in: [restore, rotate] } }
    once: false
    if: { all: [{ objective: restore }, { objective: rotate }] }
    do:
      - ada.ask: why
  - on: { event: MissionCompleted }
    do:
      - ada.say: c3.ada.done

guide:
  persist: c3.ada.g.persist
  clean: c3.ada.g.clean
  evidence: c3.ada.g.evidence
  restore: c3.ada.g.restore
  rotate: c3.ada.g.rotate
  why: c3.ada.g.why

hints:
  persist: [c3.hint.persist.1, c3.hint.persist.2]
  clean: [c3.hint.clean.1, c3.hint.clean.2]
  evidence: [c3.hint.evidence.1, c3.hint.evidence.2]
  restore: [c3.hint.restore.1, c3.hint.restore.2, c3.hint.restore.3]
  rotate: [c3.hint.rotate.1, c3.hint.rotate.2]
  why: [c3.hint.why.1]

debrief:
  title: c3.debrief.title
  lesson: c3.debrief.lesson
  points: [c3.debrief.p1, c3.debrief.p2, c3.debrief.p3, c3.debrief.p4]
  reference: "NIST SP 800-61 · Eradication and recovery · MITRE ATT&CK T1053.003"
