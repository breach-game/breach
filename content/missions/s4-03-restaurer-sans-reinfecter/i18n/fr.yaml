c3.briefing: "Lundi, 10 h 30. La maire a tranché, la mairie attend ses dossiers. Yanis Morel a sept sauvegardes sur son serveur et n'en a jamais restauré une seule. Il exécutera ce que tu lui diras. Une restauration ratée, et lundi prochain à 6 h 12 tout recommence."
c3.obj.persist: "Trouver ce que l'intrus a laissé pour relancer le verrouillage"
c3.obj.clean: "Le faire retirer"
c3.obj.evidence: "Lire le journal des sauvegardes"
c3.obj.restore: "Faire restaurer une sauvegarde d'avant l'intrusion"
c3.obj.rotate: "Faire changer le secret du compte de sauvegarde"
c3.obj.why: "Dire ce qui rend une sauvegarde sûre"
c3.contain.job: "Yanis réinstalle la table planifiée du compte svc-sauvegarde depuis la version d'origine."
c3.contain.ven: "Partages remis dans l'état du vendredi 10 septembre, 2 h."
c3.contain.jeu: "Partages remis dans l'état du jeudi 9 septembre, 2 h."
c3.contain.hebdo0905: "Partages remis dans l'état du dimanche 5 septembre, 5 h (disque hors ligne)."
c3.contain.sam: "Partages remis dans l'état du samedi 11 septembre, 2 h."
c3.contain.dim: "Partages remis dans l'état du dimanche 12 septembre, 2 h."
c3.contain.hebdo0912: "Partages remis dans l'état du dimanche 12 septembre, 5 h (disque hors ligne)."
c3.contain.lun: "Partages remis dans l'état du lundi 13 septembre, 2 h."
c3.contain.rotate: "Nouveau secret pour svc-sauvegarde. L'ancien mot de passe n'ouvre plus rien, et le compte ne se connecte plus que par clé."
c3.q.why: "Qu'est-ce qui rend une sauvegarde sûre à restaurer ?"
c3.q.why.before: "Elle date d'avant l'intrusion, et pas seulement d'avant les dégâts visibles"
c3.q.why.recent: "Elle est la plus récente à être complète, donc celle qui fait perdre le moins de travail"
c3.q.why.recent.why: "La plus récente est aussi celle qui a eu le plus de temps pour ramasser ce que l'intrus a déposé. On veut la plus récente parmi les saines, et il faut d'abord savoir lesquelles le sont."
c3.q.why.offline: "Elle est sur le disque débranché, que l'intrus n'a jamais pu atteindre"
c3.q.why.offline.why: "Le disque débranché protège la copie contre l'effacement. Il ne trie pas ce qu'on y copie : celle de dimanche a recopié le script piégé avec le reste."
c3.ada.brief: "Restaurer, ce n'est pas appuyer sur un bouton. L'intrus a eu le serveur de fichiers pendant soixante heures, avec un compte qui peut tout écrire. Deux questions avant de remettre quoi que ce soit : qu'a-t-il laissé pour revenir, et depuis quand les sauvegardes le recopient-elles ? Tu as un accès en lecture, `ir`, sur les deux serveurs. Les gestes, c'est Yanis qui les fait, par `contain`."
c3.ada.g.persist: "Le verrouillage a démarré à 6 h 12 pile, un lundi. Rien ne démarre à la minute près par hasard. Va voir sur le serveur de fichiers : `ssh ir@fichiers.corbelle.test`."
c3.ada.g.persist.standard: "6 h 12 pile, un lundi : quelque chose a programmé ce départ. Cherche-le sur le serveur de fichiers, avec le compte `ir`."
c3.ada.g.crontab: "Les tâches planifiées d'un compte se lisent avec `crontab`. Celles du compte de l'intrus : `crontab -l -u svc-sauvegarde`."
c3.ada.g.crontab.standard: "Regarde ce que le compte de sauvegarde a de planifié."
c3.ada.persist: "Deux lignes. La sauvegarde de 2 h, légitime. Et `12 6 * * 1` : chaque lundi à 6 h 12, lancer `verrou` sur tous les partages. Installée vendredi à 17 h 02. Si on restaure sans la retirer, on aura travaillé une semaine pour lui."
c3.ada.g.clean: "Reviens sur ton poste avec `exit`, puis fais retirer cette tâche : `contain remove cron-svc-sauvegarde`."
c3.ada.g.clean.standard: "Fais retirer cette tâche avant toute autre chose. `contain` liste les gestes que Yanis peut faire."
c3.ada.clean: "La tâche est retirée. Relis la table si tu veux le vérifier, tu as raison de ne croire que ce que tu vois. Maintenant, les sauvegardes."
c3.ada.g.evidence: "Le catalogue est sur l'autre serveur : `ssh ir@sauvegarde.corbelle.test`."
c3.ada.g.evidence.standard: "Va lire ce que le serveur de sauvegarde a enregistré, nuit après nuit."
c3.ada.g.journal: "Liste les sauvegardes avec `jq -r '.sauvegardes[].id' /srv/sauvegardes/catalogue.json`, puis lis ce que chacune a ramassé : `cat /srv/sauvegardes/journal.log`."
c3.ada.g.journal.standard: "Le dossier `/srv/sauvegardes` contient un catalogue et un journal. C'est le journal qui dit ce que chaque sauvegarde a ramassé."
c3.ada.evidence: "Lis la ligne de `sam-0911` : le script d'ouverture de session, modifié vendredi à 17 h 05 par `svc-sauvegarde`. C'est le script que chaque poste exécute en s'allumant. Toutes les sauvegardes prises ensuite l'ont recopié, y compris celle du disque débranché de dimanche."
c3.ada.g.restore: "Reviens sur ton poste (`exit`). `contain` liste les sauvegardes que Yanis peut restaurer. Il te faut la dernière qui date d'avant vendredi 16 h 40 : `contain restore ven-0910`."
c3.ada.g.restore.standard: "À toi de choisir la sauvegarde à restaurer. Brigitte a tapé son mot de passe vendredi à 16 h 40 : tout ce qui est plus récent est suspect."
c3.ada.fail.trapped: "Lundi suivant, 8 h. Les postes s'allument, exécutent le script d'ouverture de session, et tout se verrouille à nouveau. La sauvegarde que tu as choisie contenait le script piégé : elle date d'après l'intrusion. On reprend, et cette fois lis le journal des sauvegardes ligne par ligne."
c3.ada.fail.job: "Lundi suivant, 6 h 12. La tâche planifiée de l'intrus était toujours là, et elle a fait son travail sur des dossiers tout juste restaurés. On reprend au début : d'abord retirer ce qu'il a laissé, ensuite restaurer."
c3.ada.restored.ven: "Vendredi 2 h : la dernière sauvegarde d'avant l'intrusion. Les agents refont leur vendredi, c'est tout. Et Yanis vient de réussir sa première restauration, un jour où ça comptait."
c3.ada.restored.jeu: "Jeudi 2 h : c'est sain, et ça marche. Mais regarde la jauge : tu fais refaire deux jours de travail alors que la sauvegarde de vendredi 2 h datait elle aussi d'avant l'intrusion."
c3.ada.restored.hebdo: "Le disque débranché du 5 septembre : sain, sans aucun doute, et vieux d'une semaine. Toute la rentrée de la cantine est à ressaisir. La prudence a un prix, la sauvegarde de vendredi 2 h était saine elle aussi."
c3.ada.g.rotate: "Il reste une porte ouverte : le mot de passe de `svc-sauvegarde`, que l'intrus connaît. Fais-le changer : `contain rotate svc-sauvegarde`."
c3.ada.g.rotate.standard: "L'intrus connaît toujours un secret qui ouvre tout. Fais-le changer."
c3.ada.rotated: "L'ancien mot de passe traîne encore dans un script du partage commun, mais il ne vaut plus rien. On s'occupera de l'habitude ensuite."
c3.ada.g.why: "Dernière chose, pour que ça serve la prochaine fois. Réponds dans la messagerie ou avec `answer`."
c3.ada.done: "Les dossiers sont revenus, la tâche est retirée, le secret est changé. La mairie rouvre demain. Passe au débrief. Il reste le plus important : que ça ne recommence pas."
c3.hint.persist.1: "Un programme qui démarre à heure fixe est une tâche planifiée. Sur le serveur de fichiers, `crontab -l -u <compte>` les affiche."
c3.hint.persist.2: "`ssh ir@fichiers.corbelle.test`, puis `crontab -l -u svc-sauvegarde`."
c3.hint.clean.1: "`contain`, sans rien d'autre, liste les gestes possibles."
c3.hint.clean.2: "`contain remove cron-svc-sauvegarde` (depuis ton poste : `exit` d'abord)."
c3.hint.evidence.1: "Le journal est sur `sauvegarde.corbelle.test`, dans `/srv/sauvegardes`."
c3.hint.evidence.2: "`ssh ir@sauvegarde.corbelle.test`, puis `cat /srv/sauvegardes/journal.log`."
c3.hint.restore.1: "L'intrusion date de vendredi 16 h 40. Une sauvegarde est sûre si elle a été prise avant."
c3.hint.restore.2: "Le journal montre le script piégé à partir de `sam-0911`. La dernière d'avant est celle de vendredi 2 h."
c3.hint.restore.3: "`contain restore ven-0910`"
c3.hint.rotate.1: "`contain` liste un geste sur le compte `svc-sauvegarde`."
c3.hint.rotate.2: "`contain rotate svc-sauvegarde`"
c3.hint.why.1: "Pense à la sauvegarde du disque débranché de dimanche : hors d'atteinte, complète, et pourtant piégée."
c3.debrief.title: "La bonne sauvegarde n'est pas la dernière"
c3.debrief.lesson: "Une sauvegarde copie fidèlement ce qu'on lui donne, piège compris. Entre le mot de passe volé vendredi à 16 h 40 et le verrouillage de lundi, quatre sauvegardes ont recopié le script que l'intrus avait modifié. Restaurer, c'est donc d'abord dater l'intrusion, retirer ce qui la ferait revenir, puis choisir la dernière sauvegarde d'avant, et changer les secrets que l'intrus a vus."
c3.debrief.p1: "Avant de restaurer, chercher la persistance : tâches planifiées, scripts de démarrage, comptes ajoutés."
c3.debrief.p2: "Dater l'intrusion, pas les dégâts. Tout ce qui a été sauvegardé entre les deux est suspect."
c3.debrief.p3: "Une copie hors ligne protège de l'effacement, pas de la copie d'un fichier déjà piégé. Garder plusieurs générations."
c3.debrief.p4: "Une sauvegarde jamais restaurée est une hypothèse. La tester régulièrement, un jour où rien ne brûle."
