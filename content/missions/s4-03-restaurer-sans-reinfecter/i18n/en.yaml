c3.briefing: "Monday, 10:30 am. The mayor has ruled, the town hall is waiting for its folders. Yanis Morel has seven backups on his server and has never restored a single one. He will carry out what you tell him. One botched restore, and next Monday at 6:12 am it all starts again."
c3.obj.persist: "Find what the intruder left behind to start the locking again"
c3.obj.clean: "Have it removed"
c3.obj.evidence: "Read the backup log"
c3.obj.restore: "Have a backup from before the intrusion restored"
c3.obj.rotate: "Have the secret of the backup account changed"
c3.obj.why: "Say what makes a backup safe"
c3.contain.job: "Yanis removes the intruder's scheduled job and reinstalls the table of the svc-sauvegarde account."
c3.contain.ven: "Shares put back as they were on Friday 10 September, 2 am."
c3.contain.jeu: "Shares put back as they were on Thursday 9 September, 2 am."
c3.contain.hebdo0905: "Shares put back as they were on Sunday 5 September, 5 am (offline disk)."
c3.contain.sam: "Shares put back as they were on Saturday 11 September, 2 am."
c3.contain.dim: "Shares put back as they were on Sunday 12 September, 2 am."
c3.contain.hebdo0912: "Shares put back as they were on Sunday 12 September, 5 am (offline disk)."
c3.contain.lun: "Shares put back as they were on Monday 13 September, 2 am."
c3.contain.rotate: "New secret for svc-sauvegarde. The old password opens nothing any more, and the account now logs in by key only."
c3.q.why: "What makes a backup safe to restore?"
c3.q.why.before: "It predates the intrusion, and not just the visible damage"
c3.q.why.recent: "It is the most recent complete one, so the one that loses the least work"
c3.q.why.recent.why: "The most recent one is also the one that had the most time to pick up what the intruder left. You want the most recent of the clean ones, and first you have to know which ones are clean."
c3.q.why.offline: "It is on the unplugged disk, which the intruder could never reach"
c3.q.why.offline.why: "The unplugged disk protects the copy from being erased. It does not sort what is copied onto it: Sunday's copied the booby-trapped script along with the rest."
c3.ada.brief: "Restoring is not pressing a button. The intruder had the file server for sixty hours, with an account that can write everything. Two questions before putting anything back: what did he leave behind to return, and since when have the backups been copying it? You have read access, `ir`, on both servers. The actions are carried out by Yanis, through `contain`."
c3.ada.g.persist: "The locking started at 6:12 sharp, on a Monday. Nothing starts to the minute by chance. Go and look on the file server: `ssh ir@fichiers.corbelle.test`."
c3.ada.g.persist.standard: "6:12 sharp, on a Monday: something scheduled that start. Look for it on the file server, with the `ir` account."
c3.ada.g.crontab: "The scheduled jobs of an account are read with `crontab`. Those of the intruder's account: `crontab -l -u svc-sauvegarde`."
c3.ada.g.crontab.standard: "Look at what the backup account has scheduled."
c3.ada.persist: "Two lines. The 2 am backup, legitimate. And `12 6 * * 1`: every Monday at 6:12, run `verrou` on all the shares. Installed on Friday at 5:02 pm. If we restore without removing it, we will have worked a week for him."
c3.ada.g.clean: "Go back to your workstation with `exit`, then have that job removed: `contain remove tache-verrou`."
c3.ada.g.clean.standard: "Have that job removed before anything else. `contain` lists what Yanis can do."
c3.ada.clean: "The job is gone. Read the table again if you want to check, you are right to believe only what you see. Now, the backups."
c3.ada.g.evidence: "The catalogue is on the other server: `ssh ir@sauvegarde.corbelle.test`."
c3.ada.g.evidence.standard: "Go and read what the backup server recorded, night after night."
c3.ada.g.journal: "List the backups with `jq -r '.sauvegardes[].id' /srv/sauvegardes/catalogue.json`, then read what each one picked up: `cat /srv/sauvegardes/journal.log`."
c3.ada.g.journal.standard: "The `/srv/sauvegardes` folder holds a catalogue and a log. The log says what each backup picked up."
c3.ada.evidence: "Read the `sam-0911` line: the logon script, changed on Friday at 5:05 pm by `svc-sauvegarde`. That is the script every workstation runs when it starts. Every backup taken afterwards copied it, including Sunday's on the unplugged disk."
c3.ada.g.restore: "Go back to your workstation (`exit`). `contain` lists the backups Yanis can restore. You need the last one from before Friday 4:40 pm: `contain restore ven-0910`."
c3.ada.g.restore.standard: "The choice of backup is yours. Brigitte typed her password on Friday at 4:40 pm: anything more recent is suspect."
c3.ada.fail.trapped: "The following Monday, 8 am. The workstations start, run the logon script, and everything locks again. The backup you chose held the booby-trapped script: it dates from after the intrusion. We start again, and this time read the backup log line by line."
c3.ada.fail.job: "The following Monday, 6:12 am. The intruder's scheduled job was still there, and it did its work on freshly restored folders. We start from the beginning: first remove what he left, then restore."
c3.ada.restored.ven: "Friday 2 am: the last backup before the intrusion. The staff redo their Friday, that is all. And Yanis has just succeeded at his first restore, on a day when it mattered."
c3.ada.restored.jeu: "Thursday 2 am: it is clean, and it works. But look at the gauge: you are having two days of work redone when Friday's 2 am backup also predated the intrusion."
c3.ada.restored.hebdo: "The unplugged disk of 5 September: clean beyond doubt, and a week old. The whole canteen enrolment has to be typed in again. Caution has a price, and Friday's 2 am backup was clean too."
c3.ada.g.rotate: "One door is still open: the password of `svc-sauvegarde`, which the intruder knows. Have it changed: `contain rotate svc-sauvegarde`."
c3.ada.g.rotate.standard: "The intruder still knows a secret that opens everything. Have it changed."
c3.ada.rotated: "The old password still lies in a script of the common share, but it is worth nothing now. We will deal with the habit next."
c3.ada.g.why: "One last thing, so that it is of use next time. Answer in the messenger or with `answer`."
c3.ada.done: "The folders are back, the job is gone, the secret is changed. The town hall reopens tomorrow. Go to the debrief. The most important part is left: making sure it does not happen again."
c3.hint.persist.1: "A program that starts at a fixed time is a scheduled job. On the file server, `crontab -l -u <account>` shows them."
c3.hint.persist.2: "`ssh ir@fichiers.corbelle.test`, then `crontab -l -u svc-sauvegarde`."
c3.hint.clean.1: "`contain`, with nothing else, lists the possible actions."
c3.hint.clean.2: "`contain remove tache-verrou` (from your workstation: `exit` first)."
c3.hint.evidence.1: "The log is on `sauvegarde.corbelle.test`, in `/srv/sauvegardes`."
c3.hint.evidence.2: "`ssh ir@sauvegarde.corbelle.test`, then `cat /srv/sauvegardes/journal.log`."
c3.hint.restore.1: "The intrusion dates from Friday 4:40 pm. A backup is safe if it was taken before."
c3.hint.restore.2: "The log shows the booby-trapped script from `sam-0911` on. The last one before it is Friday's 2 am backup."
c3.hint.restore.3: "`contain restore ven-0910`"
c3.hint.rotate.1: "`contain` lists an action on the `svc-sauvegarde` account."
c3.hint.rotate.2: "`contain rotate svc-sauvegarde`"
c3.hint.why.1: "Think of Sunday's backup on the unplugged disk: out of reach, complete, and still booby-trapped."
c3.debrief.title: "The right backup is not the last one"
c3.debrief.lesson: "A backup faithfully copies what it is given, traps included. Between the password stolen on Friday at 4:40 pm and Monday's locking, four backups copied the script the intruder had changed. So restoring means first dating the intrusion, removing what would bring it back, then choosing the last backup from before it, and changing the secrets the intruder saw."
c3.debrief.p1: "Before restoring, look for persistence: scheduled jobs, startup scripts, added accounts."
c3.debrief.p2: "Date the intrusion, not the damage. Everything backed up between the two is suspect."
c3.debrief.p3: "An offline copy protects against erasure, not against copying a file that is already booby-trapped. Keep several generations."
c3.debrief.p4: "A backup never restored is a hypothesis. Test it regularly, on a day when nothing is burning."
