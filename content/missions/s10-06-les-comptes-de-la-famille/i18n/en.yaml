h6.briefing: "Sunday, 6.30 pm, back at the Lemerles'. Élise's password, the one from the Pélican leak, opened the camera. It also opened her mailbox, and a mailbox is not an account like the others: it is where the \"forgot your password\" links of all the others arrive. Élise exported the list of her accounts and her mailbox's security page for you, in `comptes/`. The passwords are not in there: each one is replaced by a letter, and two accounts with the same letter share the same one."
h6.obj.reuse: "Count the accounts that share the stolen password"
h6.obj.first: "Choose the account to protect first"
h6.obj.forward: "Find what the intruder left in the mailbox"
h6.obj.clean: "Get the intruder out of the mailbox"
h6.obj.plan: "Write the family's plan"
h6.q.reuse: "How many accounts use the stolen password (the letter A)?"
h6.q.forward: "Which address does Élise's mailbox send a copy of every message to?"
h6.q.order: "Only one account tonight: which one do you protect first?"
h6.q.order.mailbox: "The mailbox, which resets all the others."
h6.q.order.bank: "The bank, since that is where the money is."
h6.q.order.bank.why: "The bank has its own password (the letter B) and a second factor. And whoever holds the mailbox can ask almost every other account for a new password."
h6.q.order.social: "The social network, the most visible account."
h6.q.order.social.why: "It is exposed, but it only gives access to itself. Look at the `recovery` column: almost every account is recovered through the mailbox."
h6.contain.forward: "Delete the forwarding rule from Élise's mailbox"
h6.contain.sessions: "Close every open session of the mailbox (Élise will sign in again on her devices)"
h6.contain.password: "Change the mailbox password to a long phrase used nowhere else"
h6.check.factor: "The mailbox has a second factor that is not a text message"
h6.check.phone: "The recovery number is Élise's current number"
h6.check.codes: "The backup codes are printed and put away"
h6.check.vault: "The family has a password manager"
h6.check.replaced: "The reused password is replaced everywhere"
h6.check.lea: "Léa has her own account"
h6.ada.brief: "We start by measuring. `comptes/inventaire.csv` lists nine of Élise's accounts. The `password` column says who shares what, the `recovery` column says how each account is recovered. The letter A is the password from the leak."
h6.ada.g.reuse: "Read the inventory: `cat comptes/inventaire.csv`. Count the lines with the letter A: `grep -c \",A,\" comptes/inventaire.csv`, then `answer reuse <number>`."
h6.ada.g.reuse.standard: "Read `comptes/inventaire.csv`, count the accounts with the letter A and answer with `answer reuse`."
h6.ada.reuse: "Six accounts out of nine, including the tax office and Léa's school. Nobody is careless here: no human remembers nine different passwords. That is a job for a tool, and we will get to it. But first, a question of priority."
h6.ada.g.first: "Answer my question: which account to protect first."
h6.ada.first: "Yes. Look at the `recovery` column: seven accounts out of nine are recovered through the mailbox. Whoever holds it does not even need the other passwords, they click \"forgot your password\" and wait for the link. Let's see what they did in there: `comptes/messagerie-securite.json`."
h6.ada.g.forward: "Read the security page: `jq \".forwarding\" comptes/messagerie-securite.json`, then `answer forward <address>`."
h6.ada.g.forward.standard: "Look in `comptes/messagerie-securite.json` for a rule Élise never created, and answer with `answer forward`."
h6.ada.forward: "A forwarding rule, created on 30 April at 3.40 am, the night of the first connection to the camera. Since then, every message Élise receives is copied to that address, reset links included. It is the quietest and most effective thing an intruder can do: a rule survives a password change. Look at `sessions` too: a browser nobody recognises, from the address 203.0.113.77, the same one as the camera."
h6.ada.reset.first: "The password is changed, but the forwarding rule is still running: the next \"forgot your password\" link will still be copied. Remove it before you stop."
h6.ada.g.clean: "Three actions, listed by `contain`: `contain remove transfert`, `contain revoke sessions`, `contain reset mot-de-passe`."
h6.ada.g.clean.standard: "Remove the rule, close the sessions and change the password. `contain` lists the measures."
h6.ada.clean: "The rule is gone, the unknown browser is out, and the stolen password no longer opens anything important. Élise had to sign in again on her phone: ten seconds of bother. Now we make sure it does not happen again. Karim has brought out the biscuits and the whole family is at the table: `comptes/plan.yml`."
h6.ada.g.plan: "Open the plan: `edit comptes/plan.yml` (or `sed -i`). Each line gives its possible values in a comment. Pick the safest one for each, then `verify`."
h6.ada.g.plan.standard: "Edit `comptes/plan.yml` line by line, then run `verify` to see what is missing."
h6.ada.plan: "Six lines, and they are the six that matter. A passkey or an app rather than a text message, because a text follows the SIM card, and you saw this afternoon what can happen to a SIM card. A recovery number that is still hers: the old one was given up in 2026, and a number that is given up is handed to someone else. Backup codes on paper, in the drawer with the passports. A manager that remembers the passwords so Élise does not have to. And an account for Léa, who no longer needs to know her mother's."
h6.ada.done: "The accounts are clean, and Élise says she will sleep better. Go and sleep too, but leave your machine plugged into their network. There is still one device nobody recognised on Saturday morning, remember? The plug `ESP-7C41`. It did nothing all day. I would like to see what it does at night."
h6.hint.reuse.1: "The third column of `comptes/inventaire.csv` is the password. `grep -c \",A,\" comptes/inventaire.csv` counts the lines."
h6.hint.reuse.2: "Type `answer reuse 6`."
h6.hint.first.1: "The account that can reset the others comes first. Type `answer mailbox`."
h6.hint.forward.1: "`jq \".forwarding\" comptes/messagerie-securite.json` shows the forwarding rule and its address."
h6.hint.forward.2: "Type `answer forward archive.elise@boite-rapide.example`."
h6.hint.clean.1: "`contain` lists the three measures. Start with the rule: `contain remove transfert`."
h6.hint.clean.2: "Then `contain revoke sessions` and `contain reset mot-de-passe`."
h6.hint.plan.1: "`cat comptes/plan.yml`: each line lists its possible values after the `#`. `verify` says which ones are not right yet."
h6.hint.plan.2: "The expected values: `passkey` (or `app`), `current-number`, `printed`, `family-vault`, `replaced`, `own-account`."
h6.hint.plan.3: "For example `sed -i \"s/backup_codes: none/backup_codes: printed/\" comptes/plan.yml`, one line at a time, or `edit comptes/plan.yml`."
h6.debrief.title: "The mailbox is the key to all the others"
h6.debrief.lesson: "A single password, from a two-year-old leak, opened six of Élise's accounts. The worst one was neither the bank nor the camera: it was the mailbox, because almost every other account is recovered through it. The intruder had left a forwarding rule there, which would have kept sending them every message after a simple password change."
h6.debrief.p1: "The mailbox comes first: a long, unique password, a second factor, and recovery options that are up to date."
h6.debrief.p2: "After an intrusion, changing the password is not enough. Check the forwarding rules, the open sessions and the recovery addresses."
h6.debrief.p3: "A password manager makes possible what no memory can hold: a different password for every account."
h6.debrief.p4: "A second factor by app or passkey resists a stolen SIM card. A code by text message does not."
h6.home.p1: "Open your mailbox settings and look at the forwarding rules and filters: you should recognise every one."
h6.home.p2: "On the same page, look at the signed-in devices and sign out the ones you do not recognise."
h6.home.p3: "Check the recovery number and address: are they still yours?"
h6.home.p4: "Turn on a passkey or an authenticator app on your mailbox, then print the backup codes."
h6.home.p5: "Install a password manager and replace first the password you use most often."
