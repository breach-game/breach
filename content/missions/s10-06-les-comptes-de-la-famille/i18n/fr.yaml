h6.briefing: "Dimanche, 18 h 30, retour chez les Lemerle. Le mot de passe d'Élise, celui de la fuite Pélican, ouvrait la caméra. Il ouvrait aussi sa messagerie, et une messagerie n'est pas un compte comme les autres : c'est là qu'arrivent les liens « mot de passe oublié » de tous les autres. Élise a exporté pour toi la liste de ses comptes et la page de sécurité de sa messagerie, dans `comptes/`. Les mots de passe n'y sont pas : chacun est remplacé par une lettre, et deux comptes qui portent la même lettre partagent le même."
h6.obj.reuse: "Compter les comptes qui partagent le mot de passe volé"
h6.obj.first: "Choisir le compte à protéger en premier"
h6.obj.forward: "Trouver ce que l'intrus a laissé dans la messagerie"
h6.obj.clean: "Sortir l'intrus de la messagerie"
h6.obj.plan: "Écrire le plan de la famille"
h6.q.reuse: "Combien de comptes utilisent le mot de passe volé (la lettre A) ?"
h6.q.forward: "Vers quelle adresse la messagerie d'Élise envoie-t-elle une copie de chaque message ?"
h6.q.order: "Un seul compte ce soir : lequel protéger en premier ?"
h6.q.order.mailbox: "La messagerie, qui réinitialise tous les autres."
h6.q.order.bank: "La banque, puisque c'est là qu'est l'argent."
h6.q.order.bank.why: "La banque a son propre mot de passe (la lettre B) et un second facteur. Et celui qui tient la messagerie peut demander un nouveau mot de passe à presque tous les autres comptes."
h6.q.order.social: "Le réseau social, le plus visible des comptes."
h6.q.order.social.why: "Il est exposé, mais il ne donne accès qu'à lui-même. Regarde la colonne `recovery` : presque tous les comptes se récupèrent par la messagerie."
h6.contain.forward: "Supprimer la règle de transfert de la messagerie d'Élise"
h6.contain.sessions: "Fermer toutes les sessions ouvertes de la messagerie (Élise se reconnectera sur ses appareils)"
h6.contain.password: "Changer le mot de passe de la messagerie pour une phrase longue qui ne sert nulle part ailleurs"
h6.check.factor: "La messagerie a un second facteur qui n'est pas un SMS"
h6.check.phone: "Le numéro de récupération est le numéro actuel d'Élise"
h6.check.codes: "Les codes de secours sont imprimés et rangés"
h6.check.vault: "La famille a un gestionnaire de mots de passe"
h6.check.replaced: "Le mot de passe réutilisé est remplacé partout"
h6.check.lea: "Léa a son propre compte"
h6.ada.brief: "On commence par mesurer. `comptes/inventaire.csv` liste neuf comptes d'Élise. La colonne `password` dit qui partage quoi, la colonne `recovery` dit par où chaque compte se récupère. La lettre A, c'est le mot de passe de la fuite."
h6.ada.g.reuse: "Lis l'inventaire : `cat comptes/inventaire.csv`. Compte les lignes qui portent la lettre A : `grep -c \",A,\" comptes/inventaire.csv`, puis `answer reuse <nombre>`."
h6.ada.g.reuse.standard: "Lis `comptes/inventaire.csv`, compte les comptes qui portent la lettre A et réponds avec `answer reuse`."
h6.ada.reuse: "Six comptes sur neuf, dont les impôts et l'école de Léa. Personne n'est négligent ici : retenir neuf mots de passe différents, aucun humain ne le fait. C'est un travail pour un outil, on y vient. Mais d'abord, une question de priorité."
h6.ada.g.first: "Réponds à ma question : quel compte protéger en premier."
h6.ada.first: "Oui. Regarde la colonne `recovery` : sept comptes sur neuf se récupèrent par la messagerie. Celui qui la tient n'a même pas besoin des autres mots de passe, il clique sur « mot de passe oublié » et il attend le lien. Voyons ce qu'il y a fait : `comptes/messagerie-securite.json`."
h6.ada.g.forward: "Lis la page de sécurité : `jq \".forwarding\" comptes/messagerie-securite.json`, puis `answer forward <adresse>`."
h6.ada.g.forward.standard: "Cherche dans `comptes/messagerie-securite.json` une règle qu'Élise n'a jamais créée, et réponds avec `answer forward`."
h6.ada.forward: "Une règle de transfert, créée le 30 avril à 3 h 40, la nuit de la première connexion à la caméra. Depuis, chaque message d'Élise part en copie vers cette adresse, liens de réinitialisation compris. C'est le geste le plus discret et le plus efficace d'un intrus : une règle survit à un changement de mot de passe. Regarde aussi `sessions` : un navigateur que personne ne reconnaît, depuis l'adresse 203.0.113.77, celle de la caméra."
h6.ada.reset.first: "Le mot de passe est changé, mais la règle de transfert tourne toujours : le prochain lien « mot de passe oublié » partira encore en copie. Enlève-la avant de t'arrêter."
h6.ada.g.clean: "Trois gestes, la liste est dans `contain` : `contain remove transfert`, `contain revoke sessions`, `contain reset mot-de-passe`."
h6.ada.g.clean.standard: "Il faut enlever la règle, fermer les sessions et changer le mot de passe. `contain` liste les mesures."
h6.ada.clean: "La règle est partie, le navigateur inconnu est dehors, et le mot de passe volé n'ouvre plus rien d'important. Élise a dû se reconnecter sur son téléphone : dix secondes de gêne. Maintenant on fait en sorte que ça ne recommence pas. Karim a sorti les gâteaux, toute la famille est autour de la table : `comptes/plan.yml`."
h6.ada.g.plan: "Ouvre le plan : `edit comptes/plan.yml` (ou `sed -i`). Chaque ligne donne ses valeurs possibles en commentaire. Choisis la plus sûre pour chacune, puis `verify`."
h6.ada.g.plan.standard: "Modifie `comptes/plan.yml` ligne par ligne, puis lance `verify` pour voir ce qui manque."
h6.ada.plan: "Six lignes, et ce sont les six qui comptent. Une clé d'accès ou une application plutôt qu'un SMS, parce qu'un SMS suit la carte SIM, et tu as vu cet après-midi ce qu'une carte SIM peut devenir. Un numéro de récupération qui est encore le sien : l'ancien a été rendu en 2026, et un numéro rendu est donné à quelqu'un d'autre. Des codes de secours sur papier, dans le tiroir des passeports. Un gestionnaire qui retient les mots de passe à la place d'Élise. Et un compte pour Léa, qui n'a plus à connaître celui de sa mère."
h6.ada.done: "Les comptes sont propres, et Élise dit qu'elle dormira mieux. Va dormir aussi, mais laisse ton poste branché sur leur réseau. Il reste un appareil que personne n'a reconnu samedi matin, tu te souviens ? La prise `ESP-7C41`. Elle n'a rien fait de la journée. J'aimerais voir ce qu'elle fait la nuit."
h6.hint.reuse.1: "La troisième colonne de `comptes/inventaire.csv` est le mot de passe. `grep -c \",A,\" comptes/inventaire.csv` compte les lignes."
h6.hint.reuse.2: "Tape `answer reuse 6`."
h6.hint.first.1: "Le compte qui permet de réinitialiser les autres passe avant tout. Tape `answer mailbox`."
h6.hint.forward.1: "`jq \".forwarding\" comptes/messagerie-securite.json` montre la règle de transfert et son adresse."
h6.hint.forward.2: "Tape `answer forward archive.elise@boite-rapide.example`."
h6.hint.clean.1: "`contain` liste les trois mesures. Commence par la règle : `contain remove transfert`."
h6.hint.clean.2: "Puis `contain revoke sessions` et `contain reset mot-de-passe`."
h6.hint.plan.1: "`cat comptes/plan.yml` : chaque ligne liste ses valeurs possibles après le `#`. `verify` dit lesquelles ne vont pas encore."
h6.hint.plan.2: "Les valeurs attendues : `passkey` (ou `app`), `current-number`, `printed`, `family-vault`, `replaced`, `own-account`."
h6.hint.plan.3: "Par exemple `sed -i \"s/backup_codes: none/backup_codes: printed/\" comptes/plan.yml`, une ligne à la fois, ou `edit comptes/plan.yml`."
h6.debrief.title: "La messagerie est la clé de toutes les autres"
h6.debrief.lesson: "Un seul mot de passe, sorti d'une fuite vieille de deux ans, ouvrait six comptes d'Élise. Le plus grave n'était ni la banque ni la caméra : c'était la messagerie, parce que presque tous les autres comptes s'y récupèrent. L'intrus y avait laissé une règle de transfert, qui aurait continué à lui envoyer chaque message après un simple changement de mot de passe."
h6.debrief.p1: "La messagerie passe avant tout : mot de passe unique et long, second facteur, moyens de récupération à jour."
h6.debrief.p2: "Après une intrusion, changer le mot de passe ne suffit pas. On regarde les règles de transfert, les sessions ouvertes et les adresses de récupération."
h6.debrief.p3: "Un gestionnaire de mots de passe rend possible ce qu'aucune mémoire ne tient : un mot de passe différent par compte."
h6.debrief.p4: "Un second facteur par application ou par clé d'accès résiste au vol de carte SIM. Un code par SMS, non."
h6.home.p1: "Ouvre les réglages de ta messagerie et regarde les règles de transfert et les filtres : tu dois reconnaître chacun."
h6.home.p2: "Sur la même page, regarde les appareils connectés et déconnecte ceux que tu ne reconnais pas."
h6.home.p3: "Vérifie le numéro et l'adresse de récupération : sont-ils encore à toi ?"
h6.home.p4: "Active une clé d'accès ou une application de validation sur ta messagerie, puis imprime les codes de secours."
h6.home.p5: "Installe un gestionnaire de mots de passe et remplace d'abord le mot de passe que tu utilises le plus souvent."
