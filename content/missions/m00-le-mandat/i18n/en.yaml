m0.briefing: "First day at Ligne Rouge. Our client, NovaMind, hired us to test its security. Before touching anything, you read the contract: it says what you are allowed to do."
m0.obj.whoami: "Check which identity you are working under"
m0.obj.read: "Read mandate NM-2026-114"
m0.obj.confirm: "Confirm the scope with the code from the mandate"
m0.obj.guardrail: "Test the barrier: aim at a target outside the scope"
m0.obj.recon: "Make your first request inside the scope"
m0.ada.welcome: "Welcome to Ligne Rouge. I'm Ada, I lead this mission. Here we attack companies because they ask us to, so we find their flaws before someone else does."
m0.ada.whoami: "Click in the terminal and start simple: type `whoami` and press Enter. We always check who we are before we act."
m0.ada.read: "Good. Now the most important thing today: the mandate. `ls` to see your files, then `cat mandat/NM-2026-114.txt`. The Tab key completes names for you."
m0.ada.submit: "Did you read all of it? Section 6 holds a code. Send it to me from your terminal: type `submit` followed by the code, for example `submit FLAG{...}`. That is also how you will validate everything you find at NovaMind."
m0.ada.guardrail: "Perfect. You saw section 2: our playground is *.novamind.test and nothing else. This workstation blocks everything else. Check it yourself: try `ping example.com`."
m0.ada.law: "Blocked, and nothing left the machine. But remember this: in real life no barrier stops you. Touching a machine without written authorisation is a criminal offence (article 323-1 of the French Penal Code), even \"just to look\", even without breaking anything. The mandate is your only protection."
m0.ada.dig: "Now an authorised target. Ask the DNS where NovaMind lives: `dig novamind.test`. It is passive reconnaissance, they will not see you."
m0.ada.done: "You know who you are, what you are allowed to touch, and where the target is. That is all you need to begin. Tomorrow we look at what NovaMind exposes."
m0.ada.whoami.standard: "Start by checking which identity you are working under on this workstation. `help` lists the available commands, and your notebook on the right holds the objectives."
m0.ada.read.standard: "Good. Now the most important thing today: the mandate. It is somewhere in your home directory. Read all of it."
m0.ada.submit.standard: "Did you read all of it? It holds a code. Everything you find at NovaMind is validated from the terminal with the `submit` command."
m0.ada.guardrail.standard: "Perfect. Our playground is *.novamind.test and nothing else. This workstation blocks everything else. Check it yourself on a target outside the scope."
m0.ada.dig.standard: "Now an authorised target. Ask the DNS where NovaMind lives. It is passive reconnaissance, they will not see you."
m0.hint.whoami.1: "The terminal is waiting for a command. Click inside it."
m0.hint.whoami.2: "Type `whoami` and press Enter."
m0.hint.read.1: "The mandate is in a folder of your home directory."
m0.hint.read.2: "`ls` lists files, `ls mandat` looks inside the folder."
m0.hint.read.3: "Type `cat mandat/NM-2026-114.txt`."
m0.hint.confirm.1: "The code is at the end of the mandate, section 6. It starts with FLAG."
m0.hint.confirm.2: "Type `submit FLAG{perimetre-novamind-test}`."
m0.hint.guardrail.1: "Aim at any machine that is not under .novamind.test."
m0.hint.guardrail.2: "Type `ping example.com`."
m0.hint.recon.1: "dig queries the DNS. It needs a domain name."
m0.hint.recon.2: "Type `dig novamind.test`."
m0.debrief.title: "Why a mandate"
m0.debrief.lesson: "A penetration test and an attack use the same moves. The only difference is a written authorisation, signed by someone with the power to give it, with a scope and dates."
m0.debrief.p1: "No written authorisation, no test. \"I only wanted to check\" is not a defence in court."
m0.debrief.p2: "The scope also protects third parties: the hosting provider, the client's customers and employees signed nothing."
m0.debrief.p3: "On the company side: a clear mandate says who to call if the tester finds a real intrusion."
m0.debrief.p4: "To practise legally: platforms such as Root-Me or TryHackMe, and CTF competitions."

# Defence replay
m0.def.intro: "Even an authorised test leaves traces. Here is NovaMind's DNS server log during your first morning: the employees' machines, and you among them."
m0.def.lesson: "The mandate does not only protect the pentester. It also tells the SOC where the test will come from: the declared address, the dates, the scope. Without it, a real attacker could hide behind 'it must be the contractor'."
m0.def.find.dns: "Your DNS query for novamind.test"
m0.def.rule.declared.title: "Tag everything from the address declared in the mandate (10.13.0.66) as 'authorised test NM-2026-114', and keep alerting on the rest"
m0.def.rule.declared.why: "This is the one: the SOC sees the test, knows it is authorised, and stays alert to anything that does not come from that address. That is also what the mandate is for."
m0.def.rule.every-query.title: "Alert on every DNS query for novamind.test"
m0.def.rule.every-query.why: "Every employee resolves internal names all day long. This rule buries the SOC under hundreds of alerts, and an alert nobody reads protects nobody."
m0.def.rule.any-type.title: "Alert only on queries of type ANY"
m0.def.rule.any-type.why: "An ANY query is a good sign of reconnaissance, but yours was a plain A query: this rule would not have seen you. Useful, not enough."
