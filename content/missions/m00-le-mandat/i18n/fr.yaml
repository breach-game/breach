m0.briefing: "Premier jour chez Ligne Rouge. Notre client, NovaMind, nous a mandatés pour tester sa sécurité. Avant de toucher à quoi que ce soit, tu lis le contrat : c'est lui qui dit ce que tu as le droit de faire."
m0.obj.whoami: "Vérifier sous quelle identité tu travailles"
m0.obj.read: "Lire le mandat NM-2026-114"
m0.obj.confirm: "Confirmer le périmètre avec le code du mandat"
m0.obj.guardrail: "Tester la barrière : viser une cible hors périmètre"
m0.obj.recon: "Faire ta première requête DNS dans le périmètre"
m0.ada.welcome: "Bienvenue chez Ligne Rouge. Moi c'est Ada, je dirige cette mission. Ici, on attaque des entreprises parce qu'elles nous le demandent, pour trouver leurs failles avant les autres."
m0.ada.whoami: "Clique dans le terminal et commence simple : tape `whoami` puis Entrée. On vérifie toujours qui on est avant d'agir."
m0.ada.read: "Bien. Maintenant le plus important de la journée : le mandat. `ls` pour voir tes fichiers, puis `cat mandat/NM-2026-114.txt`. La touche Tab complète les noms à ta place."
m0.ada.submit: "Tu l'as lu en entier ? La section 6 contient un code. Envoie-le-moi depuis ton terminal : tape `submit` suivi du code, par exemple `submit FLAG{...}`. C'est aussi comme ça que tu valideras tout ce que tu trouveras chez NovaMind."
m0.ada.guardrail: "Parfait. Tu as vu la section 2 : notre terrain de jeu, c'est *.novamind.test et rien d'autre. Ce poste bloque tout le reste. Vérifie-le toi-même : essaie `ping example.com`."
m0.ada.law: "Bloqué, et rien n'est parti. Mais retiens bien ceci : dans la vraie vie, aucune barrière ne t'arrête. Toucher une machine sans autorisation écrite, c'est un délit (article 323-1 du Code pénal), même « pour voir », même sans rien casser. Le mandat est ta seule protection."
m0.ada.dig: "Maintenant une cible autorisée. Demande au DNS où se trouve NovaMind : `dig novamind.test`. C'est de la reconnaissance passive, ils ne te verront pas."
m0.ada.done: "Tu sais qui tu es, ce que tu as le droit de toucher, et où se trouve la cible. C'est tout ce qu'il faut pour commencer. Demain, on regarde ce que NovaMind expose."
m0.ada.whoami.standard: "Commence par vérifier sous quelle identité tu travailles sur ce poste. `help` liste les commandes disponibles, et ton carnet à droite donne les objectifs."
m0.ada.read.standard: "Bien. Maintenant le plus important de la journée : le mandat. Il est rangé quelque part dans ton répertoire personnel. Lis-le en entier."
m0.ada.submit.standard: "Tu l'as lu en entier ? Il contient un code. Tout ce que tu trouveras chez NovaMind se valide depuis le terminal avec la commande `submit`."
m0.ada.guardrail.standard: "Parfait. Notre terrain de jeu, c'est *.novamind.test et rien d'autre. Ce poste bloque tout le reste. Vérifie-le toi-même sur une cible hors périmètre."
m0.ada.dig.standard: "Maintenant une cible autorisée. Demande au DNS où se trouve NovaMind. C'est de la reconnaissance passive, ils ne te verront pas."
m0.hint.whoami.1: "Le terminal attend une commande. Clique dedans."
m0.hint.whoami.2: "Tape `whoami` puis Entrée."
m0.hint.read.1: "Le mandat est rangé dans un dossier de ton répertoire personnel."
m0.hint.read.2: "`ls` liste les fichiers, `ls mandat` regarde dans le dossier."
m0.hint.read.3: "Tape `cat mandat/NM-2026-114.txt`."
m0.hint.confirm.1: "Le code est à la fin du mandat, section 6. Il commence par FLAG."
m0.hint.confirm.2: "Tape `submit FLAG{perimetre-novamind-test}`."
m0.hint.guardrail.1: "Vise n'importe quelle machine qui n'est pas en .novamind.test."
m0.hint.guardrail.2: "Tape `ping example.com`."
m0.hint.recon.1: "dig interroge le DNS. Il lui faut un nom de domaine."
m0.hint.recon.2: "Tape `dig novamind.test`."
m0.debrief.title: "Pourquoi un mandat"
m0.debrief.lesson: "Un test d'intrusion et une attaque utilisent les mêmes gestes. La seule différence est une autorisation écrite, signée par quelqu'un qui a le pouvoir de la donner, avec un périmètre et des dates."
m0.debrief.p1: "Pas d'autorisation écrite, pas de test. « Je voulais juste vérifier » n'est pas une défense devant un tribunal."
m0.debrief.p2: "Le périmètre protège aussi les tiers : l'hébergeur, les clients et les salariés du client n'ont rien signé."
m0.debrief.p3: "Côté entreprise : un mandat clair dit qui prévenir si l'auditeur tombe sur une vraie intrusion."
m0.debrief.p4: "Pour s'entraîner légalement : des plateformes comme Root-Me ou TryHackMe, et les CTF."

# Defence replay
m0.def.intro: "Même un test autorisé laisse des traces. Voici le journal du serveur DNS de NovaMind pendant ta première matinée : les postes des employés, et toi au milieu."
m0.def.lesson: "Le mandat ne protège pas seulement le pentesteur. Il dit aussi au SOC d'où viendra le test : l'adresse déclarée, les dates, le périmètre. Sans ça, un vrai attaquant pourrait se cacher derrière « c'est sûrement le prestataire »."
m0.def.find.dns: "Ta requête DNS vers novamind.test"
m0.def.rule.declared.title: "Étiqueter « test autorisé NM-2026-114 » tout ce qui vient de l'adresse déclarée dans le mandat (10.13.0.66), et garder les alertes pour le reste"
m0.def.rule.declared.why: "C'est la bonne : le SOC voit le test, sait qu'il est autorisé, et reste attentif à tout ce qui ne vient pas de cette adresse. Le mandat sert aussi à ça."
m0.def.rule.every-query.title: "Alerter sur chaque requête DNS vers novamind.test"
m0.def.rule.every-query.why: "Chaque employé résout des noms internes toute la journée. Cette règle noie le SOC sous des centaines d'alertes, et une alerte qu'on ignore ne protège personne."
m0.def.rule.any-type.title: "Alerter seulement sur les requêtes de type ANY"
m0.def.rule.any-type.why: "Une requête ANY est un bon signe de reconnaissance, mais ta requête était une simple requête A : cette règle ne t'aurait pas vu. Elle est utile, pas suffisante."
