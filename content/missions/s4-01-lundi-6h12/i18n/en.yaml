c1.briefing: "Monday 13 September, 6:12 am. Yanis Morel, the only IT person at the town hall of Corbelle, has just called Ligne Rouge: the town planning and canteen folders will not open, and a note demands 80,000 euros. The mandate is signed. The town hall's logs are reaching your workstation. It is not over: something is still running."
c1.obj.contain: "Stop the locking before it reaches the civil registry"
c1.obj.entry: "Say which machine the attack starts from"
c1.obj.account: "Say which account the intruder uses"
c1.obj.relay: "Say which address the infected computer reports to"
c1.contain.accueil: "Front desk computer isolated from the network. It stays powered on, for the investigation: it is not switched off."
c1.contain.svc: "Account svc-sauvegarde disabled and its sessions closed. Tonight's backup will not run."
c1.contain.relay: "Firewall: all traffic to and from 10.16.0.199 is cut."
c1.contain.fichiers: "File server isolated from the network. No member of staff can reach the shared folders."
c1.contain.network: "The whole town hall network is cut. Civil registry, canteen, telephones: nothing works any more."
c1.alert.svc: "The backup account logs in with a password"
c1.alert.svc.why: "This account only logs in from the backup server, with its key. A password typed from a workstation is abnormal."
c1.alert.locker: "An unknown program is rewriting the files of a share"
c1.alert.locker.why: "An executable started from a temporary folder, walking through a whole share: the signature of a locking."
c1.alert.relay: "A workstation talks to an unknown address"
c1.alert.relay.why: "No machine of the town hall has a reason to reach 10.16.0.199."
c1.q.entry: "Which IP address does the attack start from inside the town hall?"
c1.q.account: "Which account does the intruder use on the servers?"
c1.q.relay: "Which IP address does the infected computer report to?"
c1.ada.brief: "This season you break nothing: you protect. Corbelle, 14,000 residents, one town hall, a single IT person. Town planning and the canteen are already locked, we will not save them this morning. What we can still save is the rest. Every move of the intruder leaves a line in the logs: read it before the next one."
c1.ada.start: "First look at what the town hall logs: `soc sources`. Then ask for the alerts: `soc alerts`. If there are none yet, that will not last."
c1.ada.start.standard: "The `soc` console shows you the town hall's logs and alerts. Look around, fast."
c1.ada.beacon: "First alert. Run `soc alerts` again to read it, then look at the traffic of that workstation: `soc logs accueil flow`."
c1.ada.beacon.standard: "An alert has just come in. Read it, then go and see the raw lines behind it."
c1.ada.alert: "It rings again, and this one is worse: the backup account has just logged in to the file server. Read its raw log: `soc logs fichiers auth`."
c1.ada.alert.standard: "A second alert, on the file server this time. Read its authentication log."
c1.ada.seen: "Compare the lines. `svc-sauvegarde` usually comes from 10.16.0.40, the backup server, with a key. Here it comes from 10.16.0.101, with a password: that is the front desk computer. Type `contain` to see your moves. The most precise one isolates that computer: `contain isolate poste-accueil.corbelle.test`."
c1.ada.seen.standard: "You have the abnormal line: look where this account usually comes from, and where it comes from now. `contain` lists the possible moves. Pick the one that cuts closest."
c1.ada.commun: "The common share is going. It moves folder by folder."
c1.ada.hop: "It just hopped to the civil registry server, with the same account. This is the last moment."
c1.ada.fail: "Too late: the civil registry database is locked. Births, marriages, deaths, nothing opens. We start again from the alert, and this time we cut sooner."
c1.ada.relay: "The intruder's address is cut, that is something. But look at the logs: the locking goes on. The program is already running on the front desk computer, with a valid account. It no longer needs to be steered."
c1.ada.stopped: "Its next attempt failed. The locking has stopped, and the civil registry is intact. Now we write down what we know."
c1.ada.costly.fichiers: "That stops it, but nobody at the town hall can open a folder any more. Look at the impact gauge: a finer move existed."
c1.ada.costly.network: "Everything is cut, the intruder and the town hall alike. Saturday's weddings, today's canteen, the switchboard: everything. It is the last-resort move, and that is its price."
c1.ada.entry: "For the report: which machine does the attack start from? `answer entry <IP address>`."
c1.ada.entry.standard: "Answer the questions of the investigation with `answer`. The first: the machine the attack starts from."
c1.ada.account: "And which account does it use? `answer account <account>`."
c1.ada.account.standard: "Second question: the account the intruder uses."
c1.ada.done: "Town planning and the canteen are lost for now. The civil registry is safe. Go to the debrief: after that, we need to go and talk to people."
c1.hint.contain.1: "`soc alerts` shows what is ringing, `soc logs <host> <source>` shows the raw lines. Run `soc alerts` again: the intruder moves on while you read."
c1.hint.contain.2: "In the file server's authentication log, one login of `svc-sauvegarde` does not look like the others: check the address and the method."
c1.hint.contain.3: "`contain isolate poste-accueil.corbelle.test` cuts the attack without stopping the town hall."
c1.hint.entry.1: "The address is at the end of the line \"Accepted password for svc-sauvegarde from …\"."
c1.hint.entry.2: "`answer entry 10.16.0.101`"
c1.hint.account.1: "The account is named in every alert."
c1.hint.account.2: "`answer account svc-sauvegarde`"
c1.debrief.title: "Cutting without switching everything off"
c1.debrief.lesson: "Ransomware is rarely seen arriving, but it is seen working. The backup account came from a workstation, with a password, when it only ever comes from a server, with a key. That single line said where to cut. Isolating one computer cost almost nothing. Cutting the whole network would have worked too, and stopped the town hall along with the intruder."
c1.debrief.p1: "Isolate the infected machine from the network without switching it off: its memory and disks are evidence."
c1.debrief.p2: "Blocking the intruder's address is not enough when their program already runs inside with a valid account."
c1.debrief.p3: "A service account has one normal origin. Any other origin must ring, and that is a simple rule to write."
c1.debrief.p4: "Containing means paying a chosen price now to avoid a price imposed later. The widest move is rarely the best."
