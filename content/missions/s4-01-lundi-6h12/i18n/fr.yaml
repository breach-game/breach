c1.briefing: "Lundi 13 septembre, 6 h 12. Yanis Morel, seul informaticien de la mairie de Corbelle, vient d'appeler Ligne Rouge : les dossiers de l'urbanisme et de la cantine ne s'ouvrent plus, et une note réclame 80 000 euros. Le mandat est signé. Les journaux de la mairie arrivent sur ton poste. Ce n'est pas fini : quelque chose est encore en train de tourner."
c1.obj.contain: "Arrêter le verrouillage avant qu'il n'atteigne l'état civil"
c1.obj.entry: "Dire de quelle adresse IP part l'attaque"
c1.obj.account: "Dire quel compte l'intrus utilise"
c1.obj.relay: "Dire à quelle adresse le poste infecté rend compte"
c1.contain.accueil: "Poste de l'accueil isolé du réseau. Il reste allumé, pour l'enquête : on ne l'éteint pas."
c1.contain.svc: "Compte svc-sauvegarde désactivé et ses sessions fermées. La sauvegarde de cette nuit ne partira pas."
c1.contain.relay: "Pare-feu : tout le trafic vers et depuis 10.16.0.199 est coupé."
c1.contain.sauvegarde: "Serveur de sauvegarde isolé du réseau. Plus aucune sauvegarde ne part tant qu'il reste isolé."
c1.contain.ymorel: "Compte y.morel désactivé et ses sessions fermées. Yanis Morel, l'informaticien, ne peut plus se connecter aux serveurs."
c1.contain.backup: "Pare-feu : tout le trafic vers et depuis 10.16.0.40 est coupé."
c1.contain.fichiers: "Serveur de fichiers isolé du réseau. Plus aucun agent n'accède aux dossiers partagés."
c1.contain.network: "Tout le réseau de la mairie est coupé. État civil, cantine, téléphonie : plus rien ne fonctionne."
c1.alert.svc: "Le compte de sauvegarde se connecte avec un mot de passe"
c1.alert.svc.why: "Ce compte ne se connecte que depuis le serveur de sauvegarde, avec sa clé. Un mot de passe tapé depuis un poste est anormal."
c1.alert.locker: "Un programme inconnu réécrit les fichiers d'un partage"
c1.alert.locker.why: "Un exécutable lancé depuis un dossier temporaire, qui parcourt tout un partage : c'est la signature d'un verrouillage."
c1.alert.relay: "Un poste parle à une adresse inconnue"
c1.alert.relay.why: "Aucune machine de la mairie n'a de raison de joindre 10.16.0.199."
c1.q.entry: "De quelle adresse IP part l'attaque à l'intérieur de la mairie ?"
c1.q.account: "Quel compte l'intrus utilise-t-il sur les serveurs ?"
c1.q.relay: "À quelle adresse IP le poste infecté rend-il compte ?"
c1.ada.brief: "Cette saison, tu ne casses rien : tu protèges. Corbelle, 14 000 habitants, une mairie, un seul informaticien. L'urbanisme et la cantine sont déjà verrouillés, on ne les sauvera pas ce matin. Ce qu'on peut encore sauver, c'est le reste. Chaque geste de l'intrus laisse une ligne dans les journaux : à toi de la lire avant le suivant."
c1.ada.start: "Regarde d'abord ce que la mairie journalise : `soc sources`. Puis demande les alertes : `soc alerts`. S'il n'y en a pas encore, ça ne durera pas."
c1.ada.start.standard: "La console `soc` te montre les journaux et les alertes de la mairie. Fais le tour, vite."
c1.ada.beacon: "Première alerte. Relance `soc alerts` pour la lire, puis regarde le trafic du poste concerné : `soc logs accueil flow`."
c1.ada.beacon.standard: "Une alerte vient de tomber. Lis-la, puis va voir les lignes brutes derrière elle."
c1.ada.alert: "Ça sonne encore, et c'est plus grave : le compte de sauvegarde vient de se connecter au serveur de fichiers. Lis son journal brut : `soc logs fichiers auth`."
c1.ada.alert.standard: "Une deuxième alerte, sur le serveur de fichiers cette fois. Lis son journal d'authentification."
c1.ada.seen: "Compare les lignes. `svc-sauvegarde` vient d'habitude de 10.16.0.40, le serveur de sauvegarde, avec une clé. Là, il vient de 10.16.0.101, avec un mot de passe : c'est le poste de l'accueil. Tape `contain` pour voir tes gestes. Le plus précis isole ce poste : `contain isolate poste-accueil.corbelle.test`."
c1.ada.seen.standard: "Tu as la ligne anormale : regarde d'où vient ce compte d'habitude, et d'où il vient maintenant. `contain` liste les gestes possibles. Choisis celui qui coupe au plus près."
c1.ada.commun: "Le partage commun y passe. Il avance dossier par dossier."
c1.ada.hop: "Il vient de rebondir sur le serveur d'état civil, avec le même compte. C'est le dernier moment."
c1.ada.fail: "Trop tard : la base d'état civil est verrouillée. Naissances, mariages, décès, plus rien ne s'ouvre. On reprend au début de l'alerte, et cette fois on coupe plus tôt."
c1.ada.relay: "L'adresse de l'intrus est coupée, c'est toujours ça. Mais regarde les journaux : le verrouillage continue. Le programme tourne déjà sur le poste de l'accueil, avec un compte valide. Il n'a plus besoin qu'on le pilote."
c1.ada.stopped: "Sa tentative suivante a échoué. Le verrouillage est arrêté, et l'état civil est intact. Maintenant, on écrit ce qu'on sait."
c1.ada.costly.fichiers: "Ça l'arrête, mais plus personne à la mairie n'ouvre un dossier. Regarde la jauge d'impact : un geste plus fin existait."
c1.ada.costly.network: "Tout est coupé, l'intrus comme la mairie. Les mariages de samedi, la cantine de midi, le standard : tout. C'est le geste de dernier recours, et il coûte ce prix-là."
c1.ada.entry: "Pour le rapport : de quelle machine part l'attaque ? `answer entry <adresse IP>`."
c1.ada.entry.standard: "Réponds aux questions de l'enquête avec `answer`. La première : la machine d'où part l'attaque."
c1.ada.account: "Et quel compte utilise-t-il ? `answer account <compte>`."
c1.ada.account.standard: "Deuxième question : le compte que l'intrus utilise."
c1.ada.done: "L'urbanisme et la cantine sont perdus pour l'instant. L'état civil est sauf. Passe au débrief : ensuite, il faudra aller parler aux gens."
c1.hint.contain.1: "`soc alerts` montre ce qui sonne, `soc logs <hôte> <source>` montre les lignes brutes. Relance `soc alerts` : l'intrus avance pendant que tu lis."
c1.hint.contain.2: "Dans le journal d'authentification du serveur de fichiers, une connexion de `svc-sauvegarde` ne ressemble pas aux autres : regarde l'adresse et la méthode."
c1.hint.contain.3: "`contain isolate poste-accueil.corbelle.test` coupe l'attaque sans arrêter la mairie."
c1.hint.entry.1: "L'adresse est à la fin de la ligne « Accepted password for svc-sauvegarde from … »."
c1.hint.entry.2: "`answer entry 10.16.0.101`"
c1.hint.account.1: "Le compte est nommé dans chaque alerte."
c1.hint.account.2: "`answer account svc-sauvegarde`"
c1.debrief.title: "Couper sans tout éteindre"
c1.debrief.lesson: "Un rançongiciel se voit rarement arriver, mais il se voit travailler. Le compte de sauvegarde venait d'un poste, avec un mot de passe, alors qu'il ne vient jamais que d'un serveur, avec une clé. Cette seule ligne disait où couper. Isoler un poste a coûté presque rien. Couper tout le réseau aurait marché aussi, et arrêté la mairie avec l'intrus."
c1.debrief.p1: "Isoler la machine infectée du réseau, sans l'éteindre : sa mémoire et ses disques sont les pièces de l'enquête."
c1.debrief.p2: "Bloquer l'adresse de l'intrus ne suffit pas quand son programme tourne déjà à l'intérieur avec un compte valide."
c1.debrief.p3: "Un compte de service a une seule origine normale. Toute autre origine doit sonner, et c'est une règle simple à écrire."
c1.debrief.p4: "Contenir, c'est payer un prix choisi maintenant pour éviter un prix subi plus tard. Le geste le plus large est rarement le meilleur."
