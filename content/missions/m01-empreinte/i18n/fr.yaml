m1.briefing: "NovaMind nous a mandatés pour un test complet. Avant de toucher à quoi que ce soit, on regarde ce qu'ils exposent publiquement. Trouve leur dépôt de code et vérifie qu'il n'y traîne rien de sensible."
m1.obj.dns: "Relever les enregistrements DNS de NovaMind"
m1.obj.map: "Cartographier les machines exposées (au moins 4)"
m1.obj.repo: "Trouver le dépôt de code public de NovaMind"
m1.obj.key: "Retrouver le secret oublié dans l'historique"
m1.obj.odd: "Repérer ce qui cloche dans l'historique"
m1.ada.brief: "Jour 2. Aujourd'hui, reconnaissance : on cherche tout ce que NovaMind montre au monde sans s'en rendre compte. On commence par le plus discret."
m1.ada.dns: "Le DNS d'abord. `dig novamind.test ANY` te donne tous les enregistrements d'un coup. `whois novamind.test` vaut aussi le détour. Rien de tout ça n'est visible pour eux."
m1.ada.nmap: "Bien. Tu as des noms, il te faut maintenant la carte. nmap va interroger leur réseau, et ça, ça se voit : garde un œil sur la jauge de bruit en haut. `nmap -sn 10.13.0.0/24` repère les machines sans fouiller les ports. Lis `explain nmap` avant de choisir tes options."
m1.ada.scanning: "Regarde ton fond d'écran : chaque machine qui répond s'allume sur la carte."
m1.ada.web: "Voilà leur surface exposée. Commençons par la vitrine : `curl https://www.novamind.test/`. Les sites d'entreprise en disent souvent trop, surtout les pages de recrutement."
m1.ada.careers: "« Forge Gitea auto-hébergée », « une partie de nos dépôts est publique ». Les offres d'emploi sont une mine d'or. Va voir ce que raconte git.novamind.test."
m1.ada.clone: "Un dépôt public. Récupère-le avec `git clone` et l'adresse affichée, puis entre dedans avec `cd`."
m1.ada.history: "Tu as le code, mais surtout tout son passé. Un fichier supprimé n'est jamais supprimé de l'historique. `git log` liste les commits, `git show <id>` montre ce que chacun a changé. Cherche un commit qui « nettoie » quelque chose."
m1.ada.secret: "Et voilà. Une clé committée « temporairement » un vendredi soir, retirée le lundi. Sauf que Git n'oublie rien. Envoie-la-moi avec `submit`."
m1.ada.odd: "Attends. Ce commit-là : 3 h 17 un dimanche, par un compte de déploiement, vers une adresse qui n'est dans aucun de leurs DNS. Personne chez NovaMind ne travaille à cette heure-là. Je le note, on y reviendra."
m1.ada.flag: "Clé validée. Avec ça, n'importe qui pouvait parler à leur API interne. On n'ira pas plus loin aujourd'hui : on documente et on prévient le client."
m1.ada.done: "Belle reconnaissance. Passe au débrief : je veux que tu voies ce que leur SOC a vu de toi."
m1.note.odd: "Commit 5d0e7b8, dimanche 3 h 17, compte nm-deploy : ajoute un webhook vers 10.13.0.99, adresse inconnue du DNS. À surveiller."
m1.hint.dns.1: "On commence par interroger le DNS de leur domaine."
m1.hint.dns.2: "dig prend un nom de domaine, et un type d'enregistrement en option."
m1.hint.dns.3: "Tape `dig novamind.test ANY`."
m1.hint.map.1: "Il faut un outil qui découvre les machines d'une plage d'adresses."
m1.hint.map.2: "Leur réseau est 10.13.0.0/24. L'option -sn de nmap repère les machines sans scanner les ports."
m1.hint.map.3: "Tape `nmap -sn 10.13.0.0/24`."
m1.hint.repo.1: "Les offres d'emploi en disent souvent long sur les outils internes."
m1.hint.repo.2: "Lis `curl https://www.novamind.test/careers`, puis va voir la forge."
m1.hint.repo.3: "Tape `git clone https://git.novamind.test/novamind/nova-widget.git` puis `cd nova-widget`."
m1.hint.key.1: "Un secret supprimé d'un fichier n'est pas supprimé de l'historique Git."
m1.hint.key.2: "Liste les commits avec `git log --oneline`, puis regarde celui qui retire une configuration."
m1.hint.key.3: "Tape `git show 9f2c1e4`, puis `submit` suivi de la valeur de NOVA_API_KEY."
m1.debrief.title: "Ce qu'il aurait fallu faire"
m1.debrief.lesson: "Tu n'as rien cassé et rien forcé : tu as lu ce que NovaMind publiait. La reconnaissance exploite l'écart entre ce qu'une entreprise croit montrer et ce qu'elle montre vraiment."
m1.debrief.p1: "Ne jamais committer de secret, même temporairement : utiliser un coffre ou des variables d'environnement."
m1.debrief.p2: "Scanner les dépôts avec un détecteur de secrets avant chaque push."
m1.debrief.p3: "Une clé exposée se révoque immédiatement. Réécrire l'historique ne suffit pas : elle a peut-être déjà été copiée."
m1.debrief.p4: "Relire ce que les offres d'emploi et les pages publiques révèlent de l'infrastructure."
