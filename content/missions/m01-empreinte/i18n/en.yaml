m1.briefing: "NovaMind hired us for a full assessment. Before touching anything, let's see what they expose publicly. Find their code repository and check that nothing sensitive is lying around in it."
m1.obj.dns: "Collect NovaMind's DNS records"
m1.obj.map: "Map the exposed machines (at least 4)"
m1.obj.repo: "Find NovaMind's public code repository"
m1.obj.key: "Recover the secret left in the history"
m1.obj.odd: "Spot what is off in the history"
m1.ada.brief: "Day 2. Today is reconnaissance: we look for everything NovaMind shows the world without realising it. We start with the quietest moves."
m1.ada.dns: "DNS first. `dig novamind.test ANY` gives you every record at once. `whois novamind.test` is worth a look too. None of this is visible to them."
m1.ada.nmap: "Good. You have names, now you need the map. nmap will probe their network, and that shows: keep an eye on the noise gauge at the top. `nmap -sn 10.13.0.0/24` finds machines without digging into ports. Read `explain nmap` before you pick your options."
m1.ada.scanning: "Look at your wallpaper: every machine that answers lights up on the map."
m1.ada.web: "That is their exposed surface. Let's start with the shop window: `curl https://www.novamind.test/`. Company sites often say too much, careers pages most of all."
m1.ada.careers: "\"Self-hosted Gitea forge\", \"some of our repositories are public\". Job listings are a gold mine. Go see what their forge has to say: `curl https://git.novamind.test/`."
m1.ada.clone: "A public repository. Fetch it with `git clone` and the address shown, then step inside with `cd`."
m1.ada.history: "You have the code, and above all its whole past. A deleted file is never deleted from history. `git log` lists commits, `git show <id>` shows what each one changed. Look for a commit that \"cleans up\" something."
m1.ada.secret: "There it is. A key committed \"temporarily\" on a Friday evening, removed on Monday. Except Git forgets nothing. Send it to me from the terminal with `submit`."
m1.ada.odd: "Wait. That commit: 3:17 am on a Sunday, from a deploy account, to an address that is in none of their DNS records. Nobody at NovaMind works at that hour. I'm writing it down, we'll come back to it."
m1.ada.flag: "Key validated. With it, anyone could talk to their internal API. We go no further today: we document and we tell the client."
m1.ada.done: "Nice reconnaissance. Head to the debrief: I want you to see what their SOC saw of you."
m1.ada.home: "Nothing sensitive in the shop window, but look at the menu: there is a careers page. `curl https://www.novamind.test/careers`. And keep that forgotten comment about /staging in mind: developers always leave traces."
m1.ada.staging: "403: that one they closed. Good instinct to check, but we do not force a closed door. There is something easier elsewhere."
m1.ada.dns.standard: "DNS first: collect everything their domain declares. None of this is visible to them."
m1.ada.nmap.standard: "Good. You have names, now you need the map of their network, 10.13.0.0/24. Careful, a scan shows: keep an eye on the noise gauge and read `explain nmap` before you pick your options."
m1.ada.web.standard: "That is their exposed surface. Start with the shop window. Company sites often say too much, careers pages most of all."
m1.ada.careers.standard: "\"Self-hosted Gitea forge\", \"some of our repositories are public\". Job listings are a gold mine. You know where to look now."
m1.ada.clone.standard: "A public repository. Fetch it to your workstation and dig through it."
m1.ada.history.standard: "You have the code, and above all its whole past. A deleted file is never deleted from history. Look for a commit that \"cleans up\" something."
m1.note.odd: "Commit 5d0e7b8, Sunday 3:17 am, account nm-deploy: adds a webhook to 10.13.0.99, an address unknown to the DNS. Keep watching."
m1.hint.dns.1: "Start by querying the DNS for their domain."
m1.hint.dns.2: "dig takes a domain name, and optionally a record type."
m1.hint.dns.3: "Type `dig novamind.test ANY`."
m1.hint.map.1: "You need a tool that discovers the machines in an address range."
m1.hint.map.2: "Their network is 10.13.0.0/24. nmap's -sn option finds machines without scanning ports."
m1.hint.map.3: "Type `nmap -sn 10.13.0.0/24`."
m1.hint.repo.1: "Job listings often say a lot about internal tools."
m1.hint.repo.2: "Read `curl https://www.novamind.test/careers`, then go look at the forge."
m1.hint.repo.3: "Type `git clone https://git.novamind.test/novamind/nova-widget.git` then `cd nova-widget`."
m1.hint.key.1: "A secret removed from a file is not removed from Git history."
m1.hint.key.2: "List commits with `git log --oneline`, then look at the one that removes a configuration."
m1.hint.key.3: "Type `git show 9f2c1e4`, then `submit` followed by the value of NOVA_API_KEY."
m1.debrief.title: "What should have been done"
m1.debrief.lesson: "You broke nothing and forced nothing: you read what NovaMind published. Reconnaissance exploits the gap between what a company thinks it shows and what it really shows."
m1.debrief.p1: "Never commit a secret, even temporarily: use a vault or environment variables."
m1.debrief.p2: "Scan repositories with a secret detector before every push."
m1.debrief.p3: "An exposed key must be revoked at once. Rewriting history is not enough: it may already have been copied."
m1.debrief.p4: "Review what job listings and public pages reveal about the infrastructure."

# Defence replay
m1.def.intro: "Your reconnaissance as NovaMind saw it: the DNS resolver, the network sensor, the website and the forge. Most of what you did looks like a visitor. Not all of it."
m1.def.lesson: "Passive reconnaissance is almost invisible: everyone reads websites and clones public repositories. What shows is the network sweep. And for the forgotten key, removing it from history is not enough: it has already been copied. It must be revoked."
m1.def.find.scan: "Your network sweep (nmap)"
m1.def.find.clone: "Your clone of the nova-widget repository"
m1.def.rule.scan.title: "Alert when the network sensor sees a port or host sweep (signature 'ET SCAN')"
m1.def.rule.scan.why: "This is the one: a sweep has no reason to come from outside, and the signature does not fire on normal browsing."
m1.def.rule.careers.title: "Alert on every visit to the /careers page"
m1.def.rule.careers.why: "Candidates read this page all day. Reading a public page is not an attack, and this rule only sees noise."
m1.def.rule.clone.title: "Alert on every clone of a repository"
m1.def.rule.clone.why: "NovaMind's CI clones this repository every quarter of an hour. Cloning a public repository is normal: the problem is what it contains."
m1.def.fix.revoke.title: "Revoke the debug key, issue a new one, and run a secret scanner on every push"
m1.def.fix.revoke.why: "This is the one: a published key is compromised for good. Once revoked, the copy you found is worthless, and the scanner stops the next one from reaching the repository."
m1.def.fix.careers.title: "Make the /careers page vaguer about internal tools"
m1.def.fix.careers.why: "It cuts down a little what an attacker learns, but the key stays valid in the repository's history. Your attack still works."
m1.def.fix.ping.title: "Block pings from outside"
m1.def.fix.ping.why: "It gets in the way of the sweep, not of the leak. The key sits in a public repository: no ping is needed to read it."
m1.ada.home.standard: "Nothing sensitive in the shop window, but look at the site's menu: a company often says a lot when it is hiring. And keep that forgotten comment about /staging in mind: developers always leave traces."
