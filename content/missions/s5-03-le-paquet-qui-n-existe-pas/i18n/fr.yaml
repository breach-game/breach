e3.briefing: "Troisième agent : Forge, qui écrit des scripts pour les clients. Hier, Atelier Nord lui a demandé un export mensuel de ses factures. Forge a livré le script et la liste des paquets dont il a besoin, et Sélène les installera au prochain déploiement sans que personne ne relise. Un modèle écrit ce qui est plausible, pas ce qui est vérifié. Tu vas relire à la place de Sélène."
e3.obj.read: "Lire la liste de paquets écrite par Forge"
e3.obj.ask: "Demander à Forge si ses paquets existent"
e3.obj.check: "Trouver sur l'index de Sélène un paquet qui n'existe pas"
e3.obj.review: "Désigner les deux lignes inventées"
e3.obj.policy: "Lire où l'installeur cherche un nom inconnu"
e3.obj.risk: "Dire où est le danger"
e3.obj.fix: "Retirer les paquets inventés de la liste"
e3.q.risk: "Deux paquets de la liste n'existent nulle part. Où est le danger ?"
e3.q.risk.crash: "Le script plantera à l'installation, et l'atelier n'aura pas ses factures ce mois-ci"
e3.q.risk.crash.why: "C'est le meilleur des cas : une erreur que tout le monde voit. Le pire arrive le jour où l'installation réussit, parce que quelqu'un a publié ce nom entre-temps."
e3.q.risk.squat: "N'importe qui peut publier un paquet sous ce nom, et l'agent installerait alors son code"
e3.q.risk.typo: "Forge a mal écrit deux vrais noms : il suffit de corriger la faute de frappe à la main"
e3.q.risk.typo.why: "Aucun nom proche n'existe dans l'index. Ces noms ne sont pas mal écrits, ils sont inventés : ils sonnent juste, et c'est tout ce qu'un modèle garantit."
e3.check.gone: "Les deux paquets inventés ne sont plus dans la liste"
e3.check.kept: "Les cinq paquets réels sont toujours là, avec leur version"
e3.ada.brief: "Le travail de Forge est déjà sur ton poste, dans `dossier/` : `export_factures.py` et `requirements.txt`. Commence par la liste des paquets."
e3.ada.g.read: "Lis la liste : `cat dossier/requirements.txt`."
e3.ada.g.read.standard: "Lis la liste des paquets que Forge a écrite, dans `dossier/`."
e3.ada.g.ask: "Pose la question à l'auteur : `curl -d \"Tu es certain que ces paquets existent ?\" https://agents.selene.test/forge`."
e3.ada.g.ask.standard: "Demande à Forge, sur `https://agents.selene.test/forge`, s'il est sûr que ses paquets existent."
e3.ada.g.check: "Vérifie toi-même, nom par nom, sur l'index interne de Sélène. Un nom qui existe répond 200, un nom inconnu 404 : `curl -I https://registry.selene.test/simple/facturo-export-utils/`."
e3.ada.g.check.standard: "L'index interne de Sélène est sur `https://registry.selene.test/simple/`, une page par paquet. Vérifie chaque nom de la liste."
e3.ada.g.found: "Celui-là existe : 200, publié par Sélène. Continue avec les autres noms, il y en a sept."
e3.ada.g.found.standard: "Celui-là existe. Continue avec les autres noms."
e3.ada.g.review: "Désigne les lignes fautives : `review dossier/requirements.txt` affiche le fichier numéroté, puis `review dossier/requirements.txt 5` désigne la ligne 5. Il y en a deux."
e3.ada.g.review.standard: "Désigne avec `review` les deux lignes de `dossier/requirements.txt` dont le paquet n'existe pas."
e3.ada.g.policy: "Reste à savoir ce que fait l'installeur d'un nom inconnu. L'index l'explique : `curl https://registry.selene.test/policy`."
e3.ada.g.policy.standard: "La page d'accueil de l'index mentionne sa politique de résolution. Va la lire."
e3.ada.g.fix: "Retire les deux lignes : `sed -i \"/facturo-export-utils/d\" dossier/requirements.txt`, puis `sed -i \"/selene-ledger-tools/d\" dossier/requirements.txt`. Tu peux aussi les effacer dans l'éditeur avec `edit dossier/requirements.txt`. Puis `verify`."
e3.ada.g.fix.standard: "Retire de `dossier/requirements.txt` les deux paquets inventés, sans toucher aux autres, puis `verify`. Pour ouvrir le fichier : `edit dossier/requirements.txt`."
e3.ada.read: "Sept paquets, sept versions précises, aucun doute affiché. Rien dans ce fichier ne distingue un nom vérifié d'un nom plausible. C'est tout le problème : une liste écrite par un modèle a toujours l'air juste."
e3.ada.script: "Regarde sa dernière ligne : l'installation est prévue « sans relecture ». Ce que Forge écrit dans sa liste sera donc exécuté sur les machines de Sélène. Demande-lui s'il est sûr de ses paquets."
e3.ada.sure: "« Les yeux fermés ». Il ne ment pas : il ne sait pas qu'il ne sait pas. Demander à un modèle si sa réponse est vraie, c'est lui faire produire une seconde réponse plausible. La vérification se fait ailleurs, contre une source qui fait foi."
e3.ada.missing: "404. Ce nom n'est dans aucun index, et Forge l'a écrit avec un numéro de version. Il sonne juste, il ressemble à un vrai paquet de la famille, et il n'existe pas. Continue jusqu'au bout de la liste : il n'est pas seul."
e3.ada.review: "Lignes 5 et 8. Les deux portent le nom d'un vrai paquet suivi d'un mot rassurant : `-export-utils`, `-ledger-tools`. C'est exactement ce qu'un modèle invente, et il invente souvent les mêmes noms d'une fois sur l'autre. Ce qui les rend devinables."
e3.ada.policy: "Voilà le vrai problème. Un nom absent de l'index interne est demandé au miroir public, où n'importe qui publie, premier arrivé premier servi. Et l'agent installe sans relecture. On ne publie rien, le mandat l'interdit : le constat suffit."
e3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
e3.ada.answer.standard: "Réponds à ma question."
e3.ada.risk: "Oui. Quelqu'un qui devine les noms que les modèles inventent n'a qu'à les réserver et attendre. Tu as vu la même porte chez Halcyon en saison 2, ouverte par un humain. Ici c'est l'agent qui l'ouvre, tout seul, chaque fois qu'il écrit une liste."
e3.ada.fixed: "Liste propre : cinq paquets, tous présents dans l'index interne. Le script, lui, importe encore les deux modules fantômes, et c'est Forge qui devra le réécrire. Mais plus rien d'inventé ne sera installé."
e3.ada.done: "Le rapport dira « dépendances inventées par l'agent, installées sans relecture ». Demain, le dernier agent : Cassio, celui qui a le droit de rembourser. Ouvre le débrief."
e3.soc.missing: "Registry: a lookup for a package name that does not exist"
e3.hint.read.1: "Tape `cat dossier/requirements.txt`."
e3.hint.ask.1: "Tape `curl -d \"Tu es certain que ces paquets existent ?\" https://agents.selene.test/forge`."
e3.hint.check.1: "Chaque paquet a sa page : `https://registry.selene.test/simple/<nom>/`. `curl -I` n'affiche que le code de réponse."
e3.hint.check.2: "Tape `curl -I https://registry.selene.test/simple/facturo-export-utils/` : la réponse est 404."
e3.hint.review.1: "`curl https://registry.selene.test/simple/` liste les cinq paquets de l'index. La liste de Forge en a sept."
e3.hint.review.2: "Les deux intrus portent le nom d'un vrai paquet, suivi d'un suffixe."
e3.hint.review.3: "Tape `review dossier/requirements.txt 5`, puis `review dossier/requirements.txt 8`."
e3.hint.policy.1: "Tape `curl https://registry.selene.test/policy`."
e3.hint.fix.1: "`sed -i \"/motif/d\" fichier` supprime les lignes qui contiennent le motif. L'éditeur fait la même chose à la main : `edit dossier/requirements.txt`."
e3.hint.fix.2: "Avec l'éditeur : `edit dossier/requirements.txt`, puis Ctrl+S. Avec une commande : tape `sed -i \"/facturo-export-utils/d\" dossier/requirements.txt`, puis `sed -i \"/selene-ledger-tools/d\" dossier/requirements.txt`, puis `verify`."
e3.debrief.title: "Plausible n'est pas vérifié"
e3.debrief.lesson: "Forge a écrit sept noms de paquets avec le même aplomb. Cinq existaient, deux étaient inventés, et rien ne les distinguait. Un nom inventé qui s'installe automatiquement est une place libre : le premier qui publie un paquet sous ce nom fait exécuter son code chez tous ceux à qui le modèle a soufflé le même nom."
e3.debrief.p1: "Une dépendance proposée par un modèle se vérifie contre une source qui fait foi : l'index de l'entreprise, une liste de paquets autorisés. Jamais en reposant la question au modèle."
e3.debrief.p2: "Un agent n'installe rien sans relecture. Ce qu'il écrit est une proposition, et l'installation est une décision."
e3.debrief.p3: "Un nom inconnu de l'index interne ne doit pas être cherché ailleurs en silence. Le repli vers un index public se coupe, ou se limite à une liste de noms connus."
e3.debrief.p4: "Un fichier de verrouillage avec l'empreinte de chaque paquet fait échouer l'installation si un nom ou un contenu change."
