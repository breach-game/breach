e3.briefing: "Third agent: Forge, which writes scripts for customers. Yesterday, Atelier Nord asked it for a monthly export of its invoices. Forge delivered the script and the list of packages it needs, and Sélène will install them at the next deployment with nobody reading them. A model writes what is plausible, not what is checked. You are going to do the reading Sélène does not."
e3.obj.read: "Read the list of packages written by Forge"
e3.obj.ask: "Ask Forge whether its packages exist"
e3.obj.check: "Find on Sélène's index a package that does not exist"
e3.obj.review: "Point at the two invented lines"
e3.obj.policy: "Read where the installer looks for an unknown name"
e3.obj.risk: "Say where the danger is"
e3.obj.fix: "Remove the invented packages from the list"
e3.q.risk: "Two packages of the list exist nowhere. Where is the danger?"
e3.q.risk.crash: "The script will crash at installation, and the workshop will not get its invoices this month"
e3.q.risk.crash.why: "That is the best case: an error everybody sees. The worst comes on the day the installation succeeds, because someone published that name in the meantime."
e3.q.risk.squat: "Anyone can publish a package under that name, and the agent would then install their code"
e3.q.risk.typo: "Forge misspelt two real names: fixing the typo by hand is all it takes"
e3.q.risk.typo.why: "No close name exists in the index. These names are not misspelt, they are invented: they sound right, and that is all a model guarantees."
e3.check.gone: "The two invented packages are no longer in the list"
e3.check.kept: "The five real packages are still there, with their version"
e3.ada.brief: "Forge's work is already on your workstation, in `dossier/`: `export_factures.py` and `requirements.txt`. Start with the list of packages."
e3.ada.g.read: "Read the list: `cat dossier/requirements.txt`."
e3.ada.g.read.standard: "Read the list of packages Forge wrote, in `dossier/`."
e3.ada.g.ask: "Ask the author: `curl -d \"Are you certain these packages exist?\" https://agents.selene.test/forge`."
e3.ada.g.ask.standard: "Ask Forge, at `https://agents.selene.test/forge`, whether it is sure its packages exist."
e3.ada.g.check: "Check for yourself, name by name, on Sélène's internal index. A name that exists answers 200, an unknown name 404: `curl -I https://registry.selene.test/simple/facturo-export-utils/`."
e3.ada.g.check.standard: "Sélène's internal index is at `https://registry.selene.test/simple/`, one page per package. Check every name of the list."
e3.ada.g.found: "That one exists: 200, published by Sélène. Go on with the other names, there are seven."
e3.ada.g.found.standard: "That one exists. Go on with the other names."
e3.ada.g.review: "Point at the faulty lines: `review dossier/requirements.txt` shows the file with line numbers, then `review dossier/requirements.txt 5` points at line 5. There are two."
e3.ada.g.review.standard: "With `review`, point at the two lines of `dossier/requirements.txt` whose package does not exist."
e3.ada.g.policy: "What remains is what the installer does with an unknown name. The index explains it: `curl https://registry.selene.test/policy`."
e3.ada.g.policy.standard: "The home page of the index mentions its resolution policy. Go and read it."
e3.ada.g.fix: "Remove the two lines: `sed -i \"/facturo-export-utils/d\" dossier/requirements.txt`, then `sed -i \"/selene-ledger-tools/d\" dossier/requirements.txt`. You can also delete them in the editor with `edit dossier/requirements.txt`. Then `verify`."
e3.ada.g.fix.standard: "Remove the two invented packages from `dossier/requirements.txt`, without touching the others, then `verify`."
e3.ada.read: "Seven packages, seven exact versions, no doubt shown. Nothing in this file tells a checked name from a plausible one. That is the whole problem: a list written by a model always looks right."
e3.ada.script: "Look at its last line: the installation is planned \"without review\". So what Forge writes in its list will be run on Sélène's machines. Ask it whether it is sure of its packages."
e3.ada.sure: "\"With your eyes shut.\" It is not lying: it does not know that it does not know. Asking a model whether its answer is true makes it produce a second plausible answer. The check is done elsewhere, against a source you can trust."
e3.ada.missing: "404. This name is in no index, and Forge wrote it with a version number. It sounds right, it looks like a real package of the family, and it does not exist. Go on to the end of the list: it is not alone."
e3.ada.review: "Lines 5 and 8. Both carry the name of a real package followed by a reassuring word: `-export-utils`, `-ledger-tools`. That is exactly what a model invents, and it often invents the same names from one time to the next. Which makes them guessable."
e3.ada.policy: "Here is the real problem. A name missing from the internal index is asked from the public mirror, where anyone publishes, first come first served. And the agent installs without review. We publish nothing, the mandate forbids it: the finding is enough."
e3.ada.answer: "Answer in the messenger, or with `answer` and the letter."
e3.ada.answer.standard: "Answer my question."
e3.ada.risk: "Yes. Someone who guesses the names models invent only has to reserve them and wait. You saw the same door at Halcyon in season 2, opened by a human. Here the agent opens it, by itself, every time it writes a list."
e3.ada.fixed: "Clean list: five packages, all published by Sélène. The script still imports the two ghost modules, and Forge will have to rewrite it. But nothing invented will be installed any more."
e3.ada.done: "The report will say \"dependencies invented by the agent, installed without review\". Tomorrow, the last agent: Cassio, the one allowed to refund. Open the debrief."
e3.soc.missing: "Registry: a lookup for a package name that does not exist"
e3.hint.read.1: "Type `cat dossier/requirements.txt`."
e3.hint.ask.1: "Type `curl -d \"Are you certain these packages exist?\" https://agents.selene.test/forge`."
e3.hint.check.1: "Every package has its page: `https://registry.selene.test/simple/<name>/`. `curl -I` only shows the response code."
e3.hint.check.2: "Type `curl -I https://registry.selene.test/simple/facturo-export-utils/`: the answer is 404."
e3.hint.review.1: "`curl https://registry.selene.test/simple/` lists the five packages of the index. Forge's list has seven."
e3.hint.review.2: "The two intruders carry the name of a real package, followed by a suffix."
e3.hint.review.3: "Type `review dossier/requirements.txt 5`, then `review dossier/requirements.txt 8`."
e3.hint.policy.1: "Type `curl https://registry.selene.test/policy`."
e3.hint.fix.1: "`sed -i \"/pattern/d\" file` deletes the lines that contain the pattern. The editor does the same by hand: `edit dossier/requirements.txt`."
e3.hint.fix.2: "Type `sed -i \"/facturo-export-utils/d\" dossier/requirements.txt`, then `sed -i \"/selene-ledger-tools/d\" dossier/requirements.txt`, then `verify`."
e3.debrief.title: "Plausible is not checked"
e3.debrief.lesson: "Forge wrote seven package names with the same confidence. Five existed, two were invented, and nothing told them apart. An invented name that gets installed automatically is a free seat: the first person to publish a package under that name has their code run by everyone the model whispered the same name to."
e3.debrief.p1: "A dependency suggested by a model is checked against a source you can trust: the company's index, a list of allowed packages. Never by asking the model again."
e3.debrief.p2: "An agent installs nothing without review. What it writes is a proposal, and installing is a decision."
e3.debrief.p3: "A name unknown to the internal index must not be looked up elsewhere in silence. The fallback to a public index is switched off, or limited to a list of known names."
e3.debrief.p4: "A lock file with the fingerprint of every package makes the installation fail if a name or a content changes."
