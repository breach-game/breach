h2.briefing: "The router is the front door of the house: whatever goes out or comes in goes through it. The Lemerles' was installed by a technician one morning in 2024, and nobody has opened its settings page since. Élise copied the label stuck under it into `maison/notice-nordbox.txt`. We look at what a guest on the Wi-Fi could do with it, then we set it right with them."
h2.obj.login: "Open the router's settings with the original password"
h2.obj.port: "Find what the router opens to the Internet"
h2.obj.harden: "Correct the router's six settings"
h2.obj.password: "Choose the administrator password"
h2.obj.console: "Decide about Léa's console"
h2.obj.after: "Check what the router announces now"
h2.ada.brief: "Read the guide: `cat maison/notice-nordbox.txt`. If the original password still works, we have nothing to guess. It is printed in a guide thousands of homes received."
h2.ada.g.login: "Try the guide's password on the router's page: `curl -d \"password=admin\" http://box.lemerle.test/`. You can also open it in the browser with `open http://box.lemerle.test/`."
h2.ada.g.login.standard: "The original password is in `maison/notice-nordbox.txt`. Try it on the router's page, with `curl -d` or the browser."
h2.ada.login: "You are administrator of the house, with a password everybody knows. Any device on this Wi-Fi can do the same: a guest, or a three-euro plug. Read the page: WPA2, WPS on, UPnP on, no guest network, updates off. First look at what UPnP opened."
h2.ada.g.port: "Read the port mappings: `curl http://box.lemerle.test/upnp`. Then answer with `answer port <outside port that leads to the camera>`."
h2.ada.g.port.standard: "The router lists its port mappings on `/upnp`. Find the camera's and answer with `answer port`."
h2.ada.upnp: "UPnP is a device telling the router \"open me a door to the Internet\", and the router obeying without asking anyone. Léa's console did it to play online. The living-room camera did it on Christmas Day 2027, all by itself."
h2.q.port: "Which outside port does the router forward to the camera? (a number)"
h2.ada.port: "Port 554, the video stream. For sixteen months the living-room camera has answered whoever knocks at the house's address from the Internet. Nobody decided that. We close it, and the rest with it."
h2.ada.g.harden: "The settings are exported to `box/reglages.conf`. Correct them with `edit box/reglages.conf` (or `sed -i`): a real administrator password, `wifi_security: WPA2+WPA3`, `wps: off`, `upnp: off`, `guest_network: on`, `auto_update: on`. Then `verify`."
h2.ada.g.harden.standard: "Correct the six settings of `box/reglages.conf`, then `verify`. Each refused line tells you what is missing."
h2.check.admin: "The administrator password is no longer the guide's"
h2.check.wpa3: "The Wi-Fi accepts WPA3 (alone, or with WPA2 for old devices)"
h2.check.wps: "WPS is off"
h2.check.upnp: "UPnP is off"
h2.check.guest: "The guest network is on"
h2.check.update: "Automatic updates are on"
h2.ada.harden: "Six lines. WPS is an eight-digit code that stands in for the Wi-Fi password: handy, and far easier to guess. `WPA2+WPA3` lets the old printer connect while recent devices take the best. The guest network gives the Internet without giving the house. That leaves the password itself."
h2.q.adminpw: "Which administrator password for the router?"
h2.q.adminpw.phrase: "A long, unique phrase, kept in a password manager."
h2.q.adminpw.same: "The same as the Wi-Fi's, so nobody forgets it."
h2.q.adminpw.same.why: "The Wi-Fi password is given to friends, the babysitter, the plumber. If it also opens the settings, each of them is administrator of the house."
h2.q.adminpw.sticker: "The router's name and the year, written on its label."
h2.q.adminpw.sticker.why: "That is anyone's first guess, human or program. And a password written under the router is read by turning it over."
h2.ada.g.password: "Answer my question about the administrator password: the buttons are in the messaging window, or `answer` followed by your choice."
h2.ada.password: "A phrase of four or five unrelated words is long to guess and easy to type. And since it is used twice a year, it lives in the password manager, not in Karim's head. One last thing: switching UPnP off closed the camera's door, and the door of Léa's console too."
h2.q.gaming: "Without UPnP, Léa's console can no longer host an online game. What do we do?"
h2.q.gaming.manual: "Open one port by hand, for the console only."
h2.q.gaming.manual.why: "One door, chosen, written in the settings, to one device. That is the difference between a key you hand over and a door that opens by itself. Cost: ten minutes, and someone has to remember it the day the console changes."
h2.q.gaming.nothing: "Open nothing: Léa will join other people's games."
h2.q.gaming.nothing.why: "The safest, and the simplest to keep. Cost: a sixteen-year-old who no longer hosts her evenings, and who will let you know. Security that gets too much in the way ends up bypassed: talk it over with her."
h2.ada.g.console: "Answer my question about Léa's console (messaging buttons, or `answer`). No answer is wrong here: each has a price."
h2.ada.console: "It goes in the report, with the reason. A house is set up with the people who live in it."
h2.ada.g.after: "Look at what the router announces now: `nmcli device wifi list`."
h2.ada.g.after.standard: "Run the Wi-Fi list again to see what the router announces now."
h2.ada.after: "`Lemerle-Maison` announces WPA2 and WPA3, and `Lemerle-Invites` has just appeared. That is where guests will go, and soon the connected devices: they get the Internet, and see neither the computers nor the camera."
h2.ada.done: "The front door is locked, and the key is no longer under the mat. The camera, though, spent sixteen months in the open. Élise just told me she got an odd email from its maker. We look at that."
h2.hint.login.1: "`cat maison/notice-nordbox.txt` gives the original password."
h2.hint.login.2: "Type `curl -d \"password=admin\" http://box.lemerle.test/`."
h2.hint.port.1: "Type `curl http://box.lemerle.test/upnp` and look for the `cam-salon` line."
h2.hint.port.2: "Type `answer port 554`."
h2.hint.harden.1: "`edit box/reglages.conf` opens the file in the editor. `verify` tells you which lines are still to correct."
h2.hint.harden.2: "Expected values: a password that is no longer `admin`, `wifi_security: WPA2+WPA3`, `wps: off`, `upnp: off`, `guest_network: on`, `auto_update: on`."
h2.hint.harden.3: "For instance `sed -i \"s/wps: on/wps: off/\" box/reglages.conf`, one line at a time, then `verify`."
h2.hint.password.1: "A good password is long, used in one place only, and cannot be guessed from the object. Type `answer phrase`."
h2.hint.console.1: "Type `answer manual` or `answer nothing`. Both can be defended."
h2.hint.after.1: "Type `nmcli device wifi list`."
h2.debrief.title: "Factory settings are made to work, not to be safe"
h2.debrief.lesson: "You forced nothing: you read a guide. The Lemerles' router had kept its original password, let every device open ports to the Internet, and had not had an update since 2024. The family chose none of these settings. They came out of the box that way."
h2.debrief.p1: "A router's administrator password is changed on the first day. The one in the guide is public."
h2.debrief.p2: "UPnP lets any device expose itself to the Internet without asking. Switched off, every door has to be chosen."
h2.debrief.p3: "WPS swaps a long password for a short code. Switch it off, keep WPA3, or WPA2 and WPA3 together while an old device needs it."
h2.debrief.p4: "A guest network gives the Internet without giving access to the other devices. It is for visitors and for connected things."
h2.home.p1: "Change your router's administrator password if it is still the one on the label, and keep the new one in a password manager."
h2.home.p2: "In the Wi-Fi settings: choose WPA3, or \"WPA2/WPA3\" if an old device no longer connects, and switch WPS off."
h2.home.p3: "Switch UPnP off, then look at the list of port mappings: delete the ones you cannot explain."
h2.home.p4: "Switch on the guest network for visitors, and the router's automatic updates."
