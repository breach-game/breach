h2.briefing: "La box, c'est la porte d'entrée de la maison : tout ce qui sort et tout ce qui entre passe par elle. Celle des Lemerle a été posée par un technicien un matin de 2024, et personne n'a ouvert sa page de réglages depuis. Élise a recopié l'étiquette collée dessous dans `maison/notice-nordbox.txt`. On regarde ce qu'un invité sur le Wi-Fi pourrait y faire, puis on la règle avec eux."
h2.obj.login: "Ouvrir les réglages de la box avec le mot de passe d'origine"
h2.obj.port: "Trouver ce que la box ouvre vers Internet"
h2.obj.harden: "Corriger les six réglages de la box"
h2.obj.password: "Choisir le mot de passe administrateur"
h2.obj.console: "Décider pour la console de Léa"
h2.obj.after: "Vérifier ce que la box annonce maintenant"
h2.ada.brief: "Lis la notice : `cat maison/notice-nordbox.txt`. Si le mot de passe d'origine marche encore, on n'a rien à deviner. Il est imprimé dans une notice que des milliers de foyers ont reçue."
h2.ada.g.login: "Essaie le mot de passe de la notice sur la page de la box : `curl -d \"password=admin\" http://box.lemerle.test/`. Tu peux aussi l'ouvrir dans le navigateur avec `open http://box.lemerle.test/`."
h2.ada.g.login.standard: "Le mot de passe d'origine est dans `maison/notice-nordbox.txt`. Essaie-le sur la page de la box, avec `curl -d` ou le navigateur."
h2.ada.login: "Tu es administrateur de la maison, avec un mot de passe que tout le monde connaît. N'importe quel appareil sur ce Wi-Fi peut en faire autant : un invité, ou une prise à trois euros. Lis la page : WPA2, WPS actif, UPnP actif, pas de réseau invité, mises à jour coupées. Regarde d'abord ce que l'UPnP a ouvert."
h2.ada.g.port: "Lis les redirections de ports : `curl http://box.lemerle.test/upnp`. Puis réponds avec `answer port <port extérieur qui mène à la caméra>`."
h2.ada.g.port.standard: "La box liste ses redirections de ports sur `/upnp`. Trouve celle de la caméra et réponds avec `answer port`."
h2.ada.upnp: "L'UPnP, c'est un appareil qui dit à la box « ouvre-moi une porte vers Internet », et la box qui obéit sans demander à personne. La console de Léa l'a fait pour jouer en ligne. La caméra du salon l'a fait le jour de Noël 2027, toute seule."
h2.q.port: "Quel port extérieur la box redirige-t-elle vers la caméra ? (un nombre)"
h2.ada.port: "Le port 554, celui du flux vidéo. Depuis seize mois, la caméra du salon répond à quiconque frappe à l'adresse de la maison depuis Internet. Personne ne l'a décidé. On ferme ça, et le reste avec."
h2.ada.g.harden: "Les réglages sont exportés dans `box/reglages.conf`. Corrige-les avec `edit box/reglages.conf` (ou `sed -i`) : un vrai mot de passe administrateur, `wifi_security: WPA2+WPA3`, `wps: off`, `upnp: off`, `guest_network: on`, `auto_update: on`. Puis `verify`."
h2.ada.g.harden.standard: "Corrige les six réglages de `box/reglages.conf`, puis `verify`. Chaque ligne refusée te dit ce qui manque. Pour ouvrir le fichier : `edit box/reglages.conf`."
h2.check.admin: "Le mot de passe administrateur n'est plus celui de la notice"
h2.check.wpa3: "Le Wi-Fi accepte WPA3 (seul, ou avec WPA2 pour les vieux appareils)"
h2.check.wps: "Le WPS est coupé"
h2.check.upnp: "L'UPnP est coupé"
h2.check.guest: "Le réseau invité est allumé"
h2.check.update: "Les mises à jour automatiques sont activées"
h2.ada.harden: "Six lignes. Le WPS, c'est un code à huit chiffres qui remplace le mot de passe du Wi-Fi : pratique, et beaucoup plus facile à deviner. `WPA2+WPA3` laisse la vieille imprimante se connecter pendant que les appareils récents prennent le mieux. Le réseau invité, lui, donne Internet sans donner la maison. Reste le mot de passe lui-même."
h2.q.adminpw: "Quel mot de passe administrateur pour la box ?"
h2.q.adminpw.phrase: "Une phrase longue et unique, rangée dans un gestionnaire."
h2.q.adminpw.same: "Le même que celui du Wi-Fi, pour ne pas l'oublier."
h2.q.adminpw.same.why: "Le mot de passe du Wi-Fi, tu le donnes aux amis, à la baby-sitter, au plombier. S'il ouvre aussi les réglages, chacun d'eux est administrateur de la maison."
h2.q.adminpw.sticker: "Le nom de la box suivi de l'année, noté sur l'étiquette."
h2.q.adminpw.sticker.why: "C'est le premier essai de n'importe qui, humain ou programme. Et un mot de passe écrit sous la box se lit en la retournant."
h2.ada.g.password: "Réponds à ma question sur le mot de passe administrateur : les boutons sont dans la messagerie, ou `answer` suivi de ton choix."
h2.ada.password: "Une phrase de quatre ou cinq mots sans rapport, c'est long à deviner et facile à taper. Et comme on ne s'en sert que deux fois par an, elle vit dans le gestionnaire de mots de passe, pas dans la tête de Karim. Dernier point : en coupant l'UPnP, on a fermé la porte de la caméra, et aussi celle de la console de Léa."
h2.q.gaming: "Sans UPnP, la console de Léa ne peut plus héberger de partie en ligne. Que fait-on ?"
h2.q.gaming.manual: "Ouvrir à la main un seul port, pour la console seulement."
h2.q.gaming.manual.why: "Une porte, choisie, écrite dans les réglages, vers un seul appareil. C'est la différence entre une clé confiée et une porte qui s'ouvre toute seule. Coût : dix minutes, et il faudra s'en souvenir le jour où la console change."
h2.q.gaming.nothing: "Ne rien ouvrir : Léa rejoindra les parties des autres."
h2.q.gaming.nothing.why: "Le plus sûr, et le plus simple à tenir. Coût : une adolescente de seize ans qui n'héberge plus ses soirées, et qui te le fera savoir. La sécurité qui gêne trop finit contournée : ça se discute avec elle."
h2.ada.g.console: "Réponds à ma question sur la console de Léa (boutons de la messagerie, ou `answer`). Ici, aucune réponse n'est fausse : chacune a un prix."
h2.ada.console: "C'est noté dans le rapport, avec la raison. Une maison, ça se règle avec ceux qui y vivent."
h2.ada.g.after: "Regarde ce que la box annonce maintenant : `nmcli device wifi list`."
h2.ada.g.after.standard: "Relance la liste des réseaux Wi-Fi pour voir ce que la box annonce maintenant."
h2.ada.after: "`Lemerle-Maison` annonce WPA2 et WPA3, et `Lemerle-Invites` vient d'apparaître. C'est là qu'iront les invités, et bientôt les objets connectés : ils auront Internet, sans voir ni les ordinateurs ni la caméra."
h2.ada.done: "La porte d'entrée est fermée à clé, et la clé n'est plus sous le paillasson. La caméra, elle, a passé seize mois à découvert. Élise vient de me dire qu'elle a reçu un courriel bizarre du fabricant. On regarde ça."
h2.hint.login.1: "`cat maison/notice-nordbox.txt` donne le mot de passe d'origine."
h2.hint.login.2: "Tape `curl -d \"password=admin\" http://box.lemerle.test/`."
h2.hint.port.1: "Tape `curl http://box.lemerle.test/upnp` et cherche la ligne de `cam-salon`."
h2.hint.port.2: "Tape `answer port 554`."
h2.hint.harden.1: "`edit box/reglages.conf` ouvre le fichier dans l'éditeur. `verify` te dit quelles lignes restent à corriger."
h2.hint.harden.2: "Les valeurs attendues : un mot de passe qui n'est plus `admin`, `wifi_security: WPA2+WPA3`, `wps: off`, `upnp: off`, `guest_network: on`, `auto_update: on`."
h2.hint.harden.3: "Avec l'éditeur : `edit box/reglages.conf`, puis Ctrl+S. Avec une commande : par exemple `sed -i \"s/wps: on/wps: off/\" box/reglages.conf`, une ligne à la fois, puis `verify`."
h2.hint.password.1: "Un bon mot de passe est long, ne sert qu'à un endroit, et ne se devine pas depuis l'objet. Tape `answer phrase`."
h2.hint.console.1: "Tape `answer manual` ou `answer nothing`. Les deux se défendent."
h2.hint.after.1: "Tape `nmcli device wifi list`."
h2.debrief.title: "Les réglages d'usine sont faits pour que ça marche, pas pour que ce soit sûr"
h2.debrief.lesson: "Tu n'as rien forcé : tu as lu une notice. La box des Lemerle avait gardé son mot de passe d'origine, laissait chaque appareil ouvrir des ports vers Internet, et n'avait pas reçu une mise à jour depuis 2024. Aucun de ces réglages n'a été choisi par la famille. Ils étaient là en sortant du carton."
h2.debrief.p1: "Le mot de passe administrateur d'une box se change le premier jour. Celui de la notice est public."
h2.debrief.p2: "L'UPnP laisse n'importe quel appareil s'exposer sur Internet sans rien demander. Coupé, il oblige à choisir chaque porte."
h2.debrief.p3: "Le WPS remplace un long mot de passe par un code court. On le coupe, on garde WPA3, ou WPA2 et WPA3 ensemble tant qu'un vieil appareil en a besoin."
h2.debrief.p4: "Un réseau invité donne Internet sans donner accès aux autres appareils. Il sert aux visiteurs et aux objets connectés."
h2.home.p1: "Change le mot de passe administrateur de ta box s'il est encore celui de l'étiquette, et range le nouveau dans un gestionnaire de mots de passe."
h2.home.p2: "Dans les réglages Wi-Fi : choisis WPA3, ou « WPA2/WPA3 » si un vieil appareil ne se connecte plus, et désactive le WPS."
h2.home.p3: "Désactive l'UPnP, puis regarde la liste des redirections de ports : supprime celles que tu ne sais pas expliquer."
h2.home.p4: "Active le réseau invité pour les visiteurs, et les mises à jour automatiques de la box."
