z3.briefing: "Friday 23 March, 9 a.m. The internal investigation is over. The account is closed, the rules are running, the meeting room box has gone to the investigators. What is left is what Ligne Rouge asks of every client after an incident, and must now do itself: write it down honestly, and say it."
z3.file.report: "# Incident report LR-2029-000, for the eight clients. Fix each line, then type: verify\nreport: LR-2029-000\nmeasures: 4\nentry: unknown               # unknown | zero-day | dormant-account\nclients_exposed: 0           # 0 to 8: reports that account could read\nattribution: named-person    # named-person | signature-only\nevidence: deleted            # deleted | preserved\n"
z3.obj.report: "Hand in an honest incident report"
z3.obj.technique: "Name the technique in the grid"
z3.obj.notify: "Decide how to tell the clients"
z3.obj.last: "Read the last card"
z3.check.entry: "The way in is named: a dormant account"
z3.check.clients: "All eight clients are counted as exposed"
z3.check.attribution: "Attribution stops at the signature and names nobody"
z3.check.evidence: "The evidence is preserved"
z3.check.kept: "The report keeps its number and its four measures"
z3.q.technique: "In a grid of attack techniques such as MITRE ATT&CK, where do you file the way Mute got in?"
z3.q.technique.unknown: "Exploiting an unknown flaw in the archive server"
z3.q.technique.unknown.why: "No flaw was used. The server did exactly what it was asked: accept an account that existed, with its password."
z3.q.technique.valid: "Valid accounts: a legitimate access, forgotten and never closed"
z3.q.technique.brute: "Brute force: thousands of passwords tried one after another"
z3.q.technique.brute.why: "The log shows a single login, accepted first time, and no failure before it. He knew the password."
z3.q.notify: "The eight clients must know their report may have been read. How does Ligne Rouge tell them?"
z3.q.notify.call: "Call all eight today, one by one, with what we know"
z3.q.notify.call.why: "A whole day on the phone, with questions you do not have every answer to yet."
z3.q.notify.letter: "Send the same letter to all eight today, without calling"
z3.q.notify.letter.why: "Fast, and the same text for all. But nobody can ask a letter a question."
z3.q.notify.wait: "Wait for the investigators' report and say it all at once"
z3.q.notify.wait.why: "A complete, checked message, in ten days. Until then, eight clients know nothing."
z3.ada.brief: "A draft report is waiting in `rapports/`. I wrote it on Tuesday evening, tired and annoyed, and it shows: it tidies everything up. Put on each line what we actually know. The data protection authority has been told since Monday; that one was not a choice."
z3.ada.g.report: "Open the report: `edit rapports/LR-2029-000.yml`. Entry by `dormant-account`, `clients_exposed: 8`, attribution `signature-only`, evidence `preserved`. Save, then `verify`."
z3.ada.g.report.standard: "Fix `rapports/LR-2029-000.yml`: how he got in, how many clients are exposed, what we can state about him, what we did with the evidence. Then `verify`."
z3.ada.g.technique: "Answer my question in the messenger, or with `answer`."
z3.ada.g.notify: "This one has no right answer, only prices. Choose in the messenger, or with `answer`."
z3.ada.g.last: "One last thing. Since the account was closed, a page has appeared on our intranet. Read it: `curl https://intranet.lignerouge.test/m`."
z3.ada.g.last.standard: "One last thing. Since the account was closed, a page has appeared on our intranet, at `/m`."
z3.ada.report: "Now that is a report we can sign. Eight clients exposed, not \"none that we know of\": that account could read everything, so we count everything. And a signature, not a name: we know what that hand did, we do not know whose it is."
z3.ada.technique: "Valid accounts. The least spectacular technique in the grid, and the one we meet in almost every case: NovaMind's intern, Corbelle's backup account, Verdure's factory key. Nobody breaks down a door they hold the key to."
z3.ada.notify.call: "Eight calls, two of them hard. Halcyon and Alto suspend their contracts, and I understand them. But Inès, at NovaMind, said something I am keeping: \"You taught us to say it fast. I see you can do it too.\""
z3.ada.notify.letter: "The letter went out at noon. By one o'clock, three clients had called back with the questions the letter did not answer. We ended up making the eight calls anyway, one day late on trust."
z3.ada.notify.wait: "We waited. On the tenth day, the mayor of Corbelle called: a journalist had just asked her about it. She did not shout. She said she would rather have heard it from us, and that was worse."
z3.ada.last: "\"Part 7 of 6.\" He knew we would end up laying them side by side, and he had kept that one for the day. We did not catch him. We closed his door, we have what it takes to recognise him, and the investigators have a box, six cards and three years of logs."
z3.ada.done: "It is over. Open the debrief."
z3.ada.end: "Eight mandates, eight reports, and a ninth about ourselves. You started here typing your first command under my dictation. This week you held the night without me, wrote the rules and signed the report. I do not have much left to teach you, Kestrel. And for once, nobody wrote \"see you soon\"."
z3.hint.report.1: "`cat rapports/LR-2029-000.yml` shows each line and its possible values. `edit rapports/LR-2029-000.yml` opens it in the editor."
z3.hint.report.2: "He came in through a dormant account, that account could read all eight reports, nobody can be named, and evidence is never deleted."
z3.hint.report.3: "`entry: dormant-account`, `clients_exposed: 8`, `attribution: signature-only`, `evidence: preserved`, then `verify`."
z3.hint.technique.1: "No flaw, no failed attempt: he had an account and its password."
z3.hint.notify.1: "No choice is wrong. Each costs Ligne Rouge something: read what you are ready to pay."
z3.hint.last.0: "The six cards were all at the same address on each client's site. Look at our intranet."
z3.hint.last.1: "Type `curl https://intranet.lignerouge.test/m`."
z3.debrief.title: "Silence"
z3.debrief.lesson: "Mute was not arrested. He lost his door, his method is written down, and those he targeted have been told. That is what a win in defence most often looks like: not a culprit in handcuffs, but an intruder outside, evidence kept, and a report that tells the truth."
z3.debrief.p1: "An incident report counts what could have been reached, not only what was seen leaving. When in doubt, tell people."
z3.debrief.p2: "Attribute to a signature, to a way of working. Naming a person takes evidence only an investigation can gather."
z3.debrief.p3: "Telling fast costs less than telling late. What clients do not forgive is the delay."
z3.debrief.p4: "The advice you give others applies to you. The firm that files its clients' flaws is a target like any other, and often a better one."
