z3.briefing: "Vendredi 23 mars, 9 h. L'enquête interne est finie. Le compte est fermé, les règles tournent, le boîtier de la salle de réunion est parti chez les enquêteurs. Il reste ce que Ligne Rouge demande à tous ses clients après un incident, et qu'elle doit maintenant faire elle-même : l'écrire honnêtement, et le dire."
z3.file.report: "# Rapport d'incident LR-2029-000, destiné aux huit clients. Corrige chaque ligne, puis tape : verify\nreport: LR-2029-000\nmeasures: 4\nentry: unknown               # unknown | zero-day | dormant-account\nclients_exposed: 0           # de 0 à 8 : rapports lisibles par ce compte\nattribution: named-person    # named-person | signature-only\nevidence: deleted            # deleted | preserved\n"
z3.obj.report: "Rendre un rapport d'incident honnête"
z3.obj.technique: "Nommer la technique dans la grille"
z3.obj.notify: "Décider comment prévenir les clients"
z3.obj.last: "Lire la dernière carte"
z3.check.entry: "La porte d'entrée est nommée : un compte dormant"
z3.check.clients: "Les huit clients sont comptés comme exposés"
z3.check.attribution: "L'attribution s'arrête à la signature, sans nommer personne"
z3.check.evidence: "Les preuves sont conservées"
z3.check.kept: "Le rapport garde son numéro et ses quatre mesures"
z3.q.technique: "Dans une grille de techniques d'attaque comme MITRE ATT&CK, où ranges-tu la manière dont Mute est entré ?"
z3.q.technique.unknown: "Exploitation d'une faille inconnue du serveur d'archives"
z3.q.technique.unknown.why: "Aucune faille n'a servi. Le serveur a fait exactement ce qu'on lui demandait : accepter un compte qui existait, avec son mot de passe."
z3.q.technique.valid: "Comptes valides : un accès légitime, oublié et jamais fermé"
z3.q.technique.brute: "Force brute : des milliers de mots de passe à la suite"
z3.q.technique.brute.why: "Le journal montre une seule connexion, acceptée du premier coup, et aucun échec avant. Il connaissait le mot de passe."
z3.q.notify: "Les huit clients doivent savoir que leur rapport a pu être lu. Comment Ligne Rouge le leur dit-elle ?"
z3.q.notify.call: "Appeler les huit aujourd'hui, un par un, avec ce qu'on sait"
z3.q.notify.call.why: "Une journée entière au téléphone, avec des questions auxquelles tu n'as pas encore toutes les réponses."
z3.q.notify.letter: "Envoyer aujourd'hui le même courrier aux huit, sans appeler"
z3.q.notify.letter.why: "Rapide, et le même texte pour tous. Mais personne ne peut poser de question à une lettre."
z3.q.notify.wait: "Attendre le rapport des enquêteurs pour tout dire d'un coup"
z3.q.notify.wait.why: "Un message complet et vérifié, dans dix jours. D'ici là, huit clients ne savent rien."
z3.ada.brief: "Un brouillon de rapport t'attend dans `rapports/`. Je l'ai écrit mardi soir, fatiguée et vexée, et ça se voit : il arrange tout. Remets sur chaque ligne ce qu'on sait vraiment. La CNIL est prévenue depuis lundi, ça, ce n'était pas un choix."
z3.ada.g.report: "Ouvre le rapport : `edit rapports/LR-2029-000.yml`. Entrée par `dormant-account`, `clients_exposed: 8`, attribution `signature-only`, preuves `preserved`. Enregistre, puis `verify`."
z3.ada.g.report.standard: "Corrige `rapports/LR-2029-000.yml` : par où il est entré, combien de clients sont exposés, ce qu'on peut affirmer sur lui, ce qu'on a fait des preuves. Puis `verify`. Pour ouvrir le fichier : `edit rapports/LR-2029-000.yml`."
z3.ada.g.technique: "Réponds à ma question dans la messagerie, ou avec `answer`."
z3.ada.g.notify: "Celle-ci n'a pas de bonne réponse, seulement des prix. Choisis dans la messagerie, ou avec `answer`."
z3.ada.g.last: "Une dernière chose. Depuis que le compte est fermé, une page est apparue sur notre intranet. Lis-la : `curl https://intranet.lignerouge.test/m`."
z3.ada.g.last.standard: "Une dernière chose. Depuis que le compte est fermé, une page est apparue sur notre intranet, à l'adresse `/m`."
z3.ada.report: "Voilà un rapport qu'on peut signer. Huit clients exposés, pas « zéro à notre connaissance » : ce compte pouvait tout lire, donc on compte tout. Et une signature, pas un nom : on sait ce que cette main a fait, on ne sait pas à qui elle appartient."
z3.ada.technique: "Comptes valides. La technique la moins spectaculaire de la grille, et celle qu'on retrouve dans presque toutes nos affaires : le stagiaire de NovaMind, le compte de sauvegarde de Corbelle, la clé d'usine de Verdure. On n'enfonce pas une porte dont on a la clé."
z3.ada.notify.call: "Huit appels, dont deux difficiles. Halcyon et Alto suspendent leur contrat, et je les comprends. Mais Inès, de NovaMind, a dit une chose que je garde : « Vous nous avez appris à le dire vite. Je vois que vous savez le faire aussi. »"
z3.ada.notify.letter: "Le courrier est parti à midi. À treize heures, trois clients avaient rappelé avec les questions auxquelles la lettre ne répondait pas. On a fini par passer les huit appels quand même, avec une journée de retard sur la confiance."
z3.ada.notify.wait: "On a attendu. Le dixième jour, la maire de Corbelle a appelé : un journaliste venait de lui poser la question. Elle n'a pas crié. Elle a dit qu'elle aurait préféré l'apprendre par nous, et c'était pire."
z3.ada.last: "« Morceau 7 sur 6. » Il savait qu'on finirait par les poser côte à côte, et il avait gardé celui-là pour ce jour. On ne l'a pas attrapé. On lui a fermé sa porte, on a de quoi le reconnaître, et les enquêteurs ont un boîtier, six cartes et trois ans de journaux."
z3.ada.done: "C'est fini. Ouvre le débrief."
z3.ada.end: "Huit mandats, huit rapports, et un neuvième sur nous-mêmes. Tu as commencé ici en tapant ta première commande sous ma dictée. Cette semaine, tu as tenu la nuit sans moi, écrit les règles et signé le rapport. Je n'ai plus grand-chose à t'apprendre, Kestrel. Et pour une fois, personne n'a écrit « à bientôt »."
z3.hint.report.1: "`cat rapports/LR-2029-000.yml` montre chaque ligne et les valeurs possibles. `edit rapports/LR-2029-000.yml` l'ouvre dans l'éditeur."
z3.hint.report.2: "Il est entré par un compte dormant, ce compte pouvait lire les huit rapports, on ne peut nommer personne, et on n'efface jamais une preuve."
z3.hint.report.3: "`entry: dormant-account`, `clients_exposed: 8`, `attribution: signature-only`, `evidence: preserved`, puis `verify`."
z3.hint.technique.1: "Aucune faille, aucun essai raté : il avait un compte et son mot de passe."
z3.hint.notify.1: "Aucun choix n'est faux. Chacun coûte quelque chose à Ligne Rouge : lis ce que tu es prêt à payer."
z3.hint.last.0: "Les six cartes étaient toutes à la même adresse sur le site de chaque client. Regarde notre intranet."
z3.hint.last.1: "Tape `curl https://intranet.lignerouge.test/m`."
z3.debrief.title: "Silence"
z3.debrief.lesson: "Mute n'a pas été arrêté. Il a perdu sa porte, sa méthode est écrite, et ceux qu'il visait sont prévenus. C'est à cela que ressemble le plus souvent une victoire en défense : pas un coupable menotté, mais un intrus dehors, des preuves gardées, et un rapport qui dit la vérité."
z3.debrief.p1: "Un rapport d'incident compte ce qui a pu être touché, pas seulement ce qu'on a vu partir. Dans le doute, on prévient."
z3.debrief.p2: "On attribue à une signature, à une manière de faire. Nommer une personne demande des preuves que seule une enquête peut réunir."
z3.debrief.p3: "Prévenir vite coûte moins cher que prévenir tard. Ce que les clients ne pardonnent pas, c'est le délai."
z3.debrief.p4: "Les conseils qu'on donne aux autres valent pour soi. Le cabinet qui range les failles de ses clients est une cible comme une autre, et souvent une meilleure."
