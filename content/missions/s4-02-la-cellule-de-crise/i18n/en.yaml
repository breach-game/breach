c2.briefing: "Monday, 9:30 am. The locking has stopped and the civil registry is safe. The crisis cell is gathered in the council chamber: Brigitte Lemaire from the front desk, Yanis Morel the IT man, and the mayor, Hélène Vasseur. Each holds a part of the story. By noon the mayor must have decided, and she is waiting for your advice."
c2.obj.origin: "Learn from Brigitte Lemaire how it all started"
c2.obj.backups: "Learn from Yanis Morel where the backups stand"
c2.obj.mayor: "Hear from the mayor what the intruder demands"
c2.obj.ransom: "Advise the mayor on the ransom"
c2.obj.comms: "Advise the mayor on what to say, and to whom"
c2.obj.notify: "Advise the mayor on which authorities to tell"
c2.obj.delay: "Say what the gap between Friday and Monday reveals"
c2.q.ransom: "The mayor looks at you: \"80,000 euros, 72 hours. What do I do?\""
c2.q.ransom.pay: "Pay: it is cheaper than a week at a standstill"
c2.q.ransom.pay.why: "The mayor pays. Nothing guarantees that the key arrives, that it works, or that the data was not copied already. The intruder now knows that Corbelle pays. And everything still has to be cleaned: paying removes nothing of what he left in the network."
c2.q.ransom.refuse: "Refuse, and rebuild from the backups"
c2.q.ransom.refuse.why: "The mayor refuses. It will take longer, and the backups will have to keep their promise. But public money does not fund the next attack, and the town hall starts again from a base it controls."
c2.q.ransom.stall: "Pay nothing and do not answer the note, while the backups are checked"
c2.q.ransom.stall.why: "The mayor does not answer the note and pays nothing. The intruder's countdown binds only him. These hours go into finding out whether the backups are usable, before closing the door for good."
c2.q.comms: "\"The Corbelle Courier calls back at noon, and my staff are staring at black screens. What do I say?\""
c2.q.comms.silence: "Say nothing until everything is back"
c2.q.comms.silence.why: "The town hall stays silent. By noon a photo of the note is going round the staff, then the town. The paper writes without the town hall, and every resident imagines the worst for their own records."
c2.q.comms.plain: "Say what is known, what is not known yet, and what is being done"
c2.q.comms.plain.why: "The mayor speaks to the staff at 11, then to the paper: what is hit, what is not, what is still unknown, when she will give news again. Nobody is reassured, but everybody knows where things stand."
c2.q.comms.blame: "Say that an employee opened a booby-trapped attachment"
c2.q.comms.blame.why: "The mayor points at the front desk. Brigitte Lemaire goes home in tears. And every member of staff learns the lesson: next time you click on something dubious, above all tell nobody."
c2.q.notify: "\"And the authorities? Yanis says we have duties. We do not even know yet what was taken.\""
c2.q.notify.now: "File a complaint and tell the data protection authority now, and complete it later"
c2.q.notify.now.why: "Complaint filed, the data protection authority told within the day. The notification says what is known and will be completed: the law allows it. In return the town hall gets help, and a case number to show anyone who claims it hid something."
c2.q.notify.later: "Wait until it is known exactly what was taken"
c2.q.notify.later.why: "The town hall waits to see clearly. But the 72 hours run from this morning, not from the end of the investigation. On Thursday it will have to notify late and explain why, just when everyone is exhausted."
c2.q.delay: "Brigitte typed her password on Friday at 4:40 pm. The locking started on Monday at 6:12 am. What does that gap say?"
c2.q.delay.weekend: "The intruder had the whole weekend inside: everything dated after Friday 4:40 pm is suspect, backups included"
c2.q.delay.slow: "The locking program needed sixty hours to prepare its work, which proves that nothing else was touched before this Monday morning"
c2.q.delay.slow.why: "Locking files takes a few minutes, you saw it this morning. Sixty hours of silence is someone visiting, not a program computing."
c2.q.delay.recent: "Nothing special: last night's backup, at 2 am, is the most recent one and predates the locking, so it is the one to restore"
c2.q.delay.recent.why: "It predates the locking, not the intrusion. If the intruder left something on Saturday, last night's backup carefully put it aside for you."
c2.ada.brief: "We go from machines to people, and that is half the job. You manipulate nobody here: you ask simple questions and you listen. Then the mayor will ask for your advice. I will not tell you what to answer: there is no right box, only different prices. The cell meets on the intranet: `https://intranet.corbelle.test/cellule`."
c2.ada.g.origin: "Start with the one it all began with. Open the intranet in the browser, `https://intranet.corbelle.test/cellule`, and talk to Brigitte Lemaire: ask her what happened on Friday."
c2.ada.g.origin.standard: "The crisis cell is on the town hall's intranet. Start with Brigitte Lemaire: we need to know how it got in."
c2.ada.g.backups: "Now Yanis Morel, from the same page. Ask him where the backups stand."
c2.ada.g.backups.standard: "Yanis Morel knows what the backups are worth. Ask him."
c2.ada.g.mayor: "That leaves the mayor. Ask her what the ransom demands."
c2.ada.g.mayor.standard: "You still need the mayor: hear what she has on the table before you advise her."
c2.ada.g.ransom: "First decision: the ransom. Choose in the messenger, or type `answer` to read the options again."
c2.ada.g.comms: "Second decision: what the town hall says, and to whom. Choose in the messenger or with `answer`."
c2.ada.g.notify: "Third decision: the authorities. Choose in the messenger or with `answer`."
c2.ada.g.ransom.standard: "First decision: the ransom. The mayor is waiting for your answer."
c2.ada.g.comms.standard: "Second decision: what the town hall says."
c2.ada.g.notify.standard: "Third decision: the authorities."
c2.ada.g.delay: "One last question, from me this time. Answer in the messenger or with `answer`."
c2.ada.origin: "Friday, 4:40 pm: a fake email, a fake page, a real password. Note the time. And note what she says between the lines: nobody ever told her whom to warn."
c2.ada.password: "The same password for her session and her mailbox, with no second factor. With it the intruder opened the shared folders like any member of staff."
c2.ada.backups: "Backups every night, a disk unplugged every Sunday, and not one restore ever tried. We will know what they are worth when we need them, which means shortly."
c2.ada.account: "There is the missing link. Brigitte's password opened the common share, and in the common share slept the password of the account that reads everything."
c2.ada.decide: "You have the three parts. The mayor turns to you."
c2.ada.delay: "The decisions are made, and they will have their consequences. Before we touch the backups, I want to be sure you saw what I saw."
c2.ada.done: "Exactly. Sixty hours of visiting. We will restore nothing with our eyes shut. Go to the debrief, then we open the backup catalogue."
c2.hint.origin.1: "The crisis cell is at `https://intranet.corbelle.test/cellule`. Brigitte answers when you ask about Friday."
c2.hint.origin.2: "In the terminal: `curl -d \"what happened on Friday?\" https://intranet.corbelle.test/api/cellule/accueil`"
c2.hint.backups.1: "Ask Yanis Morel where the backups stand."
c2.hint.backups.2: "`curl -d \"where do the backups stand?\" https://intranet.corbelle.test/api/cellule/dsi`"
c2.hint.mayor.1: "Ask the mayor what the ransom demands."
c2.hint.mayor.2: "`curl -d \"what does the ransom demand?\" https://intranet.corbelle.test/api/cellule/maire`"
c2.hint.decide: "This is a decision: no option is wrong, each has a price. `answer` shows the options, `answer <letter>` picks one."
c2.hint.delay.1: "Locking took a few minutes this morning. What was the intruder doing during the sixty hours before?"
c2.hint.delay.2: "If he was there all weekend, what do the weekend's backups contain?"
c2.debrief.title: "Deciding with what you know"
c2.debrief.lesson: "A cyber crisis is won or lost in the council chamber as much as in the logs. Three decisions cannot wait for the end of the investigation: the ransom, what is said, the authorities. None is technical, and all rest on what the technical work established: where it came from, what is hit, what the backups are worth."
c2.debrief.p1: "Paying guarantees neither the key, nor the intruder's silence, nor a clean network. It does name a payer."
c2.debrief.p2: "Say early what you know and what you do not. Silence leaves the story to others."
c2.debrief.p3: "Never name the person who clicked: you want the next one to raise the alarm within the minute, not to hide."
c2.debrief.p4: "A complaint and a notification to the data protection authority within 72 hours of the discovery. A first incomplete notification beats a late one."
