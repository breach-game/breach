c2.briefing: "Lundi, 9 h 30. Le verrouillage est arrêté et l'état civil est sauf. La cellule de crise est réunie en salle du conseil : Brigitte Lemaire de l'accueil, Yanis Morel l'informaticien, et la maire, Hélène Vasseur. Chacun a un morceau de l'histoire. À midi, la maire devra avoir décidé, et elle attend ton avis."
c2.obj.origin: "Apprendre de Brigitte Lemaire comment tout a commencé"
c2.obj.backups: "Apprendre de Yanis Morel où en sont les sauvegardes"
c2.obj.mayor: "Entendre de la maire ce que réclame l'intrus"
c2.obj.ransom: "Conseiller la maire sur la rançon"
c2.obj.comms: "Conseiller la maire sur ce qu'on dit, et à qui"
c2.obj.notify: "Conseiller la maire sur les autorités à prévenir"
c2.obj.delay: "Dire ce que révèle le délai entre vendredi et lundi"
c2.q.ransom: "La maire te regarde : « 80 000 euros, 72 heures. Qu'est-ce que je fais ? »"
c2.q.ransom.pay: "Payer : c'est moins cher qu'une semaine d'arrêt"
c2.q.ransom.pay.why: "La maire paie. Rien ne garantit que la clé arrive, ni qu'elle marche, ni que les données n'ont pas déjà été copiées. L'intrus, lui, sait désormais que Corbelle paie. Et il faudra tout nettoyer quand même : payer n'enlève rien de ce qu'il a laissé dans le réseau."
c2.q.ransom.refuse: "Refuser, et reconstruire depuis les sauvegardes"
c2.q.ransom.refuse.why: "La maire refuse. Ce sera plus long, et il faudra que les sauvegardes tiennent leur promesse. Mais l'argent public ne finance pas la prochaine attaque, et la mairie repart d'une base qu'elle maîtrise."
c2.q.ransom.stall: "Ne rien verser et ne pas répondre à la note, le temps de vérifier les sauvegardes"
c2.q.ransom.stall.why: "La maire ne répond pas à la note et ne verse rien. Le compte à rebours de l'intrus n'engage que lui. Ces heures servent à savoir si les sauvegardes sont utilisables, avant de fermer la porte pour de bon."
c2.q.comms: "« Le Courrier de Corbelle rappelle à midi, et mes agents regardent des écrans noirs. Qu'est-ce que je dis ? »"
c2.q.comms.silence: "Ne rien dire tant que tout n'est pas rétabli"
c2.q.comms.silence.why: "La mairie se tait. À midi, une photo de la note circule déjà entre agents, puis en ville. Le journal écrit sans la mairie, et chaque habitant imagine le pire pour ses propres papiers."
c2.q.comms.plain: "Dire ce qu'on sait, ce qu'on ignore encore, et ce qui est fait"
c2.q.comms.plain.why: "La maire parle aux agents à 11 h, puis au journal : ce qui est touché, ce qui ne l'est pas, ce qu'on ignore encore, quand elle redonnera des nouvelles. Personne n'est rassuré, mais tout le monde sait à quoi s'en tenir."
c2.q.comms.blame: "Dire qu'une employée a ouvert une pièce jointe piégée"
c2.q.comms.blame.why: "La maire désigne l'accueil. Brigitte Lemaire rentre chez elle en larmes. Et chaque agent retient la leçon : la prochaine fois qu'on clique sur quelque chose de douteux, surtout ne rien dire à personne."
c2.q.notify: "« Et les autorités ? Yanis dit qu'on a des obligations. On ne sait même pas encore ce qui a été pris. »"
c2.q.notify.now: "Porter plainte et prévenir la CNIL maintenant, quitte à compléter ensuite"
c2.q.notify.now.why: "Plainte déposée, CNIL prévenue dans la journée. La déclaration dit ce qu'on sait et sera complétée : la loi le prévoit. La mairie reçoit en retour de l'aide, et un numéro de dossier à opposer à quiconque lui reprochera d'avoir caché quelque chose."
c2.q.notify.later: "Attendre de savoir exactement ce qui a été pris"
c2.q.notify.later.why: "La mairie attend d'y voir clair. Mais le délai de 72 heures court depuis ce matin, pas depuis la fin de l'enquête. Jeudi, il faudra déclarer en retard et expliquer pourquoi, au moment où tout le monde est épuisé."
c2.q.delay: "Brigitte a tapé son mot de passe vendredi à 16 h 40. Le verrouillage a commencé lundi à 6 h 12. Que dit cet écart ?"
c2.q.delay.weekend: "L'intrus a eu tout le week-end à l'intérieur : tout ce qui date d'après vendredi 16 h 40 est suspect, sauvegardes comprises"
c2.q.delay.slow: "Le programme de verrouillage a mis soixante heures à préparer son travail, ce qui prouve que rien d'autre n'a été touché avant ce lundi matin"
c2.q.delay.slow.why: "Verrouiller des fichiers prend quelques minutes, tu l'as vu ce matin. Soixante heures de silence, c'est quelqu'un qui visite, pas un programme qui calcule."
c2.q.delay.recent: "Rien de particulier : la sauvegarde de cette nuit, à 2 h, est la plus récente et précède le verrouillage, c'est donc elle qu'il faudra restaurer"
c2.q.delay.recent.why: "Elle précède le verrouillage, pas l'intrusion. Si l'intrus a déposé quelque chose samedi, la sauvegarde de cette nuit l'a soigneusement mis de côté pour toi."
c2.ada.brief: "On passe des machines aux gens, et c'est la moitié du métier. Tu ne manipules personne ici : tu poses des questions simples et tu écoutes. Ensuite la maire te demandera ton avis. Je ne te dirai pas quoi répondre : il n'y a pas de bonne case, seulement des prix différents. La cellule se tient sur l'intranet : `https://intranet.corbelle.test/cellule`."
c2.ada.g.origin: "Commence par celle d'où tout est parti. Ouvre l'intranet dans le navigateur, `https://intranet.corbelle.test/cellule`, et parle à Brigitte Lemaire : demande-lui ce qui s'est passé vendredi."
c2.ada.g.origin.standard: "La cellule de crise est sur l'intranet de la mairie. Commence par Brigitte Lemaire : il faut savoir comment c'est entré."
c2.ada.g.backups: "Maintenant Yanis Morel, depuis la même page. Demande-lui où en sont les sauvegardes."
c2.ada.g.backups.standard: "Yanis Morel sait ce que valent les sauvegardes. Demande-le-lui."
c2.ada.g.mayor: "Reste la maire. Demande-lui ce que réclame la rançon."
c2.ada.g.mayor.standard: "Il te manque la maire : écoute ce qu'elle a sur la table avant de la conseiller."
c2.ada.g.ransom: "Première décision : la rançon. Choisis dans la messagerie, ou tape `answer` pour relire les options."
c2.ada.g.comms: "Deuxième décision : ce que la mairie dit, et à qui. Choisis dans la messagerie ou avec `answer`."
c2.ada.g.notify: "Troisième décision : les autorités. Choisis dans la messagerie ou avec `answer`."
c2.ada.g.ransom.standard: "Première décision : la rançon. La maire attend ta réponse."
c2.ada.g.comms.standard: "Deuxième décision : la parole de la mairie."
c2.ada.g.notify.standard: "Troisième décision : les autorités."
c2.ada.g.delay: "Une dernière question, de moi cette fois. Réponds dans la messagerie ou avec `answer`."
c2.ada.origin: "Vendredi, 16 h 40 : un faux courriel, une fausse page, un vrai mot de passe. Note l'heure. Et note aussi ce qu'elle dit entre les lignes : personne ne lui a jamais expliqué qui prévenir."
c2.ada.password: "Le même mot de passe pour la session et la messagerie, sans second facteur. Avec lui, l'intrus a ouvert les dossiers partagés comme n'importe quel agent."
c2.ada.backups: "Des sauvegardes chaque nuit, un disque débranché chaque dimanche, et aucune restauration jamais essayée. On saura ce qu'elles valent quand on en aura besoin, c'est-à-dire tout à l'heure."
c2.ada.account: "Voilà le chaînon manquant. Le mot de passe de Brigitte ouvrait le partage commun, et dans le partage commun dormait celui du compte qui lit tout."
c2.ada.decide: "Tu as les trois morceaux. La maire se tourne vers toi."
c2.ada.delay: "Les décisions sont prises, elles auront leurs suites. Avant de toucher aux sauvegardes, je veux être sûre que tu as vu la même chose que moi."
c2.ada.done: "Exactement. Soixante heures de visite. On ne restaurera rien les yeux fermés. Passe au débrief, puis on ouvre le catalogue des sauvegardes."
c2.hint.origin.1: "La cellule de crise est à l'adresse `https://intranet.corbelle.test/cellule`. Brigitte répond quand on lui parle de vendredi."
c2.hint.origin.2: "Dans le terminal : `curl -d \"que s'est-il passé vendredi ?\" https://intranet.corbelle.test/api/cellule/accueil`"
c2.hint.backups.1: "Demande à Yanis Morel où en sont les sauvegardes."
c2.hint.backups.2: "`curl -d \"où en sont les sauvegardes ?\" https://intranet.corbelle.test/api/cellule/dsi`"
c2.hint.mayor.1: "Demande à la maire ce que réclame la rançon."
c2.hint.mayor.2: "`curl -d \"que demande la rançon ?\" https://intranet.corbelle.test/api/cellule/maire`"
c2.hint.decide: "C'est une décision : aucune option n'est fausse, chacune a un prix. `answer` affiche les options, `answer <lettre>` choisit."
c2.hint.delay.1: "Verrouiller a pris quelques minutes ce matin. Que faisait l'intrus pendant les soixante heures d'avant ?"
c2.hint.delay.2: "S'il était là tout le week-end, que contiennent les sauvegardes du week-end ?"
c2.debrief.title: "Décider avec ce qu'on sait"
c2.debrief.lesson: "Une crise d'origine cyber se gagne ou se perd autant en salle du conseil que dans les journaux. Trois décisions ne peuvent pas attendre la fin de l'enquête : la rançon, la parole, les autorités. Aucune n'est technique, et toutes s'appuient sur ce que la technique a établi : d'où c'est venu, ce qui est touché, ce que valent les sauvegardes."
c2.debrief.p1: "Payer ne garantit ni la clé, ni le silence de l'intrus, ni un réseau propre. Cela désigne en revanche un payeur."
c2.debrief.p2: "Dire tôt ce qu'on sait et ce qu'on ignore. Le silence laisse le récit aux autres."
c2.debrief.p3: "Ne jamais désigner la personne qui a cliqué : on veut que la prochaine prévienne dans la minute, pas qu'elle se cache."
c2.debrief.p4: "Plainte et déclaration à l'autorité de protection des données dans les 72 heures après la découverte. Une première déclaration incomplète vaut mieux qu'une déclaration tardive."
