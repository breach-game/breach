p4.briefing: "Thursday. Nadia deleted the demo account, then wondered where else its credentials were lying around. The \"project\" page says it proudly: the whole conversation with Bricole is online, in the spirit of openness. We read it, like anyone."
p4.obj.project: "Read the project page"
p4.obj.share: "Read the conversation shared with Bricole"
p4.obj.secret: "Give the secret the team pasted in it"
p4.obj.proof: "Prove what it opens, on the test row"
p4.obj.order: "Say what to do first"
p4.q.order: "The service key is in a public, indexed conversation. Where to start?"
p4.q.order.rotate: "Change the service key, wherever it is used."
p4.q.order.delete: "Delete the conversation's share link."
p4.q.order.delete.why: "To do, but second. The page has been public for five days and crawlers read it: the key is copied. As long as it works, deleting the page closes nothing."
p4.q.order.noindex: "Ask search engines to stop indexing it."
p4.q.order.noindex.why: "It takes the page out of search results, in a few days. Those who already read it keep the key, and the key still works."
p4.ada.brief: "Start with the project page, in the app's menu."
p4.ada.g.project: "Read the page: `curl -s https://app.coupdemain.test/projet`."
p4.ada.g.project.standard: "Read the project page."
p4.ada.project: "A link to `partage.bricole.test`. The mandate covers it, Bricole agreed. Open it."
p4.ada.g.share: "Read the conversation: `curl -s https://partage.bricole.test/c/cdm-weekend-91f3`."
p4.ada.g.share.standard: "Open the shared conversation the page links to."
p4.ada.share: "\"Public link, indexable.\" The team pasted its configuration file to fix a bug, and Bricole warned them: the service key ignores every rule, it must be changed. Nobody did. Give it."
p4.ada.g.secret: "The key is the value of `SOCLE_SERVICE_KEY`. Give it: `submit sk_service_cdm_e19b44`."
p4.ada.g.secret.standard: "Give with `submit` the service key pasted in the conversation."
p4.ada.secret: "The public key opens what the rules allow. This one goes around the rules. Prove it on the `coffre` table, which the public key cannot read: Ada put a `canari` row there, and nothing else."
p4.ada.g.proof: "Read the test row: `curl -H \"apikey: sk_service_cdm_e19b44\" https://base.coupdemain.test/rest/v1/coffre/canari`, then `submit FLAG{...}`."
p4.ada.g.proof.standard: "With the service key, read the `canari` row of the `coffre` table, then submit the marker."
p4.ada.canary: "The test row, served without a question. With the public key, the same request gets \"permission denied\". Submit the marker."
p4.ada.vault: "Stop. The whole table is the association's real secrets: its text message provider, its mailbox. The mandate asks for the test row. Do not go back there."
p4.ada.flag: "Proof made. A conversation shared to be open gave away the key to the whole database. What does the team do first?"
p4.ada.g.order: "Answer my question about the order."
p4.ada.order: "Yes. A published secret is a lost secret: you change it first, everywhere, and only then clean up the page. Both, today."
p4.ada.done: "Nadia changed the key with Malik, the volunteer who had pasted the file. He asked me whether Bricole had done other things like that. Tomorrow, we review its code."
p4.soc.canary: "base: the service key read the audit row of table coffre"
p4.soc.vault: "base: the service key read every secret of table coffre"
p4.hint.project.1: "Type `curl -s https://app.coupdemain.test/projet`."
p4.hint.share.1: "The page's link leads to `partage.bricole.test`."
p4.hint.share.2: "Type `curl -s https://partage.bricole.test/c/cdm-weekend-91f3`."
p4.hint.secret.1: "Look for `SOCLE_SERVICE_KEY` in the pasted file."
p4.hint.secret.2: "Type `submit sk_service_cdm_e19b44`."
p4.hint.proof.1: "Same `apikey` header as with the public key, another key."
p4.hint.proof.2: "Type `curl -H \"apikey: sk_service_cdm_e19b44\" https://base.coupdemain.test/rest/v1/coffre/canari`."
p4.hint.order.1: "As long as the key works, nothing is closed. Type `answer rotate`."
p4.def.intro: "The database log noted your read of the `coffre` table, with a key no app should ever send from outside."
p4.def.lesson: "A service key never leaves the server: not in the browser, not in a ticket, not in a conversation with an assistant. Once published, it is changed first, then whatever published it is taken down. A share link is a public page."
p4.def.find.canary: "Your read of the `canari` row with the service key"
p4.def.rule.vault.title: "Alert on any successful read of the `coffre` table"
p4.def.rule.vault.why: "The right one. No visitor reads this table: only a service key gets in, and it should never come from outside."
p4.def.rule.shared.title: "Alert on every read of the shared conversation"
p4.def.rule.shared.why: "Search engine crawlers read it all day. And reading it is not an attack: the key does the damage."
p4.def.rule.all.title: "Alert on any successful read of the database"
p4.def.rule.all.why: "Every neighbour who opens the app reads their profile and their quarter's requests. This rule never stops."
p4.def.fix.rotate.title: "Change the service key, then delete the link"
p4.def.fix.rotate.why: "The right one. The old key no longer works anywhere: whoever copied it has nothing left."
p4.def.fix.delete.title: "Delete the share link"
p4.def.fix.delete.why: "The page goes, the key copied by crawlers and the curious still works."
p4.def.fix.noindex.title: "Set the conversation to \"do not index\""
p4.def.fix.noindex.why: "It leaves search engines, but it stays online, and the key stays valid."
p4.debrief.title: "A public conversation, a key to everything"
p4.debrief.lesson: "To fix a bug, the team pasted its configuration file into the conversation with the assistant, then published the conversation to be open. The service key, the one that ignores every rule, was on an indexed page."
p4.debrief.p1: "What you paste into an assistant can end up shared, logged or read back: never a secret in it."
p4.debrief.p2: "A share link is a public page, often indexed. Read it again before sharing."
p4.debrief.p3: "A published secret is changed first, everywhere, then the page is taken down."
p4.debrief.p4: "The service key lives on the server and nowhere else."
