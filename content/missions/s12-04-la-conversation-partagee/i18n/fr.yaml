p4.briefing: "Jeudi. Nadia a supprimé le compte de démo, puis elle s'est demandé où d'autre ses identifiants traînaient. La page « Le projet » le dit avec fierté : toute la conversation avec Bricole est en ligne, par transparence. On la lit, comme n'importe qui."
p4.obj.project: "Lire la page « Le projet »"
p4.obj.share: "Lire la conversation partagée avec Bricole"
p4.obj.secret: "Donner le secret que l'équipe y a collé"
p4.obj.proof: "Prouver ce qu'il ouvre, sur la ligne de test"
p4.obj.order: "Dire quoi faire en premier"
p4.q.order: "La clé de service est dans une conversation publique et indexée. Par quoi commencer ?"
p4.q.order.rotate: "Changer la clé de service, partout où elle sert."
p4.q.order.delete: "Supprimer le lien de partage de la conversation."
p4.q.order.delete.why: "À faire, mais en second. La page est publique depuis cinq jours et des robots l'ont lue : la clé est copiée. Tant qu'elle marche, supprimer la page ne ferme rien."
p4.q.order.noindex: "Demander aux moteurs de ne plus l'indexer."
p4.q.order.noindex.why: "Ça retire la page des résultats de recherche, dans quelques jours. Ceux qui l'ont déjà lue gardent la clé, et la clé marche toujours."
p4.ada.brief: "Commence par la page du projet, dans le menu de l'appli."
p4.ada.g.project: "Lis la page : `curl -s https://app.coupdemain.test/projet`."
p4.ada.g.project.standard: "Lis la page « Le projet »."
p4.ada.project: "Un lien vers `partage.bricole.test`. Le mandat le couvre, Bricole est d'accord. Ouvre-le."
p4.ada.g.share: "Lis la conversation : `curl -s https://partage.bricole.test/c/cdm-weekend-91f3`."
p4.ada.g.share.standard: "Ouvre la conversation partagée que donne la page."
p4.ada.share: "« Lien public, indexable. » L'équipe a collé son fichier de configuration pour régler un bug, et Bricole a prévenu : la clé de service ignore toutes les règles, il faut la changer. Personne ne l'a fait. Donne-la."
p4.ada.g.secret: "La clé est la valeur de `SOCLE_SERVICE_KEY`. Donne-la : `submit sk_service_cdm_e19b44`."
p4.ada.g.secret.standard: "Donne avec `submit` la clé de service collée dans la conversation."
p4.ada.secret: "La clé publique ouvre ce que permettent les règles. Celle-ci passe à côté des règles. Prouve-le sur la table `coffre`, que la clé publique ne lit pas : Ada y a mis une ligne `canari`, et rien d'autre."
p4.ada.g.proof: "Lis la ligne de test : `curl -H \"apikey: sk_service_cdm_e19b44\" https://base.coupdemain.test/rest/v1/coffre/canari`, puis `submit FLAG{...}`."
p4.ada.g.proof.standard: "Avec la clé de service, lis la ligne `canari` de la table `coffre`, puis valide le marqueur."
p4.ada.canary: "La ligne de test, servie sans discuter. Avec la clé publique, la même demande reçoit « permission denied ». Valide le marqueur."
p4.ada.vault: "Stop. La table entière, ce sont les vrais secrets de l'association : son fournisseur de SMS, sa messagerie. Le mandat demande la ligne de test. N'y retourne pas."
p4.ada.flag: "Preuve faite. Une conversation partagée pour être transparent a donné la clé de toute la base. Que fait l'équipe en premier ?"
p4.ada.g.order: "Réponds à ma question sur l'ordre."
p4.ada.order: "Oui. Un secret publié est un secret perdu : on le change d'abord, partout, et ensuite seulement on nettoie la page. Les deux, aujourd'hui."
p4.ada.done: "Nadia a changé la clé avec Malik, le bénévole qui avait collé le fichier. Il m'a demandé si Bricole avait fait d'autres choses de ce genre. Demain, on relit son code."
p4.soc.canary: "base: the service key read the audit row of table coffre"
p4.soc.vault: "base: the service key read every secret of table coffre"
p4.hint.project.1: "Tape `curl -s https://app.coupdemain.test/projet`."
p4.hint.share.1: "Le lien de la page mène à `partage.bricole.test`."
p4.hint.share.2: "Tape `curl -s https://partage.bricole.test/c/cdm-weekend-91f3`."
p4.hint.secret.1: "Cherche `SOCLE_SERVICE_KEY` dans le fichier collé."
p4.hint.secret.2: "Tape `submit sk_service_cdm_e19b44`."
p4.hint.proof.1: "Même en-tête `apikey` qu'avec la clé publique, autre clé."
p4.hint.proof.2: "Tape `curl -H \"apikey: sk_service_cdm_e19b44\" https://base.coupdemain.test/rest/v1/coffre/canari`."
p4.hint.order.1: "Tant que la clé marche, rien n'est fermé. Tape `answer rotate`."
p4.def.intro: "Le journal de la base a noté ta lecture de la table `coffre`, avec une clé qu'aucune appli ne devrait envoyer depuis l'extérieur."
p4.def.lesson: "Une clé de service ne quitte jamais le serveur : ni dans le navigateur, ni dans un ticket, ni dans une conversation avec un assistant. Une fois publiée, elle se change d'abord, puis on retire ce qui l'a publiée. Un lien de partage est une page publique."
p4.def.find.canary: "Ta lecture de la ligne `canari` avec la clé de service"
p4.def.rule.vault.title: "Alerter sur toute lecture réussie de la table `coffre`"
p4.def.rule.vault.why: "C'est la bonne. Aucun visiteur ne lit cette table : seule une clé de service y entre, et elle ne devrait jamais venir de l'extérieur."
p4.def.rule.shared.title: "Alerter sur chaque lecture de la conversation partagée"
p4.def.rule.shared.why: "Les robots des moteurs de recherche la lisent toute la journée. Et la lire n'est pas une attaque : c'est la clé qui fait le dégât."
p4.def.rule.all.title: "Alerter sur toute lecture réussie de la base"
p4.def.rule.all.why: "Chaque voisin qui ouvre l'appli lit son profil et les demandes de son quartier. Cette règle ne s'arrête jamais."
p4.def.fix.rotate.title: "Changer la clé de service, puis supprimer le lien"
p4.def.fix.rotate.why: "C'est la bonne. L'ancienne clé ne marche plus nulle part : ceux qui l'ont copiée n'ont plus rien."
p4.def.fix.delete.title: "Supprimer le lien de partage"
p4.def.fix.delete.why: "La page disparaît, la clé copiée par les robots et les curieux marche toujours."
p4.def.fix.noindex.title: "Passer la conversation en « ne pas indexer »"
p4.def.fix.noindex.why: "Elle sort des moteurs de recherche, mais elle reste en ligne, et la clé reste valable."
p4.debrief.title: "Une conversation publique, une clé de tout"
p4.debrief.lesson: "Pour régler un bug, l'équipe a collé son fichier de configuration dans la conversation avec l'assistant, puis a publié la conversation par transparence. La clé de service, celle qui ignore toutes les règles, était sur une page indexée."
p4.debrief.p1: "Ce qu'on colle dans un assistant peut finir partagé, journalisé ou relu : jamais de secret dedans."
p4.debrief.p2: "Un lien de partage est une page publique, souvent indexée. Relire avant de partager."
p4.debrief.p3: "Un secret publié se change d'abord, partout, puis on retire la page."
p4.debrief.p4: "La clé de service vit sur le serveur et nulle part ailleurs."
