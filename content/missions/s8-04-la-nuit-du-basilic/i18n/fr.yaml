v4.briefing: "Nuit de jeudi à vendredi, 2 h 10. Ton téléphone sonne : c'est Nour. La serre 2 vient de lui envoyer une alarme de température, et l'automate jure qu'il n'a rien demandé. Les corrections de ton rapport sont prévues lundi. Le basilic, lui, supporte mal plus de 35 degrés, et il part mardi pour les cantines. Elle t'ouvre la console du SOC."
v4.file.rule: "# Règle de détection, à essayer avec : rule test regles/ordres.yml\n# Une ligne par condition. Champs du journal mqtt : client, src, action, topic.\n# Modificateurs : |contains, |startswith, |endswith.\ntitle: Ordre donné à une serre\nsource: mqtt\naction: publish\ntopic|endswith: /set\n"
v4.obj.rotate: "Rendre inutile la clé d'usine volée"
v4.obj.stop: "Voir les ordres de l'intrus s'arrêter"
v4.obj.restore: "Remettre les consignes de la serre 2"
v4.obj.client: "Nommer le client usurpé (`answer client`)"
v4.obj.detect: "Écrire la règle qui sonne sur ces ordres"
v4.obj.ip: "Nommer l'adresse de l'intrus (`answer ip`)"
v4.q.client: "Sous quel nom de client l'intrus donne-t-il ses ordres ?"
v4.q.ip: "De quelle adresse viennent ces ordres ?"
v4.contain.rotate: "Une clé par capteur installée, la clé d'usine refusée par le courtier"
v4.contain.block: "Adresse 10.22.0.180 bloquée à l'entrée du courtier"
v4.contain.broker: "Courtier arrêté : plus aucun message dans la ferme"
v4.contain.restore: "Consignes de la serre 2 remises à leurs valeurs de culture"
v4.alert.order: "Un capteur donne un ordre"
v4.alert.order.why: "Les capteurs publient des mesures. Les sujets `set` ne reçoivent d'ordres que de l'automate."
v4.alert.wide: "Abonnement à tous les sujets"
v4.alert.wide.why: "Aucun appareil de la ferme n'a besoin de tout entendre."
v4.ada.brief: "Je suis là. On regarde avant de couper : `soc sources` te dit quels journaux tu as, `soc alerts` ce qui a sonné, `contain` ce que tu peux couper. Chaque mesure a un prix pour la ferme, et le basilic n'attend pas."
v4.ada.g.start: "Commence par voir quels journaux tu as : `soc sources`."
v4.ada.g.start.standard: "Regarde quels journaux tu as, puis les alertes du SOC."
v4.ada.g.alerts: "Une alerte vient de tomber. Lis-la : `soc alerts`."
v4.ada.g.alerts.standard: "Une alerte vient de tomber dans le SOC."
v4.ada.g.logs: "Tout se passe sur le courtier. Lis son journal : `soc logs broker mqtt`."
v4.ada.g.logs.standard: "Tout se passe sur le courtier. Lis son journal."
v4.ada.g.cut: "Il se sert de la clé d'usine, celle de ton rapport de mercredi. Rends-la inutile : `contain rotate cle-usine`."
v4.ada.g.cut.standard: "Il se sert de la clé d'usine. `contain` liste les mesures possibles : choisis celle qui la rend inutile."
v4.ada.g.again: "Ça ne règle pas le fond : la clé d'usine marche toujours. Remplace-la : `contain rotate cle-usine`."
v4.ada.g.again.standard: "La clé d'usine marche toujours. Il reste une mesure à prendre."
v4.ada.g.watch: "Son prochain ordre doit être refusé. Tu pourras le vérifier avec `soc logs broker flow`."
v4.ada.g.watch.standard: "Vérifie dans les journaux du courtier que son prochain ordre est refusé."
v4.ada.g.restore: "Il est dehors, mais ses consignes sont encore en place. Remets celles de la serre 2 : `contain restore consignes`."
v4.ada.g.restore.standard: "Il est dehors, mais la serre 2 chauffe toujours. Remets ses consignes."
v4.ada.g.client: "Note le nom qu'il a pris, pour le compte rendu : `answer client capteur-17`."
v4.ada.g.client.standard: "Donne le nom de client qu'il a utilisé avec `answer client`."
v4.ada.g.detect: "Nour a commencé une règle. Lis-la, `cat regles/ordres.yml`, puis essaie-la contre le journal : `rule test regles/ordres.yml`."
v4.ada.g.detect.standard: "Une règle de détection t'attend dans `regles/`. `rule test <fichier>` l'essaie contre le journal."
v4.ada.g.false: "Elle attrape les ordres de l'intrus, et aussi ceux de l'automate, qui en donne toute la nuit. Ce qui les distingue, c'est qui parle : un capteur ne donne jamais d'ordre. Ajoute une condition : `echo \"client|startswith: capteur\" >> regles/ordres.yml`."
v4.ada.g.false.standard: "Elle sonne aussi sur les ordres de l'automate. Qu'est-ce que ceux de l'intrus ont de différent ?"
v4.ada.g.missed: "Elle ne sonne plus à tort, mais elle rate des ordres de l'intrus. Relis ses lignes avec `soc logs broker mqtt` et reprends les mêmes champs."
v4.ada.g.missed.standard: "Elle rate des ordres de l'intrus. Relis ses lignes dans le journal du courtier."
v4.ada.log: "Regarde les lignes de `capteur-17`. Le vrai capteur 17 publie ses mesures depuis `10.22.0.117`, comme toujours. Et un second `capteur-17`, depuis `10.22.0.180`, vient de s'abonner à tout. Il fait l'inventaire, comme toi lundi, et les ordres vont suivre. Même nom, même mot de passe : celui que tu as trouvé mercredi dans un fichier oublié. Quelqu'un d'autre l'a trouvé aussi."
v4.ada.lamps: "Il vient d'éteindre les lampes de la serre 2. Pour l'instant il joue avec les interrupteurs."
v4.ada.heat1: "Il a monté la consigne de température de la serre 2. Le chauffage démarre."
v4.ada.heat2: "Brume coupée, consigne encore relevée : la serre 2 passe 30 degrés. Coupe maintenant."
v4.ada.heat3: "33 degrés dans la serre 2. Encore un ordre comme celui-là et le basilic est perdu."
v4.ada.fail: "La serre 2 a passé 38 degrés pendant une heure. Le basilic est cuit, et les cantines mangeront autre chose mardi. On reprend : il se sert de la clé d'usine, c'est elle qu'il faut rendre inutile, et vite."
v4.ada.block: "Ça l'arrête, pour l'instant. Il lui suffit de changer de prise ou d'adresse, et la clé d'usine marchera de nouveau."
v4.ada.broker: "Ça l'arrête, et ça arrête la ferme entière : plus de mesures, plus d'arrosage, plus de lampes. Tu as sauvé le basilic de la chaleur pour le laisser sans eau. Et la clé d'usine marche toujours."
v4.ada.rotate: "C'est le bon fil. Chaque capteur vient de recevoir sa propre clé, et le courtier refuse l'ancienne. Les mesures ont manqué deux minutes, le temps que les quarante se reconnectent. Ce que l'intrus a dans la poche ne vaut plus rien."
v4.ada.stopped: "Il est coupé : son ordre suivant a été refusé, et il a lâché. Mais regarde la serre 2 : ses consignes sont toujours celles qu'il a laissées."
v4.ada.restore.early: "Les consignes sont revenues, et il les changera de nouveau dans une minute : il est toujours là. D'abord le sortir."
v4.ada.restore.again: "Tu avais remis les consignes trop tôt, et il les avait retouchées. Nour les rétablit une seconde fois : maintenant qu'il est dehors, elles tiennent."
v4.ada.restore: "Consigne à 22, brume en marche, lampes sur leur horaire. La serre 2 redescend. Sortir l'intrus ne suffisait pas : il fallait aussi défaire ce qu'il avait fait."
v4.ada.detect: "Elle ne sonne que sur lui. Un capteur qui donne un ordre, ça n'existe pas dans la vie normale de la ferme : la règle tient en quelques lignes parce que les rôles sont clairs."
v4.ada.done: "Le basilic a eu chaud vingt minutes, il s'en remettra. Nour avance les corrections à ce matin. Ouvre le débrief."
v4.ada.end: "Fin de l'audit de Verdure. Un courtier qui écoutait tout le monde, des ordres acceptés de n'importe qui, une clé d'usine dans quarante capteurs, et une nuit où quelqu'un s'en est servi. Rien de tout cela n'était nouveau, et c'est la leçon : dans les objets connectés, les failles ont l'âge des objets. Nour t'envoie une cagette. Il y a du basilic."
v4.hint.rotate.1: "`soc alerts` montre ce qui a sonné, `soc logs broker mqtt` montre qui s'abonne et qui publie."
v4.hint.rotate.2: "Bloquer une adresse ne retire pas la clé qu'il a volée. `contain` liste les mesures : l'une d'elles remplace la clé d'usine."
v4.hint.rotate.3: "Tape `contain rotate cle-usine`."
v4.hint.stop.1: "Une fois la clé remplacée, tape `soc logs broker flow` : sa tentative suivante y apparaît en `deny`."
v4.hint.restore.1: "Tape `contain restore consignes`."
v4.hint.client.1: "Le nom du client est dans chaque ligne du journal, juste avant l'arobase : `soc logs broker mqtt`."
v4.hint.client.2: "Tape `answer client capteur-17`."
v4.hint.detect.1: "`rule test regles/ordres.yml` montre les lignes que la règle attrape : « ! » pour l'intrus, « ? » pour l'activité ordinaire."
v4.hint.detect.2: "Les ordres légitimes viennent du client `automate`. Ceux de l'intrus viennent d'un client dont le nom commence par `capteur`."
v4.hint.detect.3: "`echo \"client|startswith: capteur\" >> regles/ordres.yml`, puis `rule test regles/ordres.yml`."
v4.debrief.title: "Un capteur ne donne pas d'ordres"
v4.debrief.lesson: "Quelqu'un a pris le nom d'un capteur, avec la clé d'usine commune à tous, et a donné des ordres à une serre. Bloquer son adresse le gênait une minute. Il fallait retirer sa valeur à la clé, puis défaire ce qu'il avait changé."
v4.debrief.p1: "Une clé volée se remplace. Tant qu'elle marche, bloquer une adresse ne fait que déplacer l'intrus."
v4.debrief.p2: "Arrêter tout le système arrête aussi ce qu'il protège. Dans une ferme, une usine ou un hôpital, on coupe au plus près."
v4.debrief.p3: "Après avoir sorti l'intrus, on remet les réglages qu'il a touchés. Un incident n'est pas fini tant que l'installation n'est pas revenue à son état normal."
v4.debrief.p4: "Des rôles clairs rendent la détection simple : si seuls les automates donnent des ordres, un ordre venu d'un capteur est une alerte en soi."
