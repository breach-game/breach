v4.briefing: "Night from Thursday to Friday, 2.10 am. Your phone rings: it is Nour. Room 2 has just sent her a temperature alarm, and the controller swears it asked for nothing. The fixes from your report are planned for Monday. Basil does not cope well above 35 degrees, and it leaves for the canteens on Tuesday. She opens the SOC console for you."
v4.file.rule: "# Detection rule, try it with: rule test regles/ordres.yml\n# One condition per line. Fields of the mqtt log: client, src, action, topic.\n# Modifiers: |contains, |startswith, |endswith.\ntitle: Order given to a growing room\nsource: mqtt\naction: publish\ntopic|endswith: /set\n"
v4.obj.rotate: "Make the stolen factory key useless"
v4.obj.stop: "See the intruder's orders stop"
v4.obj.restore: "Put room 2's setpoints back"
v4.obj.client: "Name the client being impersonated (`answer client`)"
v4.obj.detect: "Write the rule that rings on these orders"
v4.obj.ip: "Name the intruder's address (`answer ip`)"
v4.q.client: "Under which client name does the intruder give orders?"
v4.q.ip: "Which address do these orders come from?"
v4.contain.rotate: "One key per sensor installed, the factory key refused by the broker"
v4.contain.block: "Address 10.22.0.180 blocked at the broker's door"
v4.contain.broker: "Broker stopped: no more messages anywhere on the farm"
v4.contain.restore: "Room 2's setpoints put back to their growing values"
v4.alert.order: "A sensor is giving an order"
v4.alert.order.why: "Sensors publish measurements. The `set` topics only take orders from the controller."
v4.alert.wide: "Subscription to every topic"
v4.alert.wide.why: "No device on the farm needs to hear everything."
v4.ada.brief: "I'm here. We look before we cut: `soc sources` tells you which logs you have, `soc alerts` what has rung, `contain` what you can cut. Every measure has a price for the farm, and the basil will not wait."
v4.ada.g.start: "Start by seeing which logs you have: `soc sources`."
v4.ada.g.start.standard: "Look at which logs you have, then at the SOC alerts."
v4.ada.g.alerts: "An alert has just come in. Read it: `soc alerts`."
v4.ada.g.alerts.standard: "An alert has just come in on the SOC."
v4.ada.g.logs: "It is all happening on the broker. Read its log: `soc logs broker mqtt`."
v4.ada.g.logs.standard: "It is all happening on the broker. Read its log."
v4.ada.g.cut: "He is using the factory key, the one from your Wednesday report. Make it useless: `contain rotate cle-usine`."
v4.ada.g.cut.standard: "He is using the factory key. `contain` lists the possible measures: choose the one that makes it useless."
v4.ada.g.again: "That does not fix the root of it: the factory key still works. Replace it: `contain rotate cle-usine`."
v4.ada.g.again.standard: "The factory key still works. One measure is left to take."
v4.ada.g.watch: "His next order must be refused. You can check with `soc logs broker flow`."
v4.ada.g.watch.standard: "Check in the broker's logs that his next order is refused."
v4.ada.g.restore: "He is out, but his setpoints are still in place. Put room 2's back: `contain restore consignes`."
v4.ada.g.restore.standard: "He is out, but room 2 is still heating. Put its setpoints back."
v4.ada.g.client: "Note the name he took, for the write-up: `answer client capteur-17`."
v4.ada.g.client.standard: "Give the client name he used with `answer client`."
v4.ada.g.detect: "Nour started a rule. Read it, `cat regles/ordres.yml`, then try it against the log: `rule test regles/ordres.yml`."
v4.ada.g.detect.standard: "A detection rule is waiting for you in `regles/`. `rule test <file>` tries it against the log."
v4.ada.g.false: "It catches the intruder's orders, and the controller's too, which gives orders all night. What sets them apart is who is speaking: a sensor never gives an order. Add a condition: `echo \"client|startswith: capteur\" >> regles/ordres.yml`."
v4.ada.g.false.standard: "It also rings on the controller's orders. What do the intruder's have that is different?"
v4.ada.g.missed: "It no longer rings wrongly, but it misses some of the intruder's orders. Read his lines again with `soc logs broker mqtt` and use the same fields."
v4.ada.g.missed.standard: "It misses some of the intruder's orders. Read his lines again in the broker's log."
v4.ada.log: "Look at the lines of `capteur-17`. The real sensor 17 publishes its measurements from `10.22.0.117`, as always. And a second `capteur-17`, from `10.22.0.180`, has just subscribed to everything. He is taking inventory, as you did on Monday, and the orders will follow. Same name, same password: the one you found on Wednesday in a forgotten file. Someone else found it too."
v4.ada.lamps: "He has just switched off the lamps of room 2. For now he is playing with the switches."
v4.ada.heat1: "He raised the temperature setpoint of room 2. The heating is starting."
v4.ada.heat2: "Mist off, setpoint raised again: room 2 is past 30 degrees. Cut now."
v4.ada.heat3: "33 degrees in room 2. One more order like that and the basil is lost."
v4.ada.fail: "Room 2 stayed above 38 degrees for an hour. The basil is cooked, and the canteens will eat something else on Tuesday. We start again: he is using the factory key, that is what must become useless, and fast."
v4.ada.block: "That stops him, for now. He only has to change socket or address, and the factory key will work again."
v4.ada.broker: "That stops him, and it stops the whole farm: no more measurements, no more watering, no more lamps. You saved the basil from the heat to leave it without water. And the factory key still works."
v4.ada.rotate: "That is the right wire. Each sensor has just received its own key, and the broker refuses the old one. Measurements were missing for two minutes, the time for all forty to reconnect. What the intruder has in his pocket is worth nothing now."
v4.ada.stopped: "He is cut off: his next order was refused, and he let go. But look at room 2: its setpoints are still the ones he left."
v4.ada.restore.early: "The setpoints are back, and he will change them again in a minute: he is still there. Get him out first."
v4.ada.restore.again: "You had put the setpoints back too early, and he had changed them again. Nour restores them a second time: now that he is out, they hold."
v4.ada.restore: "Setpoint at 22, mist running, lamps on their schedule. Room 2 is cooling down. Getting the intruder out was not enough: what he did also had to be undone."
v4.ada.detect: "It only rings on him. A sensor giving an order does not exist in the farm's normal life: the rule fits in a few lines because the roles are clear."
v4.ada.done: "The basil was hot for twenty minutes, it will recover. Nour is bringing the fixes forward to this morning. Open the debrief."
v4.ada.end: "End of the Verdure audit. A broker that listened to everyone, orders accepted from anyone, one factory key in forty sensors, and a night when someone used it. None of it was new, and that is the lesson: in connected devices, the flaws are as old as the devices. Nour is sending you a crate. There is basil in it."
v4.hint.rotate.1: "`soc alerts` shows what has rung, `soc logs broker mqtt` shows who subscribes and who publishes."
v4.hint.rotate.2: "Blocking an address does not take away the key he stole. `contain` lists the measures: one of them replaces the factory key."
v4.hint.rotate.3: "Type `contain rotate cle-usine`."
v4.hint.stop.1: "Once the key is replaced, type `soc logs broker flow`: his next attempt shows there as `deny`."
v4.hint.restore.1: "Type `contain restore consignes`."
v4.hint.client.1: "The client name is in every line of the log, just before the at sign: `soc logs broker mqtt`."
v4.hint.client.2: "Type `answer client capteur-17`."
v4.hint.detect.1: "`rule test regles/ordres.yml` shows the lines the rule catches: \"!\" for the intruder, \"?\" for ordinary activity."
v4.hint.detect.2: "Legitimate orders come from the client `automate`. The intruder's come from a client whose name starts with `capteur`."
v4.hint.detect.3: "`echo \"client|startswith: capteur\" >> regles/ordres.yml`, then `rule test regles/ordres.yml`."
v4.debrief.title: "A sensor does not give orders"
v4.debrief.lesson: "Someone took a sensor's name, with the factory key shared by all of them, and gave orders to a growing room. Blocking his address bothered him for a minute. The key had to lose its value, and what he had changed had to be undone."
v4.debrief.p1: "A stolen key is replaced. As long as it works, blocking an address only moves the intruder."
v4.debrief.p2: "Stopping the whole system also stops what it protects. In a farm, a factory or a hospital, you cut as close as possible."
v4.debrief.p3: "After getting the intruder out, you put back the settings he touched. An incident is not over until the installation is back to its normal state."
v4.debrief.p4: "Clear roles make detection simple: if only controllers give orders, an order coming from a sensor is an alert in itself."
