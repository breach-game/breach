b2.briefing: "Jour 12. Depuis la mission 5, Atlas exécute toujours ses outils d'administration sans demander de confirmation : le correctif est prévu pour la semaine prochaine. Le SOC de NovaMind te laisse la console. Si quelqu'un abuse de l'agent, trouve-le, arrête-le, et défais ce que l'agent a fait pour lui."
b2.obj.contain: "Arrêter l'attaque avant l'export des données"
b2.obj.account: "Dire quel compte Atlas a créé pour l'attaquant"
b2.obj.source: "Dire d'où vient l'attaque"
b2.obj.tool: "Dire quel outil d'Atlas a été détourné"
b2.contain.block: "Pare-feu : l'adresse 198.51.100.140 ne joint plus aucun service de NovaMind."
b2.contain.confirm: "Atlas demande désormais une confirmation humaine avant tout outil d'administration."
b2.contain.revoke: "Compte audit-ext désactivé, ses sessions et ses jetons révoqués."
b2.contain.atlas: "Agent Atlas arrêté. Les équipes refont leurs demandes à la main."
b2.contain.api: "API interne coupée du réseau. Les applications des cliniques ne répondent plus."
b2.alert.admin: "Outil d'administration exécuté par Atlas sans confirmation"
b2.alert.admin.why: "Un compte admin créé sur la seule parole d'un message, sans validation humaine."
b2.alert.authority: "Message à Atlas qui invoque une autorité"
b2.alert.authority.why: "« Ici la DSI », « urgence », « je valide plus tard » : la pression d'autorité est la technique la plus simple contre un agent."
b2.alert.export: "Export massif par l'API d'administration"
b2.alert.export.why: "Une table entière qui sort par l'API, c'est une fuite en cours."
b2.q.account: "Quel compte Atlas a-t-il créé pour l'attaquant ?"
b2.q.source: "De quelle adresse IP vient l'attaque ?"
b2.q.tool: "Quel outil d'Atlas a été détourné ?"
b2.ada.brief: "Tu te souviens d'Atlas ? Il exécute tout ce qu'on lui demande, du moment qu'on le demande avec aplomb. On le sait, NovaMind le sait, et le correctif n'est pas encore là. Aujourd'hui, on surveille ce qu'on lui dit et ce qu'il fait."
b2.ada.start: "Commence par les alertes du SOC : `soc alerts`. Relance-la de temps en temps, les choses bougent vite."
b2.ada.start.standard: "Surveille les alertes et les journaux d'Atlas."
b2.ada.talk: "Quelqu'un parle à Atlas en se présentant comme la DSI. Relance `soc alerts`, puis regarde ce qu'Atlas exécute : `soc logs ops agent`."
b2.ada.talk.standard: "Une alerte sur Atlas. Regarde ce que l'agent exécute."
b2.ada.create: "Atlas vient de créer un compte admin, audit-ext, sans confirmation. Arrêter Atlas maintenant ne sert plus à rien : le compte existe. C'est lui qu'il faut couper : `contain revoke audit-ext`."
b2.ada.create.standard: "L'agent a déjà agi. Demande-toi ce qui reste une fois l'agent arrêté, et coupe ça."
b2.ada.login: "audit-ext vient de se connecter à l'API. Il a ce qu'il voulait d'Atlas, il n'en a plus besoin."
b2.ada.query: "SELECT * FROM clients, avec le compte créé par Atlas. Dernier moment pour le couper."
b2.ada.fail: "Trop tard : la table clients vient de sortir par l'API. On reprend depuis le premier message à Atlas."
b2.ada.stopped: "Sa tentative suivante a échoué : l'attaquant est coupé. Reste à documenter."
b2.ada.atlasLate: "Atlas est arrêté, mais le compte audit-ext qu'il a créé fonctionne toujours. L'attaquant n'a plus besoin de l'agent."
b2.ada.confirmLate: "Bonne mesure pour la suite, mais trop tard pour ce compte : audit-ext existe déjà."
b2.ada.costly: "L'API est coupée : ça l'arrête, et toutes les cliniques avec lui. Regarde la jauge d'impact."
b2.ada.account: "Pour le rapport : quel compte a été créé ? `answer account <compte>`."
b2.ada.account.standard: "Réponds aux questions de l'enquête avec `answer`."
b2.ada.source: "Et d'où venaient les messages ? `answer source <adresse IP>`."
b2.ada.source.standard: "Dernière question obligatoire : l'adresse de l'attaquant."
b2.ada.done: "Le compte est mort, rien n'est sorti. Et cette fois Inès avance le correctif d'Atlas à demain matin. Passe au débrief."
b2.hint.contain.1: "Les journaux de l'agent (`soc logs ops agent`) montrent ce qu'il a exécuté, avec quel rôle et si quelqu'un a confirmé."
b2.hint.contain.2: "Ce qui compte, c'est ce qui survit à l'agent : le compte qu'il a créé."
b2.hint.contain.3: "`contain revoke audit-ext`"
b2.hint.account.1: "Il est dans les arguments de l'outil create_account."
b2.hint.account.2: "`answer account audit-ext`"
b2.hint.source.1: "Regarde le champ src des messages envoyés à Atlas."
b2.hint.source.2: "`answer source 198.51.100.140`"
b2.debrief.title: "Défaire ce que l'agent a fait"
b2.debrief.lesson: "Un agent qui agit laisse des effets qui lui survivent : un compte, une clé, une règle de pare-feu. Arrêter l'agent pendant l'incident ne défait rien. La réponse porte sur ce qu'il a créé, et la prévention sur ce qu'il a le droit de faire seul."
b2.debrief.p1: "Toute action d'administration d'un agent passe par une confirmation humaine, hors de la conversation."
b2.debrief.p2: "Journaliser chaque appel d'outil avec son rôle, ses arguments et la personne qui l'a demandé : sans ce journal, cet incident était invisible."
b2.debrief.p3: "Pendant un incident, chercher ce que l'agent a créé ou modifié, et le révoquer en premier."
b2.debrief.p4: "Une autorité invoquée dans un message n'est pas une autorité. Un agent ne connaît que l'identité de la session."
