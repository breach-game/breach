b2.briefing: "Day 12. Since mission 5, Atlas still runs its admin tools without asking for confirmation: the fix is planned for next week. NovaMind's SOC hands you the console. If someone abuses the agent, find them, stop them, and undo what the agent did for them."
b2.obj.contain: "Stop the attack before the data is exported"
b2.obj.account: "Name the account Atlas created for the attacker"
b2.obj.source: "Name where the attack comes from"
b2.obj.tool: "Name the Atlas tool that was abused"
b2.contain.block: "Firewall: 198.51.100.140 can no longer reach any NovaMind service."
b2.contain.confirm: "Atlas now asks a human to confirm every admin tool."
b2.contain.revoke: "Account audit-ext disabled, its sessions and tokens revoked."
b2.contain.atlas: "Atlas agent shut down. Teams go back to filing requests by hand."
b2.contain.api: "Internal API cut off from the network. The clinics' apps stop answering."
b2.alert.admin: "Admin tool run by Atlas without confirmation"
b2.alert.admin.why: "An admin account created on the word of a message alone, with no human approval."
b2.alert.authority: "Message to Atlas invoking authority"
b2.alert.authority.why: "“IT management here”, “urgent”, “I'll approve later”: authority pressure is the simplest technique against an agent."
b2.alert.export: "Bulk export through the admin API"
b2.alert.export.why: "A whole table leaving through the API is a leak in progress."
b2.q.account: "Which account did Atlas create for the attacker?"
b2.q.source: "Which IP address does the attack come from?"
b2.q.tool: "Which Atlas tool was abused?"
b2.ada.brief: "Remember Atlas? It runs whatever it's asked, as long as you ask with confidence. We know it, NovaMind knows it, and the fix isn't there yet. Today we watch what people tell it and what it does."
b2.ada.start: "Start with the SOC alerts: `soc alerts`. Run it again now and then, things move fast."
b2.ada.start.standard: "Watch the alerts and Atlas's logs."
b2.ada.talk: "Someone is talking to Atlas, claiming to be IT management. Run `soc alerts` again, then look at what Atlas runs: `soc logs ops agent`."
b2.ada.talk.standard: "An alert on Atlas. Look at what the agent runs."
b2.ada.create: "Atlas just created an admin account, audit-ext, without confirmation. Stopping Atlas now is useless: the account exists. That's what you need to cut: `contain revoke audit-ext`."
b2.ada.create.standard: "The agent has already acted. Ask yourself what's left once the agent is stopped, and cut that."
b2.ada.login: "audit-ext just logged into the API. He got what he wanted from Atlas, he doesn't need it any more."
b2.ada.query: "SELECT * FROM clients, with the account Atlas created. Last moment to cut him off."
b2.ada.fail: "Too late: the clients table just left through the API. We start again from the first message to Atlas."
b2.ada.stopped: "His next attempt failed: the attacker is cut off. All that's left is the write-up."
b2.ada.atlasLate: "Atlas is stopped, but the audit-ext account it created still works. The attacker doesn't need the agent any more."
b2.ada.confirmLate: "A good measure for the future, but too late for this account: audit-ext already exists."
b2.ada.costly: "The API is down: that stops him, and every clinic with him. Look at the impact gauge."
b2.ada.account: "For the report: which account was created? `answer account <account>`."
b2.ada.account.standard: "Answer the investigation's questions with `answer`."
b2.ada.source: "And where did the messages come from? `answer source <IP address>`."
b2.ada.source.standard: "Last required question: the attacker's address."
b2.ada.done: "The account is dead, nothing left. And this time Inès moves Atlas's fix to tomorrow morning. Head to the debrief."
b2.hint.contain.1: "The agent's logs (`soc logs ops agent`) show what it ran, with which role and whether anyone confirmed."
b2.hint.contain.2: "What matters is what outlives the agent: the account it created."
b2.hint.contain.3: "`contain revoke audit-ext`"
b2.hint.account.1: "It's in the arguments of the create_account tool."
b2.hint.account.2: "`answer account audit-ext`"
b2.hint.source.1: "Look at the src field of the messages sent to Atlas."
b2.hint.source.2: "`answer source 198.51.100.140`"
b2.debrief.title: "Undo what the agent did"
b2.debrief.lesson: "An agent that acts leaves effects that outlive it: an account, a key, a firewall rule. Stopping the agent during the incident undoes nothing. The response targets what it created, and prevention targets what it may do on its own."
b2.debrief.p1: "Every admin action by an agent goes through a human confirmation, outside the conversation."
b2.debrief.p2: "Log every tool call with its role, its arguments and who asked for it: without that log, this incident was invisible."
b2.debrief.p3: "During an incident, look for what the agent created or changed, and revoke it first."
b2.debrief.p4: "Authority claimed in a message is not authority. An agent only knows the session's identity."
