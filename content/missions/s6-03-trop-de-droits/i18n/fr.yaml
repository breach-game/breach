a3.hint.role.3: "Tape `submit support-bot`."
a3.hint.fix.1: "Tape `edit dossier/ci-deployer.yml`. Les valeurs possibles sont en commentaire au-dessus de chaque ligne."
a3.hint.fix.2: "Le pipeline publie le site : il écrit, dans un seul seau. Et son jeton doit vivre le temps d'un déploiement."
