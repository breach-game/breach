a3.debrief.title: "« Pour l'instant »"
a3.debrief.lesson: "Le rôle du pipeline était juste, puis un déploiement a échoué un soir, et quelqu'un a remplacé la liste par une étoile en se promettant d'y revenir. Deux ans plus tard, cette étoile a transformé une fuite de jeton en accès à tous les secrets. Un droit trop large ne fait aucun bruit tant que tout va bien."
a3.debrief.p1: "Moindre privilège : chaque rôle ne permet que les actions de son travail, sur les ressources de son travail. Une étoile est une question qu'on n'a pas voulu se poser."
a3.debrief.p2: "Les droits élargis en urgence ont une date de fin, écrite le jour même, et quelqu'un qui en répond."
a3.debrief.p3: "Les identités de robots ont des jetons courts, émis à la demande. Un jeton qui n'expire jamais est un mot de passe qu'on a oublié de changer."
a3.debrief.p4: "Relire les rôles se fait avec un accès en lecture seule, comme le tien cette semaine. Un audit n'a pas besoin de pouvoir modifier ce qu'il regarde."
