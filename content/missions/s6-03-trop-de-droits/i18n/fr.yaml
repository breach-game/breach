a3.briefing: "Mercredi. Le jeton d'hier est révoqué. Il reste la question que tu t'es posée en lisant le seau des secrets : pourquoi le robot qui publie des images avait-il le droit de les lire ? La réponse n'est pas dans le jeton, elle est dans le rôle qu'il porte. Aujourd'hui tu ne forces rien : Alto t'a donné un jeton d'audit, en lecture seule, pour lire les rôles de son compte."
a3.file.role: "# Rôle ci-deployer : correction proposée à Alto.\n# Remplace chaque valeur par la plus juste (une seule valeur par ligne), puis tape : verify\nrole: ci-deployer\nused_by: relay-ci\n# actions: storage:put | storage:get | everything\nactions: everything\n# resources: alto-site | alto-backups | alto-secrets | everything\nresources: everything\n# token_lifetime: 15m | 30d | never\ntoken_lifetime: never\n# token_storage: secret | variable\ntoken_storage: variable\n"
a3.obj.roles: "Lister les rôles du compte avec le jeton d'audit"
a3.obj.policy: "Lire ce que le rôle `ci-deployer` autorise"
a3.obj.role: "Trouver l'autre rôle qui lit plus que son travail, et envoyer son nom"
a3.obj.fix: "Réécrire `ci-deployer` au plus juste dans `dossier/ci-deployer.yml`"
a3.obj.lesson: "Dire ce qui a décidé de l'étendue des dégâts"
a3.check.actions: "Le rôle ne fait qu'écrire des fichiers"
a3.check.resources: "Il n'atteint que le seau du site"
a3.check.lifetime: "Son jeton expire en quelques minutes"
a3.check.storage: "Son jeton est rangé parmi les secrets"
a3.check.kept: "Le rôle garde son nom et reste celui du pipeline"
a3.q.lesson: "Le jeton de mardi a fui, et il a ouvert le seau des secrets. Qu'est-ce qui a décidé de l'étendue des dégâts ?"
a3.q.lesson.shape: "La forme du jeton : trop court, donc trop facile à deviner"
a3.q.lesson.shape.why: "Personne ne l'a deviné : il était écrit en clair dans un journal. Un jeton deux fois plus long aurait fui exactement de la même façon."
a3.q.lesson.role: "Le rôle derrière le jeton : il autorisait tout, sur tout"
a3.q.lesson.log: "Le journal public : sans lui, ce rôle trop large ne posait aucun problème"
a3.q.lesson.log.why: "Un jeton finit toujours par fuir : un journal, un poste perdu, un copier-coller. Ce jour-là, c'est le rôle qui décide de ce que l'inconnu peut faire."
a3.ada.brief: "Ton jeton d'audit est dans le mandat : `cat mandate/AL-2028-003.txt`. Il ne permet que de lire les identités. Le service est sur `https://iam.alto.test/`."
a3.ada.g.token: "Le service d'identités veut un jeton. Le tien est dans le mandat : `cat mandate/AL-2028-003.txt`, puis envoie-le dans un en-tête `Authorization: Bearer`."
a3.ada.g.token.standard: "Sans jeton, le service d'identités ne répond pas. Le tien est dans le mandat."
a3.ada.g.roles: "Liste les rôles du compte : `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles`."
a3.ada.g.roles.standard: "Avec le jeton d'audit du mandat, demande au service d'identités la liste des rôles (`/roles`)."
a3.ada.g.policy: "Lis le rôle du pipeline : `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles/ci-deployer`."
a3.ada.g.policy.standard: "Lis le détail du rôle que portait le jeton d'hier : `/roles/<nom>`."
a3.ada.g.role: "Lis les autres rôles de la même façon, par exemple `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles/support-bot`. Compare ce que chacun fait (`used_by`) à ce qu'il a le droit d'atteindre (`resources`)."
a3.ada.g.role.standard: "Lis les trois autres rôles. Pour chacun, compare son travail à ce qu'il a le droit d'atteindre."
a3.ada.g.submit: "Envoie le nom de ce rôle : `submit support-bot`."
a3.ada.g.submit.standard: "Envoie le nom du rôle avec `submit`."
a3.ada.g.fix: "Écris la correction : `edit dossier/ci-deployer.yml`. Le pipeline écrit des fichiers (`storage:put`) dans le seau du site (`alto-site`), avec un jeton court (`15m`) rangé en `secret`. Enregistre, puis `verify`."
a3.ada.g.fix.standard: "Corrige `dossier/ci-deployer.yml` : le rôle ne doit permettre que le travail du pipeline. Puis `verify`."
a3.ada.roles: "Quatre rôles, une ligne chacun. Un rôle, c'est une liste de phrases : « autoriser telles actions sur telles ressources ». Commence par celui d'hier."
a3.ada.policy: "Une seule phrase : toutes les actions, sur toutes les ressources. Et la note dit comment on en est arrivé là : le rôle était juste, un déploiement a échoué, on a élargi « pour l'instant ». C'était en janvier 2026."
a3.ada.frontend: "Celui-ci est bien fait : lire, et seulement dans le seau du site. C'est à ça que doit ressembler un rôle."
a3.ada.auditor: "Le tien. Lire les identités, rien d'autre, et il expire vendredi. Alto sait faire un rôle juste quand elle y pense."
a3.ada.bot: "Regarde bien `resources` : `alto-*`. L'étoile voulait dire « les seaux d'Alto ». Elle dit aussi `alto-backups` et `alto-secrets`. Le chatbot du support, qui parle à des inconnus toute la journée, a le droit de lire les sauvegardes."
a3.ada.role: "Oui. Et un agent qui parle à des inconnus peut se laisser convaincre. Celui-ci n'aurait même pas à tricher, la lecture des secrets est dans ses droits. Il lui faut `alto-site` et les albums du client, rien de plus. Je le note pour le rapport. Corrige maintenant le rôle du pipeline."
a3.ada.almost: "Pas encore. `verify` te dit ce qui manque : le rôle doit pouvoir publier le site, et rien d'autre."
a3.ada.fix: "Voilà un rôle qui tient en une phrase et qui se lit sans inquiétude : écrire, dans le seau du site, avec un jeton de quinze minutes. Si ce jeton fuit demain, l'inconnu pourra changer une image du site pendant un quart d'heure. C'est tout."
a3.ada.answer: "Réponds dans la messagerie, ou avec `answer` et la lettre."
a3.ada.answer.standard: "Réponds à ma question."
a3.ada.lesson: "Oui. On ne peut pas promettre qu'un jeton ne fuira jamais. On peut décider à l'avance de ce qu'il vaudra ce jour-là. C'est tout le principe du moindre privilège."
a3.ada.done: "Deux rôles à resserrer, un modèle à suivre. Le rapport avance. Demain jeudi, dernier jour : les applications que les employés ont autorisées."
