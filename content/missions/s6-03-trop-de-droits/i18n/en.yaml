a3.briefing: "Wednesday. Yesterday's token is revoked. The question you asked yourself while reading the secrets bucket is still open: why was the robot that publishes images allowed to read them? The answer is not in the token, it is in the role it carries. Today you force nothing: Alto gave you an audit token, read-only, to read the roles of its account."
a3.file.role: "# Role ci-deployer: fix proposed to Alto.\n# Replace each value with the right one, then type: verify\nrole: ci-deployer\nused_by: relay-ci\nactions: everything        # storage:put | storage:get | everything\nresources: everything      # alto-site | alto-backups | alto-secrets | everything\ntoken_lifetime: never      # 15m | 30d | never\ntoken_storage: variable    # secret | variable\n"
a3.obj.roles: "List the account's roles with the audit token"
a3.obj.policy: "Read what the `ci-deployer` role allows"
a3.obj.role: "Find the other role that reads more than its job, and submit its name"
a3.obj.fix: "Rewrite `ci-deployer` with just enough in `dossier/ci-deployer.yml`"
a3.obj.lesson: "Say what decided how far the damage went"
a3.check.actions: "The role only writes files"
a3.check.resources: "It only reaches the website's bucket"
a3.check.lifetime: "Its token expires within minutes"
a3.check.storage: "Its token is stored among the secrets"
a3.check.kept: "The role keeps its name and stays the pipeline's"
a3.q.lesson: "Tuesday's token leaked, and it opened the secrets bucket. What decided how far the damage went?"
a3.q.lesson.shape: "The shape of the token: too short, so too easy to guess"
a3.q.lesson.shape.why: "Nobody guessed it: it was written in clear in a log. A token twice as long would have leaked in exactly the same way."
a3.q.lesson.role: "The role behind the token: it allowed everything, on everything"
a3.q.lesson.log: "The public log: without it, this wide role caused no problem at all"
a3.q.lesson.log.why: "A token always leaks in the end: a log, a lost laptop, a copy and paste. On that day, the role decides what the stranger can do."
a3.ada.brief: "Your audit token is in the mandate: `cat mandate/AL-2028-003.txt`. It only allows reading identities. The service is at `https://iam.alto.test/`."
a3.ada.g.token: "The identity service wants a token. Yours is in the mandate: `cat mandate/AL-2028-003.txt`, then send it in an `Authorization: Bearer` header."
a3.ada.g.token.standard: "Without a token, the identity service does not answer. Yours is in the mandate."
a3.ada.g.roles: "List the account's roles: `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles`."
a3.ada.g.roles.standard: "With the audit token from the mandate, ask the identity service for the list of roles (`/roles`)."
a3.ada.g.policy: "Read the pipeline's role: `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles/ci-deployer`."
a3.ada.g.policy.standard: "Read the detail of the role yesterday's token carried: `/roles/<name>`."
a3.ada.g.role: "Read the other roles the same way, for instance `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles/support-bot`. Compare what each one does (`used_by`) with what it may reach (`resources`)."
a3.ada.g.role.standard: "Read the three other roles. For each, compare its job with what it may reach."
a3.ada.g.submit: "Send the name of that role: `submit support-bot`."
a3.ada.g.submit.standard: "Send the name of the role with `submit`."
a3.ada.g.fix: "Write the fix: `edit dossier/ci-deployer.yml`. The pipeline writes files (`storage:put`) into the website's bucket (`alto-site`), with a short token (`15m`) stored as a `secret`. Save, then `verify`."
a3.ada.g.fix.standard: "Fix `dossier/ci-deployer.yml`: the role must only allow the pipeline's job. Then `verify`."
a3.ada.roles: "Four roles, one line each. A role is a list of sentences: \"allow these actions on these resources\". Start with yesterday's."
a3.ada.policy: "A single sentence: every action, on every resource. And the note tells how it came to this: the role was right, a deployment failed, it was widened \"for now\". That was in January 2026."
a3.ada.frontend: "This one is well made: read, and only in the website's bucket. That is what a role should look like."
a3.ada.auditor: "Yours. Read identities, nothing else, and it expires on Friday. Alto can write a tight role when it thinks about it."
a3.ada.bot: "Look closely at `resources`: `alto-*`. The star meant \"Alto's buckets\". It also says `alto-backups` and `alto-secrets`. The support chatbot, which talks to strangers all day, is allowed to read the backups."
a3.ada.role: "Yes. And an agent that talks to strangers can be talked into things. This one would not even have to cheat, reading the secrets is within its rights. It needs `alto-site` and the customer's albums, nothing more. I am noting it for the report. Now fix the pipeline's role."
a3.ada.almost: "Not yet. `verify` tells you what is missing: the role must be able to publish the website, and nothing else."
a3.ada.fix: "Here is a role that fits in one sentence and reads without worry: write, into the website's bucket, with a fifteen-minute token. If that token leaks tomorrow, the stranger can change an image of the website for a quarter of an hour. That is all."
a3.ada.answer: "Answer in the messaging window, or with `answer` and the letter."
a3.ada.answer.standard: "Answer my question."
a3.ada.lesson: "Yes. Nobody can promise that a token will never leak. You can decide in advance what it will be worth on that day. That is the whole idea of least privilege."
a3.ada.done: "Two roles to tighten, one model to follow. The report is moving. Tomorrow, Thursday, last day: the applications employees have authorised."
