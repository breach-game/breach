a3.hint.roles.2: "Type `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles`."
a3.hint.policy.1: "Type `curl -H \"Authorization: Bearer nmb_audit_91d0\" https://iam.alto.test/roles/ci-deployer`."
a3.hint.role.1: "Read each role with `/roles/<name>`. Two are right. The third has a star in its resources."
a3.hint.role.2: "`alto-*` means every bucket whose name starts with `alto-`. How many are there, and which does support need to read?"
a3.hint.role.3: "Type `submit support-bot`."
a3.hint.fix.1: "Type `edit dossier/ci-deployer.yml`. The possible values are in a comment at the end of each line."
a3.hint.fix.2: "The pipeline publishes the website: it writes, into a single bucket. And its token should live for the time of one deployment."
a3.hint.fix.3: "`actions: storage:put`, `resources: alto-site`, `token_lifetime: 15m`, `token_storage: secret`. Then `verify`."
a3.debrief.title: "\"For now\""
a3.debrief.lesson: "The pipeline's role was right, then a deployment failed one evening, and someone replaced the list with a star, promising to come back to it. Two years later, that star turned a leaked token into access to every secret. A right that is too wide makes no noise as long as all goes well."
a3.debrief.p1: "Least privilege: each role allows only the actions of its job, on the resources of its job. A star is a question nobody wanted to ask."
a3.debrief.p2: "Rights widened in an emergency get an end date, written the same day, and someone who answers for them."
a3.debrief.p3: "Robot identities get short tokens, issued on demand. A token that never expires is a password someone forgot to change."
a3.debrief.p4: "Reviewing roles is done with read-only access, like yours this week. An audit does not need to be able to change what it looks at."
